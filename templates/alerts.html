<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>告警中心 - Server Status</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2">
    <link rel="alternate icon" href="/favicon.ico?v=2" sizes="16x16 32x32 48x48">
    <link rel="stylesheet" href="/ui.css">
    <style>
        html, body, #root { margin: 0; min-height: 100%; background: #f5f5f5; }
        html.dark, html.dark body, html.dark #root { background: #141414; }
        html.dark body { color: rgba(255, 255, 255, .85); }
        #root { min-height: 100vh; }
        .page-wrap { padding: 16px; max-width: 1600px; margin: 0 auto; }

        .topbar {
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 24px; height: 52px; background: #fff;
            border-bottom: 1px solid var(--color-border);
        }
        .topbar.dark { background: #1f1f1f; }
        .topbar .tb-page {
            display: inline-flex; align-items: center; gap: 6px;
            font-size: 14px; font-weight: 600; color: rgba(0, 0, 0, .88); white-space: nowrap;
        }
        .topbar.dark .tb-page { color: rgba(255, 255, 255, .88); }
        .topbar .tb-page .anticon { color: #1677ff; }

        .page-head {
            display: flex; align-items: flex-start; justify-content: space-between;
            gap: 12px; flex-wrap: wrap; margin-bottom: 12px;
        }
        .ph-title {
            display: flex; align-items: center; gap: 10px;
            font-size: 20px; font-weight: 600; color: rgba(0, 0, 0, .88); line-height: 1.3;
        }
        html.dark .ph-title { color: rgba(255, 255, 255, .88); }
        .ph-title .anticon { color: #1677ff; }
        .ph-desc { font-size: 13px; color: rgba(0, 0, 0, .45); margin-top: 2px; }
        html.dark .ph-desc { color: rgba(255, 255, 255, .45); }

        .mini-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px; margin-bottom: 12px;
        }
        .mini-stat {
            background: #fff; border: 1px solid var(--color-border); border-radius: 8px;
            padding: 10px 16px; height: 78px; display: flex; flex-direction: column;
            justify-content: center; gap: 2px; overflow: hidden;
        }
        html.dark .mini-stat { background: #1f1f1f; }
        .mini-stat .ms-label {
            font-size: 12px; color: rgba(0, 0, 0, .45);
            display: flex; align-items: center; gap: 6px;
        }
        html.dark .mini-stat .ms-label { color: rgba(255, 255, 255, .45); }
        .mini-stat .ms-value {
            font-size: 24px; font-weight: 600; line-height: 1.15;
            color: rgba(0, 0, 0, .88); font-variant-numeric: tabular-nums;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        html.dark .mini-stat .ms-value { color: rgba(255, 255, 255, .88); }
        .mini-stat .ms-suffix {
            font-size: 13px; font-weight: 500; color: rgba(0, 0, 0, .45); margin-left: 2px;
        }
        html.dark .mini-stat .ms-suffix { color: rgba(255, 255, 255, .45); }

        .panel { background: #fff; border: 1px solid var(--color-border); border-radius: 8px; padding: 12px 16px; }
        html.dark .panel { background: #1f1f1f; }
        .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }

        /* 弹窗表单：两列栅格，避免 Form.Item 在 Space 里宽度失控、右侧被裁 */
        .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 16px; }
        .form-grid .ant-form-item { margin-bottom: 0; min-width: 0; }
        .form-grid .span-2 { grid-column: 1 / -1; }
        @media (max-width: 640px) {
            .form-grid { grid-template-columns: minmax(0, 1fr); }
            .form-grid .span-2 { grid-column: auto; }
        }

        .rule-name { font-weight: 600; }
        .muted-text { color: rgba(0, 0, 0, .45); font-size: 12px; }
        html.dark .muted-text { color: rgba(255, 255, 255, .45); }

        @media (max-width: 768px) {
            .topbar { padding: 6px 10px; height: auto; min-height: 52px; }
            .topbar .tb-text { display: none; }
            .page-wrap { padding: 10px; }
            .mini-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
    <script>
        (function () {
            try { document.documentElement.classList.toggle('dark', localStorage.getItem('theme') === 'dark'); } catch (e) { }
        })();
    </script>
    <script src="/react.min.js"></script>
    <script src="/react-dom.min.js"></script>
    <script src="/dayjs.min.js"></script>
    <script src="/antd.min.js"></script>
    <script src="/ant-design-icons.min.js"></script>
    <script src="/babel.min.js"></script>
</head>

<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useCallback, useMemo } = React;
        const { ConfigProvider, theme, Card, Table, Button, Switch, Space, Tag, Tooltip, Modal, Form,
            Input, InputNumber, Select, Checkbox, Tabs, Typography, Alert, Segmented, Popconfirm, Badge, Empty, message } = window.antd;
        const IconSet = window.icons || {};
        const UIIcon = ({ name, ...props }) => { const C = IconSet[name]; return C ? <C {...props} /> : null; };

        const baseUrl = window.location.origin;
        const getCookie = name => {
            for (const part of document.cookie.split(';')) {
                const eq = part.indexOf('=');
                if (eq < 0) continue;
                if (part.slice(0, eq).trim() === name) return decodeURIComponent(part.slice(eq + 1));
            }
            return '';
        };

        const api = (path, options = {}) => {
            const method = (options.method || 'GET').toUpperCase();
            const headers = { 'Accept': 'application/json', ...(options.headers || {}) };
            if (options.body) headers['Content-Type'] = 'application/json';
            if (method !== 'GET') headers['X-CSRF-Token'] = getCookie('csrf_token');
            return fetch(baseUrl + path, { credentials: 'include', ...options, method, headers })
                .then(r => r.json().then(d => ({ status: r.status, body: d })));
        };

        const METRICS = [
            { value: 'disk_percent', label: '磁盘使用率 (%)' },
            { value: 'mem_percent', label: '内存使用率 (%)' },
            { value: 'cpu_percent', label: 'CPU 使用率 (%)' },
            { value: 'cert_days', label: 'SSL 证书剩余天数' },
            { value: 'service_down', label: '关键服务掉线数' },
        ];
        const metricLabel = v => (METRICS.find(m => m.value === v) || {}).label || v;
        const metricUnit = v => (v === 'cert_days' ? '天' : v === 'service_down' ? '个' : '%');
        const sevTag = s => ({
            critical: <Tag color="red">严重</Tag>,
            warning: <Tag color="orange">警告</Tag>,
            info: <Tag color="blue">提示</Tag>,
        }[s] || <Tag>{s}</Tag>);
        const fmtTime = s => {
            if (!s) return '-';
            const d = new Date(s);
            if (isNaN(d.getTime())) return s;
            const p = n => String(n).padStart(2, '0');
            return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
        };
        const fmtDur = s => {
            if (!s) return '立即';
            if (s < 60) return s + ' 秒';
            if (s < 3600) return Math.round(s / 60) + ' 分钟';
            return Math.round(s / 3600) + ' 小时';
        };

        function AlertPage() {
            const [isDark, setIsDark] = useState(() => document.documentElement.classList.contains('dark'));
            const [overview, setOverview] = useState({});
            const [rules, setRules] = useState([]);
            const [events, setEvents] = useState([]);
            const [loading, setLoading] = useState(true);
            const [tab, setTab] = useState('rules');
            const [eventFilter, setEventFilter] = useState('');
            const [ruleModal, setRuleModal] = useState({ open: false, editing: null });
            const [cfgModal, setCfgModal] = useState(false);
            const [cfg, setCfg] = useState(null);
            const [saving, setSaving] = useState(false);
            const [form] = Form.useForm();
            const [cfgForm] = Form.useForm();

            const loadOverview = useCallback(() => {
                return api('/api/alerts/overview').then(r => {
                    if (r.body && r.body.code === 200) setOverview(r.body.data || {});
                }).catch(() => { });
            }, []);

            const loadRules = useCallback(() => {
                return api('/api/alerts/rules').then(r => {
                    if (r.body && r.body.code === 200) setRules((r.body.data && r.body.data.rules) || []);
                }).catch(() => { });
            }, []);

            const loadEvents = useCallback((status = eventFilter) => {
                const q = status ? ('?status=' + encodeURIComponent(status)) : '';
                return api('/api/alerts/events' + q).then(r => {
                    if (r.body && r.body.code === 200) setEvents((r.body.data && r.body.data.events) || []);
                }).catch(() => { });
            }, [eventFilter]);

            const refresh = useCallback(() => {
                setLoading(true);
                Promise.all([loadOverview(), loadRules(), loadEvents()]).finally(() => setLoading(false));
            }, [loadOverview, loadRules, loadEvents]);

            useEffect(() => { refresh(); }, [refresh]);
            useEffect(() => {
                const t = setInterval(() => { loadOverview(); }, 30000);
                return () => clearInterval(t);
            }, [loadOverview]);

            const toggleEnable = async (rec, checked) => {
                const payload = { ...rec, enabled: checked };
                const r = await api('/api/alerts/rules', { method: 'POST', body: JSON.stringify(payload) });
                if (r.body.code === 200) { loadRules(); loadOverview(); }
                else message.error(r.body.message || '保存失败');
            };

            const openCreate = () => {
                setRuleModal({ open: true, editing: null });
                setTimeout(() => form.setFieldsValue({
                    name: '', metric: 'disk_percent', op: 'gt', threshold: 85, duration_sec: 300,
                    severity: 'warning', channels: ['email'], enabled: true, cooldown_sec: 1800,
                    mute_start: '', mute_end: '', target: ''
                }), 0);
            };

            const openEdit = rec => {
                setRuleModal({ open: true, editing: rec });
                setTimeout(() => form.setFieldsValue({ ...rec }), 0);
            };

            const submitRule = async () => {
                const v = await form.validateFields();
                setSaving(true);
                const payload = { ...(ruleModal.editing || {}), ...v };
                const r = await api('/api/alerts/rules', { method: 'POST', body: JSON.stringify(payload) });
                setSaving(false);
                if (r.body.code === 200) {
                    message.success('规则已保存');
                    setRuleModal({ open: false, editing: null });
                    loadRules(); loadOverview();
                } else {
                    message.error(r.body.message || '保存失败');
                }
            };

            const removeRule = async id => {
                const r = await api('/api/alerts/rules/' + encodeURIComponent(id), { method: 'DELETE' });
                if (r.body.code === 200) { message.success('已删除'); loadRules(); loadOverview(); }
                else message.error(r.body.message || '删除失败');
            };

            const openCfg = async () => {
                const r = await api('/api/alerts/config');
                if (r.body.code === 200) {
                    const d = r.body.data || {};
                    setCfg(d);
                    setCfgModal(true);
                    setTimeout(() => cfgForm.setFieldsValue({
                        enabled: !!d.enabled,
                        interval_sec: d.interval_sec || 30,
                        mute_start: d.mute_start || '',
                        mute_end: d.mute_end || '',
                        webhook_url: d.webhook_url || '',
                        email_host: (d.email && d.email.host) || '',
                        email_port: (d.email && d.email.port) || 465,
                        email_username: (d.email && d.email.username) || '',
                        email_password: (d.email && d.email.password) || '',
                        email_from: (d.email && d.email.from) || '',
                        email_to: ((d.email && d.email.to) || []).join(', '),
                    }), 0);
                }
            };

            const saveCfg = async () => {
                const v = await cfgForm.validateFields();
                setSaving(true);
                const payload = {
                    enabled: !!v.enabled,
                    interval_sec: v.interval_sec || 30,
                    mute_start: v.mute_start || '',
                    mute_end: v.mute_end || '',
                    webhook_url: v.webhook_url || '',
                    email: {
                        host: v.email_host || '', port: v.email_port || 465,
                        username: v.email_username || '', password: v.email_password || '',
                        from: v.email_from || '', to: (v.email_to || '').split(',').map(s => s.trim()).filter(Boolean),
                    },
                };
                const r = await api('/api/alerts/config', { method: 'POST', body: JSON.stringify(payload) });
                setSaving(false);
                if (r.body.code === 200) { message.success('设置已保存'); setCfgModal(false); refresh(); }
                else message.error(r.body.message || '保存失败');
            };

            const sendTest = async () => {
                const hide = message.loading('正在发送测试通知…', 0);
                const r = await api('/api/alerts/test', { method: 'POST', body: JSON.stringify({}) });
                hide();
                if (r.body.code === 200) {
                    const res = (r.body.data && r.body.data.results) || {};
                    const lines = Object.entries(res).map(([k, v]) => `${k === 'email' ? '邮件' : 'Webhook'}：${v === 'ok' ? '成功' : v}`);
                    Modal.info({ title: '测试结果', content: <div>{lines.map((l, i) => <div key={i}>{l}</div>)}</div> });
                } else message.error(r.body.message || '测试失败');
            };

            const ruleCols = [
                {
                    title: '规则', dataIndex: 'name', render: (v, r) => (
                        <div>
                            <div className="rule-name">{v} {sevTag(r.severity)}</div>
                            <div className="muted-text">{metricLabel(r.metric)} {r.op === 'gt' ? '>' : '<'} {r.threshold}{metricUnit(r.metric)}{r.target ? ' · ' + r.target : ''}</div>
                        </div>
                    )
                },
                { title: '持续', dataIndex: 'duration_sec', width: 90, render: v => fmtDur(v) },
                {
                    title: '渠道', dataIndex: 'channels', width: 140, render: v => (v || []).map(c =>
                        <Tag key={c} color={c === 'email' ? 'blue' : 'purple'}>{c === 'email' ? '邮件' : 'Webhook'}</Tag>)
                },
                { title: '最近触发', dataIndex: 'last_fired_at', width: 170, render: v => <span className="muted-text">{fmtTime(v)}</span> },
                {
                    title: '启用', dataIndex: 'enabled', width: 80,
                    render: (v, r) => <Switch size="small" checked={!!v} onChange={c => toggleEnable(r, c)} />
                },
                {
                    title: '操作', width: 130, render: (_, r) => (
                        <Space size={4}>
                            <Button size="small" type="text" icon={<UIIcon name="EditOutlined" />} onClick={() => openEdit(r)}>编辑</Button>
                            <Popconfirm title="删除这条规则？" okText="删除" cancelText="取消" okButtonProps={{ danger: true }}
                                onConfirm={() => removeRule(r.id)}>
                                <Button size="small" type="text" danger icon={<UIIcon name="DeleteOutlined" />} />
                            </Popconfirm>
                        </Space>
                    )
                },
            ];

            const eventCols = [
                { title: '时间', dataIndex: 'created_at', width: 170, render: v => fmtTime(v) },
                { title: '规则', dataIndex: 'rule_name', width: 180 },
                {
                    title: '状态', dataIndex: 'status', width: 90,
                    render: v => v === 'resolved' ? <Tag color="green">已恢复</Tag> : <Tag color="red">触发中</Tag>
                },
                {
                    title: '数值', width: 120, render: (_, r) => (
                        <span>{r.value}{metricUnit(r.metric)} <span className="muted-text">/ {r.threshold}{metricUnit(r.metric)}</span></span>
                    )
                },
                { title: '消息', dataIndex: 'message', render: v => <span style={{ fontSize: 13 }}>{v}</span> },
                {
                    title: '通知', width: 150, render: (_, r) => {
                        if (r.muted) return <Tag color="default">静默未发</Tag>;
                        if (r.notified) return <Tag color="green">已发送</Tag>;
                        return <Tooltip title={r.notify_error || '未发送'}><Tag color="red">失败</Tag></Tooltip>;
                    }
                },
            ];

            const dark = isDark;

            return (
                <ConfigProvider theme={{ algorithm: dark ? theme.darkAlgorithm : undefined, token: { colorBgLayout: dark ? '#141414' : '#f5f5f5' } }}>
                    <div style={{ minHeight: '100vh', background: dark ? '#141414' : '#f5f5f5' }}>
                        <div className={'topbar' + (dark ? ' dark' : '')}>
                            <span className="tb-page"><UIIcon name="BellOutlined" />告警中心</span>
                            <Space>
                                <Button icon={<UIIcon name="HomeOutlined" />} onClick={() => window.location.href = 'index.html'}>
                                    <span className="tb-text">首页</span>
                                </Button>
                                <Button icon={<UIIcon name="ReloadOutlined" />} onClick={refresh}>
                                    <span className="tb-text">刷新</span>
                                </Button>
                                <Tooltip title={dark ? '浅色模式' : '深色模式'}>
                                    <Button onClick={() => {
                                        const next = !dark;
                                        setIsDark(next);
                                        document.documentElement.classList.toggle('dark', next);
                                        localStorage.setItem('theme', next ? 'dark' : 'light');
                                    }} icon={<UIIcon name={dark ? 'SunOutlined' : 'MoonOutlined'} />} />
                                </Tooltip>
                            </Space>
                        </div>

                        <div className="page-wrap">
                            <div className="page-head">
                                <div>
                                    <div className="ph-title"><UIIcon name="AlertOutlined" />告警中心</div>
                                    <div className="ph-desc">
                                        每 {overview.interval_sec || 30} 秒采样一次，条件持续满足才触发；
                                        静默窗口 {overview.mute_start && overview.mute_end ? `${overview.mute_start} ~ ${overview.mute_end}` : '未设置'}，其间只记录不发送。
                                    </div>
                                </div>
                                <Space wrap>
                                    <Space size={6}>
                                        <span className="muted-text">总开关</span>
                                        <Switch checked={!!overview.enabled}
                                            onChange={async c => {
                                                // 先取完整配置再合并，避免把邮件 / Webhook 配置覆盖成空
                                                const cr = await api('/api/alerts/config');
                                                const base = (cr.body && cr.body.code === 200) ? (cr.body.data || {}) : {};
                                                const r = await api('/api/alerts/config', {
                                                    method: 'POST',
                                                    body: JSON.stringify({ ...base, enabled: c })
                                                });
                                                if (r.body.code === 200) { message.success(c ? '告警已启用' : '告警已暂停'); loadOverview(); }
                                                else message.error(r.body.message || '操作失败');
                                            }} />
                                    </Space>
                                    <Button icon={<UIIcon name="SettingOutlined" />} onClick={openCfg}>设置</Button>
                                    <Button icon={<UIIcon name="SendOutlined" />} onClick={sendTest}>测试通知</Button>
                                    <Button type="primary" icon={<UIIcon name="PlusOutlined" />} onClick={openCreate}>新建规则</Button>
                                </Space>
                            </div>

                            {!overview.enabled && (
                                <Alert type="warning" showIcon style={{ marginBottom: 12 }}
                                    message="告警中心当前处于暂停状态"
                                    description="规则不会采样也不会通知。点击右上角「总开关」开启。" />
                            )}
                            {overview.enabled && !overview.email_configured && !overview.webhook_configured && (
                                <Alert type="error" showIcon style={{ marginBottom: 12 }}
                                    message="还没有可用的通知渠道"
                                    description="规则即使触发也无法送达。请到「设置」里配置 SMTP 邮件或 Webhook。" />
                            )}

                            <div className="mini-grid">
                                <div className="mini-stat">
                                    <div className="ms-label"><UIIcon name="ProfileOutlined" />规则</div>
                                    <div className="ms-value">{overview.rules_enabled || 0}<span className="ms-suffix">/ {overview.rules_total || 0} 启用</span></div>
                                </div>
                                <div className="mini-stat">
                                    <div className="ms-label"><UIIcon name="FireOutlined" />触发中</div>
                                    <div className="ms-value" style={{ color: (overview.firing_count || 0) > 0 ? '#cf1322' : undefined }}>{overview.firing_count || 0}</div>
                                </div>
                                <div className="mini-stat">
                                    <div className="ms-label"><UIIcon name="HistoryOutlined" />今日事件</div>
                                    <div className="ms-value">{overview.events_today || 0}</div>
                                </div>
                                <div className="mini-stat">
                                    <div className="ms-label"><UIIcon name="MailOutlined" />通知渠道</div>
                                    <div className="ms-value" style={{ fontSize: 18 }}>
                                        {overview.email_configured ? '邮件 ✓' : '邮件 ✗'}
                                        <span className="ms-suffix" style={{ marginLeft: 8 }}>{overview.webhook_configured ? 'Webhook ✓' : 'Webhook ✗'}</span>
                                    </div>
                                </div>
                            </div>

                            <div className="panel">
                                <Tabs activeKey={tab} onChange={setTab} items={[
                                    {
                                        key: 'rules', label: `规则（${rules.length}）`,
                                        children: (
                                            <Table rowKey="id" size="small" loading={loading} columns={ruleCols}
                                                dataSource={rules} pagination={false} scroll={{ x: 'max-content' }}
                                                locale={{ emptyText: <Empty description="还没有规则，点右上角「新建规则」" /> }} />
                                        )
                                    },
                                    {
                                        key: 'events', label: `事件（${events.length}）`,
                                        children: (
                                            <div>
                                                <div className="panel-head">
                                                    <Segmented size="small" value={eventFilter}
                                                        onChange={v => { setEventFilter(v); loadEvents(v); }}
                                                        options={[{ label: '全部', value: '' }, { label: '触发中', value: 'firing' }, { label: '已恢复', value: 'resolved' }]} />
                                                    <span className="muted-text">最多展示最近 100 条</span>
                                                </div>
                                                <Table rowKey="id" size="small" loading={loading} columns={eventCols}
                                                    dataSource={events} pagination={false} scroll={{ x: 'max-content' }}
                                                    locale={{ emptyText: <Empty description="暂无事件" /> }} />
                                            </div>
                                        )
                                    },
                                ]} />
                            </div>
                        </div>

                        <Modal open={ruleModal.open} title={ruleModal.editing ? '编辑规则' : '新建规则'}
                            onCancel={() => setRuleModal({ open: false, editing: null })}
                            onOk={submitRule} confirmLoading={saving} okText="保存" cancelText="取消" width={680}>
                            <Form form={form} layout="vertical" size="middle">
                                <div className="form-grid">
                                    <Form.Item name="name" label="规则名称" className="span-2" rules={[{ required: true, message: '给规则起个名字' }]}>
                                        <Input placeholder="例如：磁盘空间不足" />
                                    </Form.Item>
                                    <Form.Item name="metric" label="监控指标">
                                        <Select options={METRICS} />
                                    </Form.Item>
                                    <Form.Item name="op" label="比较方式">
                                        <Select options={[{ value: 'gt', label: '高于' }, { value: 'lt', label: '低于' }]} />
                                    </Form.Item>
                                    <Form.Item name="threshold" label="阈值">
                                        <InputNumber style={{ width: '100%' }} />
                                    </Form.Item>
                                    <Form.Item name="severity" label="严重程度">
                                        <Select options={[{ value: 'critical', label: '严重' }, { value: 'warning', label: '警告' }, { value: 'info', label: '提示' }]} />
                                    </Form.Item>
                                    <Form.Item name="duration_sec" label="持续多久才触发（秒）">
                                        <InputNumber min={0} max={86400} style={{ width: '100%' }} />
                                    </Form.Item>
                                    <Form.Item name="cooldown_sec" label="通知冷却（秒）">
                                        <InputNumber min={0} max={604800} style={{ width: '100%' }} />
                                    </Form.Item>
                                    <Form.Item name="target" label="目标服务（仅“关键服务掉线”生效）" className="span-2">
                                        <Input placeholder="留空 = 全部被监控服务" allowClear />
                                    </Form.Item>
                                    <Form.Item name="channels" label="通知渠道" className="span-2">
                                        <Checkbox.Group options={[{ label: '邮件', value: 'email' }, { label: 'Webhook', value: 'webhook' }]} />
                                    </Form.Item>
                                    <Form.Item name="mute_start" label="静默开始（留空跟随全局）">
                                        <Input placeholder="23:00" allowClear />
                                    </Form.Item>
                                    <Form.Item name="mute_end" label="静默结束">
                                        <Input placeholder="08:00" allowClear />
                                    </Form.Item>
                                    <Form.Item name="enabled" label="启用" valuePropName="checked">
                                        <Switch />
                                    </Form.Item>
                                </div>
                            </Form>
                        </Modal>

                        <Modal open={cfgModal} title="告警中心设置" width={720} confirmLoading={saving}
                            onCancel={() => setCfgModal(false)} onOk={saveCfg} okText="保存" cancelText="取消">
                            <Form form={cfgForm} layout="vertical" size="middle">
                                <div className="form-grid">
                                    <Form.Item name="enabled" label="启用告警" valuePropName="checked">
                                        <Switch />
                                    </Form.Item>
                                    <Form.Item name="interval_sec" label="采样间隔（秒）">
                                        <InputNumber min={10} max={3600} style={{ width: '100%' }} />
                                    </Form.Item>
                                    <Form.Item name="mute_start" label="静默开始">
                                        <Input placeholder="23:00" allowClear />
                                    </Form.Item>
                                    <Form.Item name="mute_end" label="静默结束">
                                        <Input placeholder="08:00" allowClear />
                                    </Form.Item>

                                    <div className="span-2" style={{ paddingTop: 2 }}>
                                        <Typography.Text strong>邮件（SMTP）</Typography.Text>
                                    </div>
                                    <Form.Item name="email_host" label="服务器">
                                        <Input placeholder="smtp.qq.com" />
                                    </Form.Item>
                                    <Form.Item name="email_port" label="端口">
                                        <InputNumber min={1} max={65535} style={{ width: '100%' }} />
                                    </Form.Item>
                                    <Form.Item name="email_username" label="账号">
                                        <Input placeholder="you@qq.com" />
                                    </Form.Item>
                                    <Form.Item name="email_password" label="密码/授权码">
                                        <Input.Password placeholder="留空则保持不变" />
                                    </Form.Item>
                                    <Form.Item name="email_from" label="发件人">
                                        <Input placeholder="留空取账号" />
                                    </Form.Item>
                                    <Form.Item name="email_to" label="收件人（逗号分隔）">
                                        <Input placeholder="a@x.com, b@y.com" />
                                    </Form.Item>

                                    <div className="span-2" style={{ paddingTop: 2 }}>
                                        <Typography.Text strong>Webhook</Typography.Text>
                                    </div>
                                    <Form.Item name="webhook_url" label="URL（企业微信机器人地址会自动适配格式）" className="span-2">
                                        <Input placeholder="https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=..." allowClear />
                                    </Form.Item>
                                    <Alert className="span-2" type="info" showIcon
                                        message="邮件配置留空时会自动沿用「容器守护 docker_guard」里的 SMTP 设置。" />
                                </div>
                            </Form>
                        </Modal>
                    </div>
                </ConfigProvider>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<AlertPage />);
    </script>
</body>

</html>
