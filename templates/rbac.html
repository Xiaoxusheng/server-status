<body>
    <div id="root"></div>
    <script type="text/babel">
        const { Card, Button, Input, Select, Tag, Space, message, Modal, Drawer, Form, Switch, Tabs, Popconfirm,
            ConfigProvider, theme, Typography, Badge, Avatar, Alert, Tooltip, Dropdown, Checkbox, Segmented,
            Descriptions, Empty, Table, Divider, Spin } = window.antd;
        const { useState, useEffect, useCallback, useMemo } = React;
        const { darkAlgorithm } = theme;
        const IconSet = window.icons || {};

        const baseUrl = window.location.origin;
        const AVATAR_COLORS = ['#1677ff', '#722ed1', '#13c2c2', '#eb2f96', '#fa8c16', '#52c41a', '#f5222d'];
        const HIGH_RISK = ['system:exec', 'files:manage', 'user:manage', 'role:manage', 'ip:manage', 'token:issue'];

        const UIIcon = ({ name, ...props }) => {
            const C = IconSet[name];
            return C ? <C {...props} /> : null;
        };

        function useIsMobile() {
            const [m, setM] = useState(() => typeof window !== 'undefined' && window.matchMedia('(max-width: 768px)').matches);
            useEffect(() => {
                const q = window.matchMedia('(max-width: 768px)');
                const h = e => setM(e.matches);
                q.addListener(h);
                return () => q.removeListener(h);
            }, []);
            return m;
        }

        // 读取非 HttpOnly 的 csrf_token Cookie；写请求自动携带，会话 Cookie 由 credentials: include 携带
        function getCsrfToken() { const m = document.cookie.match(/(?:^|; )csrf_token=([^;]*)/); return m ? decodeURIComponent(m[1]) : ''; }
        function secureFetch(url, options = {}) {
            const method = options.method || 'GET';
            const headers = { 'Content-Type': 'application/json', ...(options.headers || {}) };
            if (/^(POST|PUT|PATCH|DELETE)$/i.test(method)) { const tok = getCsrfToken(); if (tok) headers['X-CSRF-Token'] = tok; }
            return fetch(url, { method, headers, credentials: 'include', body: options.body });
        }
        async function api(path, method, body) {
            const r = await secureFetch(baseUrl + path, { method: method || 'GET', body: body ? JSON.stringify(body) : undefined });
            const d = await r.json();
            if (!r.ok || d.code !== 200) throw new Error(d.message || ('请求失败 (' + r.status + ')'));
            return d.data;
        }

        const fmtTime = (s) => s ? new Date(s).toLocaleString('zh-CN', { hour12: false }) : '-';
        const fmtDate = (s) => s ? new Date(s).toLocaleString('zh-CN', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false }) : '-';

        const statusBadge = (active) => active
            ? <Badge status="success" text="正常" />
            : <Badge status="error" text="禁用" />;

        function App() {
            const [auth, setAuth] = useState({ loading: true, ok: false, user: null });
            const [isDark, setIsDark] = useState(() => localStorage.getItem('theme') === 'dark');
            const [tab, setTab] = useState('users');
            const [users, setUsers] = useState([]);
            const [roles, setRoles] = useState([]);
            const [perms, setPerms] = useState([]);
            const [online, setOnline] = useState(0);
            const [loading, setLoading] = useState(false);
            const [search, setSearch] = useState('');
            const [roleFilter, setRoleFilter] = useState(undefined);
            const [statusFilter, setStatusFilter] = useState(undefined);
            const [userView, setUserView] = useState(() => localStorage.getItem('rbac_user_view') || 'list');
            const [matrixRoles, setMatrixRoles] = useState([]);
            const isMobile = useIsMobile();

            // Drawer 状态
            const [userDetail, setUserDetail] = useState(null);
            const [userEdit, setUserEdit] = useState(null); // {mode:'create'|'edit', record}
            const [roleDetail, setRoleDetail] = useState(null);
            const [roleEdit, setRoleEdit] = useState(null); // {mode:'create'|'edit', record}
            const [auditUser, setAuditUser] = useState(null);
            const [auditRecords, setAuditRecords] = useState([]);
            const [auditLoading, setAuditLoading] = useState(false);
            const [pwdModal, setPwdModal] = useState(null); // 用户名
            const [pwdForm] = Form.useForm();
            const [uForm] = Form.useForm();
            const [rForm] = Form.useForm();
            const userEditRoleId = Form.useWatch('role_id', uForm);
            const roleEditPerms = Form.useWatch('permissions', rForm);
            const [showAllPerms, setShowAllPerms] = useState(false);

            const hasPerm = p => auth.user && (auth.user.permissions || []).some(x => x === '*' || x === p);
            const canViewUser = hasPerm('user:view') || hasPerm('user:manage');
            const canManageUser = hasPerm('user:manage');
            const canManageRole = hasPerm('role:manage');

            useEffect(() => {
                secureFetch(baseUrl + '/check-auth')
                    .then(r => r.json())
                    .then(d => {
                        if (d.code === 200) setAuth({ loading: false, ok: true, user: d.user });
                        else window.location.href = 'index.html';
                    })
                    .catch(() => { window.location.href = 'index.html'; });
            }, []);
            useEffect(() => {
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
                document.documentElement.classList.toggle('dark', isDark);
                document.body.classList.toggle('dark', isDark);
                document.body.style.background = isDark ? '#141414' : '#f5f5f5';
            }, [isDark]);
            useEffect(() => { localStorage.setItem('rbac_user_view', userView); }, [userView]);

            const loadUsers = useCallback(async () => {
                setLoading(true);
                try { setUsers(await api('/api/rbac/users')); } catch (e) { message.error('加载用户失败: ' + e.message); } finally { setLoading(false); }
            }, []);
            const loadRoles = useCallback(async () => {
                try { setRoles(await api('/api/rbac/roles')); } catch (e) { message.error('加载角色失败: ' + e.message); }
            }, []);
            const loadPerms = useCallback(async () => {
                try { setPerms(await api('/api/rbac/permissions')); } catch (e) { /* 权限不足时忽略 */ }
            }, []);
            const loadOnline = useCallback(async () => {
                try { const d = await api('/api/rbac/online-count'); setOnline(d.count || 0); } catch (e) { /* 忽略 */ }
            }, []);

            const refresh = useCallback(() => {
                if (canViewUser) loadUsers();
                if (canManageRole) { loadRoles(); loadPerms(); }
                loadOnline();
            }, [canViewUser, canManageRole, loadUsers, loadRoles, loadPerms, loadOnline]);

            useEffect(() => {
                if (!auth.ok) return;
                refresh();
                const t = setInterval(loadOnline, 30000);
                return () => clearInterval(t);
            }, [auth.ok, refresh, loadOnline]);

            const permDef = useMemo(() => {
                const m = {};
                perms.forEach(p => { m[p.key] = p; });
                return m;
            }, [perms]);
            const permGroups = useMemo(() => {
                const g = {};
                perms.forEach(p => { (g[p.group] = g[p.group] || []).push(p); });
                return g;
            }, [perms]);
            const permName = k => { const d = permDef[k]; return d ? d.name : k; };
            const isHighRisk = k => HIGH_RISK.includes(k);

            // 角色权限展开（admin * → 全部权限）
            const rolePermSet = (role) => {
                if (!role) return new Set();
                if (role.permissions && role.permissions.includes('*')) return new Set(perms.map(p => p.key));
                return new Set(role.permissions || []);
            };
            const diffPerms = (before, after) => {
                const b = before instanceof Set ? before : new Set(before || []);
                const a = after instanceof Set ? after : new Set(after || []);
                return {
                    added: [...a].filter(x => !b.has(x)),
                    removed: [...b].filter(x => !a.has(x))
                };
            };

            if (auth.loading) {
                return <div style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', background: isDark ? '#141414' : '#f5f5f5' }}>
                    <Card loading style={{ width: 320 }} />
                </div>;
            }
            if (!canViewUser && !canManageRole) {
                return <ConfigProvider theme={{ algorithm: isDark ? darkAlgorithm : undefined, token: { colorBgLayout: isDark ? '#141414' : '#f5f5f5', colorBgContainer: isDark ? '#1f1f1f' : '#ffffff' } }}>
                    <div style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', background: isDark ? '#141414' : '#f5f5f5' }}>
                        <Card style={{ width: 400, textAlign: 'center' }}>
                            <div style={{ fontSize: 40, marginBottom: 8 }}><UIIcon name="StopOutlined" /></div>
                            <Typography.Title level={4}>没有访问权限</Typography.Title>
                            <Typography.Text type="secondary">当前账号没有权限管理相关权限，请联系管理员开通。</Typography.Text>
                            <div style={{ marginTop: 16 }}>
                                <Button type="primary" onClick={() => window.location.href = 'index.html'}>返回首页</Button>
                            </div>
                        </Card>
                    </div>
                </ConfigProvider>;
            }

            const filteredUsers = users.filter(u => {
                if (roleFilter && u.role_id !== roleFilter) return false;
                if (statusFilter === 'active' && !u.is_active) return false;
                if (statusFilter === 'disabled' && u.is_active) return false;
                const q = search.trim().toLowerCase();
                if (q && !(u.username || '').toLowerCase().includes(q) && !(u.email || '').toLowerCase().includes(q)) return false;
                return true;
            });

            // ============ 用户操作 ============
            const openUserDetail = (u) => { setUserDetail(u); setShowAllPerms(false); };
            const openUserEdit = (u) => {
                setUserEdit({ mode: u ? 'edit' : 'create', record: u || null });
                uForm.resetFields();
                if (u) uForm.setFieldsValue({ username: u.username, email: u.email, role_id: u.role_id || 'user', is_active: u.is_active, password: '' });
                else uForm.setFieldsValue({ is_active: true, role_id: 'user', password: '' });
            };
            const submitUser = async () => {
                const v = await uForm.validateFields();
                try {
                    if (userEdit.mode === 'create') {
                        await api('/api/rbac/users', 'POST', { username: v.username, email: v.email, password: v.password, role_id: v.role_id });
                        message.success('用户创建成功');
                    } else {
                        const body = { email: v.email, role_id: v.role_id, is_active: v.is_active };
                        if (v.password) body.password = v.password;
                        await api('/api/rbac/users/' + encodeURIComponent(userEdit.record.username), 'PUT', body);
                        message.success('用户更新成功');
                    }
                    setUserEdit(null);
                    loadUsers();
                    loadRoles();
                } catch (e) { message.error(e.message); }
            };
            const setUserActive = async (u, active) => {
                try {
                    await api('/api/rbac/users/' + encodeURIComponent(u.username), 'PUT', { is_active: active });
                    message.success(active ? '已启用 ' + u.username : '已禁用 ' + u.username);
                    loadUsers();
                    if (userDetail && userDetail.username === u.username) setUserDetail({ ...userDetail, is_active: active });
                } catch (e) { message.error(e.message); }
            };
            const deleteUser = async (u) => {
                try {
                    await api('/api/rbac/users/' + encodeURIComponent(u.username), 'DELETE');
                    message.success('用户已删除');
                    loadUsers();
                    loadRoles();
                    if (userDetail && userDetail.username === u.username) setUserDetail(null);
                } catch (e) { message.error(e.message); }
            };
            const resetPassword = async () => {
                const v = await pwdForm.validateFields();
                Modal.confirm({
                    title: '重置密码？',
                    content: '将为用户 ' + pwdModal + ' 设置新密码，操作不可撤销。',
                    okText: '确认重置',
                    okButtonProps: { danger: true },
                    cancelText: '取消',
                    onOk: async () => {
                        try {
                            await api('/api/rbac/users/' + encodeURIComponent(pwdModal), 'PUT', { password: v.password });
                            message.success('密码已重置');
                            setPwdModal(null);
                            pwdForm.resetFields();
                        } catch (e) { message.error(e.message); }
                    }
                });
            };
            const loadAudit = async (username) => {
                setAuditUser(username);
                setAuditLoading(true);
                setAuditRecords([]);
                try {
                    const d = await api('/api/audit?user=' + encodeURIComponent(username || '') + '&limit=100');
                    setAuditRecords(d || []);
                } catch (e) { message.error('加载操作记录失败: ' + e.message); } finally { setAuditLoading(false); }
            };

            const userMoreMenu = (u) => ({
                items: [
                    { key: 'detail', label: '详情', icon: <UIIcon name="ProfileOutlined" /> },
                    { key: 'edit', label: '编辑', icon: <UIIcon name="EditOutlined" /> },
                    { key: 'pwd', label: '修改密码', icon: <UIIcon name="KeyOutlined" /> },
                    { type: 'divider' },
                    u.is_active
                        ? { key: 'disable', label: '禁用', danger: true, icon: <UIIcon name="StopOutlined" /> }
                        : { key: 'enable', label: '启用', icon: <UIIcon name="PlayCircleOutlined" /> },
                    { key: 'delete', label: '删除', danger: true, icon: <UIIcon name="DeleteOutlined" /> },
                    { type: 'divider' },
                    { key: 'audit', label: '查看操作记录', icon: <UIIcon name="HistoryOutlined" /> }
                ],
                onClick: ({ key }) => {
                    if (key === 'detail') openUserDetail(u);
                    else if (key === 'edit') openUserEdit(u);
                    else if (key === 'pwd') { pwdForm.resetFields(); setPwdModal(u.username); }
                    else if (key === 'disable') Modal.confirm({ title: '禁用用户？', content: `禁用后 ${u.username} 将无法登录。`, okText: '禁用', okButtonProps: { danger: true }, cancelText: '取消', onOk: () => setUserActive(u, false) });
                    else if (key === 'enable') Modal.confirm({ title: '启用用户？', content: `将恢复 ${u.username} 的登录权限。`, okText: '启用', cancelText: '取消', onOk: () => setUserActive(u, true) });
                    else if (key === 'delete') Modal.confirm({ title: '删除用户？', content: `确定删除用户 ${u.username} 吗？该操作不可恢复。`, okText: '删除', okButtonProps: { danger: true }, cancelText: '取消', onOk: () => deleteUser(u) });
                    else if (key === 'audit') loadAudit(u.username);
                }
            });

            // ============ 角色操作 ============
            const openRoleDetail = (r) => setRoleDetail(r);
            const openRoleEdit = (r) => {
                setRoleEdit({ mode: r ? 'edit' : 'create', record: r || null });
                rForm.resetFields();
                if (r) rForm.setFieldsValue({ role_id: r.role_id, name: r.name, description: r.description || '', permissions: r.permissions || [] });
                else rForm.setFieldsValue({ permissions: [] });
            };
            const submitRole = async () => {
                const v = await rForm.validateFields();
                try {
                    if (roleEdit.mode === 'create') {
                        await api('/api/rbac/roles', 'POST', { role_id: v.role_id, name: v.name, description: v.description || '', permissions: v.permissions });
                        message.success('角色创建成功');
                    } else {
                        await api('/api/rbac/roles/' + encodeURIComponent(roleEdit.record.role_id), 'PUT', { name: v.name, description: v.description || '', permissions: v.permissions });
                        message.success('角色更新成功');
                    }
                    setRoleEdit(null);
                    loadRoles();
                    loadUsers();
                } catch (e) { message.error(e.message); }
            };
            const deleteRole = async (r) => {
                try {
                    await api('/api/rbac/roles/' + encodeURIComponent(r.role_id), 'DELETE');
                    message.success('角色已删除');
                    loadRoles();
                    loadUsers();
                    if (roleDetail && roleDetail.role_id === r.role_id) setRoleDetail(null);
                } catch (e) { message.error(e.message); }
            };

            // ============ 权限渲染 ============
            const PermList = ({ keys, max = 999 }) => {
                const arr = (keys || []).slice(0, max);
                const rest = (keys || []).length - arr.length;
                return <div>
                    {arr.map(k => (
                        <div key={k} className="perm-item">
                            <UIIcon name="CheckCircleOutlined" style={{ color: '#52c41a', fontSize: 13 }} />
                            <span style={{ overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{permName(k)}</span>
                            {isHighRisk(k) && <Tag color="orange" style={{ marginRight: 0 }}>高风险</Tag>}
                        </div>
                    ))}
                    {rest > 0 && <Typography.Text type="secondary" style={{ fontSize: 12 }}>+{rest} 项</Typography.Text>}
                </div>;
            };

            const PermPicker = ({ value = [], onChange }) => (
                <div>
                    {Object.keys(permGroups).map(g => (
                        <div key={g} style={{ marginBottom: 10 }}>
                            <div className="perm-sect-title" style={{ margin: '6px 0 4px' }}>{g}</div>
                            <div style={{ display: 'flex', flexDirection: 'column', gap: 2 }}>
                                {permGroups[g].map(p => (
                                    <label key={p.key} style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '3px 4px', borderRadius: 6, cursor: 'pointer' }}>
                                        <Checkbox
                                            checked={(value || []).includes(p.key)}
                                            onChange={e => {
                                                const set = new Set(value || []);
                                                if (e.target.checked) set.add(p.key); else set.delete(p.key);
                                                onChange([...set]);
                                            }} />
                                        <Tooltip title={p.description || p.key}>
                                            <span>{p.name}</span>
                                        </Tooltip>
                                        {isHighRisk(p.key) && <Tag color="orange" style={{ marginRight: 0, fontSize: 11 }}>高风险</Tag>}
                                        <Typography.Text type="secondary" style={{ fontSize: 11, marginLeft: 'auto' }}>{p.key}</Typography.Text>
                                    </label>
                                ))}
                            </div>
                        </div>
                    ))}
                </div>
            );

            const DiffPreview = ({ before, after }) => {
                const d = diffPerms(before, after);
                if (!d.added.length && !d.removed.length) {
                    return <div className="diff-item" style={{ color: '#52c41a' }}><UIIcon name="CheckCircleOutlined" />权限没有变化</div>;
                }
                return <div>
                    <div style={{ fontSize: 12, color: 'var(--secondary)', marginBottom: 4 }}>当前：{before.size || before.length} 项 → 修改后：{after.size || after.length} 项</div>
                    {d.added.map(k => <div key={'a' + k} className="diff-item diff-add"><UIIcon name="PlusCircleOutlined" />{permName(k)} <span className="perm-key">{k}</span></div>)}
                    {d.removed.map(k => <div key={'r' + k} className="diff-item diff-remove"><UIIcon name="MinusCircleOutlined" />{permName(k)} <span className="perm-key">{k}</span></div>)}
                </div>;
            };

            // ============ 用户 Tab ============
            const userColumns = [
                {
                    title: '用户名', dataIndex: 'username', width: 220,
                    render: (v, u) => (
                        <Space size={10}>
                            <Avatar size={28} style={{ background: AVATAR_COLORS[(v.charCodeAt(0) || 0) % AVATAR_COLORS.length], fontSize: 13, fontWeight: 600 }}>
                                {(v || '?').charAt(0).toUpperCase()}
                            </Avatar>
                            <Typography.Link strong onClick={() => openUserDetail(u)}>{v}</Typography.Link>
                        </Space>
                    )
                },
                { title: '邮箱', dataIndex: 'email', width: 220, render: v => <Typography.Text type="secondary">{v || '-'}</Typography.Text> },
                { title: '角色', dataIndex: 'role_name', width: 140, render: (v, u) => u.role_id === 'admin' ? <Tag color="gold">{v || '-'}</Tag> : <Tag>{v || '无角色'}</Tag> },
                { title: '状态', dataIndex: 'is_active', width: 100, render: statusBadge },
                { title: '最近登录', dataIndex: 'last_login', width: 170, render: v => <Typography.Text type="secondary" style={{ fontSize: 12 }}>{fmtTime(v)}</Typography.Text> },
                { title: '创建时间', dataIndex: 'created_at', width: 170, render: v => <Typography.Text type="secondary" style={{ fontSize: 12 }}>{fmtDate(v)}</Typography.Text> },
                {
                    title: '操作', key: 'op', width: 150, fixed: 'right',
                    render: (_, u) => (
                        <Space size={4}>
                            <Button size="small" onClick={() => openUserDetail(u)}>详情</Button>
                            {canManageUser && <Dropdown menu={userMoreMenu(u)} trigger={['click']}>
                                <Button size="small" icon={<UIIcon name="MoreOutlined" />} />
                            </Dropdown>}
                        </Space>
                    )
                }
            ];

            const renderUsersTab = () => (
                <div>
                    <div className="toolbar">
                        <Input.Search allowClear placeholder="搜索用户名 / 邮箱..." className="toolbar-search"
                            onChange={e => setSearch(e.target.value)} onSearch={v => setSearch(v)} />
                        {canManageRole && (
                            <Select allowClear placeholder="角色" style={{ width: 160 }} value={roleFilter} onChange={setRoleFilter}
                                options={roles.map(r => ({ label: r.name, value: r.role_id }))} />
                        )}
                        <Select allowClear placeholder="状态" style={{ width: 110 }} value={statusFilter} onChange={setStatusFilter}
                            options={[{ label: '正常', value: 'active' }, { label: '禁用', value: 'disabled' }]} />
                        <div className="spacer" />
                        <Segmented value={userView} onChange={setUserView} options={[
                            { label: <span><UIIcon name="UnorderedListOutlined" />列表</span>, value: 'list' },
                            { label: <span><UIIcon name="AppstoreOutlined" />卡片</span>, value: 'card' }
                        ]} />
                        <Button icon={<UIIcon name="ReloadOutlined" />} loading={loading} onClick={refresh}>刷新</Button>
                        {canManageUser && <Button type="primary" icon={<UIIcon name="PlusOutlined" />} onClick={() => openUserEdit(null)}>创建用户</Button>}
                    </div>

                    {userView === 'list' ? (
                        isMobile ? (
                            <div>
                                {filteredUsers.map(u => (
                                    <Card key={u.username} size="small" bordered className="user-card" style={{ marginBottom: 10 }}>
                                        <div className="user-head">
                                            <Avatar size={40} style={{ background: AVATAR_COLORS[(u.username.charCodeAt(0) || 0) % AVATAR_COLORS.length], fontWeight: 600 }}>
                                                {(u.username || '?').charAt(0).toUpperCase()}
                                            </Avatar>
                                            <div className="info">
                                                <div className="name">{u.username} {statusBadge(u.is_active)}</div>
                                                <div className="user-meta">{u.email || '-'}</div>
                                                <div className="user-meta">角色：{u.role_name || '无角色'} · 最近登录 {fmtTime(u.last_login)}</div>
                                            </div>
                                        </div>
                                        <div className="user-foot">
                                            <Space size={4}>
                                                <Button size="small" onClick={() => openUserDetail(u)}>详情</Button>
                                                {canManageUser && <Button size="small" onClick={() => openUserEdit(u)}>编辑</Button>}
                                            </Space>
                                            {canManageUser && <Dropdown menu={userMoreMenu(u)} trigger={['click']}>
                                                <Button size="small" icon={<UIIcon name="MoreOutlined" />} />
                                            </Dropdown>}
                                        </div>
                                    </Card>
                                ))}
                                {!filteredUsers.length && <Empty description="暂无用户" style={{ padding: 30 }} />}
                            </div>
                        ) : (
                            <Table rowKey="username" size="middle" columns={userColumns} dataSource={filteredUsers} loading={loading}
                                scroll={{ x: 1000 }} pagination={{ pageSize: 20, showSizeChanger: true, showTotal: t => `共 ${t} 条` }} />
                        )
                    ) : (
                        <div className="role-grid" style={{ gridTemplateColumns: 'repeat(auto-fill, minmax(280px, 1fr))' }}>
                            {filteredUsers.map(u => (
                                <Card key={u.username} size="small" bordered hoverable className="user-card" onClick={() => openUserDetail(u)}>
                                    <div className="user-head">
                                        <Avatar size={44} style={{ background: AVATAR_COLORS[(u.username.charCodeAt(0) || 0) % AVATAR_COLORS.length], fontWeight: 600 }}>
                                            {(u.username || '?').charAt(0).toUpperCase()}
                                        </Avatar>
                                        <div className="info">
                                            <div className="name">{u.username} {statusBadge(u.is_active)}</div>
                                            <div className="user-meta">{u.role_id === 'admin' ? <Tag color="gold">{u.role_name}</Tag> : <Tag>{u.role_name || '无角色'}</Tag>}</div>
                                            <div className="user-meta">{u.email || '-'}</div>
                                        </div>
                                    </div>
                                    <div style={{ fontSize: 12, color: 'var(--secondary)' }}>
                                        最近登录：{fmtTime(u.last_login)}
                                    </div>
                                    <div className="user-foot" onClick={e => e.stopPropagation()}>
                                        <Space size={4}>
                                            <Button size="small" onClick={() => openUserDetail(u)}>详情</Button>
                                            {canManageUser && <Button size="small" onClick={() => openUserEdit(u)}>编辑</Button>}
                                        </Space>
                                        {canManageUser && <Dropdown menu={userMoreMenu(u)} trigger={['click']}>
                                            <Button size="small" icon={<UIIcon name="MoreOutlined" />} />
                                        </Dropdown>}
                                    </div>
                                </Card>
                            ))}
                            {!filteredUsers.length && <Empty description="暂无用户" style={{ padding: 30 }} />}
                        </div>
                    )}
                </div>
            );

            // ============ 角色 Tab ============
            const roleUsers = (roleId) => users.filter(u => u.role_id === roleId);
            const renderRolesTab = () => (
                <div>
                    <div className="toolbar">
                        <Typography.Text type="secondary">共 {roles.length} 个角色</Typography.Text>
                        <div className="spacer" />
                        <Button icon={<UIIcon name="ReloadOutlined" />} onClick={refresh}>刷新</Button>
                        {canManageRole && <Button type="primary" icon={<UIIcon name="PlusOutlined" />} onClick={() => openRoleEdit(null)}>创建角色</Button>}
                    </div>
                    <div className="role-grid">
                        {roles.map(r => {
                            const isAdmin = r.role_id === 'admin' && r.is_system;
                            const allPerm = r.permissions && r.permissions.includes('*');
                            return (
                                <Card key={r.role_id} size="small" bordered hoverable className="role-card" onClick={() => openRoleDetail(r)}>
                                    <div className="role-title">
                                        <span style={{ overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{r.name}</span>
                                        {r.is_system ? <Tag style={{ marginRight: 0 }}>系统角色</Tag> : null}
                                    </div>
                                    <div className="role-id">{r.role_id}</div>
                                    <div className="role-desc">{r.description || '暂无描述'}</div>
                                    <div className="role-stats">
                                        <div className="role-stat"><span>权限</span><b>{allPerm ? '全部' : (r.permissions || []).length + ' 项'}</b></div>
                                        <div className="role-stat" style={{ cursor: 'pointer' }} onClick={e => { e.stopPropagation(); openRoleDetail(r); }}>
                                            <span>用户</span><b>{r.user_count || 0} 名</b>
                                        </div>
                                    </div>
                                    <div className="user-foot" onClick={e => e.stopPropagation()}>
                                        <Space size={4}>
                                            <Button size="small" onClick={() => openRoleDetail(r)}>详情</Button>
                                            {canManageRole && <Button size="small" onClick={() => openRoleEdit(r)}>编辑</Button>}
                                        </Space>
                                        {r.is_system
                                            ? <Typography.Text type="secondary" style={{ fontSize: 12 }}><UIIcon name="LockOutlined" /> 系统内置角色</Typography.Text>
                                            : canManageRole && <Popconfirm title={`删除角色「${r.name}」？`} description="该角色下的用户将迁移为普通用户。" okText="删除" okButtonProps={{ danger: true }} cancelText="取消" onConfirm={() => deleteRole(r)}>
                                                <Button size="small" danger type="text">删除</Button>
                                            </Popconfirm>}
                                    </div>
                                </Card>
                            );
                        })}
                        {!roles.length && <Empty description="暂无角色" style={{ padding: 30 }} />}
                    </div>
                </div>
            );

            // ============ 权限矩阵 Tab ============
            const matrixRoleList = roles.filter(r => !matrixRoles.length || matrixRoles.includes(r.role_id));
            const matrixRows = Object.keys(permGroups).map(g => ({
                key: 'g_' + g,
                name: g,
                isGroup: true,
                children: permGroups[g].map(p => ({
                    key: p.key,
                    name: p.name,
                    keyText: p.key,
                    desc: p.description,
                    highRisk: isHighRisk(p.key)
                }))
            }));
            const matrixCols = [
                {
                    title: '权限', dataIndex: 'name', width: 220, render: (v, r) => r.isGroup
                        ? <Typography.Text strong style={{ fontSize: 13 }}>{v}</Typography.Text>
                        : <Space size={6}>{v}{r.highRisk && <Tag color="orange" style={{ marginRight: 0, fontSize: 11 }}>高风险</Tag>}</Space>
                },
                { title: 'Key', dataIndex: 'keyText', width: 180, render: (v, r) => r.isGroup ? null : <Typography.Text type="secondary" code style={{ fontSize: 12 }}>{v}</Typography.Text> },
                { title: '描述', dataIndex: 'desc', ellipsis: true, render: (v, r) => r.isGroup ? null : <Typography.Text type="secondary" style={{ fontSize: 12 }}>{v}</Typography.Text> },
                ...matrixRoleList.map(r => ({
                    title: <Tooltip title={r.role_id}><span>{r.name}</span></Tooltip>,
                    width: 110,
                    align: 'center',
                    render: (_, row) => {
                        if (row.isGroup) return null;
                        const has = rolePermSet(r).has(row.key);
                        return <span className={'matrix-check ' + (has ? 'matrix-yes' : 'matrix-no')}>
                            {has ? <UIIcon name="CheckOutlined" /> : <UIIcon name="CloseOutlined" />}
                        </span>;
                    }
                }))
            ];

            const renderMatrixTab = () => (
                <div>
                    <div className="toolbar">
                        <Select mode="multiple" allowClear placeholder="筛选角色（默认全部）" style={{ minWidth: 280, maxWidth: 420 }}
                            value={matrixRoles} onChange={setMatrixRoles}
                            options={roles.map(r => ({ label: r.name, value: r.role_id }))} />
                        <div className="spacer" />
                        <Typography.Text type="secondary" style={{ fontSize: 12 }}>✓ 拥有 · ✕ 未授权</Typography.Text>
                    </div>
                    <Table rowKey="key" size="small" columns={matrixCols} dataSource={matrixRows} pagination={false}
                        scroll={{ x: 'max-content' }} expandable={{ defaultExpandAllRows: true }} />
                </div>
            );

            // ============ 用户详情 Drawer ============
            const renderUserDetail = () => {
                const u = userDetail;
                if (!u) return null;
                const effective = u.permissions || [];
                const shown = showAllPerms ? effective : effective.slice(0, 12);
                return (
                    <Drawer title={<Space size={8}><Avatar size={26} style={{ background: AVATAR_COLORS[(u.username.charCodeAt(0) || 0) % AVATAR_COLORS.length], fontSize: 13 }}>{(u.username || '?').charAt(0).toUpperCase()}</Avatar>{u.username}</Space>}
                        open={!!u} onClose={() => setUserDetail(null)} width={isMobile ? '100%' : 720}
                        footer={<Space wrap>
                            {canManageUser && <Button icon={<UIIcon name="EditOutlined" />} onClick={() => { setUserDetail(null); openUserEdit(u); }}>编辑</Button>}
                            {canManageUser && (u.is_active
                                ? <Button danger icon={<UIIcon name="StopOutlined" />} onClick={() => Modal.confirm({ title: '禁用用户？', content: `禁用后 ${u.username} 将无法登录。`, okText: '禁用', okButtonProps: { danger: true }, cancelText: '取消', onOk: () => setUserActive(u, false) })}>禁用</Button>
                                : <Button icon={<UIIcon name="PlayCircleOutlined" />} onClick={() => Modal.confirm({ title: '启用用户？', content: `将恢复 ${u.username} 的登录权限。`, okText: '启用', cancelText: '取消', onOk: () => setUserActive(u, true) })}>启用</Button>)}
                            {canManageUser && <Button danger type="text" icon={<UIIcon name="DeleteOutlined" />} onClick={() => Modal.confirm({ title: '删除用户？', content: `确定删除用户 ${u.username} 吗？该操作不可恢复。`, okText: '删除', okButtonProps: { danger: true }, cancelText: '取消', onOk: () => deleteUser(u) })}>删除</Button>}
                        </Space>}>
                        <Descriptions size="small" column={2} bordered items={[
                            { key: 'username', label: '用户名', children: u.username },
                            { key: 'status', label: '状态', children: statusBadge(u.is_active) },
                            { key: 'email', label: '邮箱', children: u.email || '-' },
                            { key: 'role', label: '角色', children: u.role_id === 'admin' ? <Tag color="gold">{u.role_name}</Tag> : <Tag>{u.role_name || '无角色'}</Tag> },
                            { key: 'created', label: '创建时间', children: fmtDate(u.created_at) },
                            { key: 'last', label: '最近登录', children: fmtTime(u.last_login) }
                        ]} />
                        <div className="perm-sect-title"><UIIcon name="SafetyCertificateOutlined" />权限摘要（{effective.length} 项）</div>
                        {effective.includes('*')
                            ? <Alert type="info" showIcon message="该用户拥有全部权限（超级管理员）" style={{ marginBottom: 8 }} />
                            : <PermList keys={shown} />}
                        {effective.length > 12 && (
                            <Button size="small" type="link" onClick={() => setShowAllPerms(!showAllPerms)}>
                                {showAllPerms ? '收起' : '查看全部权限'}
                            </Button>
                        )}
                    </Drawer>
                );
            };

            // ============ 用户编辑 Drawer ============
            const userEditRole = roles.find(r => r.role_id === userEditRoleId) || null;
            const currentRoleForUser = userEdit && userEdit.record ? roles.find(r => r.role_id === userEdit.record.role_id) : null;

            const renderUserEdit = () => {
                if (!userEdit) return null;
                const isCreate = userEdit.mode === 'create';
                const before = currentRoleForUser ? rolePermSet(currentRoleForUser) : new Set();
                const after = userEditRole ? rolePermSet(userEditRole) : new Set();
                return (
                    <Drawer title={isCreate ? '创建用户' : '编辑用户：' + userEdit.record.username}
                        open={!!userEdit} onClose={() => setUserEdit(null)} width={isMobile ? '100%' : 640}
                        footer={<Space>
                            <Button onClick={() => setUserEdit(null)}>取消</Button>
                            <Button type="primary" onClick={submitUser}>保存</Button>
                        </Space>}>
                        <Form form={uForm} layout="vertical">
                            {isCreate && (
                                <Form.Item name="username" label="用户名" rules={[{ required: true, message: '请输入用户名' }, { pattern: /^[a-zA-Z0-9_-]{3,20}$/, message: '3-20位字母/数字/下划线' }]}>
                                    <Input placeholder="用户名" />
                                </Form.Item>
                            )}
                            <Form.Item name="email" label="邮箱" rules={[{ required: true, type: 'email', message: '请输入有效邮箱' }]}>
                                <Input placeholder="user@example.com" />
                            </Form.Item>
                            <Form.Item name="is_active" label="账号状态" valuePropName="checked">
                                <Switch checkedChildren="启用" unCheckedChildren="禁用" />
                            </Form.Item>
                            <Form.Item name="role_id" label="角色" rules={[{ required: true, message: '请选择角色' }]}>
                                <Select options={roles.map(r => ({ label: r.name + (r.is_system ? '（系统）' : ''), value: r.role_id }))} />
                            </Form.Item>
                            {isCreate
                                ? <Form.Item name="password" label="初始密码" rules={[{ required: true, min: 8, message: '至少8位，需包含字母和数字' }]}>
                                    <Input.Password placeholder="至少8位，包含字母和数字" />
                                </Form.Item>
                                : <Form.Item name="password" label="重置密码（留空不修改）">
                                    <Input.Password placeholder="至少8位，包含字母和数字" />
                                </Form.Item>}
                        </Form>
                        <Divider style={{ margin: '12px 0' }} />
                        <div className="perm-sect-title"><UIIcon name="SafetyCertificateOutlined" />角色权限</div>
                        <div style={{ border: '1px solid var(--border)', borderRadius: 8, padding: '4px 10px', maxHeight: 260, overflowY: 'auto' }}>
                            {userEditRole ? (userEditRole.permissions && userEditRole.permissions.includes('*')
                                ? <Alert type="info" showIcon message="该角色拥有全部权限" />
                                : <PermList keys={userEditRole.permissions || []} />)
                                : <Empty image={Empty.PRESENTED_IMAGE_SIMPLE} description="请选择角色" />}
                        </div>
                        {!isCreate && (
                            <>
                                <div className="perm-sect-title"><UIIcon name="SwapOutlined" />权限变化预览</div>
                                <DiffPreview before={before} after={after} />
                            </>
                        )}
                    </Drawer>
                );
            };

            // ============ 角色详情 Drawer ============
            const renderRoleDetail = () => {
                const r = roleDetail;
                if (!r) return null;
                const allPerm = r.permissions && r.permissions.includes('*');
                const keys = allPerm ? perms.map(p => p.key) : (r.permissions || []);
                const groupKeys = {};
                keys.forEach(k => { const d = permDef[k]; if (!d) return; (groupKeys[d.group] = groupKeys[d.group] || []).push(k); });
                return (
                    <Drawer title={<Space size={8}>
                        <Typography.Text strong style={{ fontSize: 16 }}>{r.name}</Typography.Text>
                        {r.is_system ? <Tag style={{ marginRight: 0 }}>系统角色</Tag> : null}
                    </Space>}
                        open={!!r} onClose={() => setRoleDetail(null)} width={isMobile ? '100%' : 720}
                        footer={<Space wrap>
                            {canManageRole && <Button icon={<UIIcon name="EditOutlined" />} onClick={() => { setRoleDetail(null); openRoleEdit(r); }}>编辑</Button>}
                            {r.is_system
                                ? <Typography.Text type="secondary"><UIIcon name="LockOutlined" /> 系统内置角色</Typography.Text>
                                : canManageRole && <Button danger type="text" icon={<UIIcon name="DeleteOutlined" />} onClick={() => Modal.confirm({ title: '删除角色？', content: `确定删除角色「${r.name}」吗？该角色下的用户将迁移为普通用户。`, okText: '删除', okButtonProps: { danger: true }, cancelText: '取消', onOk: () => deleteRole(r) })}>删除</Button>}
                        </Space>}>
                        <Descriptions size="small" column={2} bordered items={[
                            { key: 'id', label: '角色 ID', children: <Typography.Text code>{r.role_id}</Typography.Text> },
                            { key: 'type', label: '类型', children: r.is_system ? <Tag>系统内置</Tag> : <Tag color="blue">自定义</Tag> },
                            { key: 'desc', label: '描述', children: r.description || '-' },
                            { key: 'users', label: '用户数', children: r.user_count || 0 }
                        ]} />
                        <div className="perm-sect-title"><UIIcon name="SafetyCertificateOutlined" />权限（{keys.length} 项）</div>
                        {allPerm && <Alert type="info" showIcon message="该角色拥有系统全部权限" style={{ marginBottom: 8 }} />}
                        {Object.keys(groupKeys).map(g => (
                            <div key={g}>
                                <div className="perm-sect-title">{g}</div>
                                {groupKeys[g].map(k => (
                                    <div key={k} className="perm-item">
                                        <UIIcon name="CheckCircleOutlined" style={{ color: '#52c41a', fontSize: 13 }} />
                                        <span style={{ minWidth: 0 }}>{permName(k)}</span>
                                        {isHighRisk(k) && <Tag color="orange" style={{ marginRight: 0, fontSize: 11 }}>高风险</Tag>}
                                        <span className="perm-key">{k}</span>
                                        <span className="perm-desc" style={{ maxWidth: '45%' }}>{permDef[k] ? permDef[k].description : ''}</span>
                                    </div>
                                ))}
                            </div>
                        ))}
                        <div className="perm-sect-title"><UIIcon name="TeamOutlined" />使用此角色的用户（{roleUsers(r.role_id).length}）</div>
                        {roleUsers(r.role_id).length ? roleUsers(r.role_id).map(u => (
                            <div key={u.username} className="perm-item" style={{ cursor: 'pointer' }} onClick={() => { setRoleDetail(null); openUserDetail(u); }}>
                                <Avatar size={22} style={{ background: AVATAR_COLORS[(u.username.charCodeAt(0) || 0) % AVATAR_COLORS.length], fontSize: 11 }}>{(u.username || '?').charAt(0).toUpperCase()}</Avatar>
                                <span>{u.username}</span>
                                <span className="perm-key">{u.email || ''}</span>
                                {statusBadge(u.is_active)}
                            </div>
                        )) : <Empty image={Empty.PRESENTED_IMAGE_SIMPLE} description="暂无用户使用该角色" />}
                    </Drawer>
                );
            };

            // ============ 角色编辑 Drawer ============
            const roleEditSelected = roleEditPerms || [];
            const roleEditBefore = roleEdit && roleEdit.record ? rolePermSet(roleEdit.record) : new Set();
            const roleEditAfter = roleEdit && roleEdit.record && roleEdit.record.role_id === 'admin' && roleEdit.record.is_system
                ? new Set(perms.map(p => p.key))
                : new Set(roleEditSelected);
            const selectedHighRisk = roleEditSelected.filter(isHighRisk);

            const renderRoleEdit = () => {
                if (!roleEdit) return null;
                const isCreate = roleEdit.mode === 'create';
                const isAdmin = roleEdit.record && roleEdit.record.role_id === 'admin' && roleEdit.record.is_system;
                return (
                    <Drawer title={isCreate ? '创建角色' : '编辑角色：' + roleEdit.record.name}
                        open={!!roleEdit} onClose={() => setRoleEdit(null)} width={isMobile ? '100%' : 640}
                        footer={<Space>
                            <Button onClick={() => setRoleEdit(null)}>取消</Button>
                            <Button type="primary" onClick={submitRole}>保存</Button>
                        </Space>}>
                        <Form form={rForm} layout="vertical">
                            {isCreate && (
                                <Form.Item name="role_id" label="角色 ID" rules={[{ required: true, pattern: /^[a-zA-Z0-9_-]{1,32}$/, message: '字母/数字/下划线' }]}>
                                    <Input placeholder="如 viewer" />
                                </Form.Item>
                            )}
                            <Form.Item name="name" label="角色名称" rules={[{ required: true, message: '请输入角色名称' }]}>
                                <Input placeholder="角色名称" disabled={isAdmin} />
                            </Form.Item>
                            <Form.Item name="description" label="角色描述">
                                <Input.TextArea rows={2} placeholder="角色说明（可选）" disabled={isAdmin} />
                            </Form.Item>
                            {isAdmin ? (
                                <Alert type="warning" showIcon message="内置超级管理员角色权限固定为全部权限，不可修改。" />
                            ) : (
                                <Form.Item name="permissions" label="权限" valuePropName="value" initialValue={[]}>
                                    <PermPicker />
                                </Form.Item>
                            )}
                        </Form>
                        {!isAdmin && selectedHighRisk.length > 0 && (
                            <Alert type="warning" showIcon style={{ marginBottom: 10 }}
                                message="高风险权限"
                                description={<span>以下权限允许用户执行高风险系统操作，请确认角色是否需要：<br />
                                    {selectedHighRisk.map(k => <Tag key={k} color="orange" style={{ marginTop: 4 }}>{permName(k)}（{k}）</Tag>)}
                                </span>} />
                        )}
                        <div className="perm-sect-title"><UIIcon name="SwapOutlined" />权限变化预览</div>
                        <DiffPreview before={roleEditBefore} after={roleEditAfter} />
                    </Drawer>
                );
            };

            // ============ 审计 Drawer ============
            const auditCols = [
                { title: '时间', dataIndex: 'time', width: 170, render: v => <Typography.Text type="secondary" style={{ fontSize: 12 }}>{fmtTime(v)}</Typography.Text> },
                { title: '操作', dataIndex: 'action', width: 170, render: v => <Tag style={{ marginRight: 0 }}>{v}</Tag> },
                { title: '详情', dataIndex: 'detail', render: v => <span className="audit-detail">{v || '-'}</span> }
            ];

            const tabItems = [];
            if (canViewUser) {
                tabItems.push({
                    key: 'users',
                    label: <span><UIIcon name="TeamOutlined" />用户管理（{users.length}）</span>,
                    children: renderUsersTab()
                });
            }
            if (canManageRole) {
                tabItems.push({
                    key: 'roles',
                    label: <span><UIIcon name="SafetyCertificateOutlined" />角色管理（{roles.length}）</span>,
                    children: renderRolesTab()
                });
                tabItems.push({
                    key: 'matrix',
                    label: <span><UIIcon name="PartitionOutlined" />权限矩阵</span>,
                    children: renderMatrixTab()
                });
            }

            return (
                <ConfigProvider theme={{ algorithm: isDark ? darkAlgorithm : undefined, token: { colorBgLayout: isDark ? '#141414' : '#f5f5f5', colorBgContainer: isDark ? '#1f1f1f' : '#ffffff', ...(isMobile ? { fontSize: 13 } : {}) } }}>
                    <div className={'sp-app' + (isDark ? ' dark' : '')} style={{ minHeight: '100vh', background: 'var(--bg)' }}>
                        <div className={'topbar' + (isDark ? ' dark' : '')}>
                            <span className="tb-page"><UIIcon name="SafetyCertificateOutlined" />权限管理</span>
                            <Space style={{ marginLeft: 'auto' }}>
                                <Button icon={<UIIcon name="HomeOutlined" />} onClick={() => window.location.href = 'index.html'}><span className="tb-text">首页</span></Button>
                                <Button className="tb-hide-sm" icon={<UIIcon name="AppstoreOutlined" />} onClick={() => window.location.href = 'services.html'}><span className="tb-text">服务端口</span></Button>
                                <Button className="tb-hide-sm" icon={<UIIcon name="GlobalOutlined" />} onClick={() => window.location.href = 'ip-panel.html'}><span className="tb-text">IP 流量</span></Button>
                                <Tooltip title={isDark ? '浅色模式' : '深色模式'}>
                                    <Button onClick={() => setIsDark(!isDark)} icon={<UIIcon name={isDark ? 'SunOutlined' : 'MoonOutlined'} />} />
                                </Tooltip>
                                <Button danger icon={<UIIcon name="LogoutOutlined" />} onClick={() => secureFetch(baseUrl + '/logout', { method: 'POST' }).finally(() => window.location.href = 'index.html')}><span className="tb-text">退出</span></Button>
                            </Space>
                        </div>
                        <div className="page-wrap">
                            <div className="page-title">权限管理</div>
                            <div className="page-desc">管理系统用户、角色与访问权限</div>
                            <div className="mini-grid">
                                <div className="mini-stat"><div className="ms-label"><UIIcon name="TeamOutlined" />用户</div><div className="ms-value">{users.length}</div></div>
                                <div className="mini-stat"><div className="ms-label"><UIIcon name="SafetyCertificateOutlined" />角色</div><div className="ms-value">{roles.length}</div></div>
                                <div className="mini-stat"><div className="ms-label"><UIIcon name="KeyOutlined" />权限</div><div className="ms-value">{perms.length}</div></div>
                                <div className="mini-stat"><div className="ms-label"><UIIcon name="WifiOutlined" />在线</div><div className="ms-value">{online}</div></div>
                            </div>
                            <Card size="small">
                                <Tabs activeKey={tab} onChange={setTab} items={tabItems} />
                            </Card>
                        </div>

                        {renderUserDetail()}
                        {renderUserEdit()}
                        {renderRoleDetail()}
                        {renderRoleEdit()}

                        {/* 修改密码 Modal */}
                        <Modal title={'重置密码：' + (pwdModal || '')} open={!!pwdModal} onCancel={() => setPwdModal(null)}
                            onOk={resetPassword} okText="确认重置" okButtonProps={{ danger: true }} cancelText="取消">
                            <Form form={pwdForm} layout="vertical" style={{ marginTop: 12 }}>
                                <Form.Item name="password" label="新密码" rules={[{ required: true, min: 8, message: '至少8位，需包含字母和数字' }]}>
                                    <Input.Password placeholder="至少8位，包含字母和数字" />
                                </Form.Item>
                            </Form>
                        </Modal>

                        {/* 审计 Drawer */}
                        <Drawer title={<Space size={6}><UIIcon name="HistoryOutlined" />操作记录{auditUser ? '：' + auditUser : ''}</Space>}
                            open={auditUser !== null} onClose={() => setAuditUser(null)} width={isMobile ? '100%' : 720}
                            footer={<Space>
                                <Button icon={<UIIcon name="ReloadOutlined" />} onClick={() => loadAudit(auditUser)}>刷新</Button>
                            </Space>}>
                            {auditLoading ? <div style={{ textAlign: 'center', padding: 40 }}><Spin /></div>
                                : <Table rowKey={(r, i) => i} size="small" columns={auditCols} dataSource={auditRecords} pagination={{ pageSize: 20, showSizeChanger: false }}
                                    scroll={{ y: 480 }} locale={{ emptyText: '暂无操作记录' }} />}
                        </Drawer>
                    </div>
                </ConfigProvider>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
    <script>
        (function () {
            function getCsrfToken() { var m = document.cookie.match(/(?:^|; )csrf_token=([^;]*)/); return m ? decodeURIComponent(m[1]) : ''; }
            function openPrivateSpace() {
                try {
                    fetch('/api/private/entry', { method: 'POST', headers: { 'X-CSRF-Token': getCsrfToken() }, credentials: 'include' })
                        .then(function (r) { if (r.ok) window.location.href = 'private.html'; })
                        .catch(function () { });
                } catch (e) { window.location.href = 'private.html'; }
            }
            var taps = [], lastTap = 0;
            document.addEventListener('keydown', function (e) {
                if (e.ctrlKey && e.shiftKey && e.altKey && (e.key === 'N' || e.key === 'n')) {
                    e.preventDefault();
                    openPrivateSpace();
                }
            });
            document.addEventListener('click', function (e) {
                var el = e.target;
                while (el && el !== document.documentElement) {
                    if (el.classList && (el.classList.contains('logo') || el.classList.contains('brand'))) {
                        var now = Date.now();
                        if (now - lastTap > 3000) taps = [];
                        lastTap = now;
                        taps.push(now);
                        if (taps.length >= 5) { taps = []; openPrivateSpace(); }
                        return;
                    }
                    el = el.parentElement;
                }
            });
        })();
    </script>
</body>

</html>
