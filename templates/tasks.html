<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow">
    <title>运维任务 - Server Status</title>
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%201024%201024%22%20fill%3D%22%231677ff%22%3E%3Cpath%20d%3D%22M704%20446H320c-4.4%200-8%203.6-8%208v402c0%204.4%203.6%208%208%208h384c4.4%200%208-3.6%208-8V454c0-4.4-3.6-8-8-8zm-328%2064h272v117H376V510zm272%20290H376V683h272v117z%22%2F%3E%3Cpath%20d%3D%22M424%20748a32%2032%200%201%200%2064%200%2032%2032%200%201%200-64%200zm0-178a32%2032%200%201%200%2064%200%2032%2032%200%201%200-64%200z%22%2F%3E%3Cpath%20d%3D%22M811.4%20368.9C765.6%20248%20648.9%20162%20512.2%20162S258.8%20247.9%20213%20368.8C126.9%20391.5%2063.5%20470.2%2064%20563.6%2064.6%20668%20145.6%20752.9%20247.6%20762c4.7.4%208.7-3.3%208.7-8v-60.4c0-4-3-7.4-7-7.9-27-3.4-52.5-15.2-72.1-34.5-24-23.5-37.2-55.1-37.2-88.6%200-28%209.1-54.4%2026.2-76.4%2016.7-21.4%2040.2-36.9%2066.1-43.7l37.9-10%2013.9-36.7c8.6-22.8%2020.6-44.2%2035.7-63.5%2014.9-19.2%2032.6-36%2052.4-50%2041.1-28.9%2089.5-44.2%20140-44.2s98.9%2015.3%20140%2044.3c19.9%2014%2037.5%2030.8%2052.4%2050%2015.1%2019.3%2027.1%2040.7%2035.7%2063.5l13.8%2036.6%2037.8%2010c54.2%2014.4%2092.1%2063.7%2092.1%20120%200%2033.6-13.2%2065.1-37.2%2088.6-19.5%2019.2-44.9%2031.1-71.9%2034.5-4%20.5-6.9%203.9-6.9%207.9V754c0%204.7%204.1%208.4%208.8%208%20101.7-9.2%20182.5-94%20183.2-198.2.6-93.4-62.7-172.1-148.6-194.9z%22%2F%3E%3C%2Fsvg%3E">
    <link rel="stylesheet" href="/ui.css">
    <style>
        #root { min-height: 100vh; }
        .sec-topbar {
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 24px; height: 56px;
            background: var(--color-surface); border-bottom: 1px solid var(--color-border);
        }
        .tb-page { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: var(--color-text); white-space: nowrap; }
        .tb-page .anticon { color: var(--color-primary); }
        .sec-wrap { padding: 16px 24px 64px; max-width: 1280px; margin: 0 auto; width: 100%; }

        .task-stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 16px; }
        .task-stat {
            background: var(--color-surface); border: 1px solid var(--color-border);
            border-radius: var(--radius); padding: 12px 16px;
        }
        .task-stat .ts-label { font-size: 12px; color: var(--color-text-tertiary); }
        .task-stat .ts-value { margin-top: 4px; font-size: 20px; font-weight: 600; color: var(--color-text); font-variant-numeric: tabular-nums; }

        .task-up-next { display: flex; flex-direction: column; gap: 8px; }
        .task-up-item { display: flex; align-items: center; gap: 10px; font-size: 13px; }
        .task-up-time { font-variant-numeric: tabular-nums; color: var(--color-primary); font-weight: 600; min-width: 72px; }

        .task-card-m {
            background: var(--color-surface); border: 1px solid var(--color-border);
            border-radius: var(--radius); padding: 12px 14px; margin-bottom: 10px;
        }
        .rem-mono { font-family: "JetBrains Mono", Consolas, "Courier New", monospace; font-size: 12px; }
        @media (max-width: 768px) {
            .sec-wrap { padding: 12px 12px 48px; }
            .sec-topbar { padding: 0 12px; }
            .task-stat-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
    <script>
        (function () {
            try {
                var dark = localStorage.getItem('theme') === 'dark';
                document.documentElement.classList.toggle('dark', dark);
            } catch (e) { }
        })();
    </script>
</head>

<body>
    <div id="root"></div>
    <script crossorigin src="https://registry.npmmirror.com/react/18.3.1/files/umd/react.production.min.js"></script>
    <script crossorigin src="https://registry.npmmirror.com/react-dom/18.3.1/files/umd/react-dom.production.min.js"></script>
    <script src="https://registry.npmmirror.com/dayjs/1.11.13/files/dayjs.min.js"></script>
    <script src="https://registry.npmmirror.com/antd/5.21.6/files/dist/antd.min.js"></script>
    <script src="https://registry.npmmirror.com/@ant-design/icons/5.4.0/files/dist/index.umd.js"></script>
    <script src="https://registry.npmmirror.com/@babel/standalone/7.24.7/files/babel.min.js"></script>
    <script type="text/babel">
        const { Card, Button, Table, Tag, Tooltip, Space, ConfigProvider, theme, message, Descriptions, Empty,
            Modal, Segmented, Select, Input, InputNumber, Typography, Switch, Popconfirm, Alert, Drawer, Badge } = window.antd;
        const { useState, useEffect, useCallback, useRef } = React;
        const { darkAlgorithm } = theme;
        const IconSet = window.icons || {};
        const UIIcon = ({ name, ...props }) => { const C = IconSet[name]; return C ? <C {...props} /> : null; };

        const baseUrl = window.location.origin;
        function getCsrfToken() { const m = document.cookie.match(/(?:^|; )csrf_token=([^;]*)/); return m ? decodeURIComponent(m[1]) : ''; }
        function secureFetch(url, options = {}) {
            const method = options.method || 'GET';
            const headers = { 'Content-Type': 'application/json', ...(options.headers || {}) };
            if (/^(POST|PUT|PATCH|DELETE)$/i.test(method)) { const tok = getCsrfToken(); if (tok) headers['X-CSRF-Token'] = tok; }
            return fetch(url, { method, headers, credentials: 'include', body: options.body });
        }
        async function getJSON(url) {
            const r = await secureFetch(url);
            const d = await r.json();
            if (d.code !== 200) throw new Error(d.message || ('HTTP ' + r.status));
            return d.data;
        }
        async function postJSON(url, body) {
            const r = await secureFetch(url, { method: 'POST', body: JSON.stringify(body || {}) });
            const d = await r.json();
            if (d.code !== 200) throw new Error(d.message || ('HTTP ' + r.status));
            return d.data;
        }
        async function putJSON(url, body) {
            const r = await secureFetch(url, { method: 'PUT', body: JSON.stringify(body || {}) });
            const d = await r.json();
            if (d.code !== 200) throw new Error(d.message || ('HTTP ' + r.status));
            return d.data;
        }
        async function deleteJSON(url) {
            const r = await secureFetch(url, { method: 'DELETE' });
            const d = await r.json();
            if (d.code !== 200) throw new Error(d.message || ('HTTP ' + r.status));
            return d.data;
        }
        function fmtTime(s) { return s ? dayjs(s).format('MM-DD HH:mm') : '—'; }
        function fmtDuration(ms) {
            if (!ms && ms !== 0) return '—';
            if (ms < 1000) return ms + 'ms';
            const s = Math.round(ms / 100) / 10;
            if (s < 60) return s + 's';
            return Math.floor(s / 60) + 'm' + Math.round(s % 60) + 's';
        }
        function useIsMobile() {
            const [m, setM] = useState(window.innerWidth <= 768);
            useEffect(() => {
                const on = () => setM(window.innerWidth <= 768);
                window.addEventListener('resize', on);
                return () => window.removeEventListener('resize', on);
            }, []);
            return m;
        }

        const TASK_STATUS = {
            running: { label: '运行中', color: 'processing' }, success: { label: '成功', color: 'success' },
            failed: { label: '失败', color: 'error' }, timeout: { label: '超时', color: 'error' },
            cancelled: { label: '已取消', color: 'default' }, skipped: { label: '已跳过', color: 'default' },
            queued: { label: '排队中', color: 'processing' },
        };
        const StatusTag = ({ s }) => {
            const m = TASK_STATUS[s] || { label: s || '—', color: 'default' };
            return <Tag color={m.color} style={{ marginRight: 0 }}>{m.label}</Tag>;
        };
        const TYPE_LABEL = { once: '一次性', cron: '定时', interval: '周期', event: '事件触发' };
        const EVENT_TYPES = [
            { value: 'cpu_high', label: 'CPU 超过阈值' }, { value: 'disk_high', label: '磁盘超过阈值' },
            { value: 'service_stopped', label: '服务停止' }, { value: 'security_finding', label: '安全风险产生' },
            { value: 'ip_abnormal', label: 'IP 异常（封禁数超阈值）' }, { value: 'docker_container_exit', label: 'Docker 容器异常退出' },
        ];

        // 频率构建：预设 → 5 段 cron（与云备份页同思路）
        const pad2 = (n) => (n < 10 ? '0' + n : '' + n);
        const WEEK_OPTS = [{ value: 1, label: '周一' }, { value: 2, label: '周二' }, { value: 3, label: '周三' }, { value: 4, label: '周四' }, { value: 5, label: '周五' }, { value: 6, label: '周六' }, { value: 0, label: '周日' }];
        function buildCron(f) {
            if (f.freq === 'daily') return f.minute + ' ' + f.hour + ' * * *';
            if (f.freq === 'weekly') return f.minute + ' ' + f.hour + ' * * ' + f.week;
            if (f.freq === 'hours') return f.minute + ' */' + f.interval + ' * * *';
            return '*/' + f.interval + ' * * * *';
        }
        function parseCronToForm(cron) {
            const form = { freq: 'daily', hour: 3, minute: 0, week: 1, interval: 6 };
            const m = (cron || '').trim().split(/\s+/);
            if (m.length !== 5) return form;
            const num = (s) => (/^\d+$/.test(s) ? parseInt(s, 10) : null);
            const step = (s) => (s && s.indexOf('*/') === 0 && /^\*\/\d+$/.test(s) ? parseInt(s.slice(2), 10) : null);
            let v;
            if ((v = num(m[0])) !== null && (v = num(m[1])) !== null && m[2] === '*' && m[3] === '*' && m[4] === '*') {
                return { ...form, freq: 'daily', hour: num(m[1]), minute: num(m[0]) };
            }
            if ((v = num(m[1])) !== null && m[2] === '*' && m[3] === '*' && num(m[4]) !== null) {
                return { ...form, freq: 'weekly', hour: num(m[1]), minute: num(m[0]), week: num(m[4]) };
            }
            if (num(m[0]) !== null && (v = step(m[1])) !== null && m[2] === '*' && m[3] === '*' && m[4] === '*') {
                return { ...form, freq: 'hours', minute: num(m[0]), interval: v };
            }
            if ((v = step(m[0])) !== null && m[1] === '*' && m[2] === '*' && m[3] === '*' && m[4] === '*') {
                return { ...form, freq: 'minutes', interval: v };
            }
            return { ...form, freq: 'custom' };
        }

        function OpsTopbar({ active, isDark, setIsDark, hasPerm }) {
            const navBtns = [];
            navBtns.push(<Button key="home" icon={<UIIcon name="DashboardOutlined" />} onClick={() => window.location.href = 'index.html'}>首页</Button>);
            if (hasPerm('security:view') || hasPerm('remediation:view')) navBtns.push(<Button key="security" icon={<UIIcon name="SafetyOutlined" />} type={active === 'security' ? 'primary' : 'default'} onClick={() => window.location.href = 'security.html'}>安全中心</Button>);
            if (hasPerm('security:view')) navBtns.push(<Button key="events" icon={<UIIcon name="NotificationOutlined" />} type={active === 'events' ? 'primary' : 'default'} onClick={() => window.location.href = 'security-events.html'}>安全事件</Button>);
            if (hasPerm('remediation:view')) navBtns.push(<Button key="rem" icon={<UIIcon name="ToolOutlined" />} type={active === 'remediation' ? 'primary' : 'default'} onClick={() => window.location.href = 'remediation.html'}>自动修复</Button>);
            if (hasPerm('task:view')) navBtns.push(<Button key="tasks" icon={<UIIcon name="ClockCircleOutlined" />} type={active === 'tasks' ? 'primary' : 'default'} onClick={() => window.location.href = 'tasks.html'}>运维任务</Button>);
            if (hasPerm('task:view')) navBtns.push(<Button key="history" icon={<UIIcon name="HistoryOutlined" />} type={active === 'history' ? 'primary' : 'default'} onClick={() => window.location.href = 'task-history.html'}>执行历史</Button>);
            return (
                <div className="sec-topbar">
                    <span className="tb-page"><UIIcon name="ClockCircleOutlined" />运维任务</span>
                    <Space wrap style={{ marginLeft: 'auto' }}>
                        {navBtns}
                        <Tooltip title={isDark ? '浅色模式' : '深色模式'}>
                            <Button onClick={() => setIsDark(!isDark)} icon={<UIIcon name={isDark ? 'SunOutlined' : 'MoonOutlined'} />} />
                        </Tooltip>
                        <Button danger icon={<UIIcon name="LogoutOutlined" />} onClick={async () => {
                            try { await secureFetch(baseUrl + '/logout', { method: 'POST', body: '{}' }); } catch (e) { }
                            window.location.href = 'index.html';
                        }}><span className="tb-text">退出</span></Button>
                    </Space>
                </div>
            );
        }

        function ParamFields({ spec, params, setParams }) {
            if (!spec || spec.length === 0) return <Alert type="info" message="该动作无需参数。" style={{ marginBottom: 10 }} />;
            return spec.map(p => (
                <div key={p.name} style={{ marginBottom: 10 }}>
                    <Typography.Text style={{ fontSize: 13 }}>{p.label}{p.required && <span style={{ color: 'var(--color-error)' }}> *</span>}</Typography.Text>
                    {p.help && <Typography.Paragraph type="secondary" style={{ fontSize: 12, marginBottom: 4 }}>{p.help}</Typography.Paragraph>}
                    <div>
                        {p.type === 'enum' ? (
                            <Select style={{ width: '100%' }} value={params[p.name] != null ? String(params[p.name]) : (p.default != null ? String(p.default) : undefined)}
                                onChange={v => setParams(m => ({ ...m, [p.name]: v }))} options={(p.options || []).map(o => ({ value: o, label: o }))} placeholder="请选择" />
                        ) : p.type === 'int' ? (
                            <InputNumber style={{ width: '100%' }} value={params[p.name] != null ? Number(params[p.name]) : (p.default != null ? Number(p.default) : undefined)}
                                onChange={v => setParams(m => ({ ...m, [p.name]: v }))} />
                        ) : (
                            <Input value={params[p.name] != null ? String(params[p.name]) : (p.default != null ? String(p.default) : '')}
                                onChange={e => setParams(m => ({ ...m, [p.name]: e.target.value }))} />
                        )}
                    </div>
                </div>
            ));
        }

        function App() {
            const [auth, setAuth] = useState({ loading: true, ok: false, user: null });
            const [isDark, setIsDark] = useState(() => localStorage.getItem('theme') === 'dark');
            const isMobile = useIsMobile();
            const hasPerm = (p) => auth.user && (auth.user.permissions || []).some(x => x === '*' || x === p);

            const [data, setData] = useState(null);       // {tasks, upcoming, running}
            const [stats, setStats] = useState(null);     // {running, scheduled, failed_24h, done_today}
            const [actions, setActions] = useState([]);
            const [templates, setTemplates] = useState(null);
            const [templatesOpen, setTemplatesOpen] = useState(false);
            const [editOpen, setEditOpen] = useState(false);
            const [editForm, setEditForm] = useState(null);
            const [saving, setSaving] = useState(false);
            const [detail, setDetail] = useState(null);
            const wsRef = useRef(null);

            useEffect(() => {
                secureFetch(baseUrl + '/check-auth')
                    .then(r => r.json())
                    .then(d => {
                        if (d.code === 200) setAuth({ loading: false, ok: true, user: d.user });
                        else window.location.href = 'index.html';
                    })
                    .catch(() => { window.location.href = 'index.html'; });
            }, []);
            useEffect(() => {
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
                document.documentElement.classList.toggle('dark', isDark);
                document.body.classList.toggle('dark', isDark);
                document.body.style.background = isDark ? '#141414' : '#f5f5f5';
            }, [isDark]);

            const load = useCallback(async () => {
                try {
                    const [d, s, a] = await Promise.all([
                        getJSON(baseUrl + '/api/tasks'),
                        getJSON(baseUrl + '/api/task/stats'),
                        getJSON(baseUrl + '/api/remediation/actions'),
                    ]);
                    setData(d); setStats(s); setActions(a || []);
                } catch (e) { message.error('加载任务数据失败：' + e.message); }
            }, []);
            useEffect(() => { if (auth.ok) load(); }, [auth.ok]);

            // 任务执行实时推送（运行中状态即时变化）
            useEffect(() => {
                if (!auth.ok) return;
                try {
                    const ws = new WebSocket((window.location.protocol === 'https:' ? 'wss://' : 'ws://') + window.location.host + '/ws/ops-events');
                    ws.onmessage = (ev) => {
                        try {
                            const d = JSON.parse(ev.data);
                            if ((d.type || '').startsWith('task.')) {
                                if (d.type === 'task.success') message.success('任务「' + d.task_name + '」执行成功');
                                if (d.type === 'task.failed' || d.type === 'task.timeout') message.error('任务「' + d.task_name + '」执行失败：' + (d.message || ''));
                                load();
                                if (detail && d.task_id === detail.task.id) openDetail(detail.task.id);
                            }
                        } catch (e) { }
                    };
                    wsRef.current = ws;
                    return () => { try { ws.close(); } catch (e) { } };
                } catch (e) { }
            }, [auth.ok]);

            const openCreate = () => {
                setEditForm({
                    id: '', name: '', description: '', type: 'cron', schedule: '30 5 * * *',
                    cronForm: { freq: 'daily', hour: 5, minute: 30, week: 1, interval: 6 },
                    interval_seconds: 3600, run_at: null, trigger: null,
                    action_id: 'security_scan', parameters: {}, enabled: true,
                    timeout_seconds: 600, max_attempts: 1, retry_backoff_seconds: 60,
                });
                setEditOpen(true);
            };
            const openEdit = (t) => {
                setEditForm({
                    ...t, cronForm: parseCronToForm(t.schedule),
                    run_at_local: t.run_at ? dayjs(t.run_at).format('YYYY-MM-DDTHH:mm:ss') : '',
                    parameters: { ...(t.parameters || {}) },
                });
                setEditOpen(true);
            };
            const useTemplate = (tpl) => {
                setEditForm({
                    id: '', name: tpl.name, description: tpl.description, type: tpl.type,
                    schedule: tpl.schedule || '', cronForm: parseCronToForm(tpl.schedule),
                    interval_seconds: tpl.interval_seconds || 3600,
                    run_at: null, trigger: tpl.trigger ? { ...tpl.trigger } : null,
                    action_id: tpl.action_id, parameters: { ...(tpl.parameters || {}) }, enabled: true,
                    timeout_seconds: tpl.timeout_seconds || 600, max_attempts: tpl.max_attempts || 1,
                    retry_backoff_seconds: 60,
                });
                setTemplatesOpen(false);
                setEditOpen(true);
            };
            const saveTask = async () => {
                setSaving(true);
                try {
                    const body = { ...editForm };
                    if (body.type === 'cron') body.schedule = buildCron(body.cronForm);
                    if (body.type === 'once') {
                        // 本地时间 → 带时区偏移的 RFC3339（如 2026-09-20T03:00:00+08:00）
                        body.run_at = dayjs(body.run_at_local).format('YYYY-MM-DDTHH:mm:ssZ');
                    }
                    const isEdit = !!body.id;
                    if (isEdit) {
                        await putJSON(baseUrl + '/api/tasks/' + body.id, body);
                        message.success('任务已更新');
                    } else {
                        delete body.id;
                        await postJSON(baseUrl + '/api/tasks', body);
                        message.success('任务已创建');
                    }
                    setEditOpen(false);
                    load();
                } catch (e) { message.error(e.message); } finally { setSaving(false); }
            };
            const runNow = async (t) => {
                try {
                    await postJSON(baseUrl + '/api/tasks/' + t.id + '/run');
                    message.info('任务「' + t.name + '」已开始执行');
                    load();
                } catch (e) { message.error(e.message); }
            };
            const cancelTask = async (t) => {
                try {
                    await postJSON(baseUrl + '/api/tasks/' + t.id + '/cancel');
                    message.success('已发送取消指令');
                    load();
                } catch (e) { message.error(e.message); }
            };
            const toggleTask = async (t) => {
                try {
                    await postJSON(baseUrl + '/api/tasks/' + t.id + '/toggle', { enabled: !t.enabled });
                    message.success(!t.enabled ? '任务已启用' : '任务已停用');
                    load();
                } catch (e) { message.error(e.message); }
            };
            const removeTask = async (t) => {
                try {
                    await deleteJSON(baseUrl + '/api/tasks/' + t.id);
                    message.success('任务已删除');
                    load();
                } catch (e) { message.error(e.message); }
            };
            const openDetail = async (id) => {
                try {
                    const d = await getJSON(baseUrl + '/api/tasks/' + id);
                    setDetail(d);
                } catch (e) { message.error(e.message); }
            };

            if (auth.loading) {
                return <div style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', background: isDark ? '#141414' : '#f5f5f5' }}><Card loading style={{ width: 320 }} /></div>;
            }
            if (!hasPerm('task:view')) {
                return (
                    <ConfigProvider theme={{ algorithm: isDark ? darkAlgorithm : undefined, token: { colorBgLayout: isDark ? '#141414' : '#f5f5f5', colorBgContainer: isDark ? '#1f1f1f' : '#ffffff' } }}>
                        <OpsTopbar active="tasks" isDark={isDark} setIsDark={setIsDark} hasPerm={hasPerm} />
                        <div style={{ display: 'flex', justifyContent: 'center', padding: 48 }}>
                            <Card style={{ width: 400, textAlign: 'center' }}>
                                <div style={{ fontSize: 40, marginBottom: 8 }}><UIIcon name="StopOutlined" /></div>
                                <Typography.Title level={4}>没有访问权限</Typography.Title>
                                <Typography.Text type="secondary">当前账号没有「查看运维任务」权限（task:view）。</Typography.Text>
                            </Card>
                        </div>
                    </ConfigProvider>
                );
            }

            const tasks = (data && data.tasks) || [];
            const upcoming = (data && data.upcoming) || [];
            const selectedAction = editForm ? actions.find(a => a.id === editForm.action_id) : null;

            const scheduleText = (t) => {
                if (t.type === 'cron') return t.schedule;
                if (t.type === 'interval') return '每 ' + Math.round(t.interval_seconds / 60) + ' 分钟';
                if (t.type === 'once') return t.run_at ? dayjs(t.run_at).format('YYYY-MM-DD HH:mm') : '—';
                if (t.type === 'event' && t.trigger) {
                    const et = (EVENT_TYPES.find(x => x.value === t.trigger.type) || {}).label || t.trigger.type;
                    return et + (t.trigger.match ? '（' + t.trigger.match + '）' : '');
                }
                return '—';
            };

            const taskCols = [
                {
                    title: '任务名称', dataIndex: 'name', width: 200,
                    render: (v, t) => <div>
                        <div style={{ fontWeight: 600, display: 'flex', alignItems: 'center', gap: 6 }}>
                            {t.last_status === 'running' && <Badge status="processing" />}{v}
                        </div>
                        {!isMobile && t.description && <div style={{ fontSize: 12, color: 'var(--color-text-tertiary)' }}>{t.description}</div>}
                    </div>
                },
                { title: '类型', dataIndex: 'type', width: 80, render: (v) => <Tag style={{ marginRight: 0 }}>{TYPE_LABEL[v] || v}</Tag> },
                { title: '计划', key: 'sched', width: 190, render: (_, t) => <span style={{ fontSize: 12 }} className="rem-mono">{scheduleText(t)}</span> },
                { title: '下次执行', dataIndex: 'next_run_at', width: 110, render: (v) => v ? fmtTime(v) : '—' },
                { title: '最近执行', dataIndex: 'last_run_at', width: 110, render: (v) => v ? fmtTime(v) : '未执行' },
                { title: '状态', dataIndex: 'last_status', width: 80, render: (v) => <StatusTag s={v} /> },
                {
                    title: '操作', key: 'ops', width: isMobile ? '100%' : 250,
                    render: (_, t) => (
                        <Space size={0} wrap>
                            {hasPerm('task:execute') && t.enabled && t.last_status !== 'running' &&
                                <Popconfirm title="立即执行该任务？" description={'任务：' + t.name + '。该任务会' + ((actions.find(a => a.id === t.action_id) || {}).name || t.action_id) + '，可能修改服务器状态。'} onConfirm={() => runNow(t)}>
                                    <Button size="small" type="link">立即执行</Button>
                                </Popconfirm>}
                            {hasPerm('task:execute') && t.last_status === 'running' &&
                                <Popconfirm title="取消正在执行的任务？" onConfirm={() => cancelTask(t)}>
                                    <Button size="small" type="link" danger>取消</Button>
                                </Popconfirm>}
                            <Button size="small" type="link" onClick={() => openDetail(t.id)}>详情</Button>
                            {hasPerm('task:manage') && <Button size="small" type="link" onClick={() => toggleTask(t)}>{t.enabled ? '停用' : '启用'}</Button>}
                            {hasPerm('task:manage') && <Button size="small" type="link" onClick={() => openEdit(t)}>编辑</Button>}
                            {hasPerm('task:delete') && <Popconfirm title="删除该任务？" description="执行历史将保留，任务定义不可恢复。" onConfirm={() => removeTask(t)}>
                                <Button size="small" type="link" danger>删除</Button>
                            </Popconfirm>}
                        </Space>
                    ),
                },
            ].filter(c => !(isMobile && ['type', 'next_run_at', 'last_run_at'].includes(c.dataIndex || c.key)));

            return (
                <ConfigProvider theme={{ algorithm: isDark ? darkAlgorithm : undefined, token: { colorBgLayout: isDark ? '#141414' : '#f5f5f5', colorBgContainer: isDark ? '#1f1f1f' : '#ffffff' } }}>
                    <div style={{ minHeight: '100vh', background: isDark ? '#141414' : '#f5f5f5' }}>
                        <OpsTopbar active="tasks" isDark={isDark} setIsDark={setIsDark} hasPerm={hasPerm} />
                        <div className="sec-wrap">
                            {/* ===== 统计卡 ===== */}
                            <div className="task-stat-grid">
                                <div className="task-stat"><div className="ts-label">运行中</div><div className="ts-value" style={{ color: stats && stats.running > 0 ? 'var(--color-primary)' : undefined }}>{stats ? stats.running : '—'}</div></div>
                                <div className="task-stat"><div className="ts-label">计划任务</div><div className="ts-value">{stats ? stats.scheduled : '—'}</div></div>
                                <div className="task-stat"><div className="ts-label">失败任务（24h）</div><div className="ts-value" style={{ color: stats && stats.failed_24h > 0 ? 'var(--color-error)' : undefined }}>{stats ? stats.failed_24h : '—'}</div></div>
                                <div className="task-stat"><div className="ts-label">今日完成</div><div className="ts-value" style={{ color: 'var(--color-success)' }}>{stats ? stats.done_today : '—'}</div></div>
                            </div>

                            {/* ===== 任务列表 ===== */}
                            <Card size="small" title={<span><UIIcon name="UnorderedListOutlined" /> 运维任务</span>}
                                extra={
                                    <Space size={8} wrap>
                                        <Button size="small" icon={<UIIcon name="AppstoreOutlined" />} onClick={() => { getJSON(baseUrl + '/api/task/templates').then(setTemplates).catch(e => message.error(e.message)); setTemplatesOpen(true); }}>任务模板</Button>
                                        {hasPerm('task:manage') && <Button size="small" type="primary" icon={<UIIcon name="PlusOutlined" />} onClick={openCreate}>创建任务</Button>}
                                    </Space>
                                }>
                                {!data ? (
                                    <div style={{ padding: 24, textAlign: 'center', color: 'var(--color-text-tertiary)' }}>加载中...</div>
                                ) : tasks.length === 0 ? (
                                    <Empty image={Empty.PRESENTED_IMAGE_SIMPLE} description="还没有运维任务，可从任务模板快速创建" />
                                ) : isMobile ? (
                                    tasks.map(t => (
                                        <div key={t.id} className="task-card-m">
                                            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                                                <Typography.Text strong>{t.name}</Typography.Text>
                                                <StatusTag s={t.last_status} />
                                            </div>
                                            <div style={{ fontSize: 12, color: 'var(--color-text-tertiary)', marginTop: 6 }}>
                                                {TYPE_LABEL[t.type]} · {scheduleText(t)}
                                            </div>
                                            <div style={{ fontSize: 12, color: 'var(--color-text-tertiary)', marginTop: 2 }}>
                                                下次 {t.next_run_at ? fmtTime(t.next_run_at) : '—'} · 最近 {t.last_run_at ? fmtTime(t.last_run_at) : '未执行'}
                                            </div>
                                            <div style={{ marginTop: 8 }}>{taskCols.find(c => c.key === 'ops').render(null, t)}</div>
                                        </div>
                                    ))
                                ) : (
                                    <Table rowKey="id" size="small" columns={taskCols} dataSource={tasks} pagination={false} scroll={{ x: 1020 }} />
                                )}
                            </Card>

                            {/* ===== 即将执行 ===== */}
                            <Card size="small" title={<span><UIIcon name="FieldTimeOutlined" /> 即将执行</span>} style={{ marginTop: 16 }}>
                                {upcoming.length === 0 ? (
                                    <Empty image={Empty.PRESENTED_IMAGE_SIMPLE} description="没有已启用的定时任务" />
                                ) : (
                                    <div className="task-up-next">
                                        {upcoming.map(t => (
                                            <div key={t.id} className="task-up-item">
                                                <span className="task-up-time">{t.next_run_at ? dayjs(t.next_run_at).format('MM-DD HH:mm') : '—'}</span>
                                                <Typography.Text>{t.name}</Typography.Text>
                                                <Typography.Text type="secondary" style={{ fontSize: 12 }}>{scheduleText(t)}</Typography.Text>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </Card>
                        </div>

                        {/* ===== 任务详情 Drawer ===== */}
                        <Drawer open={!!detail} onClose={() => setDetail(null)} width={isMobile ? '100%' : 520} title={detail ? detail.task.name : ''}>
                            {detail && (
                                <>
                                    <Descriptions size="small" column={1} bordered items={[
                                        { key: 'st', label: '状态', children: <Space>{detail.task.enabled ? <Tag color="success" style={{ marginRight: 0 }}>启用</Tag> : <Tag style={{ marginRight: 0 }}>停用</Tag>}<StatusTag s={detail.task.last_status} /></Space> },
                                        { key: 'ty', label: '类型', children: TYPE_LABEL[detail.task.type] },
                                        { key: 'sc', label: '执行计划', children: <span className="rem-mono">{scheduleText(detail.task)}</span> },
                                        { key: 'ac', label: '执行动作', children: (actions.find(a => a.id === detail.task.action_id) || {}).name || detail.task.action_id },
                                        { key: 'next', label: '下次执行', children: detail.task.next_run_at ? fmtTime(detail.task.next_run_at) : '—' },
                                        { key: 'last', label: '最近执行', children: detail.task.last_run_at ? fmtTime(detail.task.last_run_at) : '未执行' },
                                        { key: 'by', label: '创建人', children: detail.task.created_by || '—' },
                                        detail.task.description ? { key: 'de', label: '说明', children: detail.task.description } : null,
                                    ].filter(Boolean)} />
                                    <Typography.Text strong style={{ display: 'block', margin: '16px 0 8px' }}>执行历史（最近 {detail.executions.length} 次）</Typography.Text>
                                    {detail.executions.length === 0 ? (
                                        <Empty image={Empty.PRESENTED_IMAGE_SIMPLE} description="尚未执行过" />
                                    ) : (
                                        detail.executions.map(e => (
                                            <div key={e.id} className="task-card-m" style={{ marginBottom: 8 }}>
                                                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                                                    <Typography.Text style={{ fontSize: 13 }}>{fmtTime(e.created_at)} · {{ schedule: '计划', manual: '手动', event: '事件', retry: '重试' }[e.trigger_type] || e.trigger_type}</Typography.Text>
                                                    <Space size={6}>
                                                        <span style={{ fontSize: 12, color: 'var(--color-text-tertiary)' }}>{fmtDuration(e.duration_ms)}</span>
                                                        <StatusTag s={e.status} />
                                                    </Space>
                                                </div>
                                                {e.error_message && <div style={{ fontSize: 12, color: 'var(--color-error)', marginTop: 4 }}>{e.error_message}</div>}
                                            </div>
                                        ))
                                    )}
                                    <div style={{ marginTop: 12 }}>
                                        {window.localStorage.getItem && <Button size="small" type="link" onClick={() => window.location.href = 'task-history.html'}>查看全部执行历史</Button>}
                                    </div>
                                </>
                            )}
                        </Drawer>

                        {/* ===== 任务模板 Modal ===== */}
                        <Modal open={templatesOpen} onCancel={() => setTemplatesOpen(false)} footer={null} width={isMobile ? '96vw' : 680} title="任务模板（选择后填写参数创建任务）">
                            {!templates ? <div style={{ textAlign: 'center', padding: 24 }}>加载中...</div> : (
                                <div style={{ display: 'grid', gridTemplateColumns: isMobile ? '1fr' : '1fr 1fr', gap: 10 }}>
                                    {templates.map(tpl => (
                                        <div key={tpl.id} style={{ border: '1px solid var(--color-border)', borderRadius: 'var(--radius)', padding: '10px 14px' }}>
                                            <Typography.Text strong>{tpl.name}</Typography.Text>
                                            <div style={{ fontSize: 12, color: 'var(--color-text-tertiary)', margin: '4px 0 8px' }}>{tpl.description}</div>
                                            <Space size={6} style={{ marginBottom: 8 }}>
                                                <Tag style={{ marginRight: 0 }}>{TYPE_LABEL[tpl.type]}</Tag>
                                                {tpl.schedule && <Tag className="rem-mono" style={{ marginRight: 0 }}>{tpl.schedule}</Tag>}
                                                <Tag color="blue" style={{ marginRight: 0 }}>{(actions.find(a => a.id === tpl.action_id) || {}).name || tpl.action_id}</Tag>
                                            </Space>
                                            <div>
                                                <Button size="small" type="primary" disabled={!hasPerm('task:manage')} onClick={() => useTemplate(tpl)}>使用模板</Button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </Modal>

                        {/* ===== 创建/编辑任务 Modal ===== */}
                        <Modal open={editOpen} onCancel={() => setEditOpen(false)} onOk={saveTask} confirmLoading={saving}
                            title={editForm && editForm.id ? '编辑任务' : '创建任务'} okText="保存" width={isMobile ? '96vw' : 640} destroyOnClose>
                            {editForm && (
                                <>
                                    <div style={{ display: 'grid', gridTemplateColumns: isMobile ? '1fr' : '1fr 1fr', gap: '0 16px' }}>
                                        <div style={{ marginBottom: 10 }}>
                                            <Typography.Text style={{ fontSize: 13 }}>任务名称 *</Typography.Text>
                                            <Input value={editForm.name} onChange={e => setEditForm(f => ({ ...f, name: e.target.value }))} placeholder="如：每日安全扫描" />
                                        </div>
                                        <div style={{ marginBottom: 10 }}>
                                            <Typography.Text style={{ fontSize: 13 }}>执行动作 *</Typography.Text>
                                            <Select style={{ width: '100%' }} value={editForm.action_id}
                                                onChange={v => setEditForm(f => ({ ...f, action_id: v, parameters: {} }))}
                                                options={actions.map(a => ({ value: a.id, label: `${a.name}${a.allow_auto ? '' : '（高风险）'}` }))} />
                                        </div>
                                    </div>
                                    <div style={{ marginBottom: 10 }}>
                                        <Typography.Text style={{ fontSize: 13 }}>任务类型 *</Typography.Text>
                                        <Segmented value={editForm.type}
                                            onChange={v => setEditForm(f => ({ ...f, type: v, trigger: v === 'event' ? (f.trigger || { type: 'cpu_high', threshold: 90, cooldown_sec: 600 }) : f.trigger }))}
                                            options={Object.keys(TYPE_LABEL).map(k => ({ value: k, label: TYPE_LABEL[k] }))} />
                                    </div>
                                    {editForm.type === 'cron' && (
                                        <div style={{ marginBottom: 10, border: '1px solid var(--color-border)', borderRadius: 'var(--radius-sm)', padding: 10 }}>
                                            <Space wrap size={8}>
                                                <Select size="small" style={{ width: 110 }} value={editForm.cronForm.freq}
                                                    onChange={v => setEditForm(f => ({ ...f, cronForm: { ...f.cronForm, freq: v } }))}
                                                    options={[{ value: 'minutes', label: '每 N 分钟' }, { value: 'hours', label: '每 N 小时' }, { value: 'daily', label: '每天' }, { value: 'weekly', label: '每周' }, { value: 'custom', label: '自定义 Cron' }]} />
                                                {(editForm.cronForm.freq === 'daily' || editForm.cronForm.freq === 'weekly' || editForm.cronForm.freq === 'hours') &&
                                                    <InputNumber size="small" min={0} max={23} value={editForm.cronForm.hour} onChange={v => setEditForm(f => ({ ...f, cronForm: { ...f.cronForm, hour: v } }))} addonAfter="时" style={{ width: 90 }} />}
                                                {(editForm.cronForm.freq === 'daily' || editForm.cronForm.freq === 'weekly' || editForm.cronForm.freq === 'hours') &&
                                                    <InputNumber size="small" min={0} max={59} value={editForm.cronForm.minute} onChange={v => setEditForm(f => ({ ...f, cronForm: { ...f.cronForm, minute: v } }))} addonAfter="分" style={{ width: 90 }} />}
                                                {editForm.cronForm.freq === 'weekly' &&
                                                    <Select size="small" style={{ width: 90 }} value={editForm.cronForm.week} onChange={v => setEditForm(f => ({ ...f, cronForm: { ...f.cronForm, week: v } }))} options={WEEK_OPTS} />}
                                                {(editForm.cronForm.freq === 'minutes' || editForm.cronForm.freq === 'hours') &&
                                                    <InputNumber size="small" min={1} max={59} value={editForm.cronForm.interval} onChange={v => setEditForm(f => ({ ...f, cronForm: { ...f.cronForm, interval: v } }))} addonAfter={editForm.cronForm.freq === 'minutes' ? '分钟' : '小时'} style={{ width: 100 }} />}
                                                {editForm.cronForm.freq === 'custom' &&
                                                    <Input size="small" style={{ width: 160 }} placeholder="分 时 日 月 周" value={editForm.schedule}
                                                        onChange={e => setEditForm(f => ({ ...f, schedule: e.target.value }))} />}
                                            </Space>
                                            {editForm.cronForm.freq !== 'custom' &&
                                                <Typography.Paragraph type="secondary" style={{ fontSize: 12, margin: '6px 0 0' }}>Cron：{buildCron(editForm.cronForm)}</Typography.Paragraph>}
                                        </div>
                                    )}
                                    {editForm.type === 'interval' && (
                                        <div style={{ marginBottom: 10 }}>
                                            <InputNumber min={60} value={editForm.interval_seconds} onChange={v => setEditForm(f => ({ ...f, interval_seconds: v }))} addonAfter="秒（最小 60）" style={{ width: 200 }} />
                                        </div>
                                    )}
                                    {editForm.type === 'once' && (
                                        <div style={{ marginBottom: 10 }}>
                                            <Input size="small" style={{ width: 200 }} placeholder="YYYY-MM-DDTHH:mm:ss"
                                                value={editForm.run_at_local || ''} onChange={e => setEditForm(f => ({ ...f, run_at_local: e.target.value, run_at: e.target.value + ':00' }))} />
                                            <Typography.Paragraph type="secondary" style={{ fontSize: 12, margin: '4px 0 0' }}>填写未来时间，例如 2026-09-20T03:00:00（执行一次后自动停用）</Typography.Paragraph>
                                        </div>
                                    )}
                                    {editForm.type === 'event' && editForm.trigger && (
                                        <div style={{ marginBottom: 10, border: '1px solid var(--color-border)', borderRadius: 'var(--radius-sm)', padding: 10 }}>
                                            <Space wrap size={8}>
                                                <Select size="small" style={{ width: 200 }} value={editForm.trigger.type}
                                                    onChange={v => setEditForm(f => ({ ...f, trigger: { ...f.trigger, type: v } }))}
                                                    options={EVENT_TYPES} />
                                                {['cpu_high', 'disk_high', 'ip_abnormal', 'security_finding'].includes(editForm.trigger.type) &&
                                                    <InputNumber size="small" min={0} max={100} value={editForm.trigger.threshold} onChange={v => setEditForm(f => ({ ...f, trigger: { ...f.trigger, threshold: v } }))} addonAfter={editForm.trigger.type === 'security_finding' ? '最低级别' : '%'} style={{ width: 120 }} />}
                                                {['service_stopped', 'docker_container_exit', 'security_finding'].includes(editForm.trigger.type) &&
                                                    <Input size="small" style={{ width: 140 }} placeholder="过滤（可选）" value={editForm.trigger.match}
                                                        onChange={e => setEditForm(f => ({ ...f, trigger: { ...f.trigger, match: e.target.value } }))} />}
                                            </Space>
                                            <Typography.Paragraph type="secondary" style={{ fontSize: 12, margin: '6px 0 0' }}>
                                                触发冷却 {Math.round((editForm.trigger.cooldown_sec || 600) / 60)} 分钟，避免条件持续满足时重复触发。
                                            </Typography.Paragraph>
                                        </div>
                                    )}
                                    <Typography.Text strong style={{ fontSize: 13 }}>动作参数</Typography.Text>
                                    <div style={{ margin: '8px 0', border: '1px solid var(--color-border)', borderRadius: 'var(--radius-sm)', padding: '10px 12px' }}>
                                        <ParamFields spec={(selectedAction || {}).params || []} params={editForm.parameters}
                                            setParams={m => setEditForm(f => ({ ...f, parameters: { ...m } }))} />
                                    </div>
                                    <div style={{ display: 'grid', gridTemplateColumns: isMobile ? '1fr' : '1fr 1fr 1fr', gap: '0 16px' }}>
                                        <div style={{ marginBottom: 10 }}>
                                            <Typography.Text style={{ fontSize: 13 }}>超时（秒）</Typography.Text>
                                            <InputNumber style={{ width: '100%' }} min={30} max={3600} value={editForm.timeout_seconds} onChange={v => setEditForm(f => ({ ...f, timeout_seconds: v }))} />
                                        </div>
                                        <div style={{ marginBottom: 10 }}>
                                            <Typography.Text style={{ fontSize: 13 }}>失败重试</Typography.Text>
                                            <InputNumber style={{ width: '100%' }} min={1} max={5} value={editForm.max_attempts} onChange={v => setEditForm(f => ({ ...f, max_attempts: v }))} addonAfter="次" />
                                        </div>
                                        <div style={{ marginBottom: 10 }}>
                                            <Typography.Text style={{ fontSize: 13 }}>重试间隔（秒）</Typography.Text>
                                            <InputNumber style={{ width: '100%' }} min={0} max={3600} value={editForm.retry_backoff_seconds} onChange={v => setEditForm(f => ({ ...f, retry_backoff_seconds: v }))} />
                                        </div>
                                    </div>
                                    <Alert type="info" showIcon
                                        message="任务只能执行白名单动作；同一任务上一轮未结束时下一轮自动跳过（执行锁）。" />
                                </>
                            )}
                        </Modal>
                    </div>
                </ConfigProvider>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>

</html>
