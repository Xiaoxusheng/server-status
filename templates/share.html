<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow">
    <title>分享卡片</title>
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%201024%201024%22%20fill%3D%22%231677ff%22%3E%3Cpath%20d%3D%22M704%20446H320c-4.4%200-8%203.6-8%208v402c0%204.4%203.6%208%208%208h384c4.4%200%208-3.6%208-8V454c0-4.4-3.6-8-8-8zm-328%2064h272v117H376V510zm272%20290H376V683h272v117z%22%2F%3E%3Cpath%20d%3D%22M424%20748a32%2032%200%201%200%2064%200%2032%2032%200%201%200-64%200zm0-178a32%2032%200%201%200%2064%200%2032%2032%200%201%200-64%200z%22%2F%3E%3Cpath%20d%3D%22M811.4%20368.9C765.6%20248%20648.9%20162%20512.2%20162S258.8%20247.9%20213%20368.8C126.9%20391.5%2063.5%20470.2%2064%20563.6%2064.6%20668%20145.6%20752.9%20247.6%20762c4.7.4%208.7-3.3%208.7-8v-60.4c0-4-3-7.4-7-7.9-27-3.4-52.5-15.2-72.1-34.5-24-23.5-37.2-55.1-37.2-88.6%200-28%209.1-54.4%2026.2-76.4%2016.7-21.4%2040.2-36.9%2066.1-43.7l37.9-10%2013.9-36.7c8.6-22.8%2020.6-44.2%2035.7-63.5%2014.9-19.2%2042.4-50%2052.4-50%2041.1-28.9%2089.5-44.2%20140-44.2s98.9%2015.3%20140%2044.3c19.9%2014%2037.5%2030.8%2052.4%2050%2015.1%2019.3%2027.1%2040.7%2035.7%2063.5l13.8%2036.6%2037.8%2010c54.2%2014.4%2092.1%2063.7%2092.1%20120%200%2033.6-13.2%2065.1-37.2%2088.6-19.5%2019.2-44.9%2031.1-71.9%2034.5-4%20.5-6.9%203.9-6.9%207.9V754c0%204.7%204.1%208.4%208.8%208%20101.7-9.2%20182.5-94%20183.2-198.2.6-93.4-62.7-172.1-148.6-194.9z%22%2F%3E%3C%2Fsvg%3E">
    <!-- 公开分享页：零外部依赖（不加载 React/antd/Babel CDN），外部访客任何网络环境都能秒开 -->
    <link rel="stylesheet" href="/ui.css">
    <style>
        /* warning 配色（页面专有，其余令牌来自 ui.css） */
        html {
            --warn-bg: #fffbe6;
            --warn-border: #ffe58f;
            --warn-text: #d48806;
        }

        html.dark {
            --warn-bg: #2b2111;
            --warn-border: #594214;
            --warn-text: #ffd666;
        }

        html,
        body,
        #root {
            margin: 0;
            min-height: 100%;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        * {
            box-sizing: border-box;
        }

        /* 页面容器：内容纵列居中，视觉中心交给卡片 */
        .share-wrap {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 28px 16px 22px;
        }

        .share-page {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: fade-up .25s ease both;
        }

        @keyframes fade-up {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: none;
            }
        }

        @media (prefers-reduced-motion: reduce) {

            .share-page,
            .share-pw {
                animation: none;
            }
        }

        /* 顶部轻量分享标识 */
        .share-top {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            letter-spacing: 2px;
            color: var(--secondary);
            margin-bottom: 14px;
        }

        .share-top svg {
            opacity: .75;
        }

        /* 卡片本体：相框包图片 + 下方信息区（拍立得式） */
        .share-card {
            width: 100%;
            max-width: 460px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 10px 10px 6px;
            box-shadow: var(--shadow-overlay);
        }

        .card-img-btn {
            display: block;
            width: 100%;
            padding: 0;
            border: none;
            background: none;
            cursor: zoom-in;
            border-radius: 10px;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .card-img-btn img {
            display: block;
            width: 100%;
            height: auto;
            max-height: min(72vh, 720px);
            object-fit: contain;
            border-radius: 10px;
            background: var(--border);
            transition: transform .2s ease, opacity .2s ease;
        }

        /* 桌面端 hover：极轻的放大反馈 */
        @media (hover: hover) {
            .card-img-btn:hover img {
                transform: scale(1.01);
            }
        }

        .card-img-btn:active img {
            opacity: .88;
        }

        /* 信息区：标题 > 时间/类型/有效期 层级 */
        .share-info {
            padding: 12px 6px 8px;
        }

        .info-title {
            margin: 0;
            font-size: 15px;
            font-weight: 600;
            line-height: 1.5;
            color: var(--text);
            word-break: break-word;
        }

        .info-meta {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            column-gap: 12px;
            row-gap: 4px;
            margin-top: 6px;
            font-size: 12px;
            color: var(--secondary);
        }

        .info-meta .m-item {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .info-meta svg {
            opacity: .8;
        }

        /* 操作区：轻量图标 + 短文字的胶囊按钮 */
        .share-actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-top: 18px;
        }

        .act-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            height: 38px;
            padding: 0 16px;
            font-size: 13px;
            border-radius: 19px;
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--text);
            cursor: pointer;
            transition: border-color .18s ease, color .18s ease, transform .18s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .act-btn svg {
            opacity: .8;
        }

        @media (hover: hover) {
            .act-btn:hover {
                color: var(--primary);
                border-color: var(--primary);
            }
        }

        .act-btn:active {
            transform: scale(.97);
        }

        /* 品牌信息：极弱、不抢焦点 */
        .share-brand {
            margin-top: 22px;
            font-size: 11px;
            letter-spacing: .3px;
            color: var(--secondary);
            opacity: .65;
            text-decoration: none;
        }

        .share-brand:hover {
            text-decoration: underline;
        }

        /* ================= 密码验证 / 失效提示（保持原有行为） ================= */
        .share-pw {
            width: 100%;
            max-width: 400px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
            padding: 32px 28px;
            text-align: center;
            box-shadow: var(--shadow-overlay);
            animation: fade-up .25s ease both;
        }

        .share-pw .pw-lock {
            font-size: 24px;
            color: var(--color-text-tertiary);
            margin-bottom: 12px;
        }

        .share-pw h3 {
            margin: 0 0 4px;
            font-size: 17px;
        }

        .share-pw .pw-sub {
            font-size: 13px;
            color: var(--secondary);
            margin-bottom: 18px;
        }

        /* antd 风格输入框 */
        .ant-input {
            width: 100%;
            height: 40px;
            padding: 4px 11px;
            font-size: 15px;
            color: var(--text);
            background: var(--card);
            border: 1px solid var(--border-strong);
            border-radius: 8px;
            outline: none;
            transition: border-color .2s, box-shadow .2s;
        }

        .ant-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(22, 119, 255, .15);
        }

        /* antd 风格按钮 */
        .ant-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            height: 40px;
            padding: 0 18px;
            font-size: 15px;
            border-radius: 8px;
            border: 1px solid var(--border-strong);
            background: var(--card);
            color: var(--text);
            cursor: pointer;
            transition: color .2s, border-color .2s, background .2s;
            -webkit-tap-highlight-color: transparent;
        }

        .ant-btn:hover {
            color: var(--primary);
            border-color: var(--primary);
        }

        .ant-btn.primary {
            background: var(--primary);
            border-color: var(--primary);
            color: #fff;
        }

        .ant-btn.primary:hover {
            background: var(--primary-hover);
            border-color: var(--primary-hover);
            color: #fff;
        }

        .ant-btn.block {
            width: 100%;
            margin-top: 14px;
        }

        .ant-btn:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        /* antd Alert(warning) 风格 */
        .share-alert {
            width: 100%;
            max-width: 560px;
            display: flex;
            align-items: flex-start;
            gap: 10px;
            background: var(--warn-bg);
            border: 1px solid var(--warn-border);
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 14px;
            color: var(--warn-text);
        }

        .share-alert .alert-icon {
            font-size: 16px;
            line-height: 1.4;
        }

        .share-alert .alert-title {
            font-weight: 600;
        }

        .share-alert .alert-desc {
            font-size: 13px;
            color: var(--secondary);
            margin-top: 2px;
        }

        /* 加载 spinner */
        .spin {
            width: 32px;
            height: 32px;
            border: 3px solid rgba(22, 119, 255, .2);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin .8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .pw-error {
            margin-top: 10px;
            font-size: 13px;
            color: #ff4d4f;
            text-align: left;
        }

        /* ================= 沉浸式图片预览 ================= */
        .viewer {
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            z-index: 1000;
            background: rgba(0, 0, 0, .93);
            /* 独立合成层：修复 iOS Safari 下子元素 transform 动画导致遮罩背景不被绘制的合成 bug */
            transform: translateZ(0);
            opacity: 0;
            visibility: hidden;
            transition: opacity .2s ease, visibility .2s ease;
        }

        .viewer.open {
            opacity: 1;
            visibility: visible;
        }

        .viewer-top {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            z-index: 2;
        }

        .viewer-count {
            font-size: 13px;
            color: rgba(255, 255, 255, .75);
            font-variant-numeric: tabular-nums;
            min-width: 44px;
        }

        .viewer-close {
            width: 36px;
            height: 36px;
            margin-left: auto;
            border: none;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, .85);
            background: rgba(255, 255, 255, .1);
            cursor: pointer;
            transition: background .18s ease;
        }

        .viewer-close:hover {
            background: rgba(255, 255, 255, .22);
        }

        .viewer-stage {
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 56px 16px 64px;
        }

        .viewer-stage img {
            max-width: min(94vw, 1200px);
            max-height: 100%;
            border-radius: 8px;
            user-select: none;
            -webkit-user-drag: none;
            transition: opacity .2s ease, transform .2s ease;
        }

        .viewer-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            z-index: 2;
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, .85);
            background: rgba(255, 255, 255, .1);
            cursor: pointer;
            transition: background .18s ease;
        }

        .viewer-nav:hover {
            background: rgba(255, 255, 255, .22);
        }

        .viewer-nav.prev {
            left: 14px;
        }

        .viewer-nav.next {
            right: 14px;
        }

        .viewer-bottom {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 14px 18px calc(14px + env(safe-area-inset-bottom));
        }

        .viewer-title {
            flex: 1;
            min-width: 0;
            font-size: 12px;
            color: rgba(255, 255, 255, .55);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .viewer-dl {
            flex: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            height: 34px;
            padding: 0 14px;
            font-size: 12px;
            border-radius: 17px;
            border: none;
            color: rgba(255, 255, 255, .9);
            background: rgba(255, 255, 255, .12);
            cursor: pointer;
            transition: background .18s ease;
        }

        .viewer-dl:hover {
            background: rgba(255, 255, 255, .24);
        }

        /* 桌面才有左右箭头，移动端使用滑动 */
        @media (hover: none) {
            .viewer-nav {
                display: none;
            }

            .viewer-stage {
                padding: 52px 8px 60px;
            }
        }

        /* ================= 二维码浮层 ================= */
        .qr-mask {
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            z-index: 1100;
            background: rgba(0, 0, 0, .55);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            visibility: hidden;
            transition: opacity .2s ease, visibility .2s ease;
        }

        .qr-mask.open {
            opacity: 1;
            visibility: visible;
        }

        .qr-box {
            background: var(--card);
            border-radius: 14px;
            padding: 22px 22px 18px;
            text-align: center;
            transform: translateY(6px);
            transition: transform .2s ease;
        }

        .qr-mask.open .qr-box {
            transform: none;
        }

        .qr-box img {
            display: block;
            width: 220px;
            height: 220px;
            border-radius: 8px;
            background: #fff;
        }

        .qr-box .qr-tip {
            margin-top: 12px;
            font-size: 12px;
            color: var(--secondary);
        }

        .qr-box .qr-close {
            margin-top: 14px;
            width: 100%;
            height: 36px;
            border-radius: 18px;
            border: 1px solid var(--border);
            background: none;
            color: var(--text);
            font-size: 13px;
            cursor: pointer;
            transition: border-color .18s ease, color .18s ease;
        }

        .qr-box .qr-close:hover {
            color: var(--primary);
            border-color: var(--primary);
        }

        /* 轻提示 toast */
        .toast {
            position: fixed;
            left: 50%;
            bottom: 34px;
            transform: translateX(-50%) translateY(8px);
            z-index: 1200;
            background: rgba(0, 0, 0, .78);
            color: #fff;
            font-size: 13px;
            padding: 8px 16px;
            border-radius: 18px;
            opacity: 0;
            pointer-events: none;
            transition: opacity .2s ease, transform .2s ease;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%);
        }

        /* 移动端：充分利用屏宽 */
        @media (max-width: 480px) {
            .share-wrap {
                padding: 20px 12px 16px;
            }

            .share-page {
                max-width: 100%;
            }

            .share-card {
                max-width: 100%;
                padding: 8px 8px 4px;
            }

            .card-img-btn img {
                max-height: 64vh;
            }

            .share-actions {
                gap: 8px;
            }

            .act-btn {
                padding: 0 13px;
                height: 40px;
            }
        }
    </style>
    <script>
        (function () {
            try {
                // 访客无历史偏好时回退跟随系统深浅色
                var dark = localStorage.getItem('theme');
                if (dark === null) {
                    dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                }
                document.documentElement.classList.toggle('dark', dark === 'dark' || dark === true);
            } catch (e) { }
        })();
    </script>
</head>

<body>
    <div id="root"></div>

    <!-- 沉浸式预览层（默认隐藏） -->
    <div class="viewer" id="viewer" aria-hidden="true">
        <div class="viewer-top">
            <div class="viewer-count" id="viewer-count"></div>
            <button class="viewer-close" id="viewer-close" aria-label="关闭"></button>
        </div>
        <div class="viewer-stage" id="viewer-stage">
            <img id="viewer-img" alt="卡片大图" draggable="false" />
        </div>
        <button class="viewer-nav prev" id="viewer-prev" aria-label="上一张"></button>
        <button class="viewer-nav next" id="viewer-next" aria-label="下一张"></button>
        <div class="viewer-bottom">
            <div class="viewer-title" id="viewer-title"></div>
            <button class="viewer-dl" id="viewer-dl" style="display:none"></button>
        </div>
    </div>

    <!-- 二维码浮层 -->
    <div class="qr-mask" id="qr-mask" aria-hidden="true">
        <div class="qr-box">
            <img id="qr-img" alt="分享二维码" />
            <div class="qr-tip">扫码查看这张卡片</div>
            <button class="qr-close" id="qr-close">关闭</button>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        (function () {
            var token = window.location.pathname.replace(/^\/card\//, '').replace(/\/$/, '') || '';
            var cardData = null;

            // ==================== 内联 SVG 图标（零依赖） ====================
            var ICONS = {
                send: '<line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>',
                link: '<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>',
                download: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>',
                qr: '<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><line x1="14" y1="14" x2="14" y2="21"/><line x1="18" y1="14" x2="21" y2="14"/><line x1="21" y1="17.5" x2="21" y2="21"/><line x1="14" y1="18" x2="17" y2="21"/>',
                x: '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',
                prev: '<polyline points="15 18 9 12 15 6"/>',
                next: '<polyline points="9 18 15 12 9 6"/>',
                clock: '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
                image: '<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/>',
                calendar: '<rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>'
            };
            function icon(name, size) {
                return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
                    'stroke-linecap="round" stroke-linejoin="round" width="' + (size || 15) + '" height="' + (size || 15) + '">' +
                    (ICONS[name] || '') + '</svg>';
            }

            // ==================== 工具 ====================
            function pad(n) { return n < 10 ? '0' + n : '' + n; }
            function fmtDate(s) {
                var d = s ? new Date(s) : null;
                if (!d || isNaN(d.getTime())) return '';
                return d.getFullYear() + '.' + pad(d.getMonth() + 1) + '.' + pad(d.getDate());
            }
            function escHtml(s) {
                return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
            }
            var TEMPLATE_LABEL = { simple: '简洁', xhs: '小红书', dark: '深色', image: '图片', travel: '旅行', server: '服务器' };
            var toastTimer = null;
            function toast(msg) {
                var t = document.getElementById('toast');
                t.textContent = msg;
                t.classList.add('show');
                clearTimeout(toastTimer);
                toastTimer = setTimeout(function () { t.classList.remove('show'); }, 1800);
            }
            function copyText(text, okMsg) {
                // 优先 Clipboard API，失败降级 execCommand（iOS Safari / 微信内核）
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(text).then(function () { toast(okMsg); }, function () { fallbackCopy(text, okMsg); });
                    return;
                }
                fallbackCopy(text, okMsg);
            }
            function fallbackCopy(text, okMsg) {
                try {
                    var ta = document.createElement('textarea');
                    ta.value = text;
                    ta.setAttribute('readonly', '');
                    ta.style.position = 'fixed';
                    ta.style.top = '-9999px';
                    ta.style.opacity = '0';
                    document.body.appendChild(ta);
                    ta.focus();
                    ta.select();
                    ta.setSelectionRange(0, ta.value.length);
                    document.execCommand('copy');
                    document.body.removeChild(ta);
                    toast(okMsg);
                } catch (e) { toast('复制失败，请长按链接手动复制'); }
            }
            function shareUrl() { return window.location.origin + '/card/' + encodeURIComponent(token); }

            // ==================== 各状态渲染 ====================
            function renderLoading() {
                document.getElementById('root').innerHTML =
                    '<div class="share-wrap"><div class="spin"></div></div>';
            }

            function renderInvalid() {
                document.getElementById('root').innerHTML =
                    '<div class="share-wrap">' +
                    '  <div class="share-alert">' +
                    '    <div class="alert-icon">&#9888;&#65039;</div>' +
                    '    <div><div class="alert-title">\u5206\u4eab\u4e0d\u5b58\u5728\u6216\u5df2\u5931\u6548</div>' +
                    '    <div class="alert-desc">\u94fe\u63a5\u53ef\u80fd\u5df2\u8fc7\u671f\u3001\u88ab\u64a4\u9500\u6216\u94fe\u63a5\u4e0d\u5b8c\u6574\uff0c\u8bf7\u8054\u7cfb\u5206\u4eab\u8005\u91cd\u65b0\u83b7\u53d6\u3002</div></div>' +
                    '  </div>' +
                    '</div>';
            }

            function renderPassword() {
                document.getElementById('root').innerHTML =
                    '<div class="share-wrap">' +
                    '  <div class="share-pw">' +
                    '    <div class="pw-lock">🔒</div>' +
                    '    <h3>\u6b64\u5206\u4eab\u9700\u8981\u5bc6\u7801</h3>' +
                    '    <div class="pw-sub">\u8bf7\u8f93\u5165\u5206\u4eab\u8005\u8bbe\u7f6e\u7684\u8bbf\u95ee\u5bc6\u7801</div>' +
                    '    <input class="ant-input" id="pw" type="password" placeholder="\u8bbf\u95ee\u5bc6\u7801" autocomplete="off" />' +
                    '    <div class="pw-error" id="pw-err" style="display:none"></div>' +
                    '    <button class="ant-btn primary block" id="verify-btn">\u67e5\u770b\u5361\u7247</button>' +
                    '  </div>' +
                    '</div>';
                var input = document.getElementById('pw');
                var btn = document.getElementById('verify-btn');
                var err = document.getElementById('pw-err');
                var submit = function () {
                    var pw = input.value;
                    if (!pw) { err.textContent = '\u8bf7\u8f93\u5165\u8bbf\u95ee\u5bc6\u7801'; err.style.display = 'block'; return; }
                    btn.disabled = true;
                    btn.textContent = '\u9a8c\u8bc1\u4e2d\u2026';
                    fetch('/api/share/' + encodeURIComponent(token) + '/verify', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        credentials: 'include',
                        body: JSON.stringify({ password: pw })
                    }).then(function (r) { return r.json(); }).then(function (d) {
                        if (d && (d.code === 200 || d.code === 0)) {
                            // cookie 已下发；has_password 恒为 true，重新 load() 会回到密码页，
                            // 因此直接用首次拉取的元数据渲染卡片
                            if (cardData) renderCard(cardData); else load();
                        }
                        else { err.textContent = '\u5bc6\u7801\u9519\u8bef'; err.style.display = 'block'; btn.disabled = false; btn.textContent = '\u67e5\u770b\u5361\u7247'; }
                    }).catch(function () {
                        err.textContent = '\u7f51\u7edc\u9519\u8bef\uff0c\u8bf7\u91cd\u8bd5';
                        err.style.display = 'block';
                        btn.disabled = false;
                        btn.textContent = '\u67e5\u770b\u5361\u7247';
                    });
                };
                btn.addEventListener('click', submit);
                input.addEventListener('keydown', function (e) { if (e.key === 'Enter') submit(); });
                input.focus();
            }

            // ==================== 沉浸式图片预览 ====================
            // imgs 为图片列表（当前分享为单图，结构上支持多图：计数/切换/滑动在多图时自动启用）
            var viewerImgs = [], viewerIdx = 0, viewerTitle = '', viewerAllow = false;

            function renderViewer() {
                var v = document.getElementById('viewer');
                var img = document.getElementById('viewer-img');
                var count = document.getElementById('viewer-count');
                var title = document.getElementById('viewer-title');
                var dl = document.getElementById('viewer-dl');
                var it = viewerImgs[viewerIdx] || {};
                img.src = it.url || '';
                count.textContent = viewerImgs.length > 1 ? (viewerIdx + 1) + ' / ' + viewerImgs.length : '';
                title.textContent = viewerTitle;
                dl.style.display = viewerAllow ? '' : 'none';
                document.getElementById('viewer-prev').style.visibility = (viewerImgs.length > 1 && viewerIdx > 0) ? 'visible' : 'hidden';
                document.getElementById('viewer-next').style.visibility = (viewerImgs.length > 1 && viewerIdx < viewerImgs.length - 1) ? 'visible' : 'hidden';
            }

            function openViewer() {
                viewerIdx = 0;
                renderViewer();
                var v = document.getElementById('viewer');
                v.classList.add('open');
                v.setAttribute('aria-hidden', 'false');
                document.body.style.overflow = 'hidden';
            }

            function closeViewer() {
                var v = document.getElementById('viewer');
                v.classList.remove('open');
                v.setAttribute('aria-hidden', 'true');
                document.body.style.overflow = '';
            }

            // 切换（带滑动动画）：当前图向运动方向淡出 160ms → 换 src → 新图从来向滑入；动画期间加锁
            function viewerNav(dir) {
                var ni = viewerIdx + dir;
                if (ni < 0 || ni >= viewerImgs.length) return;
                var img = document.getElementById('viewer-img');
                if (img.dataset.busy) return;
                img.dataset.busy = '1';
                // 滑出：向运动方向淡出
                img.style.opacity = '0';
                img.style.transform = 'translateX(' + (-dir * 48) + 'px)';
                setTimeout(function () {
                    viewerIdx = ni;
                    renderViewer();
                    // 滑入：新图先置于来向，再无过渡跳位后过渡回中
                    img.style.transition = 'none';
                    img.style.transform = 'translateX(' + (dir * 48) + 'px)';
                    img.style.opacity = '0';
                    void img.offsetWidth; // 强制回流，确保起始位置生效
                    img.style.transition = '';
                    img.style.transform = '';
                    img.style.opacity = '';
                    img.dataset.busy = '';
                }, 160);
            }

            function bindViewer() {
                var v = document.getElementById('viewer');
                document.getElementById('viewer-close').innerHTML = icon('x', 18);
                document.getElementById('viewer-prev').innerHTML = icon('prev', 18);
                document.getElementById('viewer-next').innerHTML = icon('next', 18);
                var dlBtn = document.getElementById('viewer-dl');
                dlBtn.innerHTML = icon('download', 14) + '下载';
                dlBtn.addEventListener('click', function (e) {
                    e.stopPropagation();
                    downloadImage();
                });
                document.getElementById('viewer-close').addEventListener('click', closeViewer);
                document.getElementById('viewer-prev').addEventListener('click', function () { viewerNav(-1); });
                document.getElementById('viewer-next').addEventListener('click', function () { viewerNav(1); });
                // 点击遮罩空白关闭（点图片不关闭）
                document.getElementById('viewer-stage').addEventListener('click', function (e) {
                    if (e.target === e.currentTarget) closeViewer();
                });
                // 键盘：Esc 关闭 / 左右切换
                document.addEventListener('keydown', function (e) {
                    if (!v.classList.contains('open')) return;
                    if (e.key === 'Escape') closeViewer();
                    else if (e.key === 'ArrowLeft') viewerNav(-1);
                    else if (e.key === 'ArrowRight') viewerNav(1);
                });
                // 移动端左右滑动切换
                var sx = null;
                v.addEventListener('touchstart', function (e) { sx = e.touches[0].clientX; }, { passive: true });
                v.addEventListener('touchend', function (e) {
                    if (sx === null) return;
                    var dx = e.changedTouches[0].clientX - sx;
                    sx = null;
                    if (dx < -50) viewerNav(1);
                    else if (dx > 50) viewerNav(-1);
                }, { passive: true });
            }

            function downloadImage() {
                var a = document.createElement('a');
                a.href = '/api/share/' + encodeURIComponent(token) + '/image';
                a.download = 'card-' + token + '.png';
                a.click();
            }

            // ==================== 二维码浮层 ====================
            function bindQr() {
                var mask = document.getElementById('qr-mask');
                document.getElementById('qr-close').addEventListener('click', function () { mask.classList.remove('open'); });
                mask.addEventListener('click', function (e) { if (e.target === mask) mask.classList.remove('open'); });
            }

            function openQr() {
                document.getElementById('qr-img').src = '/api/share/' + encodeURIComponent(token) + '/qr?_=' + Date.now();
                document.getElementById('qr-mask').classList.add('open');
            }

            // ==================== 卡片页主渲染 ====================
            function renderCard(data) {
                var allow = !!data.allow_download;
                var title = escHtml(data.title) || '未命名卡片';
                var tplLabel = TEMPLATE_LABEL[data.template] || '卡片';
                var metaItems =
                    '<span class="m-item">' + icon('clock', 12) + fmtDate(data.created_at) + '</span>' +
                    '<span class="m-item">' + icon('image', 12) + escHtml(tplLabel) + '</span>' +
                    (data.expires_at ? '<span class="m-item">' + icon('calendar', 12) + '有效期至 ' + fmtDate(data.expires_at) + '</span>' : '');

                // 顶部轻标识 → 卡片（图片 + 信息）→ 操作区 → 极弱品牌
                document.getElementById('root').innerHTML =
                    '<div class="share-wrap">' +
                    '  <div class="share-page">' +
                    '    <div class="share-top">' + icon('send', 12) + '与你分享</div>' +
                    '    <div class="share-card">' +
                    '      <button class="card-img-btn" id="img-btn" title="点击查看大图">' +
                    '        <img class="card-img" src="/api/share/' + encodeURIComponent(token) + '/image" alt="' + title + '" />' +
                    '      </button>' +
                    '      <div class="share-info">' +
                    '        <h1 class="info-title">' + title + '</h1>' +
                    '        <div class="info-meta">' + metaItems + '</div>' +
                    '      </div>' +
                    '    </div>' +
                    '    <div class="share-actions">' +
                    '      <button class="act-btn" id="share-btn">' + icon('send', 14) + '分享</button>' +
                    '      <button class="act-btn" id="copy-btn">' + icon('link', 14) + '复制链接</button>' +
                    (allow ? '      <button class="act-btn" id="dl-btn">' + icon('download', 14) + '下载</button>' : '') +
                    '      <button class="act-btn" id="qr-btn">' + icon('qr', 14) + '二维码</button>' +
                    '    </div>' +
                    '    <div class="share-brand">Powered by Server Status</div>' +
                    '  </div>' +
                    '</div>';

                // 预览器数据（当前分享为单图，结构支持多图扩展）；监听器已在启动时统一绑定
                viewerImgs = [{ url: '/api/share/' + encodeURIComponent(token) + '/image' }];
                viewerTitle = data.title || '未命名卡片';
                viewerAllow = allow;

                document.getElementById('img-btn').addEventListener('click', openViewer);
                document.getElementById('share-btn').addEventListener('click', function () {
                    // 优先系统级分享（移动端），不支持则降级复制链接
                    if (navigator.share) {
                        navigator.share({ title: document.title, url: shareUrl() }).catch(function () { });
                    } else {
                        copyText(shareUrl(), '链接已复制');
                    }
                });
                document.getElementById('copy-btn').addEventListener('click', function () {
                    copyText(shareUrl(), '链接已复制');
                });
                document.getElementById('qr-btn').addEventListener('click', openQr);
                if (allow) {
                    document.getElementById('dl-btn').addEventListener('click', downloadImage);
                }
            }

            function load() {
                renderLoading();
                fetch('/api/share/' + encodeURIComponent(token) + '/data', { credentials: 'include' })
                    .then(function (r) { return r.json(); })
                    .then(function (d) {
                        if (d && (d.code === 200 || d.code === 0) && d.data && !d.data.invalid) {
                            cardData = d.data;
                            // 浏览器标签页标题跟随卡片标题，分享出去更有辨识度
                            document.title = (cardData.title ? cardData.title + ' · ' : '') + '分享卡片';
                            if (cardData.has_password) renderPassword();
                            else renderCard(cardData);
                        } else {
                            renderInvalid();
                        }
                    })
                    .catch(function () { renderInvalid(); });
            }

            // 预览器与二维码浮层的元素为静态结构，事件只绑定一次
            bindViewer();
            bindQr();
            load();
        })();
    </script>
</body>

</html>
