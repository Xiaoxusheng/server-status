<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow">
    <title>分享卡片</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%201024%201024%22%20fill%3D%22%231677ff%22%3E%3Cpath%20d%3D%22M704%20446H320c-4.4%200-8%203.6-8%208v402c0%204.4%203.6%208%208%208h384c4.4%200%208-3.6%208-8V454c0-4.4-3.6-8-8-8zm-328%2064h272v117H376V510zm272%20290H376V683h272v117z%22%2F%3E%3Cpath%20d%3D%22M424%20748a32%2032%200%201%200%2064%200%2032%2032%200%201%200-64%200zm0-178a32%2032%200%201%200%2064%200%2032%2032%200%201%200-64%200z%22%2F%3E%3Cpath%20d%3D%22M811.4%20368.9C765.6%20248%20648.9%20162%20512.2%20162S258.8%20247.9%20213%20368.8C126.9%20391.5%2063.5%20470.2%2064%20563.6%2064.6%20668%20145.6%20752.9%20247.6%20762c4.7.4%208.7-3.3%208.7-8v-60.4c0-4-3-7.4-7-7.9-27-3.4-52.5-15.2-72.1-34.5-24-23.5-37.2-55.1-37.2-88.6%200-28%209.1-54.4%2026.2-76.4%2016.7-21.4%2040.2-36.9%2066.1-43.7l37.9-10%2013.9-36.7c8.6-22.8%2020.6-44.2%2035.7-63.5%2014.9-19.2%2032.6-36%2052.4-50%2041.1-28.9%2089.5-44.2%20140-44.2s98.9%2015.3%20140%2044.3c19.9%2014%2037.5%2030.8%2052.4%2050%2015.1%2019.3%2027.1%2040.7%2035.7%2063.5l13.8%2036.6%2037.8%2010c54.2%2014.4%2092.1%2063.7%2092.1%20120%200%2033.6-13.2%2065.1-37.2%2088.6-19.5%2019.2-44.9%2031.1-71.9%2034.5-4%20.5-6.9%203.9-6.9%207.9V754c0%204.7%204.1%208.4%208.8%208%20101.7-9.2%20182.5-94%20183.2-198.2.6-93.4-62.7-172.1-148.6-194.9z%22%2F%3E%3C%2Fsvg%3E">
    <style>
        html,
        body,
        #root {
            margin: 0;
            min-height: 100%;
            background: #f5f5f5;
        }

        html.dark,
        html.dark body,
        html.dark #root {
            background: #141414;
        }

        body {
            color: rgba(0, 0, 0, .88);
        }

        html.dark body {
            color: rgba(255, 255, 255, .85);
        }

        * {
            box-sizing: border-box;
        }

        .share-wrap {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 16px;
        }

        .share-card {
            max-width: 560px;
            width: 100%;
            background: #fff;
            border-radius: 14px;
            padding: 20px;
            box-shadow: 0 6px 24px rgba(0, 0, 0, .08);
        }

        html.dark .share-card {
            background: #1f1f1f;
            box-shadow: 0 6px 24px rgba(0, 0, 0, .35);
        }

        .share-card img.card-img {
            width: 100%;
            border-radius: 10px;
            display: block;
            background: #f0f0f0;
        }

        .share-brand {
            text-align: center;
            margin-top: 18px;
            font-size: 13px;
            color: rgba(0, 0, 0, .35);
        }

        html.dark .share-brand {
            color: rgba(255, 255, 255, .35);
        }

        .share-pw {
            max-width: 400px;
            width: 100%;
            background: #fff;
            border-radius: 14px;
            padding: 28px;
            text-align: center;
            box-shadow: 0 6px 24px rgba(0, 0, 0, .08);
        }

        html.dark .share-pw {
            background: #1f1f1f;
        }

        .share-pw h3 {
            margin: 8px 0 4px;
        }

        .share-expired {
            color: rgba(0, 0, 0, .45);
            text-align: center;
            margin-top: 30px;
        }

        .btn-row {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 14px;
            flex-wrap: wrap;
        }
    </style>
    <script>
        (function () {
            try {
                var dark = localStorage.getItem('theme') === 'dark';
                document.documentElement.classList.toggle('dark', dark);
            } catch (e) { }
        })();
    </script>
    <script crossorigin src="https://registry.npmmirror.com/react/18.3.1/files/umd/react.production.min.js"></script>
    <script crossorigin
        src="https://registry.npmmirror.com/react-dom/18.3.1/files/umd/react-dom.production.min.js"></script>
    <script src="https://registry.npmmirror.com/antd/5.21.6/files/dist/antd.min.js"></script>
    <script src="https://registry.npmmirror.com/@babel/standalone/7.24.7/files/babel.min.js"></script>
</head>

<body>
    <div id="root"></div>
    <script type="text/babel">
        const { Button, Input, message, Spin, ConfigProvider, theme, Typography, Alert } = window.antd;
        const { useState, useEffect } = React;
        const { darkAlgorithm } = theme;
        const baseUrl = window.location.origin;
        const token = window.location.pathname.replace(/^\/card\//, '').replace(/\/$/, '') || '';

        // 读取指定名称的 Cookie（Double-Submit CSRF 使用非 HttpOnly 的 csrf_token，会话 Cookie 仍为 HttpOnly）
        const getCookie = name => {
            for (const part of document.cookie.split(';')) {
                const eq = part.indexOf('=');
                if (eq < 0) continue;
                if (part.slice(0, eq).trim() === name) return decodeURIComponent(part.slice(eq + 1));
            }
            return '';
        };
        const getCsrfToken = () => getCookie('csrf_token');

        // 统一携带会话的 API 请求：写操作若存在 CSRF Cookie 则自动附加，不再由浏览器自行计算 HMAC 签名
        const api = (path, options = {}) => {
            const method = options.method || 'GET';
            const headers = { 'Content-Type': 'application/json' };
            if (/^(POST|PUT|PATCH|DELETE)$/i.test(method)) {
                const tok = getCsrfToken();
                if (tok) headers['X-CSRF-Token'] = tok;
            }
            return fetch(baseUrl + path, {
                method,
                headers,
                credentials: 'include',
                body: options.body
            }).then(r => r.json().catch(() => ({ code: r.status, message: '请求失败' })));
        };

        function SharePage() {
            const [state, setState] = useState('loading');
            const [data, setData] = useState(null);
            const [pw, setPw] = useState('');
            const [checking, setChecking] = useState(false);
            const [isDark, setIsDark] = useState(() => localStorage.getItem('theme') === 'dark');
            useEffect(() => {
                api('/api/share/' + token + '/data').then(d => {
                    if (ok(d) && d.data) {
                        setData(d.data);
                        setState(d.data.invalid ? 'invalid' : (d.data.has_password ? 'password' : 'ready'));
                    } else setState('invalid');
                }).catch(() => setState('invalid'));
            }, []);
            const ok = d => d && (d.code === 200 || d.code === 0);
            const verify = async () => {
                setChecking(true);
                const d = await api('/api/share/' + token + '/verify', { method: 'POST', body: JSON.stringify({ password: pw }) });
                setChecking(false);
                if (ok(d)) setState('ready');
                else message.error('密码错误');
            };
            if (state === 'loading') return <div style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center' }}><Spin size="large" /></div>;
            if (state === 'invalid') return <div className="share-wrap"><Alert type="warning" message="分享不存在或已失效" /></div>;
            return (
                <ConfigProvider theme={{ algorithm: isDark ? darkAlgorithm : undefined }}>
                    <div className="share-wrap">
                        {state === 'password' ? (
                            <div className="share-pw">
                                <div style={{ fontSize: 30 }}>🔒</div>
                                <h3>此分享需要密码</h3>
                                <Input.Password size="large" placeholder="访问密码" value={pw} onChange={e => setPw(e.target.value)} onPressEnter={verify} style={{ marginTop: 14 }} />
                                <div className="btn-row">
                                    <Button type="primary" size="large" loading={checking} onClick={verify}>查看卡片</Button>
                                </div>
                            </div>
                        ) : (
                            <div className="share-card">
                                <img className="card-img" src={baseUrl + '/api/share/' + token + '/image'} alt="卡片" />
                                {data && data.title && <Typography.Title level={5} style={{ marginTop: 14 }}>{data.title}</Typography.Title>}
                                {data && data.allow_download && (
                                    <div className="btn-row">
                                        <Button type="primary" icon={<span>↓</span>} onClick={async () => {
                                            try {
                                                const r = await fetch(baseUrl + '/api/share/' + token + '/image', { credentials: 'include' });
                                                const blob = await r.blob();
                                                const a = document.createElement('a');
                                                a.href = URL.createObjectURL(blob);
                                                a.download = 'card-' + token + '.png';
                                                a.click();
                                                setTimeout(() => URL.revokeObjectURL(a.href), 3000);
                                            } catch (e) { message.error('下载失败'); }
                                        }}>下载图片</Button>
                                    </div>
                                )}
                                <div className="share-brand">Server Status</div>
                            </div>
                        )}
                    </div>
                </ConfigProvider>
            );
        }
        ReactDOM.createRoot(document.getElementById('root')).render(<SharePage />);
    </script>
</body>

</html>
