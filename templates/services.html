                localStorage.setItem('theme', isDark ? 'dark' : 'light');
                document.documentElement.classList.toggle('dark', isDark);
                document.body.classList.toggle('dark', isDark);
                document.body.style.background = isDark ? '#141414' : '#f5f5f5';
            }, [isDark]);

            // 深链：?svc=服务名 / ?port=端口&proto=tcp
            useEffect(() => {
                const p = new URLSearchParams(window.location.search);
                const svc = p.get('svc');
                const port = p.get('port');
                if (svc) { setTab('services'); setSvcDetail(svc); }
                if (port) {
                    setTab('ports');
                    setDeepPort({ port: parseInt(port, 10) || 0, proto: p.get('proto') || 'tcp' });
                }
            }, []);

            useEffect(() => {
                secureFetch(baseUrl + '/check-auth')
                    .then(r => r.json())
                    .then(d => {
                        if (d.code === 200) setAuth({ loading: false, ok: true, user: d.user });
                        else window.location.href = 'index.html';
                    })
                    .catch(() => { window.location.href = 'index.html'; });
            }, []);

            if (auth.loading) {
                return <div style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', background: isDark ? '#141414' : '#f5f5f5' }}>
                    <Card loading style={{ width: 320 }} />
                </div>;
            }

            if (!canViewServices && !canViewPorts) {
                return <ConfigProvider theme={{ algorithm: isDark ? darkAlgorithm : undefined, token: { colorBgLayout: isDark ? '#141414' : '#f5f5f5', colorBgContainer: isDark ? '#1f1f1f' : '#ffffff' } }}>
                    <div style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', background: isDark ? '#141414' : '#f5f5f5' }}>
                        <Card style={{ width: 400, textAlign: 'center' }}>
                            <div style={{ fontSize: 40, marginBottom: 8 }}><UIIcon name="StopOutlined" /></div>
                            <Typography.Title level={4}>没有访问权限</Typography.Title>
                            <Typography.Text type="secondary">当前账号没有「查看服务与端口」相关权限，请联系管理员开通。</Typography.Text>
                            <div style={{ marginTop: 16 }}>
                                <Button type="primary" onClick={() => window.location.href = 'index.html'}>返回首页</Button>
                            </div>
                        </Card>
                    </div>
                </ConfigProvider>;
            }

            const tabItems = [];
            if (canViewServices) {
                tabItems.push({
                    key: 'services',
                    label: <span><UIIcon name="AppstoreOutlined" />服务</span>,
                    children: <ServicesTab isDark={isDark} canManage={canManageServices} canDelete={canDeleteServices}
                        detailName={svcDetail} onDetail={setSvcDetail} />
                });
            }
            if (canViewPorts) {
                tabItems.push({
                    key: 'ports',
                    label: <span><UIIcon name="ApiOutlined" />端口</span>,
                    children: <PortsTab isDark={isDark} canManage={canManagePorts}
                        deepPort={deepPort}
                        onViewService={(name) => { if (canViewServices) { setTab('services'); setSvcDetail(name); } }} />
                });
            }

            return (
                <ConfigProvider theme={{ algorithm: isDark ? darkAlgorithm : undefined, token: { colorBgLayout: isDark ? '#141414' : '#f5f5f5', colorBgContainer: isDark ? '#1f1f1f' : '#ffffff' } }}>
                    <div className={'sp-app' + (isDark ? ' dark' : '')} style={{ minHeight: '100vh', background: 'var(--bg)' }}>
                        <div className={'topbar' + (isDark ? ' dark' : '')}>
                            <div className="brand">
                                <span className="logo"><UIIcon name="ControlOutlined" /></span>
                                <span>
                                    <span className="bt-name">Server Status</span>
                                    <span className="bt-sub">/ 服务与端口</span>
                                </span>
                            </div>
                            <Space>
                                <Button icon={<UIIcon name="HomeOutlined" />} onClick={() => window.location.href = 'index.html'}><span className="tb-text">首页</span></Button>
                                <Button icon={<UIIcon name="GlobalOutlined" />} onClick={() => window.location.href = 'ip-panel.html'}><span className="tb-text">IP 流量</span></Button>
                                <Tooltip title={isDark ? '浅色模式' : '深色模式'}>
                                    <Button onClick={() => setIsDark(!isDark)} icon={<UIIcon name={isDark ? 'SunOutlined' : 'MoonOutlined'} />} />
                                </Tooltip>
                                <Button danger icon={<UIIcon name="LogoutOutlined" />} onClick={() => secureFetch(baseUrl + '/logout', { method: 'POST' }).finally(() => window.location.href = 'index.html')}><span className="tb-text">退出</span></Button>
                            </Space>
                        </div>
                        <div className="page-wrap">
                            <Tabs className="biz-tabs" activeKey={tab} onChange={setTab} items={tabItems} />
                        </div>
                    </div>
                </ConfigProvider>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
    <script>
        (function () {
            function getCsrfToken() { var m = document.cookie.match(/(?:^|; )csrf_token=([^;]*)/); return m ? decodeURIComponent(m[1]) : ''; }
            function openPrivateSpace() {
                try {
                    fetch('/api/private/entry', { method: 'POST', headers: { 'X-CSRF-Token': getCsrfToken() }, credentials: 'include' })
                        .catch(function () { })
                        .finally(function () { window.location.href = 'private.html'; });
                } catch (e) { window.location.href = 'private.html'; }
            }
            var taps = [], lastTap = 0;
            document.addEventListener('keydown', function (e) {
                if (e.ctrlKey && e.shiftKey && e.altKey && (e.key === 'N' || e.key === 'n')) {
                    e.preventDefault();
                    openPrivateSpace();
                }
            });
            document.addEventListener('click', function (e) {
                var el = e.target;
                while (el && el !== document.documentElement) {
                    if (el.classList && (el.classList.contains('logo') || el.classList.contains('brand'))) {
                        var now = Date.now();
                        if (now - lastTap > 3000) taps = [];
                        lastTap = now;
                        taps.push(now);
                        if (taps.length >= 5) { taps = []; openPrivateSpace(); }
                        return;
                    }
                    el = el.parentElement;
                }
            });
        })();
    </script>
</body>

</html>
