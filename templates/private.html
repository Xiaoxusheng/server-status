<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="robots" content="noindex,nofollow">
    <title>私人空间</title>

    <link rel="stylesheet" href="/ui.css">
    <style>
        /* 页面私有样式只保留布局；颜色/圆角/阴影一律使用 ui.css 令牌 */

        .pv-root {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ================= 顶栏 ================= */
        .pv-topbar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 20px;
            min-height: 54px;
            background: var(--color-surface);
            border-bottom: 1px solid var(--color-border);
            position: sticky;
            top: 0;
            z-index: 20;
        }

        .pv-topbar .pv-brand {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            font-size: 15px;
            color: var(--color-text);
            white-space: nowrap;
        }

        .pv-topbar .pv-brand .pv-lock-icon {
            color: var(--color-primary);
            font-size: 16px;
        }

        .pv-topbar .pv-search {
            flex: 1;
            max-width: 360px;
            margin-left: auto;
        }

        .pv-topbar .pv-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-left: 12px;
        }

        /* ================= 内容区 ================= */
        .pv-body {
            flex: 1;
            width: 100%;
            max-width: 1440px;
            margin: 0 auto;
            padding: 20px 24px 64px;
        }

        .pv-tabs .ant-tabs-nav {
            margin-bottom: 16px;
        }

        .pv-tabs .ant-tabs-tab {
            font-size: 14px;
            padding-top: 6px;
        }

        /* ================= 时间线（阅读宽度内） ================= */
        .tl-wrap {
            max-width: 900px;
            margin: 0 auto;
        }

        .tl-day {
            position: relative;
            margin-bottom: 24px;
            padding-left: 20px;
        }

        .tl-day::before {
            content: '';
            position: absolute;
            left: 4px;
            top: 22px;
            bottom: -4px;
            width: 1px;
            background: var(--color-border);
        }

        .tl-day:last-child::before {
            bottom: auto;
            height: calc(100% - 22px);
        }

        .tl-day::after {
            content: '';
            position: absolute;
            left: 0;
            top: 8px;
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--color-primary);
            box-shadow: 0 0 0 3px var(--color-bg);
        }

        .tl-day-title {
            margin: 0 0 12px;
            font-size: 14px;
            font-weight: 600;
            color: var(--color-text);
            display: flex;
            align-items: baseline;
            gap: 8px;
        }

        .tl-day-title .tl-date,
        .tl-day-title .tl-count {
            font-size: 12px;
            color: var(--color-text-tertiary);
            font-weight: 400;
            font-variant-numeric: tabular-nums;
        }

        /* ================= 手记卡片 ================= */
        .note-card {
            margin-bottom: 12px;
            border-radius: var(--radius);
            transition: border-color .15s ease;
            scroll-margin-top: 66px;
            /* 保存后定位新帖：避开吸顶顶栏 */
        }

        .note-card:hover {
            border-color: var(--color-border-strong);
        }

        @keyframes noteFlash {

            0%,
            55% {
                box-shadow: 0 0 0 2px #4096ff;
            }

            100% {
                box-shadow: none;
            }
        }

        .note-card.note-flash {
            animation: noteFlash 1.6s ease;
        }

        .note-card .ant-card-body {
            padding: 14px 16px 12px;
        }

        .note-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            min-height: 24px;
        }

        .note-time {
            font-size: 12px;
            color: var(--color-text-tertiary);
            font-variant-numeric: tabular-nums;
        }

        .note-loc {
            font-size: 12px;
            color: var(--color-primary);
            display: inline-flex;
            align-items: center;
            gap: 4px;
            max-width: 55%;
        }

        .note-loc .nl-text {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .note-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--color-text);
            margin: 8px 0 2px;
            line-height: 1.45;
        }

        .note-content {
            font-size: 14px;
            line-height: 1.7;
            color: var(--color-text);
            margin-top: 2px;
            word-break: break-word;
        }

        .note-content p {
            margin: 4px 0;
        }

        .note-content pre {
            background: var(--hover);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            padding: 10px 12px;
            overflow-x: auto;
            font-size: 12.5px;
        }

        .note-content code {
            background: var(--hover);
            border-radius: 4px;
            padding: 1px 5px;
            font-size: 12.5px;
        }

        .note-content pre code {
            background: transparent;
            padding: 0;
        }

        .note-content blockquote {
            margin: 6px 0;
            padding: 2px 0 2px 12px;
            border-left: 3px solid var(--color-border-strong);
            color: var(--color-text-secondary);
        }

        .note-content .ck {
            display: inline-block;
            margin-right: 6px;
            color: var(--color-primary);
        }

        .note-content mark,
        .note-title mark,
        .note-loc mark {
            background: var(--mark-bg);
            color: inherit;
            border-radius: 2px;
            padding: 0 1px;
        }

        /* ================= 手记图片网格 ================= */
        .note-imgs {
            display: grid;
            gap: 6px;
            margin-top: 10px;
        }

        .note-imgs.n1 {
            grid-template-columns: 1fr;
        }

        .note-imgs.n2 {
            grid-template-columns: 1fr 1fr;
        }

        .note-imgs.n3 {
            grid-template-columns: 2fr 1fr;
            grid-template-rows: 1fr 1fr;
        }

        .note-imgs.n3 img:nth-child(1) {
            grid-row: span 2;
        }

        .note-imgs.n4 {
            grid-template-columns: repeat(2, 1fr);
        }

        .note-imgs .ni {
            position: relative;
            border-radius: var(--radius-sm);
            overflow: hidden;
            cursor: zoom-in;
            background: var(--hover);
        }

        .note-imgs img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .note-imgs.n1 .ni {
            max-height: 440px;
        }

        .note-imgs.n1 img {
            height: auto;
            max-height: 440px;
            object-fit: cover;
        }

        .note-imgs.n2 .ni {
            aspect-ratio: 4 / 3;
        }

        .note-imgs.n3 .ni {
            aspect-ratio: auto;
        }

        .note-imgs.n3 .ni:nth-child(1) {
            min-height: 220px;
        }

        .note-imgs.n3 .ni:nth-child(2),
        .note-imgs.n3 .ni:nth-child(3) {
            min-height: 106px;
        }

        .note-imgs.n4 .ni {
            aspect-ratio: 4 / 3;
        }

        .note-imgs .ni-more {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, .45);
            color: #fff;
            font-size: 18px;
            font-weight: 600;
        }

        .note-tags {
            margin-top: 10px;
        }

        .note-audio {
            margin-top: 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        /* 语音气泡：点击播放，播放中显示跳动的声波 */
        .voice-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 5px 12px;
            border-radius: 999px;
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            color: var(--color-text);
            cursor: pointer;
            user-select: none;
            transition: transform .12s ease, box-shadow .15s ease, border-color .15s ease;
        }

        .voice-pill:active {
            transform: scale(.97);
        }

        .voice-pill.playing {
            border-color: #4096ff;
            color: #4096ff;
        }

        .voice-dur {
            font-size: 12px;
            opacity: .65;
            font-variant-numeric: tabular-nums;
        }

        .voice-bars {
            display: inline-flex;
            align-items: flex-end;
            gap: 2.5px;
            height: 14px;
        }

        .voice-bars i {
            width: 3px;
            border-radius: 1.5px;
            background: currentColor;
            height: 30%;
            opacity: .45;
            transition: opacity .15s;
        }

        .voice-bars.on i {
            opacity: 1;
            animation: voiceBar .9s ease-in-out infinite;
        }

        .voice-bars.on i:nth-child(2) {
            animation-delay: .18s;
        }

        .voice-bars.on i:nth-child(3) {
            animation-delay: .36s;
        }

        .voice-bars.on i:nth-child(4) {
            animation-delay: .54s;
        }

        @keyframes voiceBar {

            0%,
            100% {
                height: 30%;
            }

            50% {
                height: 100%;
            }
        }

        /* 时间线长文折叠：默认最多 10 行，点「展开全文」查看全部 */
        .note-content.clamp {
            display: -webkit-box;
            -webkit-line-clamp: 10;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .note-actions {
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px solid var(--color-border);
            display: flex;
            justify-content: flex-end;
            gap: 4px;
        }

        /* ================= 编辑器 Drawer ================= */
        .pv-editor .ant-drawer-header {
            border-bottom-color: var(--color-border);
        }

        .pv-editor .ant-drawer-body {
            padding-bottom: calc(20px + env(safe-area-inset-bottom));
        }

        .pv-editor-toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 10px;
        }

        /* ================= 表情选择面板 ================= */
        .pv-emoji-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-bottom: 8px;
        }

        .pv-emoji-tabs button {
            border: 1px solid var(--color-border);
            background: transparent;
            color: var(--color-text);
            font-size: 12px;
            line-height: 1;
            padding: 5px 9px;
            border-radius: 999px;
            cursor: pointer;
            transition: background .12s, color .12s, border-color .12s;
        }

        .pv-emoji-tabs button.active {
            background: var(--color-primary);
            border-color: var(--color-primary);
            color: #fff;
        }

        .pv-emoji-grid {
            display: grid;
            grid-template-columns: repeat(8, 34px);
            gap: 2px;
            max-height: 218px;
            overflow-y: auto;
        }

        .pv-emoji-grid button {
            border: 0;
            background: transparent;
            font-size: 20px;
            line-height: 34px;
            height: 34px;
            padding: 0;
            cursor: pointer;
            border-radius: 6px;
            transition: background .12s;
        }

        .pv-emoji-grid button:hover {
            background: rgba(128, 128, 128, .18);
        }

        .pv-img-item {
            position: relative;
            width: 92px;
            height: 92px;
            border-radius: var(--radius-sm);
            overflow: hidden;
            border: 1px solid var(--color-border);
        }

        .pv-img-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .pv-img-item .pv-img-del {
            position: absolute;
            top: 2px;
            right: 2px;
        }

        .pv-img-item .pv-img-move {
            position: absolute;
            left: 2px;
            bottom: 2px;
            display: flex;
            gap: 2px;
        }

        .pv-upload-box {
            width: 92px;
            height: 92px;
            border: 1px dashed var(--color-border-strong);
            border-radius: var(--radius-sm);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--color-text-tertiary);
            cursor: pointer;
            font-size: 12px;
            gap: 4px;
            background: transparent;
            transition: border-color .2s, color .2s;
        }

        .pv-upload-box:hover {
            border-color: var(--color-primary);
            color: var(--color-primary);
        }

        .pv-loc-tip {
            font-size: 12px;
            color: var(--color-text-tertiary);
            margin-top: 4px;
        }

        /* ================= 卡片生成器 ================= */
        .cg-modal .ant-modal-content {
            overflow: hidden;
        }

        .cg-modal .ant-modal-body {
            padding: 0 20px 8px;
        }

        .cg-modal .ant-modal-footer {
            padding: 12px 20px;
            margin: 0;
            border-top: 1px solid var(--color-border);
        }

        .cg-layout {
            display: flex;
            gap: 20px;
            min-height: 520px;
        }

        .cg-left {
            width: 336px;
            flex: 0 0 336px;
            min-width: 0;
            overflow-y: auto;
            padding-right: 6px;
            padding-bottom: 8px;
            max-height: calc(100vh - 230px);
        }

        .cg-right {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
        }

        .cg-section {
            margin-bottom: 16px;
        }

        .cg-label {
            font-size: 13px;
            font-weight: 600;
            color: var(--color-text);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 2px 8px;
        }

        /* 标题主文字禁止换行，避免被右侧说明挤压折行（如“长文折叠”→“长文折/叠”） */
        .cg-label-t {
            white-space: nowrap;
        }

        .cg-label .cg-sub {
            font-size: 12px;
            font-weight: 400;
            color: var(--color-text-tertiary);
            /* 说明文字较长，独占一行完整展示，不与标题竞争空间 */
            flex: 1 1 100%;
        }

        .cg-tpl-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .cg-tpl-row .cg-tpl-btn {
            height: auto;
            padding: 6px 14px;
            line-height: 1.4;
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            gap: 1px;
        }

        .cg-tpl-row .cg-tpl-btn .cg-tpl-ratio {
            font-size: 11px;
            opacity: .65;
        }

        .cg-stage {
            flex: 1;
            min-height: 540px;
            border-radius: var(--radius-xl);
            border: 1px solid var(--color-border);
            background: var(--color-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        .cg-stage canvas {
            /* 绝对定位脱离文档流：stage 尺寸不再被 canvas 显示尺寸反噬，
               避免移动端「点选图片 → 重算 fit → stage 变矮 → fit 再缩小」的循环 */
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            max-width: none;
            box-shadow: var(--shadow-overlay);
            border-radius: var(--radius-sm);
            background: #ffffff;
            display: block;
        }

        .cg-fit-hint {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            bottom: 10px;
            font-size: 12px;
            color: #faad14;
            background: rgba(0, 0, 0, .05);
            border-radius: 4px;
            padding: 2px 10px;
            white-space: nowrap;
            z-index: 2;
        }

        html.dark .cg-fit-hint {
            background: rgba(255, 255, 255, .08);
        }

        .cg-zoom {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 12px;
        }

        .cg-ratio {
            font-size: 12px;
            color: var(--color-text-tertiary);
            margin-top: 6px;
            text-align: center;
        }

        .cg-info-row {
            display: flex;
            flex-wrap: wrap;
            gap: 4px 14px;
        }

        .cg-info-row .ant-checkbox-wrapper {
            margin-inline-start: 0;
        }

        /* 卡片图片选择器：缩略图网格，点选/再点取消，角标显示选取顺序 */
        .cg-img-pick {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(64px, 1fr));
            gap: 8px;
            margin-top: 8px;
        }

        .cg-ip {
            position: relative;
            aspect-ratio: 1;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            outline: 2px solid transparent;
            outline-offset: -2px;
            transition: outline-color .15s, opacity .15s;
        }

        .cg-ip img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .cg-ip.on {
            outline-color: var(--color-primary, #1677ff);
        }

        .cg-ip.dis {
            opacity: .35;
            cursor: not-allowed;
        }

        .cg-ip-n {
            position: absolute;
            top: 3px;
            right: 3px;
            min-width: 18px;
            height: 18px;
            padding: 0 4px;
            border-radius: 9px;
            background: var(--color-primary, #1677ff);
            color: #fff;
            font-size: 11px;
            line-height: 18px;
            text-align: center;
            font-weight: 600;
        }

        .cg-footer-left {
            margin-right: auto;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .cg-success {
            color: var(--color-success);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
        }

        body.pv-card-gen .ant-float-btn,
        body.pv-card-gen [class*="float-btn"],
        body.pv-card-gen .ai-fab,
        body.pv-card-gen [class*="ai-float"] {
            display: none !important;
        }

        @media (max-width: 768px) {
            .cg-modal {
                width: 100vw !important;
                max-width: 100vw;
                top: 0 !important;
                margin: 0 !important;
            }

            .cg-modal .ant-modal-content {
                border-radius: 0;
                height: 100vh;
                height: 100dvh;
                display: flex;
                flex-direction: column;
            }

            .cg-modal .ant-modal-body {
                flex: 1;
                overflow-y: auto;
                padding: 0 14px 12px;
            }

            .cg-modal .ant-modal-footer {
                flex: 0 0 auto;
                padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
            }

            .cg-layout {
                flex-direction: column;
                min-height: 0;
                gap: 14px;
            }

            .cg-left {
                width: 100%;
                flex: none;
                max-height: none;
                overflow: visible;
                padding-right: 0;
            }

            .cg-right {
                width: 100%;
            }

            .cg-stage {
                /* flex:none 避免 flex-basis:0% 覆盖 height，
                   否则在内容自适应高度的 flex column 里 stage 会塌缩成细条 */
                flex: none;
                min-height: 0;
                height: 56vh;
                padding: 14px;
            }

            .cg-tpl-row {
                flex-wrap: nowrap;
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
                padding-bottom: 2px;
            }

            .cg-tpl-row::-webkit-scrollbar {
                display: none;
            }
        }

        .share-line {
            display: flex;

        const getCookie = name => {

        function api(path, options = {}) {
            const method = options.method || 'GET';
            const headers = { 'Content-Type': 'application/json', ...(options.headers || {}) };
            if (/^(POST|PUT|PATCH|DELETE)$/i.test(method)) {
                const tok = getCsrfToken();

                credentials: 'include',

        const dayKey = s => { const d = parseISO(s); return d ? d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) : ''; };

        // ==================== Markdown 渲染（安全转义后渲染）====================
        function escHtml(s) {

        function mdToHtml(src) {
            if (!src) return '';
            const lines = String(src).replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;
            const inline = s => s
                .replace(/`([^`]+)`/g, '<code>$1</code>')
                .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
                .replace(/\*([^*]+)\*/g, '<i>$1</i>')
                .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noreferrer">$1</a>');
            while (i < lines.length) {
                const line = lines[i];
                if (line.trim().startsWith('```')) {
                    const buf = [];
                    i++;
                    while (i < lines.length && !lines[i].trim().startsWith('```')) { buf.push(escHtml(lines[i])); i++; }
                    i++;
                    out.push('<pre>' + buf.join('\n') + '</pre>');
                    continue;
                }
                const h = line.match(/^(#{1,3})\s+(.*)$/);
                if (h) {
                    const level = Math.min(h[1].length + 2, 4);
                    out.push('<p style="font-weight:600;font-size:' + (17 - h[1].length) + 'px;margin:8px 0 4px">' + inline(escHtml(h[2])) + '</p>');
                    i++;
                    continue;
                }
                const ck = line.match(/^\s*[-*]\s+\[( |x|X)\]\s+(.*)$/);
                if (ck) {
                    out.push('<p style="margin:3px 0"><span class="ck">' + (ck[1] !== ' ' ? '☑' : '☐') + '</span>' + inline(escHtml(ck[2])) + '</p>');
                    i++;
                    continue;
                }
                const ul = line.match(/^\s*[-*]\s+(.*)$/);
                if (ul) {
                    out.push('<p style="margin:3px 0">• ' + inline(escHtml(ul[1])) + '</p>');
                    i++;
                    continue;
                }
                if (/^\s*>\s?/.test(line)) {
                    out.push('<blockquote>' + inline(escHtml(line.replace(/^\s*>\s?/, ''))) + '</blockquote>');
                    i++;
                    continue;
                }
                if (line.trim() === '') {
                    i++;
                    continue;
                }
                out.push('<p>' + inline(escHtml(line)) + '</p>');
                i++;

        // ==================== EXIF（图片时间/GPS 建议）====================
        function readExif(file) {
            return new Promise(resolve => {
                const fr = new FileReader();
                fr.onerror = () => resolve(null);
                fr.onload = () => {
                    try {
                        const buf = fr.result;

                        if (u8[0] !== 0xFF || u8[1] !== 0xD8) return resolve(null);

        function parseTiff(buf, start) {

                case 1: case 2: case 6: case 7: return 1;
                case 3: case 8: return 2;
                case 4: case 9: case 11: return 4;
                case 5: case 10: case 12: return 8;
                default: return 1;
            }
        }

        // ==================== 卡片渲染器（Canvas）====================
        // 去除 Markdown 语法，用于 canvas 绘制与卡片标题存储
        const mdStrip = s => String(s == null ? '' : s)
            .replace(/^#{1,6}\s+/gm, '')
            .replace(/\*\*([^*]*)\*\*/g, '$1')
            .replace(/\*([^*\n]*)\*/g, '$1')
            .replace(/~~([^~]*)~~/g, '$1')
            .replace(/`([^`]*)`/g, '$1')
            .replace(/!\[[^\]]*\]\([^)]*\)/g, '')
            .replace(/\[([^\]]*)\]\([^)]*\)/g, '$1')
            .replace(/^[-*]\s+\[[ xX]\]\s*/gm, '')
            .replace(/^[-*+]\s+/gm, '')
            .replace(/^>\s?/gm, '')
            .replace(/^---+$/gm, '')
            .trim();

        function wrapText(ctx, text, maxW) {
            const lines = [];
            String(text).split('\n').forEach(para => {
                if (!para.trim()) { lines.push(''); return; }
                let cur = '';
                for (const ch of para) {
                    const test = cur + ch;
                    if (ctx.measureText(test).width > maxW && cur) {
                        lines.push(cur);
                        cur = ch;
                    } else {
                        cur = test;
                    }
                }
                if (cur) lines.push(cur);
            });
            return lines;
        }
        function roundRect(ctx, x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.arcTo(x + w, y, x + w, y + h, r);
            ctx.arcTo(x + w, y + h, x, y + h, r);
            ctx.arcTo(x, y + h, x, y, r);
            ctx.arcTo(x, y, x + w, y, r);
            ctx.closePath();
        }
        async function loadImg(url) {
            // 用 fetch(credentials:include) 拉取（保证携带登录/私人 Cookie，能过安全中间件）。
            // 注意：本页 Babel 编译后会把顶层 const { Image } = window.antd 挂到 window.Image 上，
            // 所以绝不能使用 new Image() / new window.Image()，一律用 createImageBitmap 或 createElement('img')。
            const r = await fetch(url, { credentials: 'include' });
            if (!r.ok) throw new Error('图片加载失败 HTTP ' + r.status);
            const blob = await r.blob();
            if (window.createImageBitmap) {
                try {
                    return await createImageBitmap(blob);
                } catch (e) { /* 回退到 <img> 解码 */ }
            }
            const objUrl = URL.createObjectURL(blob);
            try {
                return await new Promise((res, rej) => {
                    const img = document.createElement('img');
                    const timer = setTimeout(() => {
                        img.onload = img.onerror = null;
                        rej(new Error('图片解码超时'));
                    }, 8000);
                    img.onload = () => { clearTimeout(timer); res(img); };
                    img.onerror = () => { clearTimeout(timer); rej(new Error('图片解码失败')); };
                    img.src = objUrl;
                });
            } finally {
                setTimeout(() => URL.revokeObjectURL(objUrl), 5000);
            }
        }
        function coverRect(sw, sh, dw, dh, x, y) {
            const s = Math.max(dw / sw, dh / sh);
            const w = sw * s, h = sh * s;
            return [x + (dw - w) / 2, y + (dh - h) / 2, w, h];
        }
        async function drawImageCover(ctx, url, x, y, w, h, r, badge) {
            // r 为 0 时表示直角（无缝拼图），仅在未传时回退 12；
            // 旧写法 `r || 12` 会把显式传 0 的直角错误地变成 12px 圆角
            const rr = (r == null) ? 12 : r;
            try {
                const img = await loadImg(url);
                ctx.save();
                roundRect(ctx, x, y, w, h, rr);
                ctx.clip();
                const sw = img.naturalWidth || img.width || 1;
                const sh = img.naturalHeight || img.height || 1;
                const [ix, iy, iw, ih] = coverRect(sw, sh, w, h, x, y);
                ctx.drawImage(img, ix, iy, iw, ih);
                if (badge) {
                    ctx.fillStyle = 'rgba(0,0,0,.55)';
                    ctx.fillRect(x, y, w, h);
                    ctx.fillStyle = '#ffffff';
                    ctx.font = `600 ${Math.round(Math.min(w, h) * 0.22)}px -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(badge, x + w / 2, y + h / 2);
                    ctx.textBaseline = 'alphabetic';
                }
                ctx.restore();
            } catch (e) {
                ctx.fillStyle = '#e5e5e5';
                roundRect(ctx, x, y, w, h, rr);
                ctx.fill();
                if (badge) {
                    ctx.fillStyle = 'rgba(0,0,0,.55)';
                    ctx.fillRect(x, y, w, h);
                    ctx.fillStyle = '#ffffff';
                    ctx.font = `600 ${Math.round(Math.min(w, h) * 0.22)}px -apple-system, sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(badge, x + w / 2, y + h / 2);
                    ctx.textBaseline = 'alphabetic';
                }
            }
        }
        // ==================== Card Renderer（独立渲染，预览与 PNG 同源）====================
        // 输入：手记数据 + 显示选项；输出：Canvas（PNG）。绝不依赖页面 DOM / 截图。
        async function renderCard(opts) {
            const {
                template, width, height, title, content, time, location, tags, images, brand, server,
                locationName, latitude, longitude,
                show = {}, locationMode = 'name', background = 'white', autoLayout = true,
                fold = false, foldLines = 8
            } = opts;
            const showTitle = show.title !== false;
            const showContent = show.content !== false;
            const showTime = show.time !== false;
            const showLocation = show.location !== false;
            const showTags = show.tags !== false;
            const showImages = show.images !== false;
            const showBrand = show.brand !== false;

            const canvas = document.createElement('canvas');
            canvas.width = width; canvas.height = height;
            canvas.fitHint = false; canvas.fitScale = 1;
            const ctx = canvas.getContext('2d');
            ctx.textBaseline = 'alphabetic';
            const padX = Math.round(width * 0.07);
            const maxW = width - padX * 2;

            // 地点显示：名称优先，其次坐标，可隐藏
            let locText = '';
            if (showLocation && locationMode !== 'hidden') {
                const lat = latitude != null ? latitude.toFixed(2) : '';
                const lng = longitude != null ? longitude.toFixed(2) : '';
                if (locationMode === 'coords') {
                    locText = lat && lng ? `${lat}, ${lng}` : (location || '');
                } else {
                    locText = location || (lat && lng ? `${lat}, ${lng}` : '');
                }
            }
            const timeTxt = showTime && time ? fmtDate(time) + '  ' + fmtClock(time) : '';
            const metaTxt = [timeTxt, locText].filter(Boolean).join('   ·   ');
            const brandTxt = showBrand && brand ? String(brand) : '';
            const tagList = showTags && tags ? tags.map(t => '#' + String(t).replace(/^#/, '')) : [];

            // 调色板：页面主题与卡片模板完全独立
            const darkPal = { bg: '#141414', text: 'rgba(255,255,255,.92)', secondary: 'rgba(255,255,255,.55)', muted: 'rgba(255,255,255,.35)' };
            const whitePal = { bg: '#ffffff', text: '#141414', secondary: 'rgba(0,0,0,.55)', muted: 'rgba(0,0,0,.35)' };
            const grayPal = { bg: '#f5f5f5', text: '#141414', secondary: 'rgba(0,0,0,.55)', muted: 'rgba(0,0,0,.35)' };
            const isDarkTemplate = template === 'dark' || template === 'server' || background === 'dark';
            let palette = whitePal;
            if (isDarkTemplate) palette = darkPal;
            else if (background === 'gray') palette = grayPal;

            const fontFamily = `-apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif`;
            const monoFamily = `Consolas, Menlo, "Courier New", monospace`;
            const baseF = {
                title: width * 0.05,
                content: width * 0.032,
                meta: width * 0.027,
                tag: width * 0.026,
                brand: width * 0.024
            };
            const baseLH = {
                title: width * 0.068,
                content: width * 0.047,
                meta: width * 0.038,
                tag: width * 0.034
            };

            // 内容块测量（自动排版：计算缩放，防止溢出/裁剪）
            let titleLines = [], contentLines = [];
            ctx.font = `700 ${baseF.title}px ${fontFamily}`;
            if (showTitle && title) titleLines = wrapText(ctx, mdStrip(title), maxW);
            ctx.font = `400 ${baseF.content}px ${fontFamily}`;
            if (showContent && content) contentLines = wrapText(ctx, mdStrip(content), maxW);
            // 长文折叠：超过 foldLines 行只保留前 N 行并以 … 结尾，字号保持可读不再缩小
            if (fold && contentLines.length > foldLines) {
                contentLines = contentLines.slice(0, foldLines);
                contentLines[foldLines - 1] = contentLines[foldLines - 1].replace(/\s+$/, '') + ' …';
            }
            const textNeed = () => {
                let need = 0;
                if (titleLines.length) need += titleLines.length * baseLH.title + width * 0.016;
                if (contentLines.length) need += contentLines.length * baseLH.content;
                if (metaTxt) need += baseLH.meta + width * 0.012;
                if (tagList.length) need += baseLH.tag + width * 0.012;
                return need;
            };
            let scale = 1;
            let availH = height * 0.72;
            if (autoLayout && textNeed() > availH) {
                scale = Math.max(0.62, Math.min(1, availH / textNeed()));
                canvas.fitScale = scale;
                canvas.fitHint = scale < 0.999;
            }
            const F = {
                title: baseF.title * scale,
                content: baseF.content * scale,
                meta: baseF.meta * scale,
                tag: baseF.tag * scale,
                brand: baseF.brand
            };
            const LH = {
                title: baseLH.title * scale,
                content: baseLH.content * scale,
                meta: baseLH.meta * scale,
                tag: baseLH.tag * scale
            };

            const drawBrand = () => {
                if (!brandTxt) return;
                ctx.font = `500 ${F.brand}px ${fontFamily}`;
                ctx.textAlign = 'right';
                ctx.fillStyle = palette.muted;
                ctx.fillText(brandTxt, width - padX, height - height * 0.045);
                ctx.textAlign = 'left';
            };
            const drawText = (startY) => {
                let y = startY;
                ctx.textAlign = 'left';
                if (titleLines.length) {
                    ctx.font = `700 ${F.title}px ${fontFamily}`;
                    ctx.fillStyle = palette.text;
                    titleLines.forEach((l, i) => ctx.fillText(l, padX, y + i * LH.title));
                    y += titleLines.length * LH.title + width * 0.016;
                }
                if (contentLines.length) {
                    ctx.font = `400 ${F.content}px ${fontFamily}`;
                    ctx.fillStyle = palette.text;
                    contentLines.forEach((l, i) => {
                        // 代码片段使用等宽字体
                        ctx.font = /(^|\s)[`]/.test(l) ? `400 ${F.content}px ${monoFamily}` : `400 ${F.content}px ${fontFamily}`;
                        ctx.fillText(l, padX, y + i * LH.content);
                    });
                    y += contentLines.length * LH.content;
                }
                if (metaTxt) {
                    ctx.font = `400 ${F.meta}px ${fontFamily}`;
                    ctx.fillStyle = palette.secondary;
                    ctx.fillText(metaTxt, padX, y);
                    y += LH.meta + width * 0.012;
                }
                if (tagList.length) {
                    ctx.font = `500 ${F.tag}px ${fontFamily}`;
                    ctx.fillStyle = palette.secondary;
                    ctx.fillText(tagList.join('   '), padX, y);
                    y += LH.tag;
                }
                return y;
            };

            // 图片拼贴（1~9 张，微信九宫格风格）：
            // 1 张整宽 / 2 张两列 / 3 张三列 / 4 张 2×2 / 其余 3 列 N 行；
            // 外层统一 roundRect clip（radius>0 时保留外圆角），内部格子直角无缝拼接。
            // 选图由 CardModal 的图片选择器决定（最多 9 张），不再截断 +N。
            const drawCollage = async (x, y, w, h, radius) => {
                const urls = showImages && images ? images.slice(0, 9) : [];
                if (!urls.length) return;
                const n = urls.length;
                const cols = n === 1 ? 1 : (n === 2 ? 2 : (n === 4 ? 2 : 3));
                const rows = Math.ceil(n / cols);
                const cw = w / cols, ch = h / rows;
                ctx.save();
                if (radius > 0) {
                    roundRect(ctx, x, y, w, h, radius);
                    ctx.clip();
                }
                for (let i = 0; i < n; i++) {
                    const cx = x + (i % cols) * cw;
                    const cy = y + Math.floor(i / cols) * ch;

                }
                ctx.restore();
            };

            // 背景填充（含图片背景模式）
            const fillBackground = async () => {
                if (background === 'image' && showImages && images && images.length) {
                    await drawImageCover(ctx, images[0], 0, 0, width, height, 0);
                    ctx.fillStyle = 'rgba(0,0,0,.42)';
                    ctx.fillRect(0, 0, width, height);
                    palette = { bg: 'transparent', text: 'rgba(255,255,255,.95)', secondary: 'rgba(255,255,255,.7)', muted: 'rgba(255,255,255,.5)' };
                    return;
                }
                ctx.fillStyle = palette.bg;
                ctx.fillRect(0, 0, width, height);
            };

            // ==================== 服务器模板（实时数据）====================
            if (template === 'server') {
                await fillBackground();
                const s = server || {};
                ctx.textAlign = 'left';
                ctx.font = `700 ${width * 0.05}px ${fontFamily}`;
                ctx.fillStyle = palette.text;
                ctx.fillText(brandTxt || 'Server Status', padX, height * 0.14);
                const items = [
                    ['CPU', s.cpu_usage != null ? parseFloat(s.cpu_usage).toFixed(1) + '%' : '-'],
                    ['Memory', s.memory_usage != null ? parseFloat(s.memory_usage).toFixed(1) + '%' : '-'],
                    ['Disk', s.disk_usage != null ? parseFloat(s.disk_usage).toFixed(1) + '%' : '-'],
                    ['Network', s.upload_speed != null ? '↑' + parseFloat(s.upload_speed).toFixed(1) + ' / ↓' + parseFloat(s.download_speed).toFixed(1) + ' KB/s' : '-'],
                    ['Uptime', s.uptime || '-']
                ];
                const startY = height * 0.28;
                const rowH = height * 0.085;
                items.forEach((it, i) => {
                    const y = startY + i * rowH;
                    ctx.font = `400 ${width * 0.028}px ${fontFamily}`;
                    ctx.fillStyle = palette.secondary;
                    ctx.fillText(it[0], padX, y);
                    ctx.font = `600 ${width * 0.036}px ${fontFamily}`;
                    ctx.fillStyle = palette.text;
                    ctx.fillText(it[1], padX + width * 0.26, y);
                });
                ctx.fillStyle = '#52c41a';
                ctx.beginPath();
                ctx.arc(padX + width * 0.03, startY + items.length * rowH + height * 0.02, width * 0.011, 0, Math.PI * 2);
                ctx.fill();
                ctx.font = `500 ${width * 0.028}px ${fontFamily}`;
                ctx.fillStyle = palette.text;
                ctx.fillText('Online', padX + width * 0.065, startY + items.length * rowH + height * 0.03);
                if (timeTxt) {
                    ctx.font = `400 ${width * 0.024}px ${fontFamily}`;
                    ctx.fillStyle = palette.muted;
                    ctx.fillText(timeTxt, padX, height - height * 0.08);
                }
                drawBrand();
                return canvas;
            }

            // ==================== 图片模板（上方大图 + 下方文字）====================
            if (template === 'image') {
                await fillBackground();
                const imgs = showImages && images ? images.slice(0, 9) : [];
                // 图片高度随文字量自适应：文字少→图占更大区域，避免大面积留白；
                // 多图时按宫格行数尽量取方形格子（微信九宫格风格），同时保证文字区可用
                const textH = textNeed() + height * 0.1;
                let imgH = 0;
                if (imgs.length) {
                    if (imgs.length === 1) {
                        imgH = Math.round(Math.min(height * 0.72, Math.max(height * 0.4, height - textH)));
                    } else {
                        const cols = imgs.length === 2 || imgs.length === 4 ? 2 : 3;
                        const rows = Math.ceil(imgs.length / cols);
                        imgH = Math.round(Math.min(height * 0.8, Math.max(height * 0.35, rows * (width / cols))));
                    }
                }
                if (imgs.length) {
                    await drawCollage(0, 0, width, imgH, 0);
                    ctx.fillStyle = palette.bg;
                    ctx.fillRect(0, imgH, width, height - imgH);
                }
                const rest = height - imgH;
                let y = imgH + Math.max(height * 0.045, (rest - textNeed()) / 2);
                y = drawText(y);
                drawBrand();
                return canvas;
            }

            // ==================== 旅行模板（地点 + 时间 + 文字 + 照片）====================
            if (template === 'travel') {
                await fillBackground();
                ctx.textAlign = 'left';
                ctx.font = `600 ${width * 0.052}px ${fontFamily}`;
                ctx.fillStyle = palette.text;
                ctx.fillText('📍 ' + (locText || '我的足迹'), padX, height * 0.15);
                ctx.font = `400 ${width * 0.027}px ${fontFamily}`;
                ctx.fillStyle = palette.secondary;
                ctx.fillText(timeTxt || '', padX, height * 0.205);
                let y = height * 0.27;
                y = drawText(y);
                if (showImages && images && images.length) {
                    const imgs = images.slice(0, 3);
                    const gap = width * 0.02;
                    const thumbW = (maxW - gap * (imgs.length - 1)) / imgs.length;
                    const thumbH = height * 0.28;
                    const ty = height - thumbH - height * 0.1;
                    for (let k = 0; k < imgs.length; k++) {
                        await drawImageCover(ctx, imgs[k], padX + k * (thumbW + gap), ty, thumbW, thumbH, 12);
                    }
                }
                drawBrand();
                return canvas;
            }

            // ==================== 小红书模板（奶油底 + 大标题 + 圆角拼图 + 标签胶囊）====================
            if (template === 'xhs') {
                const xhs = { bg: '#fff7ef', text: '#2b2622', secondary: 'rgba(43,38,34,.55)', red: '#ff2442' };
                ctx.fillStyle = xhs.bg;
                ctx.fillRect(0, 0, width, height);
                ctx.textAlign = 'left';
                let y = height * 0.072;
                // 大标题：左侧红色竖条 + 最多 3 行
                ctx.font = `800 ${width * 0.062}px ${fontFamily}`;
                const tLs = showTitle && title ? wrapText(ctx, mdStrip(title), maxW).slice(0, 3) : [];
                const tLH = width * 0.088;
                if (tLs.length) {
                    ctx.fillStyle = xhs.red;
                    roundRect(ctx, padX, y - tLH * 0.62, width * 0.012, tLH * (tLs.length * 0.82), width * 0.006);
                    ctx.fill();
                    ctx.fillStyle = xhs.text;
                    tLs.forEach((l, i) => ctx.fillText(l, padX + width * 0.032, y + i * tLH));
                    y += tLs.length * tLH + width * 0.025;
                }
                // 圆角拼图（最多 4 张，超出显示 +N）
                if (showImages && images && images.length) {
                    const ih = Math.min(height * 0.5, height - y - height * 0.24);
                    if (ih > height * 0.1) {
                        await drawCollage(padX, y, maxW, ih, width * 0.032);
                        y += ih + width * 0.04;
                    }
                }
                // 正文：按剩余空间裁行，末行省略号
                if (showContent && content) {
                    ctx.font = `400 ${width * 0.03}px ${fontFamily}`;
                    const cLH = width * 0.047;
                    const reserve = height * 0.16 + (tagList.length ? width * 0.07 : 0);
                    const availH = Math.max(cLH, height - y - reserve);
                    let cLs = wrapText(ctx, mdStrip(content), maxW);
                    let maxLines = Math.max(1, Math.floor(availH / cLH));
                    if (fold && foldLines < maxLines) maxLines = foldLines;
                    if (cLs.length > maxLines) {
                        cLs = cLs.slice(0, maxLines);
                        cLs[maxLines - 1] = cLs[maxLines - 1].slice(0, Math.max(1, cLs[maxLines - 1].length - 2)) + '…';
                    }
                    ctx.fillStyle = xhs.text;
                    cLs.forEach((l, i) => ctx.fillText(l, padX, y + i * cLH));
                    y += cLs.length * cLH + width * 0.02;
                }
                // 标签胶囊（小红书红描边，最多 6 个）
                if (tagList.length) {
                    ctx.font = `500 ${width * 0.028}px ${fontFamily}`;
                    let tx = padX;
                    const ty = height * 0.865;
                    tagList.slice(0, 6).forEach(t => {
                        const tw = ctx.measureText(t).width + width * 0.05;
                        if (tx + tw > width - padX) return;
                        ctx.strokeStyle = xhs.red;
                        ctx.lineWidth = Math.max(1.5, width * 0.0032);
                        roundRect(ctx, tx, ty - width * 0.037, tw, width * 0.06, width * 0.03);
                        ctx.stroke();
                        ctx.fillStyle = xhs.red;
                        ctx.fillText(t, tx + width * 0.025, ty + width * 0.004);
                        tx += tw + width * 0.022;
                    });
                }
                // 底部：时间 · 地点（左） + 品牌（右）
                ctx.font = `400 ${width * 0.024}px ${fontFamily}`;
                ctx.fillStyle = xhs.secondary;
                ctx.fillText([timeTxt, locText].filter(Boolean).join(' · '), padX, height - height * 0.05);
                drawBrand();
                return canvas;
            }

            // ==================== 简洁 / 深色 / 浅灰（纯文字排版）====================
            await fillBackground();
            let y = height * 0.15;
            y = drawText(y);
            drawBrand();
            return canvas;
        }

        // ==================== 语音录音（移动端优先）====================
        const recorderSupported = typeof window !== 'undefined' && !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
        function AudioRecorder({ onSaved, onDeleted, audio }) {
            const [rec, setRec] = useState(null);
            const [state, setState] = useState('idle');
            const [secs, setSecs] = useState(0);
            const [playing, setPlaying] = useState(false);
            const timer = useRef(null);
            const chunks = useRef([]);
            const audioRef = useRef(null);
            const recRef = useRef(null);
            const startSec = useRef(0);

            useEffect(() => () => { if (timer.current) clearInterval(timer.current); if (recRef.current && recRef.current.state !== 'inactive') recRef.current.stop(); }, []);

            const start = async () => {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    const m = new MediaRecorder(stream);
                    chunks.current = [];
                    m.ondataavailable = e => { if (e.data.size) chunks.current.push(e.data); };
                    m.onstop = async () => {
                        stream.getTracks().forEach(t => t.stop());
                        const blob = new Blob(chunks.current, { type: m.mimeType || 'audio/webm' });
                        if (blob.size > 0) {
                            const name = 'voice-' + Date.now() + (blob.type.includes('mp4') ? '.m4a' : '.webm');
                            const file = new File([blob], name, { type: blob.type });
                            // 用计时起点实时计算时长：闭包里的 secs 是 start() 时刻的旧值（恒 0）
                            const elapsed = Math.max(1, Math.floor((Date.now() - startSec.current) / 1000));
                            onSaved(file, elapsed);
                        }
                        setState('idle'); setSecs(0);
                    };
                    recRef.current = m;
                    m.start();
                    startSec.current = Date.now();
                    setState('recording');
                    timer.current = setInterval(() => setSecs(Math.floor((Date.now() - startSec.current) / 1000)), 500);
                } catch (e) {
                    message.warning('无法使用麦克风');
                }
            };
            const stop = () => { if (recRef.current && recRef.current.state !== 'inactive') recRef.current.stop(); if (timer.current) clearInterval(timer.current); };
            const fmt = s => pad(Math.floor(s / 60)) + ':' + pad(s % 60);
            return (
                <div>
                    {audio && audio.id ? (
                        <Space direction="vertical" style={{ width: '100%' }}>
                            <Space>
                                <Button size="small" onClick={() => {
                                    const a = audioRef.current;
                                    if (!a) return;
                                    if (playing) { a.pause(); setPlaying(false); } else { a.play(); setPlaying(true); }
                                }}>
                                    <span className={'voice-bars' + (playing ? ' on' : '')}><i /><i /><i /><i /></span>
                                    <span style={{ marginLeft: 6 }}>{playing ? '暂停' : '播放'}</span>
                                </Button>
                                <Popconfirm title="删除这段语音？" onConfirm={() => onDeleted(audio.id)}>
                                    <Button size="small" danger icon={<I name="DeleteOutlined" />}>删除</Button>
                                </Popconfirm>
                                <Typography.Text type="secondary" style={{ fontSize: 12 }}>{fmt(Math.round(audio.duration || 0))}</Typography.Text>
                            </Space>
                            <audio ref={audioRef} src={audio.url} onEnded={() => setPlaying(false)} style={{ display: 'none' }} />
                        </Space>
                    ) : recorderSupported ? (
                        state === 'recording' ? (
                            <Space>
                                <Button size="small" danger icon={<I name="StopOutlined" />} onClick={stop}>停止</Button>
                                <Typography.Text style={{ color: '#ff4d4f', fontVariantNumeric: 'tabular-nums' }}>{fmt(secs)}</Typography.Text>
                            </Space>
                        ) : (
                            <Button icon={<I name="AudioOutlined" />} onClick={start}>录音</Button>
                        )
                    ) : null}
                </div>
            );

        // ==================== 位置选择 ====================
        const builtinPlaces = [
            { name: '东京站', lat: 35.6812, lng: 139.7671 },

            { name: '北京', lat: 39.9042, lng: 116.4074 },
            { name: '上海', lat: 31.2304, lng: 121.4737 },
            { name: '广州', lat: 23.1291, lng: 113.2644 },
            { name: '深圳', lat: 22.5431, lng: 114.0579 },
            { name: '香港', lat: 22.3193, lng: 114.1694 },
            { name: '台北', lat: 25.0330, lng: 121.5654 },
            { name: '新加坡', lat: 1.3521, lng: 103.8198 },
            { name: '首尔', lat: 37.5665, lng: 126.9780 },
            { name: '曼谷', lat: 13.7563, lng: 100.5018 },
            { name: '巴黎', lat: 48.8566, lng: 2.3522 },

            { name: '纽约', lat: 40.7128, lng: -74.0060 },

        function LocationPicker({ value, onChange, exif }) {
            const [search, setSearch] = useState('');
            const [geoLoading, setGeoLoading] = useState(false);
            const [manual, setManual] = useState(false);
            const [manualName, setManualName] = useState('');
            const [manualLat, setManualLat] = useState('');
            const [manualLng, setManualLng] = useState('');
            const valueStr = value && value.location_name ? value.location_name : '';
            const apply = (loc) => {
                onChange({
                    location_name: loc.name,
                    latitude: loc.lat != null ? loc.lat : null,
                    longitude: loc.lng != null ? loc.lng : null
                });
            };
            const geo = () => {
                if (!navigator.geolocation) {
                    message.warning(window.isSecureContext ? '当前浏览器不支持定位，请手动选择位置' : '手机浏览器要求 HTTPS 连接才能定位，请手动选择位置');
                    setManual(true);
                    return;
                }
                setGeoLoading(true);
                // 带超时的 fetch：反向地理编码服务国内直连可能长时间挂起，不能让它卡住定位结果
                const fetchTimeout = (url, ms) => {
                    const ctl = new AbortController();
                    const t = setTimeout(() => ctl.abort(), ms);
                    return fetch(url, { signal: ctl.signal }).finally(() => clearTimeout(t));
                };
                navigator.geolocation.getCurrentPosition(pos => {
                    setGeoLoading(false);
                    const lat = pos.coords.latitude, lng = pos.coords.longitude;
                    const fallbackCoord = () => onChange({ location_name: lat.toFixed(4) + ', ' + lng.toFixed(4), latitude: lat, longitude: lng });
                    const setName = name => onChange({ location_name: name, latitude: lat, longitude: lng });
                    // 反向地理编码：GPS 坐标 → 真实地名（城市 · 区县 · 道路）
                    // nominatim 国内手机网络常超时，5s 内无响应回退 BigDataCloud，再失败回退显示坐标
                    const bdc = () => fetchTimeout('https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=' + lat + '&longitude=' + lng + '&localityLanguage=zh', 5000)
                        .then(r => r.json())
                        .then(d => {
                            const name = [d.city || d.locality, d.principalSubdivision].filter(Boolean).join(' · ');
                            if (name) setName(name); else fallbackCoord();
                        })
                        .catch(fallbackCoord);
                    fetchTimeout('https://nominatim.openstreetmap.org/reverse?format=json&zoom=16&accept-language=zh-CN&lat=' + lat + '&lon=' + lng, 5000)
                        .then(r => r.json())
                        .then(d => {
                            const a = (d && d.address) || {};
                            const name = [a.city || a.town || a.county, a.suburb || a.city_district || a.district, a.road].filter(Boolean).join(' · ');
                            if (name || (d && d.display_name)) setName(name || d.display_name); else bdc();
                        })
                        .catch(bdc);
                }, err => {
                    setGeoLoading(false);
                    const why = {
                        1: '定位权限被拒绝，请在浏览器设置中允许本站使用位置信息',
                        2: '暂时无法获取位置，请移到开阔处重试',
                        3: '定位超时，请重试'
                    }[err && err.code] || '定位失败，请重试';
                    message.warning(why);
                    setManual(true);
                }, { enableHighAccuracy: true, timeout: 12000, maximumAge: 30000 });
            };
            const results = search.trim() ? builtinPlaces.filter(p => p.name.includes(search.trim())) : [];

                                <Button size="small" type="link" style={{ padding: 0 }} onClick={() => apply({ name: '照片定位', lat: exif.gpsLatRef === 'S' ? -exif.gpsLat : exif.gpsLat, lng: exif.gpsLonRef === 'W' ? -exif.gpsLon : exif.gpsLon })}>
                                    使用照片位置
                                </Button>
                            )}
                            {exif.time && <span style={{ marginLeft: 8 }}>拍摄时间：{exif.time}</span>}

                    {manual && (
                        <div style={{ marginTop: 8 }}>
                            <Space.Compact style={{ width: '100%' }}>
                                <Input placeholder="搜索地点，如：东京站" value={search} onChange={e => setSearch(e.target.value)} />
                            </Space.Compact>
                            {results.length > 0 && (
                                <div style={{ marginTop: 6 }}>

                                </div>

                            <div style={{ marginTop: 8 }}>
                                <Space.Compact style={{ width: '100%' }}>
                                    <Input placeholder="自定义地点名称" value={manualName} onChange={e => setManualName(e.target.value)} />
                                    <Input placeholder="纬度(可选)" style={{ width: 120 }} value={manualLat} onChange={e => setManualLat(e.target.value)} />
                                    <Input placeholder="经度(可选)" style={{ width: 120 }} value={manualLng} onChange={e => setManualLng(e.target.value)} />
                                </Space.Compact>
                                <Button size="small" style={{ marginTop: 6 }} onClick={() => {
                                    const name = manualName.trim();
                                    if (!name) { message.warning('请输入地点名称'); return; }
                                    const lat = parseFloat(manualLat), lng = parseFloat(manualLng);
                                    apply({ name, lat: isNaN(lat) ? null : lat, lng: isNaN(lng) ? null : lng });
                                    setManual(false); setSearch(''); setManualName(''); setManualLat(''); setManualLng('');
                                }}>保存地点</Button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // ==================== 手记卡片 ====================
        const locLabel = n => n.location_name || ((n.latitude != null && n.longitude != null) ? n.latitude.toFixed(2) + ', ' + n.longitude.toFixed(2) : '');
        const hlText = (text, q) => {
            if (!q || !text) return text;
            const esc = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            return String(text).split(new RegExp('(' + esc + ')', 'ig')).map((p, i) => p && p.toLowerCase() === q.toLowerCase() ? <mark key={i}>{p}</mark> : p);
        };
        const hlHtml = (html, q) => {
            if (!q || !html) return html;
            const esc = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            return String(html).replace(new RegExp(esc, 'gi'), '<mark>$&</mark>');
        };
        // 语音气泡播放器：点击播放/暂停，播放中显示跳动的声波
        function VoicePlayer({ src, duration }) {
            const [playing, setPlaying] = useState(false);
            const ref = useRef(null);
            const toggle = () => {
                const el = ref.current;
                if (!el) return;
                if (el.paused) el.play(); else el.pause();
            };
            const t = Math.max(0, Math.round(duration || 0));
            const durText = t >= 60 ? Math.floor(t / 60) + "'" + String(t % 60).padStart(2, '0') + '"' : t + '"';
            return (
                <span className={'voice-pill' + (playing ? ' playing' : '')} onClick={toggle}>

                    <span className="voice-dur">{durText}</span>
                    <audio ref={ref} src={src} preload="none"
                        onPlay={() => setPlaying(true)}
                        onPause={() => setPlaying(false)}
                        onEnded={() => setPlaying(false)}

        }

        function NoteCard({ note, onEdit, onDelete, onCard, highlight }) {
            const [openIdx, setOpenIdx] = useState(-1);

            return (
                <Card className="note-card" data-note-id={note.id} styles={{ body: { padding: '14px 16px' } }}>

                        {loc && <span className="note-loc"><span className="nl-text">📍 {hlText(loc, highlight)}</span></span>}
                        <span style={{ marginLeft: 'auto', display: 'inline-flex' }}>{menu}</span>
                    </div>
                    {note.title && <div className="note-title">{hlText(note.title, highlight)}</div>}
                    {note.content && <div className={'note-content' + (contentLong && !expanded ? ' clamp' : '')} dangerouslySetInnerHTML={{ __html: hlHtml(mdToHtml(note.content), highlight) }} />}

                        <Button type="link" size="small" style={{ padding: 0, marginTop: 4 }} onClick={() => setExpanded(!expanded)}>{expanded ? '收起' : '展开全文'}</Button>
                    )}
                    {imgs.length > 0 && (
                        <div className={'note-imgs n' + Math.min(imgs.length, 4)}>
                            {shown.map((img, i) => (
                                <div key={img.id} className="ni" onClick={() => setOpenIdx(i)}>
                                    <img src={img.url} alt="" loading="lazy" />

                    {imgs.length > 0 && (
                        <Image.PreviewGroup
                            preview={{
                                visible: openIdx >= 0,

                        <div className="note-tags">

                                {note.tags.map(t => <Tag key={t} style={{ marginRight: 0 }}>#{t}</Tag>)}

                    <div className="note-actions">
                        <Button size="small" type="text" icon={<I name="EditOutlined" />} onClick={() => onEdit(note)}>编辑</Button>
                        <Button size="small" type="text" icon={<I name="PictureOutlined" />} onClick={() => onCard(note)}>生成卡片</Button>

        // ==================== 时间线 ====================
        function TimelineView({ notes, isDark, onEdit, onDelete, onCard, highlight }) {
            const groups = useMemo(() => {
                const map = {};
                (notes || []).forEach(n => {
                    const k = dayKey(n.created_at);
                    if (!map[k]) map[k] = [];
                    map[k].push(n);
                });
                return Object.keys(map).sort((a, b) => b.localeCompare(a)).map(k => ({ key: k, items: map[k] }));
            }, [notes]);
            if (!notes || notes.length === 0) {
                return <Empty description="还没有手记，点击右下角开始记录" style={{ marginTop: 60 }} />;
            }
            return (
                <div className="tl-wrap">
                    {groups.map(g => {
                        const dateText = g.key.replace(/-/g, '.');
                        const label = dayLabel(g.key);
                        return (
                            <div className="tl-day" key={g.key}>
                                <div className="tl-day-title">
                                    {label}
                                    {label !== dateText && <span className="tl-date">{dateText}</span>}

                                    <NoteCard key={n.id} note={n} isDark={isDark} onEdit={onEdit} onDelete={onDelete} onCard={onCard} highlight={highlight} />

        // ==================== 新建/编辑手记 Drawer ====================
        const PRESET_TAGS = ['生活', '工作', '服务器', '旅行', '想法', '待办', '重要'];
        // 自定义标签历史：localStorage 持久化，历史自定义标签在下拉中可直接点选
        const CUSTOM_TAGS_KEY = 'pvCustomTags';
        function loadCustomTags() {
            try { return JSON.parse(localStorage.getItem(CUSTOM_TAGS_KEY) || '[]'); } catch (e) { return []; }
        }
        function saveCustomTags(list) {
            try { localStorage.setItem(CUSTOM_TAGS_KEY, JSON.stringify(list.slice(0, 30))); } catch (e) { /* 忽略存储失败 */ }
        }
        function NoteEditor({ open, note, isDark, onClose, onSaved, onGenerateCard }) {
            const [title, setTitle] = useState('');
            const [content, setContent] = useState('');
            const [timeVal, setTimeVal] = useState('');
            const [loc, setLoc] = useState({ location_name: '', latitude: null, longitude: null });
            const [tags, setTags] = useState([]);
            // 自定义标签历史（localStorage 持久化）+ 输入框未确认文字（blur 兜底收签）
            const [customTags, setCustomTags] = useState(loadCustomTags);
            const pendingSearchRef = useRef('');
            // 标签变化时把新的自定义标签并入历史，下次可在下拉中直接点选
            const handleTagsChange = (vals) => {
                setTags(vals);
                const custom = vals.filter(t => !PRESET_TAGS.includes(t) && !customTags.includes(t));
                if (custom.length) {
                    const next = [...custom, ...customTags].slice(0, 30);
                    setCustomTags(next);
                    saveCustomTags(next);
                }
            };
            // blur 兜底：手机虚拟键盘「完成」键不触发 Enter，把未确认的输入直接收进标签
            const handleTagsBlur = () => {
                const v = (pendingSearchRef.current || '').trim();
                pendingSearchRef.current = '';
                if (v && !tags.includes(v)) handleTagsChange([...tags, v]);
            };
            const [images, setImages] = useState([]);
            const [audioList, setAudioList] = useState([]);
            const [saving, setSaving] = useState(false);
            const [exif, setExif] = useState(null);
            const [dragging, setDragging] = useState(false);
            const fileRef = useRef(null);
            const [emojiTab, setEmojiTab] = useState(0);
            // 同步防重锁：保存进行中时忽略后续触发（状态更新是异步的，快速连点会穿透 loading）
            const savingRef = useRef(false);
            const contentRef = useRef(null);
            // Markdown 快捷插入：before/after 包住所选文字，line 为行首前缀
            const mdWrap = (before, after, ph) => {
                const node = contentRef.current && contentRef.current.resizableTextArea;
                const ta = node && node.textArea;
                if (!ta) return;
                const start = ta.selectionStart, end = ta.selectionEnd;
                const sel = content.slice(start, end);
                const body = sel || ph;
                setContent(content.slice(0, start) + before + body + after + content.slice(end));
                requestAnimationFrame(() => { ta.focus(); ta.setSelectionRange(start + before.length, start + before.length + body.length); });
            };
            const mdLinePrefix = (prefix) => {
                const node = contentRef.current && contentRef.current.resizableTextArea;
                const ta = node && node.textArea;
                if (!ta) return;
                const pos = ta.selectionStart;
                const lineStart = content.lastIndexOf(String.fromCharCode(10), pos - 1) + 1;
                setContent(content.slice(0, lineStart) + prefix + content.slice(lineStart));
                requestAnimationFrame(() => { ta.focus(); ta.setSelectionRange(pos + prefix.length, pos + prefix.length); });
            };
            // 光标处插入任意文本（表情等），插入后光标停在文本之后
            const mdInsertText = (text) => {
                const node = contentRef.current && contentRef.current.resizableTextArea;
                const ta = node && node.textArea;
                if (!ta) return;
                const start = ta.selectionStart, end = ta.selectionEnd;
                setContent(content.slice(0, start) + text + content.slice(end));
                requestAnimationFrame(() => { ta.focus(); ta.setSelectionRange(start + text.length, start + text.length); });
            };
            // 未入库草稿的 id：选图/录音会自动创建草稿，重试时复用，避免生成多条空手记
            const draftRef = useRef(null);

            const reset = (n) => {
                setTitle(n && n.title ? n.title : '');
                setContent(n && n.content ? n.content : '');
                setTimeVal(n && n.created_at ? toLocalInput(n.created_at) : '');
                setLoc({ location_name: n && n.location_name || '', latitude: n ? n.latitude : null, longitude: n ? n.longitude : null });
                setTags(n && n.tags ? n.tags.slice() : []);
                setImages(n && n.images ? n.images.slice() : []);
                setAudioList(n && n.audio ? n.audio.slice() : []);
                setExif(null);
                draftRef.current = n && n.id ? n.id : null;
            };
            useEffect(() => {
                if (open) reset(note);
                // eslint-disable-next-line react-hooks/exhaustive-deps
            }, [open, note && note.id]);

            const uploadFiles = async (files, noteId) => {
                const id = noteId || (note ? note.id : null);
                if (!id) { message.warning('请先保存手记基本信息'); return; }
                for (const f of Array.from(files)) {
                    const fd = new FormData();
                    fd.append('file', f);
                    try {
                        const r = await fetch(baseUrl + '/api/private/notes/' + id + '/images', {
                            method: 'POST',
                            headers: { 'X-CSRF-Token': getCsrfToken() },
                            credentials: 'include', body: fd
                        });
                        const d = await r.json();
                        if (ok(d) && d.data && d.data.id) {
                            setImages(prev => prev.concat({ id: d.data.id, url: d.data.url, sort_order: d.data.sort_order }));
                            const ex = await readExif(f);
                            if (ex && (ex.gpsLat != null || ex.time)) setExif(ex);
                        } else {
                            message.error('图片上传失败：' + (d.message || ''));
                        }
                    } catch (e) {
                        message.error('图片上传失败，请重试');
                    }
                }
            };
            const onFiles = (list) => {
                if (!list || !list.length) return;
                const allowed = ['image/jpeg', 'image/png', 'image/webp', 'image/gif'];
                const extOk = f => /\.(jpe?g|png|webp|gif)$/i.test(f.name || '');
                // 逐张过滤：只跳过不支持的（如 iPhone 的 HEIC），不再整批拒绝
                const good = [], skipped = [];
                Array.from(list).forEach(f => {
                    if (allowed.includes(f.type) || extOk(f)) good.push(f);
                    else skipped.push(f);
                });
                if (skipped.length) {
                    message.warning(skipped.length === Array.from(list).length
                        ? '所选图片格式不支持，仅支持 jpg / png / webp / gif（iPhone 的 HEIC 照片可在分享时选择 JPEG）'
                        : `${skipped.length} 张图片格式不支持已跳过（仅支持 jpg / png / webp / gif）`);
                }
                if (!good.length) return;
                if (!note) {
                    // 尚无手记：先保存草稿（正文为空时给占位）；重试时复用已建草稿，避免生成多条空手记
                    if (draftRef.current) { uploadFiles(good, draftRef.current); return; }
                    doSave(true).then(saved => {
                        if (saved) { draftRef.current = saved.id; uploadFiles(good, saved.id); }
                    });
                    return;

                    created_at: timeVal ? fromLocalInput(timeVal) : undefined,
                    location_name: loc.location_name || '',

                    longitude: loc.longitude,
                    tags

                    const id = (note && note.id) || draftRef.current;
                    const path = id ? '/api/private/notes/' + id : '/api/private/notes';
                    const d = await api(path, { method: id ? 'PUT' : 'POST', body: JSON.stringify(body) });

                        return d.data;

                    if (!silent) message.error(d.message || '保存失败');
                    return null;
                } catch (e) {
                    if (!silent) message.error('保存失败，请重试');
                    return null;

                    savingRef.current = false;
                    setSaving(false);

                            value={content}

                        </Space>
                    </div>
                </Drawer>
