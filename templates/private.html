                {!loading && cards.length === 0 && <Empty description="还没有生成过卡片，在手记上点击「生成卡片」试试" style={{ marginTop: 60 }} />}
                {shareCard && <ShareModal open={!!shareCard} card={shareCard} onClose={() => setShareCard(null)} />}
            </div>
        );
    }

    // ==================== 密码验证 ====================
    function PasswordGate({ onUnlocked, isDark }) {
        const [pw, setPw] = useState('');
        const [loading, setLoading] = useState(false);
        const [err, setErr] = useState('');
        const submit = async () => {
            if (!pw) { setErr('请输入访问密码'); return; }
            setLoading(true); setErr('');
            try {
                const d = await api('/api/private/unlock', { method: 'POST', body: JSON.stringify({ password: pw }) });
                if (ok(d)) { setPw(''); onUnlocked(); }
                else if (d.code === 429) setErr('尝试次数过多，请稍后再试。');
                else setErr('密码错误');
            } catch (e) { setErr('网络错误，请重试'); }
            finally { setLoading(false); }
        };
        return (
            <div style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 16 }}>
                <Card style={{ width: '100%', maxWidth: 400, textAlign: 'center' }}>
                    <div style={{ fontSize: 34, marginBottom: 8 }}>🔒</div>
                    <Typography.Title level={3} style={{ marginBottom: 4 }}>私人空间</Typography.Title>
                    <Typography.Text type="secondary">请输入访问密码</Typography.Text>
                    <Input.Password
                        size="large"
                        placeholder="访问密码"
                        value={pw}
                        onChange={e => setPw(e.target.value)}
                        onPressEnter={submit}
                        autoFocus
                        style={{ marginTop: 18 }}
                    />
                    {err && <Alert type="error" message={err} showIcon style={{ marginTop: 10 }} />}
                    <Button type="primary" size="large" block loading={loading} onClick={submit} style={{ marginTop: 14 }}>进入</Button>
                    <div style={{ marginTop: 18 }}>
                        <Button type="text" size="small" onClick={() => window.location.href = 'index.html'}>返回 Server Status</Button>
                    </div>
                </Card>
            </div>
        );
    }

    // ==================== 主应用 ====================
    function PrivateApp() {
        const [phase, setPhase] = useState('loading');
        const [isDark, setIsDark] = useState(() => localStorage.getItem('theme') === 'dark');
        const [tab, setTab] = useState('timeline');
        const [notes, setNotes] = useState([]);
        const [allNotes, setAllNotes] = useState([]);
        const [mapFocus, setMapFocus] = useState(null);
        const [editorOpen, setEditorOpen] = useState(false);
        const [editing, setEditing] = useState(null);
        const [cardNote, setCardNote] = useState(null);
        const [searchQ, setSearchQ] = useState('');
        const isMobile = useMemo(() => typeof window !== 'undefined' && window.matchMedia('(max-width: 768px)').matches, []);

        useEffect(() => {
            api('/api/private/session').then(d => {
                if (d.code === 401) { window.location.href = 'index.html'; return; }
                setPhase(ok(d) && d.data && d.data.unlocked ? 'open' : 'locked');
            }).catch(() => setPhase('locked'));
        }, []);

        const loadAllNotes = useCallback(() => {
            api('/api/private/notes').then(d => {
                if (ok(d)) { setAllNotes(d.data || []); setNotes(d.data || []); setSearchQ(''); }
            });
        }, []);
        const loadNotes = useCallback((q) => {
            const path = q ? '/api/private/search?q=' + encodeURIComponent(q) : '/api/private/notes';
            api(path).then(d => {
                if (ok(d)) { setNotes(d.data || []); setSearchQ(q || ''); }
            });
        }, []);

        useEffect(() => {
            if (phase === 'open') loadAllNotes();
        }, [phase, loadAllNotes]);

        useEffect(() => {
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            document.documentElement.classList.toggle('dark', isDark);
            document.body.style.background = isDark ? '#141414' : '#f5f5f5';
        }, [isDark]);

        if (phase === 'loading') return <div style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center' }}><Spin size="large" /></div>;
        if (phase === 'locked') return (
            <ConfigProvider theme={{ algorithm: isDark ? darkAlgorithm : undefined, token: { colorBgLayout: isDark ? '#141414' : '#f5f5f5', colorBgContainer: isDark ? '#1f1f1f' : '#ffffff' } }}>
                <PasswordGate isDark={isDark} onUnlocked={() => { setPhase('open'); loadAllNotes(); }} />
            </ConfigProvider>
        );

        const onSaved = (n) => {
            setEditorOpen(false);
            loadAllNotes();
            if (searchQ) loadNotes(searchQ);
        };
        const onDelete = (n) => {
            Modal.confirm({
                title: '删除这条手记？',
                content: '此操作将同时删除相关附件和已生成卡片，且无法恢复。',
                okText: '删除', okType: 'danger', cancelText: '取消',
                onOk: async () => {
                    const d = await api('/api/private/notes/' + n.id, { method: 'DELETE' });
                    if (ok(d)) { message.success('手记已删除'); loadAllNotes(); if (searchQ) loadNotes(searchQ); }
                    else message.error('删除失败');
                }
            });
        };
        const changeTab = (t) => {
            setTab(t);
            if (t !== 'map') setMapFocus(null);
        };
        const bottomNav = [
            { key: 'timeline', label: '时间线', icon: 'ClockCircleOutlined' },
            { key: 'map', label: '地图', icon: 'GlobalOutlined' },
            { key: 'tags', label: '标签', icon: 'TagsOutlined' },
            { key: 'cards', label: '卡片', icon: 'PictureOutlined' }
        ];
        return (
            <ConfigProvider theme={{ algorithm: isDark ? darkAlgorithm : undefined, token: { colorBgLayout: isDark ? '#141414' : '#f5f5f5', colorBgContainer: isDark ? '#1f1f1f' : '#ffffff' } }}>
                <div className="pv-root" style={{ background: isDark ? '#141414' : '#f5f5f5' }}>
                    <div className="pv-topbar">
                        <div className="pv-brand"><I name="LockOutlined" className="pv-lock" /><span>私人空间</span></div>
                        <Input.Search
                            className="pv-search"
                            placeholder="搜索标题 / 正文 / 标签 / 地点"
                            allowClear
                            value={searchQ}
                            onChange={e => setSearchQ(e.target.value)}
                            onSearch={q => loadNotes(q || '')}
                        />
                        <span className="pv-status"><I name="UnlockOutlined" /> 已解锁</span>
                        <Button size="small" onClick={async () => {
                            await api('/api/private/lock', { method: 'POST' });
                            setPhase('locked');
                        }}>锁定</Button>
                        <Button size="small" icon={isDark ? <I name="SunOutlined" /> : <I name="MoonOutlined" />} onClick={() => setIsDark(!isDark)} />
                    </div>
                    <div className="pv-body">
                        {!isMobile && (
                            <Tabs
                                className="pv-tabs"
                                activeKey={tab}
                                onChange={changeTab}
                                items={[
                                    { key: 'timeline', label: <span><I name="ClockCircleOutlined" /> 时间线</span> },
                                    { key: 'map', label: <span><I name="GlobalOutlined" /> 地图</span> },
                                    { key: 'tags', label: <span><I name="TagsOutlined" /> 标签</span> },
                                    { key: 'cards', label: <span><I name="PictureOutlined" /> 卡片</span> }
                                ]}
                            />
                        )}
                        {tab === 'timeline' && <TimelineView notes={notes} isDark={isDark} highlight={searchQ} onEdit={n => { setEditing(n); setEditorOpen(true); }} onDelete={onDelete} onCard={n => setCardNote(n)} onLocClick={n => { setMapFocus(n); setTab('map'); }} />}
                        {tab === 'map' && <MapTab notes={allNotes} focus={mapFocus} onViewNote={n => { setEditing(n); setEditorOpen(true); }} />}
                        {tab === 'tags' && <TagsTab notes={allNotes} onViewNote={n => { setEditing(n); setEditorOpen(true); }} onCard={n => setCardNote(n)} />}
                        {tab === 'cards' && <CardsTab isDark={isDark} />}
                    </div>
                    {isMobile ? (
                        <Button className="pv-fab-mobile" type="primary" shape="circle" size="large" icon={<I name="PlusOutlined" />} onClick={() => { setEditing(null); setEditorOpen(true); }} />
                    ) : (
                        <Button className="pv-fab" type="primary" icon={<I name="PlusOutlined" />} onClick={() => { setEditing(null); setEditorOpen(true); }}>新建手记</Button>
                    )}
                    {isMobile && (
                        <div className="pv-bottom-nav">
                            {bottomNav.map(b => (
                                <button key={b.key} className={tab === b.key ? 'active' : ''} onClick={() => changeTab(b.key)}>
                                    <I name={b.icon} />
                                    {b.label}
                                </button>
                            ))}
                        </div>
                    )}
                    <NoteEditor
                        open={editorOpen}
                        note={editing}
                        isDark={isDark}
                        onClose={() => setEditorOpen(false)}
                        onSaved={onSaved}
                        onGenerateCard={n => setCardNote(n)}
                    />
                    <CardModal open={!!cardNote} note={cardNote} onClose={() => setCardNote(null)} />
                </div>
            </ConfigProvider>
        );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<PrivateApp />);
</script>
</body>
</html>
