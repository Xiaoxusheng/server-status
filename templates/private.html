                    return;
                }
                ctx.fillStyle = palette.bg;
                ctx.fillRect(0, 0, width, height);
            };

            // ==================== 服务器模板（实时数据）====================
            if (template === 'server') {
                await fillBackground();
                const s = server || {};
                ctx.textAlign = 'left';
                ctx.font = `700 ${width * 0.05}px ${fontFamily}`;
                ctx.fillStyle = palette.text;
                ctx.fillText(brandTxt || 'Server Status', padX, height * 0.14);
                const items = [
                    ['CPU', s.cpu_usage != null ? parseFloat(s.cpu_usage).toFixed(1) + '%' : '-'],
                    ['Memory', s.memory_usage != null ? parseFloat(s.memory_usage).toFixed(1) + '%' : '-'],
                    ['Disk', s.disk_usage != null ? parseFloat(s.disk_usage).toFixed(1) + '%' : '-'],
                    ['Network', s.upload_speed != null ? '↑' + parseFloat(s.upload_speed).toFixed(1) + ' / ↓' + parseFloat(s.download_speed).toFixed(1) + ' KB/s' : '-'],
                    ['Uptime', s.uptime || '-']
                ];
                const startY = height * 0.28;
                const rowH = height * 0.085;
                items.forEach((it, i) => {
                    const y = startY + i * rowH;
                    ctx.font = `400 ${width * 0.028}px ${fontFamily}`;
                    ctx.fillStyle = palette.secondary;
                    ctx.fillText(it[0], padX, y);
                    ctx.font = `600 ${width * 0.036}px ${fontFamily}`;
                    ctx.fillStyle = palette.text;
                    ctx.fillText(it[1], padX + width * 0.26, y);
                });
                ctx.fillStyle = '#52c41a';
                ctx.beginPath();
                ctx.arc(padX + width * 0.03, startY + items.length * rowH + height * 0.02, width * 0.011, 0, Math.PI * 2);
                ctx.fill();
                ctx.font = `500 ${width * 0.028}px ${fontFamily}`;
                ctx.fillStyle = palette.text;
                ctx.fillText('Online', padX + width * 0.065, startY + items.length * rowH + height * 0.03);
                if (timeTxt) {
                    ctx.font = `400 ${width * 0.024}px ${fontFamily}`;
                    ctx.fillStyle = palette.muted;
                    ctx.fillText(timeTxt, padX, height - height * 0.08);
                }
                await drawAudioQR('bottomright');
                drawBrand();
                return canvas;
            }

            // ==================== 图片模板（上方大图 + 下方文字）====================
            if (template === 'image') {
                await fillBackground();
                const imgs = tplImgs;
                // cardImgH 已在排版阶段按「文字越多图越小」预算好（单图最低 0.30h）；
                // 无图时全部版面留给文字
                const imgH = imgs.length ? cardImgH : 0;
                if (imgs.length) {
                    await drawCollage(0, 0, width, imgH, 0);
                    ctx.fillStyle = palette.bg;
                    ctx.fillRect(0, imgH, width, height - imgH);
                }
                const rest = height - imgH;
                // 居中按缩放后的实际文字高度计算，长文自动从顶部留白开始排，不与二维码重叠
                const scaledNeed = textNeed() * scale;
                let y = imgH + Math.max(height * 0.045, (rest - scaledNeed) / 2);
                y = drawText(y);
                await drawAudioQR('bottomright');
                drawBrand();
                return canvas;
            }

            // ==================== 旅行模板（地点 + 时间 + 文字 + 照片）====================
            if (template === 'travel') {
                await fillBackground();
                ctx.textAlign = 'left';
                ctx.font = `600 ${width * 0.052}px ${fontFamily}`;
                ctx.fillStyle = palette.text;
                ctx.fillText('📍 ' + (locText || '我的足迹'), padX, height * 0.15);
                ctx.font = `400 ${width * 0.027}px ${fontFamily}`;
                ctx.fillStyle = palette.secondary;
                ctx.fillText(timeTxt || '', padX, height * 0.205);
                let y = height * 0.27;
                y = drawText(y);
                if (showImages && images && images.length) {
                    const imgs = images.slice(0, 3);
                    const gap = width * 0.02;
                    const thumbW = (maxW - gap * (imgs.length - 1)) / imgs.length;
                    const thumbH = height * 0.28;
                    const ty = height - thumbH - height * 0.1;
                    for (let k = 0; k < imgs.length; k++) {
                        await drawImageCover(ctx, imgs[k], padX + k * (thumbW + gap), ty, thumbW, thumbH, 12);
                    }
                }
                await drawAudioQR('topright');
                drawBrand();
                return canvas;
            }

            // ==================== 小红书模板（奶油底 + 大标题 + 圆角拼图 + 标签胶囊）====================
            if (template === 'xhs') {
                const xhs = { bg: '#fff7ef', text: '#2b2622', secondary: 'rgba(43,38,34,.55)', red: '#ff2442' };
                ctx.fillStyle = xhs.bg;
                ctx.fillRect(0, 0, width, height);
                ctx.textAlign = 'left';
                let y = height * 0.072;
                // 大标题：左侧红色竖条 + 最多 3 行
                ctx.font = `800 ${width * 0.062}px ${fontFamily}`;
                const tLs = showTitle && title ? wrapText(ctx, mdStrip(title), maxW).slice(0, 3) : [];
                const tLH = width * 0.088;
                if (tLs.length) {
                    ctx.fillStyle = xhs.red;
                    roundRect(ctx, padX, y - tLH * 0.62, width * 0.012, tLH * (tLs.length * 0.82), width * 0.006);
                    ctx.fill();
                    ctx.fillStyle = xhs.text;
                    tLs.forEach((l, i) => ctx.fillText(l, padX + width * 0.032, y + i * tLH));
                    y += tLs.length * tLH + width * 0.025;
                }
                // 圆角拼图（最多 4 张，超出显示 +N）
                if (showImages && images && images.length) {
                    const ih = Math.min(height * 0.5, height - y - height * 0.24);
                    if (ih > height * 0.1) {
                        await drawCollage(padX, y, maxW, ih, width * 0.032);
                        y += ih + width * 0.04;
                    }
                }
                // 正文：按剩余空间裁行，末行省略号（字号跟随 fontScale）
                if (showContent && content) {
                    ctx.font = `400 ${width * 0.03 * fontScale}px ${fontFamily}`;
                    const cLH = width * 0.047 * fontScale;
                    // 有语音二维码时正文预留区加上二维码盒高度，防止末行被遮挡
                    const qrbRes = audioQRBox('bottomright');
                    const reserve = height * 0.16 + (tagList.length ? width * 0.07 : 0) + (qrbRes ? qrbRes.bh : 0);
                    const availH = Math.max(cLH, height - y - reserve);
                    let cLs = wrapText(ctx, mdStrip(content), maxW);
                    let maxLines = Math.max(1, Math.floor(availH / cLH));
                    if (fold && foldLines < maxLines) maxLines = foldLines;
                    if (cLs.length > maxLines) {
                        cLs = cLs.slice(0, maxLines);
                        cLs[maxLines - 1] = cLs[maxLines - 1].slice(0, Math.max(1, cLs[maxLines - 1].length - 2)) + '…';
                    }
                    ctx.fillStyle = xhs.text;
                    cLs.forEach((l, i) => ctx.fillText(l, padX, y + i * cLH));
                    y += cLs.length * cLH + width * 0.02;
                }
                // 标签胶囊（小红书红描边，最多 6 个）；有语音二维码时右边界让位给二维码盒
                if (tagList.length) {
                    const qrbXhs = audioQRBox('bottomright');
                    const tagRight = qrbXhs ? qrbXhs.bx - width * 0.025 : width - padX;
                    ctx.font = `500 ${width * 0.028}px ${fontFamily}`;
                    let tx = padX;
                    const ty = height * 0.865;
                    tagList.slice(0, 6).forEach(t => {
                        const tw = ctx.measureText(t).width + width * 0.05;
                        if (tx + tw > tagRight) return;
                        ctx.strokeStyle = xhs.red;
                        ctx.lineWidth = Math.max(1.5, width * 0.0032);
                        roundRect(ctx, tx, ty - width * 0.037, tw, width * 0.06, width * 0.03);
                        ctx.stroke();
                        ctx.fillStyle = xhs.red;
                        ctx.fillText(t, tx + width * 0.025, ty + width * 0.004);
                        tx += tw + width * 0.022;
                    });
                }
                // 底部：时间 · 地点（左） + 品牌（右）
                ctx.font = `400 ${width * 0.024}px ${fontFamily}`;
                ctx.fillStyle = xhs.secondary;
                ctx.fillText([timeTxt, locText].filter(Boolean).join(' · '), padX, height - height * 0.05);
                await drawAudioQR('bottomright');
                drawBrand();
                return canvas;
            }

            // ==================== 简洁 / 深色 / 浅灰（纯文字排版）====================
            await fillBackground();
            let y = height * 0.13;

        // ==================== 语音录音（移动端优先）====================
        const recorderSupported = typeof window !== 'undefined' && !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
        function AudioRecorder({ onSaved, onDeleted, audio }) {
            const [rec, setRec] = useState(null);
            const [state, setState] = useState('idle');
            const [secs, setSecs] = useState(0);
            const [playing, setPlaying] = useState(false);
            const timer = useRef(null);
            const chunks = useRef([]);
            const audioRef = useRef(null);
            const recRef = useRef(null);
            const startSec = useRef(0);

            useEffect(() => () => { if (timer.current) clearInterval(timer.current); if (recRef.current && recRef.current.state !== 'inactive') recRef.current.stop(); }, []);

            const start = async () => {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    const m = new MediaRecorder(stream);
                    chunks.current = [];
                    m.ondataavailable = e => { if (e.data.size) chunks.current.push(e.data); };
                    m.onstop = async () => {
                        stream.getTracks().forEach(t => t.stop());
                        const blob = new Blob(chunks.current, { type: m.mimeType || 'audio/webm' });
                        if (blob.size > 0) {
                            const name = 'voice-' + Date.now() + (blob.type.includes('mp4') ? '.m4a' : '.webm');
                            const file = new File([blob], name, { type: blob.type });
                            // 用计时起点实时计算时长：闭包里的 secs 是 start() 时刻的旧值（恒 0）
                            const elapsed = Math.max(1, Math.floor((Date.now() - startSec.current) / 1000));
                            onSaved(file, elapsed);
                        }
                        setState('idle'); setSecs(0);
                    };
                    recRef.current = m;
                    m.start();
                    startSec.current = Date.now();
                    setState('recording');
                    timer.current = setInterval(() => setSecs(Math.floor((Date.now() - startSec.current) / 1000)), 500);
                } catch (e) {
                    message.warning('无法使用麦克风');
                }
            };
            const stop = () => { if (recRef.current && recRef.current.state !== 'inactive') recRef.current.stop(); if (timer.current) clearInterval(timer.current); };
            const fmt = s => pad(Math.floor(s / 60)) + ':' + pad(s % 60);
            return (
                <div>
                    {audio && audio.id ? (
                        <Space direction="vertical" style={{ width: '100%' }}>
                            <Space>
                                <Button size="small" onClick={() => {
                                    const a = audioRef.current;
                                    if (!a) return;
                                    if (playing) { a.pause(); setPlaying(false); } else { a.play(); setPlaying(true); }
                                }}>
                                    <span className={'voice-bars' + (playing ? ' on' : '')}><i /><i /><i /><i /></span>
                                    <span style={{ marginLeft: 6 }}>{playing ? '暂停' : '播放'}</span>
                                </Button>
                                <Popconfirm title="删除这段语音？" onConfirm={() => onDeleted(audio.id)}>
                                    <Button size="small" danger icon={<I name="DeleteOutlined" />}>删除</Button>
                                </Popconfirm>
                                <Typography.Text type="secondary" style={{ fontSize: 12 }}>{fmt(Math.round(audio.duration || 0))}</Typography.Text>
                            </Space>
                            <audio ref={audioRef} src={audio.url} onEnded={() => setPlaying(false)} style={{ display: 'none' }} />
                        </Space>
                    ) : recorderSupported ? (
                        state === 'recording' ? (
                            <Space>
                                <Button size="small" danger icon={<I name="StopOutlined" />} onClick={stop}>停止</Button>
                                <Typography.Text style={{ color: '#ff4d4f', fontVariantNumeric: 'tabular-nums' }}>{fmt(secs)}</Typography.Text>
                            </Space>
                        ) : (
                            <Button icon={<I name="AudioOutlined" />} onClick={start}>录音</Button>
                        )
                    ) : null}
                </div>
            );
        }

        // ==================== 位置选择 ====================
        const builtinPlaces = [
            { name: '东京站', lat: 35.6812, lng: 139.7671 },

        // 反向地理编码：GPS 坐标 → 真实地名（nominatim → BigDataCloud → 坐标兜底）
        // 供浏览器定位与照片 EXIF 定位共用；任一服务 5s 无响应即切换下一级
        function reverseGeo(lat, lng, setName, fallbackCoord) {
            const fetchTimeout = (url, ms) => {
                const ctl = new AbortController();
                const t = setTimeout(() => ctl.abort(), ms);
                return fetch(url, { signal: ctl.signal }).finally(() => clearTimeout(t));
            };
            const bdc = () => fetchTimeout('https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=' + lat + '&longitude=' + lng + '&localityLanguage=zh', 5000)
                .then(r => r.json())
                .then(d => {
                    const info = (d.localityInfo && d.localityInfo.informative) || [];
                    // 最具体的一条（如街道/地标）排在最后取用
                    const detail = info.length ? info[info.length - 1].name : '';
                    const name = [d.city || d.locality, d.principalSubdivision, detail].filter(Boolean).join(' · ');
                    if (name) setName(name); else fallbackCoord();
                })
                .catch(fallbackCoord);
            // zoom=18 为建筑物级，可拿到门牌号与 POI 名称
            fetchTimeout('https://nominatim.openstreetmap.org/reverse?format=json&zoom=18&accept-language=zh-CN&lat=' + lat + '&lon=' + lng, 5000)
                .then(r => r.json())
                .then(d => {
                    const a = (d && d.address) || {};
                    const road = [a.road, a.house_number].filter(Boolean).join(' ') || a.neighbourhood || a.hamlet || '';
                    const parts = [a.city || a.town || a.county, a.suburb || a.city_district || a.district, road].filter(Boolean);
                    // POI 名（门店/小区等）最具体，未重复时放最前
                    const poi = d.name && d.name !== a.road ? d.name : '';
                    if (poi && !parts.includes(poi)) parts.unshift(poi);
                    const name = parts.join(' · ');
                    if (name || (d && d.display_name)) setName(name || d.display_name); else bdc();
                })
                .catch(bdc);
        }
        function LocationPicker({ value, onChange, exif, onUseTime }) {
            const [search, setSearch] = useState('');
            const [geoLoading, setGeoLoading] = useState(false);
            const [exifLoading, setExifLoading] = useState(false);
            const [manual, setManual] = useState(false);
            const [manualName, setManualName] = useState('');
            const [manualLat, setManualLat] = useState('');
            const [manualLng, setManualLng] = useState('');
            const valueStr = value && value.location_name ? value.location_name : '';
            const apply = (loc) => {
                onChange({

                    latitude: loc.lat != null ? loc.lat : null,
                    longitude: loc.lng != null ? loc.lng : null
                });
            };
            const geo = () => {
                if (!navigator.geolocation) {
                    message.warning(window.isSecureContext ? '当前浏览器不支持定位，请手动选择位置' : '手机浏览器要求 HTTPS 连接才能定位，请手动选择位置');
                    setManual(true);
                    return;
                }
                setGeoLoading(true);
                navigator.geolocation.getCurrentPosition(pos => {
                    setGeoLoading(false);
                    const lat = pos.coords.latitude, lng = pos.coords.longitude;
                    const fallbackCoord = () => onChange({ location_name: lat.toFixed(4) + ', ' + lng.toFixed(4), latitude: lat, longitude: lng });
                    const setName = name => onChange({ location_name: name, latitude: lat, longitude: lng });
                    // 反向地理编码：GPS 坐标 → 真实地名（城市 · 区县 · 道路）
                    reverseGeo(lat, lng, setName, fallbackCoord);
                }, err => {
                    setGeoLoading(false);
                    const why = {
                        1: '定位权限被拒绝，请在浏览器设置中允许本站使用位置信息',
                        2: '暂时无法获取位置，请移到开阔处重试',
                        3: '定位超时，请重试'
                    }[err && err.code] || '定位失败，请重试';
                    message.warning(why);
                    setManual(true);
                }, { enableHighAccuracy: true, timeout: 12000, maximumAge: 30000 });
            };
            // 使用照片 EXIF GPS：先解析出坐标，再反向地理编码成真实地名，失败回退显示坐标
            const usePhotoLoc = () => {
                if (!exif || exif.gpsLat == null || exifLoading) return;
                const lat = exif.gpsLatRef === 'S' ? -exif.gpsLat : exif.gpsLat;
                const lng = exif.gpsLonRef === 'W' ? -exif.gpsLon : exif.gpsLon;
                setExifLoading(true);
                const fallbackCoord = () => { setExifLoading(false); onChange({ location_name: lat.toFixed(4) + ', ' + lng.toFixed(4), latitude: lat, longitude: lng }); };
                const setName = name => { setExifLoading(false); onChange({ location_name: name, latitude: lat, longitude: lng }); };
                reverseGeo(lat, lng, setName, fallbackCoord);
            };
            // 照片带 GPS 且手记还没有位置时自动采用：每次编辑会话只尝试一次，已有位置绝不覆盖
            const autoLocRef = useRef(false);
            useEffect(() => {
                if (!exif) { autoLocRef.current = false; return; }
                if (autoLocRef.current || exif.gpsLat == null) return;
                autoLocRef.current = true;
                if (value && (value.location_name || value.latitude != null || value.longitude != null)) return;
                message.info('已自动填入照片位置');

            const results = search.trim() ? builtinPlaces.filter(p => p.name.includes(search.trim())) : [];
            return (
                <div>
                    <Space wrap>
                        <Button size="small" icon={<I name="EnvironmentOutlined" />} loading={geoLoading} onClick={geo}>
                            {valueStr ? '重新定位' : '添加位置'}
                        </Button>
                        <Button size="small" onClick={() => setManual(!manual)}>手动选择位置</Button>
                        {valueStr && <Button size="small" type="text" danger onClick={() => onChange({ location_name: '', latitude: null, longitude: null })}>清除</Button>}
                    </Space>
                    {exif && (exif.gpsLat != null || exif.time) && (
                        <div style={{ marginTop: 6, fontSize: 12, color: 'rgba(0,0,0,.45)' }}>
                            {exif.gpsLat != null && (
                                <Button size="small" type="link" style={{ padding: 0 }} loading={exifLoading} onClick={usePhotoLoc}>
                                    使用照片位置
                                </Button>
                            )}
                            {exif.time && (
                                <Button size="small" type="link" style={{ padding: 0, marginLeft: 8 }} title="将手记时间改为照片拍摄时间"
                                    onClick={() => { const t = exifToInput(exif.time); if (t && onUseTime) onUseTime(t); }}>
                                    拍摄时间：{exif.time}（点击采用）
                                </Button>
                            )}
                        </div>
                    )}
                    {valueStr && <div className="pv-loc-tip">📍 {valueStr}</div>}
                    {manual && (
                        <div style={{ marginTop: 8 }}>
                            <Space.Compact style={{ width: '100%' }}>
                                <Input placeholder="搜索地点，如：东京站" value={search} onChange={e => setSearch(e.target.value)} />
                            </Space.Compact>
                            {results.length > 0 && (
                                <div style={{ marginTop: 6 }}>
                                    {results.slice(0, 6).map(p => (
                                        <Tag key={p.name} color="blue" style={{ cursor: 'pointer', marginBottom: 4 }} onClick={() => { apply(p); setSearch(''); setManual(false); }}>
                                            {p.name} {p.lat.toFixed(3)}, {p.lng.toFixed(3)}
                                        </Tag>
                                    ))}
                                </div>
                            )}
                            <div style={{ marginTop: 8 }}>
                                <Space.Compact style={{ width: '100%' }}>
                                    <Input placeholder="自定义地点名称" value={manualName} onChange={e => setManualName(e.target.value)} />
                                    <Input placeholder="纬度(可选)" style={{ width: 120 }} value={manualLat} onChange={e => setManualLat(e.target.value)} />
                                    <Input placeholder="经度(可选)" style={{ width: 120 }} value={manualLng} onChange={e => setManualLng(e.target.value)} />
                                </Space.Compact>
                                <Button size="small" style={{ marginTop: 6 }} onClick={() => {
                                    const name = manualName.trim();
                                    if (!name) { message.warning('请输入地点名称'); return; }
                                    const lat = parseFloat(manualLat), lng = parseFloat(manualLng);
                                    apply({ name, lat: isNaN(lat) ? null : lat, lng: isNaN(lng) ? null : lng });
                                    setManual(false); setSearch(''); setManualName(''); setManualLat(''); setManualLng('');
                                }}>保存地点</Button>
                            </div>
                        </div>
                    )}

            );
        }

        // ==================== 手记卡片 ====================
        const locLabel = n => n.location_name || ((n.latitude != null && n.longitude != null) ? n.latitude.toFixed(2) + ', ' + n.longitude.toFixed(2) : '');
        const hlText = (text, q) => {
            if (!q || !text) return text;
            const esc = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            return String(text).split(new RegExp('(' + esc + ')', 'ig')).map((p, i) => p && p.toLowerCase() === q.toLowerCase() ? <mark key={i}>{p}</mark> : p);
        };
        const hlHtml = (html, q) => {
            if (!q || !html) return html;
            const esc = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            return String(html).replace(new RegExp(esc, 'gi'), '<mark>$&</mark>');
        };
        // 语音气泡播放器：点击播放/暂停，播放中显示跳动的声波
        function VoicePlayer({ src, duration }) {
            const [playing, setPlaying] = useState(false);
            const ref = useRef(null);
            const toggle = () => {
                const el = ref.current;
                if (!el) return;
                if (el.paused) el.play(); else el.pause();
            };
            const t = Math.max(0, Math.round(duration || 0));
            const durText = t >= 60 ? Math.floor(t / 60) + "'" + String(t % 60).padStart(2, '0') + '"' : t + '"';
            return (
                <span className={'voice-pill' + (playing ? ' playing' : '')} onClick={toggle}>
                    <span className={'voice-bars' + (playing ? ' on' : '')}><i /><i /><i /><i /></span>

                    <audio ref={ref} src={src} preload="none"
                        onPlay={() => setPlaying(true)}
                        onPause={() => setPlaying(false)}
                        onEnded={() => setPlaying(false)}
                        style={{ display: 'none' }} />
                </span>
            );
        }

        // NoteImageViewer 手记图片全屏查看器：
        // 不使用 antd Image.PreviewGroup（历史上多次出现隐藏 Image 抢带宽 / items 配置 /
        // 受控预览在滚动跳转后空白白屏等问题），改为自研 Portal 浮层，行为完全可控：
        // 点遮罩关闭、左右箭头 / 键盘 ←→ / 移动端左右滑动切换、Esc 关闭、加载中转圈、失败提示。
        function NoteImageViewer({ imgs, index, onClose, onNav }) {
            const total = imgs.length;
            const cur = Math.min(Math.max(index, 0), total - 1);
            const src = imgs[cur] ? imgs[cur].url : '';
            const [loaded, setLoaded] = useState(false);
            const [loadErr, setLoadErr] = useState(false);
            const touchX = useRef(null);
            // 切图后重置加载态
            useEffect(() => { setLoaded(false); setLoadErr(false); }, [src]);
            // 键盘导航 / 关闭
            useEffect(() => {
                const onKey = e => {
                    if (e.key === 'Escape') onClose();
                    else if (e.key === 'ArrowLeft' && cur > 0) onNav(cur - 1);
                    else if (e.key === 'ArrowRight' && cur < total - 1) onNav(cur + 1);
                };
                window.addEventListener('keydown', onKey);
                // 查看器打开时锁定背景滚动
                const prev = document.body.style.overflow;
                document.body.style.overflow = 'hidden';
                return () => {
                    window.removeEventListener('keydown', onKey);
                    document.body.style.overflow = prev;
                };
            }, [cur, total]);
            const nav = d => { const n = cur + d; if (n >= 0 && n < total) onNav(n); };
            return ReactDOM.createPortal(
                <div className="pv-imgview" onClick={e => { if (e.target === e.currentTarget) onClose(); }}>
                    <div className="pv-imgview-bar">
                        <span className="pv-imgview-count">{cur + 1} / {total}</span>
                        <button className="pv-imgview-x" onClick={onClose} aria-label="关闭"><I name="CloseOutlined" /></button>
                    </div>
                    <div className="pv-imgview-stage"
                        onClick={e => { if (e.target === e.currentTarget) onClose(); }}
                        onTouchStart={e => { touchX.current = e.touches[0].clientX; }}
                        onTouchEnd={e => {
                            if (touchX.current === null) return;
                            const dx = e.changedTouches[0].clientX - touchX.current;
                            touchX.current = null;
                            // 滑动超过 50px 切换上/下一张
                            if (dx < -50) nav(1);
                            else if (dx > 50) nav(-1);
                        }}>
                        {!loaded && !loadErr && <div className="pv-imgview-loading"><Spin size="large" /></div>}
                        {loadErr && <div className="pv-imgview-err">图片加载失败，请稍后重试</div>}
                        {!loadErr && (
                            <img key={src} src={src} alt="" draggable={false}
                                onLoad={() => setLoaded(true)}
                                onError={() => setLoadErr(true)}
                                style={{ opacity: loaded ? 1 : 0 }} />
                        )}
                        {cur > 0 && <button className="pv-imgview-nav prev" onClick={e => { e.stopPropagation(); nav(-1); }} aria-label="上一张"><I name="LeftOutlined" /></button>}
                        {cur < total - 1 && <button className="pv-imgview-nav next" onClick={e => { e.stopPropagation(); nav(1); }} aria-label="下一张"><I name="RightOutlined" /></button>}
                    </div>
                </div>,
                document.body
            );
        }

        function NoteCard({ note, onEdit, onDelete, onCard, highlight }) {
            const [openIdx, setOpenIdx] = useState(-1);
            const [playing, setPlaying] = useState(null); // 当前播放的视频对象，null = 关闭

            return (
                <Card className="note-card" data-note-id={note.id} styles={{ body: { padding: '14px 16px' } }}>
                    <div className="note-meta">
                        <span className="note-time">{fmtClock(note.created_at)}</span>
                        {loc && <span className="note-loc"><span className="nl-text">📍 {hlText(loc, highlight)}</span></span>}

                    {note.title && <div className="note-title">{hlText(note.title, highlight)}</div>}
                    {note.content && <div className={'note-content' + (contentLong && !expanded ? ' clamp' : '')} dangerouslySetInnerHTML={{ __html: hlHtml(mdToHtml(note.content), highlight) }} />}
                    {contentLong && (
                        <Button type="link" size="small" style={{ padding: 0, marginTop: 4 }} onClick={() => setExpanded(!expanded)}>{expanded ? '收起' : '展开全文'}</Button>
                    )}
                    {imgs.length > 0 && (
                        <div className={'note-imgs n' + Math.min(imgs.length, 4)}>
                            {shown.map((img, i) => (
                                <div key={img.id} className="ni" onClick={() => setOpenIdx(i)}>
                                    <img src={img.url} alt="" loading="lazy" decoding="async" />
                                    {i === shown.length - 1 && extra > 0 && <span className="ni-more">+{extra}</span>}
                                </div>
                            ))}
                        </div>
                    )}
                    {imgs.length > 0 && openIdx >= 0 && (
                        /* 自研全屏查看器（Portal 挂 body）：替代 antd Image.PreviewGroup，
                           彻底避免受控预览在日历跳转/长列表场景下空白、白屏问题 */
                        <NoteImageViewer
                            imgs={imgs}
                            index={openIdx}
                            onClose={() => setOpenIdx(-1)}
                            onNav={i => setOpenIdx(i)}

                    {vids.length > 0 && (
                        <div className="note-vids">
                            {vids.map(v => (
                                <div key={v.id} className="nv" onClick={() => setPlaying(v)}>
                                    {v.poster_url ? <img src={v.poster_url} alt="" loading="lazy" /> : <div className="pv-vid-noimg"><I name="VideoCameraOutlined" /></div>}
                                    <span className="nv-play"><I name="PlayCircleFilled" /></span>

                    {/* 视频播放弹窗：destroyOnClose 确保关闭即停止播放 */}
                    <Modal
                        open={!!playing}

                        footer={null}

                    >
                        {playing && <video src={playing.url} poster={playing.poster_url} controls autoPlay style={{ width: '100%', maxHeight: '70vh', borderRadius: 6, background: '#000' }} />}

        // ==================== 时间线 ====================
        function TimelineView({ notes, isDark, onEdit, onDelete, onCard, highlight }) {
            const groups = useMemo(() => {
                const map = {};
                (notes || []).forEach(n => {
                    const k = dayKey(n.created_at);
                    if (!map[k]) map[k] = [];
                    map[k].push(n);
                });
                return Object.keys(map).sort((a, b) => b.localeCompare(a)).map(k => ({ key: k, items: map[k] }));
            }, [notes]);
            if (!notes || notes.length === 0) {
                return <Empty description="还没有手记，点击右下角开始记录" style={{ marginTop: 60 }} />;
            }
            return (
                <div className={'tl-wrap' + ((notes || []).length > 80 ? ' pv-list-heavy' : '')}>
                    {/* 顶部记录日历：热力图 + 悬浮预览卡，点击跳转到下方对应手记 */}
                    <NoteCalendar groups={groups} />
                    {groups.map(g => {
                        const dateText = g.key.replace(/-/g, '.');
                        const label = dayLabel(g.key);
                        return (
                            <div className="tl-day" key={g.key} id={'day-' + g.key}>
                                <div className="tl-day-title">
                                    {label}
                                    {label !== dateText && <span className="tl-date">{dateText}</span>}
                                    <span className="tl-count">{g.items.length} 条</span>
                                </div>

                                    <div key={n.id} id={'note-' + n.id}>
                                        <NoteCard note={n} isDark={isDark} onEdit={onEdit} onDelete={onDelete} onCard={onCard} highlight={highlight} />
                                    </div>
                                ))}
                            </div>
                        );
                    })}
                </div>
            );
        }

        // ==================== 新建/编辑手记 Drawer ====================
        const PRESET_TAGS = ['生活', '工作', '服务器', '旅行', '想法', '待办', '重要'];
        // 自定义标签历史：localStorage 持久化，历史自定义标签在下拉中可直接点选
        const CUSTOM_TAGS_KEY = 'pvCustomTags';
        function loadCustomTags() {
            try { return JSON.parse(localStorage.getItem(CUSTOM_TAGS_KEY) || '[]'); } catch (e) { return []; }
        }
        function saveCustomTags(list) {
            try { localStorage.setItem(CUSTOM_TAGS_KEY, JSON.stringify(list.slice(0, 30))); } catch (e) { /* 忽略存储失败 */ }
        }
        function NoteEditor({ open, note, isDark, onClose, onSaved, onGenerateCard }) {
            const [title, setTitle] = useState('');
            const [content, setContent] = useState('');
            const [timeVal, setTimeVal] = useState('');
            const [loc, setLoc] = useState({ location_name: '', latitude: null, longitude: null });
            const [tags, setTags] = useState([]);
            // 自定义标签历史（localStorage 持久化）+ 输入框未确认文字（blur 兜底收签）
            const [customTags, setCustomTags] = useState(loadCustomTags);
            const pendingSearchRef = useRef('');
            // 标签变化时把新的自定义标签并入历史，下次可在下拉中直接点选
            const handleTagsChange = (vals) => {
                setTags(vals);
                const custom = vals.filter(t => !PRESET_TAGS.includes(t) && !customTags.includes(t));
                if (custom.length) {
                    const next = [...custom, ...customTags].slice(0, 30);
                    setCustomTags(next);
                    saveCustomTags(next);
                }
            };
            // blur 兜底：手机虚拟键盘「完成」键不触发 Enter，把未确认的输入直接收进标签
            const handleTagsBlur = () => {
                const v = (pendingSearchRef.current || '').trim();
                pendingSearchRef.current = '';
                if (v && !tags.includes(v)) handleTagsChange([...tags, v]);
            };
            const [images, setImages] = useState([]);
            const [audioList, setAudioList] = useState([]);
            const [videos, setVideos] = useState([]);
            const [vidProg, setVidProg] = useState(null); // 视频上传进度百分比，null = 未在上传
            const [saving, setSaving] = useState(false);
            const [exif, setExif] = useState(null);
            const [dragging, setDragging] = useState(false);
            const fileRef = useRef(null);
            const videoFileRef = useRef(null);
            const [emojiTab, setEmojiTab] = useState(0);
            // 同步防重锁：保存进行中时忽略后续触发（状态更新是异步的，快速连点会穿透 loading）
            const savingRef = useRef(false);
            const contentRef = useRef(null);
            // Markdown 快捷插入：before/after 包住所选文字，line 为行首前缀
            const mdWrap = (before, after, ph) => {
                const node = contentRef.current && contentRef.current.resizableTextArea;
                const ta = node && node.textArea;
                if (!ta) return;
                const start = ta.selectionStart, end = ta.selectionEnd;
                const sel = content.slice(start, end);
                const body = sel || ph;
                setContent(content.slice(0, start) + before + body + after + content.slice(end));
                requestAnimationFrame(() => { ta.focus(); ta.setSelectionRange(start + before.length, start + before.length + body.length); });
            };
            const mdLinePrefix = (prefix) => {
                const node = contentRef.current && contentRef.current.resizableTextArea;
                const ta = node && node.textArea;
                if (!ta) return;
                const pos = ta.selectionStart;
                const lineStart = content.lastIndexOf(String.fromCharCode(10), pos - 1) + 1;
                setContent(content.slice(0, lineStart) + prefix + content.slice(lineStart));
                requestAnimationFrame(() => { ta.focus(); ta.setSelectionRange(pos + prefix.length, pos + prefix.length); });
            };
            // 光标处插入任意文本（表情等），插入后光标停在文本之后
            const mdInsertText = (text) => {
                const node = contentRef.current && contentRef.current.resizableTextArea;
                const ta = node && node.textArea;
                if (!ta) return;
                const start = ta.selectionStart, end = ta.selectionEnd;
                setContent(content.slice(0, start) + text + content.slice(end));
                requestAnimationFrame(() => { ta.focus(); ta.setSelectionRange(start + text.length, start + text.length); });
            };
            // 未入库草稿的 id：选图/录音会自动创建草稿，重试时复用，避免生成多条空手记
            const draftRef = useRef(null);
            // EXIF 自动回填：整个编辑会话最多自动填一次拍摄时间；用户手动改过时间或编辑老手记时不动
            const autoExifRef = useRef(false);
            const timeTouchedRef = useRef(false);
            const hadNoteRef = useRef(false);

            const reset = (n) => {
                setTitle(n && n.title ? n.title : '');
                setContent(n && n.content ? n.content : '');
                setTimeVal(n && n.created_at ? toLocalInput(n.created_at) : '');
                autoExifRef.current = false;
                timeTouchedRef.current = false;
                hadNoteRef.current = !!(n && n.id);
                setLoc({ location_name: n && n.location_name || '', latitude: n ? n.latitude : null, longitude: n ? n.longitude : null });
                setTags(n && n.tags ? n.tags.slice() : []);
                // 换手记/重开编辑器时释放上一组本地缩略 blob，防泄漏（服务端 URL 的项无 thumb 字段不受影响）
                setImages(prev => {
                    prev.forEach(x => { if (x.thumb && x.thumb.indexOf('blob:') === 0) URL.revokeObjectURL(x.thumb); });
                    return n && n.images ? n.images.slice() : [];
                });
                setAudioList(n && n.audio ? n.audio.slice() : []);
                setVideos(n && n.videos ? n.videos.slice() : []);
                setExif(null);
                draftRef.current = n && n.id ? n.id : null;
            };
            useEffect(() => {
                if (open) reset(note);
                // eslint-disable-next-line react-hooks/exhaustive-deps
            }, [open, note && note.id]);

            const uploadFiles = async (files, noteId) => {
                const id = noteId || (note ? note.id : null);
                if (!id) { message.warning('请先保存手记基本信息'); return; }
                for (const f of Array.from(files)) {
                    const fd = new FormData();
                    fd.append('file', f);
                    try {
                        const r = await fetch(baseUrl + '/api/private/notes/' + id + '/images', {
                            method: 'POST',
                            headers: { 'X-CSRF-Token': getCsrfToken() },
                            credentials: 'include', body: fd
                        });
                        const d = await r.json();
                        if (ok(d) && d.data && d.data.id) {
                            // 编辑器预览条用本地缩略图显示（原图照常入库），避免多张原图解码卡死 UI
                            const thumb = await makeThumbUrl(f);
                            setImages(prev => prev.concat({ id: d.data.id, url: d.data.url, sort_order: d.data.sort_order, thumb: thumb || d.data.url }));
                            const ex = await readExif(f);
                            if (ex && (ex.gpsLat != null || ex.time)) {
                                setExif(ex);
                                // 自动回填拍摄时间：整个编辑会话只做一次，且仅在新建手记、用户未动过时间时
                                if (!autoExifRef.current) {
                                    autoExifRef.current = true;
                                    const t = exifToInput(ex.time);
                                    if (t && !hadNoteRef.current && !timeTouchedRef.current) {
                                        setTimeVal(t);
                                        message.info('已按照片拍摄时间回填手记时间');
                                    }
                                }
                            }
                        } else {
                            message.error('图片上传失败：' + (d.message || ''));
                        }
                    } catch (e) {
                        message.error('图片上传失败，请重试');
                    }
                }
            };
            const onFiles = (list) => {
                if (!list || !list.length) return;
                const allowed = ['image/jpeg', 'image/png', 'image/webp', 'image/gif'];
                const extOk = f => /\.(jpe?g|png|webp|gif)$/i.test(f.name || '');
                // 逐张过滤：只跳过不支持的（如 iPhone 的 HEIC），不再整批拒绝
                const good = [], skipped = [];
                Array.from(list).forEach(f => {
                    if (allowed.includes(f.type) || extOk(f)) good.push(f);
                    else skipped.push(f);
                });
                if (skipped.length) {
                    message.warning(skipped.length === Array.from(list).length
                        ? '所选图片格式不支持，仅支持 jpg / png / webp / gif（iPhone 的 HEIC 照片可在分享时选择 JPEG）'
                        : `${skipped.length} 张图片格式不支持已跳过（仅支持 jpg / png / webp / gif）`);
                }
                if (!good.length) return;
                if (!note) {
                    // 尚无手记：先保存草稿（正文为空时给占位）；重试时复用已建草稿，避免生成多条空手记
                    if (draftRef.current) { uploadFiles(good, draftRef.current); return; }
                    doSave(true).then(saved => {
                        if (saved) { draftRef.current = saved.id; uploadFiles(good, saved.id); }
                    });
                    return;
                }
                uploadFiles(good);
            };
            // 客户端截取视频封面并读取时长：loadedmetadata 记时长 → seek 到视频前段 → 捕获真实呈现帧绘制 JPEG
            // 时长独立于封面成败始终返回；解码失败（如 Chrome 不支持 HEVC）时仅封面为 null
            const makeVideoPoster = (file) => new Promise(resolve => {
                const v = document.createElement('video'); // 勿用 new Image/Video 构造器
                v.muted = true;
                v.playsInline = true;
                v.preload = 'auto';
                const url = URL.createObjectURL(file);
                let done = false;
                let duration = 0;
                let retried = false;
                const finish = blob => {
                    if (done) return;
                    done = true;
                    clearTimeout(timer);
                    URL.revokeObjectURL(url);
                    resolve({ blob: blob || null, duration: isFinite(duration) ? duration : 0 });
                };
                // 取视频 25% 处的帧：开头常见黑场/未出画，最深不超过 2 秒
                const seekTo = () => {
                    const d = isFinite(v.duration) && v.duration > 0 ? v.duration : 0;
                    return Math.min(Math.max(d * 0.25, 0.1), 2);
                };
                // 重试：回退到 0 帧再画一次；仍失败则放弃封面（时长已拿到）
                const retry = () => {
                    if (retried) { finish(null); return; }
                    retried = true;
                    try { v.currentTime = 0; } catch (e) { finish(null); }
                };
                const draw = () => {
                    try {
                        const cv = document.createElement('canvas');
                        const w = v.videoWidth || 720, h = v.videoHeight || 405;
                        const scale = Math.min(1, 720 / w);
                        cv.width = Math.round(w * scale);
                        cv.height = Math.round(h * scale);
                        cv.getContext('2d').drawImage(v, 0, 0, cv.width, cv.height);
                        cv.toBlob(b => { if (b) finish(b); else retry(); }, 'image/jpeg', 0.82);
                    } catch (e) { retry(); }
                };
                const timer = setTimeout(() => finish(null), 15000);
                v.onloadedmetadata = () => { duration = v.duration; };
                v.onseeked = () => {
                    // requestVideoFrameCallback：等真实呈现的帧再画，避免画到未就绪的黑帧；400ms 兜底防 rVFC 不触发
                    if (v.requestVideoFrameCallback) {
                        v.requestVideoFrameCallback(() => draw());
                        setTimeout(() => { if (!done) draw(); }, 400);
                    } else {
                        draw();
                    }
                };
                v.onloadeddata = () => {
                    try { v.currentTime = seekTo(); } catch (e) { finish(null); }
                };
                v.onerror = () => finish(null);
                v.src = url;
            });
            // XHR 上传单个视频（fetch 无上传进度；视频大必须展示进度条）
            // poster = { blob, duration }：blob 为 null（解码失败）时仅上传时长
            const uploadOneVideo = (f, noteId, poster) => new Promise(resolve => {
                const fd = new FormData();
                fd.append('file', f);
                fd.append('duration', String((poster && poster.duration) || 0));
                if (poster && poster.blob) {
                    fd.append('poster', poster.blob, 'poster.jpg');
                }
                const xhr = new XMLHttpRequest();
                xhr.open('POST', baseUrl + '/api/private/notes/' + noteId + '/video');
                xhr.withCredentials = true;
                xhr.setRequestHeader('X-CSRF-Token', getCsrfToken());
                xhr.upload.onprogress = e => {
                    if (e.lengthComputable) setVidProg(Math.min(99, Math.round(e.loaded / e.total * 100)));
                };
                xhr.onload = () => {
                    setVidProg(null);
                    try {
                        const d = JSON.parse(xhr.responseText);
                        if (ok(d) && d.data) { setVideos(prev => prev.concat(d.data)); resolve(true); return; }
                        message.error('视频上传失败：' + (d.message || ''));
                    } catch (e) { message.error('视频上传失败'); }
                    resolve(false);
                };
                xhr.onerror = () => { setVidProg(null); message.error('视频上传失败，请检查网络'); resolve(false); };
                setVidProg(0);
                xhr.send(fd);
            });
            const onVideoFiles = async (list) => {
                if (!list || !list.length) return;
                const good = [], skipped = [];
                Array.from(list).forEach(f => {
                    const sizeOk = f.size <= 200 * 1024 * 1024;
                    if ((/^video\//.test(f.type) || /\.(mp4|m4v|webm|mov)$/i.test(f.name || '')) && sizeOk) good.push(f);
                    else skipped.push(f);
                });
                if (skipped.length) {
                    message.warning(skipped.length === Array.from(list).length
                        ? '所选视频格式不支持或超过 200MB（支持 mp4 / mov / webm）'
                        : `${skipped.length} 个视频格式不支持或超限已跳过`);
                }
                if (!good.length) return;
                // 与图片一致：尚无手记时先静默建草稿（复用 draftRef 防重复建稿）
                let noteId = (note && note.id) || draftRef.current;
                if (!noteId) {
                    const saved = await doSave(true);
                    if (!saved) return;
                    note = saved;
                    draftRef.current = saved.id;
                    noteId = saved.id;
                }
                for (const f of good) {
                    const poster = await makeVideoPoster(f);
                    await uploadOneVideo(f, noteId, poster);
                }
            };
            const doSave = async (silent) => {
                if (savingRef.current) return null;
                if (!content.trim() && !title.trim() && images.length === 0 && videos.length === 0) { message.warning('请输入正文或标题'); return null; }
                savingRef.current = true;
                setSaving(true);
                const body = {
                    title, content,
                    created_at: timeVal ? fromLocalInput(timeVal) : undefined,
                    location_name: loc.location_name || '',
                    latitude: loc.latitude,
                    longitude: loc.longitude,
                    tags
                };
                try {
                    // 选图/录音已静默建过草稿时，改为更新草稿，避免保存时再 POST 出第二条
                    const id = (note && note.id) || draftRef.current;
                    const path = id ? '/api/private/notes/' + id : '/api/private/notes';
                    const d = await api(path, { method: id ? 'PUT' : 'POST', body: JSON.stringify(body) });
                    if (ok(d)) {
                        if (d.data && d.data.id) draftRef.current = d.data.id;
                        if (!silent) { message.success('已保存'); onSaved(d.data); }
                        return d.data;
                    }
                    if (!silent) message.error(d.message || '保存失败');
                    return null;
                } catch (e) {
                    if (!silent) message.error('保存失败，请重试');
                    return null;
                } finally {
                    savingRef.current = false;
                    setSaving(false);
                }
            };

                const arr = images.slice();
                const j = idx + dir;
                if (j < 0 || j >= arr.length) return;
                [arr[idx], arr[j]] = [arr[j], arr[idx]];
                setImages(arr);
                if (note) {
                    const ids = arr.map(x => x.id);

                }

                    else {
                        const saved = await doSave(true);
                        if (!saved) return;
                        note = saved;
                        draftRef.current = saved.id;
                    }
                }
                const fd = new FormData();
                fd.append('file', file);
                fd.append('duration', String(secs));
                try {
                    const r = await fetch(baseUrl + '/api/private/notes/' + note.id + '/audio', {
                        method: 'POST',
                        headers: { 'X-CSRF-Token': getCsrfToken() },
                        credentials: 'include', body: fd
                    });
                    const d = await r.json();
                    if (ok(d) && d.data) setAudioList(prev => prev.concat(d.data));
                    else message.error('语音保存失败');
                } catch (e) { message.error('语音保存失败'); }
            };

                        <Space wrap style={{ marginTop: 4 }}>
                            <Button type="primary" icon={<I name="SaveOutlined" />} loading={saving} onClick={() => doSave(false).then(n => n && onSaved(n))}>

                        </Space>
                    </div>
                </Drawer>

        }
