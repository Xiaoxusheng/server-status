            const [fullCanvas, setFullCanvas] = useState(null);
            const [genState, setGenState] = useState('idle'); // idle | generating | done | error
            const generatingRef = useRef(false); // 同步防重：连点「生成卡片」不再重复入库
            const [savedCard, setSavedCard] = useState(null);
            const [server, setServer] = useState(null);
            const [shareOpen, setShareOpen] = useState(false);
            const [fitHint, setFitHint] = useState(false);
            const [renderErr, setRenderErr] = useState(false);
            const [retryTick, setRetryTick] = useState(0);
            // 卡片选图：默认全选手记图片（最多 9 张），点选控制用哪几张及排列顺序
            const [selImgs, setSelImgs] = useState([]);
            // 语音二维码：手记有语音时向服务端申请分享令牌并取回二维码 PNG，
            // 打开弹窗期间缓存为 blob URL 供 renderCard 绘制；失败静默不阻塞卡片生成。
            // audioQROn 为用户开关：关闭时不绘制二维码（长文卡片可腾出更多排版空间）
            const [audioQR, setAudioQR] = useState(null);
            const [audioQROn, setAudioQROn] = useState(true);
            const audioQRRef = useRef(null);
            useEffect(() => {
                if (!open || !audioQROn || !note || !note.audio || !note.audio.length) return;
                if (audioQRRef.current) return; // 本次打开已申请过，切回开关时复用缓存
                let cancelled = false;
                fetch(baseUrl + '/api/private/notes/' + note.id + '/audio-share/qr', { credentials: 'include' })
                    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.blob(); })
                    .then(b => {
                        if (cancelled) return;
                        const u = URL.createObjectURL(b);
                        audioQRRef.current = u;
                        setAudioQR(u);
                    })
                    .catch(() => { });
                return () => { cancelled = true; };
            }, [open, note && note.id, audioQROn]);
            const stageRef = useRef(null);
            const previewRef = useRef(null);
            const timer = useRef(null);

            const opts = () => ({
                template,
                width: CARD_SIZES[size].w,
                height: CARD_SIZES[size].h,
                title: note ? note.title : '',
                content: note ? note.content : '',
                time: note ? note.created_at : new Date().toISOString(),
                location: note ? note.location_name : '',
                locationName: note ? note.location_name : '',
                latitude: note ? note.latitude : null,
                longitude: note ? note.longitude : null,
                tags: note ? note.tags : [],
                // 卡片图片 = 用户点选的子集（顺序即点选顺序），而非手记全量图片
                images: selImgs.map(u => u),
                // 语音二维码受开关控制：关闭时画布不绘制二维码
                audioQR: audioQROn ? audioQR : null,
                brand: show.brand ? brandText : false,
                server,
                show,
                locationMode,
                background,
                autoLayout,
                fold: foldLong,
                foldLines: foldLineN,
                fontScale
            });

            // 生成期间隐藏页面 AI 浮球等悬浮元素（Card Renderer 本身不依赖 DOM）
            useEffect(() => {
                if (open) document.body.classList.add('pv-card-gen');
                else document.body.classList.remove('pv-card-gen');
                return () => document.body.classList.remove('pv-card-gen');
            }, [open]);

            useEffect(() => {
                // 关闭时立即释放二维码 blob：若拖到下次打开才清理，
                // fetch effect 会因 ref 残留误判"已申请过"而跳过申请，旧 blob 又被当次 reset revoke，二维码将永远缺失
                if (!open) {
                    if (audioQRRef.current) { URL.revokeObjectURL(audioQRRef.current); audioQRRef.current = null; }
                    setAudioQR(null);
                    return;
                }
                const hasCardImg = !!(note && ((note.images && note.images.length) || (note.videos && note.videos.some(v => v.poster_url))));
                setTemplate(hasCardImg ? 'image' : 'simple');
                setSize(0);
                setFoldLong(false);
                setFoldLineN(8);
                setFontScale(1);
                setBackground('white');
                setShow({ title: true, content: true, time: true, location: true, tags: true, images: true, brand: false });
                setLocationMode('name');
                setAutoLayout(true);
                setZoom(1);
                setGenState('idle');
                setSavedCard(null);
                setFullCanvas(null);
                setServer(null);
                setFitHint(false);
                setRenderErr(false);
                setRetryTick(0);
                setAudioQROn(true);
                setSelImgs(note && (note.images || note.videos)
                    ? (note.images || []).slice(0, 9).map(i => i.url)
                        .concat((note.videos || []).filter(v => v.poster_url).map(v => v.poster_url))
                        .slice(0, 9)
                    : []);
            }, [open, note && note.id]);

            useEffect(() => {
                if (!open) return;
                if (template === 'server' && !server) {
                    api('/api/private/server-status').then(d => { if (ok(d) && d.data) setServer(d.data); });
                }
                clearTimeout(timer.current);
                timer.current = setTimeout(async () => {
                    try {
                        const c = await renderCard(opts());
                        setPreview(c);
                        setRenderErr(false);
                        setFitHint(!!c.fitHint);
                        if (previewRef.current) {
                            previewRef.current.width = c.width;
                            previewRef.current.height = c.height;
                            const ctx = previewRef.current.getContext('2d');
                            ctx.clearRect(0, 0, c.width, c.height);
                            ctx.drawImage(c, 0, 0);
                        }
                    } catch (e) { console.error('卡片预览渲染失败:', e); setRenderErr(true); }
                }, 200);
                // deps 必须包含 foldLong/foldLineN/fontScale：否则折叠行数与字号变化不触发预览重渲染（点击看似无效）
                // audioQR：二维码 blob URL 到位后需重绘预览，否则卡片上看不到语音二维码
                // eslint-disable-next-line react-hooks/exhaustive-deps
            }, [open, template, size, background, locationMode, autoLayout, show, brandText, server, note && note.id, retryTick, selImgs, foldLong, foldLineN, fontScale, audioQR, audioQROn]);

            // 预览缩放：只改变显示尺寸，内部保持真实分辨率
            useEffect(() => {
                const apply = () => {
                    const stage = stageRef.current;
                    const cv = previewRef.current;
                    if (!stage || !cv || !cv.width) return;
                    const sw = stage.clientWidth - 40;
                    const sh = stage.clientHeight - 40;
                    if (sw <= 0 || sh <= 0) return;
                    const fit = Math.min(sw / cv.width, sh / cv.height) * zoom;
                    cv.style.width = Math.round(cv.width * fit) + 'px';
                    cv.style.height = Math.round(cv.height * fit) + 'px';
                };
                apply();
                window.addEventListener('resize', apply);
                return () => window.removeEventListener('resize', apply);
            }, [preview, zoom, open]);

            const toBlob = c => new Promise(res => c.toBlob(res, 'image/png'));
            const generate = async () => {
                if (generatingRef.current) return;
                generatingRef.current = true;
                setGenState('generating');
                try {
                    const c = await renderCard(opts());
                    setFullCanvas(c);
                    const blob = await toBlob(c);
                    const b64 = await new Promise(res => {
                        const fr = new FileReader();
                        fr.onload = () => res(fr.result);
                        fr.readAsDataURL(blob);
                    });
                    const d = await api('/api/private/cards', {
                        method: 'POST',
                        body: JSON.stringify({
                            note_id: note ? note.id : '',
                            template, width: CARD_SIZES[size].w, height: CARD_SIZES[size].h,
                            title: mdStrip(note ? (note.title || note.content || '') : 'Server Status').slice(0, 80) || '未命名卡片',
                            image: b64
                        })
                    });
                    if (ok(d) && d.data) {
                        setSavedCard(d.data);
                        setGenState('done');
                        message.success('卡片已生成');
                    } else if (d.code === 403 && d.message === '未解锁') {
                        // 私人空间被自动锁定：api() 已触发重新验证浮层，
                        // 注册解锁成功后的自动重试，用户输完密码即可继续生成
                        window.__pvPendingRetry = () => generate();
                        setGenState('idle');
                    } else {
                        setGenState('error');
                        message.error(d.message || '卡片生成失败，请重试');
                    }
                } catch (e) {
                    console.error('卡片生成失败:', e);
                    setGenState('error');
                    message.error('卡片生成失败，请重试');
                } finally {
                    generatingRef.current = false;
                }
            };
            const savePng = async () => {
                const c = fullCanvas || preview;
                if (!c) return;
                const blob = await toBlob(c);
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = 'note-card-' + stamp(note ? note.created_at : null) + '.png';
                a.click();
                setTimeout(() => URL.revokeObjectURL(a.href), 3000);
            };
            const copyPng = async () => {
                const c = fullCanvas || preview;
                if (!c) return;
                const blob = await toBlob(c);
                try {
                    if (navigator.clipboard && window.ClipboardItem) {
                        await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
                        message.success('图片已复制');
                    } else {
                        message.info('当前浏览器不支持复制图片，请保存图片');
                    }
                } catch (e) {
                    message.info('当前浏览器不支持复制图片，请保存图片');
                }
            };

            const infoItems = [
                { key: 'title', label: '标题' }, { key: 'content', label: '正文' }, { key: 'time', label: '时间' },
                { key: 'location', label: '地点' }, { key: 'tags', label: '标签' }, { key: 'images', label: '图片' }, { key: 'brand', label: '品牌' }
            ];
            const isTextTpl = template === 'simple' || template === 'travel';

            return (
                <>
                    <Modal
                        className="cg-modal"
                        open={open}
                        onCancel={onClose}
                        width={1080}
                        style={{ maxWidth: '96vw', top: 20 }}
                        title="生成卡片"
                        destroyOnClose
                        footer={
                            <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8, justifyContent: 'flex-end', alignItems: 'center', width: '100%' }}>
                                {genState === 'done' && <span className="cg-success"><I name="CheckCircleOutlined" /> 已生成</span>}
                                {genState === 'done' && <Button icon={<I name="DownloadOutlined" />} onClick={savePng}>保存图片</Button>}
                                {genState === 'done' && <Button icon={<I name="CopyOutlined" />} onClick={copyPng}>复制图片</Button>}
                                {genState === 'done' && <Button type="primary" ghost icon={<I name="ShareAltOutlined" />} onClick={() => setShareOpen(true)}>分享</Button>}
                                {genState === 'error' && <Button onClick={generate}>重试</Button>}
                                {genState !== 'done' && <Button onClick={onClose}>取消</Button>}
                                {genState !== 'done' && (
                                    <Button type="primary" loading={genState === 'generating'} icon={genState !== 'generating' ? <I name="ThunderboltOutlined" /> : null} onClick={generate}>
                                        {genState === 'generating' ? '生成中...' : '生成卡片'}
                                    </Button>
                                )}
                            </div>
                        }
                    >
                        <div className="cg-layout">
                            {/* 左侧：设置 */}
                            <div className="cg-left">
                                <div className="cg-section">
                                    <div className="cg-label">模板</div>
                                    <div className="cg-tpl-row">
                                        {CARD_TEMPLATES.map(t => (
                                            <Button key={t.key} className="cg-tpl-btn" type={template === t.key ? 'primary' : 'default'} onClick={() => setTemplate(t.key)}>
                                                {t.label}
                                            </Button>
                                        ))}
                                    </div>
                                </div>
                                <div className="cg-section">
                                    <div className="cg-label">尺寸</div>
                                    <div className="cg-tpl-row">
                                        {CARD_SIZES.map((s, i) => (
                                            <Button key={i} className="cg-tpl-btn" type={size === i ? 'primary' : 'default'} onClick={() => setSize(i)}>
                                                <span>{s.label}</span>
                                                <span className="cg-tpl-ratio">{s.ratio}</span>
                                            </Button>
                                        ))}
                                    </div>
                                </div>
                                {isTextTpl && (
                                    <div className="cg-section">
                                        <div className="cg-label">背景</div>
                                        <Segmented size="small" block value={background} onChange={setBackground} options={[
                                            { value: 'white', label: '白色' },
                                            { value: 'gray', label: '浅灰' },
                                            { value: 'dark', label: '深色' },
                                            { value: 'image', label: '图片' }
                                        ]} />
                                    </div>
                                )}
                                <div className="cg-section">
                                    <div className="cg-label"><span className="cg-label-t">信息显示</span> <span className="cg-sub">控制进入卡片的内容</span></div>
                                    <div className="cg-info-row">
                                        {infoItems.map(it => (
                                            <Checkbox key={it.key} checked={show[it.key]} onChange={e => setShow({ ...show, [it.key]: e.target.checked })}>{it.label}</Checkbox>
                                        ))}
                                    </div>
                                    {show.brand && (
                                        <div style={{ marginTop: 8 }}>
                                            <Input size="small" value={brandText} onChange={e => setBrandText(e.target.value)} placeholder="品牌文字" style={{ width: 200 }} />
                                        </div>
                                    )}
                                    {show.location && template !== 'server' && (
                                        <div style={{ marginTop: 8 }}>
                                            <Segmented size="small" value={locationMode} onChange={setLocationMode} options={[
                                                { value: 'name', label: '地点名称' },
                                                { value: 'coords', label: '坐标' },
                                                { value: 'hidden', label: '隐藏' }
                                            ]} />
                                        </div>
                                    )}
                                </div>
                                <div className="cg-section">
                                    <div className="cg-label">
                                        <span className="cg-label-t">自动排版</span>
                                        <Tooltip title="自动调整字体与行距，防止文字溢出或被裁剪">
                                            <I name="QuestionCircleOutlined" style={{ color: 'rgba(0,0,0,.35)' }} />
                                        </Tooltip>
                                    </div>
                                    <Switch checked={autoLayout} onChange={setAutoLayout} checkedChildren="开" unCheckedChildren="关" />
                                </div>
                                <div className="cg-section">
                                    <div className="cg-label"><span className="cg-label-t">长文折叠</span> <span className="cg-sub">文字过长时保留前几行并以 … 结尾，字号保持可读</span></div>
                                    <Space size={12}>
                                        <Switch checked={foldLong} onChange={setFoldLong} checkedChildren="开" unCheckedChildren="关" />
                                        {foldLong && (
                                            <Segmented size="small" value={foldLineN} onChange={setFoldLineN} options={[
                                                { value: 6, label: '6 行' },
                                                { value: 8, label: '8 行' },
                                                { value: 12, label: '12 行' }
                                            ]} />
                                        )}
                                    </Space>
                                </div>
                                {note && note.audio && note.audio.length > 0 && (
                                    <div className="cg-section">
                                        <div className="cg-label">
                                            <span className="cg-label-t">语音二维码</span>
                                            <span className="cg-sub">卡片角落绘制二维码，扫码即可收听本条手记的语音；长文卡片可关闭以腾出排版空间</span>
                                        </div>
                                        <Switch checked={audioQROn} onChange={setAudioQROn} checkedChildren="开" unCheckedChildren="关" />
                                    </div>
                                )}
                                <div className="cg-section">
                                    <div className="cg-label"><span className="cg-label-t">正文字号</span> <span className="cg-sub">调整卡片正文文字大小，标题与时间不受影响</span></div>
                                    <Segmented size="small" value={fontScale} onChange={setFontScale} options={[
                                        { value: 0.85, label: '小' },
                                        { value: 1, label: '标准' },
                                        { value: 1.2, label: '大' },
                                        { value: 1.4, label: '特大' }
                                    ]} />
                                </div>
                                {note && (note.images || note.videos) && (note.images || []).length + (note.videos || []).filter(v => v.poster_url).length > 0 && show.images && (
                                    <div className="cg-section">
                                        <div className="cg-label">
                                            <span className="cg-label-t">选择图片</span>
                                            <span className="cg-sub">已选 {selImgs.length} / {(note.images || []).length + (note.videos || []).filter(v => v.poster_url).length} 张（最多 9 张），点击缩略图选取，角标即卡片排列顺序；视频取首帧</span>
                                        </div>
                                        <div className="cg-img-pick">
                                            {(note.images || []).map(img => ({ key: img.id || img.url, url: img.url, video: false }))
                                                .concat((note.videos || []).filter(v => v.poster_url).map(v => ({ key: 'v-' + v.id, url: v.poster_url, video: true })))
                                                .map(m => {
                                                    const idx = selImgs.indexOf(m.url);
                                                    const dis = idx < 0 && selImgs.length >= 9;
                                                    return (
                                                        <div key={m.key}
                                                            className={'cg-ip' + (idx >= 0 ? ' on' : '') + (dis ? ' dis' : '')}
                                                            onClick={() => {
                                                                if (dis) return;
                                                                setSelImgs(idx >= 0 ? selImgs.filter(u => u !== m.url) : [...selImgs, m.url]);
                                                            }}>
                                                            <img src={m.url} alt="" loading="lazy" />
                                                            {m.video && <span className="cg-ip-v"><I name="VideoCameraOutlined" /></span>}
                                                            {idx >= 0 && <span className="cg-ip-n">{idx + 1}</span>}
                                                        </div>
                                                    );
                                                })}
                                        </div>
                                    </div>
                                )}
                                {template === 'server' && !server && <div style={{ marginTop: 10 }}><Spin size="small" /> 正在获取服务器状态…</div>}
                            </div>
                            {/* 右侧：实时预览（与最终 PNG 同一 Renderer） */}
                            <div className="cg-right">
                                <div className="cg-stage" ref={stageRef}>
                                    {renderErr ? (
                                        <div style={{ textAlign: 'center' }}>
                                            <Alert type="warning" showIcon message="卡片渲染失败，请重试" style={{ marginBottom: 10 }} />
                                            <Button type="primary" icon={<I name="ReloadOutlined" />} onClick={() => setRetryTick(t => t + 1)}>重试</Button>
                                        </div>
                                    ) : (
                                        <>
                                            <canvas ref={previewRef} />
                                            {fitHint && <div className="cg-fit-hint">内容较长，已自动缩小字体</div>}
                                            {!preview && <Spin />}
                                        </>
                                    )}
                                </div>
                                <div className="cg-zoom">
                                    <Button size="small" icon={<I name="MinusOutlined" />} onClick={() => setZoom(Math.max(0.5, +(zoom - 0.25).toFixed(2)))} />
                                    <Typography.Text style={{ width: 46, textAlign: 'center', fontVariantNumeric: 'tabular-nums' }}>{Math.round(zoom * 100)}%</Typography.Text>
                                    <Button size="small" icon={<I name="PlusOutlined" />} onClick={() => setZoom(Math.min(1.5, +(zoom + 0.25).toFixed(2)))} />
                                </div>
                                <div className="cg-ratio">实际输出 {CARD_SIZES[size].w} × {CARD_SIZES[size].h}px · {CARD_SIZES[size].ratio}</div>
                            </div>
                        </div>
                    </Modal>
                    {savedCard && <ShareModal open={shareOpen} card={savedCard} onClose={() => setShareOpen(false)} />}
                </>
            );
        }

        // ==================== 分享 ====================
        function ShareModal({ open, card, onClose }) {
            const [expiry, setExpiry] = useState('24h');
            const [password, setPassword] = useState('');
            const [allowDownload, setAllowDownload] = useState(true);
            const [creating, setCreating] = useState(false);
            const creatingRef = useRef(false);
            const [share, setShare] = useState(null);
            const create = async () => {
                if (creatingRef.current) return;
                creatingRef.current = true;
                setCreating(true);
                try {
                    const d = await api('/api/private/cards/' + card.id + '/share', {
                        method: 'POST',
                        body: JSON.stringify({ expires_in: expiry, password, allow_download: allowDownload })
                    });
                    if (ok(d) && d.data) setShare(d.data);
                    else message.error(d.message || '分享失败，请重试');
                } catch (e) { message.error('分享失败，请重试'); }
                finally { creatingRef.current = false; setCreating(false); }
            };
            const copyText = async (t) => {
                // 优先 Clipboard API（HTTPS + 用户手势场景）；
                // iOS Safari / 微信内置浏览器常拒绝或不支持，降级 execCommand + 隐藏 textarea
                try {
                    if (navigator.clipboard && navigator.clipboard.writeText) {
                        await navigator.clipboard.writeText(t);
                        message.success('已复制');
                        return;
                    }
                } catch (e) { /* 降级到 execCommand */ }
                try {
                    const ta = document.createElement('textarea');
                    ta.value = t;
                    ta.setAttribute('readonly', '');
                    ta.style.position = 'fixed';
                    ta.style.top = '-9999px';
                    ta.style.opacity = '0';
                    document.body.appendChild(ta);
                    // iOS 需先 focus 再 select/setSelectionRange 才能选中
                    ta.focus();
                    ta.select();
                    ta.setSelectionRange(0, t.length);
                    const done = document.execCommand('copy');
                    document.body.removeChild(ta);
                    if (done) message.success('已复制');
                    else message.info('复制失败，请长按链接手动复制');
                } catch (e) {
                    message.info('复制失败，请长按链接手动复制');
                }
            };
            const saveQr = async () => {
                try {
                    const r = await fetch(baseUrl + share.qr_url, { credentials: 'include' });
                    const blob = await r.blob();
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = 'share-qr.png';
                    a.click();
                    setTimeout(() => URL.revokeObjectURL(a.href), 3000);
                } catch (e) { message.error('二维码下载失败'); }
            };
            // zIndex 2200 > 预览层 2100：从沉浸式预览内发起分享时，弹窗不会被预览层盖住
            return (
                <Modal open={open} onCancel={onClose} width={480} footer={null} title="生成分享链接" destroyOnClose zIndex={2200}>
                    {!share ? (
                        <Space direction="vertical" style={{ width: '100%' }} size={12}>
                            <div>
                                <div style={{ marginBottom: 6, fontWeight: 500 }}>有效期</div>
                                <Segmented block value={expiry} onChange={setExpiry} options={[
                                    { value: '10m', label: '10 分钟' },
                                    { value: '1h', label: '1 小时' },
                                    { value: '24h', label: '24 小时' },
                                    { value: '7d', label: '7 天' },
                                    { value: 'permanent', label: '永久' }
                                ]} />
                            </div>
                            <div>
                                <div style={{ marginBottom: 6, fontWeight: 500 }}>访问密码（可选）</div>
                                <Input.Password placeholder="不填则无需密码" value={password} onChange={e => setPassword(e.target.value)} />
                            </div>
                            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                                <span>允许下载图片</span>
                                <Switch checked={allowDownload} onChange={setAllowDownload} />
                            </div>
                            <Button type="primary" block loading={creating} onClick={create}>生成分享链接</Button>
                        </Space>
                    ) : (
                        <div style={{ textAlign: 'center' }}>
                            <img src={baseUrl + share.qr_url} alt="二维码" style={{ width: 220, height: 220, borderRadius: 8 }} />
                            <div className="share-line">
                                <Input readOnly value={share.url} />
                                <Button onClick={() => copyText(share.url)}>复制链接</Button>
                            </div>
                            <div className="share-line" style={{ justifyContent: 'center' }}>
                                <Button icon={<I name="QrcodeOutlined" />} onClick={saveQr}>保存二维码</Button>
                                <Button icon={<I name="CopyOutlined" />} onClick={() => {
                                    fetch(baseUrl + share.qr_url, { credentials: 'include' })
                                        .then(r => r.blob())
                                        .then(async blob => {
                                            try {
                                                if (navigator.clipboard && window.ClipboardItem) {
                                                    await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
                                                    message.success('二维码已复制');
                                                } else message.info('浏览器不支持复制图片，请保存二维码');
                                            } catch (e) { message.info('浏览器不支持复制图片，请保存二维码'); }
                                        });
                                }}>复制二维码</Button>
                            </div>
                            {share.expires_at && <Typography.Text type="secondary" style={{ display: 'block', marginTop: 8, fontSize: 12 }}>有效期至 {fmtFull(share.expires_at)}</Typography.Text>}
                        </div>
                    )
                    }
                </Modal >
            );
        }

        // ==================== 记录日历（嵌入时间线顶部） ====================
        // 紧凑热力图：有手记的日期着色；桌面悬停 / 移动端点按在旁边浮出当天手记预览卡，
        // 点击预览项平滑滚动到下方对应手记并闪烁高亮，「在时间线中查看」定位到当天分组。
        function NoteCalendar({ groups }) {
            const [pop, setPop] = useState(null); // { key, items, left, top }
            const cardRef = useRef(null);

            // 日期 → 篇数映射（groups 已按日期分组且倒序）
            const counts = useMemo(() => {
                const m = {};
                groups.forEach(g => { m[g.key] = g.items.length; });
                return m;
            }, [groups]);

            // 生成最近一年（53 周）周列网格：周一为第一行，未来日期留空
            const weeks = useMemo(() => {
                const today = new Date();
                const dow = (today.getDay() + 6) % 7; // 周一=0 ... 周日=6
                const end = new Date(today);
                end.setDate(today.getDate() + (6 - dow)); // 本周日（网格最后一天）
                const start = new Date(end);
                start.setDate(end.getDate() - 53 * 7 + 1); // 往前推满 53 周
                const cols = [];
                const cur = new Date(start);
                const todayEnd = new Date(today.getFullYear(), today.getMonth(), today.getDate(), 23, 59, 59);
                while (cur <= end) {
                    const col = [];
                    for (let d = 0; d < 7; d++) { col.push(new Date(cur)); cur.setDate(cur.getDate() + 1); }
                    cols.push(col);
                }
                return { cols, todayEnd };
            }, []);

            // 日期 → 分组 Map：格子渲染 O(1) 取当天手记，取代逐格 groups.find 线性扫
            const groupMap = useMemo(() => {
                const m = {};
                groups.forEach(g => { m[g.key] = g; });
                return m;
            }, [groups]);

            // 月份标注：某列首格所在月份与前列不同 → 该列顶部标注月份
            const monthLabels = useMemo(() => {
                const labels = []; let last = -1;
                weeks.cols.forEach((col, w) => {
                    const m = col[0].getMonth();
                    if (m !== last) { labels.push({ col: w, label: (m + 1) + '月' }); last = m; }
                });
                return labels;
            }, [weeks]);

            // 篇数 → 色阶 0-4（0 篇/1 篇/2 篇/3-4 篇/5+ 篇）
            const level = c => (c === 0 ? 0 : c === 1 ? 1 : c === 2 ? 2 : c <= 4 ? 3 : 4);

            // 展示浮层：以日历卡片为定位基准计算坐标，水平钳制防溢出
            const showPop = (key, items, cell) => {
                const card = cardRef.current;
                if (!card) return;
                prefetchDayImgs(key, items);
                const cr = card.getBoundingClientRect();
                const r = cell.getBoundingClientRect();
                const left = Math.max(110, Math.min(r.left - cr.left + r.width / 2, cr.width - 110));
                setPop({ key, items, left, top: r.bottom - cr.top + 10 });
            };

            // 目标区域懒加载图提前转 eager：瞬移落地即开始加载。
            // 不主动调用 img.decode()——多张大图集中解码会阻塞主线程造成卡顿，
            // 交给浏览器随绘制渐进解码更流畅，占位背景兜底不会闪白。
            const predecodeImgs = root => {
                if (!root) return;
                root.querySelectorAll('img[loading="lazy"]').forEach(img => { img.loading = 'eager'; });
            };

            // 弹层打开即预取当天手记图片（前 6 条）：预览浮层显示与用户点选之间有天然时间差，
            // 把图片网络加载与解码提前铺进这段空闲——等真正点击跳转、瞬移落地时，
            // 落点视口的图片已在缓存且已解码，绘制开销趋近于零，不再有落地卡顿。
            // 已预取的日期直接跳过：桌面端悬停扫过一排格子时不重复扫 DOM / 触发解码
            const prefetchedRef = useRef(null);
            const prefetchDayImgs = (key, items) => {
                if (!prefetchedRef.current) prefetchedRef.current = new Set();
                if (prefetchedRef.current.has(key)) return;
                prefetchedRef.current.add(key);
                (items || []).slice(0, 6).forEach(n => {
                    const card = document.querySelector('[data-note-id="' + n.id + '"]');
                    if (!card) return;
                    card.querySelectorAll('img[loading="lazy"]').forEach(img => {
                        img.loading = 'eager';
                        if (img.decode) img.decode().catch(() => { });
                    });
                });
            };

            // 跳转动画：长距离先瞬移到目标外侧约 1 屏、停 2 帧待布局稳定，
            // 再原生平滑滚动收尾（合成器驱动，落地绘制忙也不掉帧）；短距离整段平滑一次到位。
            const jumpTo = (key, id) => {
                setPop(null);
                const el = document.getElementById(id ? 'note-' + id : 'day-' + key);
                if (!el) return;
                const block = id ? 'center' : 'start';

                // 目标卡片及上一张卡片内的懒加载图提前转为立即加载并预解码
                predecodeImgs(el);
                predecodeImgs(el.previousElementSibling);

                // 闪烁高亮
                const card = el.classList.contains('note-card') ? el : el.querySelector('.note-card');
                const t = card || el;
                t.classList.add('note-flash');
                setTimeout(() => t.classList.remove('note-flash'), 1700);

                // 目标坐标延迟解析：瞬移后邻近卡片真实渲染、高度可能变化，收尾前取实时位置
                const resolveTarget = () => {
                    const rect = el.getBoundingClientRect();
                    return block === 'center'
                        ? window.scrollY + rect.top - window.innerHeight / 2
                        : window.scrollY + rect.top - 70;
                };
                animateScrollTo(resolveTarget, 600);
            };

            // 点击日历以外区域关闭浮层（移动端没有 mouseleave）
            useEffect(() => {
                const onDoc = (e) => { if (cardRef.current && !cardRef.current.contains(e.target)) setPop(null); };
                document.addEventListener('click', onDoc);
                return () => document.removeEventListener('click', onDoc);
            }, []);

            // 格子节点整体 memo：pop 开/关只重渲染浮层本身，React 对引用不变的
            // 365 个格子子树直接跳过 reconcile，点按日历跟手不迟滞
            const cells = useMemo(() => weeks.cols.map((col, w) => col.map((dt, d) => {
                const key = dt.getFullYear() + '-' + pad(dt.getMonth() + 1) + '-' + pad(dt.getDate());
                const future = dt > weeks.todayEnd;
                const c = counts[key] || 0;
                const items = c ? (groupMap[key] || {}).items : null;
                const cls = 'cal-cell' + (future ? ' future' : ' cal-l' + level(c));
                return <div key={w + '-' + d} className={cls}
                    title={future ? '' : key + (c ? ' · ' + c + ' 篇' : '')}
                    onMouseEnter={c ? (e) => showPop(key, items, e.currentTarget) : undefined}
                    onClick={c ? (e) => showPop(key, items, e.currentTarget) : undefined} />;
            })), [weeks, counts, groupMap]);

            return (
                <div className="cal-card" ref={cardRef} onMouseLeave={() => setPop(null)}>
                    <div className="cal-head">
                        <span className="cal-title">记录日历</span>
                        <span className="cal-stat">近一年 {groups.reduce((s, g) => s + g.items.length, 0)} 篇 · {groups.length} 天有记录 · 悬停预览，点击条目跳转</span>
                    </div>
                    <div className="cal-scroll">
                        <div className="cal-inner">
                            <div className="cal-months">
                                {weeks.cols.map((_, w) => {
                                    const hit = monthLabels.find(x => x.col === w);
                                    return <span key={w}>{hit ? hit.label : ''}</span>;
                                })}
                            </div>
                            <div className="cal-body">
                                <div className="cal-weekdays">
                                    <span>一</span><span></span><span>三</span><span></span><span>五</span><span></span><span>日</span>
                                </div>
                                <div className="cal-grid">
                                    {cells}
                                </div>
                            </div>
                            <div className="cal-legend">
                                少 <i style={{ background: 'var(--cal-0)' }} /><i style={{ background: 'var(--cal-1)' }} /><i style={{ background: 'var(--cal-2)' }} /><i style={{ background: 'var(--cal-3)' }} /><i style={{ background: 'var(--cal-4)' }} /> 多
                            </div>
                        </div>
                    </div>
                    {pop && (
                        <div className="cal-pop" style={{ left: pop.left, top: pop.top }}>
                            <div className="cal-pop-head">{dayLabel(pop.key)} · {pop.items.length} 条</div>
                            {pop.items.slice(0, 5).map(n => {
                                const t = parseISO(n.created_at);
                                return (
                                    <div key={n.id} className="cal-pop-item" onClick={() => jumpTo(pop.key, n.id)}>
                                        <div className="cal-pop-item-t">{(n.title || (n.content || '').split('\n')[0] || '未命名').slice(0, 42)}</div>
                                        {t && <div className="cal-pop-item-time">{pad(t.getHours())}:{pad(t.getMinutes())}</div>}
                                    </div>
                                );
                            })}
                            {pop.items.length > 5 && <div className="cal-pop-more">还有 {pop.items.length - 5} 条</div>}
                            <div className="cal-pop-jump" onClick={() => jumpTo(pop.key, null)}>在时间线中查看这一天 →</div>
                        </div>
                    )}
                </div>
            );
        }

        // ==================== 标签 ====================
        function TagsTab({ notes, onViewNote, onCard }) {
            const [tag, setTag] = useState(null);
            const counts = useMemo(() => {
                const m = {};
                const last = {};
                (notes || []).forEach(n => {
                    (n.tags || []).forEach(t => {
                        m[t] = (m[t] || 0) + 1;
                        const d = new Date(n.created_at).getTime();
                        if (!last[t] || d > last[t]) last[t] = d;
                    });
                });
                return Object.keys(m)
                    .sort((a, b) => m[b] - m[a])
                    .map(t => ({ tag: t, count: m[t], last: last[t] }));
            }, [notes]);
            const filtered = tag ? (notes || []).filter(n => (n.tags || []).includes(tag)) : [];
            const top = counts.slice(0, 6);
            return (
                <div>
                    <div className="pv-tags-head">标签</div>
                    {counts.length === 0 && <Empty description="还没有标签，给手记添加标签后会出现在这里" style={{ marginTop: 50 }} />}
                    {counts.length > 0 && (
                        <>
                            <div style={{ fontSize: 13, fontWeight: 600, color: 'rgba(0,0,0,.65)', marginBottom: 8 }}>常用标签</div>
                            <div className="pv-tag-grid">
                                {top.map(c => (
                                    <div key={c.tag} className={'pv-tag-card' + (tag === c.tag ? ' active' : '')} onClick={() => setTag(tag === c.tag ? null : c.tag)}>
                                        <div className="tc-name"><Tag color={tag === c.tag ? 'blue' : 'default'} style={{ margin: 0 }}>#{c.tag}</Tag></div>
                                        <div className="tc-count">{c.count} 条手记 · {fmtDate(new Date(c.last).toISOString())}</div>
                                    </div>
                                ))}
                            </div>
                            {counts.length > top.length && (
                                <>
                                    <div style={{ fontSize: 13, fontWeight: 600, color: 'rgba(0,0,0,.65)', marginBottom: 8 }}>全部标签</div>
                                    <div className="pv-tag-grid">
                                        {counts.slice(top.length).map(c => (
                                            <div key={c.tag} className={'pv-tag-card' + (tag === c.tag ? ' active' : '')} onClick={() => setTag(tag === c.tag ? null : c.tag)}>
                                                <div className="tc-name"><Tag color={tag === c.tag ? 'blue' : 'default'} style={{ margin: 0 }}>#{c.tag}</Tag></div>
                                                <div className="tc-count">{c.count} 条手记 · {fmtDate(new Date(c.last).toISOString())}</div>
                                            </div>
                                        ))}
                                    </div>
                                </>
                            )}
                            {tag && (
                                <div style={{ marginBottom: 12 }}>
                                    <Typography.Text type="secondary">#{tag} · {filtered.length} 条手记</Typography.Text>
                                </div>
                            )}
                            {tag && (
                                <TimelineView notes={filtered} onEdit={onViewNote} onDelete={() => { }} onCard={onCard} />
                            )}
                        </>
                    )}
                </div>
            );
        }

        // ==================== 卡片图片：宽高比占位 + 加载淡入 + 失败兜底（加载过程零跳动） ====================
        function CardImg({ c }) {
            const [st, setSt] = useState('loading');
            return (
                <>
                    <img src={c.url} alt={mdStrip(c.title) || '卡片'} loading="lazy" draggable={false}
                        className={st === 'loaded' ? 'is-loaded' : ''}
                        onLoad={() => setSt('loaded')} onError={() => setSt('error')} />
                    {st === 'error' && (
                        <div className="mcard-fallback"><I name="PictureOutlined" /><span>加载失败</span></div>
                    )}
                </>
            );
        }

        // ==================== 沉浸式卡片预览：深色遮罩 + 居中大图 ====================
        // 交互：ESC 关闭 / ←→ 或滑动切换 / 滚轮缩放 / 双击放大 / 放大后拖拽平移
        function CardViewer({ cards, index, onNav, onClose, onSave, onShare }) {
            const [scale, setScale] = useState(1);
            const [off, setOff] = useState({ x: 0, y: 0 });
            const [dragging, setDragging] = useState(false);
            const [dispUrl, setDispUrl] = useState(''); // 当前实际显示的大图：新图加载完成后才替换，旧图保持可见
            const [loadErr, setLoadErr] = useState(false);
            const [slideDir, setSlideDir] = useState(0); // 滑出方向：1=切下一张(向左滑出)、-1=切上一张、0=无动画
            const [enterDir, setEnterDir] = useState(0); // 新图滑入方向（与 slideDir 同源），决定入场动画类名
            const dragRef = useRef(null);
            const stageRef = useRef(null);
            const suppressClickRef = useRef(false); // 拖拽/滑动后的 click 不触发遮罩关闭
            const scaleRef = useRef(1);
            const navLockRef = useRef(false); // 滑动动画期间加锁，防连点叠帧
            const navTimerRef = useRef(null);
            const lastNavRef = useRef(0); // 上次切换时间戳：限流，杜绝一次手势触发多次切换
            const touchRef = useRef(null); // 触摸滑动起点
            const stripRef = useRef(null); // 底部胶片条容器
            const c = cards[index];
            const total = cards.length;
            const touch = useMemo(() => window.matchMedia && window.matchMedia('(hover: none)').matches, []);

            // 切换（带滑动动画）：当前图向运动方向淡出 160ms → 更新 index → 新图从对应方向滑入；
            // 双重保险防连跳：动画锁 + 260ms 时间戳限流；组件卸载时清理定时器
            const nav = useCallback(dir => {
                if (navLockRef.current || Date.now() - lastNavRef.current < 260) return;
                const ni = index + dir;
                if (ni < 0 || ni >= total) return;
                navLockRef.current = true;
                lastNavRef.current = Date.now();
                setEnterDir(dir);
                setSlideDir(dir);
                navTimerRef.current = setTimeout(() => {
                    onNav(ni);
                    // slideDir 不在此处复位：等新图加载完成（dispUrl 变化）后才开始滑入
                    navLockRef.current = false;
                }, 160);
            }, [index, total, onNav]);
            // 卸载时取消未完成的切换定时器（预览中途被关闭的场景）
            useEffect(() => () => { if (navTimerRef.current) clearTimeout(navTimerRef.current); }, []);
            // 切换时重置缩放/偏移；新图后台预加载，加载完成才替换显示（旧图保持可见，无黑屏等待）
            useEffect(() => { setScale(1); setOff({ x: 0, y: 0 }); }, [index]);
            useEffect(() => {
                const c = cards[index];
                if (!c) return;
                setLoadErr(false);
                const url = baseUrl + c.url;
                let cancelled = false;
                const im = document.createElement('img'); // 勿用 new Image()：antd Image 已遮蔽原生构造器
                im.onload = function () { if (!cancelled) setDispUrl(url); };
                im.onerror = function () { if (!cancelled) { setLoadErr(true); setSlideDir(0); } };
                im.src = url;
                return function () { cancelled = true; };
            }, [index, cards]);
            // 新图就绪并完成替换后，才结束滑出状态、开始滑入
            useEffect(() => { setSlideDir(0); }, [dispUrl]);

            // 键盘：ESC 关闭，←→ 切换（放大态先复位再切换）
            useEffect(() => {
                const onKey = e => {
                    if (e.key === 'Escape') onClose();
                    else if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
                        if (scale > 1) { setScale(1); setOff({ x: 0, y: 0 }); }
                        else nav(e.key === 'ArrowLeft' ? -1 : 1);
                    }
                };
                window.addEventListener('keydown', onKey);
                return () => window.removeEventListener('keydown', onKey);
            }, [scale, nav, onClose]);

            // 打开期间锁定背景滚动
            useEffect(() => {
                const prev = document.body.style.overflow;
                document.body.style.overflow = 'hidden';
                return () => { document.body.style.overflow = prev; };
            }, []);

            // 预加载相邻图片，切换不闪白（本页 Babel 会把 antd 的 Image 挂到 window.Image，
            // new Image()/new window.Image() 均会抛错，必须用 createElement('img')）
            useEffect(() => {
                [index + 1, index - 1].forEach(i => {
                    const n = cards[i];
                    if (n) { const im = document.createElement('img'); im.src = baseUrl + n.url; }
                });
            }, [index, cards]);

            // 滚轮缩放（原生监听，React 合成事件为 passive 无法 preventDefault）
            useEffect(() => { scaleRef.current = scale; }, [scale]);
            useEffect(() => {
                const el = stageRef.current;
                if (!el) return;
                const onWheel = e => {
                    e.preventDefault();
                    const ns = Math.min(5, Math.max(1, scaleRef.current * (e.deltaY < 0 ? 1.15 : 1 / 1.15)));
                    setScale(ns);
                    if (ns === 1) setOff({ x: 0, y: 0 });
                };
                el.addEventListener('wheel', onWheel, { passive: false });
                return () => el.removeEventListener('wheel', onWheel);
            }, []);

            // 拖拽：放大态平移；未放大时横向滑动切换
            const onPointerDown = e => {
                // 箭头按钮是 stage 的子元素：若此处对 stage setPointerCapture，
                // 后续 click 会被重定向到 stage（按钮收不到），反而命中 onStageClick 的
                // target===currentTarget 关闭逻辑 → 点箭头=退出预览。起点在箭头上时直接跳过
                if (e.target.closest && e.target.closest('.pv-viewer-nav')) return;
                dragRef.current = { sx: e.clientX, sy: e.clientY, ox: off.x, oy: off.y, moved: false };
                suppressClickRef.current = false;
                setDragging(true);
                if (e.currentTarget.setPointerCapture) e.currentTarget.setPointerCapture(e.pointerId);
            };
            const onPointerMove = e => {
                const d = dragRef.current;
                if (!d) return;
                if (Math.abs(e.clientX - d.sx) > 6 || Math.abs(e.clientY - d.sy) > 6) d.moved = true;
                if (scale > 1) setOff({ x: d.ox + (e.clientX - d.sx), y: d.oy + (e.clientY - d.sy) });
            };
            // 指针事件只负责放大后的平移；滑动切换统一走触摸事件（单通道，避免 iOS 指针/触摸
            // 双通道重复触发导致一次滑动连跳多张）
            const onPointerUp = e => {
                const d = dragRef.current;
                dragRef.current = null;
                setDragging(false);
                if (!d) return;
                if (d.moved) suppressClickRef.current = true;
            };
            // 双击：放大 2.5 倍 / 复位
            const onDblClick = () => {
                if (scale > 1) { setScale(1); setOff({ x: 0, y: 0 }); }
                else setScale(2.5);
            };
            // 触摸滑动切换（唯一滑动通道）：60px 阈值判定方向
            const onTouchStart = e => { touchRef.current = e.touches[0].clientX; };
            const onTouchEnd = e => {
                if (touchRef.current === null) return;
                const dx = e.changedTouches[0].clientX - touchRef.current;
                touchRef.current = null;
                if (dx < -60) nav(1);
                else if (dx > 60) nav(-1);
            };
            // 胶片条跳转：直接设置目标下标，带方向入场动画
            const jumpTo = i => {
                if (i === index || navLockRef.current) return;
                setEnterDir(i > index ? 1 : -1);
                lastNavRef.current = Date.now();
                onNav(i);
            };
            // 当前张变化时，胶片条自动滚动到可视区中央
            useEffect(() => {
                const strip = stripRef.current;
                if (!strip) return;
                const el = strip.children[index];
                if (el && el.scrollIntoView) el.scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' });
            }, [index, dispUrl]);
            // 点击遮罩空白处关闭（拖拽/滑动后的 click 不触发）
            const onStageClick = e => {
                if (e.target === e.currentTarget && !suppressClickRef.current) onClose();
            };
            if (!c) return null;
            // Portal 挂到 body：脱离页面深层 DOM 树，fixed 定位与层级在 iOS 上最稳定
            return ReactDOM.createPortal(
                <div className="pv-viewer" role="dialog" aria-modal="true">
                    <div className="pv-viewer-head">
                        <div className="pv-viewer-info">
                            <div className="pv-viewer-title">{mdStrip(c.title) || '未命名卡片'}</div>
                            <div className="pv-viewer-meta">
                                {TEMPLATE_LABEL[c.template] || c.template} · {c.width} × {c.height} · {fmtDate(c.created_at)} · {index + 1} / {total}
                            </div>
                        </div>
                        <div className="pv-viewer-tools">
                            <button className="mbtn light" title="保存图片" onClick={() => onSave(c)}><I name="DownloadOutlined" /></button>
                            <button className="mbtn light" title="分享" onClick={() => onShare(c)}><I name="ShareAltOutlined" /></button>
                            <button className="mbtn light" title="关闭 (Esc)" onClick={onClose}><I name="CloseOutlined" /></button>
                        </div>
                    </div>
                    <div ref={stageRef}
                        className={'pv-viewer-stage' + (dragging ? ' dragging' : '')}
                        onPointerDown={onPointerDown} onPointerMove={onPointerMove}
                        onPointerUp={onPointerUp} onPointerCancel={onPointerUp}
                        onTouchStart={onTouchStart} onTouchEnd={onTouchEnd}
                        onDoubleClick={onDblClick} onClick={onStageClick}>
                        {dispUrl && !loadErr && (
                            <img key={dispUrl} src={dispUrl} alt="" draggable={false}
                                className={enterDir === 1 ? 'enter-from-right' : enterDir === -1 ? 'enter-from-left' : ''}
                                style={slideDir !== 0
                                    ? { transform: 'translateX(' + (-slideDir * 12) + '%)', opacity: 0 }
                                    : { transform: 'translate(' + off.x + 'px,' + off.y + 'px) scale(' + scale + ')' }} />
                        )}
                        {!dispUrl && !loadErr && <div className="pv-viewer-loading"><Spin size="large" /></div>}
                        {loadErr && <div className="pv-viewer-fallback">图片加载失败，请稍后重试</div>}
                        <button className="pv-viewer-nav prev" disabled={index === 0} onClick={() => nav(-1)} aria-label="上一张"><I name="LeftOutlined" /></button>
                        <button className="pv-viewer-nav next" disabled={index === total - 1} onClick={() => nav(1)} aria-label="下一张"><I name="RightOutlined" /></button>
                    </div>
                    <div className="pv-strip" ref={stripRef}>
                        {cards.map((cc, i) => (
                            <button key={cc.id} className={'pv-strip-item' + (i === index ? ' cur' : '')}
                                title={mdStrip(cc.title) || ''} onClick={() => jumpTo(i)}>
                                <img src={baseUrl + cc.url} alt="" loading="lazy" draggable={false} />
                            </button>
                        ))}
                    </div>
                    <div className="pv-viewer-hint">{touch ? '左右滑动切换 · 双击缩放' : '滚轮缩放 · 双击放大 · ← → 切换 · Esc 关闭'}</div>
                </div>,
                document.body
            );
        }

        // ==================== 卡片历史（Masonry 瀑布流 + 沉浸式预览） ====================
        function CardsTab({ isDark }) {
            const [cards, setCards] = useState([]);
            const [loading, setLoading] = useState(true);
            const [shareCard, setShareCard] = useState(null);
            const [viewIdx, setViewIdx] = useState(-1); // 预览器当前下标，-1 = 关闭
            const [typeFilter, setTypeFilter] = useState(''); // 类型筛选（template key），'' = 全部
            const [monthFilter, setMonthFilter] = useState(''); // 月份筛选（YYYY.MM），'' = 全部
            const wrapRef = useRef(null);
            const [colCount, setColCount] = useState(2);
            const load = useCallback(() => {
                setLoading(true);
                api('/api/private/cards').then(d => {
                    if (ok(d)) setCards(d.data || []);
                    setLoading(false);
                }).catch(() => setLoading(false));
            }, []);
            useEffect(() => { if (isDark !== undefined) load(); }, [load]);

            // 列数随容器宽度自适应（ResizeObserver：窗口/侧栏变化即时重排）
            useEffect(() => {
                const el = wrapRef.current;
                if (!el) return;
                const calc = () => {
                    const w = el.clientWidth;
                    setColCount(w >= 1500 ? 4 : w >= 1000 ? 3 : 2);
                };
                calc();
                const ro = new ResizeObserver(calc);
                ro.observe(el);
                return () => ro.disconnect();
            }, []);

            const saveCard = async (c) => {
                try {
                    const r = await fetch(baseUrl + c.url, { credentials: 'include' });
                    const blob = await r.blob();
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = 'note-card-' + stamp(c.created_at) + '.png';
                    a.click();
                    setTimeout(() => URL.revokeObjectURL(a.href), 3000);
                    message.success('已开始下载');
                } catch (e) { message.error('保存失败'); }
            };
            const copyCard = async (c) => {
                try {
                    const r = await fetch(baseUrl + c.url, { credentials: 'include' });
                    const blob = await r.blob();
                    if (navigator.clipboard && window.ClipboardItem) {
                        await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
                        message.success('图片已复制');
                    } else {
                        message.info('当前浏览器不支持复制图片，请保存图片');
                    }
                } catch (e) {
                    message.info('当前浏览器不支持复制图片，请保存图片');
                }
            };
            const deleteCard = (c) => {
                Modal.confirm({
                    title: '删除这张卡片？',
                    content: '相关分享链接会立即失效，且无法恢复。',
                    okText: '删除', okType: 'danger', cancelText: '取消',
                    onOk: async () => {
                        const d = await api('/api/private/cards/' + c.id, { method: 'DELETE' });
                        if (ok(d)) { message.success('卡片已删除'); setViewIdx(-1); load(); }
                        else message.error('删除失败');
                    }
                });
            };
            // 每张卡片的“更多”下拉：复制/删除等低频操作收纳于此
            const cardMenu = c => ({
                items: [
                    { key: 'save', label: '保存图片', icon: <I name="DownloadOutlined" /> },
                    { key: 'copy', label: '复制图片', icon: <I name="CopyOutlined" /> },
                    { key: 'share', label: '分享', icon: <I name="ShareAltOutlined" /> },
                    { type: 'divider' },
                    { key: 'delete', label: '删除', icon: <I name="DeleteOutlined" />, danger: true }
                ],
                onClick: ({ key }) => {
                    if (key === 'save') saveCard(c);
                    if (key === 'copy') copyCard(c);
                    if (key === 'share') setShareCard(c);
                    if (key === 'delete') deleteCard(c);
                }
            });

            // 类型筛选：按现有数据聚合类型
            const typeList = useMemo(() => {
                const seen = [];
                cards.forEach(c => { if (!seen.includes(c.template)) seen.push(c.template); });
                return seen;
            }, [cards]);
            // 月份筛选：按生成月聚合（cards 本身按时间倒序，月份天然新→旧）
            const monthList = useMemo(() => {
                const seen = [];
                cards.forEach(c => {
                    const d = new Date(c.created_at);
                    if (isNaN(d.getTime())) return;
                    const key = d.getFullYear() + '.' + pad(d.getMonth() + 1);
                    if (!seen.includes(key)) seen.push(key);
                });
                return seen;
            }, [cards]);
            // 筛选失效自愈：数据刷新后若所选类型/月份已不存在，自动回到"全部"
            useEffect(() => { if (typeFilter && !typeList.includes(typeFilter)) setTypeFilter(''); }, [typeFilter, typeList]);
            useEffect(() => { if (monthFilter && !monthList.includes(monthFilter)) setMonthFilter(''); }, [monthFilter, monthList]);
            // shown 为筛选后列表（瀑布流/下标映射/预览均基于它）
            const shown = useMemo(() => cards.filter(c => {
                if (typeFilter && c.template !== typeFilter) return false;
                if (monthFilter) {
                    const d = new Date(c.created_at);
                    const key = isNaN(d.getTime()) ? '' : d.getFullYear() + '.' + pad(d.getMonth() + 1);
                    if (key !== monthFilter) return false;
                }
                return true;
            }), [cards, typeFilter, monthFilter]);

            // Masonry 分列：按 width/height 比例做最短列堆叠（比例数据自带，无需等图片加载）
            const cols = useMemo(() => {
                const arr = Array.from({ length: colCount }, () => []);
                const h = Array(colCount).fill(0);
                const INFO_H = 58, GAP = 18; // 信息区高度估算 + 纵向间距
                shown.forEach(c => {
                    let i = 0;
                    for (let k = 1; k < colCount; k++) if (h[k] < h[i]) i = k;
                    const ratio = (c.width && c.height) ? c.height / c.width : 4 / 3;
                    arr[i].push(c);
                    h[i] += ratio * 100 + INFO_H + GAP;
                });
                return arr;
            }, [shown, colCount]);
            // id → 全局下标映射（预览器按全局顺序前后切换）
            const indexMap = useMemo(() => new Map(shown.map((c, i) => [c.id, i])), [shown]);

            return (
                <div ref={wrapRef}>
                    <div className="pv-cards-head">
                        <h3>我的卡片</h3>
                        <span className="pv-cards-sub">最近生成 · 共 {cards.length} 张</span>
                    </div>
                    {(typeList.length > 1 || monthList.length > 1) && (
                        <div className="card-chips-wrap">
                            {typeList.length > 1 && (
                                <div className="card-type-chips">
                                    <button className={'chip' + (typeFilter === '' ? ' active' : '')} onClick={() => setTypeFilter('')}>全部类型</button>
                                    {typeList.map(t => (
                                        <button key={t} className={'chip' + (typeFilter === t ? ' active' : '')} onClick={() => setTypeFilter(t)}>
                                            {TEMPLATE_LABEL[t] || t}
                                        </button>
                                    ))}
                                </div>
                            )}
                            {monthList.length > 1 && (
                                <div className="card-type-chips">
                                    <button className={'chip' + (monthFilter === '' ? ' active' : '')} onClick={() => setMonthFilter('')}>全部月份</button>
                                    {monthList.map(m => (
                                        <button key={m} className={'chip' + (monthFilter === m ? ' active' : '')} onClick={() => setMonthFilter(m)}>
                                            {m}
                                        </button>
                                    ))}
                                </div>
                            )}
                        </div>
                    )}
                    {loading && cards.length === 0 && (
                        <div className="masonry-skel">{Array.from({ length: 8 }, (_, i) => <div className="sk" key={i} />)}</div>
                    )}
                    {!loading && cards.length === 0 && (
                        <Empty description="还没有生成过卡片，在手记上点击「生成卡片」试试" style={{ marginTop: 60 }} />
                    )}
                    {!loading && cards.length > 0 && shown.length === 0 && (
                        <Empty description="当前筛选条件下暂无卡片" style={{ marginTop: 60 }} />
                    )}
                    {shown.length > 0 && (
                        <div className="masonry">
                            {cols.map((col, ci) => (
                                <div className="masonry-col" key={ci}>
                                    {col.map(c => {
                                        const idx = indexMap.get(c.id);
                                        const ar = (c.width && c.height) ? c.width + ' / ' + c.height : '4 / 3';
                                        // 整卡可点进入沉浸式预览；操作按钮区 stopPropagation 不触发查看
                                        return (
                                            <figure className="mcard" key={c.id} onClick={() => setViewIdx(idx)}>
                                                <div className="mcard-media" style={{ aspectRatio: ar }}>
                                                    <CardImg c={c} />
                                                    <div className="mcard-actions" onClick={e => e.stopPropagation()}>
                                                        <button className="mbtn opt" title="预览" onClick={() => setViewIdx(idx)}><I name="ZoomInOutlined" /></button>
                                                        <button className="mbtn opt" title="保存图片" onClick={() => saveCard(c)}><I name="DownloadOutlined" /></button>
                                                        <button className="mbtn opt" title="分享" onClick={() => setShareCard(c)}><I name="ShareAltOutlined" /></button>
                                                        <Dropdown trigger={['click']} menu={cardMenu(c)}>
                                                            <button className="mbtn" title="更多"><I name="MoreOutlined" /></button>
                                                        </Dropdown>
                                                    </div>
                                                </div>
                                                <figcaption className="mcard-info">
                                                    <div className="mcard-title">{mdStrip(c.title) || '未命名卡片'}</div>
                                                    <div className="mcard-meta">
                                                        <I name="PictureOutlined" />
                                                        <span>{TEMPLATE_LABEL[c.template] || c.template} · {c.width} × {c.height} · {fmtDate(c.created_at)}</span>
                                                    </div>
                                                </figcaption>
                                            </figure>
                                        );
                                    })}
                                </div>
                            ))}
                        </div>
                    )
                    }
                    {
                        viewIdx >= 0 && (
                            <CardViewer cards={shown} index={viewIdx} onNav={setViewIdx}
                                onClose={() => setViewIdx(-1)} onSave={saveCard} onShare={setShareCard} />
                        )
                    }
                    {shareCard && <ShareModal open={!!shareCard} card={shareCard} onClose={() => setShareCard(null)} />}
                </div >
            );
        }

        // ==================== 错误边界：捕获子组件渲染崩溃，避免整页白屏，直接显示错误便于定位 ====================
        class ErrorBoundary extends React.Component {
            constructor(props) { super(props); this.state = { err: null }; }
            static getDerivedStateFromError(err) { return { err }; }
            render() {
                if (this.state.err) {
                    const e = this.state.err;
                    const msg = (e && (e.stack || e.message)) || String(e);
                    return (
                        <div style={{ padding: 32, color: '#ff4d4f', fontSize: 13, whiteSpace: 'pre-wrap', wordBreak: 'break-all' }}>
                            <div style={{ fontWeight: 600, marginBottom: 8 }}>页面渲染出错，请把以下内容反馈给开发者：</div>
                            {msg}
                            <div style={{ marginTop: 16 }}><Button onClick={() => this.setState({ err: null })}>重试</Button></div>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        // ==================== 密码验证 ====================
        function PasswordGate({ onUnlocked, isDark }) {
            const [pw, setPw] = useState('');
            const [loading, setLoading] = useState(false);
            const [err, setErr] = useState('');
            const submit = async () => {
                if (!pw) { setErr('请输入访问密码'); return; }
                setLoading(true); setErr('');
                try {
                    const d = await api('/api/private/unlock', { method: 'POST', body: JSON.stringify({ password: pw }) });
                    if (ok(d)) { setPw(''); onUnlocked(); }
                    else if (d.code === 429) setErr('尝试次数过多，请稍后再试。');
                    else setErr('密码错误');
                } catch (e) { setErr('网络错误，请重试'); }
                finally { setLoading(false); }
            };
            return (
                <div className="pv-gate">
                    <div className="pv-gate-card">
                        <div className="pv-gate-icon"><I name="LockOutlined" /></div>
                        <div className="pv-gate-title">私人空间</div>
                        <div className="pv-gate-sub">请输入访问密码继续</div>
                        <Input.Password
                            size="large"
                            placeholder="访问密码"
                            value={pw}
                            onChange={e => setPw(e.target.value)}
                            onPressEnter={submit}
                            autoFocus
                        />
                        {err && <Alert type="error" message={err} showIcon style={{ marginTop: 10 }} />}
                        <Button type="primary" size="large" block loading={loading} onClick={submit} style={{ marginTop: 14 }}>进入</Button>
                        <div className="pv-gate-back">
                            <Button type="text" size="small" onClick={() => window.location.href = 'index.html'}>返回 Server Status</Button>
                        </div>
                    </div>
                </div>
            );
        }

        // ReauthModal 会话过期重新验证浮层：
        // 私人空间自动锁定后不离开当前界面，就地输入密码解锁；
        // 解锁成功后自动执行 window.__pvPendingRetry（由触发锁定的操作注册，如继续生成卡片）
        function ReauthModal({ onClose, onUnlocked }) {
            const [pw, setPw] = useState('');
            const [loading, setLoading] = useState(false);
            const [err, setErr] = useState('');
            const submit = async () => {
                if (!pw) { setErr('请输入访问密码'); return; }
                setLoading(true); setErr('');
                try {
                    const d = await api('/api/private/unlock', { method: 'POST', body: JSON.stringify({ password: pw }) });
                    if (ok(d)) { setPw(''); onUnlocked(); }
                    else if (d.code === 429) setErr('尝试次数过多，请稍后再试。');
                    else setErr('密码错误');
                } catch (e) { setErr('网络错误，请重试'); }
                finally { setLoading(false); }

            return (
                <Modal

                        <Typography.Text type="secondary" style={{ fontSize: 13 }}>

                        </Typography.Text>
                        <Input.Password
                            size="large"
                            placeholder="访问密码"

                            onChange={e => setPw(e.target.value)}

                            style={{ marginTop: 12 }}
                        />
                        {err && <Alert type="error" message={err} showIcon style={{ marginTop: 10 }} />}

                    </div>
