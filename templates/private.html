                // 卡片图片 = 用户点选的子集（顺序即点选顺序），而非手记全量图片
                images: selImgs.map(u => u),
                brand: show.brand ? brandText : false,
                server,
                show,
                locationMode,
                background,
                autoLayout,
                fold: foldLong,
                foldLines: foldLineN
            });

            // 生成期间隐藏页面 AI 浮球等悬浮元素（Card Renderer 本身不依赖 DOM）
            useEffect(() => {
                if (open) document.body.classList.add('pv-card-gen');
                else document.body.classList.remove('pv-card-gen');
                return () => document.body.classList.remove('pv-card-gen');
            }, [open]);

            useEffect(() => {
                if (!open) return;
                setTemplate(note && note.images && note.images.length ? 'image' : 'simple');
                setSize(0);
                setBackground('white');
                setShow({ title: true, content: true, time: true, location: true, tags: true, images: true, brand: false });
                setLocationMode('name');
                setAutoLayout(true);
                setZoom(1);
                setGenState('idle');
                setSavedCard(null);
                setFullCanvas(null);
                setServer(null);
                setFitHint(false);
                setRenderErr(false);
                setRetryTick(0);
                setSelImgs(note && note.images ? note.images.slice(0, 9).map(i => i.url) : []);
            }, [open, note && note.id]);

            useEffect(() => {
                if (!open) return;
                if (template === 'server' && !server) {
                    api('/api/private/server-status').then(d => { if (ok(d) && d.data) setServer(d.data); });
                }
                clearTimeout(timer.current);
                timer.current = setTimeout(async () => {
                    try {
                        const c = await renderCard(opts());
                        setPreview(c);
                        setRenderErr(false);
                        setFitHint(!!c.fitHint);
                        if (previewRef.current) {
                            previewRef.current.width = c.width;
                            previewRef.current.height = c.height;
                            const ctx = previewRef.current.getContext('2d');
                            ctx.clearRect(0, 0, c.width, c.height);
                            ctx.drawImage(c, 0, 0);
                        }
                    } catch (e) { console.error('卡片预览渲染失败:', e); setRenderErr(true); }
                }, 200);
                // eslint-disable-next-line react-hooks/exhaustive-deps
            }, [open, template, size, background, locationMode, autoLayout, show, brandText, server, note && note.id, retryTick, selImgs]);

            // 预览缩放：只改变显示尺寸，内部保持真实分辨率
            useEffect(() => {
                const apply = () => {
                    const stage = stageRef.current;
                    const cv = previewRef.current;
                    if (!stage || !cv || !cv.width) return;
                    const sw = stage.clientWidth - 40;
                    const sh = stage.clientHeight - 40;
                    if (sw <= 0 || sh <= 0) return;
                    const fit = Math.min(sw / cv.width, sh / cv.height) * zoom;
                    cv.style.width = Math.round(cv.width * fit) + 'px';
                    cv.style.height = Math.round(cv.height * fit) + 'px';
                };
                apply();
                window.addEventListener('resize', apply);
                return () => window.removeEventListener('resize', apply);
            }, [preview, zoom, open]);

            const toBlob = c => new Promise(res => c.toBlob(res, 'image/png'));
            const generate = async () => {
                if (generatingRef.current) return;
                generatingRef.current = true;
                setGenState('generating');
                try {
                    const c = await renderCard(opts());
                    setFullCanvas(c);
                    const blob = await toBlob(c);
                    const b64 = await new Promise(res => {
                        const fr = new FileReader();
                        fr.onload = () => res(fr.result);
                        fr.readAsDataURL(blob);
                    });
                    const d = await api('/api/private/cards', {
                        method: 'POST',
                        body: JSON.stringify({
                            note_id: note ? note.id : '',
                            template, width: CARD_SIZES[size].w, height: CARD_SIZES[size].h,
                            title: mdStrip(note ? (note.title || note.content || '') : 'Server Status').slice(0, 80) || '未命名卡片',
                            image: b64
                        })
                    });
                    if (ok(d) && d.data) {
                        setSavedCard(d.data);
                        setGenState('done');
                        message.success('卡片已生成');
                    } else if (d.code === 403 && d.message === '未解锁') {
                        // 私人空间被自动锁定：api() 已触发重新验证浮层，
                        // 注册解锁成功后的自动重试，用户输完密码即可继续生成
                        window.__pvPendingRetry = () => generate();
                        setGenState('idle');
                    } else {
                        setGenState('error');
                        message.error(d.message || '卡片生成失败，请重试');
                    }
                } catch (e) {
                    console.error('卡片生成失败:', e);
                    setGenState('error');
                    message.error('卡片生成失败，请重试');
                } finally {
                    generatingRef.current = false;
                }
            };
            const savePng = async () => {
                const c = fullCanvas || preview;
                if (!c) return;
                const blob = await toBlob(c);
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = 'note-card-' + stamp(note ? note.created_at : null) + '.png';
                a.click();
                setTimeout(() => URL.revokeObjectURL(a.href), 3000);
            };
            const copyPng = async () => {
                const c = fullCanvas || preview;
                if (!c) return;
                const blob = await toBlob(c);
                try {
                    if (navigator.clipboard && window.ClipboardItem) {
                        await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
                        message.success('图片已复制');
                    } else {
                        message.info('当前浏览器不支持复制图片，请保存图片');
                    }
                } catch (e) {
                    message.info('当前浏览器不支持复制图片，请保存图片');
                }
            };

            const infoItems = [
                { key: 'title', label: '标题' }, { key: 'content', label: '正文' }, { key: 'time', label: '时间' },
                { key: 'location', label: '地点' }, { key: 'tags', label: '标签' }, { key: 'images', label: '图片' }, { key: 'brand', label: '品牌' }
            ];
            const isTextTpl = template === 'simple' || template === 'travel';

            return (
                <>
                    <Modal
                        className="cg-modal"
                        open={open}
                        onCancel={onClose}
                        width={1080}
                        style={{ maxWidth: '96vw', top: 20 }}
                        title="生成卡片"
                        destroyOnClose
                        footer={
                            <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8, justifyContent: 'flex-end', alignItems: 'center', width: '100%' }}>
                                {genState === 'done' && <span className="cg-success"><I name="CheckCircleOutlined" /> 已生成</span>}
                                {genState === 'done' && <Button icon={<I name="DownloadOutlined" />} onClick={savePng}>保存图片</Button>}
                                {genState === 'done' && <Button icon={<I name="CopyOutlined" />} onClick={copyPng}>复制图片</Button>}
                                {genState === 'done' && <Button type="primary" ghost icon={<I name="ShareAltOutlined" />} onClick={() => setShareOpen(true)}>分享</Button>}
                                {genState === 'error' && <Button onClick={generate}>重试</Button>}
                                {genState !== 'done' && <Button onClick={onClose}>取消</Button>}
                                {genState !== 'done' && (
                                    <Button type="primary" loading={genState === 'generating'} icon={genState !== 'generating' ? <I name="ThunderboltOutlined" /> : null} onClick={generate}>
                                        {genState === 'generating' ? '生成中...' : '生成卡片'}
                                    </Button>
                                )}
                            </div>
                        }
                    >
                        <div className="cg-layout">
                            {/* 左侧：设置 */}
                            <div className="cg-left">
                                <div className="cg-section">
                                    <div className="cg-label">模板</div>
                                    <div className="cg-tpl-row">
                                        {CARD_TEMPLATES.map(t => (
                                            <Button key={t.key} className="cg-tpl-btn" type={template === t.key ? 'primary' : 'default'} onClick={() => setTemplate(t.key)}>
                                                {t.label}
                                            </Button>
                                        ))}
                                    </div>
                                </div>
                                <div className="cg-section">
                                    <div className="cg-label">尺寸</div>
                                    <div className="cg-tpl-row">
                                        {CARD_SIZES.map((s, i) => (
                                            <Button key={i} className="cg-tpl-btn" type={size === i ? 'primary' : 'default'} onClick={() => setSize(i)}>
                                                <span>{s.label}</span>
                                                <span className="cg-tpl-ratio">{s.ratio}</span>
                                            </Button>
                                        ))}
                                    </div>
                                </div>
                                {isTextTpl && (
                                    <div className="cg-section">
                                        <div className="cg-label">背景</div>
                                        <Segmented size="small" block value={background} onChange={setBackground} options={[
                                            { value: 'white', label: '白色' },
                                            { value: 'gray', label: '浅灰' },
                                            { value: 'dark', label: '深色' },
                                            { value: 'image', label: '图片' }
                                        ]} />
                                    </div>
                                )}
                                <div className="cg-section">
                                    <div className="cg-label"><span className="cg-label-t">信息显示</span> <span className="cg-sub">控制进入卡片的内容</span></div>
                                    <div className="cg-info-row">
                                        {infoItems.map(it => (
                                            <Checkbox key={it.key} checked={show[it.key]} onChange={e => setShow({ ...show, [it.key]: e.target.checked })}>{it.label}</Checkbox>
                                        ))}
                                    </div>
                                    {show.brand && (
                                        <div style={{ marginTop: 8 }}>
                                            <Input size="small" value={brandText} onChange={e => setBrandText(e.target.value)} placeholder="品牌文字" style={{ width: 200 }} />
                                        </div>
                                    )}
                                    {show.location && template !== 'server' && (
                                        <div style={{ marginTop: 8 }}>
                                            <Segmented size="small" value={locationMode} onChange={setLocationMode} options={[
                                                { value: 'name', label: '地点名称' },
                                                { value: 'coords', label: '坐标' },
                                                { value: 'hidden', label: '隐藏' }
                                            ]} />
                                        </div>
                                    )}
                                </div>
                                <div className="cg-section">
                                    <div className="cg-label">
                                        <span className="cg-label-t">自动排版</span>
                                        <Tooltip title="自动调整字体与行距，防止文字溢出或被裁剪">
                                            <I name="QuestionCircleOutlined" style={{ color: 'rgba(0,0,0,.35)' }} />
                                        </Tooltip>
                                    </div>
                                    <Switch checked={autoLayout} onChange={setAutoLayout} checkedChildren="开" unCheckedChildren="关" />
                                </div>
                                <div className="cg-section">
                                    <div className="cg-label"><span className="cg-label-t">长文折叠</span> <span className="cg-sub">文字过长时保留前几行并以 … 结尾，字号保持可读</span></div>
                                    <Space size={12}>
                                        <Switch checked={foldLong} onChange={setFoldLong} checkedChildren="开" unCheckedChildren="关" />
                                        {foldLong && (
                                            <Segmented size="small" value={foldLineN} onChange={setFoldLineN} options={[
                                                { value: 6, label: '6 行' },
                                                { value: 8, label: '8 行' },
                                                { value: 12, label: '12 行' }
                                            ]} />
                                        )}
                                    </Space>
                                </div>
                                {note && note.images && note.images.length > 0 && show.images && (
                                    <div className="cg-section">
                                        <div className="cg-label">
                                            <span className="cg-label-t">选择图片</span>
                                            <span className="cg-sub">已选 {selImgs.length} / {note.images.length} 张（最多 9 张），点击缩略图选取，角标即卡片排列顺序</span>
                                        </div>
                                        <div className="cg-img-pick">
                                            {note.images.map(img => {
                                                const idx = selImgs.indexOf(img.url);
                                                const dis = idx < 0 && selImgs.length >= 9;
                                                return (
                                                    <div key={img.id || img.url}
                                                        className={'cg-ip' + (idx >= 0 ? ' on' : '') + (dis ? ' dis' : '')}
                                                        onClick={() => {
                                                            if (dis) return;
                                                            setSelImgs(idx >= 0 ? selImgs.filter(u => u !== img.url) : [...selImgs, img.url]);
                                                        }}>
                                                        <img src={img.url} alt="" loading="lazy" />
                                                        {idx >= 0 && <span className="cg-ip-n">{idx + 1}</span>}
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                )}
                                {template === 'server' && !server && <div style={{ marginTop: 10 }}><Spin size="small" /> 正在获取服务器状态…</div>}
                            </div>
                            {/* 右侧：实时预览（与最终 PNG 同一 Renderer） */}
                            <div className="cg-right">
                                <div className="cg-stage" ref={stageRef}>
                                    {renderErr ? (
                                        <div style={{ textAlign: 'center' }}>
                                            <Alert type="warning" showIcon message="卡片渲染失败，请重试" style={{ marginBottom: 10 }} />
                                            <Button type="primary" icon={<I name="ReloadOutlined" />} onClick={() => setRetryTick(t => t + 1)}>重试</Button>
                                        </div>
                                    ) : (
                                        <>
                                            <canvas ref={previewRef} />
                                            {fitHint && <div className="cg-fit-hint">内容较长，已自动缩小字体</div>}
                                            {!preview && <Spin />}
                                        </>
                                    )}
                                </div>
                                <div className="cg-zoom">
                                    <Button size="small" icon={<I name="MinusOutlined" />} onClick={() => setZoom(Math.max(0.5, +(zoom - 0.25).toFixed(2)))} />
                                    <Typography.Text style={{ width: 46, textAlign: 'center', fontVariantNumeric: 'tabular-nums' }}>{Math.round(zoom * 100)}%</Typography.Text>
                                    <Button size="small" icon={<I name="PlusOutlined" />} onClick={() => setZoom(Math.min(1.5, +(zoom + 0.25).toFixed(2)))} />
                                </div>
                                <div className="cg-ratio">实际输出 {CARD_SIZES[size].w} × {CARD_SIZES[size].h}px · {CARD_SIZES[size].ratio}</div>
                            </div>
                        </div>
                    </Modal>
                    {savedCard && <ShareModal open={shareOpen} card={savedCard} onClose={() => setShareOpen(false)} />}
                </>
            );
        }

        // ==================== 分享 ====================
        function ShareModal({ open, card, onClose }) {
            const [expiry, setExpiry] = useState('24h');
            const [password, setPassword] = useState('');
            const [allowDownload, setAllowDownload] = useState(true);
            const [creating, setCreating] = useState(false);
            const creatingRef = useRef(false);
            const [share, setShare] = useState(null);
            const create = async () => {
                if (creatingRef.current) return;
                creatingRef.current = true;
                setCreating(true);
                try {
                    const d = await api('/api/private/cards/' + card.id + '/share', {
                        method: 'POST',
                        body: JSON.stringify({ expires_in: expiry, password, allow_download: allowDownload })
                    });
                    if (ok(d) && d.data) setShare(d.data);
                    else message.error(d.message || '分享失败，请重试');
                } catch (e) { message.error('分享失败，请重试'); }
                finally { creatingRef.current = false; setCreating(false); }
            };
            const copyText = async (t) => {
                // 优先 Clipboard API（HTTPS + 用户手势场景）；
                // iOS Safari / 微信内置浏览器常拒绝或不支持，降级 execCommand + 隐藏 textarea
                try {
                    if (navigator.clipboard && navigator.clipboard.writeText) {
                        await navigator.clipboard.writeText(t);
                        message.success('已复制');
                        return;
                    }
                } catch (e) { /* 降级到 execCommand */ }
                try {
                    const ta = document.createElement('textarea');
                    ta.value = t;
                    ta.setAttribute('readonly', '');
                    ta.style.position = 'fixed';
                    ta.style.top = '-9999px';
                    ta.style.opacity = '0';
                    document.body.appendChild(ta);
                    // iOS 需先 focus 再 select/setSelectionRange 才能选中
                    ta.focus();
                    ta.select();
                    ta.setSelectionRange(0, t.length);
                    const done = document.execCommand('copy');
                    document.body.removeChild(ta);
                    if (done) message.success('已复制');
                    else message.info('复制失败，请长按链接手动复制');
                } catch (e) {
                    message.info('复制失败，请长按链接手动复制');
                }
            };
            const saveQr = async () => {
                try {
                    const r = await fetch(baseUrl + share.qr_url, { credentials: 'include' });
                    const blob = await r.blob();
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = 'share-qr.png';
                    a.click();
                    setTimeout(() => URL.revokeObjectURL(a.href), 3000);
                } catch (e) { message.error('二维码下载失败'); }
            };
            return (
                <Modal open={open} onCancel={onClose} width={480} footer={null} title="生成分享链接" destroyOnClose>
                    {!share ? (
                        <Space direction="vertical" style={{ width: '100%' }} size={12}>
                            <div>
                                <div style={{ marginBottom: 6, fontWeight: 500 }}>有效期</div>
                                <Segmented block value={expiry} onChange={setExpiry} options={[
                                    { value: '10m', label: '10 分钟' },
                                    { value: '1h', label: '1 小时' },
                                    { value: '24h', label: '24 小时' },
                                    { value: '7d', label: '7 天' },
                                    { value: 'permanent', label: '永久' }
                                ]} />
                            </div>
                            <div>
                                <div style={{ marginBottom: 6, fontWeight: 500 }}>访问密码（可选）</div>
                                <Input.Password placeholder="不填则无需密码" value={password} onChange={e => setPassword(e.target.value)} />
                            </div>
                            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                                <span>允许下载图片</span>
                                <Switch checked={allowDownload} onChange={setAllowDownload} />
                            </div>
                            <Button type="primary" block loading={creating} onClick={create}>生成分享链接</Button>
                        </Space>
                    ) : (
                        <div style={{ textAlign: 'center' }}>
                            <img src={baseUrl + share.qr_url} alt="二维码" style={{ width: 220, height: 220, borderRadius: 8 }} />
                            <div className="share-line">
                                <Input readOnly value={share.url} />
                                <Button onClick={() => copyText(share.url)}>复制链接</Button>
                            </div>
                            <div className="share-line" style={{ justifyContent: 'center' }}>
                                <Button icon={<I name="QrcodeOutlined" />} onClick={saveQr}>保存二维码</Button>
                                <Button icon={<I name="CopyOutlined" />} onClick={() => {
                                    fetch(baseUrl + share.qr_url, { credentials: 'include' })
                                        .then(r => r.blob())
                                        .then(async blob => {
                                            try {
                                                if (navigator.clipboard && window.ClipboardItem) {
                                                    await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
                                                    message.success('二维码已复制');
                                                } else message.info('浏览器不支持复制图片，请保存二维码');
                                            } catch (e) { message.info('浏览器不支持复制图片，请保存二维码'); }
                                        });
                                }}>复制二维码</Button>
                            </div>
                            {share.expires_at && <Typography.Text type="secondary" style={{ display: 'block', marginTop: 8, fontSize: 12 }}>有效期至 {fmtFull(share.expires_at)}</Typography.Text>}
                        </div>
                    )}
                </Modal>
            );
        }

        // ==================== 日历视图：GitHub 风格热力图 + 按日浏览 ====================
        // 纯前端组件：手记全量在客户端（allNotes），按本地日期聚合出每日篇数渲染热力图，
        // 点击有记录的日期在下方复用 NoteCard 列表查看当天全部手记。
        function CalendarTab({ notes, isDark, onEdit, onDelete, onCard, highlight }) {
            const [selected, setSelected] = useState(null);

            // 按本地日期统计手记数：key = yyyy-mm-dd
            const counts = useMemo(() => {
                const m = {};
                (notes || []).forEach(n => {
                    const k = dayKey(n.created_at);
                    if (k) m[k] = (m[k] || 0) + 1;
                });
                return m;
            }, [notes]);

            // 生成最近一年（53 周）的周列网格：周一为第一行，未来日期留空
            const weeks = useMemo(() => {
                const today = new Date();
                const dow = (today.getDay() + 6) % 7; // 周一=0 ... 周日=6
                const end = new Date(today);
                end.setDate(today.getDate() + (6 - dow)); // 本周日（网格最后一天）
                const start = new Date(end);
                start.setDate(end.getDate() - 53 * 7 + 1); // 往前推满 53 周
                const cols = [];
                const cur = new Date(start);
                const todayMid = new Date(today.getFullYear(), today.getMonth(), today.getDate(), 23, 59, 59);
                while (cur <= end) {
                    const col = [];
                    for (let d = 0; d < 7; d++) {
                        col.push(new Date(cur));
                        cur.setDate(cur.getDate() + 1);
                    }
                    cols.push(col);
                }
                return { cols, todayMid };
            }, []);

            // 月份标签：某列首格所在月份与前列不同 → 在该列顶部标注月份
            const monthLabels = useMemo(() => {
                const labels = [];
                let lastMonth = -1;
                weeks.cols.forEach((col, w) => {
                    const m = col[0].getMonth();
                    if (m !== lastMonth) {
                        labels.push({ col: w, label: (m + 1) + '月' });
                        lastMonth = m;
                    }
                });
                return labels;
            }, [weeks]);

            // 篇数 → 色阶 0-4（0 篇/1 篇/2 篇/3-4 篇/5+ 篇）
            const level = c => (c === 0 ? 0 : c === 1 ? 1 : c === 2 ? 2 : c <= 4 ? 3 : 4);

            // 选中日期的当天手记
            const dayNotes = selected ? (notes || []).filter(n => dayKey(n.created_at) === selected) : [];
            const activeDays = Object.keys(counts).length;

            return (
                <div>
                    <div className="cal-card">
                        <div className="cal-head">
                            <span className="cal-title">记录日历</span>
                            <span className="cal-stat">近一年共 {notes ? notes.length : 0} 篇 · {activeDays} 天有记录，点击日期查看当天手记</span>
                        </div>
                        <div className="cal-scroll">
                            <div className="cal-inner">
                                <div className="cal-months">
                                    {weeks.cols.map((_, w) => {
                                        const hit = monthLabels.find(x => x.col === w);
                                        return <span key={w}>{hit ? hit.label : ''}</span>;
                                    })}
                                </div>
                                <div className="cal-body">
                                    <div className="cal-weekdays">
                                        <span>一</span><span></span><span>三</span><span></span><span>五</span><span></span><span>日</span>
                                    </div>
                                    <div className="cal-grid">
                                        {weeks.cols.map((col, w) => col.map((dt, d) => {
                                            const key = dt.getFullYear() + '-' + pad(dt.getMonth() + 1) + '-' + pad(dt.getDate());
                                            const future = dt > weeks.todayMid;
                                            const c = counts[key] || 0;
                                            const cls = 'cal-cell' + (future ? ' future' : ' cal-l' + level(c)) + (selected === key ? ' sel' : '');
                                            return <div key={w + '-' + d} className={cls}
                                                title={future ? '' : key + (c ? ' · ' + c + ' 篇' : ' · 无记录')}
                                                onClick={() => { if (!future && c) setSelected(selected === key ? null : key); }} />;
                                        }))}
                                    </div>
                                </div>
                                <div className="cal-legend" style={{ marginLeft: 24 }}>
                                    少 <i className="cal-l0" style={{ background: 'var(--cal-0)' }} /><i className="cal-l1" style={{ background: 'var(--cal-1)' }} /><i className="cal-l2" style={{ background: 'var(--cal-2)' }} /><i className="cal-l3" style={{ background: 'var(--cal-3)' }} /><i className="cal-l4" style={{ background: 'var(--cal-4)' }} /> 多
                                </div>
                            </div>
                        </div>
                    </div>
                    {selected && (
                        <div className="tl-day">
                            <div className="tl-day-title">
                                {dayLabel(selected)}
                                <span className="tl-date">{selected.replace(/-/g, '.')}</span>
                                <span className="tl-count">{dayNotes.length} 条</span>
                                <Button size="small" type="link" onClick={() => setSelected(null)}>收起</Button>
                            </div>
                            {dayNotes.length === 0
                                ? <Empty image={Empty.PRESENTED_IMAGE_SIMPLE} description="该日期没有手记" style={{ padding: 24 }} />
                                : dayNotes.map(n => (
                                    <NoteCard key={n.id} note={n} isDark={isDark} onEdit={onEdit} onDelete={onDelete} onCard={onCard} highlight={highlight} />
                                ))}
                        </div>
                    )}
                </div>
            );
        }

        // ==================== 标签 ====================
        function TagsTab({ notes, onViewNote, onCard }) {
            const [tag, setTag] = useState(null);
            const counts = useMemo(() => {
                const m = {};
                const last = {};
                (notes || []).forEach(n => {
                    (n.tags || []).forEach(t => {
                        m[t] = (m[t] || 0) + 1;
                        const d = new Date(n.created_at).getTime();
                        if (!last[t] || d > last[t]) last[t] = d;
                    });
                });
                return Object.keys(m)
                    .sort((a, b) => m[b] - m[a])
                    .map(t => ({ tag: t, count: m[t], last: last[t] }));
            }, [notes]);
            const filtered = tag ? (notes || []).filter(n => (n.tags || []).includes(tag)) : [];
            const top = counts.slice(0, 6);
            return (
                <div>
                    <div className="pv-tags-head">标签</div>
                    {counts.length === 0 && <Empty description="还没有标签，给手记添加标签后会出现在这里" style={{ marginTop: 50 }} />}
                    {counts.length > 0 && (
                        <>
                            <div style={{ fontSize: 13, fontWeight: 600, color: 'rgba(0,0,0,.65)', marginBottom: 8 }}>常用标签</div>
                            <div className="pv-tag-grid">
                                {top.map(c => (
                                    <div key={c.tag} className={'pv-tag-card' + (tag === c.tag ? ' active' : '')} onClick={() => setTag(tag === c.tag ? null : c.tag)}>
                                        <div className="tc-name"><Tag color={tag === c.tag ? 'blue' : 'default'} style={{ margin: 0 }}>#{c.tag}</Tag></div>
                                        <div className="tc-count">{c.count} 条手记 · {fmtDate(new Date(c.last).toISOString())}</div>
                                    </div>
                                ))}
                            </div>
                            {counts.length > top.length && (
                                <>
                                    <div style={{ fontSize: 13, fontWeight: 600, color: 'rgba(0,0,0,.65)', marginBottom: 8 }}>全部标签</div>
                                    <div className="pv-tag-grid">
                                        {counts.slice(top.length).map(c => (
                                            <div key={c.tag} className={'pv-tag-card' + (tag === c.tag ? ' active' : '')} onClick={() => setTag(tag === c.tag ? null : c.tag)}>
                                                <div className="tc-name"><Tag color={tag === c.tag ? 'blue' : 'default'} style={{ margin: 0 }}>#{c.tag}</Tag></div>
                                                <div className="tc-count">{c.count} 条手记 · {fmtDate(new Date(c.last).toISOString())}</div>
                                            </div>
                                        ))}
                                    </div>
                                </>
                            )}
                            {tag && (
                                <div style={{ marginBottom: 12 }}>
                                    <Typography.Text type="secondary">#{tag} · {filtered.length} 条手记</Typography.Text>
                                </div>
                            )}
                            {tag && (
                                <TimelineView notes={filtered} onEdit={onViewNote} onDelete={() => { }} onCard={onCard} />
                            )}
                        </>
                    )}
                </div>
            );
        }

        // ==================== 卡片历史 ====================
        function CardsTab({ isDark }) {
            const [cards, setCards] = useState([]);
            const [loading, setLoading] = useState(true);
            const [shareCard, setShareCard] = useState(null);
            const load = useCallback(() => {
                setLoading(true);
                api('/api/private/cards').then(d => {
                    if (ok(d)) setCards(d.data || []);
                    setLoading(false);
                }).catch(() => setLoading(false));
            }, []);
            useEffect(() => { if (isDark !== undefined) load(); }, [load]);
            const saveCard = async (c) => {
                try {
                    const r = await fetch(baseUrl + c.url, { credentials: 'include' });
                    const blob = await r.blob();
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = 'note-card-' + stamp(c.created_at) + '.png';
                    a.click();
                    setTimeout(() => URL.revokeObjectURL(a.href), 3000);
                } catch (e) { message.error('保存失败'); }
            };
            const copyCard = async (c) => {
                try {
                    const r = await fetch(baseUrl + c.url, { credentials: 'include' });
                    const blob = await r.blob();
                    if (navigator.clipboard && window.ClipboardItem) {
                        await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
                        message.success('图片已复制');
                    } else {
                        message.info('当前浏览器不支持复制图片，请保存图片');
                    }
                } catch (e) {
                    message.info('当前浏览器不支持复制图片，请保存图片');
                }
            };
            return (
                <div>
                    <div className="pv-cards-head">
                        <h3>我的卡片</h3>
                        <span className="pv-cards-sub">最近生成 · 共 {cards.length} 张</span>
                    </div>
                    <div className="card-grid">
                        {cards.map(c => (
                            <div className="card-item" key={c.id}>
                                <div className="card-thumb"><img src={c.url} alt={c.title} loading="lazy" /></div>
                                <div style={{ display: 'flex', alignItems: 'flex-start', gap: 4, marginTop: 8 }}>
                                    <div style={{ flex: 1, minWidth: 0 }}>
                                        <div style={{ fontSize: 13, fontWeight: 500, color: 'var(--color-text)', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{mdStrip(c.title) || '未命名卡片'}</div>
                                        <div style={{ fontSize: 12, color: 'var(--color-text-tertiary)' }}>
                                            {TEMPLATE_LABEL[c.template] || c.template} · {c.width} × {c.height} · {fmtDate(c.created_at)}
                                        </div>
                                    </div>
                                    <Dropdown trigger={['click']} menu={{
                                        items: [
                                            { key: 'save', label: '保存图片', icon: <I name="DownloadOutlined" /> },
                                            { key: 'copy', label: '复制图片', icon: <I name="CopyOutlined" /> },
                                            { key: 'share', label: '分享', icon: <I name="ShareAltOutlined" /> },
                                            { type: 'divider' },
                                            { key: 'delete', label: '删除', icon: <I name="DeleteOutlined" />, danger: true }
                                        ], onClick: ({ key }) => {
                                            if (key === 'save') saveCard(c);
                                            if (key === 'copy') copyCard(c);
                                            if (key === 'share') setShareCard(c);
                                            if (key === 'delete') {
                                                Modal.confirm({
                                                    title: '删除这张卡片？',
                                                    content: '相关分享链接会立即失效，且无法恢复。',
                                                    okText: '删除', okType: 'danger', cancelText: '取消',
                                                    onOk: async () => {
                                                        const d = await api('/api/private/cards/' + c.id, { method: 'DELETE' });
                                                        if (ok(d)) { message.success('卡片已删除'); load(); }
                                                        else message.error('删除失败');
                                                    }
                                                });
                                            }
                                        }
                                    }}>
                                        <Button size="small" type="text" icon={<I name="MoreOutlined" />} />
                                    </Dropdown>
                                </div>
                            </div>
                        ))}
                    </div>
                    {!loading && cards.length === 0 && <Empty description="还没有生成过卡片，在手记上点击「生成卡片」试试" style={{ marginTop: 60 }} />}
                    {shareCard && <ShareModal open={!!shareCard} card={shareCard} onClose={() => setShareCard(null)} />}
                </div>
            );
        }

        // ==================== 密码验证 ====================
        function PasswordGate({ onUnlocked, isDark }) {
            const [pw, setPw] = useState('');
            const [loading, setLoading] = useState(false);
            const [err, setErr] = useState('');
            const submit = async () => {
                if (!pw) { setErr('请输入访问密码'); return; }
                setLoading(true); setErr('');
                try {
                    const d = await api('/api/private/unlock', { method: 'POST', body: JSON.stringify({ password: pw }) });
                    if (ok(d)) { setPw(''); onUnlocked(); }
                    else if (d.code === 429) setErr('尝试次数过多，请稍后再试。');
                    else setErr('密码错误');
                } catch (e) { setErr('网络错误，请重试'); }
                finally { setLoading(false); }
            };
            return (
                <div className="pv-gate">
                    <div className="pv-gate-card">
                        <div className="pv-gate-icon"><I name="LockOutlined" /></div>
                        <div className="pv-gate-title">私人空间</div>
                        <div className="pv-gate-sub">请输入访问密码继续</div>
                        <Input.Password
                            size="large"
                            placeholder="访问密码"
                            value={pw}
                            onChange={e => setPw(e.target.value)}
                            onPressEnter={submit}
                            autoFocus
                        />
                        {err && <Alert type="error" message={err} showIcon style={{ marginTop: 10 }} />}
                        <Button type="primary" size="large" block loading={loading} onClick={submit} style={{ marginTop: 14 }}>进入</Button>
                        <div className="pv-gate-back">
                            <Button type="text" size="small" onClick={() => window.location.href = 'index.html'}>返回 Server Status</Button>
                        </div>
                    </div>
                </div>
            );
        }

        // ReauthModal 会话过期重新验证浮层：
        // 私人空间自动锁定后不离开当前界面，就地输入密码解锁；
        // 解锁成功后自动执行 window.__pvPendingRetry（由触发锁定的操作注册，如继续生成卡片）
        function ReauthModal({ onClose, onUnlocked }) {
            const [pw, setPw] = useState('');
            const [loading, setLoading] = useState(false);
            const [err, setErr] = useState('');
            const submit = async () => {
                if (!pw) { setErr('请输入访问密码'); return; }
                setLoading(true); setErr('');
                try {
                    const d = await api('/api/private/unlock', { method: 'POST', body: JSON.stringify({ password: pw }) });
                    if (ok(d)) { setPw(''); onUnlocked(); }
                    else if (d.code === 429) setErr('尝试次数过多，请稍后再试。');
                    else setErr('密码错误');
                } catch (e) { setErr('网络错误，请重试'); }
                finally { setLoading(false); }
            };
            return (
                <Modal
                    open
                    title={<span><I name="LockOutlined" /> 私人空间已锁定</span>}
                    onCancel={onClose}
                    width={360}
                    footer={null}
                    destroyOnClose
                >
                    <div style={{ paddingTop: 4 }}>
                        <Typography.Text type="secondary" style={{ fontSize: 13 }}>
                            会话超时已自动锁定，输入访问密码后将继续刚才的操作。
                        </Typography.Text>
                        <Input.Password
                            size="large"
                            placeholder="访问密码"
                            value={pw}
                            onChange={e => setPw(e.target.value)}
                            onPressEnter={submit}
                            autoFocus
                            style={{ marginTop: 12 }}
                        />
                        {err && <Alert type="error" message={err} showIcon style={{ marginTop: 10 }} />}
                        <Button type="primary" size="large" block loading={loading} onClick={submit} style={{ marginTop: 14 }}>解锁并继续</Button>
                    </div>
                </Modal>
            );
        }

        // ==================== 主应用 ====================
        function PrivateApp() {
            const [phase, setPhase] = useState('loading');
            const [isDark, setIsDark] = useState(() => localStorage.getItem('theme') === 'dark');
            const [tab, setTab] = useState('timeline');
            const [notes, setNotes] = useState([]);
            const [allNotes, setAllNotes] = useState([]);
            const [editorOpen, setEditorOpen] = useState(false);
            const [editing, setEditing] = useState(null);
            const [cardNote, setCardNote] = useState(null);
            const [searchQ, setSearchQ] = useState('');
            // 会话过期重新验证浮层：任意 API 被锁定拦截时弹出，解锁后自动续做刚才的操作
            const [reauth, setReauth] = useState(false);
            // 全量备份导出进行中标记（hook 必须声明在下方 phase 提前 return 之前，否则锁定态会因 hooks 数量减少而崩溃）
            const [exporting, setExporting] = useState(false);
            const phaseRef = useRef(phase);
            phaseRef.current = phase;
            const isMobile = useMemo(() => typeof window !== 'undefined' && window.matchMedia('(max-width: 768px)').matches, []);

            useEffect(() => {
                // 锁定事件由 api() 统一广播（403 + “未解锁”）；整页密码门阶段无需浮层
                const onLocked = () => { if (phaseRef.current === 'open') setReauth(true); };
                window.addEventListener('pv-locked', onLocked);
                return () => window.removeEventListener('pv-locked', onLocked);
            }, []);

            const onReauthUnlocked = () => {
                setReauth(false);
                message.success('已解锁');
                loadAllNotes();
                // 继续被锁定打断的操作（如生成卡片）
                const retry = window.__pvPendingRetry;
                window.__pvPendingRetry = null;
                if (typeof retry === 'function') setTimeout(retry, 120);
            };

            useEffect(() => {
                // 确认登录并确保会话绑定的 CSRF Cookie 就绪（Double-Submit 的 Token 来源）
                fetch(baseUrl + '/check-auth', { credentials: 'include' }).catch(() => { });
                api('/api/private/session').then(d => {
                    if (d.code === 401) { window.location.href = 'index.html'; return; }
                    setPhase(ok(d) && d.data && d.data.unlocked ? 'open' : 'locked');
                }).catch(() => setPhase('locked'));
            }, []);

            const loadAllNotes = useCallback(() => {
                return api('/api/private/notes').then(d => {
                    if (ok(d)) { setAllNotes(d.data || []); setNotes(d.data || []); setSearchQ(''); }
                });
            }, []);
            const loadNotes = useCallback((q) => {
                const path = q ? '/api/private/search?q=' + encodeURIComponent(q) : '/api/private/notes';
                api(path).then(d => {
                    if (ok(d)) { setNotes(d.data || []); setSearchQ(q || ''); }
                });
            }, []);

            useEffect(() => {
                if (phase === 'open') loadAllNotes();
            }, [phase, loadAllNotes]);

            useEffect(() => {
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
                document.documentElement.classList.toggle('dark', isDark);
                document.body.style.background = isDark ? '#141414' : '#f5f5f5';
            }, [isDark]);

            const [showBackTop, setShowBackTop] = useState(false);
            useEffect(() => {
                if (phase !== 'open') return;
                const onScroll = () => setShowBackTop(window.scrollY > 480);
                onScroll();
                window.addEventListener('scroll', onScroll, { passive: true });
                return () => window.removeEventListener('scroll', onScroll);
            }, [phase]);

            if (phase === 'loading') return <div style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center' }}><Spin size="large" /></div>;
            if (phase === 'locked') return (
                <ConfigProvider theme={{ algorithm: isDark ? darkAlgorithm : undefined, token: { colorBgLayout: isDark ? '#141414' : '#f5f5f5', colorBgContainer: isDark ? '#1f1f1f' : '#ffffff' } }}>
                    <PasswordGate isDark={isDark} onUnlocked={() => { setPhase('open'); loadAllNotes(); }} />
                </ConfigProvider>
            );

            const onSaved = (n) => {
                setEditorOpen(false);
                Promise.all([loadAllNotes(), searchQ ? loadNotes(searchQ) : Promise.resolve()])
                    .catch(() => { })
                    .then(() => {
                        // 新建/编辑保存后自动滚动定位到该手记，免去手动滑动查找
                        if (!n || !n.id) return;
                        requestAnimationFrame(() => requestAnimationFrame(() => {
                            const el = document.querySelector('[data-note-id="' + n.id + '"]');
                            if (!el) return; // 搜索状态下新帖可能不匹配搜索词
                            el.scrollIntoView({ behavior: 'smooth', block: 'start' });
                            el.classList.add('note-flash');
                            setTimeout(() => el.classList.remove('note-flash'), 1700);
                        }));
                    });
            };
            const onDelete = (n) => {
                Modal.confirm({
                    title: '删除这条手记？',
                    content: '此操作将同时删除相关附件和已生成卡片，且无法恢复。',
                    okText: '删除', okType: 'danger', cancelText: '取消',
                    onOk: async () => {
                        const d = await api('/api/private/notes/' + n.id, { method: 'DELETE' });
                        if (ok(d)) { message.success('手记已删除'); loadAllNotes(); if (searchQ) loadNotes(searchQ); }
                        else message.error('删除失败');
                    }
                });
            };
            const changeTab = (t) => {
                setTab(t);
            };
            // 全量备份导出：后端流式打包 zip（手记 Markdown + 解密后的图片/语音），前端拉 blob 触发下载
            const exportAll = async () => {
                if (exporting) return;
                setExporting(true);
                try {
                    const r = await fetch(baseUrl + '/api/private/export/all', { credentials: 'include' });
                    if (!r.ok) throw new Error('HTTP ' + r.status);
                    const blob = await r.blob();
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = '手记备份-' + new Date().toISOString().slice(0, 10) + '.zip';
                    a.click();
                    setTimeout(() => URL.revokeObjectURL(a.href), 3000);
                    message.success('备份已导出');
                } catch (e) {
                    message.error('导出失败：' + (e.message || e));
                } finally {
                    setExporting(false);
                }
            };
            const bottomNav = [
                { key: 'timeline', label: '时间线', icon: 'ClockCircleOutlined' },
                { key: 'calendar', label: '日历', icon: 'CalendarOutlined' },
                { key: 'tags', label: '标签', icon: 'TagsOutlined' },
                { key: 'cards', label: '卡片', icon: 'PictureOutlined' }
            ];
            return (
                <ConfigProvider theme={{ algorithm: isDark ? darkAlgorithm : undefined, token: { colorBgLayout: isDark ? '#141414' : '#f5f5f5', colorBgContainer: isDark ? '#1f1f1f' : '#ffffff' } }}>
                    <div className="pv-root" style={{ background: isDark ? '#141414' : '#f5f5f5' }}>
                        <div className="pv-topbar">
                            <div className="pv-brand"><I name="LockOutlined" className="pv-lock-icon" /><span>Server Status / 私人空间</span></div>
                            <Input.Search
                                className="pv-search"
                                placeholder="搜索标题 / 正文 / 标签 / 地点"
                                allowClear
                                value={searchQ}
                                onChange={e => setSearchQ(e.target.value)}
                                onSearch={q => loadNotes(q || '')}
                            />
                            <div className="pv-actions">
                                <span className="status-dot ok">已解锁</span>
                                <Tooltip title="导出全部手记备份（含图片/语音）">
                                    <Button size="small" icon={<I name="DownloadOutlined" />} loading={exporting} onClick={exportAll} />
                                </Tooltip>
                                <Button size="small" onClick={async () => {
                                    await api('/api/private/lock', { method: 'POST' });
                                    setPhase('locked');
                                }}>锁定</Button>
                                <Button size="small" icon={isDark ? <I name="SunOutlined" /> : <I name="MoonOutlined" />} onClick={() => setIsDark(!isDark)} />
                            </div>
                        </div>
                        <div className="pv-body">
                            {!isMobile && (
                                <Tabs
                                    className="pv-tabs"
                                    activeKey={tab}
                                    onChange={changeTab}
                                    tabBarExtraContent={{ right: <Button type="primary" icon={<I name="PlusOutlined" />} onClick={() => { setEditing(null); setEditorOpen(true); }}>新建手记</Button> }}
                                    items={[
                                        { key: 'timeline', label: <span><I name="ClockCircleOutlined" /> 时间线</span> },
                                        { key: 'calendar', label: <span><I name="CalendarOutlined" /> 日历</span> },
                                        { key: 'tags', label: <span><I name="TagsOutlined" /> 标签</span> },
                                        { key: 'cards', label: <span><I name="PictureOutlined" /> 卡片</span> }
                                    ]}
                                />
                            )}
                            {tab === 'timeline' && <TimelineView notes={notes} isDark={isDark} highlight={searchQ} onEdit={n => { setEditing(n); setEditorOpen(true); }} onDelete={onDelete} onCard={n => setCardNote(n)} />}
                            {tab === 'calendar' && <CalendarTab notes={allNotes} isDark={isDark} highlight={searchQ} onEdit={n => { setEditing(n); setEditorOpen(true); }} onDelete={onDelete} onCard={n => setCardNote(n)} />}
                            {tab === 'tags' && <TagsTab notes={allNotes} onViewNote={n => { setEditing(n); setEditorOpen(true); }} onCard={n => setCardNote(n)} />}
                            {tab === 'cards' && <CardsTab isDark={isDark} />}
                        </div>
                        {isMobile && (
                            <Button className="pv-fab-mobile" type="primary" shape="circle" icon={<I name="PlusOutlined" />} onClick={() => { setEditing(null); setEditorOpen(true); }} />
                        )}
                        <Tooltip title="回到顶部">
                            <Button
                                className={'pv-backtop' + (showBackTop ? ' show' : '')}
                                shape="circle"
                                aria-label="回到顶部"
                                icon={<I name="VerticalAlignTopOutlined" />}
                                onClick={() => window.scrollTo({ top: 0, behavior: 'smooth' })}
                            />
                        </Tooltip>
                        {isMobile && (
                            <div className="pv-bottom-nav">
                                {bottomNav.map(b => (
                                    <button key={b.key} className={tab === b.key ? 'active' : ''} onClick={() => changeTab(b.key)}>
                                        <I name={b.icon} />
                                        {b.label}
                                    </button>
                                ))}
                            </div>
                        )}
                        <NoteEditor
                            open={editorOpen}
                            note={editing}
                            isDark={isDark}
                            onClose={() => setEditorOpen(false)}
                            onSaved={onSaved}
                            onGenerateCard={n => setCardNote(n)}
                        />
                        <CardModal open={!!cardNote} note={cardNote} onClose={() => setCardNote(null)} />
                        {reauth && <ReauthModal onClose={() => setReauth(false)} onUnlocked={onReauthUnlocked} />}
                    </div>
                </ConfigProvider>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<PrivateApp />);
    </script>
</body>
