<div id="root"></div>
<script type="text/babel">
    const { Modal, Input, Button, Form, Card, Tabs, Tag, Space, Typography, ConfigProvider, theme, message,
          Drawer, Select, Popconfirm, Dropdown, Empty, Spin, Alert, Switch, Segmented, Tooltip, Image, Divider,
          Popover, InputNumber, Checkbox } = window.antd;
    const { useState, useEffect, useRef, useCallback, useMemo } = React;
    const { darkAlgorithm } = theme;
    const IconSet = window.icons || {};
    const I = ({ name, ...props }) => { const C = IconSet[name]; return C ? <C {...props} /> : null; };

    const securityToken = "redacted_anti_crawler_2024_security_key";
    const baseUrl = window.location.origin;

    const generateSignature = (path) => {
        const timestamp = Math.floor(Date.now() / 1000).toString();
        const nonce = CryptoJS.lib.WordArray.random(16).toString(CryptoJS.enc.Hex);
        const sig = CryptoJS.HmacSHA256(timestamp + '|' + nonce + '|' + path + '|' + securityToken, securityToken).toString(CryptoJS.enc.Hex);
        return { timestamp, nonce, signature: sig };
    };

    function api(path, options = {}) {
        const sig = generateSignature(new URL(path, baseUrl).pathname);
        const headers = { 'Content-Type': 'application/json', 'X-Timestamp': sig.timestamp, 'X-Nonce': sig.nonce, 'X-Signature': sig.signature, ...(options.headers || {}) };
        return fetch(baseUrl + path, {
            method: options.method || 'GET',
            headers,
            credentials: 'include',
            body: options.body
        }).then(async r => {
            let d;
            try { d = await r.json(); } catch (e) { d = { code: r.status, message: '请求失败' }; }
            return d;
        });
    }

    const ok = d => d && (d.code === 200 || d.code === 0);

    // ==================== 日期工具 ====================
    const pad = n => String(n).padStart(2, '0');
    const parseISO = s => s ? new Date(s) : null;
    const fmtClock = s => { const d = parseISO(s); return d ? pad(d.getHours()) + ':' + pad(d.getMinutes()) : ''; };
    const fmtDate = s => { const d = parseISO(s); return d ? d.getFullYear() + '.' + pad(d.getMonth() + 1) + '.' + pad(d.getDate()) : ''; };
    const fmtFull = s => { const d = parseISO(s); return d ? fmtDate(s) + ' ' + fmtClock(s) : ''; };

        const t = new Date(); const today = t.getFullYear() + '-' + pad(t.getMonth() + 1) + '-' + pad(t.getDate());

        const yesterday = y.getFullYear() + '-' + pad(y.getMonth() + 1) + '-' + pad(y.getDate());

    // ==================== Markdown 渲染（安全转义后渲染）====================
    function escHtml(s) {
        return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    function mdToHtml(src) {
        if (!src) return '';
        const lines = String(src).replace(/\r\n/g, '\n').split('\n');
        const out = [];
        let i = 0;
        const inline = s => s
            .replace(/`([^`]+)`/g, '<code>$1</code>')
            .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
            .replace(/\*([^*]+)\*/g, '<i>$1</i>')
            .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noreferrer">$1</a>');
        while (i < lines.length) {
            const line = lines[i];
            if (line.trim().startsWith('```')) {
                const buf = [];
                i++;
                while (i < lines.length && !lines[i].trim().startsWith('```')) { buf.push(escHtml(lines[i])); i++; }
                i++;
                out.push('<pre>' + buf.join('\n') + '</pre>');
                continue;
            }
            const h = line.match(/^(#{1,3})\s+(.*)$/);
            if (h) {
                const level = Math.min(h[1].length + 2, 4);
                out.push('<p style="font-weight:600;font-size:' + (17 - h[1].length) + 'px;margin:8px 0 4px">' + inline(escHtml(h[2])) + '</p>');
                i++;
                continue;
            }
            const ck = line.match(/^\s*[-*]\s+\[( |x|X)\]\s+(.*)$/);
            if (ck) {
                out.push('<p style="margin:3px 0"><span class="ck">' + (ck[1] !== ' ' ? '☑' : '☐') + '</span>' + inline(escHtml(ck[2])) + '</p>');
                i++;
                continue;
            }
            const ul = line.match(/^\s*[-*]\s+(.*)$/);
            if (ul) {
                out.push('<p style="margin:3px 0">• ' + inline(escHtml(ul[1])) + '</p>');
                i++;
                continue;
            }
            if (/^\s*>\s?/.test(line)) {
                out.push('<blockquote>' + inline(escHtml(line.replace(/^\s*>\s?/, ''))) + '</blockquote>');
                i++;
                continue;
            }
            if (line.trim() === '') {
                i++;
                continue;
            }
            out.push('<p>' + inline(escHtml(line)) + '</p>');
            i++;
        }
        return out.join('');
    }

    // ==================== EXIF（图片时间/GPS 建议）====================
    function readExif(file) {
        return new Promise(resolve => {
            const fr = new FileReader();
            fr.onerror = () => resolve(null);
            fr.onload = () => {
                try {
                    const buf = fr.result;
                    if (buf.byteLength < 4) return resolve(null);
                    const dv = new DataView(buf);
                    const u8 = new Uint8Array(buf, 0, 2);
                    if (u8[0] !== 0xFF || u8[1] !== 0xD8) return resolve(null);
                    let off = 2;
                    while (off + 4 <= buf.byteLength) {
                        if (dv.getUint8(off) !== 0xFF) { off++; continue; }
                        const marker = dv.getUint8(off + 1);
                        if (marker === 0xDA) break;
                        const len = dv.getUint16(off + 2);
                        if (marker === 0xE1) {
                            const app = dv.getUint32(off + 4, false);
                            if (app === 0x45786966) {
                                const exif = parseTiff(buf, off + 10);
                                return resolve(exif);
                            }
                        }
                        off += 2 + len;
                    }
                    resolve(null);
                } catch (e) { resolve(null); }
            };
            fr.readAsArrayBuffer(file);
        });
    }
    function parseTiff(buf, start) {
        const dv = new DataView(buf);
        const little = dv.getUint16(start, false) === 0x4949;
        const u16 = (o) => dv.getUint16(start + o, little);
        const u32 = (o) => dv.getUint32(start + o, little);
        const res = {};
        const valOffset = (e, type, n) => {
            const size = typeSize(type) * n;
            return size <= 4 ? e + 8 : u32(e + 8);
        };
        const readIFD = (ifdOff) => {
            if (!ifdOff || ifdOff <= 0 || ifdOff + 2 > buf.byteLength) return;
            const count = u16(ifdOff);
            for (let j = 0; j < count; j++) {
                const e = ifdOff + 2 + j * 12;
                const tag = u16(e);
                const type = u16(e + 2);
                const n = u32(e + 4);
                const off = valOffset(e, type, n);
                if (tag === 0x0132 || tag === 0x9003) {
                    const chars = [];
                    for (let k = 0; k < n; k++) chars.push(String.fromCharCode(dv.getUint8(start + off + k)));
                    const s = chars.join('').trim();
                    if (s && !res.time) res.time = s;
                }
                if (tag === 0x8825) res.gpsOff = u32(e + 8);
                if (tag === 0x8769) res.exifOff = u32(e + 8);
            }
        };
        const readGPS = (ifdOff) => {
            if (!ifdOff || ifdOff <= 0 || ifdOff + 2 > buf.byteLength) return;
            const count = u16(ifdOff);
            const readRational = (off, idx) => {
                const num = dv.getUint32(start + off + idx * 8, little);
                const den = dv.getUint32(start + off + idx * 8 + 4, little);
                return den ? num / den : 0;
            };
            for (let j = 0; j < count; j++) {
                const e = ifdOff + 2 + j * 12;
                const tag = u16(e);
                const type = u16(e + 2);
                const n = u32(e + 4);
                if (tag === 0x0001) res.gpsLatRef = String.fromCharCode(dv.getUint8(start + valOffset(e, type, n)));
                if (tag === 0x0003) res.gpsLonRef = String.fromCharCode(dv.getUint8(start + valOffset(e, type, n)));
                if (tag === 0x0002 || tag === 0x0004) {
                    const off = valOffset(e, type, n);
                    const d = readRational(off, 0) + readRational(off, 1) / 60 + readRational(off, 2) / 3600;
                    if (tag === 0x0002) res.gpsLat = d; else res.gpsLon = d;
                }
            }
        };
        try {
            const ifd0 = u32(4);
            readIFD(ifd0);
            if (res.exifOff) readIFD(res.exifOff);
            if (res.gpsOff) readGPS(res.gpsOff);
        } catch (e) {}
        return res;
    }
    function typeSize(t) {
        switch (t) {
            case 1: case 2: case 6: case 7: return 1;
            case 3: case 8: return 2;
            case 4: case 9: case 11: return 4;
            case 5: case 10: case 12: return 8;
            default: return 1;
        }
    }

    // ==================== 世界地图（离线）====================
    const worldRings = window.WORLD_RINGS || [];
    function project(lat, lng, w, h, padPx) {
        const p = padPx || 8;
        const x = ((lng + 180) / 360) * (w - p * 2) + p;
        const y = ((90 - lat) / 180) * (h - p * 2) + p;
        return [x, y];
    }
    // 区域内投影（用于自动 fit Marker 的“记忆地图”缩放视图）
    function projectBounds(lat, lng, w, h, b) {
        const pad = 12;
        const iw = w - pad * 2, ih = h - pad * 2;
        const spanLng = Math.max(b.maxLng - b.minLng, 0.0001);
        const spanLat = Math.max(b.maxLat - b.minLat, 0.0001);
        const x = ((lng - b.minLng) / spanLng) * iw + pad;
        const y = ((b.maxLat - lat) / spanLat) * ih + pad;
        return [x, y];
    }
    // 根据实际 Marker 自动计算视图范围：1 个地点 → 城市尺度；少量 → 全部 fit；
    // 跨度极大 → 退回世界视图（null）。
    function computeViewBounds(pts) {
        const list = (pts || []).filter(p => p.lat != null && p.lng != null);
        if (!list.length) return null;
        if (list.length === 1) {
            const p = list[0];
            return {
                minLng: Math.max(-180, p.lng - 8), maxLng: Math.min(180, p.lng + 8),
                minLat: Math.max(-85, p.lat - 7), maxLat: Math.min(85, p.lat + 7)
            };
        }
        let minLng = 180, maxLng = -180, minLat = 90, maxLat = -90;
        let sumLat = 0, sumLng = 0;
        list.forEach(p => {
            minLng = Math.min(minLng, p.lng); maxLng = Math.max(maxLng, p.lng);
            minLat = Math.min(minLat, p.lat); maxLat = Math.max(maxLat, p.lat);
            sumLat += p.lat; sumLng += p.lng;
        });
        const spanLng = maxLng - minLng, spanLat = maxLat - minLat;
        if (spanLng > 120 || spanLat > 70) return null; // 跨度太大退回世界视图
        let padLng = Math.max(spanLng * 0.35, 1.5);
        let padLat = Math.max(spanLat * 0.35, 1);
        if (spanLng < 2 && spanLat < 2) {
            // 同一城市/地点聚簇 → 城市尺度
            const clat = sumLat / list.length, clng = sumLng / list.length;
            padLng = Math.max(6, Math.abs(clng) * 0.06);
            padLat = Math.max(5, Math.abs(clat) * 0.06);
        }
        return {
            minLng: Math.max(-180, minLng - padLng), maxLng: Math.min(180, maxLng + padLng),
            minLat: Math.max(-85, minLat - padLat), maxLat: Math.min(85, maxLat + padLat)
        };
    }
    function drawWorldMap(canvas, w, h, dark, bounds) {
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, w, h);
        const isZoom = !!bounds;
        // 网格
        ctx.strokeStyle = dark ? 'rgba(255,255,255,.05)' : 'rgba(0,0,0,.04)';
        ctx.lineWidth = 1;
        const lngStep = isZoom ? (bounds.maxLng - bounds.minLng > 60 ? 10 : bounds.maxLng - bounds.minLng > 20 ? 5 : 2) : 30;
        const latStep = isZoom ? (bounds.maxLat - bounds.minLat > 40 ? 10 : bounds.maxLat - bounds.minLat > 15 ? 5 : 2) : 30;
        for (let i = Math.ceil((isZoom ? bounds.minLng : -150) / lngStep) * lngStep; i <= (isZoom ? bounds.maxLng : 150); i += lngStep) {
            ctx.beginPath();
            const [x] = isZoom ? projectBounds(0, Math.max(-180, Math.min(180, i)), w, h, bounds) : project(0, i, w, h);
            ctx.moveTo(x, 0); ctx.lineTo(x, h);
            ctx.stroke();
        }
        for (let i = Math.ceil((isZoom ? bounds.minLat : -60) / latStep) * latStep; i <= (isZoom ? bounds.maxLat : 60); i += latStep) {
            ctx.beginPath();
            const [, y] = isZoom ? projectBounds(Math.max(-85, Math.min(85, i)), 0, w, h, bounds) : project(i, 0, w, h);
            ctx.moveTo(0, y); ctx.lineTo(w, y);
            ctx.stroke();
        }
        // 陆地
        ctx.strokeStyle = dark ? 'rgba(255,255,255,.22)' : 'rgba(22,119,255,.32)';
        ctx.fillStyle = dark ? 'rgba(255,255,255,.07)' : 'rgba(22,119,255,.10)';
        ctx.lineWidth = 1;
        ctx.save();
        ctx.beginPath();
        ctx.rect(0, 0, w, h);
        ctx.clip();
        worldRings.forEach(ring => {
            ctx.beginPath();
            ring.forEach(([lng, lat], idx) => {
                const [x, y] = isZoom ? projectBounds(lat, lng, w, h, bounds) : project(lat, lng, w, h);
                if (idx === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            });
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
        });
        ctx.restore();
    }

    // ==================== 卡片渲染器（Canvas）====================
    function wrapText(ctx, text, maxW) {
        const lines = [];
        String(text).split('\n').forEach(para => {
            if (!para.trim()) { lines.push(''); return; }
            let cur = '';
            for (const ch of para) {
                const test = cur + ch;
                if (ctx.measureText(test).width > maxW && cur) {
                    lines.push(cur);
                    cur = ch;
                } else {
                    cur = test;
                }
            }
            if (cur) lines.push(cur);
        });
        return lines;
    }
    function roundRect(ctx, x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
    }
    async function loadImg(url) {
        // 用 fetch(credentials:include) 拉取（保证携带登录/私人 Cookie，能过安全中间件）。
        // 注意：本页 Babel 编译后会把顶层 const { Image } = window.antd 挂到 window.Image 上，
        // 所以绝不能使用 new Image() / new window.Image()，一律用 createImageBitmap 或 createElement('img')。
        const r = await fetch(url, { credentials: 'include' });
        if (!r.ok) throw new Error('图片加载失败 HTTP ' + r.status);
        const blob = await r.blob();
        if (window.createImageBitmap) {
            try {
                return await createImageBitmap(blob);
            } catch (e) { /* 回退到 <img> 解码 */ }
        }
        const objUrl = URL.createObjectURL(blob);
        try {
            return await new Promise((res, rej) => {
                const img = document.createElement('img');
                const timer = setTimeout(() => {
                    img.onload = img.onerror = null;
                    rej(new Error('图片解码超时'));
                }, 8000);
                img.onload = () => { clearTimeout(timer); res(img); };
                img.onerror = () => { clearTimeout(timer); rej(new Error('图片解码失败')); };
                img.src = objUrl;
            });
        } finally {
            setTimeout(() => URL.revokeObjectURL(objUrl), 5000);
        }
    }
    function coverRect(sw, sh, dw, dh, x, y) {
        const s = Math.max(dw / sw, dh / sh);
        const w = sw * s, h = sh * s;
        return [x + (dw - w) / 2, y + (dh - h) / 2, w, h];
    }
    async function drawImageCover(ctx, url, x, y, w, h, r, badge) {
        try {
            const img = await loadImg(url);
            ctx.save();
            roundRect(ctx, x, y, w, h, r || 12);
            ctx.clip();
            const sw = img.naturalWidth || img.width || 1;
            const sh = img.naturalHeight || img.height || 1;
            const [ix, iy, iw, ih] = coverRect(sw, sh, w, h, x, y);
            ctx.drawImage(img, ix, iy, iw, ih);
            if (badge) {
                ctx.fillStyle = 'rgba(0,0,0,.55)';
                ctx.fillRect(x, y, w, h);
                ctx.fillStyle = '#ffffff';
                ctx.font = `600 ${Math.round(Math.min(w, h) * 0.22)}px -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(badge, x + w / 2, y + h / 2);
                ctx.textBaseline = 'alphabetic';
            }
            ctx.restore();

            if (badge) {

                ctx.fillRect(x, y, w, h);
                ctx.fillStyle = '#ffffff';
                ctx.font = `600 ${Math.round(Math.min(w, h) * 0.22)}px -apple-system, sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(badge, x + w / 2, y + h / 2);
                ctx.textBaseline = 'alphabetic';
            }
        }
    }
    // ==================== Card Renderer（独立渲染，预览与 PNG 同源）====================
    // 输入：手记数据 + 显示选项；输出：Canvas（PNG）。绝不依赖页面 DOM / 截图。
    async function renderCard(opts) {
        const {

            show = {}, locationMode = 'name', background = 'white', autoLayout = true
        } = opts;
        const showTitle = show.title !== false;
        const showContent = show.content !== false;
        const showTime = show.time !== false;
        const showLocation = show.location !== false;
        const showTags = show.tags !== false;
        const showImages = show.images !== false;
        const showBrand = show.brand !== false;

        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.fitHint = false; canvas.fitScale = 1;
        const ctx = canvas.getContext('2d');
        ctx.textBaseline = 'alphabetic';
        const padX = Math.round(width * 0.07);

        let locText = '';

            const lat = latitude != null ? latitude.toFixed(2) : '';
            const lng = longitude != null ? longitude.toFixed(2) : '';
            if (locationMode === 'coords') {

            } else {

        const darkPal = { bg: '#141414', text: 'rgba(255,255,255,.92)', secondary: 'rgba(255,255,255,.55)', muted: 'rgba(255,255,255,.35)' };
        const whitePal = { bg: '#ffffff', text: '#141414', secondary: 'rgba(0,0,0,.55)', muted: 'rgba(0,0,0,.35)' };
        const grayPal = { bg: '#f5f5f5', text: '#141414', secondary: 'rgba(0,0,0,.55)', muted: 'rgba(0,0,0,.35)' };

            title: baseF.title * scale,
            content: baseF.content * scale,
            meta: baseF.meta * scale,
            tag: baseF.tag * scale,
            brand: baseF.brand

        const LH = {
            title: baseLH.title * scale,
            content: baseLH.content * scale,
            meta: baseLH.meta * scale,
            tag: baseLH.tag * scale

        const drawBrand = () => {
            if (!brandTxt) return;
            ctx.font = `500 ${F.brand}px ${fontFamily}`;
            ctx.textAlign = 'right';
            ctx.fillStyle = palette.muted;
            ctx.fillText(brandTxt, width - padX, height - height * 0.045);

        const drawText = (startY) => {
            let y = startY;

                ctx.font = `400 ${F.content}px ${fontFamily}`;

                    ctx.font = /(^|\s)[`]/.test(l) ? `400 ${F.content}px ${monoFamily}` : `400 ${F.content}px ${fontFamily}`;

            return y;
        };

        // 图片拼贴：1 整宽 / 2 左右 / 3 一大两小 / 4 2×2，超过 4 张显示 +N
        const drawCollage = async (x, y, w, h, radius) => {
            const urls = showImages && images ? images.slice(0, 4) : [];
            if (!urls.length) return;
            const extra = (showImages && images ? images.length : 0) - 4;
            const badge = extra > 0 ? '+' + extra : null;
            if (urls.length === 1) {
                await drawImageCover(ctx, urls[0], x, y, w, h, radius, badge);
            } else if (urls.length === 2) {
                await drawImageCover(ctx, urls[0], x, y, w / 2, h, radius, null);
                await drawImageCover(ctx, urls[1], x + w / 2, y, w / 2, h, radius, badge);
            } else if (urls.length === 3) {
                await drawImageCover(ctx, urls[0], x, y, w * 0.62, h, radius, null);
                await drawImageCover(ctx, urls[1], x + w * 0.62, y, w * 0.38, h / 2, radius, null);
                await drawImageCover(ctx, urls[2], x + w * 0.62, y + h / 2, w * 0.38, h / 2, radius, badge);
            } else {
                await drawImageCover(ctx, urls[0], x, y, w / 2, h / 2, radius, null);
                await drawImageCover(ctx, urls[1], x + w / 2, y, w / 2, h / 2, radius, null);
                await drawImageCover(ctx, urls[2], x, y + h / 2, w / 2, h / 2, radius, null);
                await drawImageCover(ctx, urls[3], x + w / 2, y + h / 2, w / 2, h / 2, radius, badge);
            }
        };

        // 背景填充（含图片背景模式）
        const fillBackground = async () => {
            if (background === 'image' && showImages && images && images.length) {
                await drawImageCover(ctx, images[0], 0, 0, width, height, 0);
                ctx.fillStyle = 'rgba(0,0,0,.42)';
                ctx.fillRect(0, 0, width, height);
                palette = { bg: 'transparent', text: 'rgba(255,255,255,.95)', secondary: 'rgba(255,255,255,.7)', muted: 'rgba(255,255,255,.5)' };
                return;
            }
            ctx.fillStyle = palette.bg;
            ctx.fillRect(0, 0, width, height);
        };

        // ==================== 服务器模板（实时数据）====================
        if (template === 'server') {
            await fillBackground();
            const s = server || {};
            ctx.textAlign = 'left';
            ctx.font = `700 ${width * 0.05}px ${fontFamily}`;
            ctx.fillStyle = palette.text;
            ctx.fillText(brandTxt || 'Server Status', padX, height * 0.14);
            const items = [
                ['CPU', s.cpu_usage != null ? parseFloat(s.cpu_usage).toFixed(1) + '%' : '-'],
                ['Memory', s.memory_usage != null ? parseFloat(s.memory_usage).toFixed(1) + '%' : '-'],
                ['Disk', s.disk_usage != null ? parseFloat(s.disk_usage).toFixed(1) + '%' : '-'],
                ['Network', s.upload_speed != null ? '↑' + parseFloat(s.upload_speed).toFixed(1) + ' / ↓' + parseFloat(s.download_speed).toFixed(1) + ' KB/s' : '-'],
                ['Uptime', s.uptime || '-']
            ];
            const startY = height * 0.28;
            const rowH = height * 0.085;
            items.forEach((it, i) => {
                const y = startY + i * rowH;
                ctx.font = `400 ${width * 0.028}px ${fontFamily}`;
                ctx.fillStyle = palette.secondary;
                ctx.fillText(it[0], padX, y);
                ctx.font = `600 ${width * 0.036}px ${fontFamily}`;
                ctx.fillStyle = palette.text;
                ctx.fillText(it[1], padX + width * 0.26, y);
            });
            ctx.fillStyle = '#52c41a';
            ctx.beginPath();
            ctx.arc(padX + width * 0.03, startY + items.length * rowH + height * 0.02, width * 0.011, 0, Math.PI * 2);
            ctx.fill();
            ctx.font = `500 ${width * 0.028}px ${fontFamily}`;
            ctx.fillStyle = palette.text;
            ctx.fillText('Online', padX + width * 0.065, startY + items.length * rowH + height * 0.03);
            if (timeTxt) {
                ctx.font = `400 ${width * 0.024}px ${fontFamily}`;
                ctx.fillStyle = palette.muted;
                ctx.fillText(timeTxt, padX, height - height * 0.08);
            }
            drawBrand();
            return canvas;
        }

        // ==================== 图片模板（上方大图 + 下方文字）====================
        if (template === 'image') {
            await fillBackground();
            const imgH = height * 0.5;
            const imgs = showImages && images ? images : [];
            if (imgs.length) {
                await drawCollage(0, 0, width, imgH, 0);
                ctx.fillStyle = palette.bg;
                ctx.fillRect(0, imgH, width, height - imgH);
            }
            let y = imgH + height * 0.06;
            y = drawText(y);
            drawBrand();
            return canvas;
        }

        // ==================== 旅行模板（地点 + 时间 + 文字 + 照片）====================
        if (template === 'travel') {
            await fillBackground();
            ctx.textAlign = 'left';
            ctx.font = `600 ${width * 0.052}px ${fontFamily}`;
            ctx.fillStyle = palette.text;
            ctx.fillText('📍 ' + (locText || '我的足迹'), padX, height * 0.15);
            ctx.font = `400 ${width * 0.027}px ${fontFamily}`;
            ctx.fillStyle = palette.secondary;
            ctx.fillText(timeTxt || '', padX, height * 0.205);
            let y = height * 0.27;
            y = drawText(y);
            if (showImages && images && images.length) {
                const imgs = images.slice(0, 3);
                const gap = width * 0.02;
                const thumbW = (maxW - gap * (imgs.length - 1)) / imgs.length;
                const thumbH = height * 0.28;
                const ty = height - thumbH - height * 0.1;
                for (let k = 0; k < imgs.length; k++) {
                    await drawImageCover(ctx, imgs[k], padX + k * (thumbW + gap), ty, thumbW, thumbH, 12);
                }
            }
            drawBrand();
            return canvas;
        }

        // ==================== 简洁 / 深色 / 浅灰（纯文字排版）====================
        await fillBackground();
        let y = height * 0.15;
        y = drawText(y);
        drawBrand();
        return canvas;
    }

    // ==================== 语音录音（移动端优先）====================
    const recorderSupported = typeof window !== 'undefined' && !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
    function AudioRecorder({ onSaved, onDeleted, audio }) {
        const [rec, setRec] = useState(null);
        const [state, setState] = useState('idle');
        const [secs, setSecs] = useState(0);
        const [playing, setPlaying] = useState(false);
        const timer = useRef(null);
        const chunks = useRef([]);
        const audioRef = useRef(null);
        const recRef = useRef(null);
        const startSec = useRef(0);

        useEffect(() => () => { if (timer.current) clearInterval(timer.current); if (recRef.current && recRef.current.state !== 'inactive') recRef.current.stop(); }, []);

        const start = async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const m = new MediaRecorder(stream);
                chunks.current = [];
                m.ondataavailable = e => { if (e.data.size) chunks.current.push(e.data); };
                m.onstop = async () => {
                    stream.getTracks().forEach(t => t.stop());
                    const blob = new Blob(chunks.current, { type: m.mimeType || 'audio/webm' });
                    if (blob.size > 0) {
                        const name = 'voice-' + Date.now() + (blob.type.includes('mp4') ? '.m4a' : '.webm');
                        const file = new File([blob], name, { type: blob.type });
                        onSaved(file, secs);
                    }
                    setState('idle'); setSecs(0);
                };
                recRef.current = m;
                m.start();
                startSec.current = Date.now();
                setState('recording');
                timer.current = setInterval(() => setSecs(Math.floor((Date.now() - startSec.current) / 1000)), 500);
            } catch (e) {
                message.warning('无法使用麦克风');
            }
        };
        const stop = () => { if (recRef.current && recRef.current.state !== 'inactive') recRef.current.stop(); if (timer.current) clearInterval(timer.current); };
        const fmt = s => pad(Math.floor(s / 60)) + ':' + pad(s % 60);
        return (
            <div>
                {audio && audio.id ? (
                    <Space direction="vertical" style={{ width: '100%' }}>
                        <Space>
                            <Button size="small" icon={<I name="PlayCircleOutlined" />} onClick={() => {
                                const a = audioRef.current;
                                if (!a) return;
                                if (playing) { a.pause(); setPlaying(false); } else { a.play(); setPlaying(true); }
                            }}>{playing ? '暂停' : '播放'}</Button>
                            <Popconfirm title="删除这段语音？" onConfirm={() => onDeleted(audio.id)}>
                                <Button size="small" danger icon={<I name="DeleteOutlined" />}>删除</Button>
                            </Popconfirm>
                            <Typography.Text type="secondary" style={{ fontSize: 12 }}>{fmt(Math.round(audio.duration || 0))}</Typography.Text>
                        </Space>
                        <audio ref={audioRef} src={audio.url} onEnded={() => setPlaying(false)} style={{ display: 'none' }} />
                    </Space>
                ) : recorderSupported ? (
                    state === 'recording' ? (
                        <Space>
                            <Button size="small" danger icon={<I name="StopOutlined" />} onClick={stop}>停止</Button>
                            <Typography.Text style={{ color: '#ff4d4f', fontVariantNumeric: 'tabular-nums' }}>{fmt(secs)}</Typography.Text>
                        </Space>
                    ) : (
                        <Button icon={<I name="AudioOutlined" />} onClick={start}>录音</Button>
                    )
                ) : null}
            </div>
        );
    }

    function NoteEditor({ open, note, isDark, onClose, onSaved, onGenerateCard }) {
        const [title, setTitle] = useState('');

        const reset = (n) => {

        const uploadFiles = async (files, noteId) => {
            const id = noteId || (note ? note.id : null);
            if (!id) { message.warning('请先保存手记基本信息'); return; }
            for (const f of Array.from(files)) {
                const fd = new FormData();
                fd.append('file', f);
                const sig = generateSignature('/api/private/notes/' + id + '/images');
                try {
                    const r = await fetch(baseUrl + '/api/private/notes/' + id + '/images', {
                        method: 'POST', headers: { 'X-Timestamp': sig.timestamp, 'X-Nonce': sig.nonce, 'X-Signature': sig.signature },
                        credentials: 'include', body: fd
                    });
                    const d = await r.json();
                    if (ok(d) && d.data && d.data.id) {
                        setImages(prev => prev.concat({ id: d.data.id, url: d.data.url, sort_order: d.data.sort_order }));
                        const ex = await readExif(f);
                        if (ex && (ex.gpsLat != null || ex.time)) setExif(ex);
                    } else {
                        message.error('图片上传失败：' + (d.message || ''));
                    }
                } catch (e) {
                    message.error('图片上传失败，请重试');
                }
            }
        };
        const onFiles = (list) => {
            if (!list || !list.length) return;
            const allowed = ['image/jpeg', 'image/png', 'image/webp', 'image/gif'];
            const bad = Array.from(list).some(f => !allowed.includes(f.type));
            if (bad) { message.error('仅支持 jpg / png / webp / gif 图片'); return; }
            if (!note) {
                // 尚无手记：先保存草稿（正文为空时给占位）
                doSave(true).then(saved => {
                    if (saved) uploadFiles(list, saved.id);
                });
                return;
            }
            uploadFiles(list);
        };
        const doSave = async (silent) => {
            if (!content.trim() && !title.trim() && images.length === 0) { message.warning('请输入正文或标题'); return null; }
            setSaving(true);
            const body = {
                title, content,
                created_at: timeVal ? fromLocalInput(timeVal) : undefined,
                location_name: loc.location_name || '',
                latitude: loc.latitude,
                longitude: loc.longitude,
                tags
            };
            try {
                const path = note && note.id ? '/api/private/notes/' + note.id : '/api/private/notes';
                const d = await api(path, { method: note && note.id ? 'PUT' : 'POST', body: JSON.stringify(body) });
                if (ok(d)) {
                    if (!silent) { message.success('已保存'); onSaved(d.data); }
                    return d.data;
                }
                if (!silent) message.error(d.message || '保存失败');
                return null;
            } catch (e) {
                if (!silent) message.error('保存失败，请重试');
                return null;
            } finally {
                setSaving(false);
            }
        };
        const moveImg = (idx, dir) => {
            const arr = images.slice();
            const j = idx + dir;
            if (j < 0 || j >= arr.length) return;
            [arr[idx], arr[j]] = [arr[j], arr[idx]];
            setImages(arr);
            if (note) {
                const ids = arr.map(x => x.id);
                api('/api/private/notes/' + note.id + '/images/order', { method: 'PUT', body: JSON.stringify({ ids }) }).catch(() => {});
            }
        };
        const onSaveAudio = async (file, secs) => {
            if (!note) {
                const saved = await doSave(true);
                if (!saved) return;
                note = saved;
            }
            const fd = new FormData();
            fd.append('file', file);
            fd.append('duration', String(secs));
            const sig = generateSignature('/api/private/notes/' + note.id + '/audio');
            try {
                const r = await fetch(baseUrl + '/api/private/notes/' + note.id + '/audio', {
                    method: 'POST', headers: { 'X-Timestamp': sig.timestamp, 'X-Nonce': sig.nonce, 'X-Signature': sig.signature },
                    credentials: 'include', body: fd
                });
                const d = await r.json();
                if (ok(d) && d.data) setAudioList(prev => prev.concat(d.data));
                else message.error('语音保存失败');
            } catch (e) { message.error('语音保存失败'); }
        };
        const onDeleteAudio = async (id) => {
            const d = await api('/api/private/notes/' + note.id + '/audio/' + id, { method: 'DELETE' });
            if (ok(d)) { setAudioList(prev => prev.filter(a => a.id !== id)); message.success('语音已删除'); }
        };
        return (
            <Drawer
                title={note && note.id ? '编辑手记' : '新建手记'}
                styles={{ body: { padding: 16 } }}
                width="min(860px, 100vw)"
                open={open}
                onClose={onClose}
                extra={
                    <Space>
                        <Button onClick={onClose}>取消</Button>
                        <Button type="primary" loading={saving} onClick={() => doSave(false).then(n => n && onSaved(n))}>保存</Button>
                    </Space>
                }
            >
                <div style={{ maxWidth: 760, margin: '0 auto' }}>
                    <Input size="large" placeholder="标题（可选）" value={title} onChange={e => setTitle(e.target.value)} style={{ marginBottom: 10 }} />
                    <Input.TextArea
                        autoSize={{ minRows: 6, maxRows: 18 }}
                        placeholder={'写点什么…\n支持 Markdown、代码块、Checklist：\n- [x] 修改 Server Status\n- [ ] 测试 ESP32\n- [ ] 检查备份\n\nCtrl + Enter 快速保存'}
                        value={content}
                        onChange={e => setContent(e.target.value)}
                        onKeyDown={e => {
                            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); doSave(false).then(n => n && onSaved(n)); }
                        }}
                        style={{ fontSize: 14, lineHeight: 1.7 }}
                    />
                    <div className="pv-editor-toolbar" style={{ marginTop: 10 }}>
                        <Button icon={<I name="PictureOutlined" />} onClick={() => fileRef.current && fileRef.current.click()}>拍照 / 相册</Button>
                        <input ref={fileRef} type="file" accept="image/*" multiple style={{ display: 'none' }} onChange={e => { onFiles(e.target.files); e.target.value = ''; }} />
                        <div style={{ display: 'inline-block' }}
                            onDragOver={e => { e.preventDefault(); setDragging(true); }}
                            onDragLeave={() => setDragging(false)}
                            onDrop={e => { e.preventDefault(); setDragging(false); onFiles(e.dataTransfer.files); }}>
                            <Button icon={<I name="CloudUploadOutlined" />}>拖拽上传</Button>
                        </div>
                    </div>
                    {(images.length > 0 || dragging) && (
                        <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8, marginBottom: 10, minHeight: dragging ? 92 : 0, border: dragging ? '2px dashed #1677ff' : 'none', borderRadius: 8, padding: dragging ? 4 : 0, alignItems: 'center' }}>
                            {images.map((img, idx) => (
                                <div key={img.id} className="pv-img-item">
                                    <img src={img.url} alt="" />
                                    <div className="pv-img-move">
                                        <Button size="small" type="text" style={{ color: '#fff', background: 'rgba(0,0,0,.45)' }} disabled={idx === 0} icon={<I name="ArrowLeftOutlined" />} onClick={() => moveImg(idx, -1)} />
                                        <Button size="small" type="text" style={{ color: '#fff', background: 'rgba(0,0,0,.45)' }} disabled={idx === images.length - 1} icon={<I name="ArrowRightOutlined" />} onClick={() => moveImg(idx, 1)} />
                                    </div>
                                    <Button className="pv-img-del" size="small" type="text" danger icon={<I name="CloseOutlined" />} onClick={async () => {
                                        if (note) {
                                            const d = await api('/api/private/notes/' + note.id + '/images/' + img.id, { method: 'DELETE' });
                                            if (ok(d)) setImages(prev => prev.filter(x => x.id !== img.id));
                                            else message.error('删除失败');
                                        } else {
                                            setImages(prev => prev.filter(x => x.id !== img.id));
                                        }
                                    }} />
                                </div>
                            ))}
                            <div className="pv-upload-box" onClick={() => fileRef.current && fileRef.current.click()}>
                                <I name="PlusOutlined" style={{ fontSize: 20 }} />
                                <span>添加图片</span>
                            </div>
                        </div>
                    )}
                    <Divider style={{ margin: '10px 0' }} />
                    <div style={{ marginBottom: 12 }}>
                        <div style={{ marginBottom: 6, fontWeight: 500 }}>时间</div>
                        <Input type="datetime-local" value={timeVal} onChange={e => setTimeVal(e.target.value)} />
                    </div>
                    <div style={{ marginBottom: 12 }}>
                        <div style={{ marginBottom: 6, fontWeight: 500 }}>位置</div>
                        <LocationPicker value={loc} onChange={setLoc} exif={exif} />
                    </div>
                    <div style={{ marginBottom: 12 }}>
                        <div style={{ marginBottom: 6, fontWeight: 500 }}>标签</div>
                        <Select
                            mode="tags"
                            style={{ width: '100%' }}
                            placeholder="选择或输入标签"
                            value={tags}
                            onChange={setTags}
                            tokenSeparators={[',', '，', '#']}
                            options={PRESET_TAGS.concat(tags.filter(t => !PRESET_TAGS.includes(t))).map(t => ({ value: t, label: '#' + t }))}
                        />
                    </div>
                    <div style={{ marginBottom: 12 }}>
                        <div style={{ marginBottom: 6, fontWeight: 500 }}>语音</div>
                        <AudioRecorder onSaved={onSaveAudio} onDeleted={onDeleteAudio} audio={audioList[audioList.length - 1]} />
                    </div>
                    <Divider style={{ margin: '12px 0' }} />
                    <Space wrap style={{ marginTop: 4 }}>
                        <Button type="primary" icon={<I name="SaveOutlined" />} loading={saving} onClick={() => doSave(false).then(n => n && onSaved(n))}>
                            保存
                        </Button>
                        <Button type="primary" ghost icon={<I name="PictureOutlined" />} loading={saving}
                            onClick={async () => {
                                const n = await doSave(true);
                                if (n) { onSaved(n); onGenerateCard(n); }
                            }}>
                            保存并生成卡片
                        </Button>
                        <Button icon={<I name="ExportOutlined" />} onClick={() => doSave(true).then(n => { if (n) { const a = document.createElement('a'); a.href = baseUrl + '/api/private/export/' + n.id; a.download = 'note.md'; a.click(); } })}>导出</Button>
                    </Space>
                </div>
            </Drawer>
        );
    }

    // ==================== 卡片生成器 ====================
    const CARD_SIZES = [
        { label: '方形', ratio: '1:1', w: 1080, h: 1080 },
        { label: '竖版', ratio: '4:5', w: 1080, h: 1350 },
        { label: '手机长图', ratio: '9:19.5', w: 1170, h: 2532 }
    ];
    const CARD_TEMPLATES = [
        { key: 'simple', label: '简洁' },
        { key: 'dark', label: '深色' },
        { key: 'image', label: '图片' },
        { key: 'travel', label: '旅行' },
        { key: 'server', label: '服务器' }
    ];
    const TEMPLATE_LABEL = Object.fromEntries(CARD_TEMPLATES.map(t => [t.key, t.label]));

    function CardModal({ open, note, onClose }) {
        const [template, setTemplate] = useState('simple');
        const [size, setSize] = useState(0);
        const [background, setBackground] = useState('white');
        const [show, setShow] = useState({ title: true, content: true, time: true, location: true, tags: true, images: true, brand: false });
        const [brandText, setBrandText] = useState('Server Status');
        const [locationMode, setLocationMode] = useState('name');
        const [autoLayout, setAutoLayout] = useState(true);
        const [zoom, setZoom] = useState(1);
        const [preview, setPreview] = useState(null);
        const [fullCanvas, setFullCanvas] = useState(null);
        const [genState, setGenState] = useState('idle'); // idle | generating | done | error
        const [savedCard, setSavedCard] = useState(null);
        const [server, setServer] = useState(null);
        const [shareOpen, setShareOpen] = useState(false);
        const [fitHint, setFitHint] = useState(false);
        const [renderErr, setRenderErr] = useState(false);
        const [retryTick, setRetryTick] = useState(0);
        const stageRef = useRef(null);
        const previewRef = useRef(null);
        const timer = useRef(null);

        const opts = () => ({
            template,
            width: CARD_SIZES[size].w,
            height: CARD_SIZES[size].h,
            title: note ? note.title : '',
            content: note ? note.content : '',
            time: note ? note.created_at : new Date().toISOString(),
            location: note ? note.location_name : '',
            locationName: note ? note.location_name : '',
            latitude: note ? note.latitude : null,
            longitude: note ? note.longitude : null,
            tags: note ? note.tags : [],
            images: note && note.images ? note.images.map(i => i.url) : [],
            brand: show.brand ? brandText : false,
            server,
            show,
            locationMode,
            background,
            autoLayout
        });

        // 生成期间隐藏页面 AI 浮球等悬浮元素（Card Renderer 本身不依赖 DOM）
        useEffect(() => {
            if (open) document.body.classList.add('pv-card-gen');
            else document.body.classList.remove('pv-card-gen');
            return () => document.body.classList.remove('pv-card-gen');
        }, [open]);

        useEffect(() => {
            if (!open) return;
            setTemplate(note && note.images && note.images.length ? 'image' : 'simple');
            setSize(0);
            setBackground('white');
            setShow({ title: true, content: true, time: true, location: true, tags: true, images: true, brand: false });
            setLocationMode('name');
            setAutoLayout(true);
            setZoom(1);
            setGenState('idle');
            setSavedCard(null);
            setFullCanvas(null);
            setServer(null);
            setFitHint(false);
            setRenderErr(false);
            setRetryTick(0);
        }, [open, note && note.id]);

        useEffect(() => {
            if (!open) return;
            if (template === 'server' && !server) {
                api('/api/private/server-status').then(d => { if (ok(d) && d.data) setServer(d.data); });
            }
            clearTimeout(timer.current);
            timer.current = setTimeout(async () => {
                try {
                    const c = await renderCard(opts());
                    setPreview(c);
                    setRenderErr(false);
                    setFitHint(!!c.fitHint);
                    if (previewRef.current) {
                        previewRef.current.width = c.width;
                        previewRef.current.height = c.height;
                        const ctx = previewRef.current.getContext('2d');
                        ctx.clearRect(0, 0, c.width, c.height);
                        ctx.drawImage(c, 0, 0);
                    }
                } catch (e) { setRenderErr(true); }
            }, 200);
            // eslint-disable-next-line react-hooks/exhaustive-deps
        }, [open, template, size, background, locationMode, autoLayout, show, brandText, server, note && note.id, retryTick]);

        // 预览缩放：只改变显示尺寸，内部保持真实分辨率
        useEffect(() => {
            const apply = () => {
                const stage = stageRef.current;
                const cv = previewRef.current;
                if (!stage || !cv || !cv.width) return;
                const sw = stage.clientWidth - 40;
                const sh = stage.clientHeight - 40;
                if (sw <= 0 || sh <= 0) return;
                const fit = Math.min(sw / cv.width, sh / cv.height) * zoom;
                cv.style.width = Math.round(cv.width * fit) + 'px';
                cv.style.height = Math.round(cv.height * fit) + 'px';
            };
            apply();
            window.addEventListener('resize', apply);
            return () => window.removeEventListener('resize', apply);
        }, [preview, zoom, open]);

        const toBlob = c => new Promise(res => c.toBlob(res, 'image/png'));
        const generate = async () => {
            setGenState('generating');
            try {
                const c = await renderCard(opts());
                setFullCanvas(c);
                const blob = await toBlob(c);
                const b64 = await new Promise(res => {
                    const fr = new FileReader();
                    fr.onload = () => res(fr.result);
                    fr.readAsDataURL(blob);
                });
                const d = await api('/api/private/cards', {
                    method: 'POST',
                    body: JSON.stringify({
                        note_id: note ? note.id : '',
                        template, width: CARD_SIZES[size].w, height: CARD_SIZES[size].h,
                        title: (note ? (note.title || note.content || '').slice(0, 80) : 'Server Status'),
                        image: b64
                    })
                });
                if (ok(d) && d.data) {
                    setSavedCard(d.data);
                    setGenState('done');
                    message.success('卡片已生成');
                } else {
                    setGenState('error');
                    message.error('卡片生成失败，请重试');
                }
            } catch (e) {
                setGenState('error');
                message.error('卡片生成失败，请重试');
            }
        };
        const savePng = async () => {
            const c = fullCanvas || preview;
            if (!c) return;
            const blob = await toBlob(c);
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'note-card-' + stamp(note ? note.created_at : null) + '.png';
            a.click();
            setTimeout(() => URL.revokeObjectURL(a.href), 3000);
        };
        const copyPng = async () => {
            const c = fullCanvas || preview;
            if (!c) return;
            const blob = await toBlob(c);
            try {
                if (navigator.clipboard && window.ClipboardItem) {
                    await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
                    message.success('图片已复制');
                } else {
                    message.info('当前浏览器不支持复制图片，请保存图片');
                }
            } catch (e) {
                message.info('当前浏览器不支持复制图片，请保存图片');
            }
        };

        const infoItems = [
            { key: 'title', label: '标题' }, { key: 'content', label: '正文' }, { key: 'time', label: '时间' },
            { key: 'location', label: '地点' }, { key: 'tags', label: '标签' }, { key: 'images', label: '图片' }, { key: 'brand', label: '品牌' }
        ];
        const isTextTpl = template === 'simple' || template === 'travel';

        return (
            <>
                <Modal
                    className="cg-modal"
                    open={open}
                    onCancel={onClose}
                    width={1080}
                    style={{ maxWidth: '96vw', top: 20 }}
                    title="生成卡片"
                    destroyOnClose
                    footer={
                        <div style={{ display: 'flex', gap: 8, justifyContent: 'flex-end', alignItems: 'center', width: '100%' }}>
                            {genState === 'done' && <span className="cg-success"><I name="CheckCircleOutlined" /> 已生成</span>}
                            {genState === 'done' && <Button icon={<I name="DownloadOutlined" />} onClick={savePng}>保存图片</Button>}
                            {genState === 'done' && <Button icon={<I name="CopyOutlined" />} onClick={copyPng}>复制图片</Button>}
                            {genState === 'done' && <Button type="primary" ghost icon={<I name="ShareAltOutlined" />} onClick={() => setShareOpen(true)}>分享</Button>}
                            {genState === 'error' && <Button onClick={generate}>重试</Button>}
                            {genState !== 'done' && <Button onClick={onClose}>取消</Button>}
                            {genState !== 'done' && (
                                <Button type="primary" loading={genState === 'generating'} icon={genState !== 'generating' ? <I name="ThunderboltOutlined" /> : null} onClick={generate}>
                                    {genState === 'generating' ? '生成中...' : '生成卡片'}
                                </Button>
                            )}
                        </div>
                    }
                >
                    <div className="cg-layout">
                        {/* 左侧：设置 */}
                        <div className="cg-left">
                            <div className="cg-section">
                                <div className="cg-label">模板</div>
                                <div className="cg-tpl-row">
                                    {CARD_TEMPLATES.map(t => (
                                        <Button key={t.key} className="cg-tpl-btn" type={template === t.key ? 'primary' : 'default'} onClick={() => setTemplate(t.key)}>
                                            {t.label}
                                        </Button>
                                    ))}
                                </div>
                            </div>
                            <div className="cg-section">
                                <div className="cg-label">尺寸</div>
                                <div className="cg-tpl-row">
                                    {CARD_SIZES.map((s, i) => (
                                        <Button key={i} className="cg-tpl-btn" type={size === i ? 'primary' : 'default'} onClick={() => setSize(i)}>
                                            <span>{s.label}</span>
                                            <span className="cg-tpl-ratio">{s.ratio}</span>
                                        </Button>
                                    ))}
                                </div>
                            </div>
                            {isTextTpl && (
                                <div className="cg-section">
                                    <div className="cg-label">背景</div>
                                    <Segmented size="small" block value={background} onChange={setBackground} options={[
                                        { value: 'white', label: '白色' },
                                        { value: 'gray', label: '浅灰' },
                                        { value: 'dark', label: '深色' },
                                        { value: 'image', label: '图片' }
                                    ]} />
                                </div>
                            )}
                            <div className="cg-section">
                                <div className="cg-label">信息显示 <span className="cg-sub">控制进入卡片的内容</span></div>
                                <div className="cg-info-row">
                                    {infoItems.map(it => (
                                        <Checkbox key={it.key} checked={show[it.key]} onChange={e => setShow({ ...show, [it.key]: e.target.checked })}>{it.label}</Checkbox>
                                    ))}
                                </div>
                                {show.brand && (
                                    <div style={{ marginTop: 8 }}>
                                        <Input size="small" value={brandText} onChange={e => setBrandText(e.target.value)} placeholder="品牌文字" style={{ width: 200 }} />
                                    </div>
                                )}
                                {show.location && template !== 'server' && (
                                    <div style={{ marginTop: 8 }}>
                                        <Segmented size="small" value={locationMode} onChange={setLocationMode} options={[
                                            { value: 'name', label: '地点名称' },
                                            { value: 'coords', label: '坐标' },
                                            { value: 'hidden', label: '隐藏' }
                                        ]} />
                                    </div>
                                )}
                            </div>
                            <div className="cg-section">
                                <div className="cg-label">
                                    自动排版
                                    <Tooltip title="自动调整字体与行距，防止文字溢出或被裁剪">
                                        <I name="QuestionCircleOutlined" style={{ color: 'rgba(0,0,0,.35)' }} />
                                    </Tooltip>
                                </div>
                                <Switch checked={autoLayout} onChange={setAutoLayout} checkedChildren="开" unCheckedChildren="关" />
                            </div>
                            {note && note.images && note.images.length > 0 && (
                                <div style={{ fontSize: 12, color: 'rgba(0,0,0,.45)' }}>将使用手记中的前 {Math.min(note.images.length, 4)} 张图片</div>
                            )}
                            {template === 'server' && !server && <div style={{ marginTop: 10 }}><Spin size="small" /> 正在获取服务器状态…</div>}
                        </div>
                        {/* 右侧：实时预览（与最终 PNG 同一 Renderer） */}
                        <div className="cg-right">
                            <div className="cg-stage" ref={stageRef}>
                                {renderErr ? (
                                    <div style={{ textAlign: 'center' }}>
                                        <Alert type="warning" showIcon message="卡片渲染失败，请重试" style={{ marginBottom: 10 }} />
                                        <Button type="primary" icon={<I name="ReloadOutlined" />} onClick={() => setRetryTick(t => t + 1)}>重试</Button>
                                    </div>
                                ) : (
                                    <>
                                        <canvas ref={previewRef} />
                                        {fitHint && <div className="cg-fit-hint">内容较长，已自动缩小字体</div>}
                                        {!preview && <Spin />}
                                    </>
                                )}
                            </div>
                            <div className="cg-zoom">
                                <Button size="small" icon={<I name="MinusOutlined" />} onClick={() => setZoom(Math.max(0.5, +(zoom - 0.25).toFixed(2)))} />
                                <Typography.Text style={{ width: 46, textAlign: 'center', fontVariantNumeric: 'tabular-nums' }}>{Math.round(zoom * 100)}%</Typography.Text>
                                <Button size="small" icon={<I name="PlusOutlined" />} onClick={() => setZoom(Math.min(1.5, +(zoom + 0.25).toFixed(2)))} />
                            </div>
                            <div className="cg-ratio">实际输出 {CARD_SIZES[size].w} × {CARD_SIZES[size].h}px · {CARD_SIZES[size].ratio}</div>
                        </div>
                    </div>
                </Modal>
                {savedCard && <ShareModal open={shareOpen} card={savedCard} onClose={() => setShareOpen(false)} />}
            </>
        );
    }

    // ==================== 分享 ====================
    function ShareModal({ open, card, onClose }) {
        const [expiry, setExpiry] = useState('24h');
        const [password, setPassword] = useState('');
        const [allowDownload, setAllowDownload] = useState(true);
        const [creating, setCreating] = useState(false);
        const [share, setShare] = useState(null);
        const create = async () => {
            setCreating(true);
            try {
                const d = await api('/api/private/cards/' + card.id + '/share', {
                    method: 'POST',
                    body: JSON.stringify({ expires_in: expiry, password, allow_download: allowDownload })
                });
                if (ok(d) && d.data) setShare(d.data);
                else message.error(d.message || '分享失败，请重试');
            } catch (e) { message.error('分享失败，请重试'); }
            finally { setCreating(false); }
        };
        const copyText = async (t) => {
            try { await navigator.clipboard.writeText(t); message.success('已复制'); }
            catch (e) { message.info('复制失败，请手动复制'); }
        };
        const saveQr = async () => {
            try {
                const r = await fetch(baseUrl + share.qr_url, { credentials: 'include' });
                const blob = await r.blob();
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = 'share-qr.png';
                a.click();
                setTimeout(() => URL.revokeObjectURL(a.href), 3000);
            } catch (e) { message.error('二维码下载失败'); }
        };
        return (
            <Modal open={open} onCancel={onClose} width={480} footer={null} title="生成分享链接" destroyOnClose>
                {!share ? (
                    <Space direction="vertical" style={{ width: '100%' }} size={12}>
                        <div>
                            <div style={{ marginBottom: 6, fontWeight: 500 }}>有效期</div>
                            <Segmented block value={expiry} onChange={setExpiry} options={[
                                { value: '10m', label: '10 分钟' },
                                { value: '1h', label: '1 小时' },
                                { value: '24h', label: '24 小时' },
                                { value: '7d', label: '7 天' },
                                { value: 'permanent', label: '永久' }
                            ]} />
                        </div>
                        <div>
                            <div style={{ marginBottom: 6, fontWeight: 500 }}>访问密码（可选）</div>
                            <Input.Password placeholder="不填则无需密码" value={password} onChange={e => setPassword(e.target.value)} />
                        </div>
                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                            <span>允许下载图片</span>
                            <Switch checked={allowDownload} onChange={setAllowDownload} />
                        </div>
                        <Button type="primary" block loading={creating} onClick={create}>生成分享链接</Button>
                    </Space>
                ) : (
                    <div style={{ textAlign: 'center' }}>
                        <img src={baseUrl + share.qr_url} alt="二维码" style={{ width: 220, height: 220, borderRadius: 8 }} />
                        <div className="share-line">
                            <Input readOnly value={share.url} />
                            <Button onClick={() => copyText(share.url)}>复制链接</Button>
                        </div>
                        <div className="share-line" style={{ justifyContent: 'center' }}>
                            <Button icon={<I name="QrcodeOutlined" />} onClick={saveQr}>保存二维码</Button>
                            <Button icon={<I name="CopyOutlined" />} onClick={() => {
                                const sig = generateSignature(share.qr_url);
                                fetch(baseUrl + share.qr_url, { headers: { 'X-Timestamp': sig.timestamp, 'X-Nonce': sig.nonce, 'X-Signature': sig.signature }, credentials: 'include' })
                                    .then(r => r.blob())
                                    .then(async blob => {
                                        try {
                                            if (navigator.clipboard && window.ClipboardItem) {
                                                await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
                                                message.success('二维码已复制');
                                            } else message.info('浏览器不支持复制图片，请保存二维码');
                                        } catch (e) { message.info('浏览器不支持复制图片，请保存二维码'); }
                                    });
                            }}>复制二维码</Button>
                        </div>
                        {share.expires_at && <Typography.Text type="secondary" style={{ display: 'block', marginTop: 8, fontSize: 12 }}>有效期至 {fmtFull(share.expires_at)}</Typography.Text>}
                    </div>
                )}
            </Modal>
        );
    }

    // ==================== 地图（记忆地图：自动 fit + 聚合 Marker + 记忆预览卡）====================
    function MapTab({ notes, focus, onViewNote }) {
        const wrapRef = useRef(null);
        const canvasRef = useRef(null);
        const [isDark, setIsDark] = useState(() => localStorage.getItem('theme') === 'dark');
        const [timeFilter, setTimeFilter] = useState('all');
        const [tagFilter, setTagFilter] = useState(null);
        const [selGroup, setSelGroup] = useState(null);

        const filtered = useMemo(() => {
            const now = new Date();
            const yStart = new Date(now.getFullYear(), 0, 1);
            const mStart = new Date(now.getFullYear(), now.getMonth(), 1);
            const wStart = new Date(now);
            wStart.setHours(0, 0, 0, 0);
            wStart.setDate(now.getDate() - ((now.getDay() + 6) % 7));
            return (notes || []).filter(n => {
                if (n.latitude == null || n.longitude == null) return false;
                if (tagFilter && !(n.tags || []).includes(tagFilter)) return false;
                if (timeFilter !== 'all') {
                    const d = new Date(n.created_at);
                    if (timeFilter === 'year' && d < yStart) return false;
                    if (timeFilter === 'month' && d < mStart) return false;
                    if (timeFilter === 'week' && d < wStart) return false;
                }
                return true;
            });
        }, [notes, tagFilter, timeFilter]);

        const groups = useMemo(() => {
            const m = new Map();
            filtered.forEach(n => {
                const key = (n.latitude || 0).toFixed(3) + ',' + (n.longitude || 0).toFixed(3);
                if (!m.has(key)) m.set(key, []);
                m.get(key).push(n);
            });
            return Array.from(m.values());
        }, [filtered]);

        const viewBounds = useMemo(
            () => computeViewBounds(filtered.map(n => ({ lat: n.latitude, lng: n.longitude }))),
            [filtered]
        );

        // 从时间线点击地点进入：定位到该 Marker 并打开记忆预览卡
        useEffect(() => {
            if (!focus || !focus.id) return;
            const target = (notes || []).find(n => n.id === focus.id);
            if (!target || target.latitude == null) return;
            const key = (target.latitude || 0).toFixed(3) + ',' + (target.longitude || 0).toFixed(3);
            const g = groups.find(gr => ((gr[0].latitude || 0).toFixed(3) + ',' + (gr[0].longitude || 0).toFixed(3)) === key);
            if (g) setSelGroup(g);
            // eslint-disable-next-line react-hooks/exhaustive-deps
        }, [focus && focus.id]);

        useEffect(() => {
            const draw = () => {
                const wrap = wrapRef.current;
                const canvas = canvasRef.current;
                if (!wrap || !canvas) return;
                const w = wrap.clientWidth || 800;
                const h = Math.max(380, Math.round(w * 0.52));
                canvas.style.height = h + 'px';
                drawWorldMap(canvas, w, h, isDark, viewBounds);
            };
            draw();
            window.addEventListener('resize', draw);
            return () => window.removeEventListener('resize', draw);
        }, [isDark, viewBounds]);

        const markerPos = (n) => {
            const canvas = canvasRef.current;
            if (!canvas) return { left: 0, top: 0 };
            const [x, y] = viewBounds
                ? projectBounds(n.latitude, n.longitude, canvas.width, canvas.height, viewBounds)
                : project(n.latitude, n.longitude, canvas.width, canvas.height);
            return { left: (x / canvas.width * 100) + '%', top: (y / canvas.height * 100) + '%' };
        };

        const allTagOptions = useMemo(() => {
            const s = new Set();
            (notes || []).forEach(n => (n.tags || []).forEach(t => s.add(t)));
            return Array.from(s);
        }, [notes]);
        const recent = useMemo(() => {
            let r = null;
            (notes || []).forEach(n => {
                if (n.latitude == null) return;
                if (!r || new Date(n.created_at) > new Date(r.created_at)) r = n;
            });
            return r;
        }, [notes]);

        if (filtered.length === 0) {
            return (
                <div>
                    <MapHead filtered={filtered} groups={groups} recent={recent} timeFilter={timeFilter} setTimeFilter={setTimeFilter} tagFilter={tagFilter} setTagFilter={setTagFilter} tags={allTagOptions} />
                    <Empty description={notes && notes.length ? '当前筛选条件下没有带位置的手记' : '还没有带位置的手记，记录时添加位置后会出现在这里'} style={{ marginTop: 60 }} />
                </div>
            );
        }
        const selNote = selGroup && selGroup[0];
        return (
            <div>
                <MapHead filtered={filtered} groups={groups} recent={recent} timeFilter={timeFilter} setTimeFilter={setTimeFilter} tagFilter={tagFilter} setTagFilter={setTagFilter} tags={allTagOptions} />
                <div className="pv-map" ref={wrapRef}>
                    <canvas ref={canvasRef} />
                    {selGroup && selNote && (
                        <div className="pv-mem-card">
                            <Button className="mc-close" size="small" type="text" icon={<I name="CloseOutlined" />} onClick={() => setSelGroup(null)} />
                            <div className="mc-date">{fmtDate(selNote.created_at)} {fmtClock(selNote.created_at)}</div>
                            <div className="mc-loc">📍 {locLabel(selNote)}</div>
                            {selGroup.length > 1 && <div style={{ fontSize: 12, color: 'rgba(0,0,0,.45)', marginBottom: 4 }}>此地点共 {selGroup.length} 条手记</div>}
                            {selNote.images && selNote.images.length > 0 && <img className="mc-thumb" src={selNote.images[0].url} alt="" loading="lazy" />}
                            <div className="mc-title">{selNote.title || selNote.content || ''}</div>
                            {(selNote.tags || []).length > 0 && (
                                <div style={{ marginBottom: 8 }}>
                                    {(selNote.tags || []).map(t => <Tag key={t} style={{ marginRight: 4 }}>#{t}</Tag>)}
                                </div>
                            )}
                            <Button size="small" type="primary" onClick={() => onViewNote(selNote)}>查看手记</Button>
                        </div>
                    )}
                    {groups.map(gr => {
                        const n = gr[0];
                        const pos = markerPos(n);
                        const active = selGroup === gr;
                        return (
                            <div key={n.id} className={'pv-map-marker' + (active ? ' active' : '')} style={pos} title={locLabel(n)} onClick={() => setSelGroup(active ? null : gr)}>
                                📍
                                {gr.length > 1 && <span className="mk-count">{gr.length}</span>}
                            </div>
                        );
                    })}
                </div>
            </div>
        );
    }

    function MapHead({ filtered, groups, recent, timeFilter, setTimeFilter, tagFilter, setTagFilter, tags }) {
        return (
            <div>
                <div className="pv-map-head">
                    <div className="pv-map-title">我的记忆地图</div>
                    <div className="pv-map-stats">
                        <span className="ms"><b>{groups.length}</b> 个地点</span>
                        <span className="ms"><b>{filtered.length}</b> 条手记</span>
                        {recent && <span className="ms">最近记录：{locLabel(recent)}</span>}
                    </div>
                </div>
                <div className="pv-map-filters">
                    <Segmented size="small" value={timeFilter} onChange={setTimeFilter} options={[
                        { value: 'all', label: '全部' },
                        { value: 'year', label: '今年' },
                        { value: 'month', label: '本月' },
                        { value: 'week', label: '本周' }
                    ]} />
                    {tags.length > 0 && (
                        <Select
                            size="small"
                            style={{ width: 140 }}
                            placeholder="按标签筛选"
                            allowClear
                            value={tagFilter || undefined}
                            onChange={v => setTagFilter(v || null)}
                            options={tags.map(t => ({ value: t, label: '#' + t }))}
                        />
                    )}
                </div>
            </div>
        );
    }

    // ==================== 标签 ====================
    function TagsTab({ notes, onViewNote, onCard }) {
        const [tag, setTag] = useState(null);
        const counts = useMemo(() => {
            const m = {};
            const last = {};
            (notes || []).forEach(n => {
                (n.tags || []).forEach(t => {
                    m[t] = (m[t] || 0) + 1;
                    const d = new Date(n.created_at).getTime();
                    if (!last[t] || d > last[t]) last[t] = d;
                });
            });
            return Object.keys(m)
                .sort((a, b) => m[b] - m[a])
                .map(t => ({ tag: t, count: m[t], last: last[t] }));
        }, [notes]);
        const filtered = tag ? (notes || []).filter(n => (n.tags || []).includes(tag)) : [];
        const top = counts.slice(0, 6);
        return (
            <div>
                <div className="pv-tags-head">标签</div>
                {counts.length === 0 && <Empty description="还没有标签，给手记添加标签后会出现在这里" style={{ marginTop: 50 }} />}
                {counts.length > 0 && (
                    <>
                        <div style={{ fontSize: 13, fontWeight: 600, color: 'rgba(0,0,0,.65)', marginBottom: 8 }}>常用标签</div>
                        <div className="pv-tag-grid">
                            {top.map(c => (
                                <div key={c.tag} className={'pv-tag-card' + (tag === c.tag ? ' active' : '')} onClick={() => setTag(tag === c.tag ? null : c.tag)}>
                                    <div className="tc-name"><Tag color={tag === c.tag ? 'blue' : 'default'} style={{ margin: 0 }}>#{c.tag}</Tag></div>
                                    <div className="tc-count">{c.count} 条手记 · {fmtDate(new Date(c.last).toISOString())}</div>
                                </div>
                            ))}
                        </div>
                        {counts.length > top.length && (
                            <>
                                <div style={{ fontSize: 13, fontWeight: 600, color: 'rgba(0,0,0,.65)', marginBottom: 8 }}>全部标签</div>
                                <div className="pv-tag-grid">
                                    {counts.slice(top.length).map(c => (
                                        <div key={c.tag} className={'pv-tag-card' + (tag === c.tag ? ' active' : '')} onClick={() => setTag(tag === c.tag ? null : c.tag)}>
                                            <div className="tc-name"><Tag color={tag === c.tag ? 'blue' : 'default'} style={{ margin: 0 }}>#{c.tag}</Tag></div>
                                            <div className="tc-count">{c.count} 条手记 · {fmtDate(new Date(c.last).toISOString())}</div>
                                        </div>
                                    ))}
                                </div>
                            </>
                        )}
                        {tag && (
                            <div style={{ marginBottom: 12 }}>
                                <Typography.Text type="secondary">#{tag} · {filtered.length} 条手记</Typography.Text>
                            </div>
                        )}
                        {tag && (
                            <TimelineView notes={filtered} onEdit={onViewNote} onDelete={() => {}} onCard={onCard} onLocClick={() => {}} />
                        )}
                    </>
                )}
            </div>
        );
    }

    // ==================== 卡片历史 ====================

        const [shareCard, setShareCard] = useState(null);
        const load = useCallback(() => {
            setLoading(true);
            api('/api/private/cards').then(d => {
                if (ok(d)) setCards(d.data || []);
                setLoading(false);
            }).catch(() => setLoading(false));
        }, []);
        useEffect(() => { if (isDark !== undefined) load(); }, [load]);
        const saveCard = async (c) => {
            try {
                const r = await fetch(baseUrl + c.url, { credentials: 'include' });
                const blob = await r.blob();
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = 'note-card-' + stamp(c.created_at) + '.png';
                a.click();
                setTimeout(() => URL.revokeObjectURL(a.href), 3000);
            } catch (e) { message.error('保存失败'); }
        };
        const copyCard = async (c) => {
            try {
                const r = await fetch(baseUrl + c.url, { credentials: 'include' });
                const blob = await r.blob();
                if (navigator.clipboard && window.ClipboardItem) {
                    await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
                    message.success('图片已复制');
                } else {
                    message.info('当前浏览器不支持复制图片，请保存图片');
                }
            } catch (e) {
                message.info('当前浏览器不支持复制图片，请保存图片');
            }
        };
        return (
            <div>
                <div className="pv-cards-head">
                    <h3>我的卡片</h3>
                    <span className="pv-cards-sub">最近生成 · 共 {cards.length} 张</span>
                </div>
                <div className="card-grid">
                    {cards.map(c => (

                            <div style={{ marginTop: 6, fontSize: 13, color: 'rgba(0,0,0,.85)' }}>{c.title || '未命名卡片'}</div>
                            <div style={{ fontSize: 12, color: 'rgba(0,0,0,.45)' }}>
                                {TEMPLATE_LABEL[c.template] || c.template} · {c.width} × {c.height} · {fmtDate(c.created_at)}

                            </div>
