        }

        // ==================== 最近活动 ====================
        const ACTIVITY_TYPES = [
            { label: 'All', value: 'all' },
            { label: 'Commits', value: 'commit' },
            { label: 'Releases', value: 'release' },
            { label: 'Issues', value: 'issue' },
            { label: 'Pull Requests', value: 'pull_request' },
            { label: 'Actions', value: 'workflow' },
        ];
        const ACTIVITY_META = {
            commit: { icon: 'CodeOutlined', label: 'Commit' },
            release: { icon: 'RocketOutlined', label: 'Release' },
            issue: { icon: 'IssueOutlined', label: 'Issue' },
            pull_request: { icon: 'MergeCellsOutlined', label: 'Pull Request' },
            workflow: { icon: 'ThunderboltOutlined', label: 'Workflow' },
        };
        function ActivitySection({ owner, repo }) {
            const PAGE = 20;
            const [items, setItems] = useState(null);
            const [err, setErr] = useState(null);
            const [hasMore, setHasMore] = useState(false);
            const [filter, setFilter] = useState('all');
            const [loadingMore, setLoadingMore] = useState(false);

            const loadPage = useCallback((offset) => {
                if (offset === 0) { setItems(null); setErr(null); }
                else setLoadingMore(true);
                return ghGet(baseUrl + '/api/github/repos/' + encodeURIComponent(owner) + '/' + encodeURIComponent(repo) + '/activity?offset=' + offset + '&limit=' + PAGE)
                    .then(d => {
                        const got = d.items || [];
                        setItems(prev => offset === 0 ? got : (prev || []).concat(got));
                        setHasMore(!!d.has_more);
                    })
                    .catch(e => { if (offset === 0) setErr(e); })
                    .finally(() => setLoadingMore(false));
            }, [owner, repo]);

            useEffect(() => { loadPage(0); }, [loadPage]);

            if (err) return <Alert type="warning" showIcon message="最近活动暂时无法获取" />;
            if (!items) return <Skeleton active title={false} paragraph={{ rows: 5 }} />;
            if (!items.length) return <Empty image={Empty.PRESENTED_IMAGE_SIMPLE} description="暂无活动记录" style={{ padding: '16px 0' }} />;

            const filtered = filter === 'all' ? items : items.filter(i => i.type === filter);
            return (
                <div>
                    <div className="gh-window-seg">
                        <Segmented size="small" value={filter} onChange={setFilter}
                            options={ACTIVITY_TYPES.map(t => ({ label: t.label, value: t.value }))} />
                    </div>
                    {filtered.length === 0 ? (
                        <Empty image={Empty.PRESENTED_IMAGE_SIMPLE} description="当前筛选下暂无活动" style={{ padding: '16px 0' }} />
                    ) : (
                        <div className="gh-timeline">
                            {filtered.map((it, i) => {
                                const meta = ACTIVITY_META[it.type] || { icon: 'ClockCircleOutlined', label: it.type };
                                return (
                                    <div className="gh-tl-item" key={it.type + '-' + (it.ref || '') + '-' + i}>
                                        <span className={'gh-tl-dot gh-tl-' + it.type} />
                                        <div className="gh-tl-head">
                                            <span className="gh-tl-type"><UIIcon name={meta.icon} /> {meta.label}</span>
                                            <span className="gh-tl-time">{relTime(it.time)}</span>
                                        </div>
                                        <div className="gh-tl-title">
                                            <a href={it.html_url} target="_blank" rel="noopener noreferrer" style={{ color: 'inherit' }}>{it.title || '—'}</a>
                                        </div>
                                        {(it.subtitle || it.author || it.status) && (
                                            <div className="gh-tl-sub">
                                                {it.subtitle && <span className="gh-mono">{it.subtitle}</span>}
                                                {it.author && <span style={{ marginLeft: it.subtitle ? 8 : 0 }}>{it.author}</span>}
                                                {it.status && <span style={{ marginLeft: 8 }}>{it.status}</span>}
                                            </div>
                                        )}
                                    </div>
                                );
                            })}
                        </div>
                    )}
                    {hasMore && (
                        <Button type="link" size="small" loading={loadingMore} style={{ paddingLeft: 0, marginTop: 4 }}
                            onClick={() => loadPage(items.length)}>Load more</Button>
                    )}
                </div>
            );
        }

        // ==================== 详情 Drawer ====================
        function DetailOverview({ state, repo, stats, heat, age }) {
            const [readmeExpanded, setReadmeExpanded] = useState(false);
            const now = dayjs();
            const created = repo.created_at ? dayjs(repo.created_at) : null;
            const items = [
                { k: 'created', label: 'Created', value: created ? created.format('YYYY-MM-DD') : '—' },
                { k: 'age', label: 'Age', value: age && age.label ? age.label : '—' },
                { k: 'updated', label: 'Last Update', value: relTime(repo.updated_at) },
                { k: 'pushed', label: 'Last Push', value: relTime(repo.pushed_at) },
                { k: 'branch', label: 'Default Branch', value: repo.default_branch || '—', mono: true },
                { k: 'license', label: 'License', value: repo.license || '—' },
                { k: 'lang', label: 'Language', value: repo.language || '—', lang: true },
                { k: 'watchers', label: 'Watchers', value: repo.watchers },
            ];
            return (
                <div>
                    <div className="gh-kv">
                        {items.map(it => (
                            <div className="gh-kv-item" key={it.k}>
                                <div className="gh-kv-label">{it.label}</div>
                                <div className={'gh-kv-value' + (it.mono ? ' gh-mono' : '')}>
                                    {it.lang ? <LangDot lang={it.value === '—' ? '' : it.value} /> : it.value}
                                    {it.lang && it.value === '—' && '—'}
                                </div>
                            </div>
                        ))}
                    </div>

                    {repo.homepage && (
                        <div className="gh-kv-item" style={{ marginTop: 12 }}>
                            <div className="gh-kv-label">Homepage</div>
                            <div className="gh-kv-value"><a href={repo.homepage} target="_blank" rel="noopener noreferrer">{repo.homepage}</a></div>
                        </div>
                    )}

                    <div className="gh-section"><span className="gh-section-title">Topics</span></div>
                    {repo.topics && repo.topics.length > 0 ? (
                        <Space size={[6, 6]} wrap>
                            {repo.topics.map(tp => <Tag key={tp} style={{ marginInlineEnd: 0 }}>{tp}</Tag>)}
                        </Space>
                    ) : (
                        <Typography.Text type="secondary" style={{ fontSize: 12 }}>No topics</Typography.Text>
                    )}

                    <div className="gh-section"><span className="gh-section-title">Languages</span></div>
                    <LanguagesSection owner={repo.owner} repo={repo.name} />
                </div>
            );
        }

        function DetailDrawer({ state, onClose, isDark }) {
            const isMobile = useIsMobile();
            const [tab, setTab] = useState('overview');
            const [rateLimit, setRateLimit] = useState(null);
            const repo = state.repo;
            const stats = state.stats;
            const heat = state.heat;
            const age = state.age;

            useEffect(() => { setTab('overview'); setRateLimit(null); }, [repo && repo.name]);

            const tabs = [
                { key: 'overview', label: 'Overview', children: repo ? <DetailOverview state={state} repo={repo} stats={stats} heat={heat} age={age} /> : null },
                { key: 'stars', label: 'Star 趋势', children: repo ? <StarTrendSection owner={repo.owner} repo={repo.name} isDark={isDark} onRateLimit={setRateLimit} /> : null },
                { key: 'commits', label: 'Commit', children: repo ? <CommitSection owner={repo.owner} repo={repo.name} isDark={isDark} onRateLimit={setRateLimit} /> : null },
                { key: 'releases', label: 'Releases', children: repo ? <ReleasesSection owner={repo.owner} repo={repo.name} onRateLimit={setRateLimit} /> : null },
                { key: 'actions', label: 'Actions', children: repo ? <ActionsSection owner={repo.owner} repo={repo.name} /> : null },
                { key: 'contributors', label: 'Contributors', children: repo ? <ContributorsSection owner={repo.owner} repo={repo.name} /> : null },
                { key: 'activity', label: '最近活动', children: repo ? <ActivitySection owner={repo.owner} repo={repo.name} /> : null },
                { key: 'readme', label: 'README', children: <ReadmeSection state={state} /> },
            ];

            return (
                <Drawer
                    className="gh-drawer"
                    title="项目详情"
                    placement="right"
                    width={isMobile ? '100%' : 720}
                    open={state.open}
                    onClose={onClose}
                    destroyOnClose
                    footer={
                        <Space style={{ display: 'flex', justifyContent: 'flex-end' }}>
                            <Button onClick={onClose}>关闭</Button>
                            <Button type="primary" icon={<UIIcon name="GithubOutlined" />}
                                disabled={!repo} onClick={() => repo && openGitHub(repo.html_url)}>打开 GitHub</Button>
                        </Space>
                    }>
                    <div className="gh-drawer-body">
                        {state.loading && <div style={{ padding: 20 }}><Skeleton active title paragraph={{ rows: 6 }} /></div>}
                        {!state.loading && state.error && (
                            <div style={{ padding: 20 }}>
                                <Alert type={state.error.code === 429 ? 'warning' : 'error'} showIcon
                                    message={state.error.code === 429 ? 'GitHub API 请求次数已达到限制' : '暂时无法获取项目详情'}
                                    description={<Typography.Text type="secondary">{state.error.code === 429 ? '请稍后重试，或查看缓存数据。' : '请稍后重试。'}</Typography.Text>}
                                    action={<Button size="small" onClick={onClose}>关闭</Button>} />
                            </div>
                        )}
                        {!state.loading && repo && (
                            <>
                                <div className="gh-detail-head">
                                    <div className="gh-detail-title">
                                        {repo.name}
                                        {repo.featured && <Tag color="blue" style={{ marginInlineEnd: 0 }}>Featured</Tag>}
                                        {heat && <HeatBadge score={heat.score} level={heat.level} />}
                                        {state.ci && <CIStatusBadge ci={state.ci} />}
                                    </div>
                                    <div className="gh-detail-desc">{repo.description || '暂无项目描述'}</div>

                                    {state.stale && <Alert type="info" showIcon style={{ marginTop: 10, padding: '3px 8px' }} message="数据来自缓存" />}
                                    {rateLimit && rateLimit.limited && (
                                        <Alert type="warning" showIcon style={{ marginTop: 10, padding: '3px 8px' }}
                                            message={'GitHub API 限制' + (rateLimit.remaining !== undefined ? ('（剩余 ' + rateLimit.remaining + ' 次请求' + (rateLimit.reset_in ? '，预计 ' + rateLimit.reset_in + ' 后重置' : '') + '）') : '')} />
                                    )}

                                    {/* Stats Grid：紧凑，不做 8 个大卡 */}
                                    {stats && (
                                        <div className="gh-stats-grid" style={{ marginTop: 12 }}>
                                            <StatItem icon="StarOutlined" label="Stars" value={statValue(stats.stars)} />
                                            <StatItem icon="ForkOutlined" label="Forks" value={statValue(stats.forks)} />
                                            <StatItem icon="IssueOutlined" label="Issues" value={statValue(stats.issues)} />
                                            <StatItem icon="PullRequestOutlined" label="PR" value={statValue(stats.pull_requests)} />
                                            <StatItem icon="CodeOutlined" label="Commits / 30d" value={statValue(stats.commits_30d)} />
                                            <StatItem icon="RocketOutlined" label="Releases" value={statValue(stats.releases)} />
                                            <StatItem icon="TeamOutlined" label="Contributors" value={statValue(stats.contributors)} />
                                            <StatItem icon="FireOutlined" label="Heat" value={heat ? heat.score : statValue(stats.heat_score)}
                                                sub={heat ? (HEAT_LABEL[heat.level] || '') : ''}
                                                tooltip={heat && heat.parts ? (
                                                    <div style={{ fontSize: 12 }}>
                                                        <div style={{ marginBottom: 4 }}>热度构成（近期行为权重更高）</div>
                                                        {heat.parts.map(p => (
                                                            <div key={p.key} style={{ display: 'flex', justifyContent: 'space-between', gap: 12 }}>
                                                                <span>{p.label}</span>
                                                                <span>{Math.round(p.score)} / 100 × {p.weight}</span>
                                                            </div>
                                                        ))}
                                                    </div>
                                                ) : null} />
                                        </div>
                                    )}
                                </div>

                                <div className="gh-drawer-tabs">
                                    <Tabs activeKey={tab} onChange={setTab} items={tabs.map(t => ({ key: t.key, label: t.label, children: t.children }))} />
                                </div>
                            </>
                        )}
                    </div>
                </Drawer>
            );
        }

        // ==================== 主应用 ====================
        function App() {
            const [auth, setAuth] = useState({ loading: true, ok: false, user: null });
            const [isDark, setIsDark] = useState(() => localStorage.getItem('theme') === 'dark');
            const isMobile = useIsMobile();

            const [profile, setProfile] = useState(null);
            const [repos, setRepos] = useState(null);
            const [flags, setFlags] = useState({ stale: false, rl: false });
            const [rateLimit, setRateLimit] = useState(null);
            const [reposError, setReposError] = useState(null);
            const [profileError, setProfileError] = useState(null);
            const [loading, setLoading] = useState(true);
            const [, setTick] = useState(0); // 相对时间随刷新更新

            const [q, setQ] = useState('');
            const [lang, setLang] = useState('全部');
            const [sortKey, setSortKey] = useState('pushed');

            const [detail, setDetail] = useState({ open: false, loading: false, error: null, repo: null, stats: null, heat: null, age: null, ci: null, stale: false, rl: false, readmeLoading: false, readmeError: false, readme: null });

            const hasPerm = (p) => auth.user && (auth.user.permissions || []).some(x => x === '*' || x === p);

            useEffect(() => {
                secureFetch(baseUrl + '/check-auth')
                    .then(r => r.json())
                    .then(d => {
                        if (d.code === 200) setAuth({ loading: false, ok: true, user: d.user });
                        else window.location.href = 'index.html';
                    })
                    .catch(() => { window.location.href = 'index.html'; });
            }, []);
            useEffect(() => {
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
                document.documentElement.classList.toggle('dark', isDark);
                document.body.classList.toggle('dark', isDark);
                document.body.style.background = isDark ? '#141414' : '#f5f5f5';
            }, [isDark]);

            const load = useCallback(() => {
                setLoading(true); setReposError(null); setProfileError(null); setRateLimit(null);
                const pf = ghGet(baseUrl + '/api/github/profile')
                    .then(d => { setProfile(d.profile); setFlags(f => ({ ...f, stale: f.stale || d.stale, rl: f.rl || d.rate_limited })); })
                    .catch(e => setProfileError(e));
                const rf = ghGet(baseUrl + '/api/github/repos')
                    .then(d => { setRepos(d.repos || []); setFlags(f => ({ ...f, stale: f.stale || d.stale, rl: f.rl || d.rate_limited })); })
                    .catch(e => setReposError(e));
                Promise.allSettled([pf, rf]).then(() => setLoading(false));
            }, []);
            useEffect(() => { if (auth.ok) load(); }, [auth.ok, load]);

            // 每分钟刷新相对时间
            useEffect(() => {
                const t = setInterval(() => setTick(x => x + 1), 60000);
                return () => clearInterval(t);
            }, []);

            const languages = useMemo(() => {
                if (!repos) return [];
                return [...new Set(repos.map(r => r.language).filter(Boolean))].sort((a, b) => a.localeCompare(b));
            }, [repos]);

            const totalStars = useMemo(() => (repos || []).reduce((s, r) => s + (r.stars || 0), 0), [repos]);

            const filtered = useMemo(() => {
                if (!repos) return [];
                const kw = q.trim().toLowerCase();
                let list = repos.filter(r => {
                    if (lang !== '全部' && r.language !== lang) return false;
                    if (kw && !(r.name || '').toLowerCase().includes(kw) && !(r.description || '').toLowerCase().includes(kw)) return false;
                    return true;
                });
                list = list.slice().sort((a, b) => {
                    if (sortKey === 'stars') return (b.stars || 0) - (a.stars || 0);
                    if (sortKey === 'forks') return (b.forks || 0) - (a.forks || 0);
                    if (sortKey === 'heat') return (b.heat_score || 0) - (a.heat_score || 0);
                    if (sortKey === 'name') return (a.name || '').localeCompare(b.name || '');
                    return (b.pushed_at || b.updated_at || '').localeCompare(a.pushed_at || a.updated_at || '');
                });
                return list;
            }, [repos, q, lang, sortKey]);

            const featuredList = useMemo(() => {
                if (!repos) return [];
                const active = q.trim() !== '' || lang !== '全部';
                if (active) return [];
                return repos.filter(r => r.featured);
            }, [repos, q, lang]);

            // Featured 区已展示的项目不再重复出现在 All Projects 列表中
            const gridList = useMemo(() => (
                featuredList.length ? filtered.filter(r => !r.featured) : filtered
            ), [filtered, featuredList]);

            // 打开详情：第一阶段拉聚合详情（repo + stats + heat + age + CI），第二阶段按需拉 README
            const openDetail = (repo) => {
                setDetail({ open: true, loading: true, error: null, repo: null, stats: null, heat: null, age: null, ci: null, stale: false, rl: false, readmeLoading: true, readmeError: false, readme: null });
                const base = baseUrl + '/api/github/repos/' + encodeURIComponent(repo.owner || '') + '/' + encodeURIComponent(repo.name || '');
                ghGet(base + '/detail')
                    .then(d => setDetail(s => ({
                        ...s, loading: false, repo: d.repo, stats: d.stats, heat: d.heat, age: d.age,
                        ci: d.ci, stale: d.stale || false, rl: d.rate_limited || false,
                    })))
                    .catch(e => setDetail(s => ({ ...s, loading: false, error: e })));
                ghGet(base + '/readme')
                    .then(d => setDetail(s => ({ ...s, readmeLoading: false, readme: d.readme, readmeError: false })))
                    .catch(() => setDetail(s => ({ ...s, readmeLoading: false, readmeError: true })));
            };

            if (auth.loading) {
                return <div style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', background: isDark ? '#141414' : '#f5f5f5' }}><Card loading style={{ width: 320 }} /></div>;
            }
            if (!hasPerm('github:view')) {
                return (
                    <ConfigProvider theme={{ algorithm: isDark ? darkAlgorithm : undefined, token: { colorBgLayout: isDark ? '#141414' : '#f5f5f5', colorBgContainer: isDark ? '#1f1f1f' : '#ffffff' } }}>
                        <GHTopbar isDark={isDark} setIsDark={setIsDark} />
                        <div style={{ display: 'flex', justifyContent: 'center', padding: 48 }}>
                            <Card style={{ width: 400, textAlign: 'center' }}>
                                <div style={{ fontSize: 40, marginBottom: 8 }}><UIIcon name="StopOutlined" /></div>
                                <Typography.Title level={4}>没有访问权限</Typography.Title>
                                <Typography.Text type="secondary">当前账号没有「查看 GitHub 项目」权限（github:view）。</Typography.Text>
                            </Card>
                        </div>
                    </ConfigProvider>
                );
            }

            const banner = flags.rl
                ? { type: 'warning', msg: flags.stale ? 'GitHub API 请求次数已达到限制，请稍后再试。当前展示的是缓存数据。' : 'GitHub API 请求次数已达到限制，请稍后再试。' }
                : (flags.stale ? { type: 'info', msg: '数据来自缓存' } : null);
            const failed = !!reposError && !repos;

            return (
                <ConfigProvider theme={{ algorithm: isDark ? darkAlgorithm : undefined, token: { colorBgLayout: isDark ? '#141414' : '#f5f5f5', colorBgContainer: isDark ? '#1f1f1f' : '#ffffff' } }}>
                    <GHTopbar isDark={isDark} setIsDark={setIsDark} />
                    <div className="sec-wrap">
                        <div className="page-head">
                            <div>
                                <div className="ph-title"><UIIcon name="GithubOutlined" />GitHub Projects</div>
                                <div className="ph-sub">展示 {profile ? (profile.name || profile.login) : 'GitHub 用户'} 的公开项目 · 数据由本服务代理并缓存</div>
                            </div>
                            <div className="ph-actions">
                                <Tooltip title="重新加载">
                                    <Button icon={<UIIcon name="ReloadOutlined" />} onClick={() => { setFlags({ stale: false, rl: false }); load(); setTick(x => x + 1); }} />
                                </Tooltip>
                            </div>
                        </div>

                        {/* 用户信息 */}
                        {loading && !profile ? (
                            <div className="gh-profile">
                                <Skeleton.Avatar active size={64} />
                                <div style={{ flex: 1 }}>
                                    <Skeleton active title={{ width: '30%' }} paragraph={{ rows: 1 }} />
                                </div>
                            </div>
                        ) : profile ? (
                            <div className="gh-profile">
                                <img className="gh-avatar" src={profile.avatar_url} alt={profile.login} referrerPolicy="no-referrer" />
                                <div className="gh-profile-info">
                                    <div className="gh-profile-name">{profile.name || profile.login}{profile.login && <Tag style={{ marginInlineEnd: 0 }}>{profile.login}</Tag>}</div>
                                    {profile.bio && <div className="gh-profile-bio">{profile.bio}</div>}
                                    {profile.html_url && (
                                        <a className="gh-profile-link" href={profile.html_url} target="_blank" rel="noopener noreferrer">
                                            <UIIcon name="LinkOutlined" />{profile.html_url.replace(/^https?:\/\//, '')}
                                        </a>
                                    )}
                                </div>
                                <div className="gh-stats">
                                    <div className="gh-stat"><div className="gh-stat-value">{profile.public_repos}</div><div className="gh-stat-label">Repositories</div></div>
                                    <div className="gh-stat"><div className="gh-stat-value">{repos ? totalStars : '—'}</div><div className="gh-stat-label">Stars</div></div>
                                    <div className="gh-stat"><div className="gh-stat-value">{profile.followers}</div><div className="gh-stat-label">Followers</div></div>
                                    <div className="gh-stat"><div className="gh-stat-value">{profile.following}</div><div className="gh-stat-label">Following</div></div>
                                </div>
                            </div>
                        ) : profileError ? (
                            <Alert type="warning" showIcon style={{ marginBottom: 16 }}
                                message="用户信息暂时无法获取"
                                action={<Button size="small" danger onClick={load}>重新加载</Button>} />
                        ) : null}

                        {/* 状态提示 */}
                        {banner && !loading && <Alert type={banner.type} showIcon style={{ marginBottom: 12 }} message={banner.msg} />}
                        {rateLimit && rateLimit.limited && (
                            <Alert type="warning" showIcon style={{ marginBottom: 12 }}
                                message={'GitHub API 限制' + (rateLimit.remaining !== undefined ? ('（剩余 ' + rateLimit.remaining + ' 次请求' + (rateLimit.reset_in ? '，预计 ' + rateLimit.reset_in + ' 后重置' : '') + '）') : '')} />
                        )}
                        {failed && (
                            <Alert type="error" showIcon style={{ marginBottom: 12 }} message="暂时无法获取 GitHub 项目"
                                description={<Typography.Text type="secondary">{reposError && reposError.code === 429 ? 'GitHub API 请求次数已达到限制，请稍后再试。' : '请检查网络后重试。'}</Typography.Text>}
                                action={<Button size="small" danger icon={<UIIcon name="ReloadOutlined" />} onClick={load}>重新加载</Button>} />
                        )}

                        {/* Featured Projects */}
                        {featuredList.length > 0 && (
                            <>
                                <div className="gh-section"><span className="gh-section-title">Featured Projects</span><span className="gh-section-count">重点项目</span></div>
                                <div className="gh-grid">
                                    {featuredList.map(r => <RepoCard key={'f-' + r.id} repo={r} onDetail={openDetail} />)}
                                </div>
                            </>
                        )}

                        {/* All Projects */}
                        <div className="gh-section">
                            <span className="gh-section-title">All Projects</span>
                            {repos && <span className="gh-section-count">共 {gridList.length} 个项目</span>}
                        </div>
                        <div className="gh-toolbar">
                            <Input className="gh-search" allowClear prefix={<UIIcon name="SearchOutlined" />} placeholder="搜索项目..."
                                value={q} onChange={e => setQ(e.target.value)} />
                            <Select className="gh-select" value={lang} onChange={setLang}
                                options={[{ value: '全部', label: '语言：全部' }].concat(languages.map(l => ({ value: l, label: '语言：' + l })))} />
                            <Select className="gh-select" value={sortKey} onChange={setSortKey}
                                options={[
                                    { value: 'pushed', label: '最近更新' },
                                    { value: 'stars', label: 'Star 最多' },
                                    { value: 'heat', label: '热度最高' },
                                    { value: 'forks', label: 'Fork 最多' },
                                    { value: 'name', label: '按名称' },
                                ]} />
                        </div>

                        {loading ? (
                            <div className="gh-grid">{[1, 2, 3, 4, 5, 6].map(i => <RepoCardSkeleton key={i} />)}</div>
                        ) : gridList.length === 0 ? (
                            <Empty description={repos && repos.length ? (filtered.length ? '项目均已在 Featured 区展示' : '没有匹配的项目') : '暂无公开项目'} style={{ padding: '32px 0' }} />
                        ) : (
                            <div className="gh-grid">
                                {gridList.map(r => <RepoCard key={r.id} repo={r} onDetail={openDetail} />)}
                            </div>
                        )}
                    </div>

                    <DetailDrawer state={detail} isDark={isDark} onClose={() => setDetail(s => ({ ...s, open: false }))} />
                </ConfigProvider>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
