<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex,nofollow">
    <title>GitHub 项目 - Server Status</title>
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%201024%201024%22%20fill%3D%22%231677ff%22%3E%3Cpath%20d%3D%22M704%20446H320c-4.4%200-8%203.6-8%208v402c0%204.4%203.6%208%208%208h384c4.4%200%208-3.6%208-8V454c0-4.4-3.6-8-8-8zm-328%2064h272v117H376V510zm272%20290H376V683h272v117z%22%2F%3E%3Cpath%20d%3D%22M424%20748a32%2032%200%201%200%2064%200%2032%2032%200%201%200-64%200zm0-178a32%2032%200%201%200%2064%200%2032%2032%200%201%200-64%200z%22%2F%3E%3Cpath%20d%3D%22M811.4%20368.9C765.6%20248%20648.9%20162%20512.2%20162S258.8%20247.9%20213%20368.8C126.9%20391.5%2063.5%20470.2%2064%20563.6%2064.6%20668%20145.6%20752.9%20247.6%20762c4.7.4%208.7-3.3%208.7-8v-60.4c0-4-3-7.4-7-7.9-27-3.4-52.5-15.2-72.1-34.5-24-23.5-37.2-55.1-24-88.6%200-28%209.1-54.4%2026.2-76.4%2016.7-21.4%2040.2-36.9%2066.1-43.7l37.9-10%2013.9-36.7c8.6-22.8%2020.6-36%2035.7-63.5s26.9-44.2%2041.1-28.9%2089.5-44.2%20140-44.2s98.9%2015.3%20140%2044.3c19.9%2014%2037.5%2030.8%2052.4%2050%2015.1%2019.3%2027.1%2040.7%2035.7%2063.5l13.8%2036.6%2037.8%2010c54.2%2014.4%2092.1%2063.7%2092.1%20120%200%2033.6-13.2%2065.1-37.2%2088.6-19.5%2019.2-44.9%2031.1-71.9%2034.5-4%20.5-6.9%203.9-6.9%207.9V754c0%204.7%204.1%208.4%208.8%208%20101.7-9.2%20182.5-94%20183.2-198.2.6-93.4-62.7-172.1-148.6-194.9z%22%2F%3E%3C%2Fsvg%3E">
    <link rel="stylesheet" href="/ui.css">
    <style>
        #root { min-height: 100vh; }
        .sec-topbar {
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 24px; height: 52px;
            background: var(--color-surface); border-bottom: 1px solid var(--color-border);
        }
        .tb-page { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: var(--color-text); white-space: nowrap; }
        .tb-page .anticon { color: var(--color-primary); }
        .tb-nav { display: flex; align-items: center; gap: 8px; margin-left: auto; min-width: 0; overflow-x: auto; scrollbar-width: none; }
        .tb-nav::-webkit-scrollbar { display: none; }
        .tb-actions { display: flex; align-items: center; gap: 8px; margin-left: 8px; flex: 0 0 auto; }
        .sec-wrap { padding: 16px 24px 64px; max-width: 1280px; margin: 0 auto; width: 100%; }

        /* ---- Profile 头部：单面板块，不做多层卡片 ---- */
        .gh-profile {
            display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
            background: var(--color-surface); border: 1px solid var(--color-border);
            border-radius: var(--radius-xl); padding: 18px 20px; margin-bottom: 16px;
        }
        .gh-avatar {
            width: 64px; height: 64px; border-radius: 50%; flex: 0 0 64px;
            border: 1px solid var(--color-border); object-fit: cover; background: var(--color-bg);
        }
        .gh-profile-info { min-width: 200px; flex: 1 1 220px; }
        .gh-profile-name { font-size: 18px; font-weight: 600; color: var(--color-text); line-height: 1.3; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .gh-profile-bio { font-size: 13px; color: var(--color-text-secondary); margin-top: 2px; }
        .gh-profile-link { font-size: 12.5px; margin-top: 4px; display: inline-flex; align-items: center; gap: 4px; }
        .gh-stats { display: flex; align-items: center; gap: 28px; flex-wrap: wrap; }
        .gh-stat .gh-stat-value { font-size: 20px; font-weight: 600; color: var(--color-text); font-variant-numeric: tabular-nums; line-height: 1.2; }
        .gh-stat .gh-stat-label { font-size: 12px; color: var(--color-text-tertiary); margin-top: 2px; }

        /* ---- 区块标题 ---- */
        .gh-section { margin: 18px 0 10px; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
        .gh-section .gh-section-title { font-size: 15px; font-weight: 600; color: var(--color-text); }
        .gh-section .gh-section-count { font-size: 12px; color: var(--color-text-tertiary); }

        /* ---- 工具栏 ---- */
        .gh-toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
        .gh-toolbar .gh-search { width: 240px; }
        .gh-toolbar .gh-select { min-width: 130px; }

        /* ---- 项目网格：桌面 3 列 / 平板 2 列 / 手机 1 列 ---- */
        .gh-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
        @media (max-width: 1199px) { .gh-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
        @media (max-width: 767px) { .gh-grid { grid-template-columns: 1fr; } }

        /* ---- 项目卡片 ---- */
        .gh-card {
            display: flex; flex-direction: column; gap: 8px; cursor: pointer;
            background: var(--color-surface); border: 1px solid var(--color-border);
            border-radius: var(--radius); padding: 14px 16px 12px;
            transition: transform .18s ease-out, border-color .18s ease-out, box-shadow .18s ease-out;
        }
        @media (hover: hover) {
            .gh-card:hover {
                transform: translateY(-2px);
                border-color: var(--color-primary);
                box-shadow: var(--shadow-overlay);
            }
            .gh-card:hover .gh-card-name { color: var(--color-primary); }
            .gh-card:hover .gh-card-glyph { color: var(--color-primary); }
        }
        .gh-card-head { display: flex; align-items: center; gap: 8px; }
        .gh-card-name { font-size: 15px; font-weight: 600; color: var(--color-text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; transition: color .18s ease-out; }
        .gh-card-glyph { margin-left: auto; color: var(--color-text-tertiary); font-size: 14px; transition: color .18s ease-out; flex: 0 0 auto; }
        .gh-card-desc {
            font-size: 13px; color: var(--color-text-secondary); line-height: 1.55; min-height: 20px;
            display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden;
        }
        .gh-card-meta { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--color-text-tertiary); }
        .gh-lang { display: inline-flex; align-items: center; gap: 5px; }
        .gh-lang-dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 8px; opacity: .85; }
        .gh-card-meta .gh-meta-item { display: inline-flex; align-items: center; gap: 4px; font-variant-numeric: tabular-nums; }
        .gh-card-foot { display: flex; align-items: center; gap: 8px; margin-top: auto; padding-top: 2px; }
        .gh-card-updated { font-size: 12px; color: var(--color-text-tertiary); }
        .gh-card-foot .ant-btn { margin-left: auto; }

        /* ---- 热度徽标（克制：只有小图标 + 数值 + 文案，不做大面积彩色） ---- */
        .gh-heat {
            display: inline-flex; align-items: center; gap: 4px; font-size: 12px;
            font-variant-numeric: tabular-nums; color: var(--color-text-secondary);
            border: 1px solid var(--color-border); border-radius: 999px;
            padding: 1px 8px; line-height: 18px; white-space: nowrap;
        }
        .gh-heat-dot { width: 6px; height: 6px; border-radius: 50%; flex: 0 0 6px; }
        .gh-heat-very_active { color: var(--color-text); }
        .gh-heat-very_active .gh-heat-dot { background: var(--color-error); }
        .gh-heat-active .gh-heat-dot { background: var(--color-warning); }
        .gh-heat-normal .gh-heat-dot { background: var(--color-primary); }
        .gh-heat-low .gh-heat-dot { background: var(--color-text-tertiary); }
        .gh-heat-dormant .gh-heat-dot { background: var(--color-border-strong); }
        .gh-heat-dormant { color: var(--color-text-tertiary); }

        /* ---- 卡片底部：创建时间 + 项目年龄（弱化，不喧宾夺主） ---- */
        .gh-card-created {
            display: flex; align-items: center; gap: 6px; font-size: 12px;
            color: var(--color-text-tertiary); font-variant-numeric: tabular-nums;
        }
        .gh-card-created .gh-sep { opacity: .5; }

        /* ---- CI 状态小徽标 ---- */
        .gh-ci { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--color-text-tertiary); }
        .gh-ci-passing { color: var(--color-success); }
        .gh-ci-failing { color: var(--color-error); }
        .gh-ci-running { color: var(--color-primary); }

        /* ---- Drawer 布局 ---- */
        .gh-drawer .ant-drawer-body { padding: 0; }
        .gh-drawer-body { padding: 0 0 24px; }
        .gh-drawer-tabs .ant-tabs-nav { padding: 0 20px; margin: 0; position: sticky; top: 0; z-index: 5; background: var(--color-surface); }
        .gh-drawer-tabs .ant-tabs-content-holder { padding: 16px 20px 8px; }
        .gh-detail-head { padding: 16px 20px 14px; border-bottom: 1px solid var(--color-border); }
        .gh-detail-title { font-size: 18px; font-weight: 600; color: var(--color-text); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .gh-detail-desc { font-size: 13px; color: var(--color-text-secondary); margin-top: 4px; line-height: 1.6; }

        /* ---- Stats Grid（紧凑，不做 8 个大卡） ---- */
        .gh-stats-grid {
            display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px;
            background: var(--color-border); border: 1px solid var(--color-border);
            border-radius: var(--radius); overflow: hidden;
        }
        .gh-stats-grid .gh-sg-item { background: var(--color-surface); padding: 10px 12px; }
        .gh-sg-item .gh-sg-label { font-size: 11.5px; color: var(--color-text-tertiary); display: flex; align-items: center; gap: 4px; }
        .gh-sg-item .gh-sg-value { font-size: 17px; font-weight: 600; color: var(--color-text); font-variant-numeric: tabular-nums; margin-top: 3px; line-height: 1.25; }
        .gh-sg-item .gh-sg-sub { font-size: 11.5px; color: var(--color-text-tertiary); margin-top: 1px; }
        @media (max-width: 640px) { .gh-stats-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

        /* ---- 增长率 / 窗口切换 ---- */
        .gh-window-seg { margin-bottom: 10px; }
        .gh-growth-row { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; margin-bottom: 10px; }
        .gh-growth-row .gh-growth-item { font-variant-numeric: tabular-nums; }
        .gh-growth-row .gh-growth-label { font-size: 11.5px; color: var(--color-text-tertiary); }
        .gh-growth-row .gh-growth-value { font-size: 15px; font-weight: 600; color: var(--color-text); }
        .gh-growth-row .gh-growth-value.gh-up { color: var(--color-success); }
        .gh-growth-row .gh-growth-value.gh-flat { color: var(--color-text-tertiary); }
        .gh-rate-chip { font-size: 12px; color: var(--color-text-secondary); border: 1px solid var(--color-border); border-radius: 999px; padding: 1px 8px; font-variant-numeric: tabular-nums; }

        /* ---- 图表容器：移动端降高 ---- */
        .gh-chart { width: 100%; height: 200px; }
        .gh-chart-sm { width: 100%; height: 160px; }
        @media (max-width: 767px) { .gh-chart { height: 160px; } .gh-chart-sm { height: 130px; } }

        /* ---- 语言分布条形 ---- */
        .gh-langbar-item { margin-bottom: 8px; }
        .gh-langbar-head { display: flex; align-items: center; justify-content: space-between; font-size: 12.5px; color: var(--color-text-secondary); margin-bottom: 4px; }
        .gh-langbar-name { display: inline-flex; align-items: center; gap: 6px; color: var(--color-text); }
        .gh-langbar-track { height: 7px; border-radius: 999px; background: var(--hover); overflow: hidden; }
        .gh-langbar-fill { height: 100%; border-radius: 999px; transition: width .3s ease-out; }

        /* ---- 热力图 ---- */
        .gh-heatmap { display: flex; flex-direction: column; gap: 3px; overflow-x: auto; padding-bottom: 2px; }
        .gh-heatmap-row { display: flex; align-items: center; gap: 3px; }
        .gh-heatmap-label { width: 34px; flex: 0 0 34px; font-size: 11px; color: var(--color-text-tertiary); }
        .gh-heatmap-cell { width: 12px; height: 12px; border-radius: 2px; background: var(--hover); flex: 0 0 12px; }
        .gh-heatmap-cell.lv1 { background: rgba(22, 119, 255, .25); }
        .gh-heatmap-cell.lv2 { background: rgba(22, 119, 255, .5); }
        .gh-heatmap-cell.lv3 { background: rgba(22, 119, 255, .75); }
        .gh-heatmap-cell.lv4 { background: rgba(22, 119, 255, 1); }
        .gh-heatmap-foot { display: flex; align-items: center; gap: 6px; justify-content: flex-end; margin-top: 6px; font-size: 11px; color: var(--color-text-tertiary); }

        /* ---- Release / Actions / Contributors / Activity 列表 ---- */
        .gh-list { border: 1px solid var(--color-border); border-radius: var(--radius); overflow: hidden; }
        .gh-list-item {
            display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px;
            border-bottom: 1px solid var(--color-border); background: var(--color-surface);
        }
        .gh-list-item:last-child { border-bottom: none; }
        .gh-list-item.gh-clickable { cursor: pointer; }
        .gh-list-item.gh-clickable:hover { background: var(--hover); }
        .gh-list-main { min-width: 0; flex: 1 1 auto; }
        .gh-list-title { font-size: 13px; color: var(--color-text); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .gh-list-sub { font-size: 12px; color: var(--color-text-tertiary); margin-top: 2px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .gh-list-right { flex: 0 0 auto; font-size: 12px; color: var(--color-text-tertiary); text-align: right; font-variant-numeric: tabular-nums; }

        /* ---- 贡献者占比条 ---- */
        .gh-contrib-row { display: flex; align-items: center; gap: 10px; padding: 7px 0; }
        .gh-contrib-avatar { width: 24px; height: 24px; border-radius: 50%; flex: 0 0 24px; border: 1px solid var(--color-border); background: var(--color-bg); object-fit: cover; }
        .gh-contrib-name { font-size: 12.5px; color: var(--color-text); width: 96px; flex: 0 0 96px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .gh-contrib-track { flex: 1 1 auto; height: 6px; border-radius: 999px; background: var(--hover); overflow: hidden; min-width: 40px; }
        .gh-contrib-fill { height: 100%; background: var(--color-primary); border-radius: 999px; opacity: .8; }
        .gh-contrib-pct { font-size: 12px; color: var(--color-text-tertiary); width: 48px; flex: 0 0 48px; text-align: right; font-variant-numeric: tabular-nums; }

        /* ---- 活动 Timeline ---- */
        .gh-timeline { position: relative; padding-left: 18px; }
        .gh-timeline::before { content: ''; position: absolute; left: 5px; top: 4px; bottom: 4px; width: 1px; background: var(--color-border); }
        .gh-tl-item { position: relative; padding: 0 0 14px 0; }
        .gh-tl-item:last-child { padding-bottom: 0; }
        .gh-tl-dot {
            position: absolute; left: -18px; top: 4px; width: 11px; height: 11px; border-radius: 50%;
            border: 2px solid var(--color-surface); background: var(--color-text-tertiary);
        }
        .gh-tl-commit { background: var(--color-primary); }
        .gh-tl-release { background: var(--color-success); }
        .gh-tl-issue { background: var(--color-warning); }
        .gh-tl-pull_request { background: #722ed1; }
        .gh-tl-workflow { background: var(--color-text-tertiary); }
        .gh-tl-head { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .gh-tl-type { font-size: 11.5px; color: var(--color-text-tertiary); }
        .gh-tl-time { font-size: 11.5px; color: var(--color-text-tertiary); margin-left: auto; white-space: nowrap; }
        .gh-tl-title { font-size: 13px; color: var(--color-text); margin-top: 2px; overflow-wrap: break-word; }
        .gh-tl-sub { font-size: 12px; color: var(--color-text-tertiary); margin-top: 1px; }

        /* ---- README ---- */
        .gh-readme {
            border: 1px solid var(--color-border); border-radius: var(--radius);
            padding: 12px 14px; background: var(--color-bg); font-size: 13px;
            color: var(--color-text-secondary); line-height: 1.7; overflow-wrap: break-word;
        }
        .gh-readme h1, .gh-readme h2, .gh-readme h3, .gh-readme h4 {
            color: var(--color-text); font-weight: 600; margin: 14px 0 8px; line-height: 1.35;
        }
        .gh-readme h1:first-child, .gh-readme h2:first-child, .gh-readme h3:first-child { margin-top: 0; }
        .gh-readme h1 { font-size: 18px; } .gh-readme h2 { font-size: 16px; }
        .gh-readme h3 { font-size: 14.5px; } .gh-readme h4 { font-size: 13.5px; }
        .gh-readme p { margin: 6px 0; }
        .gh-readme a { color: var(--color-primary); text-decoration: none; }
        .gh-readme a:hover { color: var(--color-primary-hover); text-decoration: underline; }
        .gh-readme code {
            font-family: "JetBrains Mono", Consolas, "Courier New", monospace; font-size: 12px;
            background: var(--hover); border: 1px solid var(--color-border);
            border-radius: 4px; padding: 1px 5px; color: var(--color-text);
        }
        .gh-readme pre { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-sm); padding: 10px 12px; overflow-x: auto; }
        .gh-readme pre code { background: none; border: none; padding: 0; }
        .gh-readme blockquote { margin: 8px 0; padding: 2px 12px; border-left: 3px solid var(--color-border-strong); color: var(--color-text-tertiary); }
        .gh-readme ul, .gh-readme ol { margin: 6px 0; padding-left: 22px; }
        .gh-readme img { max-width: 100%; height: auto; border-radius: var(--radius-sm); }
        .gh-readme table { border-collapse: collapse; margin: 8px 0; width: 100%; font-size: 12.5px; display: block; overflow-x: auto; }
        .gh-readme th, .gh-readme td { border: 1px solid var(--color-border); padding: 4px 10px; text-align: left; }
        .gh-readme th { background: var(--hover); color: var(--color-text); }
        .gh-readme hr { border: none; border-top: 1px solid var(--color-border); margin: 12px 0; }
        .gh-readme .gh-img-fail {
            display: inline-block; font-size: 12px; color: var(--color-text-tertiary);
            border: 1px dashed var(--color-border-strong); border-radius: var(--radius-sm);
            padding: 6px 10px; background: var(--color-surface);
        }
        .gh-readme-more { margin-top: 6px; }
        .gh-mono { font-family: "JetBrains Mono", Consolas, "Courier New", monospace; font-size: 12px; }

        /* ---- Release Notes / 说明块 ---- */
        .gh-notes {
            font-size: 12.5px; color: var(--color-text-secondary); line-height: 1.65;
            border: 1px solid var(--color-border); border-radius: var(--radius);
            padding: 10px 12px; background: var(--color-bg); white-space: pre-wrap;
            overflow-wrap: break-word; max-height: 260px; overflow-y: auto;
        }

        /* ---- Actions 表格允许横向滚动 ---- */
        .gh-table-wrap { overflow-x: auto; }
        .gh-table { width: 100%; border-collapse: collapse; font-size: 12.5px; min-width: 520px; }
        .gh-table th, .gh-table td { padding: 7px 10px; border-bottom: 1px solid var(--color-border); text-align: left; white-space: nowrap; }
        .gh-table th { color: var(--color-text-tertiary); font-weight: 500; background: var(--hover); }
        .gh-table td { color: var(--color-text-secondary); }

        /* ---- Overview 描述列表紧凑化 ---- */
        .gh-kv { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 20px; }
        .gh-kv .gh-kv-item { min-width: 0; }
        .gh-kv-label { font-size: 11.5px; color: var(--color-text-tertiary); }
        .gh-kv-value { font-size: 13px; color: var(--color-text); margin-top: 2px; overflow-wrap: break-word; font-variant-numeric: tabular-nums; }
        @media (max-width: 640px) { .gh-kv { grid-template-columns: 1fr; } }

        @media (max-width: 768px) {
            .sec-wrap { padding: 12px 12px calc(12px + env(safe-area-inset-bottom)); }
            .sec-topbar { padding: 0 12px; }
            .sec-topbar .tb-text { display: none; }
            .gh-profile { padding: 14px; gap: 12px; }
            .gh-avatar { width: 52px; height: 52px; flex-basis: 52px; }
            .gh-stats { gap: 18px; width: 100%; }
            .gh-card-desc { -webkit-line-clamp: 2; }
            .gh-toolbar .gh-search { width: 100%; }
            .gh-toolbar .gh-select { flex: 1 1 40%; min-width: 0; }
            .gh-drawer-tabs .ant-tabs-nav { padding: 0 12px; }
            .gh-drawer-tabs .ant-tabs-content-holder { padding: 12px 12px 8px; }
            .gh-detail-head { padding: 14px 12px 12px; }
            .gh-contrib-name { width: 72px; flex-basis: 72px; }
            .gh-notes { max-height: 200px; }
        }
    </style>
    <script>
        (function () {
            try {
                var dark = localStorage.getItem('theme') === 'dark';
                document.documentElement.classList.toggle('dark', dark);
            } catch (e) { }
        })();
    </script>
</head>

<body>
    <div id="root"></div>
    <script crossorigin src="https://registry.npmmirror.com/react/18.3.1/files/umd/react.production.min.js"></script>
    <script crossorigin src="https://registry.npmmirror.com/react-dom/18.3.1/files/umd/react-dom.production.min.js"></script>
    <script src="https://registry.npmmirror.com/dayjs/1.11.13/files/dayjs.min.js"></script>
    <script src="https://registry.npmmirror.com/antd/5.21.6/files/dist/antd.min.js"></script>
    <script src="https://registry.npmmirror.com/@ant-design/icons/5.4.0/files/dist/index.umd.js"></script>
    <script src="https://registry.npmmirror.com/echarts/5.5.1/files/dist/echarts.min.js"></script>
    <script src="https://registry.npmmirror.com/@babel/standalone/7.24.7/files/babel.min.js"></script>
    <script type="text/babel">
        const { Card, Tag, Tooltip, Space, ConfigProvider, theme, Drawer, Skeleton, Empty, Alert,
            Select, Input, Typography, Segmented, Button, Progress, Tabs, Popover, Avatar } = window.antd;
        const { useState, useEffect, useCallback, useMemo, useRef } = React;
        const { darkAlgorithm } = theme;
        const IconSet = window.icons || {};
        const UIIcon = ({ name, ...props }) => { const C = IconSet[name]; return C ? <C {...props} /> : null; };

        const baseUrl = window.location.origin;
        function getCsrfToken() { const m = document.cookie.match(/(?:^|; )csrf_token=([^;]*)/); return m ? decodeURIComponent(m[1]) : ''; }
        function secureFetch(url, options = {}) {
            const method = options.method || 'GET';
            const headers = { 'Content-Type': 'application/json', ...(options.headers || {}) };
            if (/^(POST|PUT|PATCH|DELETE)$/i.test(method)) { const tok = getCsrfToken(); if (tok) headers['X-CSRF-Token'] = tok; }
            return fetch(url, { method, headers, credentials: 'include', body: options.body });
        }
        // GitHub API 响应携带状态标记（stale / rate_limited），需要连同 code 一起上抛
        async function ghGet(url) {
            const r = await secureFetch(url);
            let d = null;
            try { d = await r.json(); } catch (e) { }
            if (d && d.code === 200) return d.data;
            const err = new Error((d && d.message) || ('HTTP ' + r.status));
            err.code = d ? d.code : r.status;
            throw err;
        }
        function useIsMobile() {
            const [m, setM] = useState(window.innerWidth <= 768);
            useEffect(() => {
                const on = () => setM(window.innerWidth <= 768);
                window.addEventListener('resize', on);
                return () => window.removeEventListener('resize', on);
            }, []);
            return m;
        }

        // ==================== 展示工具 ====================
        const LANG_COLORS = {
            'Go': '#00ADD8', 'JavaScript': '#f1e05a', 'TypeScript': '#3178c6', 'Vue': '#41b883',
            'HTML': '#e34c26', 'CSS': '#563d7c', 'SCSS': '#c6538c', 'Python': '#3572A5',
            'Java': '#b07219', 'C': '#555555', 'C++': '#f34b7d', 'C#': '#178600',
            'Rust': '#dea584', 'Shell': '#89e051', 'PHP': '#4F5D95', 'Ruby': '#701516',
            'Swift': '#F05138', 'Kotlin': '#A97BFF', 'Dart': '#00B4AB', 'Lua': '#000080',
            'Dockerfile': '#384d54', 'Makefile': '#427819', 'Jupyter Notebook': '#DA5B0B', 'PowerShell': '#012456'
        };
        const HEAT_LABEL = { very_active: '非常活跃', active: '活跃', normal: '正常', low: '较低', dormant: '沉寂' };
        function langColor(lang) { return LANG_COLORS[lang] || 'var(--color-text-tertiary)'; }
        function LangDot({ lang }) {
            if (!lang) return null;
            return (
                <span className="gh-lang">
                    <span className="gh-lang-dot" style={{ background: langColor(lang) }} />
                    {lang}
                </span>
            );
        }
        function relTime(iso) {
            if (!iso) return '—';
            const t = dayjs(iso);
            if (!t.isValid()) return '—';
            const diff = dayjs().diff(t, 'second');
            if (diff < 60) return '刚刚';
            if (diff < 3600) return Math.floor(diff / 60) + '分钟前';
            if (diff < 86400) return Math.floor(diff / 3600) + '小时前';
            if (diff < 86400 * 30) return Math.floor(diff / 86400) + '天前';
            if (diff < 86400 * 365) return Math.floor(diff / (86400 * 30)) + '个月前';
            return t.format('YYYY-MM-DD');
        }
        // 时长（毫秒 -> 2m 31s / 45s）
        function fmtDuration(ms) {
            if (!ms || ms <= 0) return '—';
            const s = Math.round(ms / 1000);
            if (s < 60) return s + 's';
            const m = Math.floor(s / 60), rs = s % 60;
            if (m < 60) return m + 'm ' + rs + 's';
            return Math.floor(m / 60) + 'h ' + (m % 60) + 'm';
        }
        function fmtBytes(b) {
            if (!b || b <= 0) return '0 B';
            const u = ['B', 'KB', 'MB', 'GB'];
            let i = 0, v = b;
            while (v >= 1024 && i < u.length - 1) { v /= 1024; i++; }
            return (i === 0 ? v : v.toFixed(1)) + ' ' + u[i];
        }
        function fmtDate(iso) { return iso ? dayjs(iso).format('YYYY-MM-DD') : '—'; }
        function openGitHub(url) { if (url) window.open(url, '_blank', 'noopener,noreferrer'); }
        // 统计值：后端用 -1 表示「取不到」，显示 — 而不是误导性的 0
        function statValue(v) { return (v === null || v === undefined || v < 0) ? '—' : v; }

        // ==================== 安全 Markdown 渲染 ====================
        // 先整体 HTML 转义，再做有限的 Markdown 变换；代码块/行内代码内容永不参与变换；
        // 链接仅放行 http/https/mailto/#，图片仅放行 http(s) 并强制 lazy + no-referrer。
        function escapeHtml(s) {
            return String(s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }
        function mdInline(s) {
            s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, (m, alt, src) => {
                if (!/^https?:\/\//i.test(src)) return alt || '';
                return '<img src="' + src + '" alt="' + alt + '" loading="lazy" referrerpolicy="no-referrer" onerror="this.replaceWith(Object.assign(document.createElement(\'span\'),{className:\'gh-img-fail\',textContent:\'图片加载失败\'}))" />';
            });
            s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, label, href) => {
                if (!/^(https?:|mailto:|#)/i.test(href)) return label;
                return '<a href="' + href + '" target="_blank" rel="noopener noreferrer">' + label + '</a>';
            });
            s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
            s = s.replace(/\*([^*\n]+)\*/g, '<em>$1</em>');
            return s;
        }
        function renderMarkdown(src) {
            src = String(src || '').replace(/\r\n/g, '\n').replace(/^\uFEFF/, '');
            const blocks = [];
            src = src.replace(/```[^\n]*\n?([\s\S]*?)(?:```|$)/g, (_, code) => {
                blocks.push(code.replace(/\n+$/, ''));
                return '\u0000B' + (blocks.length - 1) + '\u0000';
            });
            let text = escapeHtml(src);
            const codes = [];
            text = text.replace(/`([^`\n]+)`/g, (_, c) => {
                codes.push(c);
                return '\u0000C' + (codes.length - 1) + '\u0000';
            });

            const lines = text.split('\n');
            let html = '', para = [], list = null, quote = false;
            const closePara = () => { if (para.length) { html += '<p>' + para.join('<br/>') + '</p>'; para = []; } };
            const closeList = () => { if (list) { html += list === 'ul' ? '</ul>' : '</ol>'; list = null; } };
            const closeQuote = () => { if (quote) { html += '</blockquote>'; quote = false; } };
            const closeAll = () => { closePara(); closeList(); closeQuote(); };
            const emitCodeBlock = (idx) => { closeAll(); html += '<pre><code>' + escapeHtml(blocks[idx] || '') + '</code></pre>'; };
            const splitRow = (row) => row.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(c => c.trim());

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i];
                const bm = line.match(/^\u0000B(\d+)\u0000\s*$/);
                if (bm) { emitCodeBlock(Number(bm[1])); continue; }
                if (line.trim() === '') { closePara(); closeList(); closeQuote(); continue; }
                const hm = line.match(/^(#{1,4})\s+(.*)$/);
                if (hm) { closeAll(); html += '<h' + hm[1].length + '>' + mdInline(hm[2]) + '</h' + hm[1].length + '>'; continue; }
                if (/^\s{0,3}((-\s*){3,}|(\*\s*){3,}|(_\s*){3,})$/.test(line)) { closeAll(); html += '<hr/>'; continue; }
                const qm = line.match(/^&gt;\s?(.*)$/);
                if (qm) { closePara(); closeList(); if (!quote) { html += '<blockquote>'; quote = true; } html += '<p>' + mdInline(qm[1]) + '</p>'; continue; }
                closeQuote();
                if (line.indexOf('|') >= 0 && /^\s*\|?[\s:|-]*-[\s:|-]*$/.test(lines[i + 1] || '') && (lines[i + 1] || '').indexOf('-') >= 0) {
                    closeAll();
                    const header = splitRow(line);
                    i += 2;
                    const rows = [];
                    while (i < lines.length && lines[i].trim() !== '' && lines[i].indexOf('|') >= 0) { rows.push(splitRow(lines[i])); i++; }
                    i--;
                    html += '<table><thead><tr>' + header.map(c => '<th>' + mdInline(c) + '</th>').join('') + '</tr></thead><tbody>'
                        + rows.map(r => '<tr>' + header.map((_, k) => '<td>' + mdInline(r[k] || '') + '</td>').join('') + '</tr>').join('')
                        + '</tbody></table>';
                    continue;
                }
                const um = line.match(/^\s*[-*]\s+(.*)$/);
                if (um) { closePara(); if (list !== 'ul') { closeList(); html += '<ul>'; list = 'ul'; } html += '<li>' + mdInline(um[1]) + '</li>'; continue; }
                const om = line.match(/^\s*\d+\.\s+(.*)$/);
                if (om) { closePara(); if (list !== 'ol') { closeList(); html += '<ol>'; list = 'ol'; } html += '<li>' + mdInline(om[1]) + '</li>'; continue; }
                closeList();
                para.push(mdInline(line.trim()));
            }
            closeAll();
            html = html
                .replace(/\u0000B(\d+)\u0000/g, (_, idx) => '<pre><code>' + escapeHtml(blocks[Number(idx)] || '') + '</code></pre>')
                .replace(/\u0000C(\d+)\u0000/g, (_, idx) => '<code>' + (codes[Number(idx)] || '') + '</code>');
            return html;
        }
        function githubTruncate(s, n) { return String(s || '').slice(0, n) + '…'; }

        // ==================== ECharts 封装（项目既有图表库，不引入第二套） ====================
        function useChart(option, deps) {
            const ref = useRef(null);
            const inst = useRef(null);
            useEffect(() => {
                if (!ref.current) return;
                inst.current = echarts.init(ref.current, null, { renderer: 'canvas' });
                const onResize = () => inst.current && inst.current.resize();
                window.addEventListener('resize', onResize);
                return () => { window.removeEventListener('resize', onResize); if (inst.current) { inst.current.dispose(); inst.current = null; } };
            }, []);
            useEffect(() => {
                if (inst.current && option) { inst.current.setOption(option, true); }
            }, [JSON.stringify(option || null), ...(deps || [])]);
            return ref;
        }
        function chartTheme() {
            const cs = getComputedStyle(document.body);
            return {
                text: cs.getPropertyValue('--color-text').trim() || '#000',
                tertiary: cs.getPropertyValue('--color-text-tertiary').trim() || '#999',
                border: cs.getPropertyValue('--color-border').trim() || '#eee',
                primary: cs.getPropertyValue('--color-primary').trim() || '#1677ff',
                success: cs.getPropertyValue('--color-success').trim() || '#52c41a',
            };
        }
        function StarTrendChart({ points, isDark, heightClass }) {
            const opt = useMemo(() => {
                const t = chartTheme();
                return {
                    grid: { left: 8, right: 14, top: 16, bottom: 4, containLabel: true },
                    tooltip: { trigger: 'axis', valueFormatter: v => v + ' ⭐' },
                    xAxis: {
                        type: 'category', boundaryGap: false,
                        data: (points || []).map(p => p.date.slice(5)),
                        axisLine: { lineStyle: { color: t.border } },
                        axisLabel: { color: t.tertiary, fontSize: 11, hideOverlap: true },
                        axisTick: { show: false },
                    },
                    yAxis: {
                        type: 'value', scale: true,
                        splitLine: { lineStyle: { color: t.border } },
                        axisLabel: { color: t.tertiary, fontSize: 11 },
                    },
                    series: [{
                        type: 'line', smooth: true, symbol: 'none',
                        data: (points || []).map(p => p.stars),
                        lineStyle: { color: t.primary, width: 2 },
                        areaStyle: {
                            color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                                { offset: 0, color: (isDark ? 'rgba(22,119,255,.28)' : 'rgba(22,119,255,.20)') },
                                { offset: 1, color: 'rgba(22,119,255,0)' },
                            ]),
                        },
                    }],
                };
            }, [points, isDark]);
            const ref = useChart(opt, [points, isDark]);
            return <div className={'gh-chart ' + (heightClass || '')} ref={ref} />;
        }
        function CommitBarChart({ daily, isDark }) {
            const opt = useMemo(() => {
                const t = chartTheme();
                return {
                    grid: { left: 8, right: 14, top: 16, bottom: 4, containLabel: true },
                    tooltip: { trigger: 'axis', valueFormatter: v => v + ' commits' },
                    xAxis: {
                        type: 'category', data: (daily || []).map(d => d.date.slice(5)),
                        axisLine: { lineStyle: { color: t.border } },
                        axisLabel: { color: t.tertiary, fontSize: 11, hideOverlap: true, interval: 'auto' },
                        axisTick: { show: false },
                    },
                    yAxis: {
                        type: 'value', minInterval: 1,
                        splitLine: { lineStyle: { color: t.border } },
                        axisLabel: { color: t.tertiary, fontSize: 11 },
                    },
                    series: [{
                        type: 'bar', data: (daily || []).map(d => d.commits),
                        itemStyle: { color: t.primary, borderRadius: [2, 2, 0, 0], opacity: .85 },
                        barMaxWidth: 14,
                    }],
                };
            }, [daily, isDark]);
            const ref = useChart(opt, [daily, isDark]);
            return <div className="gh-chart" ref={ref} />;
        }

        // ==================== 顶栏 ====================
        function GHTopbar({ isDark, setIsDark }) {
            return (
                <div className="sec-topbar">
                    <span className="tb-page"><UIIcon name="GithubOutlined" />GitHub 项目</span>
                    <div className="tb-nav">
                        <Button icon={<UIIcon name="DashboardOutlined" />} onClick={() => window.location.href = 'index.html'}><span className="tb-text">首页</span></Button>
                    </div>
                    <div className="tb-actions">
                        <Tooltip title={isDark ? '浅色模式' : '深色模式'}>
                            <Button onClick={() => setIsDark(!isDark)} icon={<UIIcon name={isDark ? 'SunOutlined' : 'MoonOutlined'} />} />
                        </Tooltip>
                        <Button danger icon={<UIIcon name="LogoutOutlined" />} onClick={async () => {
                            try { await secureFetch(baseUrl + '/logout', { method: 'POST', body: '{}' }); } catch (e) { }
                            window.location.href = 'index.html';
                        }}><span className="tb-text">退出</span></Button>
                    </div>
                </div>
            );
        }

        // ==================== 复用小组件 ====================
        // 热度徽标：只用小图标 + 数值 + 文案，不做大面积彩色
        function HeatBadge({ score, level, size }) {
            if (score === null || score === undefined) return null;
            const lv = level || 'normal';
            return (
                <span className={'gh-heat gh-heat-' + lv} style={size === 'sm' ? { fontSize: 11.5, padding: '0 6px' } : undefined}>
                    <span className="gh-heat-dot" />
                    {score}
                    {HEAT_LABEL[lv] && <span style={{ opacity: .75 }}>{HEAT_LABEL[lv]}</span>}
                </span>
            );
        }
        function CIStatusBadge({ ci }) {
            if (!ci || !ci.available) return null;
            const cls = ci.status === 'passing' ? 'gh-ci-passing' : (ci.status === 'failing' ? 'gh-ci-failing' : (ci.status === 'running' ? 'gh-ci-running' : ''));
            const icon = ci.status === 'passing' ? 'CheckCircleOutlined' : (ci.status === 'failing' ? 'CloseCircleOutlined' : (ci.status === 'running' ? 'SyncOutlined' : 'ExclamationCircleOutlined'));
            return <span className={'gh-ci ' + cls}><UIIcon name={icon} />{ci.label}</span>;
        }
        function StatItem({ icon, label, value, sub, tooltip }) {
            const content = (
                <div className="gh-sg-item">
                    <div className="gh-sg-label">{icon && <UIIcon name={icon} />}{label}</div>
                    <div className="gh-sg-value">{value}</div>
                    {sub && <div className="gh-sg-sub">{sub}</div>}
                </div>
            );
            return tooltip ? <Tooltip title={tooltip}>{content}</Tooltip> : content;
        }

        // ==================== 项目卡片 ====================
        function RepoCard({ repo, onDetail }) {
            return (
                <div className="gh-card" onClick={() => onDetail(repo)}
                    role="button" tabIndex={0}
                    onKeyDown={e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onDetail(repo); } }}>
                    <div className="gh-card-head">
                        <span className="gh-card-name">{repo.name}</span>
                        {repo.featured && <Tag color="blue" style={{ marginInlineEnd: 0 }}>Featured</Tag>}
                        <span className="gh-card-glyph"><UIIcon name="GithubOutlined" /></span>
                    </div>
                    <div className="gh-card-desc">{repo.description || '暂无项目描述'}</div>
                    <div className="gh-card-meta">
                        {repo.language && <LangDot lang={repo.language} />}
                        <span className="gh-meta-item" title="Stars"><UIIcon name="StarOutlined" />{repo.stars}</span>
                        <span className="gh-meta-item" title="Forks"><UIIcon name="ForkOutlined" />{repo.forks}</span>
                        <span className="gh-meta-item" title="Issues"><UIIcon name="IssueOutlined" />{repo.issues}</span>
                        {repo.heat_score > 0 && (
                            <Tooltip title={'热度 ' + repo.heat_score + ' · ' + (HEAT_LABEL[repo.heat_level] || '')}>
                                <span>🔥 {repo.heat_score}</span>
                            </Tooltip>
                        )}
                    </div>
                    <div className="gh-card-created">
                        <span>创建 {fmtDate(repo.created_at)}</span>
                        {repo.age_label && <><span className="gh-sep">·</span><span>项目年龄 {repo.age_label}</span></>}
                    </div>
                    <div className="gh-card-foot">
                        <span className="gh-card-updated">更新 {relTime(repo.pushed_at || repo.updated_at)}</span>
                        <Button size="small" onClick={e => { e.stopPropagation(); onDetail(repo); }}>查看详情</Button>
                    </div>
                </div>
            );
        }

        function RepoCardSkeleton() {
            return (
                <div className="gh-card" style={{ cursor: 'default' }}>
                    <Skeleton active title={{ width: '45%' }} paragraph={{ rows: 2 }} />
                    <div style={{ height: 18 }} />
                </div>
            );
        }

        // ==================== 图表 / 统计分区 ====================
        const STAR_WINDOWS = [
            { label: '7D', value: 7 }, { label: '30D', value: 30 },
            { label: '90D', value: 90 }, { label: '1Y', value: 365 }, { label: 'ALL', value: 0 },
        ];
        function GrowthValue({ v, suffix }) {
            if (!v) return <span className="gh-growth-value gh-flat">+0</span>;
            return <span className="gh-growth-value gh-up">+{v}{suffix || ''}</span>;
        }
        function StarTrendSection({ owner, repo, isDark, onRateLimit }) {
            const [window, setWindow] = useState(30);
            const [data, setData] = useState(null);
            const [err, setErr] = useState(null);
            useEffect(() => {
                let cancelled = false;
                setData(null); setErr(null);
                ghGet(baseUrl + '/api/github/repos/' + encodeURIComponent(owner) + '/' + encodeURIComponent(repo) + '/stars?window=' + window)
                    .then(d => { if (!cancelled) { setData(d); if (onRateLimit && d.rate_limit) onRateLimit(d.rate_limit); } })
                    .catch(e => { if (!cancelled) setErr(e); });
                return () => { cancelled = true; };
            }, [owner, repo, window]);

            if (err) {
                return (
                    <Alert type={err.code === 429 ? 'warning' : 'error'} showIcon
                        message={err.code === 429 ? 'GitHub API 请求次数已达到限制' : 'Star 趋势暂时无法获取'}
                        action={<Button size="small" onClick={() => setWindow(w => w)}>重新加载</Button>} />
                );
            }
            if (!data) return <Skeleton active title={false} paragraph={{ rows: 4 }} />;

            const g = data.growth || {};
            if (!g.has_history) {
                return (
                    <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
                        <Alert type="info" showIcon
                            message="正在建立 Star 历史数据"
                            description={'当前 Star：' + (data.current || 0) + '。GitHub 不提供历史 Star 曲线，本服务每天自动记录一次快照，明日起即可看到趋势。'} />
                    </div>
                );
            }
            return (
                <div>
                    <div className="gh-growth-row">
                        <div className="gh-growth-item">
                            <div className="gh-growth-label">Current</div>
                            <div className="gh-growth-value">{g.current}</div>
                        </div>
                        <div className="gh-growth-item">
                            <div className="gh-growth-label">7D</div>
                            <GrowthValue v={g.growth_7d} />
                        </div>
                        <div className="gh-growth-item">
                            <div className="gh-growth-label">30D</div>
                            <GrowthValue v={g.growth_30d} />
                        </div>
                        <div className="gh-growth-item">
                            <div className="gh-growth-label">90D</div>
                            <GrowthValue v={g.growth_90d} />
                        </div>
                        {g.rate_30d !== 0 && g.growth_30d !== 0 && (
                            <span className="gh-rate-chip">
                                增长率 {g.rate_30d > 0 ? '+' : ''}{g.rate_30d}%
                            </span>
                        )}
                        <span style={{ marginLeft: 'auto', fontSize: 11.5, color: 'var(--color-text-tertiary)' }}>
                            自 {g.since} 起 {g.points} 个快照
                        </span>
                    </div>
                    <div className="gh-window-seg">
                        <Segmented size="small" value={window} onChange={setWindow}
                            options={STAR_WINDOWS.map(w => ({ label: w.label, value: w.value }))} />
                    </div>
                    <StarTrendChart points={data.points} isDark={isDark} />
                </div>
            );
        }

        const COMMIT_WINDOWS = [{ label: '7 Days', value: 7 }, { label: '30 Days', value: 30 }, { label: '90 Days', value: 90 }];
        function CommitSection({ owner, repo, isDark, onRateLimit }) {
            const [window, setWindow] = useState(30);
            const [data, setData] = useState(null);
            const [err, setErr] = useState(null);
            useEffect(() => {
                let cancelled = false;
                setData(null); setErr(null);
                ghGet(baseUrl + '/api/github/repos/' + encodeURIComponent(owner) + '/' + encodeURIComponent(repo) + '/commits')
                    .then(d => { if (!cancelled) { setData(d); if (onRateLimit && d.rate_limited) onRateLimit({ limited: true }); } })
                    .catch(e => { if (!cancelled) setErr(e); });
                return () => { cancelled = true; };
            }, [owner, repo]);

            if (err) return <Alert type="warning" showIcon message={'提交数据暂时无法获取' + (err.code === 429 ? '（API 限制）' : '')} />;
            if (!data) return <Skeleton active title={false} paragraph={{ rows: 4 }} />;

            const win = (data.windows || {})[String(window)] || data.activity || {};
            const daily = win.daily || [];
            return (
                <div>
                    <div className="gh-growth-row">
                        <div className="gh-growth-item">
                            <div className="gh-growth-label">Commits</div>
                            <div className="gh-growth-value">{win.total || 0}</div>
                        </div>
                        <div className="gh-growth-item">
                            <div className="gh-growth-label">活跃天数</div>
                            <div className="gh-growth-value">{win.active_days || 0}</div>
                        </div>
                        <div className="gh-growth-item">
                            <div className="gh-growth-label">平均</div>
                            <div className="gh-growth-value" style={{ fontSize: 13 }}>{(win.avg_per_day || 0)} commits/day</div>
                        </div>
                        <div className="gh-growth-item">
                            <div className="gh-growth-label">单日最高</div>
                            <div className="gh-growth-value">{win.max_per_day || 0}</div>
                        </div>
                    </div>
                    <div className="gh-window-seg">
                        <Segmented size="small" value={window} onChange={setWindow}
                            options={COMMIT_WINDOWS.map(w => ({ label: w.label, value: w.value }))} />
                    </div>
                    <CommitBarChart daily={daily} isDark={isDark} />
                    <CommitHeatmap daily={daily} />
                    <CommitList commits={data.recent || []} owner={owner} repo={repo} />
                </div>
            );
        }

        // 提交热力图：完全复用已有 commits 数据（按周聚合到周一~周日 × 周数），不产生额外请求
        function CommitHeatmap({ daily }) {
            const weeks = useMemo(() => {
                const rows = [[], [], [], [], [], [], []];
                (daily || []).forEach(d => {
                    const wd = (dayjs(d.date).day() + 6) % 7; // 周一=0
                    rows[wd].push(d);
                });
                return rows;
            }, [daily]);
            const max = useMemo(() => Math.max(1, ...(daily || []).map(d => d.commits)), [daily]);
            const cols = Math.max(0, ...weeks.map(r => r.length));
            if (!cols) return null;
            const level = (n) => n <= 0 ? '' : (n >= max ? 'lv4' : (n >= max * 0.66 ? 'lv3' : (n >= max * 0.33 ? 'lv2' : 'lv1')));
            const DAY_LABEL = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
            return (
                <div style={{ marginTop: 14 }}>
                    <div style={{ fontSize: 12.5, color: 'var(--color-text-secondary)', marginBottom: 6 }}>提交热力图</div>
                    <div className="gh-heatmap">
                        {weeks.map((row, ri) => (
                            <div className="gh-heatmap-row" key={ri}>
                                <span className="gh-heatmap-label">{DAY_LABEL[ri]}</span>
                                {Array.from({ length: cols }).map((_, ci) => {
                                    const cell = row[ci];
                                    return (
                                        <Tooltip key={ci} title={cell ? (cell.date + ' · ' + cell.commits + ' commits') : ''}>
                                            <span className={'gh-heatmap-cell ' + (cell ? level(cell.commits) : '')} />
                                        </Tooltip>
                                    );
                                })}
                            </div>
                        ))}
                    </div>
                    <div className="gh-heatmap-foot">
                        <span>少</span>
                        <span className="gh-heatmap-cell" />
                        <span className="gh-heatmap-cell lv1" />
                        <span className="gh-heatmap-cell lv2" />
                        <span className="gh-heatmap-cell lv3" />
                        <span className="gh-heatmap-cell lv4" />
                        <span>多</span>
                    </div>
                </div>
            );
        }

        function CommitList({ commits, owner, repo }) {
            const [detail, setDetail] = useState(null);
            const [loadingSha, setLoadingSha] = useState('');
            const open = (c) => {
                setLoadingSha(c.sha);
                setDetail({ commit: c, loading: true });
                ghGet(baseUrl + '/api/github/repos/' + encodeURIComponent(owner) + '/' + encodeURIComponent(repo) + '/commits/' + encodeURIComponent(c.sha))
                    .then(d => setDetail({ commit: d.commit, loading: false }))
                    .catch(() => setDetail({ commit: c, loading: false, detailError: true }))
                    .finally(() => setLoadingSha(''));
            };
            if (!commits.length) return null;
            return (
                <div style={{ marginTop: 14 }}>
                    <div style={{ fontSize: 12.5, color: 'var(--color-text-secondary)', marginBottom: 6 }}>最近提交</div>
                    <div className="gh-list">
                        {commits.map(c => (
                            <div className="gh-list-item gh-clickable" key={c.sha} onClick={() => open(c)}>
                                <div className="gh-list-main">
                                    <div className="gh-list-title">{c.message || '(无提交信息)'}</div>
                                    <div className="gh-list-sub">
                                        {c.author_avatar && <img className="gh-contrib-avatar" src={c.author_avatar} alt="" referrerPolicy="no-referrer" style={{ width: 16, height: 16, flexBasis: 16 }} />}
                                        <span>{c.author_login || c.author_name || '未知'}</span>
                                        <span className="gh-mono">{c.short_sha}</span>
                                        {c.verified && <Tag color="green" style={{ marginInlineEnd: 0, fontSize: 11, lineHeight: '16px' }}>Verified</Tag>}
                                    </div>
                                </div>
                                <div className="gh-list-right">
                                    {loadingSha === c.sha ? <UIIcon name="LoadingOutlined" /> : relTime(c.date)}
                                </div>
                            </div>
                        ))}
                    </div>
                    <CommitDetailModal detail={detail} onClose={() => setDetail(null)} />
                </div>
            );
        }
        function CommitDetailModal({ detail, onClose }) {
            if (!detail) return null;
            const c = detail.commit || {};
            return (
                <Drawer open={!!detail} onClose={onClose} width={420} title="提交详情" placement="right">
                    <div className="gh-list-title" style={{ whiteSpace: 'normal', fontSize: 14, fontWeight: 600 }}>{c.message || '(无提交信息)'}</div>
                    {detail.loading ? <Skeleton active title={false} paragraph={{ rows: 4 }} style={{ marginTop: 12 }} /> : (
                        <>
                            {detail.detailError && <Alert type="info" showIcon message="完整差异信息暂时无法获取" style={{ marginTop: 10 }} />}
                            <div className="gh-kv" style={{ marginTop: 14 }}>
                                <div className="gh-kv-item"><div className="gh-kv-label">Author</div><div className="gh-kv-value">{c.author_login || c.author_name || '—'}</div></div>
                                <div className="gh-kv-item"><div className="gh-kv-label">Commit</div><div className="gh-kv-value gh-mono">{c.short_sha || c.sha || '—'}</div></div>
                                <div className="gh-kv-item"><div className="gh-kv-label">Date</div><div className="gh-kv-value">{relTime(c.date)}</div></div>
                                {c.files_changed !== undefined && <div className="gh-kv-item"><div className="gh-kv-label">Files changed</div><div className="gh-kv-value">{c.files_changed}</div></div>}
                                {c.additions !== undefined && <div className="gh-kv-item"><div className="gh-kv-label">Additions</div><div className="gh-kv-value" style={{ color: 'var(--color-success)' }}>+{c.additions}</div></div>}
                                {c.deletions !== undefined && <div className="gh-kv-item"><div className="gh-kv-label">Deletions</div><div className="gh-kv-value" style={{ color: 'var(--color-error)' }}>-{c.deletions}</div></div>}
                            </div>
                            <Button type="primary" block style={{ marginTop: 16 }} icon={<UIIcon name="GithubOutlined" />}

                        </>

                </Drawer>

        // ==================== Releases ====================
        function ReleasesSection({ owner, repo, onRateLimit }) {

            const [showAll, setShowAll] = useState(false);
            useEffect(() => {
                let cancelled = false;
                ghGet(baseUrl + '/api/github/repos/' + encodeURIComponent(owner) + '/' + encodeURIComponent(repo) + '/releases')
                    .then(d => { if (!cancelled) setData(d); })
                    .catch(e => { if (!cancelled) setErr(e); });
                return () => { cancelled = true; };

            if (err) return <Alert type="warning" showIcon message="Releases 暂时无法获取" />;

                            <span style={{ fontSize: 12, color: 'var(--color-text-tertiary)' }}>Assets {data.latest.asset_count}</span>
                            <span style={{ fontSize: 12, color: 'var(--color-text-tertiary)' }}>Downloads {data.latest.downloads}</span>

                    )}
                    <div className="gh-list">
                        {shown.map(r => (
                            <div className="gh-list-item gh-clickable" key={r.id} onClick={() => setDetail(r)}>
                                <div className="gh-list-main">
                                    <div className="gh-list-title">
                                        <span className="gh-mono">{r.tag_name}</span>
                                        {r.latest && <Tag color="blue" style={{ marginInlineStart: 6, marginInlineEnd: 0, fontSize: 11, lineHeight: '16px' }}>Latest</Tag>}

                                        <span>{relTime(r.published_at)}</span>
                                        {r.asset_count > 0 && <span>{r.asset_count} assets</span>}

                                </div>

        }
        function ReleaseDetailDrawer({ release, onClose }) {
            if (!release) return null;
            const r = release;
            return (
                <Drawer open={!!release} onClose={onClose} width={480} title={r.tag_name} placement="right"
                    footer={<Button type="primary" block icon={<UIIcon name="GithubOutlined" />} onClick={() => openGitHub(r.html_url)}>在 GitHub 查看</Button>}>
                    <div className="gh-kv">
                        <div className="gh-kv-item"><div className="gh-kv-label">发布时间</div><div className="gh-kv-value">{fmtDate(r.published_at)}（{relTime(r.published_at)}）</div></div>
                        <div className="gh-kv-item"><div className="gh-kv-label">发布者</div><div className="gh-kv-value">{r.author || '—'}</div></div>
                        <div className="gh-kv-item"><div className="gh-kv-label">Assets</div><div className="gh-kv-value">{r.asset_count}</div></div>
                        <div className="gh-kv-item"><div className="gh-kv-label">Downloads</div><div className="gh-kv-value">{r.downloads}</div></div>
                    </div>
                    {r.assets && r.assets.length > 0 && (
                        <>
                            <div className="gh-section"><span className="gh-section-title">Assets</span></div>
                            <div className="gh-list">
                                {r.assets.map((a, i) => (
                                    <div className="gh-list-item" key={i}>
                                        <div className="gh-list-main">
                                            <div className="gh-list-title gh-mono" style={{ fontSize: 12.5 }}>{a.name}</div>
                                            <div className="gh-list-sub"><span>{fmtBytes(a.size)}</span><span>下载 {a.download_count}</span></div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </>
                    )}
                    <div className="gh-section"><span className="gh-section-title">Release Notes</span>
                        {r.truncated && <span className="gh-section-count">内容过长，仅展示部分</span>}
                    </div>
                    {r.body
                        ? <div className="gh-readme" dangerouslySetInnerHTML={{ __html: renderMarkdown(r.body) }} />
                        : <Typography.Text type="secondary" style={{ fontSize: 12 }}>该版本没有填写 Release Notes</Typography.Text>}
                </Drawer>
            );
        }

        // ==================== GitHub Actions ====================
        function ActionsSection({ owner, repo }) {
            const [data, setData] = useState(null);
            const [err, setErr] = useState(null);
            useEffect(() => {
                let cancelled = false;
                ghGet(baseUrl + '/api/github/repos/' + encodeURIComponent(owner) + '/' + encodeURIComponent(repo) + '/actions')
                    .then(d => { if (!cancelled) setData(d); })
                    .catch(e => { if (!cancelled) setErr(e); });
                return () => { cancelled = true; };
            }, [owner, repo]);

            if (err) return <Alert type="warning" showIcon message="Actions 数据暂时无法获取" />;
            if (!data) return <Skeleton active title={false} paragraph={{ rows: 3 }} />;

            const wf = data.workflows || [];
            const runs = data.runs || [];
            if (!wf.length && !runs.length) {
                return <Empty image={Empty.PRESENTED_IMAGE_SIMPLE} description="No GitHub Actions" style={{ padding: '16px 0' }} />;
            }
            const dot = (st) => {
                const cls = st === 'passed' ? 'gh-ci-passing' : (st === 'failed' ? 'gh-ci-failing' : (st === 'running' ? 'gh-ci-running' : ''));
                const txt = st === 'passed' ? 'Passed' : (st === 'failed' ? 'Failed' : (st === 'running' ? 'Running' : (st === 'cancelled' ? 'Cancelled' : 'Unknown')));
                const ic = st === 'passed' ? 'CheckCircleFilled' : (st === 'failed' ? 'CloseCircleFilled' : (st === 'running' ? 'LoadingOutlined' : 'MinusCircleFilled'));
                return <span className={'gh-ci ' + cls}><UIIcon name={ic} />{txt}</span>;
            };
            return (
                <div>
                    {wf.length > 0 && (
                        <div className="gh-list" style={{ marginBottom: 14 }}>
                            {wf.map(w => (
                                <div className="gh-list-item gh-clickable" key={w.name} onClick={() => openGitHub(w.html_url)}>
                                    <div className="gh-list-main">
                                        <div className="gh-list-title">{w.name}</div>
                                        <div className="gh-list-sub">
                                            <span className="gh-mono">{w.branch || '—'}</span>
                                            <span className="gh-mono">{w.short_sha || '—'}</span>
                                            <span>{relTime(w.created_at)}</span>
                                            {w.duration_ms > 0 && <span>{fmtDuration(w.duration_ms)}</span>}
                                        </div>
                                    </div>
                                    <div className="gh-list-right">{dot(w.status)}</div>
                                </div>
                            ))}
                        </div>
                    )}
                    {runs.length > 0 && (
                        <>
                            <div className="gh-section"><span className="gh-section-title">最近运行</span><span className="gh-section-count">最近 {runs.length} 次</span></div>
                            <div className="gh-table-wrap">
                                <table className="gh-table">
                                    <thead>
                                        <tr><th>Workflow</th><th>状态</th><th>分支</th><th>Commit</th><th>时间</th><th>耗时</th></tr>
                                    </thead>
                                    <tbody>
                                        {runs.slice(0, 20).map(r => {
                                            const st = r.status === 'in_progress' || r.status === 'queued' ? 'running'
                                                : (r.conclusion === 'success' ? 'passed' : (r.conclusion === 'failure' || r.conclusion === 'timed_out' ? 'failed' : (r.conclusion === 'cancelled' ? 'cancelled' : 'unknown')));
                                            return (
                                                <tr key={r.id}>
                                                    <td><a href={r.html_url} target="_blank" rel="noopener noreferrer">{r.name}</a></td>
                                                    <td>{dot(st)}</td>
                                                    <td className="gh-mono">{r.branch || '—'}</td>
                                                    <td className="gh-mono">{r.short_sha || '—'}</td>
                                                    <td>{relTime(r.created_at)}</td>
                                                    <td>{fmtDuration(r.duration_ms)}</td>
                                                </tr>
                                            );
                                        })}
                                    </tbody>
                                </table>
                            </div>
                        </>
                    )}
                </div>
            );
        }

        // ==================== README ====================
        const README_COLLAPSED = 3500;
        function ReadmeSection({ state }) {
            const [expanded, setExpanded] = useState(false);
            if (state.readmeLoading) return <Skeleton active title={false} paragraph={{ rows: 5 }} />;
            if (state.readmeError || !state.readme || !state.readme.content) {
                return <Typography.Text type="secondary" style={{ fontSize: 12 }}>暂无 README 内容</Typography.Text>;
            }
            const raw = state.readme.content || '';
            const clipped = !expanded && raw.length > README_COLLAPSED;
            const shown = clipped ? githubTruncate(raw, README_COLLAPSED) : raw;
            return (
                <>
                    <div className="gh-readme" dangerouslySetInnerHTML={{ __html: renderMarkdown(shown) }} />
                    {raw.length > README_COLLAPSED && (
                        <Button type="link" size="small" className="gh-readme-more" onClick={() => setExpanded(!expanded)}>
                            {clipped ? '显示更多' : '收起'}
                        </Button>
                    )}
                </>
            );
        }

        // ==================== Languages ====================
        function LanguagesSection({ owner, repo }) {
            const [data, setData] = useState(null);
            const [err, setErr] = useState(null);
            useEffect(() => {
                let cancelled = false;
                ghGet(baseUrl + '/api/github/repos/' + encodeURIComponent(owner) + '/' + encodeURIComponent(repo) + '/languages')
                    .then(d => { if (!cancelled) setData(d); })
                    .catch(e => { if (!cancelled) setErr(e); });
                return () => { cancelled = true; };
            }, [owner, repo]);
            if (err) return <Typography.Text type="secondary" style={{ fontSize: 12 }}>语言分布暂时无法获取</Typography.Text>;
            if (!data) return <Skeleton active title={false} paragraph={{ rows: 3 }} />;
            const langs = data.languages || [];
            if (!langs.length) return <Typography.Text type="secondary" style={{ fontSize: 12 }}>暂无语言数据</Typography.Text>;
            return (
                <div>
                    {langs.slice(0, 8).map(l => (
                        <div className="gh-langbar-item" key={l.name}>
                            <div className="gh-langbar-head">
                                <span className="gh-langbar-name"><span className="gh-lang-dot" style={{ background: langColor(l.name) }} />{l.name}</span>
                                <span>{l.percent}%</span>
                            </div>
                            <div className="gh-langbar-track">
                                <div className="gh-langbar-fill" style={{ width: Math.max(l.percent, 1) + '%', background: langColor(l.name), opacity: .85 }} />
                            </div>
                        </div>
                    ))}
                </div>
            );
        }

        // ==================== Contributors ====================
        function ContributorsSection({ owner, repo }) {
            const [data, setData] = useState(null);
            const [err, setErr] = useState(null);
            useEffect(() => {
                let cancelled = false;
                ghGet(baseUrl + '/api/github/repos/' + encodeURIComponent(owner) + '/' + encodeURIComponent(repo) + '/contributors')
                    .then(d => { if (!cancelled) setData(d); })
                    .catch(e => { if (!cancelled) setErr(e); });
                return () => { cancelled = true; };
            }, [owner, repo]);

                <div>
                    {list.map(c => (

                    )}
                </div>
