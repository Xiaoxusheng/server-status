<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow">
    <title>安全中心 - Server Status</title>
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%201024%201024%22%20fill%3D%22%231677ff%22%3E%3Cpath%20d%3D%22M866.9%20169.9L527.1%2054.1c-3-3-9.2-3-12.1%200L175.1%20169.9c-8.3%202.8-12.3%2012.1-8.6%2020.2l4.7%2010.4c-3-3-9.2-3-12.1%200L25.1%20314.5c-8.3%202.8-12.3%2012.1-8.6%2020.2l8.6%2019.1c-3-3-9.2-3-12.1%200L499.3%20960c1.5%201.5%203.5%202.3%205.7%202.3s4.2-0.8%205.7-2.3l486.2-605.7c3.7-8.1-0.3-17.4-8.6-20.2z%22%2F%3E%3C%2Fsvg%3E">
    <link rel="stylesheet" href="/ui.css">
    <style>
        #root { min-height: 100vh; }

        /* ===== 顶栏：与全站一致的窄条导航 ===== */
        .sec-topbar {
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 24px; height: 52px;
            background: var(--color-surface);
            border-bottom: 1px solid var(--color-border);
        }
        .tb-page { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: var(--color-text); white-space: nowrap; }
        .tb-page .anticon { color: var(--color-primary); }

        /* ===== 页面容器：宽屏信息密度 ===== */
        .sec-page { max-width: 1360px; margin: 0 auto; padding: 20px 28px 72px; }

        /* ===== 页头：标题 + 副标题 + 次要操作 ===== */
        .sec-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
        .sec-head .sh-title { font-size: 22px; font-weight: 600; color: var(--color-text); line-height: 1.25; }
        .sec-head .sh-title .sh-en { font-size: 12px; font-weight: 500; color: var(--color-text-tertiary); margin-left: 8px; letter-spacing: .04em; }
        .sec-head .sh-sub { font-size: 13px; color: var(--color-text-tertiary); margin-top: 4px; }

        /* ===== 卡片基线：1px 边框 + 表面色，无阴影无渐变 ===== */
        .sec-card {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius);
            padding: 16px 20px;
        }
        .sec-card .sc-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
        .sec-card .sc-title { font-size: 14px; font-weight: 600; color: var(--color-text); display: inline-flex; align-items: center; gap: 6px; }
        .sec-card .sc-sub { font-size: 12px; color: var(--color-text-tertiary); font-weight: 400; margin-left: 6px; }

        /* ===== 评分区 ===== */
        .sec-hero { display: flex; gap: 28px; align-items: stretch; flex-wrap: wrap; }
        .sec-score-block { display: flex; flex-direction: column; justify-content: center; min-width: 190px; }
        .sec-score-label { font-size: 12px; color: var(--color-text-tertiary); }
        .sec-score-row { display: flex; align-items: baseline; gap: 4px; cursor: pointer; }
        .sec-score-num { font-size: 42px; font-weight: 600; line-height: 1.15; color: var(--color-text); font-variant-numeric: tabular-nums; }
        .sec-score-total { font-size: 14px; color: var(--color-text-tertiary); }
        .sec-score-bar { margin-top: 8px; width: 200px; height: 6px; border-radius: 3px; background: var(--color-border); overflow: hidden; }
        .sec-score-bar i { display: block; height: 100%; border-radius: 3px; transition: width .6s ease; }
        .sec-score-hint { margin-top: 6px; font-size: 12px; color: var(--color-text-tertiary); display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
        .sec-score-hint:hover { color: var(--color-primary); }

        .sec-hero-main { flex: 1; min-width: 260px; display: flex; flex-direction: column; justify-content: center; gap: 8px; }
        .sec-status-line { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; color: var(--color-text); }
        .sec-status-line .sdot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 8px; }
        .sec-count-line { font-size: 13px; color: var(--color-text-secondary); }
        .sec-count-line b { font-weight: 600; color: var(--color-text); font-variant-numeric: tabular-nums; }
        .sec-scan-meta { display: flex; flex-direction: column; gap: 2px; font-size: 12px; color: var(--color-text-tertiary); }
        .sec-scan-meta .tnum { font-variant-numeric: tabular-nums; }
        .sec-hero-actions { display: flex; flex-direction: column; justify-content: center; gap: 8px; min-width: 132px; }

        /* ===== 扫描进度（嵌入 hero 下方）===== */
        .sec-scan-running { border-top: 1px dashed var(--color-border); margin-top: 14px; padding-top: 12px; }
        .sec-scan-steps { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 6px 18px; }
        .sec-step { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--color-text-secondary); min-height: 24px; }
        .sec-step .ss-mark { width: 16px; text-align: center; font-weight: 600; flex: 0 0 16px; }
        .sec-step.ok .ss-mark { color: var(--color-success); }
        .sec-step.warn .ss-mark { color: var(--color-warning); }
        .sec-step.bad .ss-mark { color: var(--color-error); }
        .sec-step.run .ss-mark { color: var(--color-primary); }

        /* ===== 分布 + 趋势行 ===== */
        .sec-grid-dist { display: grid; grid-template-columns: 2fr 1fr; gap: 14px; margin: 14px 0; }

        .dist-row { display: grid; grid-template-columns: 72px 44px 1fr; align-items: center; gap: 12px; padding: 7px 8px; border-radius: var(--radius-sm); cursor: pointer; }
        .dist-row:hover { background: var(--hover); }
        .dist-row.active { background: var(--color-primary-bg); }
        .dist-row .dr-label { font-size: 13px; color: var(--color-text-secondary); display: inline-flex; align-items: center; gap: 6px; }
        .dist-row .dr-label i { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 8px; }
        .dist-row.active .dr-label { color: var(--color-text); font-weight: 600; }
        .dist-row .dr-count { font-size: 16px; font-weight: 600; color: var(--color-text); font-variant-numeric: tabular-nums; text-align: right; }
        .dist-row .dr-bar { height: 6px; border-radius: 3px; background: var(--color-border); overflow: hidden; }
        .dist-row .dr-bar i { display: block; height: 100%; border-radius: 3px; }

        /* ===== 趋势 sparkline ===== */
        .trend-wrap { display: flex; flex-direction: column; }
        .trend-svg { width: 100%; height: 74px; display: block; }
        .trend-foot { display: flex; align-items: baseline; justify-content: space-between; margin-top: 6px; font-size: 12px; color: var(--color-text-tertiary); }
        .trend-delta-up { color: var(--color-error); font-weight: 600; }
        .trend-delta-down { color: var(--color-success); font-weight: 600; }

        /* ===== 主区：风险列表 + 右栏 ===== */
        .sec-grid-main { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 14px; align-items: start; }
        .sec-col { display: flex; flex-direction: column; gap: 14px; min-width: 0; }

        /* 来源筛选 chips */
        .src-chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 4px; }
        .src-chip { font-size: 12px; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--color-border); color: var(--color-text-secondary); cursor: pointer; user-select: none; }
        .src-chip:hover { border-color: var(--color-primary); color: var(--color-primary); }
        .src-chip.active { background: var(--color-primary-bg); border-color: var(--color-primary); color: var(--color-primary); }

        /* ===== 风险行：高密度列表（非表格，无边框卡片，严重度以小圆点表达）===== */
        .risk-row {
            display: flex; gap: 12px; align-items: flex-start;
            padding: 11px 10px; margin: 0 -6px;
            border-radius: var(--radius-sm); cursor: pointer; transition: background .15s;
        }
        .risk-row:hover { background: var(--hover); }
        .risk-main { flex: 1; min-width: 0; }
        .risk-title-line { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .risk-title { font-size: 14px; font-weight: 600; color: var(--color-text); word-break: break-word; }
        .risk-sub { font-size: 12px; color: var(--color-text-tertiary); margin-top: 3px; }
        .risk-meta { font-size: 12px; color: var(--color-text-tertiary); margin-top: 3px; }
        .risk-meta .rm-err { color: var(--color-error); }
        .risk-actions { display: flex; align-items: center; gap: 4px; flex: 0 0 auto; padding-top: 2px; }

        .sev-pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; flex: 0 0 auto; }
        .sev-pill i { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 7px; }

        /* ===== 优先处理 ===== */
        .prio-item { display: flex; gap: 10px; align-items: flex-start; padding: 9px 6px; border-radius: var(--radius-sm); cursor: pointer; }
        .prio-item:hover { background: var(--hover); }
        .prio-rank { font-size: 13px; font-weight: 700; color: var(--color-text-tertiary); font-variant-numeric: tabular-nums; flex: 0 0 18px; padding-top: 1px; }
        .prio-main { flex: 1; min-width: 0; }
        .prio-title { font-size: 13px; font-weight: 600; color: var(--color-text); }
        .prio-sub { font-size: 12px; color: var(--color-text-tertiary); margin-top: 2px; }

        /* ===== 事件 Timeline 微调 ===== */
        .evt-item-title { font-size: 13px; color: var(--color-text); }
        .evt-item-meta { font-size: 12px; color: var(--color-text-tertiary); }

        /* ===== 详情 Drawer 分组 ===== */
        .drawer-section { padding: 12px 0; border-top: 1px solid var(--color-border); }
        .drawer-section:first-of-type { border-top: none; padding-top: 4px; }
        .drawer-section .ds-label { font-size: 12px; font-weight: 600; color: var(--color-text-tertiary); letter-spacing: .02em; margin-bottom: 6px; }
        .drawer-section .ds-body { font-size: 13px; color: var(--color-text); line-height: 1.65; word-break: break-word; }
        .evidence-pre {
            margin: 0; padding: 8px 10px; border: 1px solid var(--color-border); border-radius: var(--radius-sm);
            background: var(--color-bg); color: var(--color-text-secondary);
            font-family: "JetBrains Mono", Consolas, "Courier New", monospace; font-size: 12px;
            white-space: pre-wrap; word-break: break-all; max-height: 220px; overflow: auto;
        }
        .score-big { font-size: 34px; font-weight: 600; color: var(--color-text); font-variant-numeric: tabular-nums; }
        .ded-row { display: flex; align-items: center; gap: 10px; padding: 5px 0; font-size: 13px; }
        .ded-row .dd-reason { flex: 1; color: var(--color-text-secondary); }
        .ded-row .dd-count { color: var(--color-text-tertiary); font-variant-numeric: tabular-nums; }
        .ded-row .dd-points { color: var(--color-error); font-variant-numeric: tabular-nums; min-width: 44px; text-align: right; }
        .ded-sum { border-top: 1px dashed var(--color-border); margin-top: 4px; padding-top: 8px; }
        .ded-sum .dd-points { color: var(--color-text); font-weight: 600; }

        /* ===== 空态 / 加载 ===== */
        .sec-loading { padding: 32px 0; text-align: center; color: var(--color-text-tertiary); font-size: 13px; }

        .sec-error-alert { margin-bottom: 14px; }

        /* ===== 响应式 ===== */
        @media (max-width: 1100px) {
            .sec-grid-main { grid-template-columns: 1fr; }
            .sec-grid-dist { grid-template-columns: 1fr; }
        }
        @media (max-width: 768px) {
            .sec-page { padding: 14px 12px 56px; }
            .sec-topbar { padding: 0 12px; }
            .sec-topbar .ant-btn { padding: 0 8px; }
            .sec-head .sh-title { font-size: 19px; }
            .sec-hero { gap: 14px; }
            .sec-score-num { font-size: 34px; }
            .sec-score-bar { width: 100%; }
            .sec-score-block { min-width: 0; width: 100%; }
            .sec-hero-actions { flex-direction: row; min-width: 0; width: 100%; }
            .sec-hero-actions .ant-btn { flex: 1; }
            .risk-row { flex-wrap: wrap; padding: 12px 12px 12px 14px; }
            .risk-main { flex: 1 1 100%; }
            .risk-actions { flex: 1 1 100%; padding-top: 8px; justify-content: flex-end; gap: 8px; }
            /* 移动端主操作保证可点击面积 */
            .risk-actions .ant-btn { min-height: 44px; min-width: 72px; }
            .dist-row { grid-template-columns: 64px 40px 1fr; padding: 9px 6px; }
        }
    </style>
    <script>
        (function () {
            try {
                var dark = localStorage.getItem('theme') === 'dark';
                document.documentElement.classList.toggle('dark', dark);
            } catch (e) { }
        })();
    </script>
</head>

<body>
    <div id="root"></div>
    <script crossorigin src="https://registry.npmmirror.com/react/18.3.1/files/umd/react.production.min.js"></script>
    <script crossorigin src="https://registry.npmmirror.com/react-dom/18.3.1/files/umd/react-dom.production.min.js"></script>
    <script src="https://registry.npmmirror.com/dayjs/1.11.13/files/dayjs.min.js"></script>
    <script src="https://registry.npmmirror.com/antd/5.21.6/files/dist/antd.min.js"></script>
    <script src="https://registry.npmmirror.com/@ant-design/icons/5.4.0/files/dist/index.umd.js"></script>
    <script src="https://registry.npmmirror.com/@babel/standalone/7.24.7/files/babel.min.js"></script>
    <script type="text/babel">
        const { Button, Tag, Tooltip, Space, ConfigProvider, theme, message, Descriptions, Empty,
            Modal, Segmented, Select, Input, Typography, Switch, Drawer, Timeline, Badge, Alert,
            Popconfirm, InputNumber, Checkbox, Skeleton, Result } = window.antd;
        const { useState, useEffect, useRef, useCallback, useMemo } = React;
        const { darkAlgorithm } = theme;
        const IconSet = window.icons || {};
        const UIIcon = ({ name, ...props }) => { const C = IconSet[name]; return C ? <C {...props} /> : null; };

        const baseUrl = window.location.origin;

        // ==================== 基础工具 ====================
        function getCsrfToken() { const m = document.cookie.match(/(?:^|; )csrf_token=([^;]*)/); return m ? decodeURIComponent(m[1]) : ''; }
        function secureFetch(url, options = {}) {
            const method = options.method || 'GET';
            const headers = { 'Content-Type': 'application/json', ...(options.headers || {}) };
            if (/^(POST|PUT|PATCH|DELETE)$/i.test(method)) { const tok = getCsrfToken(); if (tok) headers['X-CSRF-Token'] = tok; }
            return fetch(url, { method, headers, credentials: 'include', body: options.body });
        }
        async function getJSON(url) {
            const r = await secureFetch(url);
            const d = await r.json();
            if (d.code !== 200) throw new Error(d.message || ('HTTP ' + r.status));
            return d.data;
        }
        async function postJSON(url, body) {
            const r = await secureFetch(url, { method: 'POST', body: JSON.stringify(body || {}) });
            const d = await r.json();
            if (d.code !== 200) throw new Error(d.message || ('HTTP ' + r.status));
            return d.data;
        }
        function relTime(s) {
            if (!s) return '—';
            const diff = dayjs().diff(dayjs(s), 'second');
            if (diff < 60) return '刚刚';
            if (diff < 3600) return Math.floor(diff / 60) + ' 分钟前';
            if (diff < 86400) return Math.floor(diff / 3600) + ' 小时前';
            return dayjs(s).format('MM-DD HH:mm');
        }
        function fmtTime(s) { return s ? dayjs(s).format('MM-DD HH:mm') : '—'; }
        function fmtDuration(ms) {
            if (!ms && ms !== 0) return '—';
            if (ms < 1000) return ms + ' ms';
            return (Math.round(ms / 100) / 10) + ' s';
        }
        function useIsMobile() {
            const [m, setM] = useState(window.innerWidth <= 768);
            useEffect(() => {
                const on = () => setM(window.innerWidth <= 768);
                window.addEventListener('resize', on);
                return () => window.removeEventListener('resize', on);
            }, []);
            return m;
        }

        // ==================== 领域展示规则 ====================
        const SEV = {
            critical: { label: '严重', color: '#cf1322', dark: '#a8071a', rank: 4 },
            high: { label: '高风险', color: '#d46b08', dark: '#d46b08', rank: 3 },
            medium: { label: '中风险', color: '#d4b106', dark: '#d4b106', rank: 2 },
            low: { label: '低风险', color: '#1677ff', dark: '#1668dc', rank: 1 },
            info: { label: '提示', color: '#8c8c8c', dark: '#8c8c8c', rank: 0 },
        };
        const sevColor = (sev) => (SEV[sev] || SEV.info)[document.documentElement.classList.contains('dark') ? 'dark' : 'color'];
        // 评分状态 → 状态点 / 文案
        const STATUS_META = {
            good: { dot: 'var(--color-success)', text: '安全状态良好' },
            warning: { dot: 'var(--color-warning)', text: '存在需要关注的风险' },
            risk: { dot: '#d46b08', text: '存在风险，建议尽快处理' },
            critical: { dot: 'var(--color-error)', text: '存在严重风险，请立即处理' },
        };
        const FINDING_STATUS = {
            open: { label: '待处理', color: 'warning' },
            ignored: { label: '已忽略', color: 'default' },
            fixing: { label: '修复中', color: 'processing' },
            resolved: { label: '已解决', color: 'success' },
            failed: { label: '修复失败', color: 'error' },
        };
        const StatusTag = ({ s }) => {
            const m = FINDING_STATUS[s] || { label: s, color: 'default' };
            return <Tag color={m.color} style={{ marginRight: 0 }}>{m.label}</Tag>;
        };
        // 检查器 → 来源筛选标签
        const SRC_LABEL = { login_security: '账号', open_ports: '网络', firewall: '防火墙', tls_cert: 'TLS', file_permissions: '文件', service_health: '服务', docker_security: 'Docker' };

        // 把后端标题拆成 主标题 / 副标题（格式与检查器输出一一对应，未命中时回退原文）
        function formatFinding(f) {
            const t = (f.title || '').trim();
            const cat = f.category || '';
            let m;
            if (f.check_id === 'open_ports') {
                if ((m = t.match(/^数据库\/敏感服务 (.+?) 端口 (\d+) 直接暴露公网$/)))
                    return { title: `${m[1]} ${m[2]} 暴露公网`, sub: `数据库 · 网络暴露` };
                if ((m = t.match(/^远程服务 (.+?) 暴露公网（端口 (\d+)）$/)))
                    return { title: `${m[1]} ${m[2]} 暴露公网`, sub: `远程服务 · 网络暴露` };
                if ((m = t.match(/^公网监听端口 (\d+)（(.+?)）请确认业务归属$/)))
                    return { title: `端口 ${m[1]} 公网监听`, sub: `${m[2]} · 网络暴露` };
            }
            if (f.check_id === 'service_health' && (m = t.match(/^服务 (.+?) 未在运行/)))
                return { title: `${m[1]} 未运行`, sub: `服务可用性` };
            if (f.check_id === 'tls_cert' && (m = t.match(/^TLS 证书(将于 \d+ 天后过期|已过期 \d+ 天)$/)))
                return { title: `TLS 证书${m[1]}`, sub: `证书安全` };
            if (f.check_id === 'docker_security') {
                if ((m = t.match(/^容器 (.+?) 以特权模式运行$/))) return { title: `${m[1]} 以特权模式运行`, sub: `容器安全` };
                if ((m = t.match(/^容器 (.+?) 使用 host 网络$/))) return { title: `${m[1]} 使用 host 网络`, sub: `容器安全` };
                if ((m = t.match(/^容器 (.+?) 使用 host PID 空间$/))) return { title: `${m[1]} 共享主机 PID`, sub: `容器安全` };
                if ((m = t.match(/^容器 (.+?) 挂载了 Docker Socket$/))) return { title: `${m[1]} 挂载 docker.sock`, sub: `容器安全` };
                if ((m = t.match(/^容器 (.+?) 异常退出$/))) return { title: `${m[1]} 异常退出`, sub: `容器安全` };
            }
            if (f.check_id === 'file_permissions') {
                if ((m = t.match(/^敏感文件(.+?): (.+)$/))) return { title: `${m[2]} 权限过宽`, sub: `文件权限` };
                if (t.indexOf('数据目录权限过宽') === 0) return { title: `数据目录权限过宽`, sub: `文件权限` };
            }
            if (f.check_id === 'login_security') {
                if ((m = t.match(/^IP (.+?) 疑似暴力破解/))) return { title: `IP ${m[1]} 疑似暴力破解`, sub: `账号安全` };
                if ((m = t.match(/^管理员账户数量偏多（(\d+) 个）/))) return { title: `管理员账户偏多（${m[1]} 个）`, sub: `账号安全` };
                if ((m = t.match(/^存在 (\d+) 个长期未使用的账户/))) return { title: `${m[1]} 个长期未使用账户`, sub: `账号安全` };
                if ((m = t.match(/^存在 (\d+) 个无密码\/异常密码状态账户/))) return { title: `${m[1]} 个无密码账户`, sub: `账号安全` };
                if (t.indexOf('暴力破解') >= 0) return { title: t, sub: `账号安全` };
            }
            if (f.check_id === 'firewall' && (m = t.match(/^防火墙（(.+?)）没有任何规则$/)))
                return { title: `${m[1]} 无任何规则`, sub: `网络防护` };
            return { title: t, sub: cat };
        }
        const findingMeta = (f) => {
            const parts = [`发现 ${relTime(f.detected_at)}`];
            if (f.occurrences > 1) parts.push(`出现 ${f.occurrences} 次`);
            if (f.status === 'failed') parts.push(<span className="rm-err">修复失败：{f.last_exec_error || '验证未通过'}</span>);
            else if (f.status === 'fixing') parts.push('修复执行中');
            return parts;
        };

        // ==================== 顶栏 ====================
        function OpsTopbar({ active, isDark, setIsDark, hasPerm }) {
            const navBtns = [];
            navBtns.push(<Button key="home" icon={<UIIcon name="DashboardOutlined" />} onClick={() => window.location.href = 'index.html'}>首页</Button>);

            if (hasPerm('security:view')) navBtns.push(<Button key="events" icon={<UIIcon name="NotificationOutlined" />} type={active === 'events' ? 'primary' : 'default'} onClick={() => window.location.href = 'security-events.html'}>安全事件</Button>);
            if (hasPerm('remediation:view')) navBtns.push(<Button key="rem" icon={<UIIcon name="ToolOutlined" />} type={active === 'remediation' ? 'primary' : 'default'} onClick={() => window.location.href = 'remediation.html'}>自动修复</Button>);

            if (hasPerm('task:view')) navBtns.push(<Button key="history" icon={<UIIcon name="HistoryOutlined" />} type={active === 'history' ? 'primary' : 'default'} onClick={() => window.location.href = 'task-history.html'}>执行历史</Button>);
            return (

                    <span className="tb-page"><UIIcon name="CloudServerOutlined" />安全中心</span>

                        <Tooltip title={isDark ? '浅色模式' : '深色模式'}>
                            <Button onClick={() => setIsDark(!isDark)} icon={<UIIcon name={isDark ? 'SunOutlined' : 'MoonOutlined'} />} />
                        </Tooltip>
                        <Button danger icon={<UIIcon name="LogoutOutlined" />} onClick={async () => {
                            try { await secureFetch(baseUrl + '/logout', { method: 'POST', body: '{}' }); } catch (e) { }
                            window.location.href = 'index.html';
                        }}><span className="tb-text">退出</span></Button>
                    </Space>
