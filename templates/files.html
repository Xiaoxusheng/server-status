                    <div className={'sp-app' + (isDark ? ' dark' : '')} style={{ minHeight: '100vh', background: isDark ? '#141414' : '#f5f5f5' }}>
                        <div className={'topbar' + (isDark ? ' dark' : '')}>
                            <span className="tb-page"><UIIcon name="FolderOutlined" />文件管理</span>
                            <Space style={{ marginLeft: 'auto' }}>
                                <Button icon={<UIIcon name="HomeOutlined" />} onClick={() => window.location.href = 'index.html'}><span className="tb-text">首页</span></Button>
                                <Button className="tb-hide-sm" icon={<UIIcon name="SettingOutlined" />} onClick={() => window.location.href = 'process.html'}><span className="tb-text">进程</span></Button>
                                <Tooltip title={isDark ? '浅色模式' : '深色模式'}>
                                    <Button onClick={() => setIsDark(!isDark)} icon={<UIIcon name={isDark ? 'SunOutlined' : 'MoonOutlined'} />} />
                                </Tooltip>
                                <Button danger icon={<UIIcon name="LogoutOutlined" />} onClick={() => secureFetch(baseUrl + '/logout', { method: 'POST' }).finally(() => window.location.href = 'index.html')}><span className="tb-text">退出</span></Button>
                            </Space>
                        </div>

                        <div className="page-wrap">
                            <Card
                                title={<Space size={6}><UIIcon name="BankOutlined" />服务器文件</Space>}
                                extra={<Space wrap>
                                    <Upload {...uploadProps}>
                                        <Tooltip title="支持多选；也可以直接把文件拖到页面任意位置">
                                            <Button type="primary" icon={<span><UIIcon name="CloudUploadOutlined" style={{ fontSize: 15 }} /></span>}>上传文件</Button>
                                        </Tooltip>
                                    </Upload>
                                    <Button icon={<UIIcon name="FolderAddOutlined" />} onClick={() => setMkModal(true)}>新建文件夹</Button>
                                    <Button icon={<UIIcon name="ReloadOutlined" />} onClick={() => load(path)}>刷新</Button>
                                    {(hasPerm('token:issue') || hasPerm('token:view')) && (
                                        <Button icon={<UIIcon name="FileDoneOutlined" />} onClick={openTokenList}>我的令牌</Button>
                                    )}
                                </Space>}
                            >
                                {/* 第二层：面包屑 + 上一级 + 完整路径 */}
                                <div className="fm-crumb-row">
                                    {parts.length > 0 && (
                                        <Tooltip title="上一级">
                                            <Button size="small" icon={<UIIcon name="ArrowLeftOutlined" />} onClick={goUp} />
                                        </Tooltip>
                                    )}
                                    <div className="fm-crumb">
                                        <Breadcrumb items={breadcrumbItems} />
                                    </div>
                                </div>
                                <div className="fm-fullpath">
                                    <Typography.Text type="secondary">当前路径: 媒体目录/{path}</Typography.Text>
                                </div>

                                {/* 第三层：当前目录统计 */}
                                <div className="fm-stats">
                                    <span className="fm-stat"><UIIcon name="FolderOutlined" /><b>{stats.dirs}</b><span className="fm-stat-label">文件夹</span></span>
                                    <span className="fm-stat"><UIIcon name="FileOutlined" /><b>{stats.files}</b><span className="fm-stat-label">文件</span></span>
                                    <span className="fm-stat"><UIIcon name="HddOutlined" /><b>{formatBytes(stats.total)}</b><span className="fm-stat-label">当前目录大小</span></span>
                                </div>

                                {/* 第四层：搜索 / 筛选 / 排序 / 视图切换 */}
                                <div className="fm-toolbar">
                                    <Input
                                        className="fm-search"
                                        allowClear
                                        prefix={<UIIcon name="SearchOutlined" />}
                                        placeholder="搜索文件..."
                                        value={search}
                                        onChange={e => setSearch(e.target.value)}
                                    />
                                    <Select className="fm-select" value={typeFilter} onChange={setTypeFilter} options={TYPE_OPTIONS} />
                                    <Select className="fm-select" value={sortBy} onChange={setSortBy} options={SORT_OPTIONS} />
                                    <Tooltip title={sortOrder === 'asc' ? '升序' : '降序'}>
                                        <Button icon={<UIIcon name={sortOrder === 'asc' ? 'SortAscendingOutlined' : 'SortDescendingOutlined'} />}
                                            onClick={() => setSortOrder(sortOrder === 'asc' ? 'desc' : 'asc')} />
                                    </Tooltip>
                                    {/* 收藏快速跳转：列出全部收藏，点击进入所在目录（文件自动搜索定位） */}
                                    <Dropdown
                                        trigger={['click']}
                                        disabled={!favs.length}
                                        menu={{
                                            items: favs.map(x => ({ key: x.path, icon: <UIIcon name={x.is_dir ? 'FolderOutlined' : 'FileOutlined'} />, label: <span className="fm-fav-item" title={x.path}>{x.path}</span> })),
                                            onClick: ({ key }) => jumpToFav(key)
                                        }}
                                    >
                                        <Button icon={<UIIcon name="StarOutlined" />}>收藏{favs.length ? ` (${favs.length})` : ''}</Button>
                                    </Dropdown>
                                    {/* 只看收藏：过滤当前目录列表 */}
                                    <Tooltip title="只看收藏">
                                        <Button type={favOnly ? 'primary' : 'default'} icon={<UIIcon name={favOnly ? 'StarFilled' : 'StarOutlined'} />}
                                            onClick={() => setFavOnly(!favOnly)} />
                                    </Tooltip>
                                    <div style={{ flex: 1 }} />
                                    <Segmented
                                        value={viewMode}
                                        onChange={setViewMode}
                                        options={[
                                            { value: 'grid', label: <span className="fm-seg"><UIIcon name="AppstoreOutlined" />网格</span> },
                                            { value: 'list', label: <span className="fm-seg"><UIIcon name="BarsOutlined" />列表</span> }
                                        ]}
                                    />
                                </div>

                                {/* 批量操作栏 */}
                                {selected.length > 0 && (
                                    <div className="fm-bulkbar">
                                        <span>已选择 <b>{selected.length}</b> 项</span>
                                        <Space wrap>
                                            <Button size="small" icon={<UIIcon name="CopyOutlined" />} onClick={bulkCopy}>复制路径</Button>
                                            <Button size="small" danger icon={<UIIcon name="DeleteOutlined" />} onClick={bulkDelete}>删除</Button>
                                            <Button size="small" onClick={() => setSelected([])}>取消选择</Button>
                                        </Space>
                                    </div>
                                )}

                                {/* 第五/六层：内容区（网格 / 列表） */}
                                {viewMode === 'grid' ? (
                                    <Spin spinning={loading}>
                                        <div className="fm-grid">
                                            {visibleFiles.slice(0, shown).map(f => f.is_dir ? renderFolderCard(f) : renderFileCard(f))}
                                        </div>
                                        {!loading && !visibleFiles.length && (
                                            <div style={{ textAlign: 'center' }}>
                                                <Empty image={Empty.PRESENTED_IMAGE_SIMPLE} description={favOnly ? '当前目录暂无收藏' : (files.length ? '无匹配文件' : '空目录')} style={{ padding: 40 }} />
                                                <Typography.Text type="secondary" style={{ fontSize: 12 }}>
                                                    把文件拖到页面任意位置即可上传到 媒体目录/{path || '根目录'}
                                                </Typography.Text>
                                            </div>
                                        )}
                                        {visibleFiles.length > shown && (
                                            <div style={{ textAlign: 'center', marginTop: 12 }}>
                                                <Button onClick={() => setShown(shown + 50)}>加载更多（{visibleFiles.length - shown} 项）</Button>
                                            </div>
                                        )}
                                    </Spin>
                                ) : (
                                    <Table
                                        rowKey="path"
                                        columns={listColumns}
                                        dataSource={visibleFiles}
                                        loading={loading}
                                        size="middle"
                                        scroll={{ x: 760 }}
                                        rowSelection={{ selectedRowKeys: selected, onChange: keys => setSelected(keys) }}
                                        pagination={visibleFiles.length > 20 ? { pageSize: 20, showSizeChanger: true, showTotal: t => `共 ${t} 项` } : false}
                                        locale={{ emptyText: favOnly ? '当前目录暂无收藏' : (files.length ? '无匹配文件' : '空目录') }}
                                    />
                                )}
                            </Card>
                        </div>

                        {/* 新建文件夹 Modal（保留原逻辑） */}
                        <Modal title={<Space size={6}><UIIcon name="FolderAddOutlined" />新建文件夹</Space>} open={mkModal} onOk={mkdir} onCancel={() => setMkModal(false)} okText="创建" cancelText="取消">
                            <Input placeholder="请输入文件夹名称" value={mkName} onChange={e => setMkName(e.target.value)} onPressEnter={mkdir} />
                        </Modal>

                        {/* 签发下载令牌 Modal（保留原逻辑） */}
                        <Modal
                            title={<Space size={6} align="top" style={{ maxWidth: '100%' }}><UIIcon name="SafetyCertificateOutlined" style={{ flexShrink: 0, marginTop: 3 }} /><span style={{ wordBreak: 'break-all', lineHeight: 1.5 }}>签发下载令牌：{tokenFile || ''}</span></Space>}
                            open={tokenModal}
                            onCancel={() => setTokenModal(false)}
                            footer={null}
                            width={isMobile ? 'calc(100vw - 24px)' : 560}
                        >
                            <Form form={form} layout="vertical" onFinish={issue}>
                                <Form.Item name="username" label="签发给用户（留空 = 自己）">
                                    <Input placeholder="目标用户名" />
                                </Form.Item>
                                <Space size={12} style={{ display: 'flex' }}>
                                    <Form.Item name="expiry" label="有效期（分钟，留空=30）" style={{ flex: 1 }}>
                                        <InputNumber min={1} max={43200} style={{ width: '100%' }} placeholder="60" />
                                    </Form.Item>
                                    <Form.Item name="quota" label="流量上限（MB，留空=3072）" style={{ flex: 1 }}>
                                        <InputNumber min={1} style={{ width: '100%' }} placeholder="1024" />
                                    </Form.Item>
                                </Space>
                                {tokenResult && (
                                    <Alert
                                        type="success"
                                        showIcon
                                        style={{ marginBottom: 12 }}
                                        message="令牌生成成功"
                                        description={
                                            <div>
                                                <div style={{ marginBottom: 4 }}>
                                                    有效期至 {tokenResult.expires}
                                                    {tokenResult.maxBytes ? <> · 流量上限 {formatBytes(tokenResult.maxBytes)}</> : null}
                                                </div>
                                                <div style={{ marginBottom: 4 }}>
                                                    <Typography.Text type="secondary" style={{ fontSize: 12 }}>该令牌已绑定此文件，下载时不可用于其他文件</Typography.Text>
                                                </div>
                                                <div className="token-url">{tokenResult.url}</div>
                                                <Button size="small" style={{ marginTop: 8 }} onClick={() => {
                                                    navigator.clipboard.writeText(tokenResult.url).then(() => message.success('已复制下载链接'));
                                                }}>📋 复制下载链接</Button>
                                            </div>
                                        }
                                    />
                                )}
                                <div style={{ textAlign: 'right', marginTop: 8 }}>
                                    <Space>
                                        <Button onClick={() => setTokenModal(false)}>关闭</Button>
                                        <Button type="primary" htmlType="submit" loading={issuing}>签发令牌</Button>
                                    </Space>
                                </div>
                            </Form>
                        </Modal>

                        {/* 我的令牌列表 Modal：查看用量/状态，找回自己的下载链接 */}
                        <Modal
                            title={<Space size={6}><UIIcon name="FileDoneOutlined" />我的令牌</Space>}
                            open={tokenListOpen}
                            onCancel={() => setTokenListOpen(false)}
                            footer={<Button onClick={() => setTokenListOpen(false)}>关闭</Button>}
                            width={isMobile ? 'calc(100vw - 24px)' : 820}
                        >
                            <Table
                                rowKey="token_id"
                                size="small"
                                loading={tokenListLoading}
                                dataSource={tokenListData}
                                pagination={{ pageSize: 8, showTotal: t => `共 ${t} 个` }}
                                scroll={{ x: 560 }}
                                locale={{ emptyText: '暂无令牌' }}
                                columns={[
                                    {
                                        title: '文件 / 描述', key: 'desc', ellipsis: true,
                                        render: (_, t) => (
                                            <Tooltip title={t.file_path || t.description}>
                                                <span>{t.file_path || t.description || '-'}</span>
                                            </Tooltip>
                                        )
                                    },
                                    {
                                        title: '流量', key: 'quota', width: 190,
                                        render: (_, t) => (
                                            <div>
                                                <Progress
                                                    percent={t.max_bytes ? Math.min(100, Math.round((t.used_bytes || 0) / t.max_bytes * 100)) : 0}
                                                    size="small"
                                                    status={t.is_active ? 'normal' : 'exception'}
                                                    style={{ marginBottom: 2 }}
                                                />
                                                <Typography.Text type="secondary" style={{ fontSize: 12 }}>
                                                    {formatBytes(t.used_bytes)} / {formatBytes(t.max_bytes)}
                                                </Typography.Text>
                                            </div>
                                        )
                                    },
                                    {
                                        title: '有效期至', key: 'expires', width: 160,
                                        render: (_, t) => <Typography.Text type="secondary" style={{ fontSize: 12 }}>{fmtTime(t.expires_at)}</Typography.Text>
                                    },
                                    {
                                        title: '状态', key: 'status', width: 80,
                                        render: (_, t) => t.is_active ? <Tag color="green">生效中</Tag> : <Tag color="red">已失效</Tag>
                                    },
                                    {
                                        title: '操作', key: 'op', width: 100,
                                        render: (_, t) => (t.is_active && t.token && !t.token.includes('*') && t.file_path)
                                            ? <Button size="small" type="link" onClick={() => copyTokenLink(t)}>复制链接</Button>
                                            : <Typography.Text type="secondary" style={{ fontSize: 12 }}>-</Typography.Text>
                                    }
                                ]}
                            />
                            <Typography.Text type="secondary" style={{ fontSize: 12 }}>
                                提示：他人名下令牌的完整密钥已脱敏，仅自己的令牌可复制下载链接。
                            </Typography.Text>
                        </Modal>

                        {/* 文件详情 Drawer：移动端底部弹出，图片/视频按需加载，视频不自动播放 */}
                        <Drawer
                            title={drawerFile ? <Space size={6}><UIIcon name="FileOutlined" />{drawerFile.name}</Space> : ''}
                            open={!!drawerFile}
                            onClose={() => setDrawerFile(null)}
                            placement={isMobile ? 'bottom' : 'right'}
                            width={isMobile ? undefined : 460}
                            height={isMobile ? '85%' : undefined}
                            footer={drawerFile && (
                                <Space wrap style={{ display: 'flex', justifyContent: 'flex-end' }}>
                                    <Button icon={<UIIcon name="CopyOutlined" />} onClick={() => copyPath(drawerFile.path)}>复制路径</Button>
                                    <Button icon={<UIIcon name={favs.some(x => x.path === drawerFile.path) ? 'StarFilled' : 'StarOutlined'} />}
                                        onClick={() => toggleFav(drawerFile)}>{favs.some(x => x.path === drawerFile.path) ? '取消收藏' : '收藏'}</Button>
                                    <Button danger onClick={() => { const f = drawerFile; setDrawerFile(null); del(f); }}>删除</Button>
                                    <Button type="primary" icon={<UIIcon name="SafetyCertificateOutlined" />} onClick={() => openToken(drawerFile.path)}>签发令牌</Button>
                                </Space>
                            )}
                        >
                            {drawerFile && (
                                <div>
                                    {fileCategory(drawerFile.name) === 'image' && (
                                        <img key={drawerFile.path} className="fm-preview-img" alt={drawerFile.name} src={mediaUrl(drawerFile.path)} />
                                    )}
                                    {fileCategory(drawerFile.name) === 'video' && (
                                        isStreamVideo(drawerFile.name)
                                            ? (tsUnsupported
                                                ? <Alert type="warning" showIcon style={{ marginBottom: 12 }}
                                                    message="当前浏览器不支持在线播放 TS 流"
                                                    description={<Typography.Text>iOS Safari 及部分移动浏览器缺少 MSE 解码能力，无法直接播放 TS 录播。<a href={mediaUrl(drawerFile.path)} download={drawerFile.name}>点此下载原文件</a> 后本地播放，或改用桌面浏览器打开本页。</Typography.Text>} />
                                                : <video key={drawerFile.path} id="fm-ts-player" className="fm-preview-video" controls />)
                                            : <video key={drawerFile.path} className="fm-preview-video" src={mediaUrl(drawerFile.path)} controls preload="metadata" />
                                    )}
                                    {docPreviewKind(drawerFile.name) && (
                                        <OfficePreview key={drawerFile.path} file={drawerFile} />
                                    )}
                                    <Descriptions column={1} size="small" bordered>
                                        <Descriptions.Item label="类型">{CAT_META[fileCategory(drawerFile.name)].label}</Descriptions.Item>
                                        <Descriptions.Item label="大小">{formatBytes(drawerFile.size)}</Descriptions.Item>
                                        <Descriptions.Item label="修改时间">{fmtTime(drawerFile.mod_time)}</Descriptions.Item>
                                        <Descriptions.Item label="完整路径">
                                            <span className="token-url" style={{ display: 'block' }}>{staticUrl(drawerFile.path)}</span>
                                        </Descriptions.Item>
                                    </Descriptions>
                                </div>
                            )}
                        </Drawer>

                        {/* 拖拽上传投放层：拖入文件时全屏提示，悬停到文件夹卡片则改变目标 */}
                        {dragging && (
                            <div className="fm-drop-mask">
                                <div className={'fm-drop-box' + (dropFolder ? ' on-folder' : '')}>
                                    <span className="fm-drop-icon" style={dropFolder ? { color: '#1677ff' } : undefined}>
                                        <UIIcon name={dropFolder ? 'FolderOpenOutlined' : 'CloudUploadOutlined'} />
                                    </span>
                                    <div className="fm-drop-title">{dropFolder ? `释放到「${dropFolder.name}」` : '松开鼠标，上传到当前目录'}</div>
                                    <div className="fm-drop-sub">
                                        目标：媒体目录/{dropFolder ? dropFolder.path : (path || '根目录')}
                                        <br />
                                        可同时拖入多个文件 · 单文件最大 1GB · html / js / sh 等脚本文件不可上传
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* 上传队列面板：总数 / 总进度 / 每个文件进度，可收起，完成后自动可关闭 */}
                        {uploads.length > 0 && (
                            <div className="fm-up-panel">
                                <div className="fm-up-head">
                                    <span className={'fm-up-head-ico' + (upBusy ? '' : (upFailCount ? ' is-error' : ' is-done'))}>
                                        <UIIcon name={upBusy ? 'CloudUploadOutlined' : (upFailCount ? 'ExclamationCircleOutlined' : 'CheckCircleOutlined')} />
                                    </span>
                                    <div className="fm-up-head-text">
                                        <div className="fm-up-title">{upTitleText}</div>
                                        <div className="fm-up-count">
                                            {upDoneCount}/{uploads.length} 已完成{upFailCount ? ` · ${upFailCount} 个失败` : ''} · {formatBytes(upLoadedBytes)} / {formatBytes(upTotalBytes)}
                                        </div>
                                    </div>
                                    <span className="fm-up-total">{upPercent}%</span>
                                    <Tooltip title={upCollapsed ? '展开' : '收起'}>
                                        <Button type="text" size="small"
                                            icon={<UIIcon name={upCollapsed ? 'UpOutlined' : 'DownOutlined'} />}
                                            onClick={() => setUpCollapsed(!upCollapsed)} />
                                    </Tooltip>
                                    {!upBusy && (
                                        <Tooltip title="关闭">
                                            <Button type="text" size="small" icon={<UIIcon name="CloseOutlined" />} onClick={closeUploadPanel} />
                                        </Tooltip>
                                    )}
                                </div>
                                <div className="fm-up-progress">
                                    <i className={upBusy ? '' : (upFailCount ? 'is-error' : 'is-done')} style={{ width: Math.max(2, upPercent) + '%' }} />
                                </div>
                                {!upCollapsed && (
                                    <div className="fm-up-list">
                                        {uploads.map(t => {
                                            const meta = CAT_META[fileCategory(t.name)];
                                            const secs = t.startedAt ? Math.max(0.3, (Date.now() - t.startedAt) / 1000) : 0;
                                            const speed = t.status === 'uploading' && secs ? (t.loaded || 0) / secs : 0;
                                            const pct = t.status === 'done' ? 100 : (t.status === 'error' || t.status === 'canceled' ? 0 : t.percent);
                                            const barCls = t.status === 'done' ? 'is-done' : (t.status === 'error' ? 'is-error' : (t.status === 'canceled' ? 'is-canceled' : ''));
                                            const stateText = t.status === 'uploading' ? t.percent + '%'
                                                : t.status === 'waiting' ? '排队'
                                                    : t.status === 'done' ? '完成'
                                                        : t.status === 'error' ? '失败' : '已取消';
                                            const stateCls = t.status === 'uploading' ? ' is-uploading'
                                                : t.status === 'done' ? ' is-done'
                                                    : t.status === 'error' ? ' is-error' : '';
                                            let sub = '';
                                            if (t.status === 'error') sub = t.error || '上传失败';
                                            else if (t.status === 'waiting') sub = formatBytes(t.size) + ' · 等待上传';
                                            else if (t.status === 'uploading') sub = formatBytes(t.loaded || 0) + ' / ' + formatBytes(t.size) + (speed ? ' · ' + formatBytes(speed) + '/s' : '');
                                            else if (t.status === 'done') sub = formatBytes(t.size) + ' · 已保存到 媒体目录/' + (t.targetPath || '根目录');
                                            else sub = formatBytes(t.size) + ' · 已取消';
                                            return (
                                                <div className="fm-up-item" key={t.id}>
                                                    <span className="fm-up-ico" style={{ color: meta.color }}><UIIcon name={fileIconName(t.name)} /></span>
                                                    <div className="fm-up-main">
                                                        <div className="fm-up-line">
                                                            <span className="fm-up-name" title={t.name}>{t.name}</span>
                                                            <span className={'fm-up-state' + stateCls}>{stateText}</span>
                                                        </div>
                                                        <div className="fm-up-bar"><i className={barCls} style={{ width: pct + '%' }} /></div>
                                                        <div className={'fm-up-sub' + (t.status === 'error' ? ' is-error' : '')}>{sub}</div>
                                                    </div>
                                                    <div className="fm-up-act">
                                                        {t.status === 'error' ? (
                                                            <Tooltip title="重新上传">
                                                                <Button type="text" size="small" icon={<UIIcon name="ReloadOutlined" />} onClick={() => retryUpload(t.id)} />
                                                            </Tooltip>
                                                        ) : (t.status === 'uploading' || t.status === 'waiting') ? (
                                                            <Tooltip title="取消上传">
                                                                <Button type="text" size="small" icon={<UIIcon name="CloseOutlined" />} onClick={() => cancelUpload(t.id)} />
                                                            </Tooltip>
                                                        ) : (
                                                            <Tooltip title="移除记录">
                                                                <Button type="text" size="small" icon={<UIIcon name="CloseOutlined" />} onClick={() => removeUpload(t.id)} />
                                                            </Tooltip>
                                                        )}
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                )}
                            </div>
                        )}

                        {/* 回到顶部：滚动超过 400px 出现，点击平滑滚回页面顶部 */}
                        {auth.ok && <FloatButton.BackTop tooltip="回到顶部" visibilityHeight={400} />}
                    </div>
                </ConfigProvider>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
    <script>
        (function () {
            function getCsrfToken() { var m = document.cookie.match(/(?:^|; )csrf_token=([^;]*)/); return m ? decodeURIComponent(m[1]) : ''; }
            function openPrivateSpace() {
                try {
                    fetch('/api/private/entry', { method: 'POST', headers: { 'X-CSRF-Token': getCsrfToken() }, credentials: 'include' })
                        .then(function (r) { if (r.ok) window.location.href = 'private.html'; })
                        .catch(function () { });
                } catch (e) { window.location.href = 'private.html'; }
            }
            var taps = [], lastTap = 0;
            document.addEventListener('keydown', function (e) {
                if (e.ctrlKey && e.shiftKey && e.altKey && (e.key === 'N' || e.key === 'n')) {
                    e.preventDefault();
                    openPrivateSpace();
                }
            });
            document.addEventListener('click', function (e) {
                var el = e.target;
                while (el && el !== document.documentElement) {
                    if (el.classList && (el.classList.contains('logo') || el.classList.contains('brand'))) {
                        var now = Date.now();
                        if (now - lastTap > 3000) taps = [];
                        lastTap = now;
                        taps.push(now);
                        if (taps.length >= 5) { taps = []; openPrivateSpace(); }
                        return;
                    }
                    el = el.parentElement;
                }
            });
        })();
    </script>
</body>

</html>
