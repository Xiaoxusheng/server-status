<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文件管理 - Server Status</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2">
    <link rel="alternate icon" href="/favicon.ico?v=2" sizes="16x16 32x32 48x48">
    <link rel="stylesheet" href="/ui.css">
    <style>
        html,
        body,
        #root {
            margin: 0;
            min-height: 100%;
            background: #f5f5f5;
        }

        html.dark,
        html.dark body,
        html.dark #root {
            background: #141414;
        }

        html.dark body {
            color: rgba(255, 255, 255, .85);
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f5f5f5;
        }

        ::-webkit-scrollbar-thumb {
            background: #d9d9d9;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #bfbfbf;
        }

        html.dark ::-webkit-scrollbar-track {
            background: #141414;
        }

        html.dark ::-webkit-scrollbar-thumb {
            background: #3a3a3a;
        }

        html.dark ::-webkit-scrollbar-thumb:hover {
            background: #4a4a4a;
        }


        /* 数值等宽：文件大小/时间等数字刷新不跳动 */
        .sp-app .ant-table td,
        .sp-app .fm-size,
        .sp-app .fm-stat b {
            font-variant-numeric: tabular-nums;
        }
    </style>
    <script>
        (function () {
            try {
                var dark = localStorage.getItem('theme') === 'dark';
                document.documentElement.classList.toggle('dark', dark);
            } catch (e) { }
        })();
    </script>
    <script crossorigin src="/react.min.js"></script>
    <script crossorigin
        src="/react-dom.min.js"></script>
    <script src="/dayjs.min.js"></script>
    <script src="/antd.min.js"></script>
    <script src="/ant-design-icons.min.js"></script>
    <script src="/mpegts.js"></script>
    <script src="/babel.min.js"></script>
    <style>
        body {
            margin: 0;
            background: #f5f5f5;
        }

        #root {
            min-height: 100vh;
        }

        .page-wrap {
            padding: 16px;
            max-width: 1800px;
            margin: 0 auto;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            height: 52px;
            background: #fff;
            border-bottom: 1px solid var(--color-border);
        }

        .topbar .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            font-size: 17px;
            color: #1677ff;
        }

        .topbar.dark {
            background: #1f1f1f;
            border-bottom-color: var(--color-border);
        }

        .topbar.dark .brand {
            color: #4096ff;
        }

        .topbar .brand .logo {
            width: 30px;
            height: 30px;
            border-radius: 8px;
            background: var(--color-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 16px;
        }

        .topbar .ant-btn {
            font-size: 13px;
        }

        .topbar .tb-text {
            margin-left: 4px;
        }

        /* 顶栏左上角当前页面名指示 */
        .tb-page {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            font-weight: 600;
            color: rgba(0, 0, 0, 0.88);
            white-space: nowrap;
        }

        html.dark .tb-page {
            color: rgba(255, 255, 255, 0.88);
        }

        .tb-page .anticon {
            color: #1677ff;
        }

        html.dark .tb-page .anticon {
            color: #4096ff;
        }

        .token-url {
            word-break: break-all;
            background: #f5f5f5;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
        }

        /* 暗色模式：避免写死的浅色底在暗色下与浅色文字对比不足 */
        html.dark .token-url {
            background: rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.85);
        }

        /* ===== 文件管理器样式（集中管理） ===== */

        /* 面包屑行：上一级按钮 + 可横向滚动的面包屑（移动端不溢出） */
        .fm-crumb-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
        }

        .fm-crumb {
            overflow-x: auto;
            white-space: nowrap;
            flex: 1;
            min-width: 0;
            scrollbar-width: none;
        }

        .fm-crumb::-webkit-scrollbar {
            display: none;
        }

        .fm-fullpath {
            font-size: 12px;
            margin-bottom: 12px;
            word-break: break-all;
        }

        /* 统计条 */
        .fm-stats {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }

        .fm-stat {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 7px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--card);
            font-size: 13px;
            color: var(--text);
        }

        .fm-stat .anticon {
            color: #1677ff;
            font-size: 16px;
        }

        html.dark .fm-stat .anticon {
            color: #4096ff;
        }

        .fm-stat b {
            font-size: 15px;
        }

        .fm-stat .fm-stat-label {
            color: var(--secondary);
        }

        /* 工具栏：搜索 / 筛选 / 排序 / 视图切换 */
        .fm-toolbar {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }

        .fm-search {
            width: 240px;
        }

        .fm-select {
            min-width: 96px;
        }

        .fm-seg {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 13px;
            padding: 0 2px;
        }

        /* 批量操作栏 */
        .fm-bulkbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            flex-wrap: wrap;
            padding: 8px 12px;
            margin-bottom: 12px;
            border-radius: 8px;
            background: #e6f4ff;
            border: 1px solid #91caff;
            font-size: 13px;
        }

        .sp-app.dark .fm-bulkbar {
            background: rgba(22, 119, 255, 0.12);
            border-color: #153b6f;
        }

        /* 卡片网格 */
        .fm-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 12px;
        }

        /* 文件/文件夹卡片 */
        .fm-card {
            position: relative;
            display: flex;
            flex-direction: column;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px;
            cursor: pointer;
            transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
        }

        .fm-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.08);
            border-color: rgba(22, 119, 255, 0.35);
        }

        .fm-card:active {
            transform: translateY(0) scale(0.995);
        }

        .sp-app.dark .fm-card:hover {
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.45);
            border-color: rgba(64, 150, 255, 0.45);
        }

        .fm-card.fm-checked {
            border-color: #1677ff;
            box-shadow: inset 0 0 0 1px #1677ff;
        }

        /* 卡片顶部媒体区（图标或缩略图） */
        .fm-card-media {
            position: relative;
            height: 104px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            background: #f7f8fa;
            margin-bottom: 10px;
            overflow: hidden;
        }

        .sp-app.dark .fm-card-media {
            background: #262626;
        }

        .fm-media-img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .fm-big-icon {
            font-size: 40px;
            display: inline-flex;
        }

        .fm-folder-icon {
            font-size: 52px;
            color: #1677ff;
        }

        html.dark .fm-folder-icon {
            color: #4096ff;
        }

        /* 卡片左上角多选框 */
        .fm-check {
            position: absolute;
            top: 8px;
            left: 8px;
            z-index: 2;
        }

        .fm-check .ant-checkbox-inner {
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.15);
        }

        /* 卡片右上角收藏星标 */
        .fm-fav {
            position: absolute;
            top: 8px;
            right: 8px;
            z-index: 2;
            font-size: 16px;
            line-height: 1;
            padding: 4px;
            border-radius: 6px;
            color: rgba(0, 0, 0, 0.35);
            background: rgba(255, 255, 255, 0.78);
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.15);
            cursor: pointer;
            transition: color 0.2s, transform 0.15s;
        }

        .fm-fav:hover,
        .fm-fav.on {
            color: #faad14;
        }

        .fm-fav:hover {
            transform: scale(1.12);
        }

        html.dark .fm-fav {
            color: rgba(255, 255, 255, 0.45);
            background: rgba(0, 0, 0, 0.45);
        }

        html.dark .fm-fav.on,
        html.dark .fm-fav:hover {
            color: #faad14;
        }

        /* 列表模式行内收藏星标 */
        .fm-fav-row {
            cursor: pointer;
            font-size: 15px;
            color: rgba(0, 0, 0, 0.25);
            transition: color 0.2s;
        }

        .fm-fav-row:hover,
        .fm-fav-row.on {
            color: #faad14;
        }

        html.dark .fm-fav-row {
            color: rgba(255, 255, 255, 0.3);
        }

        /* 收藏下拉项：长路径省略显示，悬停 title 提示完整路径 */
        .fm-fav-item {
            display: inline-block;
            max-width: 360px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            vertical-align: bottom;
        }

        @media (max-width: 768px) {
            .fm-fav-item {
                max-width: 58vw;
            }
        }

        /* 名称：最多 2 行省略 */
        .fm-name {
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            word-break: break-all;
            line-height: 1.45;
            min-height: 2.9em;
            margin-bottom: 4px;
        }

        /* 元信息：大小 + 时间 */
        .fm-meta {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 6px;
            font-size: 12px;
            color: var(--secondary);
        }

        .fm-size {
            font-weight: 600;
            color: var(--text);
            font-size: 13px;
        }

        /* 卡片底部操作区 */
        .fm-foot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            min-height: 26px;
        }

        /* Drawer 预览（Drawer/Modal 渲染在 body Portal 下，拿不到 .sp-app 的 CSS 变量，需用 html.dark 显式适配暗色） */
        .fm-preview-img {
            width: 100%;
            max-height: 320px;
            object-fit: contain;
            border-radius: 8px;
            margin-bottom: 16px;
            background: #fafafa;
            border: 1px solid var(--color-border);
        }

        html.dark .fm-preview-img {
            background: #1f1f1f;
            border-color: var(--color-border);
        }

        .fm-preview-video {
            width: 100%;
            max-height: 320px;
            border-radius: 8px;
            margin-bottom: 16px;
            background: #000;
        }

        /* 办公文档预览（Drawer 在 body Portal 下，拿不到 .sp-app CSS 变量，暗色用 html.dark 显式适配） */
        .office-wrap {
            max-height: 62vh;
            overflow: auto;
            border: 1px solid #d9d9d9;
            border-radius: 8px;
            padding: 16px;
            background: #fff;
            margin-bottom: 12px;
        }

        html.dark .office-wrap {
            background: #1f1f1f;
            border-color: var(--color-border);
        }

        .office-doc {
            font-size: 14px;
            line-height: 1.7;
            color: #333;
        }

        html.dark .office-doc {
            color: rgba(255, 255, 255, .85);
        }

        .office-doc img {
            max-width: 100%;
        }

        .office-doc h1,
        .office-doc h2,
        .office-doc h3 {
            margin: 12px 0 6px;
        }

        .office-doc p {
            margin: 6px 0;
        }

        .office-doc ul,
        .office-doc ol {
            padding-left: 22px;
        }

        .office-doc table {
            border-collapse: collapse;
            margin: 8px 0;
            width: 100%;
        }

        .office-doc td,
        .office-doc th {
            border: 1px solid #d9d9d9;
            padding: 4px 8px;
            font-size: 12px;
            min-width: 48px;
            white-space: nowrap;
        }

        .office-sheet-name {
            font-weight: 600;
            margin: 14px 0 6px;
            color: #1677ff;
        }

        /* 列表模式名称图标 */
        .fm-td-icon {
            margin-right: 8px;
            display: inline-flex;
            align-items: center;
        }

        /* ===== 拖拽上传：全屏投放提示层 ===== */
        .fm-drop-mask {
            position: fixed;
            inset: 0;
            z-index: 1200;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            pointer-events: none;
            background: rgba(245, 245, 245, .68);
            -webkit-backdrop-filter: blur(3px);
            backdrop-filter: blur(3px);
            animation: fmFade .12s ease-out;
        }

        html.dark .fm-drop-mask {
            background: rgba(20, 20, 20, .76);
        }

        .fm-drop-box {
            width: min(520px, 100%);
            padding: 34px 24px 28px;
            text-align: center;
            border: 2px dashed #91caff;
            border-radius: var(--radius-xl);
            background: var(--card);
            box-shadow: var(--shadow-overlay);
            transition: border-color .15s, background .15s;
        }

        .fm-drop-box.on-folder {
            border-color: #1677ff;
            background: #e6f4ff;
        }

        html.dark .fm-drop-box {
            border-color: #153b6f;
        }

        html.dark .fm-drop-box.on-folder {
            border-color: #4096ff;
            background: #11243c;
        }

        .fm-drop-icon {
            display: inline-flex;
            font-size: 44px;
            line-height: 1;
            color: #1677ff;
            margin-bottom: 14px;
        }

        .fm-drop-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 6px;
            word-break: break-all;
        }

        .fm-drop-sub {
            font-size: 12px;
            color: var(--secondary);
            line-height: 1.6;
            word-break: break-all;
        }

        /* 文件夹卡片：拖拽悬停高亮（投放目标） */
        .fm-card.fm-drop-over {
            border-color: #1677ff;
            box-shadow: inset 0 0 0 1px #1677ff;
            background: #e6f4ff;
            transform: translateY(-2px);
        }

        html.dark .fm-card.fm-drop-over {
            background: #11243c;
            border-color: #4096ff;
            box-shadow: inset 0 0 0 1px #4096ff;
        }

        /* ===== 上传队列面板 ===== */
        .fm-up-panel {
            position: fixed;
            right: 24px;
            bottom: 24px;
            z-index: 1100;
            width: 400px;
            max-width: calc(100vw - 32px);
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-float);
            overflow: hidden;
            animation: fmUpIn .18s ease-out;
        }

        .fm-up-head {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 10px 10px 12px;
        }

        .fm-up-head-ico {
            display: inline-flex;
            font-size: 16px;
            color: #1677ff;
        }

        .fm-up-head-ico.is-error {
            color: #ff4d4f;
        }

        .fm-up-head-ico.is-done {
            color: #52c41a;
        }

        .fm-up-head-text {
            min-width: 0;
            flex: 1;
            line-height: 1.35;
        }

        .fm-up-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .fm-up-count {
            font-size: 12px;
            color: var(--secondary);
            font-variant-numeric: tabular-nums;
        }

        .fm-up-total {
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
            font-variant-numeric: tabular-nums;
            margin-right: 2px;
        }

        /* 总进度条（头部下方 2px 细线） */
        .fm-up-progress {
            height: 2px;
            background: rgba(0, 0, 0, .06);
            overflow: hidden;
        }

        html.dark .fm-up-progress {
            background: rgba(255, 255, 255, .1);
        }

        .fm-up-progress i {
            display: block;
            height: 100%;
            background: #1677ff;
            transition: width .18s ease;
        }

        .fm-up-progress i.is-error {
            background: #ff4d4f;
        }

        .fm-up-progress i.is-done {
            background: #52c41a;
        }

        .fm-up-list {
            max-height: 268px;
            overflow-y: auto;
            border-top: 1px solid var(--border);
        }

        .fm-up-item {
            display: flex;
            align-items: flex-start;
            gap: 9px;
            padding: 9px 10px 9px 12px;
            border-bottom: 1px solid var(--border);
        }

        .fm-up-item:last-child {
            border-bottom: none;
        }

        .fm-up-item:hover {
            background: var(--hover);
        }

        .fm-up-ico {
            flex: none;
            width: 28px;
            height: 28px;
            border-radius: 7px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            background: #fafafa;
            border: 1px solid var(--border);
        }

        html.dark .fm-up-ico {
            background: #262626;
        }

        .fm-up-main {
            flex: 1;
            min-width: 0;
        }

        .fm-up-line {
            display: flex;
            align-items: baseline;
            gap: 8px;
        }

        .fm-up-name {
            flex: 1;
            min-width: 0;
            font-size: 12px;
            font-weight: 600;
            color: var(--text);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .fm-up-state {
            flex: none;
            font-size: 12px;
            color: var(--secondary);
            font-variant-numeric: tabular-nums;
        }

        .fm-up-state.is-uploading {
            color: #1677ff;
        }

        .fm-up-state.is-done {
            color: #52c41a;
        }

        .fm-up-state.is-error {
            color: #ff4d4f;
        }

        html.dark .fm-up-state.is-uploading {
            color: #4096ff;
        }

        .fm-up-bar {
            height: 3px;
            margin: 6px 0 5px;
            border-radius: 2px;
            background: rgba(0, 0, 0, .06);
            overflow: hidden;
        }

        html.dark .fm-up-bar {
            background: rgba(255, 255, 255, .12);
        }

        .fm-up-bar i {
            display: block;
            height: 100%;
            border-radius: 2px;
            background: #1677ff;
            transition: width .18s ease;
        }

        .fm-up-bar i.is-done {
            background: #52c41a;
        }

        .fm-up-bar i.is-error {
            background: #ff4d4f;
        }

        .fm-up-bar i.is-canceled {
            background: #bfbfbf;
        }

        .fm-up-sub {
            font-size: 11px;
            color: var(--secondary);
            line-height: 1.45;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .fm-up-sub.is-error {
            color: #ff4d4f;
            white-space: normal;
            word-break: break-all;
        }

        .fm-up-act {
            flex: none;
            width: 22px;
            display: flex;
            justify-content: flex-end;
        }

        .fm-up-act .ant-btn {
            width: 22px;
            height: 22px;
            min-width: 22px;
            padding: 0;
            color: var(--secondary);
        }

        .fm-up-act .ant-btn:hover {
            color: #1677ff;
        }

        @keyframes fmFade {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes fmUpIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 移动端适配 */
        @media (max-width: 768px) {
            .topbar {
                padding: 8px 12px;
                flex-wrap: wrap;
                gap: 6px 8px;
            }

            .topbar .brand {
                font-size: 14px;
                gap: 6px;
            }

            .topbar .brand .logo {
                width: 26px;
                height: 26px;
                font-size: 14px;
                border-radius: 6px;
            }

            .topbar .ant-space {
                flex-wrap: wrap;
                gap: 6px !important;
            }

            .topbar .ant-btn {
                padding: 4px 8px;
                font-size: 12px;
                height: 30px;
            }

            .topbar .tb-sub {
                display: none;
            }

            .topbar .tb-text {
                display: none;
            }

<body>
    <div id="root"></div>
    <script type="text/babel">
        const { Card, Table, Button, Input, Modal, message, Space, Tag, Breadcrumb, Upload, Typography, ConfigProvider, theme, Form, InputNumber, Select, Alert, Empty, Tooltip, Dropdown, Drawer, Descriptions, Segmented, Checkbox, Spin, Progress, FloatButton } = window.antd;
        const { useState, useEffect, useCallback, useMemo, useRef } = React;
        const { darkAlgorithm } = theme;
        const IconSet = window.icons || {};
        const UIIcon = ({ name, ...props }) => { const C = IconSet[name]; return C ? <C {...props} /> : null; };

        function useIsMobile() {
            const [m, setM] = useState(() => typeof window !== 'undefined' && window.matchMedia('(max-width: 768px)').matches);
            useEffect(() => {
                const q = window.matchMedia('(max-width: 768px)');
                const h = e => setM(e.matches);
                q.addListener(h);
                return () => q.removeListener(h);
            }, []);
            return m;
        }

        const baseUrl = window.location.origin;
        // 静态资源访问基础地址：默认使用同源会话鉴权的媒体流接口（/api/media）。
        // 如部署了独立的公开静态文件服务器，可改为 'https://你的静态服务地址/static/' 实现免登录直链分享。
        const STATIC_BASE = '/api/media?path=';
        const staticUrl = (p) => STATIC_BASE + encodeURIComponent(p);

        // 同源媒体流地址：会话鉴权 + files:manage 权限 + Range 断点支持，用于页面内预览/播放
        const mediaUrl = (p) => baseUrl + '/api/media?path=' + encodeURIComponent(p);

        // TS 直录流扩展名：浏览器原生 <video> 不支持 MPEG-TS，需 mpegts.js 通过 MSE 播放
        const STREAM_EXTS = ['ts', 'mts', 'm2ts'];

        // 判断文件是否为需要 mpegts.js 播放的 TS 流视频
        function isStreamVideo(name) {
            return STREAM_EXTS.includes((name.split('.').pop() || '').toLowerCase());
        }

        // 检测当前浏览器是否具备 mpegts.js 的 MSE 解码能力。
        // iPhone Safari（iOS 17.1 前）及部分移动 WebView 没有 MediaSource，TS 无法在线播放，需降级提示
        function mseSupported() {
            try {
                return !!(window.MediaSource && window.mpegts && window.mpegts.getFeatureList
                    && window.mpegts.getFeatureList().mseLivePlayback);
            } catch (e) { return false; }
        }

        // 读取非 HttpOnly 的 csrf_token Cookie；写请求自动携带，会话 Cookie 由 credentials: include 携带
        function getCsrfToken() { const m = document.cookie.match(/(?:^|; )csrf_token=([^;]*)/); return m ? decodeURIComponent(m[1]) : ''; }
        function secureFetch(url, options = {}) {
            const method = options.method || 'GET';
            const headers = { 'Content-Type': 'application/json', ...(options.headers || {}) };
            if (/^(POST|PUT|PATCH|DELETE)$/i.test(method)) { const tok = getCsrfToken(); if (tok) headers['X-CSRF-Token'] = tok; }
            return fetch(url, { method, headers, credentials: 'include', body: options.body });
        }

        // 根据扩展名判断文件类别（用于图标、颜色、筛选与排序）
        function fileCategory(name) {
            const ext = (name.split('.').pop() || '').toLowerCase();
            // 注意：ts/mts/m2ts 优先识别为视频（TS 直录流），此场景下服务器几乎不存在 TypeScript 文件
            if (['mp4', 'webm', 'mov', 'mkv', 'avi', 'flv', 'm4v', 'ts', 'mts', 'm2ts', 'wmv', 'mpg', 'mpeg', '3gp'].includes(ext)) return 'video';
            if (['jpg', 'jpeg', 'png', 'gif', 'webp', 'bmp', 'svg', 'ico'].includes(ext)) return 'image';
            if (['mp3', 'wav', 'flac', 'aac', 'ogg', 'm4a'].includes(ext)) return 'audio';
            if (['zip', 'rar', '7z', 'tar', 'gz', 'bz2'].includes(ext)) return 'archive';
            if (['pdf', 'txt', 'md', 'doc', 'docx', 'xls', 'xlsx', 'ppt', 'pptx', 'epub'].includes(ext)) return 'doc';
            if (['json', 'html', 'htm', 'css', 'js', 'jsx', 'ts', 'tsx', 'go', 'py', 'java', 'c', 'cpp', 'h', 'sh', 'yml', 'yaml', 'xml', 'sql'].includes(ext)) return 'code';
            return 'other';
        }

        // 类别元数据：图标 / 颜色 / 中文标签
        const CAT_META = {
            folder: { icon: 'FolderOutlined', color: '#1677ff', label: '文件夹' },
            video: { icon: 'VideoCameraOutlined', color: '#722ed1', label: '视频' },
            image: { icon: 'FileImageOutlined', color: '#13c2c2', label: '图片' },
            audio: { icon: 'SoundOutlined', color: '#eb2f96', label: '音频' },
            archive: { icon: 'FileZipOutlined', color: '#fa8c16', label: '压缩包' },
            doc: { icon: 'FileTextOutlined', color: '#52c41a', label: '文档' },
            code: { icon: 'CodeOutlined', color: '#2f54eb', label: '代码' },
            other: { icon: 'FileOutlined', color: '#8c8c8c', label: '文件' }
        };

        // 根据扩展名返回精确图标（在类别图标基础上细化）
        function fileIconName(name) {
            const ext = (name.split('.').pop() || '').toLowerCase();
            if (ext === 'pdf') return 'FilePdfOutlined';
            if (ext === 'md') return 'FileMarkdownOutlined';
            if (ext === 'html' || ext === 'htm') return 'Html5Outlined';
            if (ext === 'exe' || ext === 'msi') return 'WindowsOutlined';
            if (ext === 'apk') return 'AndroidOutlined';
            return CAT_META[fileCategory(name)].icon;
        }

        // ==================== 办公文档在线预览（docx / xlsx / pptx / pdf）====================
        // 文件通过会话鉴权的 /api/media 读取，全部在浏览器本地渲染，不经过任何第三方服务。

        function docPreviewKind(name) {
            const ext = (name.split('.').pop() || '').toLowerCase();
            if (ext === 'docx') return 'docx';
            if (ext === 'doc') return 'doc-legacy';
            if (['xlsx', 'xls', 'csv'].includes(ext)) return 'sheet';
            if (ext === 'pptx') return 'pptx';
            if (ext === 'ppt') return 'ppt-legacy';
            if (ext === 'pdf') return 'pdf';
            return null;
        }

        // 按需加载本地 vendor 脚本（同一地址只加载一次）
        const loadedScripts = {};
        function loadScript(url) {
            if (!loadedScripts[url]) {
                loadedScripts[url] = new Promise((resolve, reject) => {
                    const s = document.createElement('script');
                    s.src = url;
                    s.onload = resolve;
                    s.onerror = () => { delete loadedScripts[url]; reject(new Error('本地渲染组件加载失败')); };
                    document.head.appendChild(s);
                });
            }
            return loadedScripts[url];
        }

        // PPTX 渲染组件按需从 ESM CDN 动态加载（双源兜底，仅加载渲染库本身，文件内容不外发）
        let pptxLibPromise = null;
        function loadPptxLib() {
            if (!pptxLibPromise) {
                const urls = ['https://esm.sh/pptx-preview@1.0.7', 'https://cdn.jsdelivr.net/npm/pptx-preview@1.0.7/+esm'];
                pptxLibPromise = (async () => {
                    let lastErr = null;
                    for (const u of urls) {
                        try { return await import(u); } catch (e) { lastErr = e; }
                    }
                    throw new Error('PPTX 渲染组件加载失败（首次使用需联网）');
                })();
            }
            return pptxLibPromise;
        }

        function OfficePreview({ file }) {
            const kind = docPreviewKind(file.name);
            const [phase, setPhase] = useState('loading'); // loading | ready | error
            const [errText, setErrText] = useState('');
            const [html, setHtml] = useState('');
            const [buf, setBuf] = useState(null);
            const [pdfUrl, setPdfUrl] = useState('');
            const boxRef = useRef(null);

            useEffect(() => {
                let dead = false;
                let objectUrl = '';
                setPhase('loading'); setErrText(''); setHtml(''); setBuf(null); setPdfUrl('');
                (async () => {
                    try {
                        if (kind === 'doc-legacy') throw new Error('旧版 .doc 格式无法在线渲染，请转存为 .docx 后预览');
                        if (kind === 'ppt-legacy') throw new Error('旧版 .ppt 格式无法在线渲染，请转存为 .pptx 后预览');
                        if (file.size > 200 * 1024 * 1024) throw new Error('文件超过 200MB');
                        const resp = await fetch(mediaUrl(file.path));
                        if (!resp.ok) throw new Error('文件读取失败（HTTP ' + resp.status + '）');
                        const arrayBuf = await resp.arrayBuffer();
                        if (dead) return;
                        if (kind === 'pdf') {
                            objectUrl = URL.createObjectURL(new Blob([arrayBuf], { type: 'application/pdf' }));
                            setBuf(arrayBuf); setPdfUrl(objectUrl); setPhase('ready'); return;
                        }
                        if (kind === 'docx') {
                            await loadScript(baseUrl + '/vendor-mammoth.min.js');
                            const r = await window.mammoth.convertToHtml({ arrayBuffer: arrayBuf });
                            if (dead) return;
                            setHtml(r.value || ''); setPhase('ready'); return;
                        }
                        if (kind === 'sheet') {
                            await loadScript(baseUrl + '/vendor-xlsx.full.min.js');
                            const wb = window.XLSX.read(arrayBuf, { type: 'array' });
                            let out = '';
                            wb.SheetNames.forEach(sn => {
                                out += '<div class="office-sheet-name">' + sn + '</div>' + window.XLSX.utils.sheet_to_html(wb.Sheets[sn]);
                            });
                            if (dead) return;
                            setHtml('<div class="office-doc">' + out + '</div>'); setPhase('ready'); return;
                        }
                        // pptx：先进入 ready 渲染出容器，再由下方 effect 挂载预览器
                        setBuf(arrayBuf); setPhase('ready');
                    } catch (e) {
                        if (!dead) { setErrText(e.message || '预览失败'); setPhase('error'); }
                    }
                })();
                return () => {
                    dead = true;
                    if (objectUrl) URL.revokeObjectURL(objectUrl);
                };
            }, [file.path]);

            // PPTX：容器就绪后初始化预览器（按容器宽度自适应）
            useEffect(() => {
                if (phase !== 'ready' || kind !== 'pptx' || !buf || !boxRef.current) return;
                let dead = false;
                (async () => {
                    const mod = await loadPptxLib();
                    if (dead || !boxRef.current) return;
                    boxRef.current.innerHTML = '';
                    const holder = document.createElement('div');
                    boxRef.current.appendChild(holder);
                    const w = Math.max(280, Math.min(920, boxRef.current.clientWidth || 420));
                    const inst = mod.init(holder, { width: w, height: Math.round(w * 0.5625) });
                    await inst.preview(buf);
                })().catch(e => {
                    if (!dead) { setErrText(e.message || 'PPTX 渲染失败'); setPhase('error'); }
                });
                return () => { dead = true; };
            }, [phase, kind, buf]);

            return (
                <div style={{ marginBottom: 12 }}>
                    {phase === 'loading' && (
                        <div style={{ textAlign: 'center', padding: '26px 0' }}>
                            <Spin size="large" />
                            <div style={{ marginTop: 10, color: 'rgba(0,0,0,.45)', fontSize: 13 }}>正在加载预览…</div>
                        </div>
                    )}
                    {phase === 'error' && (
                        <Alert type="warning" showIcon style={{ marginBottom: 4 }}
                            message="无法在线预览"
                            description={<Typography.Text>{errText}。<a href={mediaUrl(file.path)} download={file.name}>下载原文件</a></Typography.Text>} />
                    )}
                    {phase === 'ready' && kind === 'pdf' && (
                        <iframe title="pdf-preview" src={pdfUrl} style={{ width: '100%', height: '62vh', border: '1px solid #d9d9d9', borderRadius: 8, marginBottom: 12 }} />
                    )}
                    {phase === 'ready' && (kind === 'docx' || kind === 'sheet') && (
                        <div className="office-wrap" dangerouslySetInnerHTML={{ __html: html }} />
                    )}
                    {phase === 'ready' && kind === 'pptx' && <div ref={boxRef} className="office-wrap" />}
                </div>
            );
        }

        // 类型筛选下拉选项
        const TYPE_OPTIONS = [
            { value: 'all', label: '全部' },
            { value: 'folder', label: '文件夹' },
            { value: 'video', label: '视频' },
            { value: 'image', label: '图片' },
            { value: 'audio', label: '音频' },
            { value: 'doc', label: '文档' },
            { value: 'archive', label: '压缩包' },
            { value: 'code', label: '代码' },
            { value: 'other', label: '其他' }
        ];

        // 排序字段下拉选项
        const SORT_OPTIONS = [
            { value: 'name', label: '按名称' },
            { value: 'size', label: '按大小' },
            { value: 'mtime', label: '按时间' },
            { value: 'type', label: '按类型' }
        ];

        // 格式化字节数为可读大小
        function formatBytes(bytes) {
            if (!bytes || bytes === 0) return '0 B';
            const k = 1024, sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        // 格式化修改时间为本地展示（secondary 样式由外层控制）
        function fmtTime(v) {
            return v ? new Date(v).toLocaleString('zh-CN', { hour12: false }) : '-';
        }

        function App() {
            const [auth, setAuth] = useState({ loading: true, ok: false, user: null });
            const [isDark, setIsDark] = useState(() => localStorage.getItem('theme') === 'dark');
            const [path, setPath] = useState('');
            const [files, setFiles] = useState([]);
            const [loading, setLoading] = useState(false);
            const [mkModal, setMkModal] = useState(false);
            const [mkName, setMkName] = useState('');
            const [tokenModal, setTokenModal] = useState(false);
            const [tokenFile, setTokenFile] = useState(null);
            const [tokenResult, setTokenResult] = useState(null);
            const [issuing, setIssuing] = useState(false);
            const [form] = Form.useForm();
            const isMobile = useIsMobile();
            const [shown, setShown] = useState(50);
            // 视图模式：默认网格，记忆到 localStorage
            const [viewMode, setViewMode] = useState(() => localStorage.getItem('filesView') === 'list' ? 'list' : 'grid');
            // 搜索关键字（当前目录前端过滤，不修改后端）
            const [search, setSearch] = useState('');
            // 类型筛选
            const [typeFilter, setTypeFilter] = useState('all');
            // 排序字段与方向（文件夹始终优先）
            const [sortBy, setSortBy] = useState('name');
            const [sortOrder, setSortOrder] = useState('asc');
            // 批量选择的 path 列表
            const [selected, setSelected] = useState([]);
            // 文件详情 Drawer
            const [drawerFile, setDrawerFile] = useState(null);
            // mpegts.js 播放器实例（仅 TS 直录流使用）
            const tsPlayerRef = React.useRef(null);
            // 当前 TS 文件在浏览器上无法 MSE 播放（移动端 Safari 等），Drawer 内降级为提示
            const [tsUnsupported, setTsUnsupported] = useState(false);
            // 我的令牌列表 Modal
            const [tokenListOpen, setTokenListOpen] = useState(false);
            const [tokenListLoading, setTokenListLoading] = useState(false);
            const [tokenListData, setTokenListData] = useState([]);
            // 收藏的文件/目录列表（{path,name,is_dir}，后端持久化，登录后从服务端加载）
            const [favs, setFavs] = useState([]);
            // 只看收藏（当前目录过滤开关）
            const [favOnly, setFavOnly] = useState(false);

            // ==================== 上传队列（拖拽 / 多选 / 实时进度） ====================
            // 每个文件单独一个 XHR，才能拿到真实的 upload 进度事件；最多 3 个并发，其余排队。
            const UP_CONCURRENCY = 3;
            const UP_SIZE_LIMIT = 1 << 30; // 与后端一致：单文件 1GB
            const [uploads, setUploads] = useState([]);
            const [upCollapsed, setUpCollapsed] = useState(false);
            // 拖拽投放层
            const [dragging, setDragging] = useState(false);
            const [dropFolder, setDropFolder] = useState(null);
            const uploadsRef = useRef([]);
            const xhrMapRef = useRef({});
            const pathRef = useRef(path);
            const dragDepthRef = useRef(0);
            const dragActiveRef = useRef(false);
            const upRoundRef = useRef(0);
            const upNotifiedRef = useRef(-1);
            pathRef.current = path;

            const syncUploads = () => setUploads(uploadsRef.current);

            const patchUpload = (id, patch) => {
                uploadsRef.current = uploadsRef.current.map(t => t.id === id ? { ...t, ...patch } : t);
                syncUploads();
            };

            // 一轮上传全部结束时刷新列表并提示（用 roundId 避免重复提示）
            const maybeFinishUploads = () => {
                const list = uploadsRef.current;
                if (!list.length) return;
                if (list.some(t => t.status === 'waiting' || t.status === 'uploading')) return;
                if (upNotifiedRef.current === upRoundRef.current) return;
                upNotifiedRef.current = upRoundRef.current;
                const ok = list.filter(t => t.status === 'done').length;
                const fail = list.filter(t => t.status === 'error').length;
                if (ok && !fail) message.success(`已上传 ${ok} 个文件`);
                else if (ok && fail) message.warning(`上传完成：成功 ${ok} 个，失败 ${fail} 个`);
                else if (fail) message.error(`${fail} 个文件上传失败`);
                if (ok) load(pathRef.current);
            };

            // 派发排队中的任务（并发已满时什么都不做，完成一个再派一个）
            const pumpUploads = () => {
                const list = uploadsRef.current;
                const running = list.filter(t => t.status === 'uploading').length;
                const slots = UP_CONCURRENCY - running;
                if (slots <= 0) return;
                list.filter(t => t.status === 'waiting').slice(0, slots).forEach(t => startUpload(t));
            };

            const startUpload = (task) => {
                patchUpload(task.id, { status: 'uploading', percent: 0, loaded: 0, error: '', startedAt: Date.now() });
                const xhr = new XMLHttpRequest();
                xhrMapRef.current[task.id] = xhr;
                // 结束（成功 / 失败 / 取消 / 中断）统一收口：清句柄 → 更新状态 → 派发下一个 → 检查整轮结束
                const settle = (patch) => {
                    delete xhrMapRef.current[task.id];
                    patchUpload(task.id, patch);
                    pumpUploads();
                    maybeFinishUploads();
                };
                xhr.open('POST', baseUrl + '/api/files/upload', true);
                xhr.withCredentials = true;
                const tok = getCsrfToken();
                if (tok) xhr.setRequestHeader('X-CSRF-Token', tok);
                xhr.upload.onprogress = (e) => {
                    if (!e.lengthComputable) return;
                    // 传输阶段最高 99%，等服务端落盘返回 200 才置为 100%
                    const pct = Math.min(99, Math.round(e.loaded / e.total * 100));
                    const cur = uploadsRef.current.find(t => t.id === task.id);
                    // 百分比不变就不 patch，避免整个页面被高频 progress 事件反复重渲染
                    if (!cur || cur.status !== 'uploading' || cur.percent === pct) return;
                    patchUpload(task.id, { percent: pct, loaded: e.loaded });
                };
                xhr.onload = () => {
                    let d = null;
                    try { d = JSON.parse(xhr.responseText || 'null'); } catch (e) { }
                    if (xhr.status >= 200 && xhr.status < 300 && d && d.code === 200) {
                        settle({ status: 'done', percent: 100, loaded: task.size });
                    } else {
                        settle({ status: 'error', percent: 0, error: (d && d.message) || ('上传失败（HTTP ' + xhr.status + '）') });
                    }
                };
                xhr.onerror = () => settle({ status: 'error', percent: 0, error: '网络异常，传输中断' });
                xhr.onabort = () => settle({ status: 'canceled', percent: 0 });
                const fd = new FormData();
                fd.append('path', task.targetPath);
                fd.append('file', task.file, task.name);
                xhr.send(fd);
            };

            // 加入队列：targetPath 为空时上传到当前目录；拖到文件夹卡片上则上传到该目录
            const pushUploads = (fileList, targetPath) => {
                const list = Array.prototype.slice.call(fileList || []);
                if (!list.length) return;
                const target = typeof targetPath === 'string' ? targetPath : pathRef.current;
                const stamp = Date.now().toString(36);
                const added = list.map((f, i) => {
                    const size = f.size || 0;
                    const tooBig = size > UP_SIZE_LIMIT;
                    return {
                        id: stamp + '-' + i + '-' + Math.random().toString(36).slice(2, 6),
                        file: f,
                        name: f.name || '未命名文件',
                        size: size,
                        targetPath: target,
                        percent: 0,
                        loaded: 0,
                        status: tooBig ? 'error' : 'waiting',
                        error: tooBig ? '文件超过 1GB 上限，未上传' : '',
                        startedAt: 0
                    };
                });
                upRoundRef.current += 1;
                upNotifiedRef.current = -1;
                // 新一轮开始时清掉上一轮已完成/已取消的条目，避免面板越积越长
                const keep = uploadsRef.current.filter(t => t.status === 'uploading' || t.status === 'waiting');
                uploadsRef.current = keep.concat(added);
                setUpCollapsed(false);
                syncUploads();
                pumpUploads();
            };

            const retryUpload = (id) => {
                const t = uploadsRef.current.find(x => x.id === id);
                if (!t) return;
                // 超限文件重试也过不去，直接维持错误状态并提示
                if ((t.size || 0) > UP_SIZE_LIMIT) {
                    patchUpload(id, { status: 'error', percent: 0, error: '文件超过 1GB 上限，未上传' });
                    return;
                }
                upRoundRef.current += 1;
                upNotifiedRef.current = -1;
                patchUpload(id, { status: 'waiting', percent: 0, loaded: 0, error: '', startedAt: 0 });
                pumpUploads();
            };

            const cancelUpload = (id) => {
                const xhr = xhrMapRef.current[id];
                if (xhr) { try { xhr.abort(); } catch (e) { } return; }
                patchUpload(id, { status: 'canceled', percent: 0 });
                maybeFinishUploads();
            };

            const removeUpload = (id) => {
                uploadsRef.current = uploadsRef.current.filter(t => t.id !== id);
                syncUploads();
            };

            // 关闭面板：仍有任务在跑时改为收起，等跑完再关
            const closeUploadPanel = () => {
                if (uploadsRef.current.some(t => t.status === 'waiting' || t.status === 'uploading')) { setUpCollapsed(true); return; }
                uploadsRef.current = [];
                syncUploads();
            };

            // 全局拖拽投放：window 上监听（overlay 用 pointer-events:none，不挡 elementFromPoint）
            useEffect(() => {
                const isFileDrag = (e) => {
                    const dt = e.dataTransfer;
                    if (!dt || !dt.types) return false;
                    for (let i = 0; i < dt.types.length; i++) if (dt.types[i] === 'Files') return true;
                    return false;
                };
                const folderAt = (x, y) => {
                    const el = document.elementFromPoint(x, y);
                    const card = el && el.closest ? el.closest('[data-folder-path]') : null;
                    return card ? { path: card.getAttribute('data-folder-path') || '', name: card.getAttribute('data-folder-name') || '' } : null;
                };
                let leaveTimer = null;
                const reset = () => {
                    if (leaveTimer) { clearTimeout(leaveTimer); leaveTimer = null; }
                    dragDepthRef.current = 0;
                    dragActiveRef.current = false;
                    setDragging(false);
                    setDropFolder(null);
                };
                const onDragEnter = (e) => {
                    if (!isFileDrag(e)) return;
                    e.preventDefault();
                    if (leaveTimer) { clearTimeout(leaveTimer); leaveTimer = null; }
                    dragDepthRef.current += 1;
                    if (!dragActiveRef.current) { dragActiveRef.current = true; setDragging(true); }
                };
                const onDragOver = (e) => {
                    if (!isFileDrag(e)) return;
                    e.preventDefault();
                    if (e.dataTransfer) e.dataTransfer.dropEffect = 'copy';
                    if (leaveTimer) { clearTimeout(leaveTimer); leaveTimer = null; }
                    if (!dragDepthRef.current) dragDepthRef.current = 1;
                    if (!dragActiveRef.current) { dragActiveRef.current = true; setDragging(true); }
                    const next = folderAt(e.clientX, e.clientY);
                    setDropFolder(prev => {
                        if (!prev && !next) return prev;
                        if (prev && next && prev.path === next.path) return prev;
                        return next;
                    });
                };
                // 元素间移动时 enter/leave 顺序不保证，深度归零后延迟复位，避免遮罩闪烁
                const onDragLeave = () => {
                    if (!dragDepthRef.current) return;
                    dragDepthRef.current = Math.max(0, dragDepthRef.current - 1);
                    if (dragDepthRef.current === 0) {
                        if (leaveTimer) clearTimeout(leaveTimer);
                        leaveTimer = setTimeout(reset, 80);
                    }
                };
                const onDrop = (e) => {
                    if (!isFileDrag(e)) return;
                    e.preventDefault();
                    const target = folderAt(e.clientX, e.clientY);
                    reset();
                    if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) {
                        pushUploads(e.dataTransfer.files, target ? target.path : pathRef.current);
                    }
                };
                window.addEventListener('dragenter', onDragEnter);
                window.addEventListener('dragover', onDragOver);
                window.addEventListener('dragleave', onDragLeave);
                window.addEventListener('drop', onDrop);
                // 拖出窗口（dragleave 有时不触发）或切走标签页时兜底复位
                window.addEventListener('blur', reset);
                return () => {
                    if (leaveTimer) clearTimeout(leaveTimer);
                    window.removeEventListener('dragenter', onDragEnter);
                    window.removeEventListener('dragover', onDragOver);
                    window.removeEventListener('dragleave', onDragLeave);
                    window.removeEventListener('drop', onDrop);
                    window.removeEventListener('blur', reset);
                };
            }, []);

            const hasPerm = (p) => auth.user && (auth.user.permissions || []).some(x => x === '*' || x === p);

            useEffect(() => {
                secureFetch(baseUrl + '/check-auth')
                    .then(r => r.json())
                    .then(d => {
                        if (d.code === 200) setAuth({ loading: false, ok: true, user: d.user });
                        else window.location.href = 'index.html';
                    })
                    .catch(() => { window.location.href = 'index.html'; });
            }, []);

            // 加载指定目录的文件列表（后端负责路径安全校验）
            const load = useCallback(async (p) => {
                setLoading(true);
                try {
                    const r = await secureFetch(baseUrl + '/api/files?path=' + encodeURIComponent(p));
                    const d = await r.json();
                    if (d.code === 200) {
                        setPath(d.data.path || '');
                        setFiles(d.data.files || []);
                    } else {
                        message.error(d.message || '加载失败');
                    }
                } catch (e) {
                    message.error('加载失败: ' + e.message);
                } finally {
                    setLoading(false);
                }
            }, []);

            useEffect(() => { if (auth.ok) load(''); }, [auth.ok, load]);
            useEffect(() => {
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
                document.documentElement.classList.toggle('dark', isDark);
                document.body.classList.toggle('dark', isDark);
                document.body.style.background = isDark ? '#141414' : '#f5f5f5';
            }, [isDark]);
            useEffect(() => { localStorage.setItem('filesView', viewMode); }, [viewMode]);
            // 收藏 API：加载 / 切换 / 删除均走后端持久化（POST/DELETE 自动带 CSRF 头）
            const loadFavs = useCallback(async () => {
                try {
                    const r = await secureFetch(baseUrl + '/api/files/favorites');
                    const d = await r.json();
                    if (d.code !== 200) return;
                    const list = d.data || [];
                    if (list.length) { setFavs(list); return; }
                    // 一次性迁移：服务端为空且本地有旧版 localStorage 收藏时自动上传
                    let local = [];
                    try { local = JSON.parse(localStorage.getItem('fileFavs') || '[]'); } catch (e) { }
                    if (!Array.isArray(local) || !local.length) { setFavs([]); return; }
                    for (const x of local) {
                        if (!x || !x.path) continue;
                        try { await secureFetch(baseUrl + '/api/files/favorites', { method: 'POST', body: JSON.stringify({ path: x.path, name: x.name || x.path, is_dir: !!x.is_dir }) }); } catch (e) { }
                    }
                    localStorage.removeItem('fileFavs');
                    const r2 = await secureFetch(baseUrl + '/api/files/favorites');
                    const d2 = await r2.json();
                    if (d2.code === 200) setFavs(d2.data || []);
                } catch (e) { message.error('加载收藏失败: ' + e.message); }
            }, []);
            useEffect(() => { if (auth.ok) loadFavs(); }, [auth.ok, loadFavs]);
            // 目录 / 搜索 / 筛选 / 排序 / 收藏过滤变化时重置「加载更多」与选中状态
            useEffect(() => { setShown(50); setSelected([]); }, [path, search, typeFilter, sortBy, sortOrder, favOnly]);

            // 前端过滤 + 排序（useMemo 避免频繁重算；文件夹始终排在文件前）
            const visibleFiles = useMemo(() => {
                const kw = search.trim().toLowerCase();
                let list = files.filter(f => {
                    if (kw && !f.name.toLowerCase().includes(kw)) return false;
                    if (favOnly && !favs.some(x => x.path === f.path)) return false;
                    if (typeFilter !== 'all') {
                        const c = f.is_dir ? 'folder' : fileCategory(f.name);
                        if (c !== typeFilter) return false;
                    }
                    return true;
                });
                const dir = sortOrder === 'asc' ? 1 : -1;
                list = [...list].sort((a, b) => {
                    if (a.is_dir !== b.is_dir) return a.is_dir ? -1 : 1;
                    let r = 0;
                    if (sortBy === 'size') r = (a.size || 0) - (b.size || 0);
                    else if (sortBy === 'mtime') r = new Date(a.mod_time || 0) - new Date(b.mod_time || 0);
                    else if (sortBy === 'type') r = fileCategory(a.name).localeCompare(fileCategory(b.name)) || a.name.localeCompare(b.name, 'zh-CN');
                    else r = a.name.localeCompare(b.name, 'zh-CN');
                    return r * dir;
                });
                return list;
            }, [files, search, typeFilter, sortBy, sortOrder, favOnly, favs]);

            // 滚动接近底部（400px 内）时自动追加渲染数量（节流 300ms 防连触翻倍）；
            // 自动加载未触发或失败时，仍保留下方「加载更多」按钮手动兜底
            const autoMoreTsRef = useRef(0);
            useEffect(() => {
                const onScroll = () => {
                    const now = Date.now();
                    if (now - autoMoreTsRef.current < 300) return;
                    const doc = document.documentElement;
                    if (window.innerHeight + window.scrollY >= doc.scrollHeight - 400 && visibleFiles.length > shown) {
                        autoMoreTsRef.current = now;
                        setShown(s => s + 50);
                    }
                };
                window.addEventListener('scroll', onScroll, { passive: true });
                return () => window.removeEventListener('scroll', onScroll);
            }, [visibleFiles.length, shown]);

            // 当前目录统计（仅统计本次 API 返回的 files，不扫描服务器）
            const stats = useMemo(() => {
                let dirs = 0, fc = 0, total = 0;
                files.forEach(f => { if (f.is_dir) dirs++; else { fc++; total += f.size || 0; } });
                return { dirs, files: fc, total };
            }, [files]);

            // TS 直录流：打开 Drawer 时创建 mpegts.js 播放器（MSE 解码 MPEG-TS），关闭/切换时销毁避免资源泄漏
            useEffect(() => {
                const f = drawerFile;
                if (!f || !isStreamVideo(f.name)) return;
                // 能力不足（iOS Safari 等无 MSE）时降级为提示，不再静默黑屏
                if (!mseSupported()) { setTsUnsupported(true); return; }
                setTsUnsupported(false);
                const videoEl = document.getElementById('fm-ts-player');
                if (!videoEl) return;
                let player;
                try {
                    player = window.mpegts.createPlayer({
                        type: 'mpegts',
                        isLive: false,
                        url: mediaUrl(f.path)
                    }, {
                        enableWorker: false,
                        lazyLoad: true,
                        lazyLoadMaxDuration: 180,
                        autoCleanupSourceBuffer: true
                    });
                } catch (e) {
                    // 创建失败（如 MSE 存在但编解码不受支持）：降级提示
                    setTsUnsupported(true);
                    return;
                }
                tsPlayerRef.current = player;
                player.attachMediaElement(videoEl);
                player.load();
                return () => {
                    try { player.destroy(); } catch (e) { /* 忽略销毁异常 */ }
                    tsPlayerRef.current = null;
                };
            }, [drawerFile]);

            if (auth.loading) {
                return <div style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                    <Card loading style={{ width: 320 }} />
                </div>;
            }

            if (!hasPerm('files:manage')) {
                return <ConfigProvider theme={{ algorithm: isDark ? darkAlgorithm : undefined, token: { colorBgLayout: isDark ? '#141414' : '#f5f5f5', colorBgContainer: isDark ? '#1f1f1f' : '#ffffff' } }}>
                    <div style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', background: isDark ? '#141414' : '#f5f5f5' }}>
                        <Card style={{ width: 380, textAlign: 'center' }}>
                            <div style={{ fontSize: 48 }}>🚫</div>
                            <Typography.Title level={4}>没有访问权限</Typography.Title>
                            <Typography.Text type="secondary">当前账号没有「管理文件」权限，请联系管理员开通。</Typography.Text>
                            <div style={{ marginTop: 16 }}>
                                <Button type="primary" onClick={() => window.location.href = 'index.html'}>返回首页</Button>
                            </div>
                        </Card>
                    </div>
                </ConfigProvider>;
            }

            // 面包屑：根目录 + 逐级路径（均可点击跳转）
            const parts = path ? path.split('/') : [];
            const breadcrumbItems = [{ title: <a onClick={() => load('')}><UIIcon name="HomeOutlined" /> 根目录</a> }];
            let acc = '';
            parts.forEach((p, i) => {
                acc += (i === 0 ? '' : '/') + p;
                const isLast = i === parts.length - 1;
                breadcrumbItems.push({
                    title: isLast ? <span>{p}</span> : <a onClick={() => load(acc)}>{p}</a>
                });
            });

            // 返回上一级目录（根目录时按钮不显示）
            const goUp = () => {
                const pp = path ? path.split('/') : [];
                pp.pop();
                load(pp.join('/'));
            };

            // 切换某个项目的选中状态（批量操作用）
            const toggleSelect = (p) => {
                setSelected(prev => prev.includes(p) ? prev.filter(x => x !== p) : [...prev, p]);
            };

            // 切换收藏状态（传入文件/目录条目对象；乐观更新 UI 后同步服务端，失败回滚）
            const toggleFav = (f) => {
                const had = favs.some(x => x.path === f.path);
                const entry = { path: f.path, name: f.name, is_dir: !!f.is_dir };
                setFavs(v => had ? v.filter(x => x.path !== f.path) : [...v, entry]);
                const req = had
                    ? secureFetch(baseUrl + '/api/files/favorites?path=' + encodeURIComponent(f.path), { method: 'DELETE' })
                    : secureFetch(baseUrl + '/api/files/favorites', { method: 'POST', body: JSON.stringify(entry) });
                req.catch(() => {
                    setFavs(v => had ? [...v, entry] : v.filter(x => x.path !== f.path));
                    message.error(had ? '取消收藏失败' : '收藏失败');
                });
            };

            // 从收藏下拉快速跳转：目录直接进入；文件进入其所在目录并自动填充搜索关键字定位
            const jumpToFav = async (p) => {
                const item = favs.find(x => x.path === p);
                const segs = p.split('/');
                const name = segs[segs.length - 1];
                const parent = segs.slice(0, -1).join('/');
                if (item && item.is_dir) { setSearch(''); await load(p); return; }
                if (parent === path) { setSearch(name); return; }
                await load(parent);
                setSearch(name);
            };

            // 文件卡片的 [...] 下拉菜单（详情 / 复制路径 / 签发令牌 / 删除）
            const fileMenu = (f) => ({
                items: [
                    { key: 'detail', icon: <UIIcon name="EyeOutlined" />, label: '查看详情' },
                    { key: 'copy', icon: <UIIcon name="CopyOutlined" />, label: '复制文件路径' },
                    { key: 'fav', icon: <UIIcon name={favs.some(x => x.path === f.path) ? 'StarFilled' : 'StarOutlined'} />, label: favs.some(x => x.path === f.path) ? '取消收藏' : '收藏' },
                    { key: 'token', icon: <UIIcon name="SafetyCertificateOutlined" />, label: '签发下载令牌' },
                    { type: 'divider' },
                    { key: 'del', icon: <UIIcon name="DeleteOutlined" />, label: '删除文件', danger: true }
                ],
                onClick: ({ key }) => {
                    if (key === 'detail') setDrawerFile(f);
                    else if (key === 'copy') copyPath(f.path);
                    else if (key === 'fav') toggleFav(f);
                    else if (key === 'token') openToken(f.path);
                    else if (key === 'del') del(f);
                }
            });

            // 文件夹卡片的 [...] 下拉菜单（打开 / 删除目录）
            const dirMenu = (f) => ({
                items: [
                    { key: 'open', icon: <UIIcon name="FolderOpenOutlined" />, label: '打开目录' },
                    { key: 'fav', icon: <UIIcon name={favs.some(x => x.path === f.path) ? 'StarFilled' : 'StarOutlined'} />, label: favs.some(x => x.path === f.path) ? '取消收藏' : '收藏' },
                    { type: 'divider' },
                    { key: 'del', icon: <UIIcon name="DeleteOutlined" />, label: '删除目录', danger: true }
                ],
                onClick: ({ key }) => {
                    if (key === 'open') load(f.path);
                    else if (key === 'fav') toggleFav(f);
                    else if (key === 'del') del(f);
                }
            });

            // 选择文件后统一交给上传队列（并发控制 / 进度 / 失败重试）
            const uploadProps = {
                multiple: true,
                showUploadList: false,
                customRequest: ({ file, onSuccess }) => {
                    pushUploads([file]);
                    if (onSuccess) onSuccess({}, file);
                }
            };

            // 删除文件/目录（保留原确认 Modal 与 DELETE API）
            const del = (rec) => {
                Modal.confirm({
                    title: rec.is_dir ? '删除目录' : '删除文件',
                    content: `确定删除「${rec.path}」吗？${rec.is_dir ? '（仅限空目录）' : '此操作不可恢复。'}`,
                    okText: '删除',
                    okButtonProps: { danger: true },
                    cancelText: '取消',
                    onOk: async () => {
                        try {
                            const r = await secureFetch(baseUrl + '/api/files?path=' + encodeURIComponent(rec.path), { method: 'DELETE' });
                            const d = await r.json();
                            if (d.code === 200) {
                                setFavs(v => v.filter(x => x.path !== rec.path));
                                secureFetch(baseUrl + '/api/files/favorites?path=' + encodeURIComponent(rec.path), { method: 'DELETE' }).catch(() => { });
                                message.success('删除成功');
                                load(path);
                            }
                            else message.error(d.message || '删除失败');
                        } catch (e) {
                            message.error('删除失败: ' + e.message);
                        }
                    }
                });
            };

            // 批量复制所选文件的访问路径（文件夹跳过）
            const bulkCopy = () => {
                const recs = files.filter(f => selected.includes(f.path) && !f.is_dir);
                if (!recs.length) { message.info('所选项目中没有可复制的文件'); return; }
                const text = recs.map(f => staticUrl(f.path)).join('\n');
                navigator.clipboard.writeText(text)
                    .then(() => message.success(`已复制 ${recs.length} 个文件路径`))
                    .catch(() => Modal.info({ title: '文件路径', content: <div className="token-url">{text}</div> }));
            };

            // 批量删除：逐项调用现有 DELETE API，完成后统一刷新
            const bulkDelete = () => {
                const targets = files.filter(f => selected.includes(f.path));
                if (!targets.length) { message.warning('请先选择要删除的项目'); return; }
                Modal.confirm({
                    title: '批量删除',
                    content: `确定删除已选择的 ${targets.length} 项吗？文件夹仅限空目录，此操作不可恢复。`,
                    okText: '删除',
                    okButtonProps: { danger: true },
                    cancelText: '取消',
                    onOk: async () => {
                        let ok = 0, fail = 0;
                        for (const t of targets) {
                            try {
                                const r = await secureFetch(baseUrl + '/api/files?path=' + encodeURIComponent(t.path), { method: 'DELETE' });
                                const d = await r.json();
                                if (d.code === 200) ok++; else fail++;
                            } catch (e) { fail++; }
                        }
                        if (ok) message.success(`已删除 ${ok} 项`);
                        if (fail) message.error(`${fail} 项删除失败`);
                        setFavs(v => v.filter(x => !targets.some(t => t.path === x.path)));
                        for (const t of targets) {
                            secureFetch(baseUrl + '/api/files/favorites?path=' + encodeURIComponent(t.path), { method: 'DELETE' }).catch(() => { });
                        }
                        setSelected([]);
                        load(path);
                    }
                });
            };

            // 复制单个文件的访问路径（保留原逻辑）
            const copyPath = (p) => {
                const full = staticUrl(p);
                navigator.clipboard.writeText(full).then(() => message.success('已复制文件路径'))
                    .catch(() => { Modal.info({ title: '文件路径', content: <div className="token-url">{full}</div> }); });
            };

            // 打开签发令牌 Modal
            const openToken = (p) => {
                setTokenFile(p);
                setTokenResult(null);
                form.resetFields();
                setTokenModal(true);
            };

            // 签发下载令牌（保留原有 API 与参数逻辑；新增 file_path 令牌与文件绑定）
            const issue = async () => {
                const v = await form.validateFields();
                const body = { description: '文件: ' + tokenFile, file_path: tokenFile };
                if (v.username) body.username = v.username;
                if (v.expiry) body.expires_in = v.expiry;
                if (v.quota) body.max_bytes = v.quota * 1024 * 1024;
                setIssuing(true);
                try {
                    const r = await secureFetch(baseUrl + '/generate-download-token', { method: 'POST', body: JSON.stringify(body) });
                    const d = await r.json();
                    if (d.code === 200) {
                        const data = d.data;
                        const url = baseUrl + '/download.html?token_id=' + encodeURIComponent(data.token_id) +
                            '&token=' + encodeURIComponent(data.token) + '&file=' + encodeURIComponent(tokenFile);
                        setTokenResult({ url, expires: data.expires_at, maxBytes: data.max_bytes });
                    } else {
                        message.error(d.message || '签发失败');
                    }
                } catch (e) {
                    message.error('签发失败: ' + e.message);
                } finally {
                    setIssuing(false);
                }
            };

            // 打开「我的令牌」列表并加载（后端按 token:issue / token:view 权限放行）
            const openTokenList = async () => {
                setTokenListOpen(true);
                setTokenListLoading(true);
                try {
                    const r = await secureFetch(baseUrl + '/list-download-tokens');
                    const d = await r.json();
                    if (d.code === 200) setTokenListData(d.data || []);
                    else { message.error(d.message || '获取令牌列表失败'); setTokenListData([]); }
                } catch (e) {
                    message.error('获取令牌列表失败: ' + e.message);
                    setTokenListData([]);
                } finally {
                    setTokenListLoading(false);
                }
            };

            // 复制令牌对应的下载页链接（仅令牌所有者可见完整 token 时可用）
            const copyTokenLink = (t) => {
                if (!t.file_path) { message.info('该令牌未绑定文件，无法生成链接'); return; }
                const url = baseUrl + '/download.html?token_id=' + encodeURIComponent(t.token_id) +
                    '&token=' + encodeURIComponent(t.token) + '&file=' + encodeURIComponent(t.file_path);
                navigator.clipboard.writeText(url).then(() => message.success('已复制下载链接'))
                    .catch(() => Modal.info({ title: '下载链接', content: <div className="token-url">{url}</div> }));
            };

            // 新建文件夹（保留原有 API 与路径拼接逻辑）
            const mkdir = async () => {
                const name = mkName.trim();
                if (!name) { message.warning('请输入文件夹名称'); return; }
                const p = path ? path + '/' + name : name;
                try {
                    const r = await secureFetch(baseUrl + '/api/files/mkdir', { method: 'POST', body: JSON.stringify({ path: p }) });
                    const d = await r.json();
                    if (d.code === 200) { message.success('目录创建成功'); setMkModal(false); setMkName(''); load(path); }
                    else message.error(d.message || '创建失败');
                } catch (e) {
                    message.error('创建失败: ' + e.message);
                }
            };

            // 渲染文件夹卡片：点击整体进入目录，checkbox 与 [...] 均不触发进入
            const renderFolderCard = (f) => {
                const checked = selected.includes(f.path);
                const faved = favs.some(x => x.path === f.path);
                return (
                    <div key={f.path}
                        data-folder-path={f.path}
                        data-folder-name={f.name}
                        className={'fm-card' + (checked ? ' fm-checked' : '') + (dropFolder && dropFolder.path === f.path ? ' fm-drop-over' : '')}
                        onClick={() => load(f.path)}>
                        <div className="fm-card-media">
                            <Checkbox className="fm-check" checked={checked} onClick={e => e.stopPropagation()} onChange={() => toggleSelect(f.path)} />
                            <Tooltip title={faved ? '取消收藏' : '收藏'} placement="left">
                                <span className={'fm-fav' + (faved ? ' on' : '')} onClick={e => { e.stopPropagation(); toggleFav(f); }}>
                                    <UIIcon name={faved ? 'StarFilled' : 'StarOutlined'} />
                                </span>
                            </Tooltip>
                            <span className="fm-big-icon fm-folder-icon"><UIIcon name="FolderOutlined" /></span>
                        </div>
                        <Tooltip title={f.name} placement="top">
                            <div className="fm-name">{f.name}</div>
                        </Tooltip>
                        <div className="fm-meta">
                            <span>文件夹</span>
                            <span>{fmtTime(f.mod_time)}</span>
                        </div>
                        <div className="fm-foot">
                            <Typography.Text type="secondary" style={{ fontSize: 12 }}>点击进入</Typography.Text>
                            <Dropdown menu={dirMenu(f)} trigger={['click']}>
                                <Button size="small" icon={<UIIcon name="MoreOutlined" />} onClick={e => e.stopPropagation()} />
                            </Dropdown>
                        </div>
                    </div>
                );
            };

            // 渲染文件卡片：主体点击打开详情 Drawer，图片显示懒加载缩略图（失败回退图标）
            const renderFileCard = (f) => {
                const cat = fileCategory(f.name);
                const meta = CAT_META[cat];
                const checked = selected.includes(f.path);
                const faved = favs.some(x => x.path === f.path);
                return (
                    <div key={f.path} className={'fm-card' + (checked ? ' fm-checked' : '')} onClick={() => setDrawerFile(f)}>
                        <div className="fm-card-media">
                            <Checkbox className="fm-check" checked={checked} onClick={e => e.stopPropagation()} onChange={() => toggleSelect(f.path)} />
                            <Tooltip title={faved ? '取消收藏' : '收藏'} placement="left">
                                <span className={'fm-fav' + (faved ? ' on' : '')} onClick={e => { e.stopPropagation(); toggleFav(f); }}>
                                    <UIIcon name={faved ? 'StarFilled' : 'StarOutlined'} />
                                </span>
                            </Tooltip>
                            <span className="fm-big-icon" style={{ color: meta.color }}><UIIcon name={fileIconName(f.name)} /></span>
                            {cat === 'image' && (
                                <img className="fm-media-img" loading="lazy" alt={f.name}
                                    src={mediaUrl(f.path)}
                                    onError={e => { e.currentTarget.style.display = 'none'; }} />
                            )}
                        </div>
                        <Tooltip title={f.name} placement="top">
                            <div className="fm-name">{f.name}</div>
                        </Tooltip>
                        <div className="fm-meta">
                            <span className="fm-size">{formatBytes(f.size)}</span>
                            <span>{fmtTime(f.mod_time)}</span>
                        </div>
                        <div className="fm-foot">
                            <Button size="small" type="primary" ghost icon={<UIIcon name="SafetyCertificateOutlined" />}
                                onClick={e => { e.stopPropagation(); openToken(f.path); }}>签发令牌</Button>
                            <Dropdown menu={fileMenu(f)} trigger={['click']}>
                                <Button size="small" icon={<UIIcon name="MoreOutlined" />} onClick={e => e.stopPropagation()} />
                            </Dropdown>
                        </div>
                    </div>
                );
            };

            // 列表模式列定义（保留 Table，样式精简 + 下拉操作）
            const listColumns = [
                {
                    title: '', key: 'fav', width: 36,
                    render: (_, rec) => {
                        const faved = favs.some(x => x.path === rec.path);
                        return (
                            <Tooltip title={faved ? '取消收藏' : '收藏'}>
                                <span className={'fm-fav-row' + (faved ? ' on' : '')} onClick={() => toggleFav(rec)}>
                                    <UIIcon name={faved ? 'StarFilled' : 'StarOutlined'} />
                                </span>
                            </Tooltip>
                        );
                    }
                },
                {
                    title: '名称', dataIndex: 'name', key: 'name',
                    render: (v, rec) => rec.is_dir
                        ? <a onClick={() => load(rec.path)}><span className="fm-td-icon" style={{ color: '#1677ff' }}><UIIcon name="FolderOutlined" /></span>{v}</a>
                        : <a onClick={() => setDrawerFile(rec)}><span className="fm-td-icon" style={{ color: CAT_META[fileCategory(rec.name)].color }}><UIIcon name={fileIconName(rec.name)} /></span>{v}</a>
                },
                { title: '类型', key: 'type', width: 96, render: (_, rec) => <Tag style={{ margin: 0 }}>{CAT_META[rec.is_dir ? 'folder' : fileCategory(rec.name)].label}</Tag> },
                { title: '大小', dataIndex: 'size', width: 110, render: (v, rec) => rec.is_dir ? '-' : <span className="fm-size">{formatBytes(v)}</span> },
                { title: '修改时间', dataIndex: 'mod_time', width: 170, render: v => <Typography.Text type="secondary">{fmtTime(v)}</Typography.Text> },
                {
                    title: '操作', key: 'op', width: 190, fixed: 'right',
                    render: (_, rec) => rec.is_dir
                        ? <Space>
                            <Button size="small" onClick={() => load(rec.path)}>打开</Button>
                            <Dropdown menu={dirMenu(rec)} trigger={['click']}><Button size="small" icon={<UIIcon name="MoreOutlined" />} /></Dropdown>
                        </Space>
                        : <Space wrap>
                            <Button size="small" type="primary" ghost icon={<UIIcon name="SafetyCertificateOutlined" />} onClick={() => openToken(rec.path)}>签发令牌</Button>
                            <Dropdown menu={fileMenu(rec)} trigger={['click']}><Button size="small" icon={<UIIcon name="MoreOutlined" />} /></Dropdown>
                        </Space>
                }
            ];

            // 上传队列汇总（面板头部与总进度条使用）
            const upBusy = uploads.some(t => t.status === 'waiting' || t.status === 'uploading');
            const upDoneCount = uploads.filter(t => t.status === 'done').length;
            const upFailCount = uploads.filter(t => t.status === 'error').length;
            const upTotalBytes = uploads.reduce((s, t) => s + (t.size || 0), 0);
            const upLoadedBytes = uploads.reduce((s, t) => s + (t.status === 'done' ? (t.size || 0) : (t.loaded || 0)), 0);
            const upPercent = upTotalBytes ? Math.min(100, Math.round(upLoadedBytes / upTotalBytes * 100)) : (upBusy ? 0 : 100);
            const upTitleText = upBusy ? '正在上传…' : (upFailCount ? '部分文件上传失败' : '上传完成');

            return (
                <ConfigProvider theme={{ algorithm: isDark ? darkAlgorithm : undefined, token: { colorBgLayout: isDark ? '#141414' : '#f5f5f5', colorBgContainer: isDark ? '#1f1f1f' : '#ffffff' } }}>
