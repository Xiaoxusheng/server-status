<body>
    <div id="root"></div>
    <script type="text/babel">
        const { Card, Table, Button, Input, Select, Tag, Space, message, Modal, Drawer, Popconfirm, ConfigProvider,
            theme, Typography, Badge, Alert, Tooltip, Dropdown, Segmented, Progress, Empty, Descriptions, Divider,
            Tree, Statistic, Row, Col } = window.antd;
        const { useState, useEffect, useRef, useCallback, useMemo } = React;
        const { darkAlgorithm } = theme;
        const IconSet = window.icons || {};

        const baseUrl = window.location.origin;

        const UIIcon = ({ name, ...props }) => {
            const C = IconSet[name];
            return C ? <C {...props} /> : null;
        };

        function useIsMobile() {
            const [m, setM] = useState(() => typeof window !== 'undefined' && window.matchMedia('(max-width: 768px)').matches);
            useEffect(() => {
                const q = window.matchMedia('(max-width: 768px)');
                const h = e => setM(e.matches);
                q.addListener(h);
                return () => q.removeListener(h);
            }, []);
            return m;
        }

        // 读取非 HttpOnly 的 csrf_token Cookie；写请求自动携带，会话 Cookie 由 credentials: include 携带
        function getCsrfToken() { const m = document.cookie.match(/(?:^|; )csrf_token=([^;]*)/); return m ? decodeURIComponent(m[1]) : ''; }
        function secureFetch(url, options = {}) {
            const method = options.method || 'GET';
            const headers = { 'Content-Type': 'application/json', ...(options.headers || {}) };
            if (/^(POST|PUT|PATCH|DELETE)$/i.test(method)) { const tok = getCsrfToken(); if (tok) headers['X-CSRF-Token'] = tok; }
            return fetch(url, { method, headers, credentials: 'include', body: options.body });
        }
        async function api(path, method, body) {
            const r = await secureFetch(baseUrl + path, { method: method || 'GET', body: body ? JSON.stringify(body) : undefined });
            const d = await r.json();
            if (!r.ok || d.code !== 200) throw new Error(d.message || ('请求失败 (' + r.status + ')'));
            return d.data;
        }

        // etime → 秒
        const etimeSec = (s) => {
            if (!s) return 0;
            let days = 0, rest = String(s);
            const i = rest.indexOf('-');
            if (i > 0) { days = parseInt(rest.slice(0, i), 10) || 0; rest = rest.slice(i + 1); }
            const parts = rest.split(':').map(Number);
            if (parts.length === 2) return days * 86400 + parts[0] * 60 + (parts[1] || 0);
            if (parts.length === 3) return days * 86400 + parts[0] * 3600 + parts[1] * 60 + (parts[2] || 0);
            return 0;
        };
        const fmtRuntime = (s) => {
            const sec = etimeSec(s);
            if (!sec) return '-';
            const d = Math.floor(sec / 86400);
            const h = Math.floor((sec % 86400) / 3600);
            const m = Math.floor((sec % 3600) / 60);
            if (d > 0) return d + 'd ' + h + 'h';
            if (h > 0) return h + 'h ' + m + 'm';
            return m + 'm';
        };
        const fmtTime = (s) => s ? new Date(s).toLocaleString('zh-CN', { hour12: false }) : '-';

        const STATUS_TEXT = { running: '运行中', sleeping: '睡眠', zombie: '僵尸', stopped: '已停止', uninterruptible: '不可中断', dead: '已结束', unknown: '未知' };
        const STATUS_BADGE = { running: 'success', sleeping: 'default', zombie: 'error', stopped: 'warning', uninterruptible: 'processing', dead: 'default', unknown: 'default' };

        const cpuColor = (v) => v >= 90 ? '#ff4d4f' : v >= 80 ? '#fa541c' : v >= 50 ? '#faad14' : '#1677ff';
        const memColor = (v) => v >= 85 ? '#ff4d4f' : v >= 70 ? '#faad14' : '#52c41a';

        function App() {
            const [auth, setAuth] = useState({ loading: true, ok: false, user: null });
            const [isDark, setIsDark] = useState(() => localStorage.getItem('theme') === 'dark');
            const [procs, setProcs] = useState([]);
            const [loading, setLoading] = useState(false);
            const [loadedAt, setLoadedAt] = useState(null);
            const [connOk, setConnOk] = useState(true);
            const [paused, setPaused] = useState(false);
            const [view, setView] = useState(() => localStorage.getItem('proc_view') || 'list');
            const [search, setSearch] = useState('');
            const [quick, setQuick] = useState('all');
            const [userFilter, setUserFilter] = useState(undefined);
            const [statusFilter, setStatusFilter] = useState(undefined);
            const [sortBy, setSortBy] = useState('cpu');
            const [page, setPage] = useState(1);
            const [pageSize, setPageSize] = useState(50);
            const [topBy, setTopBy] = useState('cpu');
            const [detail, setDetail] = useState(null); // pid
            const [detailData, setDetailData] = useState(null);
            const [detailLoading, setDetailLoading] = useState(false);
            const trendRef = useRef(null);
            const trendInst = useRef(null);
            const topRef = useRef(null);
            const topInst = useRef(null);
            const trendHistory = useRef({ labels: [], cpu: [], mem: [], rss: [] });
            const isMobile = useIsMobile();

            const hasPerm = p => auth.user && (auth.user.permissions || []).some(x => x === '*' || x === p);
            const canManage = hasPerm('system:process');

            useEffect(() => {
                secureFetch(baseUrl + '/check-auth')
                    .then(r => r.json())
                    .then(d => {
                        if (d.code === 200) setAuth({ loading: false, ok: true, user: d.user });
                        else window.location.href = 'index.html';
                    })
                    .catch(() => { window.location.href = 'index.html'; });
            }, []);
            useEffect(() => {
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
                document.documentElement.classList.toggle('dark', isDark);
                document.body.classList.toggle('dark', isDark);
                document.body.style.background = isDark ? '#141414' : '#f5f5f5';
            }, [isDark]);
            useEffect(() => { localStorage.setItem('proc_view', view); }, [view]);

            const load = useCallback(async (manual) => {
                if (manual) setLoading(true);
                try {
                    const r = await secureFetch(baseUrl + '/api/processes?sort=cpu&top=1000');
                    const d = await r.json();
                    if (d.code === 200) {
                        setProcs(d.data || []);
                        setConnOk(true);
                        setLoadedAt(new Date());
                        setPaused(false);
                    } else if (d.code === 403 || r.status === 403) {
                        setPaused(true);
                        setConnOk(false);
                        message.error('访问被拦截（403），已暂停自动刷新，请稍后点击「刷新」重试');
                    }
                } catch (e) {
                    setConnOk(false);
                } finally {
                    setLoading(false);
                }
            }, []);

            useEffect(() => {
                load();
                if (paused) return;
                const t = setInterval(() => load(), 5000);
                return () => clearInterval(t);
            }, [load, paused]);

            useEffect(() => {
                const onVis = () => {
                    if (document.hidden) setPaused(true);
                    else { setPaused(false); load(); }
                };
                document.addEventListener('visibilitychange', onVis);
                return () => document.removeEventListener('visibilitychange', onVis);
            }, [load]);

            // 异常检测
            const anomalyFlags = (p) => {
                const flags = [];
                const cpu = parseFloat(p.cpu) || 0;
                const mem = parseFloat(p.mem_pct) || 0;
                const runSec = etimeSec(p.elapsed);
                if (p.status === 'zombie') flags.push('zombie');
                if (cpu >= 80) flags.push('cpu_high');
                if (mem >= 80) flags.push('mem_high');
                if (cpu >= 50 && runSec > 0 && runSec < 5 * 60) flags.push('new_high');
                return flags;
            };
            const isAnomaly = (p) => anomalyFlags(p).length > 0;

            const total = procs.length;
            const running = procs.filter(p => p.status === 'running').length;
            const highCpu = procs.filter(p => (parseFloat(p.cpu) || 0) >= 50).length;
            const anomalyCount = procs.filter(isAnomaly).length;

            const users = useMemo(() => {
                const s = new Set(procs.map(p => p.user).filter(Boolean));
                return [...s].sort();
            }, [procs]);
            const statuses = ['running', 'sleeping', 'zombie', 'stopped', 'uninterruptible'];

            const filtered = useMemo(() => {
                let list = procs.filter(p => {
                    if (quick === 'cpu' && (parseFloat(p.cpu) || 0) < 50) return false;
                    if (quick === 'mem' && (parseFloat(p.mem_pct) || 0) < 50) return false;
                    if (quick === 'anomaly' && !isAnomaly(p)) return false;
                    if (quick === 'zombie' && p.status !== 'zombie') return false;
                    if (userFilter && p.user !== userFilter) return false;
                    if (statusFilter && p.status !== statusFilter) return false;
                    const q = search.trim().toLowerCase();
                    if (q) {
                        return (p.name || '').toLowerCase().includes(q) ||
                            (p.pid || '').includes(q) ||
                            (p.user || '').toLowerCase().includes(q) ||
                            (p.command || '').toLowerCase().includes(q);
                    }
                    return true;
                });
                const cmp = {
                    cpu: (a, b) => (parseFloat(b.cpu) || 0) - (parseFloat(a.cpu) || 0),
                    mem: (a, b) => (parseFloat(b.mem_pct) || 0) - (parseFloat(a.mem_pct) || 0),
                    rss: (a, b) => (parseFloat(b.rss_mb) || 0) - (parseFloat(a.rss_mb) || 0),
                    etime: (a, b) => etimeSec(b.elapsed) - etimeSec(a.elapsed),
                    pid: (a, b) => parseInt(a.pid, 10) - parseInt(b.pid, 10),
                    start: (a, b) => (b.start_time || '').localeCompare(a.start_time || '')
                }[sortBy];
                if (cmp) list = [...list].sort(cmp);
                return list;
            }, [procs, quick, userFilter, statusFilter, search, sortBy]);

            const paged = filtered.slice((page - 1) * pageSize, page * pageSize);
            useEffect(() => { setPage(1); }, [quick, userFilter, statusFilter, search, sortBy]);

            const topProcs = useMemo(() => {
                const sorted = [...procs].sort((a, b) => (topBy === 'mem' ? (parseFloat(b.mem_pct) || 0) - (parseFloat(a.mem_pct) || 0) : (parseFloat(b.cpu) || 0) - (parseFloat(a.cpu) || 0)));
                return sorted.slice(0, 10);
            }, [procs, topBy]);
            const topCpuProc = [...procs].sort((a, b) => (parseFloat(b.cpu) || 0) - (parseFloat(a.cpu) || 0))[0];
            const topMemProc = [...procs].sort((a, b) => (parseFloat(b.mem_pct) || 0) - (parseFloat(a.mem_pct) || 0))[0];

            // Top10 图表
            useEffect(() => {
                if (!topRef.current) return;
                if (!topInst.current) {
                    topInst.current = echarts.init(topRef.current);
                    const onR = () => topInst.current && topInst.current.resize();
                    window.addEventListener('resize', onR);
                    return () => window.removeEventListener('resize', onR);
                }
                const axisColor = isDark ? '#7d8798' : '#8b93a5';
                const names = topProcs.map(p => (p.name || ('#' + p.pid)).slice(0, 18));
                const vals = topProcs.map(p => topBy === 'mem' ? (parseFloat(p.mem_pct) || 0) : (parseFloat(p.cpu) || 0));
                topInst.current.setOption({
                    tooltip: {
                        trigger: 'axis', axisPointer: { type: 'shadow' },
                        formatter: (ps) => {
                            const idx = ps && ps[0] ? ps[0].dataIndex : 0;
                            const p = topProcs[idx];
                            if (!p) return '';
                            return '<b>' + (p.name || p.pid) + '</b><br/>PID: ' + p.pid + '<br/>用户: ' + p.user +
                                '<br/>CPU: ' + (parseFloat(p.cpu) || 0).toFixed(1) + '%<br/>Memory: ' + (parseFloat(p.mem_pct) || 0).toFixed(1) +
                                '%<br/>RSS: ' + (parseFloat(p.rss_mb) || 0).toFixed(1) + ' MB<br/><span style="font-size:11px;color:#999">' + (p.command || '') + '</span>';
                        }
                    },
                    grid: { left: 8, right: 34, top: 8, bottom: 4, containLabel: true },
                    xAxis: { type: 'value', axisLine: { show: false }, axisTick: { show: false }, axisLabel: { color: axisColor, fontSize: 10 }, splitLine: { lineStyle: { color: 'rgba(120,130,150,0.16)', type: 'dashed' } } },
                    yAxis: { type: 'category', data: names, axisLine: { show: false }, axisTick: { show: false }, axisLabel: { color: axisColor, fontSize: 11, width: 160, overflow: 'truncate' } },
                    series: [{
                        type: 'bar', data: vals, barMaxWidth: 14,
                        itemStyle: {
                            borderRadius: [0, 5, 5, 0],
                            color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
                                { offset: 0, color: topBy === 'mem' ? '#52c41a' : '#1677ff' },
                                { offset: 1, color: topBy === 'mem' ? '#95de64' : '#69b1ff' }
                            ])
                        },
                        label: { show: true, position: 'right', color: axisColor, fontSize: 10, formatter: p => p.value.toFixed(1) + '%' }
                    }]
                });
            }, [topProcs, topBy, isDark]);

            // 详情
            const openDetail = async (pid) => {
                setDetail(pid);
                setDetailData(null);
                setDetailLoading(true);
                trendHistory.current = { labels: [], cpu: [], mem: [], rss: [] };
                try {
                    const d = await api('/api/processes/' + pid);
                    setDetailData(d);
                } catch (e) {
                    message.error('加载进程详情失败: ' + e.message);
                } finally {
                    setDetailLoading(false);
                }
            };

            // 详情轮询（趋势采样）
            useEffect(() => {
                if (!detail) return;
                const tick = async () => {
                    try {
                        const d = await api('/api/processes/' + detail);
                        setDetailData(d);
                        const h = trendHistory.current;
                        h.labels.push(new Date().toLocaleTimeString());
                        h.cpu.push(parseFloat(d.cpu) || 0);
                        h.mem.push(parseFloat(d.mem_pct) || 0);
                        h.rss.push(parseFloat(d.rss_mb) || 0);
                        if (h.labels.length > 20) { h.labels.shift(); h.cpu.shift(); h.mem.shift(); h.rss.shift(); }
                    } catch (e) { /* 进程可能已退出 */ }
                };
                tick();
                const t = setInterval(tick, 3000);
                return () => clearInterval(t);
            }, [detail]);

            // 趋势图
            useEffect(() => {
                if (!detail || !trendRef.current) return;
                if (!trendInst.current) {
                    trendInst.current = echarts.init(trendRef.current);
                    const onR = () => trendInst.current && trendInst.current.resize();
                    window.addEventListener('resize', onR);
                    return () => window.removeEventListener('resize', onR);
                }
                const h = trendHistory.current;
                const axisColor = isDark ? '#7d8798' : '#8b93a5';
                trendInst.current.setOption({
                    tooltip: { trigger: 'axis' },
                    legend: { data: ['CPU %', 'Memory %', 'RSS MB'], textStyle: { color: axisColor, fontSize: 11 } },
                    grid: { left: 8, right: 8, top: 28, bottom: 4, containLabel: true },
                    xAxis: { type: 'category', data: h.labels.slice(), axisLine: { show: false }, axisTick: { show: false }, axisLabel: { color: axisColor, fontSize: 10 } },
                    yAxis: { type: 'value', axisLine: { show: false }, axisTick: { show: false }, axisLabel: { color: axisColor, fontSize: 10 }, splitLine: { lineStyle: { color: 'rgba(120,130,150,0.16)', type: 'dashed' } } },
                    series: [
                        { name: 'CPU %', type: 'line', smooth: 0.3, symbol: 'none', data: h.cpu.slice(), lineStyle: { width: 2, color: '#1677ff' } },
                        { name: 'Memory %', type: 'line', smooth: 0.3, symbol: 'none', data: h.mem.slice(), lineStyle: { width: 2, color: '#52c41a' } },
                        { name: 'RSS MB', type: 'line', smooth: 0.3, symbol: 'none', data: h.rss.slice(), lineStyle: { width: 2, color: '#fa8c16' } }
                    ]
                });
            }, [detail, detailData, isDark]);

            const isProtected = (p) => parseInt(p.pid, 10) <= 1 || (p.name === 'systemd' && parseInt(p.pid, 10) === 1);

            const killProc = async (p, force) => {
                try {
                    await api('/api/processes/kill', 'POST', { pid: parseInt(p.pid, 10), force: !!force });
                    message.success(force ? '已强制结束进程 ' + p.pid : '已发送终止信号给进程 ' + p.pid);
                    setTimeout(load, 1500);
                    if (detail === p.pid) setDetail(null);
                } catch (e) { message.error(e.message); }
            };

            const killConfirm = (p, force) => {
                Modal.confirm({
                    title: force ? '强制结束进程？' : '确定结束进程？',
                    okText: force ? '强制结束' : '结束进程',
                    okButtonProps: { danger: true },
                    cancelText: '取消',
                    content: (
                        <div style={{ marginTop: 8 }}>
                            <div>进程：<b>{p.name || p.pid}</b></div>
                            <div>PID：<Typography.Text code>{p.pid}</Typography.Text></div>
                            <div>用户：{p.user || '-'}</div>
                            <div>CPU：{(parseFloat(p.cpu) || 0).toFixed(1)}%</div>
                            <div>运行时间：{fmtRuntime(p.elapsed)}</div>
                            {force && <Alert type="error" showIcon style={{ marginTop: 10 }} message="强制结束将直接发送 SIGKILL，进程无法优雅退出，可能导致数据丢失。" />}
                        </div>
                    ),
                    onOk: () => killProc(p, force)
                });
            };

            const procMenu = (p) => {
                const items = [
                    { key: 'detail', label: '查看详情', icon: <UIIcon name="ProfileOutlined" /> },
                    { key: 'tree', label: '查看进程树', icon: <UIIcon name="ApartmentOutlined" /> }
                ];
                if (p.service_name) items.push({ key: 'service', label: '查看服务', icon: <UIIcon name="AppstoreOutlined" /> });
                items.push({ key: 'ports', label: '查看端口', icon: <UIIcon name="ApiOutlined" /> });
                if (canManage && !isProtected(p)) {
                    items.push({ type: 'divider' });
                    items.push({ key: 'kill', label: '结束进程', danger: true, icon: <UIIcon name="PoweroffOutlined" /> });
                    items.push({ key: 'kill9', label: '强制结束', danger: true, icon: <UIIcon name="StopOutlined" /> });
                }
                return {
                    items,
                    onClick: ({ key }) => {
                        if (key === 'detail') openDetail(p.pid);
                        else if (key === 'tree') { setView('tree'); setQuick('all'); }
                        else if (key === 'service' && p.service_name) window.location.href = 'services.html?svc=' + encodeURIComponent(p.service_name.replace(/\.service$/, ''));
                        else if (key === 'ports') openDetail(p.pid);
                        else if (key === 'kill') killConfirm(p, false);
                        else if (key === 'kill9') killConfirm(p, true);
                    }
                };
            };

            // 进程树
            const treeData = useMemo(() => {
                const byPid = {};
                procs.forEach(p => { byPid[p.pid] = p; });
                const childrenOf = {};
                procs.forEach(p => {
                    const pp = p.parent_pid;
                    if (pp && byPid[pp]) (childrenOf[pp] = childrenOf[pp] || []).push(p);
                });
                const mkNode = (p) => ({
                    key: p.pid,
                    title: (
                        <span className="tree-node" onClick={e => { e.stopPropagation(); openDetail(p.pid); }}>
                            <span>{p.name || ('#' + p.pid)}</span>
                            <span className="pid">PID {p.pid}</span>
                            <span className="cpu">{(parseFloat(p.cpu) || 0).toFixed(1)}%</span>
                            <span className="mem">{(parseFloat(p.mem_pct) || 0).toFixed(1)}%</span>
                            {p.status === 'zombie' && <Tag color="red" style={{ marginRight: 0, fontSize: 11 }}>Z</Tag>}
                        </span>
                    ),
                    children: (childrenOf[p.pid] || []).slice(0, 40).map(mkNode)
                });
                return procs.filter(p => !p.parent_pid || !byPid[p.parent_pid]).slice(0, 60).map(mkNode);
            }, [procs]);

            // ===== 列 =====
            const columns = [
                {
                    title: '进程', dataIndex: 'name', width: 220,
                    render: (v, p) => (
                        <div className="proc-name-cell">
                            <Typography.Link strong onClick={() => openDetail(p.pid)} style={{ overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
                                {v || ('#' + p.pid)}
                                {isAnomaly(p) && <span className="proc-warn"><UIIcon name="WarningOutlined" /></span>}
                            </Typography.Link>
                            <span className="proc-pid">PID {p.pid}{p.service_name ? ' · ' + p.service_name.replace(/\.service$/, '') : ''}</span>
                        </div>
                    )
                },
                { title: '用户', dataIndex: 'user', width: 110, render: v => <Tag style={{ marginRight: 0 }}>{v || '-'}</Tag> },
                {
                    title: 'CPU', dataIndex: 'cpu', width: 170,
                    render: v => {
                        const n = parseFloat(v) || 0;
                        return <Progress percent={Math.min(100, n)} size="small" strokeColor={cpuColor(n)}
                            format={() => <span style={{ color: cpuColor(n), fontSize: 12 }}>{n.toFixed(1)}%{n >= 50 ? ' ⚠' : ''}</span>} />;
                    }
                },
                {
                    title: 'Memory', dataIndex: 'mem_pct', width: 170,
                    render: (v, p) => {
                        const n = parseFloat(v) || 0;
                        return <Tooltip title="Memory：进程占系统物理内存比例。RSS：进程当前驻留在物理内存中的实际大小。">
                            <Progress percent={Math.min(100, n)} size="small" strokeColor={memColor(n)}
                                format={() => <span style={{ color: memColor(n), fontSize: 12 }}>{n.toFixed(1)}%{n >= 70 ? ' ⚠' : ''}</span>} />
                        </Tooltip>;
                    }
                },
                { title: 'RSS', dataIndex: 'rss_mb', width: 100, render: (v, p) => <Tooltip title={`Memory：${(parseFloat(p.mem_pct) || 0).toFixed(1)}% · RSS：${(parseFloat(v) || 0).toFixed(1)} MB`}><span>{(parseFloat(v) || 0).toFixed(1)} MB</span></Tooltip> },
                { title: '运行时间', dataIndex: 'elapsed', width: 100, render: (v) => <Tooltip title={v || '-'}><span>{fmtRuntime(v)}</span></Tooltip> },
                {
                    title: '操作', key: 'op', width: 130, fixed: 'right',
                    render: (_, p) => (
                        <Space size={4}>
                            <Button size="small" onClick={() => openDetail(p.pid)}>详情</Button>
                            {canManage && !isProtected(p) ? <Dropdown menu={procMenu(p)} trigger={['click']}><Button size="small" icon={<UIIcon name="MoreOutlined" />} /></Dropdown>
                                : <Tooltip title="系统关键进程，不可操作"><Button size="small" disabled icon={<UIIcon name="LockOutlined" />} /></Tooltip>}
                        </Space>
                    )
                }
            ];

            // ===== 树视图 =====
            const renderTree = () => (
                <Card size="small" title={<Space size={6}><UIIcon name="ApartmentOutlined" />进程树</Space>}>
                    <Alert type="info" showIcon style={{ marginBottom: 10 }} message="点击节点查看进程详情；默认展开根节点。" />
                    <Tree treeData={treeData} defaultExpandAll={false} defaultExpandedKeys={['1']} showLine blockNode />
                </Card>
            );

            // ===== 资源视图 =====
            const renderResource = () => {
                const topCpuList = [...procs].sort((a, b) => (parseFloat(b.cpu) || 0) - (parseFloat(a.cpu) || 0)).slice(0, 5);
                const topMemList = [...procs].sort((a, b) => (parseFloat(b.mem_pct) || 0) - (parseFloat(a.mem_pct) || 0)).slice(0, 5);
                const anomalyList = procs.filter(isAnomaly).slice(0, 20);
                const zombieList = procs.filter(p => p.status === 'zombie').slice(0, 20);
                const item = (p) => (
                    <div key={p.pid} className="res-item" onClick={() => openDetail(p.pid)}>
                        <span style={{ flex: 1, minWidth: 0, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
                            <b>{p.name || ('#' + p.pid)}</b> <span className="proc-pid">PID {p.pid}</span>
                        </span>
                        <span style={{ color: '#1677ff' }}>{(parseFloat(p.cpu) || 0).toFixed(1)}%</span>
                        <span style={{ color: '#52c41a' }}>{(parseFloat(p.mem_pct) || 0).toFixed(1)}%</span>
                    </div>
                );
                return <Row gutter={12}>
                    <Col xs={24} md={12}><Card size="small" title="高 CPU TOP5" style={{ marginBottom: 12 }}>{topCpuList.map(item)}{!topCpuList.length && <Empty image={Empty.PRESENTED_IMAGE_SIMPLE} />}</Card></Col>
                    <Col xs={24} md={12}><Card size="small" title="高内存 TOP5" style={{ marginBottom: 12 }}>{topMemList.map(item)}{!topMemList.length && <Empty image={Empty.PRESENTED_IMAGE_SIMPLE} />}</Card></Col>
                    <Col xs={24} md={12}><Card size="small" title={<Space size={6}><UIIcon name="WarningOutlined" />异常进程（{anomalyList.length}）</Space>} style={{ marginBottom: 12 }}>{anomalyList.length ? anomalyList.map(item) : <Empty image={Empty.PRESENTED_IMAGE_SIMPLE} description="无异常进程" />}</Card></Col>
                    <Col xs={24} md={12}><Card size="small" title={<Space size={6}><UIIcon name="SkullOutlined" />Zombie 进程（{zombieList.length}）</Space>}>{zombieList.length ? zombieList.map(item) : <Empty image={Empty.PRESENTED_IMAGE_SIMPLE} description="无僵尸进程" />}</Card></Col>
                </Row>;
            };

            // ===== 详情 Drawer =====
            const detailFlags = detailData ? anomalyFlags(detailData) : [];
            const growth = (() => {
                const h = trendHistory.current;
                if (h.rss.length >= 4 && h.rss[0] > 0) {
                    const g = (h.rss[h.rss.length - 1] - h.rss[0]) / h.rss[0] * 100;
                    return g;
                }
                return 0;
            })();

            if (auth.loading) {
                return <div style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', background: isDark ? '#141414' : '#f5f5f5' }}>
                    <Card loading style={{ width: 320 }} />
                </div>;
            }
            if (!canManage) {
                return <ConfigProvider theme={{ algorithm: isDark ? darkAlgorithm : undefined, token: { colorBgLayout: isDark ? '#141414' : '#f5f5f5', colorBgContainer: isDark ? '#1f1f1f' : '#ffffff' } }}>
                    <div style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', background: isDark ? '#141414' : '#f5f5f5' }}>
                        <Card style={{ width: 400, textAlign: 'center' }}>
                            <div style={{ fontSize: 40, marginBottom: 8 }}><UIIcon name="StopOutlined" /></div>
                            <Typography.Title level={4}>没有访问权限</Typography.Title>
                            <Typography.Text type="secondary">当前账号没有「查看进程列表」权限，请联系管理员开通。</Typography.Text>
                            <div style={{ marginTop: 16 }}>
                                <Button type="primary" onClick={() => window.location.href = 'index.html'}>返回首页</Button>
                            </div>
                        </Card>
                    </div>
                </ConfigProvider>;
            }

            return (
                <ConfigProvider theme={{ algorithm: isDark ? darkAlgorithm : undefined, token: { colorBgLayout: isDark ? '#141414' : '#f5f5f5', colorBgContainer: isDark ? '#1f1f1f' : '#ffffff', ...(isMobile ? { fontSize: 13 } : {}) } }}>
                    <div className={'sp-app' + (isDark ? ' dark' : '')} style={{ minHeight: '100vh', background: 'var(--bg)' }}>
                        <div className={'topbar' + (isDark ? ' dark' : '')}>
                            <span className="tb-page"><UIIcon name="SettingOutlined" />进程</span>
                            <Space style={{ marginLeft: 'auto' }}>
                                <Button icon={<UIIcon name="HomeOutlined" />} onClick={() => window.location.href = 'index.html'}><span className="tb-text">首页</span></Button>
                                <Button className="tb-hide-sm" icon={<UIIcon name="AppstoreOutlined" />} onClick={() => window.location.href = 'services.html'}><span className="tb-text">服务端口</span></Button>
                                <Button className="tb-hide-sm" icon={<UIIcon name="GlobalOutlined" />} onClick={() => window.location.href = 'ip-panel.html'}><span className="tb-text">IP 流量</span></Button>
                                <Tooltip title={isDark ? '浅色模式' : '深色模式'}>
                                    <Button onClick={() => setIsDark(!isDark)} icon={<UIIcon name={isDark ? 'SunOutlined' : 'MoonOutlined'} />} />
                                </Tooltip>
                                <Button danger icon={<UIIcon name="LogoutOutlined" />} onClick={() => secureFetch(baseUrl + '/logout', { method: 'POST' }).finally(() => window.location.href = 'index.html')}><span className="tb-text">退出</span></Button>
                            </Space>
                        </div>
                        <div className="page-wrap">
                            <div className="page-head">
                                <div>
                                    <div className="page-title">进程监控</div>
                                    <div className="page-desc">发现高负载进程 → 查看详情 → 关联服务/端口 → 处理</div>
                                </div>
                                <div className="live-status">
                                    {connOk
                                        ? <span className="ok">● 实时连接</span>
                                        : <span className="bad">🔴 实时连接断开 正在重连...</span>}
                                    <div>Last Update {loadedAt ? loadedAt.toLocaleTimeString() : '--:--:--'}</div>
                                </div>
                            </div>

                            <div className="mini-grid">
                                <div className="mini-stat" onClick={() => setQuick('all')}>
                                    <div className="ms-label"><UIIcon name="BarsOutlined" />进程总数</div>
                                    <div className="ms-value">{total}</div>
                                </div>
                                <div className="mini-stat" onClick={() => { setStatusFilter('running'); setQuick('all'); }}>
                                    <div className="ms-label"><UIIcon name="PlayCircleOutlined" />运行中</div>
                                    <div className="ms-value" style={{ color: '#52c41a' }}>{running}</div>
                                </div>
                                <div className="mini-stat" onClick={() => setQuick('cpu')}>
                                    <div className="ms-label"><UIIcon name="FireOutlined" />高 CPU</div>
                                    <div className="ms-value" style={{ color: highCpu ? '#fa8c16' : undefined }}>{highCpu}</div>
                                    <div className="ms-sub">CPU ≥ 50%</div>
                                </div>
                                <div className="mini-stat" onClick={() => setQuick('anomaly')}>
                                    <div className="ms-label"><UIIcon name="WarningOutlined" />异常进程</div>
                                    <div className="ms-value" style={{ color: anomalyCount ? '#ff4d4f' : '#52c41a' }}>{anomalyCount}</div>
                                </div>
                            </div>

                            <Row gutter={12} style={{ marginBottom: 12 }}>
                                <Col xs={24} md={12}>
                                    <Card size="small" title={<Space size={6}><UIIcon name="RocketOutlined" />CPU 最高</Space>}
                                        onClick={() => topCpuProc && openDetail(topCpuProc.pid)}
                                        hoverable style={{ cursor: 'pointer' }}>
                                        <div className="top-proc">
                                            <div className="proc-name">{topCpuProc ? (topCpuProc.name || ('#' + topCpuProc.pid)) : '-'}</div>
                                            <div className="proc-pid">PID {topCpuProc ? topCpuProc.pid : '-'}</div>
                                            <div style={{ fontSize: 22, fontWeight: 600, color: cpuColor(parseFloat(topCpuProc ? topCpuProc.cpu : 0) || 0), margin: '4px 0' }}>
                                                {(parseFloat(topCpuProc ? topCpuProc.cpu : 0) || 0).toFixed(1)}%
                                            </div>
                                            <Tooltip title={topCpuProc ? topCpuProc.command : ''}>
                                                <div className="proc-pid" style={{ overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{topCpuProc ? topCpuProc.command : ''}</div>
                                            </Tooltip>
                                        </div>
                                    </Card>
                                </Col>
                                <Col xs={24} md={12}>
                                    <Card size="small" title={<Space size={6}><UIIcon name="DatabaseOutlined" />内存最高</Space>}
                                        onClick={() => topMemProc && openDetail(topMemProc.pid)}
                                        hoverable style={{ cursor: 'pointer' }}>
                                        <div className="top-proc">
                                            <div className="proc-name">{topMemProc ? (topMemProc.name || ('#' + topMemProc.pid)) : '-'}</div>
                                            <div className="proc-pid">PID {topMemProc ? topMemProc.pid : '-'}</div>
                                            <div style={{ fontSize: 22, fontWeight: 600, color: memColor(parseFloat(topMemProc ? topMemProc.mem_pct : 0) || 0), margin: '4px 0' }}>
                                                {(parseFloat(topMemProc ? topMemProc.mem_pct : 0) || 0).toFixed(1)}%
                                            </div>
                                            <Tooltip title={topMemProc ? topMemProc.command : ''}>
                                                <div className="proc-pid" style={{ overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{topMemProc ? topMemProc.command : ''}</div>
                                            </Tooltip>
                                        </div>
                                    </Card>
                                </Col>
                            </Row>

                            <Card size="small" title={<Space size={6}><UIIcon name="BarChartOutlined" />Top 10 进程</Space>}
                                extra={<Segmented value={topBy} onChange={setTopBy} options={[{ label: 'CPU', value: 'cpu' }, { label: '内存', value: 'mem' }]} />}
                                style={{ marginBottom: 12 }}>
                                <div ref={topRef} style={{ width: '100%', height: 240 }}></div>
                            </Card>

                            <Card size="small" title={<Space size={6}><UIIcon name="UnorderedListOutlined" />进程列表（{filtered.length}）</Space>}>
                                <div className="toolbar">
                                    <div className="filter-wrap">
                                        <Segmented value={quick} onChange={setQuick} options={[
                                            { label: '全部 ' + total, value: 'all' },
                                            { label: 'CPU > 50%', value: 'cpu' },
                                            { label: 'Memory > 50%', value: 'mem' },
                                            { label: '异常 ' + anomalyCount, value: 'anomaly' },
                                            { label: 'Zombie', value: 'zombie' }
                                        ]} />
                                    </div>
                                    <Input.Search allowClear placeholder="搜索进程 / PID / 用户 / 命令" className="toolbar-search" onChange={e => setSearch(e.target.value)} />
                                    <Select allowClear placeholder="用户" style={{ width: 120 }} value={userFilter} onChange={setUserFilter}
                                        options={users.map(u => ({ label: u, value: u }))} />
                                    <Select allowClear placeholder="状态" style={{ width: 120 }} value={statusFilter} onChange={setStatusFilter}
                                        options={statuses.map(s => ({ label: STATUS_TEXT[s] || s, value: s }))} />
                                    <Select value={sortBy} onChange={setSortBy} style={{ width: 130 }} options={[
                                        { label: 'CPU ↓', value: 'cpu' },
                                        { label: 'Memory ↓', value: 'mem' },
                                        { label: 'RSS ↓', value: 'rss' },
                                        { label: '运行时间 ↓', value: 'etime' },
                                        { label: 'PID ↑', value: 'pid' },
                                        { label: '启动时间 ↓', value: 'start' }
                                    ]} />
                                    <div className="spacer" />
                                    <Segmented value={view} onChange={setView} options={[
                                        { label: <span><UIIcon name="UnorderedListOutlined" />列表</span>, value: 'list' },
                                        { label: <span><UIIcon name="ApartmentOutlined" />树</span>, value: 'tree' },
                                        { label: <span><UIIcon name="ThunderboltOutlined" />资源</span>, value: 'resource' }
                                    ]} />
                                    <Button icon={<UIIcon name="ReloadOutlined" />} loading={loading} onClick={() => { setPaused(false); load(true); }}>刷新</Button>
                                </div>

                                {view === 'list' ? (
                                    isMobile ? (
                                        <div>
                                            {paged.map(p => (
                                                <Card key={p.pid} size="small" bordered hoverable className="proc-card" style={{ marginBottom: 10 }} onClick={() => openDetail(p.pid)}>
                                                    <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 6, marginBottom: 4 }}>
                                                        <span style={{ fontWeight: 600 }}>{p.name || ('#' + p.pid)} {isAnomaly(p) && <UIIcon name="WarningOutlined" style={{ color: '#faad14' }} />}</span>
                                                        <Badge status={STATUS_BADGE[p.status] || 'default'} text={STATUS_TEXT[p.status] || p.status} />
                                                    </div>
                                                    <div className="proc-row"><span className="label">PID</span><Typography.Text code style={{ fontSize: 12 }}>{p.pid}</Typography.Text></div>
                                                    <div className="proc-row"><span className="label">用户</span><span>{p.user || '-'}</span></div>
                                                    <div className="proc-row"><span className="label">CPU</span><span style={{ color: cpuColor(parseFloat(p.cpu) || 0) }}>{(parseFloat(p.cpu) || 0).toFixed(1)}%</span></div>
                                                    <div className="proc-row"><span className="label">Memory</span><span style={{ color: memColor(parseFloat(p.mem_pct) || 0) }}>{(parseFloat(p.mem_pct) || 0).toFixed(1)}%</span></div>
                                                    <div className="proc-row"><span className="label">RSS</span><span>{(parseFloat(p.rss_mb) || 0).toFixed(1)} MB</span></div>
                                                    <div className="proc-row"><span className="label">运行</span><span>{fmtRuntime(p.elapsed)}</span></div>
                                                    <div style={{ display: 'flex', gap: 6, marginTop: 8 }}>
                                                        <Button size="small" onClick={e => { e.stopPropagation(); openDetail(p.pid); }}>详情</Button>
                                                        {canManage && !isProtected(p) && <Button size="small" danger onClick={e => { e.stopPropagation(); killConfirm(p, false); }}>结束</Button>}
                                                    </div>
                                                </Card>
                                            ))}
                                            {!paged.length && <Empty description="没有匹配的进程" style={{ padding: 30 }} />}
                                        </div>
                                    ) : (
                                        <Table rowKey="pid" size="middle" columns={columns} dataSource={paged} loading={loading}
                                            scroll={{ x: 1000 }} pagination={false} />
                                    )
                                ) : view === 'tree' ? renderTree() : renderResource()}

                                {view === 'list' && (
                                    <div style={{ marginTop: 12, display: 'flex', justifyContent: 'flex-end', gap: 8, alignItems: 'center' }}>
                                        <Typography.Text type="secondary" style={{ fontSize: 12 }}>共 {filtered.length} 个进程</Typography.Text>
                                        <Select value={pageSize} onChange={v => { setPageSize(v); setPage(1); }} style={{ width: 90 }} options={[20, 50, 100].map(n => ({ label: n + ' / 页', value: n }))} />
                                        <Space>
                                            <Button size="small" disabled={page <= 1} onClick={() => setPage(page - 1)}>上一页</Button>
                                            <Typography.Text style={{ fontSize: 13 }}>{page} / {Math.max(1, Math.ceil(filtered.length / pageSize))}</Typography.Text>
                                            <Button size="small" disabled={page >= Math.ceil(filtered.length / pageSize)} onClick={() => setPage(page + 1)}>下一页</Button>
                                        </Space>
                                    </div>
                                )}
                            </Card>
                        </div>

                        {/* 进程详情 Drawer */}
                        <Drawer title={detailData ? <Space size={8}>
                            <span style={{ fontSize: 16, fontWeight: 600 }}>{detailData.name || ('#' + detailData.pid)}</span>
                            <Badge status={STATUS_BADGE[detailData.status] || 'default'} text={STATUS_TEXT[detailData.status] || detailData.status} />
                            <Typography.Text code style={{ fontSize: 12 }}>PID {detailData.pid}</Typography.Text>
                        </Space> : '进程详情'}
                            open={!!detail} onClose={() => setDetail(null)} width={isMobile ? '100%' : 720}
                            footer={detailData && canManage && !isProtected(detailData) && (
                                <Popconfirm title="确定结束进程？" description={'将向 PID ' + detailData.pid + ' 发送 SIGTERM。'}
                                    okText="结束进程" okButtonProps={{ danger: true }} cancelText="取消" onConfirm={() => killProc(detailData, false)}>
                                    <Button danger icon={<UIIcon name="PoweroffOutlined" />}>结束进程</Button>
                                </Popconfirm>
                            )}>
                            {detailLoading ? <Card loading /> : detailData ? (() => {
                                const d = detailData;
                                return <div>
                                    {detailFlags.length > 0 && (
                                        <Alert type="warning" showIcon style={{ marginBottom: 10 }}
                                            message="异常进程"
                                            description={<div>
                                                {detailFlags.includes('zombie') && <div>⚠ Zombie Process</div>}
                                                {detailFlags.includes('cpu_high') && <div>⚠ CPU 持续高负载（≥80%）</div>}
                                                {detailFlags.includes('mem_high') && <div>⚠ 内存使用较高（≥80%）</div>}
                                                {detailFlags.includes('new_high') && <div>⚠ 新启动高负载进程</div>}
                                            </div>} />
                                    )}
                                    {growth >= 20 && (
                                        <Alert type="warning" showIcon style={{ marginBottom: 10 }}
                                            message={'⚠ 内存持续增长：过去窗口 +' + growth.toFixed(0) + '%'}
                                            description="RSS 呈上升趋势，请关注是否存在内存泄漏。" />
                                    )}
                                    <div className="sect-title"><UIIcon name="InfoCircleOutlined" />基本信息</div>
                                    <Descriptions size="small" column={2} bordered items={[
                                        { key: 'pid', label: 'PID', children: <Typography.Text copyable code>{d.pid}</Typography.Text> },
                                        { key: 'user', label: '用户', children: d.user || '-' },
                                        { key: 'status', label: '状态', children: <Badge status={STATUS_BADGE[d.status] || 'default'} text={STATUS_TEXT[d.status] || d.status} /> },
                                        { key: 'cpu', label: 'CPU', children: <span style={{ color: cpuColor(parseFloat(d.cpu) || 0) }}>{(parseFloat(d.cpu) || 0).toFixed(1)}%</span> },
                                        { key: 'mem', label: 'Memory', children: <span style={{ color: memColor(parseFloat(d.mem_pct) || 0) }}>{(parseFloat(d.mem_pct) || 0).toFixed(1)}%</span> },
                                        { key: 'rss', label: 'RSS', children: <Tooltip title="进程当前驻留在物理内存中的实际大小"><span>{(parseFloat(d.rss_mb) || 0).toFixed(1)} MB</span></Tooltip> },
                                        { key: 'run', label: '运行时间', children: <Tooltip title={d.elapsed || '-'}><span>{fmtRuntime(d.elapsed)}</span></Tooltip> },
                                        { key: 'start', label: '启动时间', children: d.start_time || '-' }
                                    ]} />
                                    <div className="sect-title"><UIIcon name="FileOutlined" />程序</div>
                                    <Descriptions size="small" column={1} bordered items={[
                                        { key: 'exe', label: '可执行文件', children: <Typography.Text code style={{ fontSize: 12 }}>{d.exe || '-'}</Typography.Text> },
                                        { key: 'cwd', label: '工作目录', children: <Typography.Text code style={{ fontSize: 12 }}>{d.working_directory || '-'}</Typography.Text> },
                                        { key: 'cmd', label: '完整命令', children: <Typography.Text code style={{ fontSize: 12, whiteSpace: 'pre-wrap', wordBreak: 'break-all' }}>{d.command || '-'}</Typography.Text> }
                                    ]} />
                                    <div className="sect-title"><UIIcon name="ApartmentOutlined" />父子进程</div>
                                    <Descriptions size="small" column={1} bordered items={[
                                        {
                                            key: 'parent', label: '父进程', children: d.parent_pid && d.parent_pid !== '0'
                                                ? <a onClick={() => openDetail(d.parent_pid)}>{d.parent_name || ('#' + d.parent_pid)} <Typography.Text code style={{ fontSize: 12 }}>PID {d.parent_pid}</Typography.Text></a>
                                                : '-'
                                        },
                                        {
                                            key: 'children', label: '子进程', children: (d.children || []).length
                                                ? d.children.slice(0, 10).map(c => <div key={c.pid} className="child-item" onClick={() => openDetail(c.pid)}><span>{c.name || ('#' + c.pid)}</span><span className="proc-pid">PID {c.pid}</span><span style={{ color: '#1677ff' }}>{(parseFloat(c.cpu) || 0).toFixed(1)}%</span><span style={{ color: '#52c41a' }}>{(parseFloat(c.mem_pct) || 0).toFixed(1)}%</span></div>)
                                                : '无'
                                        }
                                    ]} />
                                    <div className="sect-title"><UIIcon name="AppstoreOutlined" />所属服务</div>
                                    {d.service_name
                                        ? <Descriptions size="small" column={1} bordered items={[
                                            {
                                                key: 'svc', label: 'systemd 服务', children: <Space>
                                                    <Typography.Text code style={{ fontSize: 12 }}>{d.service_name}</Typography.Text>
                                                    <Button size="small" icon={<UIIcon name="ArrowRightOutlined" />} onClick={() => window.location.href = 'services.html?svc=' + encodeURIComponent(d.service_name.replace(/\.service$/, ''))}>查看服务</Button>
                                                </Space>
                                            }
                                        ]} />
                                        : <Alert type="info" showIcon message="所属服务：未知" description="该进程未关联到 systemd 服务。" />}
                                    <div className="sect-title"><UIIcon name="ApiOutlined" />监听端口（{(d.ports || []).length}）</div>
                                    {(d.ports || []).length
                                        ? <Space wrap>{d.ports.map(pt => (
                                            <Button key={pt.port + pt.protocol} size="small" onClick={() => window.location.href = 'services.html?port=' + pt.port + '&proto=' + pt.protocol}>
                                                <Typography.Text code>{pt.port}</Typography.Text> / {pt.protocol.toUpperCase()}
                                            </Button>
                                        ))}</Space>
                                        : <Alert type="info" showIcon message="监听端口：无" description="该进程当前没有监听端口。" />}
                                    <div className="sect-title"><UIIcon name="LineChartOutlined" />资源趋势（最近采样）</div>
                                    <div ref={trendRef} style={{ width: '100%', height: 200 }}></div>
                                </div>;
                            })() : null}
                        </Drawer>
                    </div>
                </ConfigProvider>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
    <script>
        (function () {
            function getCsrfToken() { var m = document.cookie.match(/(?:^|; )csrf_token=([^;]*)/); return m ? decodeURIComponent(m[1]) : ''; }
            function openPrivateSpace() {
                try {
                    fetch('/api/private/entry', { method: 'POST', headers: { 'X-CSRF-Token': getCsrfToken() }, credentials: 'include' })
                        .catch(function () { })
                        .finally(function () { window.location.href = 'private.html'; });
                } catch (e) { window.location.href = 'private.html'; }
            }
            var taps = [], lastTap = 0;
            document.addEventListener('keydown', function (e) {
                if (e.ctrlKey && e.shiftKey && e.altKey && (e.key === 'N' || e.key === 'n')) {
                    e.preventDefault();
                    openPrivateSpace();
                }
            });
            document.addEventListener('click', function (e) {
                var el = e.target;
                while (el && el !== document.documentElement) {
                    if (el.classList && (el.classList.contains('logo') || el.classList.contains('brand'))) {
                        var now = Date.now();
                        if (now - lastTap > 3000) taps = [];
                        lastTap = now;
                        taps.push(now);
                        if (taps.length >= 5) { taps = []; openPrivateSpace(); }
                        return;
                    }
                    el = el.parentElement;
                }
            });
        })();
    </script>
</body>

</html>
