<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>服务器状态监控 - Server Status</title>
    <link rel="icon" href="data:,">
    <script crossorigin src="https://registry.npmmirror.com/react/18.3.1/files/umd/react.production.min.js"></script>
    <script crossorigin src="https://registry.npmmirror.com/react-dom/18.3.1/files/umd/react-dom.production.min.js"></script>
    <script src="https://registry.npmmirror.com/dayjs/1.11.13/files/dayjs.min.js"></script>
    <script src="https://registry.npmmirror.com/antd/5.21.6/files/dist/antd.min.js"></script>
    <script src="https://registry.npmmirror.com/@babel/standalone/7.24.7/files/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts/dist/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/crypto-js@4.2.0/crypto-js.min.js"></script>
    <style>
        body { margin: 0; background: #f5f5f5; }
        #root { min-height: 100vh; }
        .page-wrap { padding: 16px; }
        .topbar {
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 24px; height: 56px; background: #fff;
            border-bottom: 1px solid #f0f0f0; box-shadow: 0 1px 4px rgba(0,0,0,0.06);
        }
        .topbar .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 17px; color: #1677ff; }
        .topbar.dark { background: #1f1f1f; border-bottom-color: #303030; box-shadow: 0 1px 4px rgba(0,0,0,0.3); }
        .topbar.dark .brand { color: #4096ff; }
        .topbar .brand .logo {
            width: 30px; height: 30px; border-radius: 8px; background: linear-gradient(135deg, #1677ff, #722ed1);
            display: flex; align-items: center; justify-content: center; color: #fff; font-size: 16px;
        }
        .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 12px; }
        .chart-card .chart { height: 260px; width: 100%; }
        .traffic-card .ant-card-body { padding: 14px !important; }
        .traffic-shell { display: grid; grid-template-columns: minmax(0, 1fr) 250px; gap: 14px; min-height: 430px; }
        .traffic-stage { position: relative; min-height: 430px; overflow: hidden; border-radius: 8px; background: linear-gradient(180deg, rgba(22,119,255,.035), rgba(82,196,26,.025)); }
        .traffic-stage.dark { background: linear-gradient(180deg, rgba(64,150,255,.08), rgba(19,194,194,.05)); }
        .traffic-svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
        .traffic-row { position: relative; z-index: 2; display: flex; justify-content: center; flex-wrap: wrap; gap: 26px; padding: 12px 18px; }
        .traffic-row.middle { margin-top: 18px; }
        .traffic-row.bottom { justify-content: space-around; gap: 18px; margin-top: 42px; flex-wrap: wrap; }
        .traffic-node {
            position: relative; min-width: 132px; max-width: 170px; padding: 12px 14px; border-radius: 8px;
            background: rgba(255,255,255,.92); border: 1px solid rgba(22,119,255,.12); box-shadow: 0 6px 18px rgba(20,34,58,.08);
            cursor: pointer; transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
            display: flex; align-items: center; gap: 10px;
        }
        .traffic-stage.dark .traffic-node { background: rgba(31,31,31,.92); border-color: rgba(64,150,255,.18); box-shadow: 0 6px 20px rgba(0,0,0,.25); }
        .traffic-node:hover, .traffic-node.active { transform: translateY(-2px); border-color: #1677ff; box-shadow: 0 10px 24px rgba(22,119,255,.18); }
        .traffic-node.server { min-width: 210px; display: flex; align-items: center; gap: 12px; }
        .traffic-node.interface { min-width: 150px; }
        .traffic-node.leaf { min-width: 136px; }
        .traffic-node.leaf .traffic-icon { width: 32px; height: 32px; font-size: 17px; border-radius: 7px; }
        .traffic-num { position: absolute; top: -7px; left: -7px; width: 19px; height: 19px; border-radius: 50%; background: #1677ff; color: #fff; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 6px rgba(22,119,255,.35); }
        .traffic-icon {
            width: 38px; height: 38px; border-radius: 8px; display: flex; align-items: center; justify-content: center;
            background: rgba(22,119,255,.08); color: #1677ff; font-size: 21px; flex: 0 0 auto;
        }
        .traffic-stage.dark .traffic-icon { background: rgba(64,150,255,.15); color: #69b1ff; }
        .traffic-title { font-weight: 700; color: #1f2a44; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .traffic-stage.dark .traffic-title { color: #f0f5ff; }
        .traffic-sub { margin-top: 3px; color: #667085; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .traffic-stage.dark .traffic-sub { color: #a3adc2; }
        .traffic-rate { margin-top: 8px; display: flex; flex-direction: column; gap: 4px; font-size: 12px; }
        .rate-row { display: inline-flex; align-items: center; gap: 6px; }
        .rate-ico { width: 15px; height: 15px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 10px; font-style: normal; color: #fff; flex: 0 0 auto; }
        .rate-ico.rx { background: #2aaa3f; }
        .rate-ico.tx { background: #1677ff; }
        .traffic-rx { color: #2aaa3f; }
        .traffic-tx { color: #1677ff; }
        .traffic-dot { position: absolute; right: 12px; top: 12px; width: 8px; height: 8px; border-radius: 50%; background: #52c41a; box-shadow: 0 0 0 4px rgba(82,196,26,.12); }
        .traffic-dot.offline { background: #a8b0bd; box-shadow: none; }
        .traffic-detail { border: 1px solid rgba(120,130,150,.18); border-radius: 8px; padding: 14px; background: rgba(255,255,255,.75); }
        .traffic-detail.dark { background: rgba(31,31,31,.7); border-color: rgba(255,255,255,.1); }
        .traffic-detail-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
        .traffic-detail-title { font-size: 15px; font-weight: 700; color: #1f2a44; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .traffic-detail.dark .traffic-detail-title { color: #f0f5ff; }
        .traffic-detail-section { padding-top: 12px; margin-top: 12px; border-top: 1px solid rgba(120,130,150,.18); }
        .traffic-kv { display: flex; justify-content: space-between; gap: 12px; margin: 8px 0; font-size: 12px; color: #667085; }
        .traffic-detail.dark .traffic-kv { color: #a3adc2; }
        .traffic-kv b { color: #1f2a44; font-weight: 600; text-align: right; }
        .traffic-detail.dark .traffic-kv b { color: #f0f5ff; }
        .traffic-empty { height: 390px; display: flex; align-items: center; justify-content: center; color: #8b93a5; }
        .traffic-summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; padding: 2px 2px 14px; }
        .traffic-total { display: flex; align-items: center; gap: 12px; min-width: 0; padding: 10px 14px; border-radius: 8px; background: rgba(255,255,255,.85); border: 1px solid rgba(22,119,255,.12); }
        .traffic-stage.dark .traffic-total { background: rgba(31,31,31,.72); border-color: rgba(64,150,255,.16); }
        .tt-ico { width: 42px; height: 42px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; font-size: 20px; flex: 0 0 auto; background: rgba(120,130,150,.1); }
        .tt-ico.rx { background: rgba(22,119,255,.1); color: #1677ff; }
        .tt-ico.tx { background: rgba(19,194,194,.12); color: #13c2c2; }
        .traffic-stage.dark .tt-ico { background: rgba(255,255,255,.08); }
        .traffic-total > div { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
        .tt-label { font-size: 12px; color: #667085; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .traffic-stage.dark .tt-label { color: #a3adc2; }
        .tt-value { font-size: 21px; font-weight: 700; line-height: 1.15; font-variant-numeric: tabular-nums; color: #1f2a44; white-space: nowrap; }
        .traffic-stage.dark .tt-value { color: #f0f5ff; }
        .tt-value.rx { color: #1677ff; }
        .tt-value.tx { color: #13c2c2; }
        .traffic-topo { position: relative; display: grid; grid-template-columns: minmax(170px, 1fr) minmax(280px, 1.35fr) minmax(170px, 1fr); gap: 18px; min-height: 300px; }
        .traffic-col { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: stretch; gap: 12px; min-width: 0; }
        .traffic-col.center { align-items: center; justify-content: flex-start; }
        .traffic-col-title { display: flex; align-items: center; font-size: 12px; font-weight: 700; color: #8b93a5; letter-spacing: 1px; margin-bottom: 2px; }
        .traffic-stage.dark .traffic-col-title { color: #a3adc2; }
        .traffic-count { display: inline-flex; align-items: center; margin-left: 8px; padding: 2px 9px; border-radius: 999px; background: rgba(22,119,255,.1); color: #1677ff; font-size: 11px; font-weight: 600; letter-spacing: 0; }
        .traffic-head { display: inline-flex; align-items: center; gap: 8px; }
        .traffic-live-tag { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px; background: rgba(82,196,26,.12); color: #52c41a; font-size: 12px; font-weight: 600; }
        .traffic-live-tag::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: #52c41a; box-shadow: 0 0 0 0 rgba(82,196,26,.45); animation: traffic-pulse 1.6s infinite; }
        @keyframes traffic-pulse { 70% { box-shadow: 0 0 0 6px rgba(82,196,26,0); } 100% { box-shadow: 0 0 0 0 rgba(82,196,26,0); } }
        .traffic-subtitle { color: #8b93a5; font-size: 12px; }
        .traffic-trend { position: relative; z-index: 2; margin-top: 16px; border: 1px solid rgba(120,130,150,.16); border-radius: 8px; padding: 10px 12px 4px; background: rgba(255,255,255,.6); }
        .traffic-stage.dark .traffic-trend { background: rgba(31,31,31,.55); border-color: rgba(255,255,255,.1); }
        .traffic-trend-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 2px; }
        .traffic-trend-title { font-size: 12px; font-weight: 600; color: #1f2a44; }
        .traffic-stage.dark .traffic-trend-title { color: #f0f5ff; }
        .traffic-legend { display: flex; gap: 10px; margin-left: auto; font-size: 11px; color: #667085; }
        .traffic-stage.dark .traffic-legend { color: #a3adc2; }
        .traffic-legend .lg { display: inline-flex; align-items: center; gap: 5px; }
        .traffic-legend .lg::before { content: ''; width: 14px; height: 3px; border-radius: 2px; }
        .traffic-legend .lg-rx::before { background: #1677ff; }
        .traffic-legend .lg-tx::before { background: #faad14; }
        .traffic-layout-btn { border: 1px solid rgba(22,119,255,.28); background: rgba(22,119,255,.06); color: #1677ff; font-size: 11px; line-height: 1; padding: 5px 12px; border-radius: 999px; cursor: pointer; transition: all .18s; }
        .traffic-layout-btn:hover { background: rgba(22,119,255,.14); }
        .traffic-trend-chart { height: 128px; width: 100%; }
        .traffic-svg line { stroke-dasharray: 5 4; animation: traffic-flow 1.1s linear infinite; }
        @keyframes traffic-flow { to { stroke-dashoffset: -9; } }
        .chart-meta { font-size: 12px; color: #999; text-align: right; margin-top: 6px; }
        .login-bg {
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            background: linear-gradient(135deg, #1677ff22, #722ed122);
        }
        .media-window {
            position: fixed; right: 20px; bottom: 20px; z-index: 999;
            width: 380px; height: 260px; border-radius: 12px; overflow: hidden;
            background: #fff; box-shadow: 0 8px 30px rgba(0,0,0,.16);
            border: 1px solid rgba(22,119,255,.15); display: flex; flex-direction: column;
            transition: all .3s;
        }
        .media-window.zoomed { right: 0 !important; bottom: 0 !important; width: 100% !important; height: 100% !important; border-radius: 0; }
        .media-head {
            display: flex; align-items: center; gap: 8px; padding: 8px 12px;
            background: #fff; color: #1677ff; font-size: 13px; font-weight: 600;
            border-bottom: 1px solid #f0f0f0;
        }
        .media-head .m-title { flex: 1; }
        .media-body { flex: 1; display: flex; align-items: center; justify-content: center; background: #000; overflow: hidden; }
        .media-body img, .media-body video { max-width: 100%; max-height: 100%; object-fit: contain; }
        .media-body .placeholder { color: #999; font-size: 13px; }
        .media-body .empty-media { text-align: center; color: #666; }
        @media (max-width: 768px) {
            .login-bg { padding: 16px; }
            .topbar { padding: 8px 12px; flex-wrap: wrap; gap: 6px 8px; }
            .topbar .brand { font-size: 14px; gap: 6px; }
            .topbar .brand .logo { width: 26px; height: 26px; font-size: 14px; border-radius: 6px; }
            .topbar .ant-space { flex-wrap: wrap; gap: 6px !important; }
            .topbar .ant-btn { padding: 4px 8px; font-size: 12px; height: 30px; }
            .topbar .tb-sub { display: none; }
            .topbar .tb-status { display: none; }
            .topbar .tb-label { display: none; }
            .page-wrap { padding: 10px; }
            .chart-card .chart { height: 220px; }
            .traffic-shell { grid-template-columns: 1fr; min-height: 0; }
            .traffic-stage { min-height: 560px; overflow-x: auto; }
            .traffic-row { min-width: 720px; }
            .traffic-detail { min-height: 0; }
            .traffic-topo { grid-template-columns: 1fr; min-width: 720px; }
            .traffic-summary, .traffic-trend { min-width: 720px; }
            .stat-grid { grid-template-columns: 1fr; }
            .stat-cards { grid-template-columns: repeat(2, 1fr); gap: 8px; }
            .ant-card-head { padding: 0 12px !important; }
            .ant-card-head-wrapper { flex-wrap: wrap; gap: 6px; }
            .ant-card-body { padding: 12px !important; }
            .media-window { display: none; }
        }
    </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
    const { Card, Table, Button, Input, Form, Tag, Space, Statistic, Typography, ConfigProvider, theme, message, Descriptions, Badge, Alert, Segmented, Select } = window.antd;
    const { useState, useEffect, useRef, useCallback } = React;
    const { darkAlgorithm } = theme;

    const baseUrl = window.location.origin;
    const securityToken = "redacted_anti_crawler_2024_security_key";
    const SESSION_KEY = 'server_monitor_session';
    const LOCAL_KEY = 'server_monitor_remember';

    const generateSignature = (path) => {
        const timestamp = Math.floor(Date.now() / 1000).toString();
        const nonce = CryptoJS.lib.WordArray.random(16).toString(CryptoJS.enc.Hex);
        const sig = CryptoJS.HmacSHA256(timestamp + '|' + nonce + '|' + path + '|' + securityToken, securityToken).toString(CryptoJS.enc.Hex);
        return { timestamp, nonce, signature: sig };
    };

    const secureFetch = (url, options = {}) => {
        const path = new URL(url).pathname;
        const sig = generateSignature(path);
        return fetch(url, {
            method: options.method || 'GET',
            headers: {
                'Content-Type': 'application/json',
                'X-Timestamp': sig.timestamp,
                'X-Nonce': sig.nonce,
                'X-Signature': sig.signature,
                ...(options.headers || {})
            },
            credentials: 'include',
            body: options.body
        });
    };

    const SessionManager = {
        save: (user, remember) => {
            const data = { user, timestamp: Date.now(), expiry: Date.now() + 30 * 24 * 3600 * 1000 };
            (remember ? localStorage : sessionStorage).setItem(remember ? LOCAL_KEY : SESSION_KEY, JSON.stringify(data));
        },
        get: () => {
            try {
                const s = sessionStorage.getItem(SESSION_KEY) || localStorage.getItem(LOCAL_KEY);
                return s ? JSON.parse(s) : null;
            } catch (e) { return null; }
        },
        clear: () => { sessionStorage.removeItem(SESSION_KEY); localStorage.removeItem(LOCAL_KEY); }
    };

    const hexToRgba = (hex, a) => {
        const h = hex.replace('#', '');
        return 'rgba(' + parseInt(h.substring(0, 2), 16) + ',' + parseInt(h.substring(2, 4), 16) + ',' + parseInt(h.substring(4, 6), 16) + ',' + a + ')';
    };

    function Login({ onLogin }) {
        const [mode, setMode] = useState('login');
        const [loading, setLoading] = useState(false);
        const [form] = Form.useForm();
        const submit = async () => {
            const v = await form.validateFields();
            setLoading(true);
            try {
                const r = await fetch(baseUrl + '/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify(mode === 'login' ? { username: v.username, password: v.password } : { username: v.username, email: v.email, password: v.password })
                });
                const d = await r.json();
                if (d.code === 200) {
                    SessionManager.save(d.user, !!v.remember);
                    message.success('登录成功');
                    onLogin(d.user);
                } else {
                    message.error(d.message || '登录失败');
                }
            } catch (e) {
                message.error('网络错误: ' + e.message);
            } finally {
                setLoading(false);
            }
        };
        return (
            <div className="login-bg">
                <Card style={{ width: '100%', maxWidth: 420 }}>
                    <div style={{ textAlign: 'center', marginBottom: 20 }}>
                        <div style={{ fontSize: 40 }}>🖥️</div>
                        <Typography.Title level={3} style={{ marginBottom: 4 }}>Server Status</Typography.Title>
                        <Typography.Text type="secondary">服务器状态监控系统</Typography.Text>
                    </div>
                    <Form form={form} layout="vertical" onFinish={submit}>
                        <Form.Item name="username" label="用户名" rules={[{ required: true, message: '请输入用户名' }]}>
                            <Input placeholder="用户名" size="large" />
                        </Form.Item>
                        {mode === 'register' && (
                            <Form.Item name="email" label="邮箱" rules={[{ required: true, type: 'email', message: '请输入有效邮箱' }]}>
                                <Input placeholder="user@example.com" size="large" />
                            </Form.Item>
                        )}
                        <Form.Item name="password" label="密码" rules={[{ required: true, message: '请输入密码' }]}>
                            <Input.Password placeholder="密码" size="large" />
                        </Form.Item>
                        {mode === 'login' && (
                            <Form.Item name="remember" valuePropName="checked">
                                <antdCheckbox>记住我</antdCheckbox>
                            </Form.Item>
                        )}
                        <Button type="primary" htmlType="submit" block size="large" loading={loading}>
                            {mode === 'login' ? '登 录' : '注 册'}
                        </Button>
                        <div style={{ textAlign: 'center', marginTop: 12 }}>
                            <Typography.Link onClick={() => { setMode(mode === 'login' ? 'register' : 'login'); form.resetFields(); }}>
                                {mode === 'login' ? '没有账户？注册新账户' : '已有账户？返回登录'}
                            </Typography.Link>
                        </div>
                    </Form>
                </Card>
            </div>
        );
    }
    const antdCheckbox = window.antd.Checkbox;

    function Dashboard({ user, onLogout }) {
        const [isDark, setIsDark] = useState(() => localStorage.getItem('theme') === 'dark');
        const [status, setStatus] = useState(null);
        const [online, setOnline] = useState([]);
        const [onlineCount, setOnlineCount] = useState(0);
        const [conn, setConn] = useState('disconnected');
        const [ifaces, setIfaces] = useState([]);
        const [iface, setIface] = useState('');
        const wsRef = useRef(null);
        const reconnectTimer = useRef(null);
        const reconnectAttempts = useRef(0);
        const chartRefs = useRef({});
        const chartInsts = useRef({});
        const dataRef = useRef({ labels: [], cpu: [], mem: [], up: [], down: [], r: [], w: [], trendLabels: [], trendRx: [], trendTx: [] });
        const [detailKey, setDetailKey] = useState({ type: 'server' });
        const [lines, setLines] = useState([]);
        const topoRef = useRef(null);
        const serverRef = useRef(null);
        const externalRef = useRef(null);
        const clientRefs = useRef({});
        const svcRefs = useRef({});
        const ifaceRefs = useRef({});

        const hasPerm = p => (user.permissions || []).some(x => x === '*' || x === p);

        useEffect(() => { localStorage.setItem('theme', isDark ? 'dark' : 'light'); }, [isDark]);

        const push = (arr, v, max = 20) => { arr.push(v); if (arr.length > max) arr.shift(); };

        const updateCharts = (d) => {
            const t = new Date().toLocaleTimeString();
            const D = dataRef.current;
            D.labels.push(t); if (D.labels.length > 20) D.labels.shift();
            push(D.cpu, (parseFloat(d.cpu_usage) || 0).toFixed(2));
            push(D.mem, (parseFloat(d.memory_usage) || 0).toFixed(2));
            push(D.up, (parseFloat(d.upload_speed) || 0).toFixed(2));
            push(D.down, (parseFloat(d.download_speed) || 0).toFixed(2));
            push(D.r, (parseFloat(d.read_speed) || 0).toFixed(2));
            push(D.w, (parseFloat(d.write_speed) || 0).toFixed(2));
            push(D.trendLabels, t, 60);
            push(D.trendRx, (parseFloat(d.download_speed) || 0).toFixed(2), 60);
            push(D.trendTx, (parseFloat(d.upload_speed) || 0).toFixed(2), 60);
            setOption('cpu', ['#1677ff'], D.labels, D.cpu, 'CPU 使用率 (%)');
            setOption('mem', ['#52c41a'], D.labels, D.mem, '内存使用率 (%)');
            setOption('net', ['#faad14', '#ff4d4f'], D.labels, [D.up, D.down], '网络速率 (KB/s)');
            setOption('disk', ['#13c2c2', '#722ed1'], D.labels, [D.r, D.w], '磁盘 I/O (KB/s)');
        };

        const setOption = (key, colors, labels, series, title) => {
            const inst = chartInsts.current[key];
            if (!inst) return;
            const s = Array.isArray(series[0]) ? series : [series];
            inst.setOption({
                title: { text: title, left: 'center', textStyle: { fontSize: 13, color: '#999' } },
                tooltip: { trigger: 'axis', backgroundColor: 'rgba(22,30,48,0.9)', borderWidth: 0, textStyle: { color: '#fff' } },
                grid: { left: 10, right: 14, top: 36, bottom: 4, containLabel: true },
                xAxis: { type: 'category', boundaryGap: false, data: labels.slice(), axisLine: { show: false }, axisTick: { show: false }, axisLabel: { color: '#8b93a5', fontSize: 11 } },
                yAxis: { type: 'value', axisLine: { show: false }, axisTick: { show: false }, axisLabel: { color: '#8b93a5', fontSize: 11 }, splitLine: { lineStyle: { color: 'rgba(120,130,150,0.16)', type: 'dashed' } } },
                series: s.map((arr, i) => ({
                    name: arr === series[0] && key === 'net' ? '上传' : arr === series[1] && key === 'net' ? '下载' : arr === series[0] && key === 'disk' ? '读取' : arr === series[1] && key === 'disk' ? '写入' : (key === 'cpu' ? 'CPU' : key === 'mem' ? '内存' : ''),
                    type: 'line', smooth: 0.35, symbol: 'none',
                    lineStyle: { width: 2.5, color: colors[i] }, itemStyle: { color: colors[i] },
                    areaStyle: { color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [{ offset: 0, color: hexToRgba(colors[i], 0.3) }, { offset: 1, color: hexToRgba(colors[i], 0.02) }]) },
                    data: arr.slice()
                }))
            });
        };

        const formatRate = (kb) => {
            const n = parseFloat(kb) || 0;
            if (n >= 1024) return (n / 1024).toFixed(n >= 10240 ? 1 : 2) + ' MB/s';
            return n.toFixed(n >= 100 ? 0 : 1) + ' KB/s';
        };

        const pickTopClients = (users, maxCount) => {
            const map = {};
            (users || []).forEach(u => {
                const ip = u.ip || '未知客户端';
                if (!map[ip]) map[ip] = { ip, connections: 0, pages: {} };
                map[ip].connections += 1;
                map[ip].pages[u.page || 'websocket'] = true;
            });
            let list = Object.values(map).sort((a, b) => b.connections - a.connections);
            if (list.length > maxCount) {
                const rest = list.slice(maxCount - 1);
                list = list.slice(0, maxCount - 1);
                list.push({
                    ip: '其他客户端',
                    connections: rest.reduce((sum, x) => sum + x.connections, 0),
                    pages: { aggregated: true },
                    aggregated: true
                });
            }
            return list;
        };

        const buildTrafficView = (d) => {
            const upload = parseFloat(d.upload_speed) || 0;
            const download = parseFloat(d.download_speed) || 0;
            const clients = pickTopClients(d.online_users || [], 4);
            const totalWeight = clients.reduce((s, c) => s + Math.max(c.connections, 1), 0) || 1;
            clients.forEach(c => {
                const w = Math.max(c.connections, 1) / totalWeight;
                c.rx = download * w;
                c.tx = upload * w;
            });
            const servicesRaw = (d.traffic_services || []).filter(s => s && s.port);
            let services = servicesRaw.slice(0, 4);
            if (!services.length) {
                services = [{ name: '当前端口', port: window.location.port || (location.protocol === 'https:' ? 443 : 80), protocol: 'tcp', rx: download, tx: upload, connections: d.online_count || 1 }];
            }
            const ifaces = (d.traffic_interfaces || []).slice(0, 4);
            const connTotal = services.reduce((s, x) => s + (x.connections || 0), 0);
            const clientRx = clients.reduce((s, c) => s + c.rx, 0);
            const clientTx = clients.reduce((s, c) => s + c.tx, 0);
            return {
                upload,
                download,
                clients,
                services: services.map(s => ({ ...s, label: (s.name || '服务') + ':' + s.port })),
                serviceTotal: servicesRaw.length || services.length,
                ifaces,
                serverIP: d.server_ip || d.hostname || 'Server',
                hostname: d.hostname || '-',
                totalUpload: d.total_upload || '-',
                totalDownload: d.total_download || '-',
                onlineCount: d.online_count || 0,
                activeClients: new Set((d.online_users || []).map(u => u.ip)).size,
                activeConns: connTotal || d.online_count || 0,
                external: { rx: Math.max(0, download - clientRx), tx: Math.max(0, upload - clientTx) }
            };
        };

        const serviceIcon = (s) => {
            const n = (s.name || '').toLowerCase();
            const p = s.port;
            if (n === 'http' || n === 'nginx' || p === 80 || p === 443 || p === 8443 || p === 8081) return '🌐';
            if (n === 'redis' || n === 'mysql' || n === 'postgres' || p === 6379 || p === 3306 || p === 5432) return '🗄️';
            if (n === 'ssh' || p === 22) return '🔑';
            if (n === 'openlist') return '📁';
            return '⚙️';
        };

        const getTrafficDetail = (tv, key) => {
            if (!tv || !key) return null;
            if (key.type === 'server') {
                return { name: '本机 / Server', typeLabel: '服务器', ip: tv.serverIP, hostname: tv.hostname, rx: tv.download, tx: tv.upload, connections: tv.onlineCount, totalUpload: tv.totalUpload, totalDownload: tv.totalDownload };
            }
            if (key.type === 'client') {
                const c = tv.clients.find(x => x.ip === key.ip);
                return c ? { name: c.ip, typeLabel: '客户端', ip: c.ip, rx: c.rx, tx: c.tx, connections: c.connections, aggregated: c.aggregated } : null;
            }
            if (key.type === 'service') {
                const s = tv.services.find(x => x.port === key.port);
                return s ? { name: s.label, typeLabel: '应用服务', port: s.port, protocol: s.protocol, rx: s.rx, tx: s.tx, connections: s.connections } : null;
            }
            if (key.type === 'iface') {
                const f = tv.ifaces.find(x => x.name === key.name);
                return f ? { name: f.name, typeLabel: '网络接口', ip: f.ip, rx: f.rx, tx: f.tx, status: f.up ? '在线' : '离线' } : null;
            }
            if (key.type === 'external') {
                return { name: '互联网', typeLabel: '外部网络', rx: tv.external.rx, tx: tv.external.tx };
            }
            return null;
        };

        const measureTrafficLines = () => {
            const topo = topoRef.current;
            if (!topo || !serverRef.current) return;
            const rect = topo.getBoundingClientRect();
            const sr = serverRef.current.getBoundingClientRect();
            const cx = sr.left + sr.width / 2 - rect.left;
            const cy = sr.top + sr.height / 2 - rect.top;
            const out = [];
            const addNode = (ref, rx, tx, key) => {
                const el = ref && ref.current;
                if (!el) return;
                const r = el.getBoundingClientRect();
                out.push({
                    key,
                    rx: parseFloat(rx) || 0,
                    tx: parseFloat(tx) || 0,
                    x1: r.left + r.width / 2 - rect.left,
                    y1: r.top + r.height / 2 - rect.top,
                    x2: cx,
                    y2: cy
                });
            };
            if (!status) return;
            const tv = buildTrafficView(status);
            tv.clients.forEach((c, i) => addNode(clientRefs.current[i], c.rx, c.tx, 'cl' + i));
            tv.services.forEach((s, i) => addNode(svcRefs.current[i], s.rx, s.tx, 'sv' + i));
            tv.ifaces.forEach((f, i) => addNode(ifaceRefs.current[i], f.rx, f.tx, 'if' + i));
            addNode(externalRef, tv.external.rx, tv.external.tx, 'ext');
            setLines(out);
        };

        const updateTrafficTrend = () => {
            if (chartRefs.current.trend && !chartInsts.current.trend) {
                chartInsts.current.trend = echarts.init(chartRefs.current.trend);
            }
            const inst = chartInsts.current.trend;
            if (!inst) return;
            const D = dataRef.current;
            const len = D.trendLabels.length;
            inst.setOption({
                animationDurationUpdate: 350,
                tooltip: {
                    trigger: 'axis',
                    backgroundColor: 'rgba(22,30,48,0.9)',
                    borderWidth: 0,
                    textStyle: { color: '#fff', fontSize: 12 },
                    formatter: ps => {
                        const rows = (ps || []).map(p => p.marker + ' ' + p.seriesName + ': ' + formatRate(p.value));
                        return ((ps && ps[0] && ps[0].axisValue) || '') + '<br/>' + rows.join('<br/>');
                    }
                },
                grid: { left: 8, right: 8, top: 16, bottom: 4, containLabel: true },
                xAxis: { type: 'category', boundaryGap: false, data: D.trendLabels.slice(), axisLine: { show: false }, axisTick: { show: false }, axisLabel: { color: '#8b93a5', fontSize: 10, interval: Math.max(0, Math.ceil(len / 6) - 1) } },
                yAxis: { type: 'value', axisLine: { show: false }, axisTick: { show: false }, axisLabel: { color: '#8b93a5', fontSize: 10 }, splitLine: { lineStyle: { color: 'rgba(120,130,150,0.16)', type: 'dashed' } } },
                series: [
                    { name: '下载流量 (RX)', type: 'line', smooth: 0.35, symbol: 'none', lineStyle: { width: 2, color: '#1677ff' }, itemStyle: { color: '#1677ff' }, areaStyle: { color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [{ offset: 0, color: 'rgba(22,119,255,0.28)' }, { offset: 1, color: 'rgba(22,119,255,0.02)' }]) }, data: D.trendRx.slice() },
                    { name: '上传流量 (TX)', type: 'line', smooth: 0.35, symbol: 'none', lineStyle: { width: 2, color: '#faad14' }, itemStyle: { color: '#faad14' }, areaStyle: { color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [{ offset: 0, color: 'rgba(250,173,20,0.24)' }, { offset: 1, color: 'rgba(250,173,20,0.02)' }]) }, data: D.trendTx.slice() }
                ]
            });
        };

        const connect = useCallback((i) => {
            if (reconnectTimer.current) { clearTimeout(reconnectTimer.current); reconnectTimer.current = null; }
            if (wsRef.current) { wsRef.current.onclose = null; wsRef.current.close(); }
            setConn('connecting');
            const sig = generateSignature('/ws');
            const url = baseUrl.replace(/^http/, 'ws') + '/ws?iface=' + encodeURIComponent(i) +
                '&timestamp=' + sig.timestamp + '&nonce=' + sig.nonce + '&signature=' + sig.signature;
            const ws = new WebSocket(url);
            wsRef.current = ws;
            ws.onopen = () => { setConn('connected'); reconnectAttempts.current = 0; };
            ws.onmessage = (e) => {
                try {
                    const d = JSON.parse(e.data);
                    setStatus(d);
                    setOnline(d.online_users || []);
                    setOnlineCount(d.online_count || 0);
                    updateCharts(d);
                } catch (err) { /* 忽略 */ }
            };
            ws.onerror = () => setConn('disconnected');
            ws.onclose = () => {
                setConn('disconnected');
                if (reconnectAttempts.current < 10) {
                    reconnectAttempts.current++;
                    const delay = Math.min(3000 * reconnectAttempts.current, 15000);
                    reconnectTimer.current = setTimeout(() => connect(i), delay);
                }
            };
        }, []);

        // 初始化图表
        useEffect(() => {
            ['cpu', 'mem', 'net', 'disk', 'trend'].forEach(k => {
                if (chartRefs.current[k] && !chartInsts.current[k]) {
                    chartInsts.current[k] = echarts.init(chartRefs.current[k]);
                }
            });
            const onR = () => {
                Object.values(chartInsts.current).forEach(c => c && c.resize());
                measureTrafficLines();
            };
            window.addEventListener('resize', onR);
            return () => {
                window.removeEventListener('resize', onR);
                Object.values(chartInsts.current).forEach(c => c && c.dispose());
                chartInsts.current = {};
            };
        }, []);

        // 流量拓扑连线与趋势图刷新
        useEffect(() => {
            if (chartRefs.current.trend && !chartInsts.current.trend) {
                chartInsts.current.trend = echarts.init(chartRefs.current.trend);
            }
            measureTrafficLines();
            updateTrafficTrend();
        }, [status, isDark]);

        // 加载网卡并连接
        useEffect(() => {
            secureFetch(baseUrl + '/status-ifaces')
                .then(r => r.json())
                .then(list => {
                    setIfaces(Array.isArray(list) ? list : []);
                    const pick = list && list.length > 1 ? list[1] : (list && list[0]);
                    if (pick) { setIface(pick); connect(pick); }
                })
                .catch(() => { setIface('eth4'); connect('eth4'); });
            return () => { if (wsRef.current) wsRef.current.close(); if (reconnectTimer.current) clearTimeout(reconnectTimer.current); };
        }, [connect]);

        const navBtns = [];
        navBtns.push(<Button key="ebooks" onClick={() => window.location.href = 'ebooks.html'}>📚 电子书</Button>);
        navBtns.push(<Button key="ip" onClick={() => window.location.href = 'ip-panel.html'}>🌐 IP 流量</Button>);
        if (hasPerm('files:manage')) navBtns.push(<Button key="files" onClick={() => window.location.href = 'files.html'}>📁 文件管理</Button>);
        if (hasPerm('system:process')) navBtns.push(<Button key="proc" onClick={() => window.location.href = 'process.html'}>⚙️ 进程</Button>);
        if (hasPerm('files:download')) navBtns.push(<Button key="dl" onClick={() => window.location.href = 'download.html'}>📥 安全下载</Button>);
        if (hasPerm('user:manage') || hasPerm('role:manage')) navBtns.push(<Button key="rbac" onClick={() => window.location.href = 'rbac.html'}>🛡️ 权限管理</Button>);

        const onlineCols = [
            { title: 'IP 地址', dataIndex: 'ip' },
            { title: '访问页面', dataIndex: 'page' },
            { title: '连接时间', dataIndex: 'since' },
            { title: '用户标识', dataIndex: 'user_agent', ellipsis: true }
        ];

        return (
            <ConfigProvider theme={{ algorithm: isDark ? darkAlgorithm : undefined }}>
                <div style={{ minHeight: '100vh', background: isDark ? '#141414' : '#f5f5f5' }}>
                    <div className={'topbar' + (isDark ? ' dark' : '')}>
                        <div className="brand"><span className="logo">🖥️</span><span>Server Status<span className="tb-sub"> · 实时监控</span></span></div>
                        <Space wrap>
                            <span style={{ display: 'inline-flex', alignItems: 'center', gap: 6 }}>
                                <Badge status={conn === 'connected' ? 'success' : conn === 'connecting' ? 'processing' : 'error'} />
                                <Typography.Text className="tb-status" type="secondary">{conn === 'connected' ? '已连接' : conn === 'connecting' ? '连接中...' : '已断开'}</Typography.Text>
                            </span>
                            <Button title={isDark ? '浅色模式' : '深色模式'} onClick={() => setIsDark(!isDark)}>{isDark ? '🌞' : '🌙'}<span className="tb-label">{isDark ? '浅色' : '深色'}</span></Button>
                            <Button danger title="退出登录" onClick={onLogout}>🚪<span className="tb-label">退出</span></Button>
                        </Space>
                    </div>
                    <div className="page-wrap">
                        <Space wrap style={{ marginBottom: 12 }}>
                            {navBtns}
                        </Space>

                        <div className="stat-grid stat-cards">
                            <Card size="small" hoverable bordered><Statistic title="CPU 使用率" value={status ? (parseFloat(status.cpu_usage) || 0).toFixed(1) : '-'} suffix="%" valueStyle={{ color: '#1677ff' }} /></Card>
                            <Card size="small" hoverable bordered><Statistic title="内存使用率" value={status ? (parseFloat(status.memory_usage) || 0).toFixed(1) : '-'} suffix="%" valueStyle={{ color: '#52c41a' }} /></Card>
                            <Card size="small" hoverable bordered><Statistic title="磁盘使用率" value={status ? (parseFloat(status.disk_usage) || 0).toFixed(1) : '-'} suffix="%" valueStyle={{ color: '#faad14' }} /></Card>
                            <Card size="small" hoverable bordered><Statistic title="在线用户" value={onlineCount} suffix="人" valueStyle={{ color: '#722ed1' }} /></Card>
                            <Card size="small" hoverable bordered><Statistic title="运行时间" value={status ? status.uptime : '-'} valueStyle={{ fontSize: 14 }} /></Card>
                        </div>

                        <Card size="small" style={{ marginBottom: 12 }}>
                            <Descriptions size="small" column={{ xs: 1, sm: 2, md: 4 }} items={[
                                { key: 'host', label: '主机名', children: status?.hostname || '-' },
                                { key: 'os', label: '操作系统', children: status?.os || '-' },
                                { key: 'kernel', label: '内核', children: status?.kernel_version || '-' },
                                { key: 'arch', label: '架构', children: status?.architecture || '-' },
                                { key: 'up', label: '上传总流量', children: status?.total_upload || '-' },
                                { key: 'down', label: '下载总流量', children: status?.total_download || '-' },
                                { key: 'load', label: '系统负载', children: status ? (status.load1 + ' / ' + status.load5 + ' / ' + status.load15) : '-' },
                                { key: 'net', label: '网络', children: status ? '↑' + (parseFloat(status.upload_speed) || 0).toFixed(1) + ' / ↓' + (parseFloat(status.download_speed) || 0).toFixed(1) + ' KB/s' : '-' }
                            ]} />
                        </Card>

                        <div className="stat-grid">
                            <Card size="small" hoverable bordered className="chart-card" title="📈 网络速率">
                                <div ref={el => chartRefs.current.net = el} className="chart"></div>
                            </Card>
                            <Card size="small" hoverable bordered className="chart-card" title="💿 磁盘 I/O">
                                <div ref={el => chartRefs.current.disk = el} className="chart"></div>
                            </Card>
                            <Card size="small" hoverable bordered className="chart-card" title="🔋 CPU 使用率">
                                <div ref={el => chartRefs.current.cpu = el} className="chart"></div>
                            </Card>
                            <Card size="small" hoverable bordered className="chart-card" title="🧠 内存使用率">
                                <div ref={el => chartRefs.current.mem = el} className="chart"></div>
                            </Card>
                        </div>

                        <Card size="small" hoverable bordered className="traffic-card"
                              title={<span className="traffic-head"><span>实时流量关系</span><span className="traffic-live-tag">实时</span></span>}
                              extra={<span className="traffic-subtitle">当前服务器网络流量拓扑关系</span>}
                              style={{ marginBottom: 12 }}>
                            {status ? (() => {
                                const tv = buildTrafficView(status);
                                const detail = getTrafficDetail(tv, detailKey);
                                const rates = [tv.download, tv.upload];
                                tv.clients.forEach(c => rates.push(c.rx, c.tx));
                                tv.services.forEach(s => rates.push(parseFloat(s.rx) || 0, parseFloat(s.tx) || 0));
                                tv.ifaces.forEach(f => rates.push(parseFloat(f.rx) || 0, parseFloat(f.tx) || 0));
                                const maxRate = Math.max.apply(null, rates) || 1;
                                return (
                                    <div className="traffic-shell">
                                        <div className={'traffic-stage' + (isDark ? ' dark' : '')}>
                                            <div className="traffic-summary">
                                                <div className="traffic-total">
                                                    <span className="tt-ico rx">⬇</span>
                                                    <div>
                                                        <span className="tt-label">总下载速度</span>
                                                        <span className="tt-value rx">{formatRate(tv.download)}</span>
                                                    </div>
                                                </div>
                                                <div className="traffic-total">
                                                    <span className="tt-ico tx">⬆</span>
                                                    <div>
                                                        <span className="tt-label">总上传速度</span>
                                                        <span className="tt-value tx">{formatRate(tv.upload)}</span>
                                                    </div>
                                                </div>
                                                <div className="traffic-total">
                                                    <span className="tt-ico">🔗</span>
                                                    <div>
                                                        <span className="tt-label">活跃连接</span>
                                                        <span className="tt-value">{tv.activeConns}</span>
                                                    </div>
                                                </div>
                                                <div className="traffic-total">
                                                    <span className="tt-ico">👥</span>
                                                    <div>
                                                        <span className="tt-label">活跃客户端</span>
                                                        <span className="tt-value">{tv.activeClients}</span>
                                                    </div>
                                                </div>
                                            </div>

                                            <div className="traffic-topo" ref={topoRef}>
                                                <svg className="traffic-svg" aria-hidden="true">
                                                    {lines.map(l => (
                                                        <line key={l.key} x1={l.x1} y1={l.y1} x2={l.x2} y2={l.y2}
                                                              stroke={l.rx >= l.tx ? '#1677ff' : '#13c2c2'}
                                                              strokeWidth={Math.max(1.2, Math.min(4, 1.2 + Math.max(l.rx, l.tx) / maxRate * 2.8))}
                                                              strokeOpacity={0.42} />
                                                    ))}
                                                </svg>

                                                <div className="traffic-col">
                                                    <div className="traffic-col-title">TOP 客户端</div>
                                                    {tv.clients.length ? tv.clients.map((c, i) => (
                                                        <div key={c.ip} ref={el => clientRefs.current[i] = el}
                                                             className={'traffic-node leaf' + (detailKey && detailKey.type === 'client' && detailKey.ip === c.ip ? ' active' : '')}
                                                             onClick={() => setDetailKey({ type: 'client', ip: c.ip })}>
                                                            <span className="traffic-icon">{c.aggregated ? '👥' : '💻'}</span>
                                                            <div style={{ flex: 1, minWidth: 0 }}>
                                                                <div className="traffic-title">{c.ip}</div>
                                                                <div className="traffic-sub">Clients ({c.connections})</div>
                                                                <div className="traffic-rate">
                                                                    <span className="rate-row"><i className="rate-ico rx">↓</i><span className="traffic-rx">{formatRate(c.rx)}</span></span>
                                                                    <span className="rate-row"><i className="rate-ico tx">↑</i><span className="traffic-tx">{formatRate(c.tx)}</span></span>
                                                                </div>
                                                            </div>
                                                            <span className="traffic-num">{i + 1}</span>
                                                        </div>
                                                    )) : <div className="traffic-empty" style={{ height: 90, minHeight: 90 }}>暂无客户端</div>}
                                                </div>

                                                <div className="traffic-col center">
                                                    <div className={'traffic-node server' + (detailKey && detailKey.type === 'server' ? ' active' : '')}
                                                         ref={serverRef}
                                                         onClick={() => setDetailKey({ type: 'server' })}>
                                                        <span className="traffic-icon">🖥️</span>
                                                        <div style={{ flex: 1, minWidth: 0 }}>
                                                            <div className="traffic-title">本机 / Server</div>
                                                            <div className="traffic-sub">{tv.serverIP}</div>
                                                            <div className="traffic-rate">
                                                                <span className="rate-row"><i className="rate-ico rx">↓</i><span className="traffic-rx">{formatRate(tv.download)}</span></span>
                                                                <span className="rate-row"><i className="rate-ico tx">↑</i><span className="traffic-tx">{formatRate(tv.upload)}</span></span>
                                                            </div>
                                                        </div>
                                                        <span className="traffic-dot" />
                                                    </div>
                                                    {tv.ifaces.length > 0 && (
                                                        <div className="traffic-row">
                                                            {tv.ifaces.map((f, i) => (
                                                                <div key={f.name} ref={el => ifaceRefs.current[i] = el}
                                                                     className={'traffic-node interface' + (detailKey && detailKey.type === 'iface' && detailKey.name === f.name ? ' active' : '')}
                                                                     onClick={() => setDetailKey({ type: 'iface', name: f.name })}>
                                                                    <span className="traffic-icon">🔌</span>
                                                                    <div style={{ flex: 1, minWidth: 0 }}>
                                                                        <div className="traffic-title">{f.name}</div>
                                                                        <div className="traffic-sub">{f.ip || (f.up ? '已连接' : '未连接')}</div>
                                                                        <div className="traffic-rate">
                                                                            <span className="rate-row"><i className="rate-ico rx">↓</i><span className="traffic-rx">{formatRate(f.rx)}</span></span>
                                                                            <span className="rate-row"><i className="rate-ico tx">↑</i><span className="traffic-tx">{formatRate(f.tx)}</span></span>
                                                                        </div>
                                                                    </div>
                                                                    <span className={'traffic-dot' + (f.up ? '' : ' offline')} />
                                                                </div>
                                                            ))}
                                                        </div>
                                                    )}
                                                </div>

                                                <div className="traffic-col">
                                                    <div className="traffic-col-title">TOP 应用服务<span className="traffic-count">Services ({tv.serviceTotal})</span></div>
                                                    {tv.services.map((s, i) => (
                                                        <div key={s.port} ref={el => svcRefs.current[i] = el}
                                                             className={'traffic-node leaf' + (detailKey && detailKey.type === 'service' && detailKey.port === s.port ? ' active' : '')}
                                                             onClick={() => setDetailKey({ type: 'service', port: s.port })}>
                                                            <span className="traffic-icon">{serviceIcon(s)}</span>
                                                            <div style={{ flex: 1, minWidth: 0 }}>
                                                                <div className="traffic-title">{s.label}</div>
                                                                <div className="traffic-sub">{(s.protocol || 'tcp').toUpperCase()}</div>
                                                                <div className="traffic-rate">
                                                                    <span className="rate-row"><i className="rate-ico rx">↓</i><span className="traffic-rx">{formatRate(s.rx)}</span></span>
                                                                    <span className="rate-row"><i className="rate-ico tx">↑</i><span className="traffic-tx">{formatRate(s.tx)}</span></span>
                                                                </div>
                                                            </div>
                                                            <span className="traffic-num">{i + 1}</span>
                                                        </div>
                                                    ))}
                                                    <div key="internet" ref={externalRef}
                                                         className={'traffic-node leaf' + (detailKey && detailKey.type === 'external' ? ' active' : '')}
                                                         onClick={() => setDetailKey({ type: 'external' })}>
                                                        <span className="traffic-icon">🌍</span>
                                                        <div style={{ flex: 1, minWidth: 0 }}>
                                                            <div className="traffic-title">互联网</div>
                                                            <div className="traffic-sub">外部网络</div>
                                                            <div className="traffic-rate">
                                                                <span className="rate-row"><i className="rate-ico rx">↓</i><span className="traffic-rx">{formatRate(tv.external.rx)}</span></span>
                                                                <span className="rate-row"><i className="rate-ico tx">↑</i><span className="traffic-tx">{formatRate(tv.external.tx)}</span></span>
                                                            </div>
                                                        </div>
                                                        <span className="traffic-num">{tv.services.length + 1}</span>
                                                    </div>
                                                </div>
                                            </div>

                                            <div className="traffic-trend">
                                                <div className="traffic-trend-head">
                                                    <span className="traffic-trend-title">流量趋势（1 分钟）</span>
                                                    <span className="traffic-legend">
                                                        <span className="lg lg-rx">下载流量 (RX)</span>
                                                        <span className="lg lg-tx">上传流量 (TX)</span>
                                                    </span>
                                                    <button type="button" className="traffic-layout-btn" onClick={measureTrafficLines} title="重新计算连线布局">自动布局</button>
                                                </div>
                                                <div ref={el => chartRefs.current.trend = el} className="traffic-trend-chart"></div>
                                            </div>
                                        </div>

                                        <div className={'traffic-detail' + (isDark ? ' dark' : '')}>
                                            {detail ? (
                                                <>
                                                    <div className="traffic-detail-head">
                                                        <span className="traffic-detail-title">{detail.name}</span>
                                                        <Tag color={detail.typeLabel === '服务器' ? 'green' : detail.typeLabel === '客户端' ? 'blue' : detail.typeLabel === '应用服务' ? 'cyan' : 'gold'}>{detail.typeLabel}</Tag>
                                                    </div>
                                                    <div className="traffic-detail-section">
                                                        <div className="traffic-kv"><span>下载速度</span><b>{formatRate(detail.rx)}</b></div>
                                                        <div className="traffic-kv"><span>上传速度</span><b>{formatRate(detail.tx)}</b></div>
                                                        {detail.ip && <div className="traffic-kv"><span>IP 地址</span><b>{detail.ip}</b></div>}
                                                        {detail.hostname && <div className="traffic-kv"><span>主机名</span><b>{detail.hostname}</b></div>}
                                                        {detail.port && <div className="traffic-kv"><span>端口</span><b>{detail.port}</b></div>}
                                                        {detail.protocol && <div className="traffic-kv"><span>协议</span><b>{detail.protocol}</b></div>}
                                                        {typeof detail.connections === 'number' && <div className="traffic-kv"><span>连接数</span><b>{detail.connections}</b></div>}
                                                        {detail.status && <div className="traffic-kv"><span>状态</span><b>{detail.status}</b></div>}
                                                        {detail.totalUpload && <div className="traffic-kv"><span>累计上传</span><b>{detail.totalUpload}</b></div>}
                                                        {detail.totalDownload && <div className="traffic-kv"><span>累计下载</span><b>{detail.totalDownload}</b></div>}
                                                    </div>
                                                </>
                                            ) : <div className="traffic-empty">暂无数据</div>}
                                        </div>
                                    </div>
                                );
                            })() : <div className="traffic-empty">等待流量数据...</div>}
                        </Card>

                        <div className="stat-grid" style={{ gridTemplateColumns: 'repeat(auto-fit, minmax(300px, 1fr))' }}>
                            <Card size="small" hoverable bordered title={`👥 在线用户（${onlineCount}）`}>
                                <Table size="small" rowKey={(_, i) => i} dataSource={online} columns={onlineCols}
                                       pagination={false} scroll={{ y: 240, x: 'max-content' }} />
                            </Card>
                        </div>

                        <Alert type="info" showIcon style={{ marginTop: 12 }}
                               message={conn !== 'connected' ? '⚠️ WebSocket 连接已断开，正在自动重连，图表暂停更新' : '✅ 实时数据推送中，每 1 秒更新一次'} />
                    </div>
                    <MediaWindow />
                </div>
            </ConfigProvider>
        );
    }

    function MediaWindow() {
        const [src, setSrc] = useState(null);
        const [playing, setPlaying] = useState(true);
        const [zoomed, setZoomed] = useState(false);
        const [volume, setVolume] = useState(() => {
            const v = parseFloat(localStorage.getItem('media_volume'));
            return isFinite(v) && v >= 0 && v <= 1 ? v : 0.5;
        });
        const [muted, setMuted] = useState(() => localStorage.getItem('media_sound') !== 'on');
        const videoRef = useRef(null);
        const isVideo = src && /\.(mp4|webm|mov)(\?|$)/i.test(src);
        const fixSrc = (u) => {
            try {
                const p = new URL(u);
                p.hostname = window.location.hostname;
                return p.toString();
            } catch (e) { return u; }
        };

        const load = useCallback(() => {
            secureFetch(baseUrl + '/random-media')
                .then(r => r.json())
                .then(d => { if (d && d.src) { setSrc(fixSrc(d.src)); setPlaying(true); setMuted(localStorage.getItem('media_sound') !== 'on'); } })
                .catch(() => {});
        }, []);
        useEffect(() => {
            load();
            const t = setInterval(load, 80000);
            return () => clearInterval(t);
        }, [load]);
        useEffect(() => {
            const v = videoRef.current;
            if (!v) return;
            v.muted = muted;
            v.volume = volume;
            if (playing) v.play().catch(() => {});
            else v.pause();
        }, [src, playing, volume, muted]);
        useEffect(() => { localStorage.setItem('media_sound', muted ? 'off' : 'on'); }, [muted]);
        useEffect(() => { localStorage.setItem('media_volume', String(volume)); }, [volume]);

        return (
            <div className={'media-window' + (zoomed ? ' zoomed' : '')}>
                <div className="media-head">
                    <span className="m-title">🎬 媒体展示</span>
                    {isVideo && <window.antd.Slider min={0} max={1} step={0.05} value={volume}
                        onChange={v => { setVolume(v); setMuted(v === 0); }}
                        style={{ width: 70, margin: 0 }} tooltip={{ open: false }} />}
                    {isVideo && <window.antd.Button size="small" type="text"
                        onClick={() => {
                            const nextMuted = !muted;
                            const v = videoRef.current;
                            if (!nextMuted && v) {
                                const vol = volume > 0 ? volume : 0.5;
                                setVolume(vol);
                                v.muted = false;
                                v.volume = vol;
                                v.play().catch(() => {});
                            } else if (nextMuted && v) {
                                v.muted = true;
                            }
                            setMuted(nextMuted);
                        }}
                        title={muted ? '取消静音' : '静音'}>{muted ? '🔇' : '🔊'}</window.antd.Button>}
                    <window.antd.Button size="small" type="text" onClick={load} title="刷新">🔄</window.antd.Button>
                    {isVideo && <window.antd.Button size="small" type="text"
                        onClick={() => setPlaying(!playing)} title={playing ? '暂停' : '播放'}>{playing ? '⏸' : '▶'}</window.antd.Button>}
                    <window.antd.Button size="small" type="text" onClick={() => setZoomed(!zoomed)}
                        title={zoomed ? '还原' : '放大'}>{zoomed ? '🗕' : '⛶'}</window.antd.Button>
                </div>
                <div className="media-body" onClick={() => isVideo && setPlaying(!playing)}>
                    {!src ? <span className="placeholder">加载媒体中...</span>
                        : isVideo
                            ? <video ref={videoRef} src={src} muted={muted} playsInline loop autoPlay />
                            : <img src={src} alt="media" />}
                </div>
            </div>
        );
    }

    function App() {
        const [user, setUser] = useState(null);
        const [checking, setChecking] = useState(true);
        useEffect(() => {
            secureFetch(baseUrl + '/check-auth')
                .then(r => r.json())
                .then(d => { setUser(d.code === 200 ? d.user : null); setChecking(false); })
                .catch(() => setChecking(false));
        }, []);
        if (checking) {
            return <div style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center' }}><Card loading style={{ width: 320 }} /></div>;
        }
        if (!user) return <Login onLogin={setUser} />;
        return <Dashboard key={user.username} user={user} onLogout={() => {
            secureFetch(baseUrl + '/logout', { method: 'POST' }).finally(() => { SessionManager.clear(); setUser(null); });
        }} />;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
