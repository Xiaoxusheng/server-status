        }

<body>
<div id="root"></div>
<script type="text/babel">
    const { Card, Table, Button, Input, Form, Tag, Space, Statistic, Typography, ConfigProvider, theme, message, Descriptions, Badge, Alert, Segmented, Select } = window.antd;
    const { useState, useEffect, useRef, useCallback } = React;
    const { darkAlgorithm } = theme;

    const baseUrl = window.location.origin;
    const securityToken = "redacted_anti_crawler_2024_security_key";
    const SESSION_KEY = 'server_monitor_session';
    const LOCAL_KEY = 'server_monitor_remember';

    const generateSignature = (path) => {
        const timestamp = Math.floor(Date.now() / 1000).toString();
        const nonce = CryptoJS.lib.WordArray.random(16).toString(CryptoJS.enc.Hex);
        const sig = CryptoJS.HmacSHA256(timestamp + '|' + nonce + '|' + path + '|' + securityToken, securityToken).toString(CryptoJS.enc.Hex);
        return { timestamp, nonce, signature: sig };
    };

    const secureFetch = (url, options = {}) => {
        const path = new URL(url).pathname;
        const sig = generateSignature(path);
        return fetch(url, {
            method: options.method || 'GET',
            headers: {
                'Content-Type': 'application/json',
                'X-Timestamp': sig.timestamp,
                'X-Nonce': sig.nonce,
                'X-Signature': sig.signature,
                ...(options.headers || {})
            },
            credentials: 'include',
            body: options.body
        });
    };

    const SessionManager = {
        save: (user, remember) => {
            const data = { user, timestamp: Date.now(), expiry: Date.now() + 30 * 24 * 3600 * 1000 };
            (remember ? localStorage : sessionStorage).setItem(remember ? LOCAL_KEY : SESSION_KEY, JSON.stringify(data));
        },
        get: () => {
            try {
                const s = sessionStorage.getItem(SESSION_KEY) || localStorage.getItem(LOCAL_KEY);
                return s ? JSON.parse(s) : null;
            } catch (e) { return null; }
        },
        clear: () => { sessionStorage.removeItem(SESSION_KEY); localStorage.removeItem(LOCAL_KEY); }
    };

    const hexToRgba = (hex, a) => {
        const h = hex.replace('#', '');
        return 'rgba(' + parseInt(h.substring(0, 2), 16) + ',' + parseInt(h.substring(2, 4), 16) + ',' + parseInt(h.substring(4, 6), 16) + ',' + a + ')';
    };

    const Icon = ({ children, size = 14, ...rest }) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={1.6} strokeLinecap="round" strokeLinejoin="round" aria-hidden="true" {...rest}>{children}</svg>
    );
    const Ico = {
        down: <><path d="M12 5v14" /><path d="M19 12l-7 7-7-7" /></>,
        up: <><path d="M12 19V5" /><path d="M5 12l7-7 7 7" /></>,
        server: <><rect x="2" y="3" width="20" height="7" rx="2" /><rect x="2" y="14" width="20" height="7" rx="2" /><path d="M6.5 6.5h.01M6.5 17.5h.01" /></>,
        laptop: <><path d="M3 6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v9H3z" /><path d="M2 19h20" /></>,
        globe: <><circle cx="12" cy="12" r="9" /><path d="M3 12h18" /><path d="M12 3a13.5 13.5 0 0 1 0 18 13.5 13.5 0 0 1 0-18z" /></>,
        plug: <><path d="M12 22v-4" /><path d="M9 8V2" /><path d="M15 8V2" /><path d="M5 8h14v5a7 7 0 0 1-14 0z" /></>,
        box: <><path d="M21 8l-9-5-9 5v8l9 5 9-5V8z" /><path d="M3 8l9 5 9-5" /><path d="M12 13v8" /></>,
        db: <><ellipse cx="12" cy="5" rx="8" ry="3" /><path d="M4 5v14c0 1.66 3.58 3 8 3s8-1.34 8-3V5" /><path d="M4 12c0 1.66 3.58 3 8 3s8-1.34 8-3" /></>,
        ssh: <><rect x="2" y="4" width="20" height="16" rx="2" /><path d="M6 9l3 3-3 3" /><path d="M13 15h5" /></>,
        folder: <><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z" /></>,
        users: <><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" /><circle cx="9" cy="7" r="4" /><path d="M23 21v-2a4 4 0 0 0-3-3.87" /><path d="M16 3.13a4 4 0 0 1 0 7.75" /></>,
        link: <><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" /><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" /></>
    };
    const iconEl = (name, size) => <Icon size={size}>{Ico[name] || Ico.box}</Icon>;

    // 1536x1024 设计画布内的节点卡片布局（与参考截图一致）
    const CARD_LAYOUT = {
        server: { left: 690, top: 225, w: 240, h: 100 },
        eth0: { left: 240, top: 428, w: 150, h: 78 },
        wlan0: { left: 555, top: 425, w: 150, h: 78 },
        docker0: { left: 930, top: 425, w: 150, h: 78 },
        other: { left: 1290, top: 450, w: 150, h: 78 },
        c0: { left: 40, top: 588, w: 210, h: 105 },
        c1: { left: 220, top: 588, w: 210, h: 105 },
        c2: { left: 575, top: 588, w: 210, h: 105 },
        ext: { left: 395, top: 615, w: 150, h: 85 },
        s0: { left: 785, top: 588, w: 130, h: 105 },
        s1: { left: 940, top: 588, w: 140, h: 105 },
        s2: { left: 1120, top: 588, w: 140, h: 105 }
    };
    const IFACE_SLOTS = ['eth0', 'wlan0', 'docker0'];

    function Login({ onLogin }) {
        const [mode, setMode] = useState('login');
        const [loading, setLoading] = useState(false);
        const [form] = Form.useForm();
        const submit = async () => {
            const v = await form.validateFields();
            setLoading(true);
            try {
                const r = await fetch(baseUrl + '/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify(mode === 'login' ? { username: v.username, password: v.password } : { username: v.username, email: v.email, password: v.password })
                });
                const d = await r.json();
                if (d.code === 200) {
                    SessionManager.save(d.user, !!v.remember);
                    message.success('登录成功');
                    onLogin(d.user);
                } else {
                    message.error(d.message || '登录失败');
                }
            } catch (e) {
                message.error('网络错误: ' + e.message);
            } finally {
                setLoading(false);
            }
        };
        return (
            <div className="login-bg">
                <Card style={{ width: '100%', maxWidth: 420 }}>
                    <div style={{ textAlign: 'center', marginBottom: 20 }}>
                        <div style={{ fontSize: 40 }}>🖥️</div>
                        <Typography.Title level={3} style={{ marginBottom: 4 }}>Server Status</Typography.Title>
                        <Typography.Text type="secondary">服务器状态监控系统</Typography.Text>
                    </div>
                    <Form form={form} layout="vertical" onFinish={submit}>
                        <Form.Item name="username" label="用户名" rules={[{ required: true, message: '请输入用户名' }]}>
                            <Input placeholder="用户名" size="large" />
                        </Form.Item>
                        {mode === 'register' && (
                            <Form.Item name="email" label="邮箱" rules={[{ required: true, type: 'email', message: '请输入有效邮箱' }]}>
                                <Input placeholder="user@example.com" size="large" />
                            </Form.Item>
                        )}
                        <Form.Item name="password" label="密码" rules={[{ required: true, message: '请输入密码' }]}>
                            <Input.Password placeholder="密码" size="large" />
                        </Form.Item>
                        {mode === 'login' && (
                            <Form.Item name="remember" valuePropName="checked">
                                <antdCheckbox>记住我</antdCheckbox>
                            </Form.Item>
                        )}
                        <Button type="primary" htmlType="submit" block size="large" loading={loading}>
                            {mode === 'login' ? '登 录' : '注 册'}
                        </Button>
                        <div style={{ textAlign: 'center', marginTop: 12 }}>
                            <Typography.Link onClick={() => { setMode(mode === 'login' ? 'register' : 'login'); form.resetFields(); }}>
                                {mode === 'login' ? '没有账户？注册新账户' : '已有账户？返回登录'}
                            </Typography.Link>
                        </div>
                    </Form>
                </Card>
            </div>
        );
    }
    const antdCheckbox = window.antd.Checkbox;

    function Dashboard({ user, onLogout }) {
        const [isDark, setIsDark] = useState(() => localStorage.getItem('theme') === 'dark');
        const [status, setStatus] = useState(null);
        const [online, setOnline] = useState([]);
        const [onlineCount, setOnlineCount] = useState(0);
        const [conn, setConn] = useState('disconnected');
        const [ifaces, setIfaces] = useState([]);
        const [iface, setIface] = useState('');
        const wsRef = useRef(null);
        const reconnectTimer = useRef(null);
        const reconnectAttempts = useRef(0);
        const chartRefs = useRef({});
        const chartInsts = useRef({});
        const dataRef = useRef({ labels: [], cpu: [], mem: [], up: [], down: [], r: [], w: [], trendLabels: [], trendRx: [], trendTx: [] });
        const [detailKey, setDetailKey] = useState({ type: 'server' });
        const [lines, setLines] = useState([]);
        const [canvasScale, setCanvasScale] = useState(1);
        const canvasWrapRef = useRef(null);
        const dragPosRef = useRef({});
        const dragSession = useRef(null);
        const movedRef = useRef(false);
        const [dragTick, setDragTick] = useState(0);

        const hasPerm = p => (user.permissions || []).some(x => x === '*' || x === p);

        useEffect(() => { localStorage.setItem('theme', isDark ? 'dark' : 'light'); }, [isDark]);

        const push = (arr, v, max = 20) => { arr.push(v); if (arr.length > max) arr.shift(); };

        const updateCharts = (d) => {
            const t = new Date().toLocaleTimeString();
            const D = dataRef.current;
            D.labels.push(t); if (D.labels.length > 20) D.labels.shift();
            push(D.cpu, (parseFloat(d.cpu_usage) || 0).toFixed(2));
            push(D.mem, (parseFloat(d.memory_usage) || 0).toFixed(2));
            push(D.up, (parseFloat(d.upload_speed) || 0).toFixed(2));
            push(D.down, (parseFloat(d.download_speed) || 0).toFixed(2));
            push(D.r, (parseFloat(d.read_speed) || 0).toFixed(2));
            push(D.w, (parseFloat(d.write_speed) || 0).toFixed(2));
            push(D.trendLabels, t, 60);
            push(D.trendRx, (parseFloat(d.download_speed) || 0).toFixed(2), 60);
            push(D.trendTx, (parseFloat(d.upload_speed) || 0).toFixed(2), 60);
            setOption('cpu', ['#1677ff'], D.labels, D.cpu, 'CPU 使用率 (%)');
            setOption('mem', ['#52c41a'], D.labels, D.mem, '内存使用率 (%)');
            setOption('net', ['#faad14', '#ff4d4f'], D.labels, [D.up, D.down], '网络速率 (KB/s)');
            setOption('disk', ['#13c2c2', '#722ed1'], D.labels, [D.r, D.w], '磁盘 I/O (KB/s)');
        };

        const setOption = (key, colors, labels, series, title) => {
            const inst = chartInsts.current[key];
            if (!inst) return;
            const s = Array.isArray(series[0]) ? series : [series];
            inst.setOption({
                title: { text: title, left: 'center', textStyle: { fontSize: 13, color: '#999' } },
                tooltip: { trigger: 'axis', backgroundColor: 'rgba(22,30,48,0.9)', borderWidth: 0, textStyle: { color: '#fff' } },
                grid: { left: 10, right: 14, top: 36, bottom: 4, containLabel: true },
                xAxis: { type: 'category', boundaryGap: false, data: labels.slice(), axisLine: { show: false }, axisTick: { show: false }, axisLabel: { color: '#8b93a5', fontSize: 11 } },
                yAxis: { type: 'value', axisLine: { show: false }, axisTick: { show: false }, axisLabel: { color: '#8b93a5', fontSize: 11 }, splitLine: { lineStyle: { color: 'rgba(120,130,150,0.16)', type: 'dashed' } } },
                series: s.map((arr, i) => ({
                    name: arr === series[0] && key === 'net' ? '上传' : arr === series[1] && key === 'net' ? '下载' : arr === series[0] && key === 'disk' ? '读取' : arr === series[1] && key === 'disk' ? '写入' : (key === 'cpu' ? 'CPU' : key === 'mem' ? '内存' : ''),
                    type: 'line', smooth: 0.35, symbol: 'none',
                    lineStyle: { width: 2.5, color: colors[i] }, itemStyle: { color: colors[i] },
                    areaStyle: { color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [{ offset: 0, color: hexToRgba(colors[i], 0.3) }, { offset: 1, color: hexToRgba(colors[i], 0.02) }]) },
                    data: arr.slice()
                }))
            });
        };

        const formatRate = (kb) => {
            const n = parseFloat(kb) || 0;
            if (n >= 1024) return (n / 1024).toFixed(n >= 10240 ? 1 : 2) + ' MB/s';
            return n.toFixed(n >= 100 ? 0 : 1) + ' KB/s';
        };

        const pickTopClients = (users, maxCount) => {
            const map = {};
            (users || []).forEach(u => {
                const ip = u.ip || '未知客户端';
                if (!map[ip]) map[ip] = { ip, connections: 0, pages: {} };
                map[ip].connections += 1;
                map[ip].pages[u.page || 'websocket'] = true;
            });
            let list = Object.values(map).sort((a, b) => b.connections - a.connections);
            if (list.length > maxCount) {
                const rest = list.slice(maxCount - 1);
                list = list.slice(0, maxCount - 1);
                list.push({
                    ip: '其他客户端',
                    connections: rest.reduce((sum, x) => sum + x.connections, 0),
                    pages: { aggregated: true },
                    aggregated: true
                });
            }
            return list;
        };

        const buildTrafficView = (d) => {
            const upload = parseFloat(d.upload_speed) || 0;
            const download = parseFloat(d.download_speed) || 0;
            const realHosts = (d.traffic_hosts || []).filter(h => h && h.ip);
            let clients;
            if (realHosts.length) {
                clients = realHosts.slice(0, 5).map(h => ({
                    ip: h.ip,
                    connections: h.connections || 0,
                    rx: parseFloat(h.rx) || 0,
                    tx: parseFloat(h.tx) || 0,
                    real: true
                }));
            } else {
                clients = pickTopClients(d.online_users || [], 4);
                const totalWeight = clients.reduce((s, c) => s + Math.max(c.connections, 1), 0) || 1;
                clients.forEach(c => {
                    const w = Math.max(c.connections, 1) / totalWeight;
                    c.rx = download * w;
                    c.tx = upload * w;
                });
            }
            const servicesRaw = (d.traffic_services || []).filter(s => s && s.port);
            let services = servicesRaw.slice(0, 4);
            if (!services.length) {
                services = [{ name: '当前端口', port: window.location.port || (location.protocol === 'https:' ? 443 : 80), protocol: 'tcp', rx: download, tx: upload, connections: d.online_count || 1 }];
            }
            const ifaces = (d.traffic_interfaces || []).slice(0, 4);
            const links = (d.traffic_links || []).filter(l => l && l.client_ip && ((parseFloat(l.rx) || 0) + (parseFloat(l.tx) || 0) > 0.1)).slice(0, 12);
            const connTotal = services.reduce((s, x) => s + (x.connections || 0), 0);
            const clientRx = clients.reduce((s, c) => s + c.rx, 0);
            const clientTx = clients.reduce((s, c) => s + c.tx, 0);
            return {
                upload,
                download,
                clients,
                services: services.map(s => ({ ...s, label: (s.name || '服务') + ':' + s.port })),
                links,
                serviceTotal: servicesRaw.length || services.length,
                ifaces,
                serverIP: d.server_ip || d.hostname || 'Server',
                hostname: d.hostname || '-',
                totalUpload: d.total_upload || '-',
                totalDownload: d.total_download || '-',
                onlineCount: d.online_count || 0,
                activeClients: new Set((d.online_users || []).map(u => u.ip)).size,
                activeConns: connTotal || d.online_count || 0,
                external: { rx: Math.max(0, download - clientRx), tx: Math.max(0, upload - clientTx) }
            };
        };

        const serviceIconName = (s) => {
            const n = (s.name || '').toLowerCase();
            const p = s.port;
            if (n === 'http' || n === 'nginx' || p === 80 || p === 443 || p === 8443 || p === 8081) return 'globe';
            if (n === 'redis' || n === 'mysql' || n === 'postgres' || p === 6379 || p === 3306 || p === 5432) return 'db';
            if (n === 'ssh' || p === 22) return 'ssh';
            if (n === 'openlist') return 'folder';
            return 'box';
        };

        const measureTrafficLines = () => {
            if (!status) return;
            const tv = buildTrafficView(status);
            const out = [];
            const center = (id) => {
                const c = CARD_LAYOUT[id];
                const d = dragPosRef.current[id] || { x: 0, y: 0 };
                return { x: c.left + c.w / 2 + d.x, y: c.top + c.h / 2 + d.y };
            };
            const addLine = (aId, bId, rx, tx, key) => {
                const a = center(aId);
                const b = center(bId);
                out.push({ key, rx: parseFloat(rx) || 0, tx: parseFloat(tx) || 0, x1: a.x, y1: a.y, x2: b.x, y2: b.y });
            };
            const clients = tv.clients.slice(0, 3);
            const services = tv.services.slice(0, 3);
            const ifaces = tv.ifaces.slice(0, 3);
            const clientIdx = {};
            const svcIdx = {};
            clients.forEach((c, i) => clientIdx[c.ip] = i);
            services.forEach((s, i) => svcIdx[s.port] = i);
            const linkedClients = {};
            const linkedSvcs = {};
            tv.links.forEach((lk, i) => {
                const ci = clientIdx[lk.client_ip];
                const si = svcIdx[lk.port];
                if (ci === undefined || si === undefined) return;
                linkedClients[ci] = true;
                linkedSvcs[si] = true;
                addLine('c' + ci, 's' + si, lk.rx, lk.tx, 'lk' + i);
            });
            clients.forEach((c, i) => {
                if (!linkedClients[i]) addLine('c' + i, 'server', c.rx, c.tx, 'cl' + i);
            });
            services.forEach((s, i) => {
                if (!linkedSvcs[i]) addLine('s' + i, 'server', s.rx, s.tx, 'sv' + i);
            });
            ifaces.forEach((f, i) => addLine(IFACE_SLOTS[i], 'server', f.rx, f.tx, 'if' + i));
            if (tv.clients.length > 3) addLine('other', 'server', 0, 0, 'oth');
            addLine('ext', 'server', tv.external.rx, tv.external.tx, 'ext');
            setLines(out);
        };

        const startDrag = (e, id) => {
            if (e.button !== 0 && e.pointerType === 'mouse') return;
            e.preventDefault();
            const cur = dragPosRef.current[id] || { x: 0, y: 0 };
            dragSession.current = { id, sx: e.clientX, sy: e.clientY, ox: cur.x, oy: cur.y, moved: false };
            const move = (ev) => {
                const s = dragSession.current;
                if (!s) return;
                const nx = s.ox + ev.clientX - s.sx;
                const ny = s.oy + ev.clientY - s.sy;
                if (Math.abs(nx - s.ox) + Math.abs(ny - s.oy) > 4) s.moved = true;
                dragPosRef.current[s.id] = { x: nx, y: ny };
                setDragTick(t => t + 1);
                measureTrafficLines();
            };
            const up = () => {
                if (dragSession.current) movedRef.current = dragSession.current.moved;
                window.removeEventListener('pointermove', move);
                window.removeEventListener('pointerup', up);
                dragSession.current = null;
                measureTrafficLines();
            };
            window.addEventListener('pointermove', move);
            window.addEventListener('pointerup', up);
        };

        const nodeStyle = (id) => {
            const c = CARD_LAYOUT[id];
            const p = dragPosRef.current[id];
            return {
                left: c.left,
                top: c.top,
                width: c.w,
                height: c.h,
                transform: p ? 'translate(' + p.x + 'px,' + p.y + 'px)' : undefined,
                zIndex: p ? 3 : undefined
            };
        };

        const resetLayout = () => {
            dragPosRef.current = {};
            setDragTick(t => t + 1);
            measureTrafficLines();
        };

        const nodeClick = (fn) => (e) => {
            if (movedRef.current) { movedRef.current = false; return; }
            fn(e);
        };

        const updateTrafficTrend = () => {
            if (chartRefs.current.trend && !chartInsts.current.trend) {
                chartInsts.current.trend = echarts.init(chartRefs.current.trend);
            }
            const inst = chartInsts.current.trend;
            if (!inst) return;
            const D = dataRef.current;
            const len = D.trendLabels.length;
            inst.setOption({
                animationDurationUpdate: 350,
                tooltip: {
                    trigger: 'axis',
                    backgroundColor: 'rgba(22,30,48,0.9)',
                    borderWidth: 0,
                    textStyle: { color: '#fff', fontSize: 12 },
                    formatter: ps => {
                        const rows = (ps || []).map(p => p.marker + ' ' + p.seriesName + ': ' + formatRate(p.value));
                        return ((ps && ps[0] && ps[0].axisValue) || '') + '<br/>' + rows.join('<br/>');
                    }
                },
                grid: { left: 8, right: 8, top: 16, bottom: 4, containLabel: true },
                xAxis: { type: 'category', boundaryGap: false, data: D.trendLabels.slice(), axisLine: { show: false }, axisTick: { show: false }, axisLabel: { color: '#8b93a5', fontSize: 10, interval: Math.max(0, Math.ceil(len / 6) - 1) } },
                yAxis: { type: 'value', axisLine: { show: false }, axisTick: { show: false }, axisLabel: { color: '#8b93a5', fontSize: 10 }, splitLine: { lineStyle: { color: 'rgba(120,130,150,0.16)', type: 'dashed' } } },
                series: [
                    { name: '下载流量 (RX)', type: 'line', smooth: 0.35, symbol: 'none', lineStyle: { width: 2, color: '#1677ff' }, itemStyle: { color: '#1677ff' }, areaStyle: { color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [{ offset: 0, color: 'rgba(22,119,255,0.28)' }, { offset: 1, color: 'rgba(22,119,255,0.02)' }]) }, data: D.trendRx.slice() },
                    { name: '上传流量 (TX)', type: 'line', smooth: 0.35, symbol: 'none', lineStyle: { width: 2, color: '#faad14' }, itemStyle: { color: '#faad14' }, areaStyle: { color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [{ offset: 0, color: 'rgba(250,173,20,0.24)' }, { offset: 1, color: 'rgba(250,173,20,0.02)' }]) }, data: D.trendTx.slice() }
                ]
            });
        };

        const connect = useCallback((i) => {
            if (reconnectTimer.current) { clearTimeout(reconnectTimer.current); reconnectTimer.current = null; }
            if (wsRef.current) { wsRef.current.onclose = null; wsRef.current.close(); }
            setConn('connecting');
            const sig = generateSignature('/ws');
            const url = baseUrl.replace(/^http/, 'ws') + '/ws?iface=' + encodeURIComponent(i) +
                '&timestamp=' + sig.timestamp + '&nonce=' + sig.nonce + '&signature=' + sig.signature;
            const ws = new WebSocket(url);
            wsRef.current = ws;
            ws.onopen = () => { setConn('connected'); reconnectAttempts.current = 0; };
            ws.onmessage = (e) => {
                try {
                    const d = JSON.parse(e.data);
                    setStatus(d);
                    setOnline(d.online_users || []);
                    setOnlineCount(d.online_count || 0);
                    updateCharts(d);
                } catch (err) { /* 忽略 */ }
            };
            ws.onerror = () => setConn('disconnected');
            ws.onclose = () => {
                setConn('disconnected');
                if (reconnectAttempts.current < 10) {
                    reconnectAttempts.current++;
                    const delay = Math.min(3000 * reconnectAttempts.current, 15000);
                    reconnectTimer.current = setTimeout(() => connect(i), delay);
                }
            };
        }, []);

        // 初始化图表
        useEffect(() => {
            ['cpu', 'mem', 'net', 'disk', 'trend'].forEach(k => {
                if (chartRefs.current[k] && !chartInsts.current[k]) {
                    chartInsts.current[k] = echarts.init(chartRefs.current[k]);
                }
            });
            const onR = () => {
                Object.values(chartInsts.current).forEach(c => c && c.resize());
                measureTrafficLines();
            };
            window.addEventListener('resize', onR);
            return () => {
                window.removeEventListener('resize', onR);
                Object.values(chartInsts.current).forEach(c => c && c.dispose());
                chartInsts.current = {};
            };
        }, []);

        // 流量拓扑连线与趋势图刷新
        useEffect(() => {
            if (chartRefs.current.trend && !chartInsts.current.trend) {
                chartInsts.current.trend = echarts.init(chartRefs.current.trend);
            }
            measureTrafficLines();
            updateTrafficTrend();
            const w = canvasWrapRef.current && canvasWrapRef.current.clientWidth;
            if (w > 0) setCanvasScale(Math.min(1, w / 1536));
        }, [status, isDark]);

        // 画布自适应缩放（1536x1024 设计稿等比缩放）
        useEffect(() => {
            const update = () => {
                const w = canvasWrapRef.current && canvasWrapRef.current.clientWidth;
                if (w > 0) setCanvasScale(Math.min(1, w / 1536));
            };
            update();
            window.addEventListener('resize', update);
            return () => window.removeEventListener('resize', update);
        }, []);

        // 加载网卡并连接
        useEffect(() => {
            secureFetch(baseUrl + '/status-ifaces')
                .then(r => r.json())
                .then(list => {
                    setIfaces(Array.isArray(list) ? list : []);
                    const pick = list && list.length > 1 ? list[1] : (list && list[0]);
                    if (pick) { setIface(pick); connect(pick); }
                })
                .catch(() => { setIface('eth4'); connect('eth4'); });
            return () => { if (wsRef.current) wsRef.current.close(); if (reconnectTimer.current) clearTimeout(reconnectTimer.current); };
        }, [connect]);

        const navBtns = [];
        navBtns.push(<Button key="ebooks" onClick={() => window.location.href = 'ebooks.html'}>📚 电子书</Button>);
        navBtns.push(<Button key="ip" onClick={() => window.location.href = 'ip-panel.html'}>🌐 IP 流量</Button>);
        if (hasPerm('files:manage')) navBtns.push(<Button key="files" onClick={() => window.location.href = 'files.html'}>📁 文件管理</Button>);
        if (hasPerm('system:process')) navBtns.push(<Button key="proc" onClick={() => window.location.href = 'process.html'}>⚙️ 进程</Button>);
        if (hasPerm('files:download')) navBtns.push(<Button key="dl" onClick={() => window.location.href = 'download.html'}>📥 安全下载</Button>);
        if (hasPerm('user:manage') || hasPerm('role:manage')) navBtns.push(<Button key="rbac" onClick={() => window.location.href = 'rbac.html'}>🛡️ 权限管理</Button>);

        const onlineCols = [
            { title: 'IP 地址', dataIndex: 'ip' },
            { title: '访问页面', dataIndex: 'page' },
            { title: '连接时间', dataIndex: 'since' },
            { title: '用户标识', dataIndex: 'user_agent', ellipsis: true }
        ];

        return (
            <ConfigProvider theme={{ algorithm: isDark ? darkAlgorithm : undefined }}>
                <div style={{ minHeight: '100vh', background: isDark ? '#141414' : '#f5f5f5' }}>
                    <div className={'topbar' + (isDark ? ' dark' : '')}>
                        <div className="brand"><span className="logo">🖥️</span><span>Server Status<span className="tb-sub"> · 实时监控</span></span></div>
                        <Space wrap>
                            <span style={{ display: 'inline-flex', alignItems: 'center', gap: 6 }}>
                                <Badge status={conn === 'connected' ? 'success' : conn === 'connecting' ? 'processing' : 'error'} />
                                <Typography.Text className="tb-status" type="secondary">{conn === 'connected' ? '已连接' : conn === 'connecting' ? '连接中...' : '已断开'}</Typography.Text>
                            </span>
                            <Button title={isDark ? '浅色模式' : '深色模式'} onClick={() => setIsDark(!isDark)}>{isDark ? '🌞' : '🌙'}<span className="tb-label">{isDark ? '浅色' : '深色'}</span></Button>
                            <Button danger title="退出登录" onClick={onLogout}>🚪<span className="tb-label">退出</span></Button>
                        </Space>
                    </div>
                    <div className="page-wrap">
                        <Space wrap style={{ marginBottom: 12 }}>
                            {navBtns}
                        </Space>

                        <div className="stat-grid stat-cards">
                            <Card size="small" hoverable bordered><Statistic title="CPU 使用率" value={status ? (parseFloat(status.cpu_usage) || 0).toFixed(1) : '-'} suffix="%" valueStyle={{ color: '#1677ff' }} /></Card>
                            <Card size="small" hoverable bordered><Statistic title="内存使用率" value={status ? (parseFloat(status.memory_usage) || 0).toFixed(1) : '-'} suffix="%" valueStyle={{ color: '#52c41a' }} /></Card>
                            <Card size="small" hoverable bordered><Statistic title="磁盘使用率" value={status ? (parseFloat(status.disk_usage) || 0).toFixed(1) : '-'} suffix="%" valueStyle={{ color: '#faad14' }} /></Card>
                            <Card size="small" hoverable bordered><Statistic title="在线用户" value={onlineCount} suffix="人" valueStyle={{ color: '#722ed1' }} /></Card>
                            <Card size="small" hoverable bordered><Statistic title="运行时间" value={status ? status.uptime : '-'} valueStyle={{ fontSize: 14 }} /></Card>
                        </div>

                        <Card size="small" style={{ marginBottom: 12 }}>
                            <Descriptions size="small" column={{ xs: 1, sm: 2, md: 4 }} items={[
                                { key: 'host', label: '主机名', children: status?.hostname || '-' },
                                { key: 'os', label: '操作系统', children: status?.os || '-' },
                                { key: 'kernel', label: '内核', children: status?.kernel_version || '-' },
                                { key: 'arch', label: '架构', children: status?.architecture || '-' },
                                { key: 'up', label: '上传总流量', children: status?.total_upload || '-' },
                                { key: 'down', label: '下载总流量', children: status?.total_download || '-' },
                                { key: 'load', label: '系统负载', children: status ? (status.load1 + ' / ' + status.load5 + ' / ' + status.load15) : '-' },
                                { key: 'net', label: '网络', children: status ? '↑' + (parseFloat(status.upload_speed) || 0).toFixed(1) + ' / ↓' + (parseFloat(status.download_speed) || 0).toFixed(1) + ' KB/s' : '-' }
                            ]} />
                        </Card>

                        <div className="stat-grid">
                            <Card size="small" hoverable bordered className="chart-card" title="📈 网络速率">
                                <div ref={el => chartRefs.current.net = el} className="chart"></div>
                            </Card>
                            <Card size="small" hoverable bordered className="chart-card" title="💿 磁盘 I/O">
                                <div ref={el => chartRefs.current.disk = el} className="chart"></div>
                            </Card>
                            <Card size="small" hoverable bordered className="chart-card" title="🔋 CPU 使用率">
                                <div ref={el => chartRefs.current.cpu = el} className="chart"></div>
                            </Card>
                            <Card size="small" hoverable bordered className="chart-card" title="🧠 内存使用率">
                                <div ref={el => chartRefs.current.mem = el} className="chart"></div>
                            </Card>
                        </div>

                        <Card size="small" bordered className="traffic-card" style={{ marginBottom: 12 }}>
                            {status ? (() => {
                                const tv = buildTrafficView(status);
                                const clients = tv.clients.slice(0, 3);
                                const services = tv.services.slice(0, 3);
                                const ifaces = tv.ifaces.slice(0, 3);
                                const hasOther = tv.clients.length > 3;
                                const extraRx = hasOther ? tv.clients.slice(3).reduce((s, c) => s + c.rx, 0) : 0;
                                const extraTx = hasOther ? tv.clients.slice(3).reduce((s, c) => s + c.tx, 0) : 0;
                                const rates = [tv.download, tv.upload, tv.external.rx, tv.external.tx];
                                clients.forEach(c => rates.push(c.rx, c.tx));
                                services.forEach(s => rates.push(parseFloat(s.rx) || 0, parseFloat(s.tx) || 0));
                                ifaces.forEach(f => rates.push(parseFloat(f.rx) || 0, parseFloat(f.tx) || 0));
                                const maxRate = Math.max.apply(null, rates) || 1;
                                const lineW = r => Math.max(1.2, Math.min(5, 1.2 + r / maxRate * 3.8));
                                return (
                                    <div className="traffic-wrap" ref={canvasWrapRef}>
                                        <div className="traffic-canvas" style={{ width: Math.round(1536 * canvasScale), height: Math.round(1024 * canvasScale), transform: 'scale(' + canvasScale + ')' }}>
                                            <div className="tr-head">
                                                <div className="tr-title">实时流量关系<span className="tr-live">实时</span></div>
                                                <div className="tr-sub">当前服务器网络流量拓扑关系</div>
                                            </div>
                                            <button type="button" className="tr-layout-btn" onClick={resetLayout} title="恢复自动布局">自动布局</button>
                                            <div className="tr-stats">
                                                <div className="tr-stat">
                                                    <span className="tr-ico">{iconEl('down', 17)}</span>
                                                    <div><span className="tr-label">总下载速度</span><span className="tr-value rx">{formatRate(tv.download)}</span></div>
                                                </div>
                                                <div className="tr-stat">
                                                    <span className="tr-ico">{iconEl('up', 17)}</span>
                                                    <div><span className="tr-label">总上传速度</span><span className="tr-value tx">{formatRate(tv.upload)}</span></div>
                                                </div>
                                                <div className="tr-stat">
                                                    <span className="tr-ico">{iconEl('link', 16)}</span>
                                                    <div><span className="tr-label">活跃连接</span><span className="tr-value">{tv.activeConns}</span></div>
                                                </div>
                                                <div className="tr-stat">
                                                    <span className="tr-ico">{iconEl('users', 16)}</span>
                                                    <div><span className="tr-label">活跃客户端</span><span className="tr-value">{tv.activeClients}</span></div>
                                                </div>
                                                <div className="tr-stat">
                                                    <span className="tr-ico">{iconEl('box', 16)}</span>
                                                    <div><span className="tr-label">应用服务</span><span className="tr-value">{tv.serviceTotal}</span></div>
                                                </div>
                                            </div>

                                            <svg className="tr-svg" viewBox="0 0 1536 1024" preserveAspectRatio="none" aria-hidden="true">
                                                {lines.map(l => (
                                                    <line key={l.key} x1={l.x1} y1={l.y1} x2={l.x2} y2={l.y2}
                                                          stroke={l.rx >= l.tx ? '#1677ff' : '#13c2c2'}
                                                          strokeWidth={lineW(Math.max(l.rx, l.tx))}
                                                          strokeOpacity={0.4} />
                                                ))}
                                            </svg>

                                            <div className="tr-topo">

                                                <div className={'tr-node server' + (detailKey && detailKey.type === 'server' ? ' active' : '')}
                                                     style={nodeStyle('server')}
                                                     onPointerDown={e => startDrag(e, 'server')}
                                                     onClick={nodeClick(() => setDetailKey({ type: 'server' }))}>
                                                    <span className="tr-ico">{iconEl('server', 17)}</span>
                                                    <div className="tr-body">
                                                        <div className="tr-name">本机 / Server</div>
                                                        <div className="tr-info">{tv.serverIP}</div>
                                                        <div className="tr-rates">
                                                            <span className="tr-rate rx"><i>{iconEl('down', 9)}</i><b>{formatRate(tv.download)}</b></span>
                                                            <span className="tr-rate tx"><i>{iconEl('up', 9)}</i><b>{formatRate(tv.upload)}</b></span>
                                                        </div>
                                                    </div>
                                                    <span className="tr-dot" />
                                                </div>

                                                {ifaces.map((f, i) => (
                                                    <div key={f.name}
                                                         className={'tr-node' + (detailKey && detailKey.type === 'iface' && detailKey.name === f.name ? ' active' : '')}
                                                         style={nodeStyle(IFACE_SLOTS[i])}
                                                         onPointerDown={e => startDrag(e, IFACE_SLOTS[i])}
                                                         onClick={nodeClick(() => setDetailKey({ type: 'iface', name: f.name }))}>
                                                        <span className="tr-ico">{iconEl('plug', 15)}</span>
                                                        <div className="tr-body">
                                                            <div className="tr-name">{f.name}</div>
                                                            <div className="tr-info">{f.ip || (f.up ? '已连接' : '未连接')}</div>
                                                            <div className="tr-rates">
                                                                <span className="tr-rate rx"><i>{iconEl('down', 9)}</i><b>{formatRate(f.rx)}</b></span>
                                                                <span className="tr-rate tx"><i>{iconEl('up', 9)}</i><b>{formatRate(f.tx)}</b></span>
                                                            </div>
                                                        </div>
                                                        <span className={'tr-dot' + (f.up ? '' : ' off')} />
                                                    </div>
                                                ))}

                                                {hasOther && (
                                                    <div className="tr-node"
                                                         style={nodeStyle('other')}
                                                         onPointerDown={e => startDrag(e, 'other')}
                                                         onClick={nodeClick(() => setDetailKey({ type: 'other' }))}>
                                                        <span className="tr-ico">{iconEl('users', 15)}</span>
                                                        <div className="tr-body">
                                                            <div className="tr-name">其他主机</div>
                                                            <div className="tr-info">{tv.clients.length - 3} 个主机</div>
                                                            <div className="tr-rates">
                                                                <span className="tr-rate rx"><i>{iconEl('down', 9)}</i><b>{formatRate(extraRx)}</b></span>
                                                                <span className="tr-rate tx"><i>{iconEl('up', 9)}</i><b>{formatRate(extraTx)}</b></span>
                                                            </div>
                                                        </div>
                                                    </div>
                                                )}

                                                <div className={'tr-node' + (detailKey && detailKey.type === 'external' ? ' active' : '')}
                                                     style={nodeStyle('ext')}
                                                     onPointerDown={e => startDrag(e, 'ext')}
                                                     onClick={nodeClick(() => setDetailKey({ type: 'external' }))}>
                                                    <span className="tr-ico">{iconEl('globe', 15)}</span>
                                                    <div className="tr-body">
                                                        <div className="tr-name">互联网</div>
                                                        <div className="tr-info">外部网络</div>
                                                        <div className="tr-rates">
                                                            <span className="tr-rate rx"><i>{iconEl('down', 9)}</i><b>{formatRate(tv.external.rx)}</b></span>
                                                            <span className="tr-rate tx"><i>{iconEl('up', 9)}</i><b>{formatRate(tv.external.tx)}</b></span>
                                                        </div>
                                                    </div>
                                                </div>

                                                {clients.map((c, i) => (
                                                    <div key={c.ip}
                                                         className={'tr-node' + (detailKey && detailKey.type === 'client' && detailKey.ip === c.ip ? ' active' : '')}
                                                         style={nodeStyle('c' + i)}
                                                         onPointerDown={e => startDrag(e, 'c' + i)}
                                                         onClick={nodeClick(() => setDetailKey({ type: 'client', ip: c.ip }))}>
                                                        <span className="tr-ico">{iconEl(c.aggregated ? 'users' : 'laptop', 15)}</span>
                                                        <div className="tr-body">
                                                            <div className="tr-name">{c.ip}</div>
                                                            <div className="tr-rates">
                                                                <span className="tr-rate rx"><i>{iconEl('down', 9)}</i><b>{formatRate(c.rx)}</b></span>
                                                                <span className="tr-rate tx"><i>{iconEl('up', 9)}</i><b>{formatRate(c.tx)}</b></span>
                                                            </div>
                                                        </div>
                                                        <span className="tr-num">{i + 1}</span>
                                                        <span className="tr-badge">Clients ({c.connections})</span>
                                                    </div>
                                                ))}

                                                {services.map((s, i) => (
                                                    <div key={s.port}
                                                         className={'tr-node' + (detailKey && detailKey.type === 'service' && detailKey.port === s.port ? ' active' : '')}
                                                         style={nodeStyle('s' + i)}
                                                         onPointerDown={e => startDrag(e, 's' + i)}
                                                         onClick={nodeClick(() => setDetailKey({ type: 'service', port: s.port }))}>
                                                        <span className="tr-ico">{iconEl(serviceIconName(s), 15)}</span>
                                                        <div className="tr-body">
                                                            <div className="tr-name">{s.label}</div>
                                                            <div className="tr-info">{(s.protocol || 'tcp').toUpperCase()}</div>
                                                            <div className="tr-rates">
                                                                <span className="tr-rate rx"><i>{iconEl('down', 9)}</i><b>{formatRate(s.rx)}</b></span>
                                                                <span className="tr-rate tx"><i>{iconEl('up', 9)}</i><b>{formatRate(s.tx)}</b></span>
                                                            </div>
                                                        </div>
                                                        <span className="tr-num">{i + 1}</span>
                                                    </div>
                                                ))}

                                            </div>
                                            <div className="tr-bottom">
                                                <div className="tr-panel clients">
                                                    <div className="tr-panel-title">TOP 客户端</div>
                                                    {clients.map((c, i) => (
                                                        <div key={c.ip} className="tr-row">
                                                            <span className="tr-num">{i + 1}</span>
                                                            <span className="tr-row-name">{c.ip}</span>
                                                            <span className="tr-row-rates">
                                                                <span className="rx">↓ {formatRate(c.rx)}</span>
                                                                <span className="tx">↑ {formatRate(c.tx)}</span>
                                                            </span>
                                                        </div>
                                                    ))}
                                                </div>
                                                <div className="tr-panel services">
                                                    <div className="tr-panel-title">TOP 应用服务<span className="tr-count">Services ({tv.serviceTotal})</span></div>
                                                    {services.map((s, i) => (
                                                        <div key={s.port} className="tr-row">
                                                            <span className="tr-num">{i + 1}</span>
                                                            <span className="tr-row-name">{s.label}</span>
                                                            <span className="tr-row-rates">
                                                                <span className="rx">↓ {formatRate(s.rx)}</span>
                                                                <span className="tx">↑ {formatRate(s.tx)}</span>
                                                            </span>
                                                        </div>
                                                    ))}
                                                </div>
                                                <div className="tr-panel trend">
                                                    <div className="tr-panel-title">流量趋势（1 分钟）</div>
                                                    <div className="tr-trend-chart">
                                                        <div ref={el => chartRefs.current.trend = el} style={{ width: '100%', height: '100%' }}></div>
                                                    </div>
                                                </div>
                                            </div>

                                            <div className="tr-legend">
                                                <span className="lg lg-rx">下载流量 (RX)</span>
                                                <span className="lg lg-tx">上传流量 (TX)</span>
                                            </div>
                                        </div>
                                    </div>
                                );
                            })() : <div style={{ padding: 40, textAlign: 'center', color: '#8b93a5' }}>等待流量数据...</div>}
                        </Card>

                        <div className="stat-grid" style={{ gridTemplateColumns: 'repeat(auto-fit, minmax(300px, 1fr))' }}>
                            <Card size="small" hoverable bordered title={`👥 在线用户（${onlineCount}）`}>
                                <Table size="small" rowKey={(_, i) => i} dataSource={online} columns={onlineCols}
                                       pagination={false} scroll={{ y: 240, x: 'max-content' }} />
                            </Card>
                        </div>

                        <Alert type="info" showIcon style={{ marginTop: 12 }}
                               message={conn !== 'connected' ? '⚠️ WebSocket 连接已断开，正在自动重连，图表暂停更新' : '✅ 实时数据推送中，每 1 秒更新一次'} />
                    </div>
                    <MediaWindow />
                </div>
            </ConfigProvider>
        );
    }

    function MediaWindow() {
        const [src, setSrc] = useState(null);
        const [playing, setPlaying] = useState(true);
        const [zoomed, setZoomed] = useState(false);
        const [volume, setVolume] = useState(() => {
            const v = parseFloat(localStorage.getItem('media_volume'));
            return isFinite(v) && v >= 0 && v <= 1 ? v : 0.5;
        });
        const [muted, setMuted] = useState(() => localStorage.getItem('media_sound') !== 'on');
        const videoRef = useRef(null);
        const isVideo = src && /\.(mp4|webm|mov)(\?|$)/i.test(src);
        const fixSrc = (u) => {
            try {
                const p = new URL(u);
                p.hostname = window.location.hostname;
                return p.toString();
            } catch (e) { return u; }
        };

        const load = useCallback(() => {
            secureFetch(baseUrl + '/random-media')
                .then(r => r.json())
                .then(d => { if (d && d.src) { setSrc(fixSrc(d.src)); setPlaying(true); setMuted(localStorage.getItem('media_sound') !== 'on'); } })
                .catch(() => {});
        }, []);
        useEffect(() => {
            load();
            const t = setInterval(load, 80000);
            return () => clearInterval(t);
        }, [load]);
        useEffect(() => {
            const v = videoRef.current;
            if (!v) return;
            v.muted = muted;
            v.volume = volume;
            if (playing) v.play().catch(() => {});
            else v.pause();
        }, [src, playing, volume, muted]);
        useEffect(() => { localStorage.setItem('media_sound', muted ? 'off' : 'on'); }, [muted]);
        useEffect(() => { localStorage.setItem('media_volume', String(volume)); }, [volume]);

        return (
            <div className={'media-window' + (zoomed ? ' zoomed' : '')}>
                <div className="media-head">
                    <span className="m-title">🎬 媒体展示</span>
                    {isVideo && <window.antd.Slider min={0} max={1} step={0.05} value={volume}
                        onChange={v => { setVolume(v); setMuted(v === 0); }}
                        style={{ width: 70, margin: 0 }} tooltip={{ open: false }} />}
                    {isVideo && <window.antd.Button size="small" type="text"
                        onClick={() => {
                            const nextMuted = !muted;
                            const v = videoRef.current;
                            if (!nextMuted && v) {
                                const vol = volume > 0 ? volume : 0.5;
                                setVolume(vol);
                                v.muted = false;
                                v.volume = vol;
                                v.play().catch(() => {});
                            } else if (nextMuted && v) {
                                v.muted = true;
                            }
                            setMuted(nextMuted);
                        }}
                        title={muted ? '取消静音' : '静音'}>{muted ? '🔇' : '🔊'}</window.antd.Button>}
                    <window.antd.Button size="small" type="text" onClick={load} title="刷新">🔄</window.antd.Button>
                    {isVideo && <window.antd.Button size="small" type="text"
                        onClick={() => setPlaying(!playing)} title={playing ? '暂停' : '播放'}>{playing ? '⏸' : '▶'}</window.antd.Button>}
                    <window.antd.Button size="small" type="text" onClick={() => setZoomed(!zoomed)}
                        title={zoomed ? '还原' : '放大'}>{zoomed ? '🗕' : '⛶'}</window.antd.Button>
                </div>
                <div className="media-body" onClick={() => isVideo && setPlaying(!playing)}>
                    {!src ? <span className="placeholder">加载媒体中...</span>
                        : isVideo
                            ? <video ref={videoRef} src={src} muted={muted} playsInline loop autoPlay />
                            : <img src={src} alt="media" />}
                </div>
            </div>
        );
    }

    function App() {
        const [user, setUser] = useState(null);
        const [checking, setChecking] = useState(true);
        useEffect(() => {
            secureFetch(baseUrl + '/check-auth')
                .then(r => r.json())
                .then(d => { setUser(d.code === 200 ? d.user : null); setChecking(false); })
                .catch(() => setChecking(false));
        }, []);
        if (checking) {
            return <div style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center' }}><Card loading style={{ width: 320 }} /></div>;
        }
        if (!user) return <Login onLogin={setUser} />;
        return <Dashboard key={user.username} user={user} onLogout={() => {
            secureFetch(baseUrl + '/logout', { method: 'POST' }).finally(() => { SessionManager.clear(); setUser(null); });
        }} />;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
