<body>
    <div id="root"></div>
    <script type="text/babel">
        const { Card, Table, Button, Input, Form, Tag, Space, Statistic, Typography, ConfigProvider, theme, message, Descriptions, Badge, Alert, Tooltip, Modal, Progress } = window.antd;
        const { useState, useEffect, useRef, useCallback } = React;

        // 磁盘容量展示格式化（后端下发原始字节）
        const fmtDiskSize = (b) => {
            const v = Number(b) || 0;
            if (v >= 1024 ** 3) return (v / 1024 ** 3).toFixed(1) + ' GB';
            if (v >= 1024 ** 2) return (v / 1024 ** 2).toFixed(0) + ' MB';
            if (v >= 1024) return (v / 1024).toFixed(0) + ' KB';
            return v + ' B';
        };
        const { darkAlgorithm } = theme;
        const IconSet = window.icons || {};
        const UIIcon = ({ name, ...props }) => { const C = IconSet[name]; return C ? <C {...props} /> : null; };

        const baseUrl = window.location.origin;
        const SESSION_KEY = 'server_monitor_session';
        const LOCAL_KEY = 'server_monitor_remember';

        // 读取指定名称的 Cookie（Double-Submit CSRF 使用非 HttpOnly 的 csrf_token，会话 Cookie 仍为 HttpOnly）
        const getCookie = name => {
            for (const part of document.cookie.split(';')) {
                const eq = part.indexOf('=');
                if (eq < 0) continue;
                if (part.slice(0, eq).trim() === name) return decodeURIComponent(part.slice(eq + 1));
            }
            return '';
        };
        const getCsrfToken = () => getCookie('csrf_token');

        // 统一携带会话的 API 请求：写操作自动附加 CSRF Token，不再由浏览器自行计算 HMAC 签名
        const secureFetch = (url, options = {}) => {
            const method = options.method || 'GET';
            const headers = { 'Content-Type': 'application/json', ...(options.headers || {}) };
            if (/^(POST|PUT|PATCH|DELETE)$/i.test(method)) {
                const tok = getCsrfToken();
                if (tok) headers['X-CSRF-Token'] = tok;
            }
            return fetch(url, {
                method,
                headers,
                credentials: 'include',
                body: options.body
            });
        };

        const SessionManager = {
            save: (user, remember) => {
                const data = { user, timestamp: Date.now(), expiry: Date.now() + 30 * 24 * 3600 * 1000 };
                (remember ? localStorage : sessionStorage).setItem(remember ? LOCAL_KEY : SESSION_KEY, JSON.stringify(data));
            },
            get: () => {
                try {
                    const s = sessionStorage.getItem(SESSION_KEY) || localStorage.getItem(LOCAL_KEY);
                    return s ? JSON.parse(s) : null;
                } catch (e) { return null; }
            },
            clear: () => { sessionStorage.removeItem(SESSION_KEY); localStorage.removeItem(LOCAL_KEY); }
        };

        const hexToRgba = (hex, a) => {
            const h = hex.replace('#', '');
            return 'rgba(' + parseInt(h.substring(0, 2), 16) + ',' + parseInt(h.substring(2, 4), 16) + ',' + parseInt(h.substring(4, 6), 16) + ',' + a + ')';
        };

        function Login({ onLogin }) {
            const [mode, setMode] = useState('login');
            const [loading, setLoading] = useState(false);
            const [form] = Form.useForm();
            // 前端验证码：答案仅保存在内存 state，不写入任何存储；提交前校验不过则不发请求
            const [captcha, setCaptcha] = useState('');
            const [captchaInput, setCaptchaInput] = useState('');
            const captchaRef = useRef(null);

            // 绘制验证码到 canvas（加入干扰线/噪点，字符随机角度）
            const drawCaptcha = useCallback((code) => {
                const cv = captchaRef.current;
                if (!cv) return;
                const ctx = cv.getContext('2d');
                const W = cv.width, H = cv.height;
                ctx.clearRect(0, 0, W, H);
                const bg = document.body.getAttribute('data-theme') === 'dark' ? '#1f1f1f' : '#f5f5f5';
                ctx.fillStyle = bg;
                ctx.fillRect(0, 0, W, H);
                // 干扰元素保持克制：2 条细线 + 12 个噪点，避免影响可读性
                const rndColor = () => 'hsl(' + Math.floor(Math.random() * 360) + ',55%,45%)';
                for (let i = 0; i < 2; i++) {
                    ctx.strokeStyle = rndColor();
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(Math.random() * W, Math.random() * H);
                    ctx.lineTo(Math.random() * W, Math.random() * H);
                    ctx.stroke();
                }
                for (let i = 0; i < 12; i++) {
                    ctx.fillStyle = rndColor();
                    ctx.fillRect(Math.random() * W, Math.random() * H, 1.5, 1.5);
                }
                // 字符：使用深色系高对比度颜色，便于快速识别
                const ink = ['#1677ff', '#722ed1', '#fa8c16', '#1668dc', '#531dab'];
                ctx.font = 'bold 22px "Consolas", "Courier New", monospace';
                code.split('').forEach((ch, i) => {
                    ctx.fillStyle = ink[i % ink.length];
                    ctx.save();
                    ctx.translate(14 + i * 24, 26);
                    ctx.rotate((Math.random() - 0.5) * 0.4);
                    ctx.fillText(ch, 0, 0);
                    ctx.restore();
                });
            }, []);

            // 生成新验证码（4 位：去掉易混淆的 0/O/1/I）
            const genCaptcha = useCallback(() => {
                const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
                let s = '';
                for (let i = 0; i < 4; i++) s += chars[Math.floor(Math.random() * chars.length)];
                setCaptcha(s);
                drawCaptcha(s);
            }, [drawCaptcha]);

            // 初始化：生成验证码 + 记住我预填上次登录的用户名
            useEffect(() => {
                genCaptcha();
                const cached = SessionManager.get();
                if (cached && cached.user && cached.user.username) {
                    form.setFieldsValue({ username: cached.user.username });
                }
            }, []);

            const submit = async () => {
                const v = await form.validateFields();
                // 登录模式必须通过前端验证码
                if (mode === 'login') {
                    if (!captchaInput.trim() || captchaInput.trim().toUpperCase() !== captcha) {
                        message.error('验证码错误');
                        genCaptcha();
                        setCaptchaInput('');
                        return;
                    }
                }
                setLoading(true);
                try {
                    const r = await fetch(baseUrl + '/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        credentials: 'include',
                        body: JSON.stringify(mode === 'login' ? { username: v.username, password: v.password, remember: !!v.remember } : { username: v.username, email: v.email, password: v.password })
                    });
                    const d = await r.json();
                    if (d.code === 200) {
                        SessionManager.save(d.user, !!v.remember);
                        message.success('登录成功');
                        onLogin(d.user);
                    } else {
                        message.error(d.message || '登录失败');
                        genCaptcha();
                        setCaptchaInput('');
                    }
                } catch (e) {
                    message.error('网络错误: ' + e.message);
                    genCaptcha();
                    setCaptchaInput('');
                } finally {
                    setLoading(false);
                }
            };
            return (
                <div className="login-bg">
                    <Card style={{ width: '100%', maxWidth: 420 }}>
                        <div style={{ textAlign: 'center', marginBottom: 20 }}>
                            <div style={{ fontSize: 40 }}><UIIcon name="DashboardOutlined" /></div>
                            <Typography.Title level={3} style={{ marginBottom: 4 }}>Server Status</Typography.Title>
                            <Typography.Text type="secondary">服务器状态监控系统</Typography.Text>
                        </div>
                        <Form form={form} layout="vertical" onFinish={submit}>
                            <Form.Item name="username" label="用户名" rules={[{ required: true, message: '请输入用户名' }]}>
                                <Input placeholder="用户名" size="large" />
                            </Form.Item>
                            {mode === 'register' && (
                                <Form.Item name="email" label="邮箱" rules={[{ required: true, type: 'email', message: '请输入有效邮箱' }]}>
                                    <Input placeholder="user@example.com" size="large" />
                                </Form.Item>
                            )}
                            <Form.Item name="password" label="密码" rules={[{ required: true, message: '请输入密码' }]}>
                                <Input.Password placeholder="密码" size="large" />
                            </Form.Item>
                            {mode === 'login' && (
                                <>
                                    <Form.Item label="验证码" required>
                                        <div style={{ display: 'flex', gap: 8 }}>
                                            <Input placeholder="请输入验证码" size="large"
                                                value={captchaInput} onChange={e => setCaptchaInput(e.target.value)} />
                                            <canvas ref={captchaRef} width={108} height={40}
                                                onClick={genCaptcha}
                                                title="点击刷新验证码"
                                                role="img" aria-label="图形验证码，点击可刷新"
                                                style={{ cursor: 'pointer', border: '1px solid #d9d9d9', borderRadius: 6, height: 40 }} />
                                        </div>
                                    </Form.Item>
                                    <Form.Item name="remember" valuePropName="checked" style={{ marginBottom: 8 }}>
                                        <Checkbox>记住我</Checkbox>
                                    </Form.Item>
                                </>
                            )}
                            <Button type="primary" htmlType="submit" block size="large" loading={loading}>
                                {mode === 'login' ? '登 录' : '注 册'}
                            </Button>
                            <div style={{ textAlign: 'center', marginTop: 12 }}>
                                <Typography.Link onClick={() => { setMode(mode === 'login' ? 'register' : 'login'); form.resetFields(); setCaptchaInput(''); genCaptcha(); }}>
                                    {mode === 'login' ? '没有账户？注册新账户' : '已有账户？返回登录'}
                                </Typography.Link>
                            </div>
                        </Form>
                    </Card>
                </div>
            );
        }
        const Checkbox = window.antd.Checkbox;

        function Dashboard({ user, onLogout }) {
            const [isDark, setIsDark] = useState(() => localStorage.getItem('theme') === 'dark');
            const [mediaClosed, setMediaClosed] = useState(() => localStorage.getItem('media_closed') === '1');
            const [status, setStatus] = useState(null);
            const [online, setOnline] = useState([]);
            const [onlineCount, setOnlineCount] = useState(0);
            const [conn, setConn] = useState('disconnected');
            const [ifaces, setIfaces] = useState([]);
            const [iface, setIface] = useState('');
            const wsRef = useRef(null);
            const reconnectTimer = useRef(null);
            const reconnectAttempts = useRef(0);
            const chartRefs = useRef({});
            const chartInsts = useRef({});
            const dataRef = useRef({ labels: [], cpu: [], mem: [], up: [], down: [], r: [], w: [] });
            // 记录 WebSocket 最后一次收到数据的时间，用于展示数据时效
            const [lastUpd, setLastUpd] = useState(null);
            // SSL 证书到期信息与详情弹窗开关
            const [sslInfo, setSslInfo] = useState(null);
            const [sslOpen, setSslOpen] = useState(false);

            const hasPerm = p => (user.permissions || []).some(x => x === '*' || x === p);

            useEffect(() => {
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
                document.documentElement.classList.toggle('dark', isDark);
                document.body.classList.toggle('dark', isDark);
                document.body.style.background = isDark ? '#141414' : '#f5f5f5';
            }, [isDark]);

            // 拉取 SSL 证书到期信息：挂载时一次 + 每 10 分钟刷新
            useEffect(() => {
                const loadSSL = () => {
                    fetch('/api/ssl/expiry', { credentials: 'include' })
                        .then(r => r.ok ? r.json() : Promise.reject(r.status))
                        .then(d => setSslInfo(d && d.days_left !== undefined ? d : null))
                        .catch(() => setSslInfo(null));
                };
                loadSSL();
                const t = setInterval(loadSSL, 10 * 60 * 1000);
                return () => clearInterval(t);
            }, []);

            const push = (arr, v, max = 20) => { arr.push(v); if (arr.length > max) arr.shift(); };

            const updateCharts = (d) => {
                const t = new Date().toLocaleTimeString();
                const D = dataRef.current;
                D.labels.push(t); if (D.labels.length > 20) D.labels.shift();
                push(D.cpu, (parseFloat(d.cpu_usage) || 0).toFixed(2));
                push(D.mem, (parseFloat(d.memory_usage) || 0).toFixed(2));
                push(D.up, (parseFloat(d.upload_speed) || 0).toFixed(2));
                push(D.down, (parseFloat(d.download_speed) || 0).toFixed(2));
                push(D.r, (parseFloat(d.read_speed) || 0).toFixed(2));
                push(D.w, (parseFloat(d.write_speed) || 0).toFixed(2));
                setOption('cpu', ['#1677ff'], D.labels, D.cpu, 'CPU 使用率 (%)');
                setOption('mem', ['#52c41a'], D.labels, D.mem, '内存使用率 (%)');
                setOption('net', ['#fa8c16', '#1677ff'], D.labels, [D.up, D.down], '网络速率 (KB/s)');
                setOption('disk', ['#13c2c2', '#722ed1'], D.labels, [D.r, D.w], '磁盘 I/O (KB/s)');
            };

            const setOption = (key, colors, labels, series, title) => {
                const inst = chartInsts.current[key];
                if (!inst) return;
                const s = Array.isArray(series[0]) ? series : [series];
                inst.setOption({
                    title: { text: title, left: 'center', textStyle: { fontSize: 13, color: '#999' } },
                    tooltip: { trigger: 'axis', backgroundColor: 'rgba(22,30,48,0.9)', borderWidth: 0, textStyle: { color: '#fff' } },
                    grid: { left: 10, right: 14, top: 36, bottom: 4, containLabel: true },
                    xAxis: { type: 'category', boundaryGap: false, data: labels.slice(), axisLine: { show: false }, axisTick: { show: false }, axisLabel: { color: '#8b93a5', fontSize: 11 } },
                    yAxis: { type: 'value', axisLine: { show: false }, axisTick: { show: false }, axisLabel: { color: '#8b93a5', fontSize: 11 }, splitLine: { lineStyle: { color: 'rgba(120,130,150,0.16)', type: 'dashed' } } },
                    series: s.map((arr, i) => ({
                        name: arr === series[0] && key === 'net' ? '上传' : arr === series[1] && key === 'net' ? '下载' : arr === series[0] && key === 'disk' ? '读取' : arr === series[1] && key === 'disk' ? '写入' : (key === 'cpu' ? 'CPU' : key === 'mem' ? '内存' : ''),
                        type: 'line', smooth: 0.35, symbol: 'none',
                        lineStyle: { width: 2.5, color: colors[i] }, itemStyle: { color: colors[i] },
                        areaStyle: { color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [{ offset: 0, color: hexToRgba(colors[i], 0.3) }, { offset: 1, color: hexToRgba(colors[i], 0.02) }]) },
                        data: arr.slice()
                    }))
                });
            };

            const pickTopClients = (users, maxCount) => {
                const map = {};
                (users || []).forEach(u => {
                    const ip = u.ip || '未知客户端';
                    if (!map[ip]) map[ip] = { ip, connections: 0, pages: {} };
                    map[ip].connections += 1;
                    map[ip].pages[u.page || 'websocket'] = true;
                });
                let list = Object.values(map).sort((a, b) => b.connections - a.connections);
                if (list.length > maxCount) {
                    const rest = list.slice(maxCount - 1);
                    list = list.slice(0, maxCount - 1);
                    list.push({
                        ip: '其他客户端',
                        connections: rest.reduce((sum, x) => sum + x.connections, 0),
                        pages: { aggregated: true },
                        aggregated: true
                    });
                }
                return list;
            };

            const connect = useCallback((i) => {
                if (reconnectTimer.current) { clearTimeout(reconnectTimer.current); reconnectTimer.current = null; }
                if (wsRef.current) { wsRef.current.onclose = null; wsRef.current.close(); }
                setConn('connecting');
                // WebSocket 由服务端通过会话 Cookie + Origin 校验，浏览器不再传递 HMAC 签名参数
                const url = baseUrl.replace(/^http/, 'ws') + '/ws?iface=' + encodeURIComponent(i);
                const ws = new WebSocket(url);
                wsRef.current = ws;
                ws.onopen = () => { setConn('connected'); reconnectAttempts.current = 0; };
                ws.onmessage = (e) => {
                    try {
                        const d = JSON.parse(e.data);
                        setStatus(d);
                        setOnline(d.online_users || []);
                        setOnlineCount(d.online_count || 0);
                        updateCharts(d);
                        setLastUpd(new Date());
                    } catch (err) { /* 忽略 */ }
                };
                ws.onerror = () => setConn('disconnected');
                ws.onclose = () => {
                    setConn('disconnected');
                    if (reconnectAttempts.current < 10) {
                        reconnectAttempts.current++;
                        const delay = Math.min(3000 * reconnectAttempts.current, 15000);
                        reconnectTimer.current = setTimeout(() => connect(i), delay);
                    }
                };
            }, []);

            // 初始化图表
            useEffect(() => {
                ['cpu', 'mem', 'net', 'disk'].forEach(k => {
                    if (chartRefs.current[k] && !chartInsts.current[k]) {
                        chartInsts.current[k] = echarts.init(chartRefs.current[k]);
                    }
                });
                const onR = () => {
                    Object.values(chartInsts.current).forEach(c => c && c.resize());
                };
                window.addEventListener('resize', onR);
                return () => {
                    window.removeEventListener('resize', onR);
                    Object.values(chartInsts.current).forEach(c => c && c.dispose());
                    chartInsts.current = {};
                };
            }, []);

            // 加载网卡并连接
            useEffect(() => {
                secureFetch(baseUrl + '/status-ifaces')
                    .then(r => r.json())
                    .then(list => {
                        setIfaces(Array.isArray(list) ? list : []);
                        const pick = list && list.length > 1 ? list[1] : (list && list[0]);
                        if (pick) { setIface(pick); connect(pick); }
                    })
                    .catch(() => { setIface('eth4'); connect('eth4'); });
                return () => { if (wsRef.current) wsRef.current.close(); if (reconnectTimer.current) clearTimeout(reconnectTimer.current); };
            }, [connect]);

            const navBtns = [];
            navBtns.push(<Button key="ebooks" icon={<UIIcon name="BookOutlined" />} onClick={() => window.location.href = 'ebooks.html'}>电子书</Button>);
            navBtns.push(<Button key="ip" icon={<UIIcon name="GlobalOutlined" />} onClick={() => window.location.href = 'ip-panel.html'}>IP 流量</Button>);
            if (hasPerm('service:view') || hasPerm('port:view')) navBtns.push(<Button key="services" icon={<UIIcon name="AppstoreOutlined" />} onClick={() => window.location.href = 'services.html'}>服务端口</Button>);
            if (hasPerm('docker:view') || hasPerm('docker:manage')) navBtns.push(<Button key="docker" icon={<UIIcon name="DockerOutlined" />} onClick={() => window.location.href = 'docker.html'}>Docker</Button>);
            if (hasPerm('trojan:manage')) navBtns.push(<Button key="trojan" icon={<UIIcon name="ApiOutlined" />} onClick={() => window.location.href = '/trojan'}>Trojan-Go</Button>);
            if (hasPerm('system:exec')) navBtns.push(<Button key="shell" icon={<UIIcon name="CodeOutlined" />} onClick={() => window.location.href = 'shell.html'}>Web Shell</Button>);
            if (hasPerm('files:manage')) navBtns.push(<Button key="files" icon={<UIIcon name="FolderOutlined" />} onClick={() => window.location.href = 'files.html'}>文件管理</Button>);
            if (hasPerm('system:process')) navBtns.push(<Button key="proc" icon={<UIIcon name="SettingOutlined" />} onClick={() => window.location.href = 'process.html'}>进程</Button>);
            if (hasPerm('system:log')) navBtns.push(<Button key="logs" icon={<UIIcon name="FileSearchOutlined" />} onClick={() => window.location.href = 'log.html'}>日志</Button>);
            if (hasPerm('files:download')) navBtns.push(<Button key="dl" icon={<UIIcon name="DownloadOutlined" />} onClick={() => window.location.href = 'download.html'}>安全下载</Button>);
            if (hasPerm('user:manage') || hasPerm('role:manage')) navBtns.push(<Button key="rbac" icon={<UIIcon name="SafetyCertificateOutlined" />} onClick={() => window.location.href = 'rbac.html'}>权限管理</Button>);
            if (hasPerm('files:view')) navBtns.push(<Button key="mediawin" className="nav-media-btn" icon={<UIIcon name="VideoCameraOutlined" />} type={mediaClosed ? 'default' : 'primary'}
                onClick={() => { const next = !mediaClosed; setMediaClosed(next); localStorage.setItem('media_closed', next ? '1' : '0'); }}
                title={mediaClosed ? '打开媒体展示小窗' : '关闭媒体展示小窗'}>媒体窗</Button>);

            const onlineCols = [
                { title: 'IP 地址', dataIndex: 'ip' },
                { title: '访问页面', dataIndex: 'page' },
                { title: '连接时间', dataIndex: 'since' },
                { title: '用户标识', dataIndex: 'user_agent', ellipsis: true }
            ];

            return (
                <ConfigProvider theme={{ algorithm: isDark ? darkAlgorithm : undefined, token: { colorBgLayout: isDark ? '#141414' : '#f5f5f5', colorBgContainer: isDark ? '#1f1f1f' : '#ffffff' } }}>
                    <div className={'sp-app' + (isDark ? ' dark' : '')} style={{ minHeight: '100vh', background: isDark ? '#141414' : '#f5f5f5' }}>
                        <div className={'topbar' + (isDark ? ' dark' : '')}>
                            <span className="tb-page"><UIIcon name="DashboardOutlined" />实时监控</span>
                            <Space wrap style={{ marginLeft: 'auto' }}>
                                <span style={{ display: 'inline-flex', alignItems: 'center', gap: 6 }}>
                                    <Badge status={conn === 'connected' ? 'success' : conn === 'connecting' ? 'processing' : 'error'} />
                                    <Typography.Text className="tb-status" type="secondary">{conn === 'connected' ? (lastUpd ? '已连接 · ' + lastUpd.toLocaleTimeString() : '已连接') : conn === 'connecting' ? '连接中...' : '已断开'}</Typography.Text>
                                </span>
                                {sslInfo && (
                                    <Tooltip title="SSL 证书到期详情">
                                        <Button size="small" onClick={() => setSslOpen(true)} icon={<UIIcon name="SafetyCertificateOutlined" />}
                                            style={{ color: sslInfo.days_left <= 7 ? '#ff4d4f' : sslInfo.days_left <= 30 ? '#faad14' : undefined }}>
                                            <span className="tb-text">证书 {sslInfo.days_left >= 0 ? sslInfo.days_left + ' 天' : '已过期'}</span>
                                        </Button>
                                    </Tooltip>
                                )}
                                <Tooltip title={isDark ? '浅色模式' : '深色模式'}>
                                    <Button onClick={() => setIsDark(!isDark)} icon={<UIIcon name={isDark ? 'SunOutlined' : 'MoonOutlined'} />} />
                                </Tooltip>
                                <Button danger icon={<UIIcon name="LogoutOutlined" />} onClick={onLogout}><span className="tb-text">退出</span></Button>
                            </Space>
                        </div>
                        {/* SSL 证书详情弹窗 */}
                        <Modal open={sslOpen} onCancel={() => setSslOpen(false)} footer={null}
                            title={<span><UIIcon name="SafetyCertificateOutlined" /> SSL 证书信息</span>} width={520}>
                            {sslInfo ? (
                                <>
                                    {sslInfo.days_left <= 7 && <Alert type="error" showIcon style={{ marginBottom: 12 }} message={sslInfo.days_left >= 0 ? `证书仅剩 ${sslInfo.days_left} 天到期，请立即续期！` : '证书已过期，服务将无法访问，请立即处理！'} />}
                                    {sslInfo.days_left > 7 && sslInfo.days_left <= 30 && <Alert type="warning" showIcon style={{ marginBottom: 12 }} message={`证书将于 ${sslInfo.days_left} 天后到期，建议尽快续期`} />}
                                    <Descriptions size="small" column={1} bordered items={[
                                        { key: 'domain', label: '主域名', children: sslInfo.domain },
                                        { key: 'subject', label: '证书主体', children: sslInfo.subject || '-' },
                                        { key: 'issuer', label: '颁发者', children: sslInfo.issuer || '-' },
                                        { key: 'san', label: '覆盖域名', children: (sslInfo.dns_names && sslInfo.dns_names.length ? sslInfo.dns_names.join('、') : '-') },
                                        { key: 'notbefore', label: '生效时间', children: sslInfo.not_before },
                                        { key: 'notafter', label: '到期时间', children: <span style={{ color: sslInfo.days_left <= 30 ? '#ff4d4f' : undefined, fontWeight: 600 }}>{sslInfo.not_after}</span> },
                                        { key: 'daysleft', label: '剩余天数', children: <Tag color={sslInfo.days_left <= 7 ? 'red' : sslInfo.days_left <= 30 ? 'orange' : 'green'}>{sslInfo.days_left >= 0 ? sslInfo.days_left + ' 天' : '已过期 ' + Math.abs(sslInfo.days_left) + ' 天'}</Tag> },
                                        { key: 'source', label: '检测方式', children: sslInfo.source === 'live' ? '实时握手（当前生效）' : '本地证书文件' },
                                        { key: 'checkedat', label: '检测时间', children: sslInfo.checked_at }
                                    ]} />
                                </>
                            ) : <Alert type="info" showIcon message="暂未获取到证书信息，请稍后重试" />}
                        </Modal>
                        <div className="page-wrap">
                            <div className="page-head">
                                <div className="ph-actions">
                                    <Space wrap>
                                        {navBtns}
                                    </Space>
                                </div>
                            </div>

                            <div className="mini-grid">
                                <div className="mini-stat"><div className="ms-label"><UIIcon name="ThunderboltOutlined" />CPU 使用率</div><div className="ms-value" style={{ color: '#1677ff' }}>{status ? (parseFloat(status.cpu_usage) || 0).toFixed(1) : '-'}<span className="ms-suffix">%</span></div></div>
                                <div className="mini-stat"><div className="ms-label"><UIIcon name="DatabaseOutlined" />内存使用率</div><div className="ms-value" style={{ color: '#52c41a' }}>{status ? (parseFloat(status.memory_usage) || 0).toFixed(1) : '-'}<span className="ms-suffix">%</span></div></div>
                                <div className="mini-stat"><div className="ms-label"><UIIcon name="HddOutlined" />磁盘使用率</div><div className="ms-value" style={{ color: '#faad14' }}>{status ? (parseFloat(status.disk_usage) || 0).toFixed(1) : '-'}<span className="ms-suffix">%</span></div></div>
                                <div className="mini-stat"><div className="ms-label"><UIIcon name="TeamOutlined" />在线用户</div><div className="ms-value" style={{ color: '#722ed1' }}>{onlineCount}<span className="ms-suffix">人</span></div></div>
                                <div className="mini-stat"><div className="ms-label"><UIIcon name="ClockCircleOutlined" />运行时间</div><div className="ms-value" style={{ fontSize: 20 }}>{status ? status.uptime : '-'}</div></div>
                            </div>

                            <Card size="small" style={{ marginBottom: 12 }}>
                                <Descriptions size="small" column={{ xs: 1, sm: 2, md: 4 }} items={[
                                    { key: 'host', label: '主机名', children: status?.hostname || '-' },
                                    { key: 'os', label: '操作系统', children: status?.os || '-' },
                                    { key: 'kernel', label: '内核', children: status?.kernel_version || '-' },
                                    { key: 'arch', label: '架构', children: status?.architecture || '-' },
                                    { key: 'up', label: '上传总流量', children: status?.total_upload || '-' },
                                    { key: 'down', label: '下载总流量', children: status?.total_download || '-' },
                                    { key: 'load', label: '系统负载', children: status ? (status.load1 + ' / ' + status.load5 + ' / ' + status.load15) : '-' },
                                    { key: 'net', label: '网络', children: status ? '↑' + (parseFloat(status.upload_speed) || 0).toFixed(1) + ' / ↓' + (parseFloat(status.download_speed) || 0).toFixed(1) + ' KB/s' : '-' }
                                ]} />
                            </Card>

                            {status && status.disks && status.disks.length > 0 && (
                                <Card size="small" title={<Space size={6}><UIIcon name="HddOutlined" />磁盘分区</Space>} style={{ marginBottom: 12 }}>
                                    <div className="disk-strip">
                                        {status.disks.map(d => (
                                            <div key={d.mount} className="disk-row">
                                                <span className="disk-mount" title={d.mount}>{d.mount}</span>
                                                <Progress percent={Math.min(100, Math.round(d.used_percent))} size="small"
                                                    status={d.used_percent >= 90 ? 'exception' : 'normal'} style={{ flex: 1, margin: '0 12px', minWidth: 120 }} />
                                                <span className="disk-detail">{fmtDiskSize(d.used)} / {fmtDiskSize(d.total)} · 可用 {fmtDiskSize(d.free)}</span>
                                            </div>
                                        ))}
                                    </div>
                                </Card>
                            )}

                            <div className="stat-grid">
                                <Card size="small" hoverable bordered className="chart-card" title={<Space size={6}><UIIcon name="LineChartOutlined" />网络速率</Space>}>
                                    <div ref={el => chartRefs.current.net = el} className="chart"></div>
                                </Card>
                                <Card size="small" hoverable bordered className="chart-card" title={<Space size={6}><UIIcon name="HddOutlined" />磁盘 I/O</Space>}>
                                    <div ref={el => chartRefs.current.disk = el} className="chart"></div>
                                </Card>
                                <Card size="small" hoverable bordered className="chart-card" title={<Space size={6}><UIIcon name="ThunderboltOutlined" />CPU 使用率</Space>}>
                                    <div ref={el => chartRefs.current.cpu = el} className="chart"></div>
                                </Card>
                                <Card size="small" hoverable bordered className="chart-card" title={<Space size={6}><UIIcon name="DatabaseOutlined" />内存使用率</Space>}>
                                    <div ref={el => chartRefs.current.mem = el} className="chart"></div>
                                </Card>
                            </div>

                            <div className="stat-grid" style={{ gridTemplateColumns: 'repeat(auto-fit, minmax(300px, 1fr))' }}>
                                <Card size="small" hoverable bordered title={<Space size={6}><UIIcon name="TeamOutlined" />在线用户（{onlineCount}）</Space>}>
                                    <Table size="small" rowKey={(_, i) => i} dataSource={online} columns={onlineCols}
                                        pagination={false} scroll={{ y: 240, x: 'max-content' }} />
                                </Card>
                            </div>

                            <Alert type="info" showIcon style={{ marginTop: 12 }}
                                message={conn !== 'connected' ? '⚠️ WebSocket 连接已断开，正在自动重连，图表暂停更新' : '✅ 实时数据推送中，每 1 秒更新一次'} />
                        </div>
                        <MediaWindow closed={mediaClosed} onClose={() => { setMediaClosed(true); localStorage.setItem('media_closed', '1'); }} />
                    </div>
                </ConfigProvider>
            );
        }

        function MediaWindow({ closed, onClose }) {
            const [src, setSrc] = useState(null);
            const [playing, setPlaying] = useState(true);
            const [isFs, setIsFs] = useState(false);
            const [volume, setVolume] = useState(() => {
                const v = parseFloat(localStorage.getItem('media_volume'));
                return isFinite(v) && v >= 0 && v <= 1 ? v : 0.5;
            });
            const [muted, setMuted] = useState(() => localStorage.getItem('media_sound') !== 'on');
            const videoRef = useRef(null);
            const rootRef = useRef(null);
            const fsFallbackRef = useRef(false);
            const dragRef = useRef(null);
            const posRef = useRef(null);
            const [pos, setPos] = useState(() => {
                try {
                    const p = JSON.parse(localStorage.getItem('media_pos') || 'null');
                    if (p && isFinite(p.x) && isFinite(p.y)) return p;
                } catch (e) { }
                return null;
            });
            const isVideo = src && /\.(mp4|webm|mov)(\?|$)/i.test(src);
            const fixSrc = (u) => {
                try {
                    const p = new URL(u);
                    p.hostname = window.location.hostname;
                    return p.toString();
                } catch (e) { return u; }
            };

            const load = useCallback(() => {
                secureFetch(baseUrl + '/random-media')
                    .then(r => r.json())
                    .then(d => { if (d && d.src) { setSrc(fixSrc(d.src)); setPlaying(true); setMuted(localStorage.getItem('media_sound') !== 'on'); } })
                    .catch(() => { });
            }, []);
            useEffect(() => {
                if (closed) return; // 关闭后停止拉取与轮播
                load();
                const t = setInterval(load, 80000);
                return () => clearInterval(t);
            }, [load, closed]);
            useEffect(() => {
                const v = videoRef.current;
                if (!v) return;
                v.muted = muted;
                v.volume = volume;
                if (playing) v.play().catch(() => { });
                else v.pause();
            }, [src, playing, volume, muted]);
            useEffect(() => { localStorage.setItem('media_sound', muted ? 'off' : 'on'); }, [muted]);
            useEffect(() => { localStorage.setItem('media_volume', String(volume)); }, [volume]);
            useEffect(() => {
                const h = () => setIsFs(!!document.fullscreenElement);
                document.addEventListener('fullscreenchange', h);
                return () => document.removeEventListener('fullscreenchange', h);
            }, []);
            // 全屏：优先标准 Fullscreen API；iPhone Safari 不支持元素全屏，
            // 视频走原生播放器（webkitEnterFullscreen），其余用 CSS 伪全屏兜底
            const toggleFs = () => {
                const root = rootRef.current;
                if (!root) return;
                if (document.fullscreenElement) { document.exitFullscreen(); return; }
                if (fsFallbackRef.current) { fsFallbackRef.current = false; setIsFs(false); return; }
                if (typeof root.requestFullscreen === 'function') {
                    root.requestFullscreen()
                        .then(() => setIsFs(true))
                        .catch(() => { fsFallbackRef.current = true; setIsFs(true); });
                    return;
                }
                const v = videoRef.current;
                if (isVideo && v && typeof v.webkitEnterFullscreen === 'function') {
                    v.webkitEnterFullscreen();
                    return;
                }
                fsFallbackRef.current = true;
                setIsFs(true);
            };

            // 拖动换位置：按住标题栏拖到任意位置（触屏同样支持），位置写入 localStorage 记住；双击标题栏复位
            const clampPos = (p) => {
                const w = rootRef.current ? rootRef.current.offsetWidth : 380;
                return {
                    x: Math.min(Math.max(p.x, 60 - w), window.innerWidth - 60),
                    y: Math.min(Math.max(p.y, 0), window.innerHeight - 44)
                };
            };
            useEffect(() => {
                if (!pos) return;
                const c = clampPos(pos);
                if (c.x !== pos.x || c.y !== pos.y) setPos(c); // 视口变化时拉回可见范围
            }, []);
            const onHeadDown = (e) => {
                if (isFs || (e.target.closest && e.target.closest('.ant-btn, .ant-slider'))) return;
                const root = rootRef.current;
                if (!root) return;
                const rect = root.getBoundingClientRect();
                dragRef.current = { dx: e.clientX - rect.left, dy: e.clientY - rect.top };
                root.style.transition = 'none';
                const p = clampPos({ x: rect.left, y: rect.top });
                posRef.current = p; setPos(p);
                if (e.currentTarget.setPointerCapture) { try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) { } }
            };
            const onHeadMove = (e) => {
                if (!dragRef.current) return;
                const p = clampPos({ x: e.clientX - dragRef.current.dx, y: e.clientY - dragRef.current.dy });
                posRef.current = p; setPos(p);
            };
            const onHeadUp = () => {
                if (!dragRef.current) return;
                dragRef.current = null;
                if (rootRef.current) rootRef.current.style.transition = '';
                if (posRef.current) localStorage.setItem('media_pos', JSON.stringify(posRef.current));
            };
            const resetPos = () => { setPos(null); posRef.current = null; localStorage.removeItem('media_pos'); };

            if (closed) return null;

            return (
                <div ref={rootRef} className={'media-window' + (isFs ? ' fs-on' : '')}
                    style={pos ? { left: pos.x, top: pos.y, right: 'auto', bottom: 'auto' } : undefined}>
                    <div className="media-head"
                        onPointerDown={onHeadDown} onPointerMove={onHeadMove}
                        onPointerUp={onHeadUp} onPointerCancel={onHeadUp}
                        onDoubleClick={resetPos}
                        title="按住拖动换位置 · 双击复位">
                        <span className="m-title"><UIIcon name="VideoCameraOutlined" /> 媒体展示</span>
                        {isVideo && <window.antd.Slider min={0} max={1} step={0.05} value={volume}
                            onChange={v => { setVolume(v); setMuted(v === 0); }}
                            style={{ width: 70, margin: 0 }} tooltip={{ open: false }} />}
                        {isVideo && <window.antd.Button size="small" type="text"
                            onClick={() => {
                                const nextMuted = !muted;
                                const v = videoRef.current;
                                if (!nextMuted && v) {
                                    const vol = volume > 0 ? volume : 0.5;
                                    setVolume(vol);
                                    v.muted = false;
                                    v.volume = vol;
                                    v.play().catch(() => { });
                                } else if (nextMuted && v) {
                                    v.muted = true;
                                }
                                setMuted(nextMuted);
                            }}
                            title={muted ? '取消静音' : '静音'}><UIIcon name={muted ? 'SoundFilled' : 'SoundOutlined'} /></window.antd.Button>}
                        <window.antd.Button size="small" type="text" onClick={load} title="换一个"><UIIcon name="ReloadOutlined" /></window.antd.Button>
                        {isVideo && <window.antd.Button size="small" type="text"
                            onClick={() => setPlaying(!playing)} title={playing ? '暂停' : '播放'}><UIIcon name={playing ? 'PauseOutlined' : 'CaretRightOutlined'} /></window.antd.Button>}
                        <window.antd.Button size="small" type="text" onClick={toggleFs}
                            title={isFs ? '退出全屏' : '全屏'}><UIIcon name={isFs ? 'FullscreenExitOutlined' : 'FullscreenOutlined'} /></window.antd.Button>
                        <window.antd.Button size="small" type="text" onClick={onClose}
                            title="关闭（不再自动播放）"><UIIcon name="CloseOutlined" /></window.antd.Button>
                    </div>
                    <div className="media-body" onClick={() => isVideo && setPlaying(!playing)}>
                        {!src ? <span className="placeholder">加载媒体中...</span>
                            : isVideo
                                ? <video ref={videoRef} src={src} muted={muted} playsInline loop autoPlay />
                                : <img src={src} alt="media" />}
                    </div>
                </div>
            );
        }

        function App() {
            const [user, setUser] = useState(null);
            const [checking, setChecking] = useState(true);
            useEffect(() => {
                secureFetch(baseUrl + '/check-auth')
                    .then(r => r.json())
                    .then(d => { setUser(d.code === 200 ? d.user : null); setChecking(false); })
                    .catch(() => setChecking(false));
            }, []);
            if (checking) {
                return <div style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center' }}><Card loading style={{ width: 320 }} /></div>;
            }
            if (!user) return <Login onLogin={setUser} />;
            return <Dashboard key={user.username} user={user} onLogout={() => {
                secureFetch(baseUrl + '/logout', { method: 'POST' }).finally(() => { SessionManager.clear(); setUser(null); });
            }} />;
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
    <script>
        (function () {
            function getCsrfToken() { var m = document.cookie.match(/(?:^|; )csrf_token=([^;]*)/); return m ? decodeURIComponent(m[1]) : ''; }
            function openPrivateSpace() {
                try {
                    fetch('/api/private/entry', { method: 'POST', headers: { 'X-CSRF-Token': getCsrfToken() }, credentials: 'include' })
                        .then(function (r) { if (r.ok) window.location.href = 'private.html'; })
                        .catch(function () { });
                } catch (e) { window.location.href = 'private.html'; }
            }
            var taps = [], lastTap = 0;
            document.addEventListener('keydown', function (e) {
                if (e.ctrlKey && e.shiftKey && e.altKey && (e.key === 'N' || e.key === 'n')) {
                    e.preventDefault();
                    openPrivateSpace();
                }
            });
            // 顶部栏 logo/文字已移除，改为连点顶栏空白区域 5 次触发私有空间入口
            document.addEventListener('click', function (e) {
                var el = e.target;
                // 忽略按钮/链接上的点击，避免误触发
                while (el && el !== document.documentElement) {
                    if (el.tagName === 'BUTTON' || el.tagName === 'A') return;
                    el = el.parentElement;
                }
                if (!e.target.closest || !e.target.closest('.topbar')) return;
                var now = Date.now();
                if (now - lastTap > 3000) taps = [];
                lastTap = now;
                taps.push(now);
                if (taps.length >= 5) { taps = []; openPrivateSpace(); }
            });
        })();
    </script>
</body>

</html>
