name: Build Go Multi-Platform

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

env:
  BINARY_NAME: secure-download-server
  BUILD_VERSION: ${{ github.ref_name }}
  GO_VERSION: '1.24.0'

# Windows runner 的 run 步骤默认是 PowerShell，无法执行 GOOS=x go build 等 POSIX 语法，统一改用 bash
defaults:
  run:
    shell: bash

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}

      # 测试会把数据/日志写入数据根目录；runner 上用仓库内临时目录承载
      # （SERVER_STATUS_HOME 覆盖默认的 /opt/server-status，runner 用户无权创建）
      - name: Prepare writable runtime dir
        run: mkdir -p runtime

      - name: Run tests
        env:
          SERVER_STATUS_HOME: ${{ github.workspace }}/runtime
        run: |
          go test ./... -v

      - name: Run security audit
        run: |
          go mod download
          go list -json -m all | go run golang.org/x/vuln/cmd/govulncheck@latest -json ./...

  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-amd64
            goos: linux
            goarch: amd64
          - os: ubuntu-latest
            target: linux-arm64
            goos: linux
            goarch: arm64
          - os: windows-latest
            target: windows-amd64
            goos: windows
            goarch: amd64
            ext: .exe
          - os: macos-latest
            target: darwin-amd64
            goos: darwin
            goarch: amd64
          - os: macos-latest
            target: darwin-arm64
            goos: darwin
            goarch: arm64

    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build binary
        run: |
          mkdir -p dist
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 go build \
            -ldflags="-w -s -X main.version=${{ env.BUILD_VERSION }} -X main.commit=${{ github.sha }} -X main.buildDate=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            -o dist/${{ env.BINARY_NAME }}${{ matrix.ext || '' }} \
            .

      - name: Create checksum
        run: |
          cd dist
          # macOS 只有 shasum，Linux/Windows(Git Bash) 只有 sha256sum，做兼容回退
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum ${{ env.BINARY_NAME }}${{ matrix.ext || '' }} > ${{ env.BINARY_NAME }}-${{ matrix.target }}-${{ env.BUILD_VERSION }}.sha256
          else
            shasum -a 256 ${{ env.BINARY_NAME }}${{ matrix.ext || '' }} > ${{ env.BINARY_NAME }}-${{ matrix.target }}-${{ env.BUILD_VERSION }}.sha256
          fi

      - name: Create archive
        run: |
          cd dist
          if [ "${{ matrix.goos }}" = "windows" ]; then
            7z a ${{ env.BINARY_NAME }}-${{ matrix.target }}-${{ env.BUILD_VERSION }}.zip ${{ env.BINARY_NAME }}${{ matrix.ext || '' }} *.sha256
          else
            tar czf ${{ env.BINARY_NAME }}-${{ matrix.target }}-${{ env.BUILD_VERSION }}.tar.gz ${{ env.BINARY_NAME }}${{ matrix.ext || '' }} *.sha256
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BINARY_NAME }}-${{ matrix.target }}
          path: dist/${{ env.BINARY_NAME }}-${{ matrix.target }}-${{ env.BUILD_VERSION }}.*

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # 生成发布说明需要跨 tag 的完整提交历史
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts/

      # 自动说明（generate_release_notes）只收集 PR；直接推 master 的提交不会出现，
      # 这里按 feat/fix 分组生成提交列表，GitHub 会把它拼在自动说明前面。
      - name: Generate release notes from commits
        id: notes
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          RANGE="${PREV_TAG:+${PREV_TAG}..}${GITHUB_REF_NAME}"
          echo "release notes range: $RANGE"
          LOG=$(git log --no-merges --pretty=format:"- %s (%h)" "$RANGE")
          # 提交类型带 scope（如 feat(private):）时同样归组：按前缀匹配，subject 前缀整体剥掉
          FEATS=$(echo "$LOG" | grep "^- feat" | sed 's/^- feat[^:]*: /- /' || true)
          FIXES=$(echo "$LOG" | grep "^- fix" | sed 's/^- fix[^:]*: /- /' || true)
          OTHERS=$(echo "$LOG" | grep -v -e "^- feat" -e "^- fix" || true)
          {
            echo "body<<__NOTES_EOF__"
            echo "## What's Changed"
            echo
            if [ -n "$FEATS" ]; then echo "### ✨ 新功能"; echo "$FEATS"; echo; fi
            if [ -n "$FIXES" ]; then echo "### 🐛 问题修复"; echo "$FIXES"; echo; fi
            if [ -n "$OTHERS" ]; then echo "### 🔧 其他变更"; echo "$OTHERS"; echo; fi
            echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${GITHUB_REF_NAME}"
            echo "__NOTES_EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
            artifacts/**/*.sha256
          body: ${{ steps.notes.outputs.body }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}